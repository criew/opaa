[versions]
spring-boot = "4.1.0"
spring-dependency-management = "1.1.7"
spring-ai = "2.0.0"
spotless = "8.9.0"
caffeine = "3.2.4"
openapi-generator = "7.24.0"
# Tokenizer used by Spring AI's TokenTextSplitter (CL100K_BASE). Referenced directly by
# io.opaa.indexing.OverlappingTokenTextSplitter, so it is declared explicitly instead of being
# relied on transitively. Must stay in sync with the version spring-ai-commons resolves to,
# otherwise chunk size and chunk overlap would be counted in different tokenizations.
jtokkit = "1.1.0"
# HTML parser used directly by io.opaa.indexing.RssFeedIndexingExecutor/AttachmentProfile to read
# detail pages and their linked attachments (#467, #468). Previously reached the classpath only
# transitively via spring-ai-tika-document-reader, so a Spring AI version bump could have silently
# dropped it - now declared explicitly, version pinned to what that transitive dependency resolves
# to today (`./gradlew dependencies`).
jsoup = "1.22.2"
# Magic-byte content detection for the upload endpoint (#435, io.opaa.library.LibraryDocumentService
# / io.opaa.indexing.SupportedDocumentFormats#contentMatchesExtension). Already on the classpath
# transitively via spring-ai-tika-document-reader; declared explicitly because io.opaa now calls
# org.apache.tika.Tika directly rather than only through Spring AI's TikaDocumentReader.
tika-core = "3.3.2"
# Parses the OpenAPI spec directly in opaa-api's parity tests (issue #896) - no Spring
# dependency needed for that, so a lightweight YAML parser instead of pulling in a
# spec-validation library.
snakeyaml = "2.5"
# JDBC binding for the pgvector column type (com.pgvector.PGvector), used directly by
# io.opaa.query.ChunkEmbeddingLookup to read a chunk's stored embedding back for MMR (#914).
# Already on the classpath transitively via spring-ai-pgvector-store; declared explicitly because
# this module's own code now imports it directly rather than only through Spring AI's PgVectorStore.
# Version pinned to what that transitive dependency resolves to today (`./gradlew dependencies`).
pgvector = "0.1.6"
# opaa-api's tests are deliberately Spring-free (issue #896) and use plain JUnit Jupiter/AssertJ
# instead of the Spring Boot-managed test-deps bundle below - these two versions are therefore
# pinned explicitly rather than inherited from the Spring Boot BOM. The module's main sourceSet is
# not Spring-free, though: the generated io.opaa.api.dto classes (spring generator) import
# org.springframework.lang.Nullable/DateTimeFormat plus Jackson/Jakarta annotation types - see the
# spring-boot-dependencies platform import in opaa-api/build.gradle.kts for how those versions
# stay aligned with the Spring Boot BOM instead of being pinned here.
junit-jupiter = "5.13.4"
assertj-core = "3.27.6"
junit-platform = "1.13.4"

[libraries]
# Spring Boot starters (versions managed by Spring Boot BOM)
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
# Spring Boot 4 splits the test slices into dedicated starters (@WebMvcTest)
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }

# Spring AI (versions managed by Spring AI BOM)
spring-ai-vector-store-advisor = { module = "org.springframework.ai:spring-ai-vector-store-advisor" }
spring-ai-starter-model-openai = { module = "org.springframework.ai:spring-ai-starter-model-openai" }
# #762: io.opaa.api.GlobalExceptionHandler catches org.springframework.ai.retry.{Transient,NonTransient}AiException
# directly. spring-ai-starter-model-openai only pulls in spring-ai-autoconfigure-retry (the
# autoconfiguration, not the exception classes themselves) - the now-removed
# spring-ai-starter-model-ollama used to bring this module in transitively, so it must be declared
# explicitly now.
spring-ai-retry = { module = "org.springframework.ai:spring-ai-retry" }
spring-ai-starter-vector-store-pgvector = { module = "org.springframework.ai:spring-ai-starter-vector-store-pgvector" }
spring-ai-tika-document-reader = { module = "org.springframework.ai:spring-ai-tika-document-reader" }
spring-ai-spring-boot-testcontainers = { module = "org.springframework.ai:spring-ai-spring-boot-testcontainers" }
jtokkit = { module = "com.knuddels:jtokkit", version.ref = "jtokkit" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
tika-core = { module = "org.apache.tika:tika-core", version.ref = "tika-core" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
pgvector = { module = "com.pgvector:pgvector", version.ref = "pgvector" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit-jupiter" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj-core" }
opaa-api-junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }
# Version-less: constrained by the spring-boot-dependencies platform import in
# opaa-api/build.gradle.kts, same mechanism backend/build.gradle.kts uses via the
# io.spring.dependency-management plugin for the spring-boot-starter-* entries above.
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations" }
spring-core = { module = "org.springframework:spring-core" }
spring-context = { module = "org.springframework:spring-context" }
jakarta-validation-api = { module = "jakarta.validation:jakarta.validation-api" }
jakarta-annotation-api = { module = "jakarta.annotation:jakarta.annotation-api" }

# Infrastructure (versions managed by Spring Boot BOM)
# Spring Boot 4 moved the Liquibase auto-configuration into its own starter module
spring-boot-starter-liquibase = { module = "org.springframework.boot:spring-boot-starter-liquibase" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
postgresql = { module = "org.postgresql:postgresql" }

# Security
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }

# Testing (versions managed by Spring Boot BOM)
# Spring Boot 4 ships the security test slice support as its own starter
spring-boot-starter-security-test = { module = "org.springframework.boot:spring-boot-starter-security-test" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-ollama = { module = "org.testcontainers:testcontainers-ollama" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
awaitility = { module = "org.awaitility:awaitility" }

[bundles]
spring-boot = [
    "spring-boot-starter-actuator",
    "spring-boot-starter-data-jpa",
    "spring-boot-starter-web",
    "spring-boot-starter-validation",
    "spring-boot-starter-security",
    "spring-boot-starter-oauth2-resource-server",
]
spring-ai = [
    "spring-ai-vector-store-advisor",
    "spring-ai-starter-model-openai",
    "spring-ai-starter-vector-store-pgvector",
    "spring-ai-tika-document-reader",
    "spring-ai-retry",
]
runtime = ["micrometer-registry-prometheus", "postgresql"]
test-deps = [
    "spring-boot-starter-test",
    "spring-boot-starter-webmvc-test",
    "spring-boot-starter-security-test",
    "spring-boot-testcontainers",
    "spring-ai-spring-boot-testcontainers",
    "testcontainers-junit-jupiter",
    "testcontainers-ollama",
    "testcontainers-postgresql",
    "awaitility",
]
test-runtime-deps = ["junit-platform-launcher"]
opaa-api-test-deps = ["junit-jupiter", "assertj-core", "snakeyaml"]
opaa-api-generated-dto-deps = [
    "jackson-annotations",
    "spring-core",
    "spring-context",
    "jakarta-validation-api",
    "jakarta-annotation-api",
]

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
openapi-generator = { id = "org.openapi.generator", version.ref = "openapi-generator" }
