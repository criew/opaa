# Fixtures for LockTimeoutMigrationTest: the same ALTER TABLE with and without a lock_timeout.
databaseChangeLog:
  - changeSet:
      id: add-column-with-lock-timeout
      author: opaa
      labels: with-lock-timeout
      changes:
        - sql:
            sql: |
              SET LOCAL lock_timeout = '1s';
              ALTER TABLE lock_fixture ADD COLUMN added text;
  - changeSet:
      id: add-column-without-lock-timeout
      author: opaa
      labels: without-lock-timeout
      changes:
        - sql:
            sql: ALTER TABLE lock_fixture ADD COLUMN added text;
