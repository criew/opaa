# Starting point for the fixture chain used by io.opaa.migration delta tests. It has survived both
# baseline consolidations unchanged in shape: #904 replaced the 18 historical
# test-master-through-0NN.yaml files with this single one, and #1492 folded the 32 changelog files
# written since then back into the same baseline file it references. A future changeset's own delta
# test names this file as its baseFixtureChangelogPath() - not a new
# test-master-through-baseline-plus-NNN.yaml per changeset; only a changeset several other
# changesets already depend on earns its own fixture file, exactly as the pre-#904 chain did.
databaseChangeLog:
  - include:
      file: db/changelog/changes/001-baseline.yaml
