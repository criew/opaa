# The expected outcome of every operation of the OpenAPI specification for every role. Rules:
# backend/AGENTS.md, "Rechte-Matrix". Checked by PermissionMatrixTest (every operation has exactly
# one complete entry - runs without Docker), PermissionMatrixIntegrationTest (every role but
# anonymous, the foreign ids, the lists and the search) and PermissionMatrixAnonymousIntegrationTest
# (anonymous). The outcomes each run observed land in backend/build/permission-matrix/ in this
# file's spelling, each with its status class and status as a comment.
#
# Roles - one column each, every column is required:
#   systemAdmin  dev-admin: system role SYSTEM_ADMIN, no member of the fixture space
#   auditor      dev-user: system role AUDITOR ("Revision"), no member of the fixture space
#   spaceAdmin   dev-user: space role ADMIN, MANAGER on the space's libraries
#   curator      dev-user: space role CURATOR, EDITOR on the space's libraries
#   member       dev-user: space role MEMBER, VIEWER on the space's libraries
#   noRights     dev-user: system role USER, no member of the fixture space, no grant
#   anonymous    no credential at all (oidc mode)
# The fixture space belongs to a third person and holds her knowledge library (a folder, a document
# with a chunk, a selection field with one value), her prompt library with a prompt, a chat of the
# dev user while she is a member (else the owner's) and a chat of a colleague, each with a note
# item. Beside it stand a group with a steward and a grant, the owner's and the colleague's
# accounts, and - written per request and rolled back - a notification and an access token of the
# caller, an audit incident scope, a diagnostic context event and a connection profile.
#
# Outcomes: 401, 403 and 404 as answered; "allowed" for every other status below 500 - a 2xx as
# much as a 400, 409 or 422, which all got past the authorization. A 5xx fails the run, except a
# 503 in a row whose note explains it. Every request is well-formed by the specification (required
# parameters and properties filled with their first enum value, their example or a value their
# schema admits, ids of the fixture by their name). A row refusing every signed-in role alike tells
# nothing by itself and needs a note saying why; so does a probe every signed-in role meets with the
# same 400, 409 or 422, which is refused before any right is asked and fails the run otherwise.
#
# Foreign ids - each must answer 401, 403 or 404, never more:
#   - every operation naming an object of a space, a person or an organization in its path is
#     called with the ids of a foreign space by its spaceAdmin, and with the ids of a foreign
#     organization by its systemAdmin and its auditor; "foreign: allowed" excepts an operation;
#   - every operation naming two or more such objects is called by the spaceAdmin with her own ids
#     and one foreign child at a time; "foreignChild: [name]" excepts that parameter;
#   - every chat operation is called by each space role with a colleague's chat.
# An exception needs a note saying why. The account without rights must not find the space's
# objects in listSpaces, listLibraries, listCatalog, searchKnowledge and the other lists checked;
# the administration and the auditor find nothing of a foreign organization there nor in the
# organization-wide lists (tokens, groups, users, accounts).
#
# Limit: the matrix checks statuses. What an allowed answer contains is checked only for those lists
# and the search; field filters elsewhere stay with the tests of their feature.
#
# A changed outcome is a decision, not a refresh: an outcome turning "allowed" for a weaker role is
# reviewed as a widening of rights.

