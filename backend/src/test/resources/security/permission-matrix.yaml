# The expected outcome of every operation of the OpenAPI specification for every role. Rules:
# backend/AGENTS.md, "Rechte-Matrix". Checked by PermissionMatrixTest (every operation has exactly
# one complete entry - runs without Docker), PermissionMatrixIntegrationTest (every role but
# anonymous, and the foreign ids) and PermissionMatrixAnonymousIntegrationTest (anonymous). The
# outcomes each run observed land in backend/build/permission-matrix/ in this file's spelling.
#
# Roles - one column each, every column is required:
#   systemAdmin  dev-admin: system role SYSTEM_ADMIN, no member of the fixture space
#   auditor      dev-user: system role AUDITOR ("Revision"), no member of the fixture space
#   spaceAdmin   dev-user: space role ADMIN in the fixture space
#   editor       dev-user: space role CURATOR in the fixture space
#   viewer       dev-user: space role MEMBER in the fixture space
#   noRights     dev-user: system role USER, no member of the fixture space
#   anonymous    no credential at all (oidc mode)
# The fixture space belongs to a third person and holds her knowledge library (with a folder) and
# her prompt library (with a prompt) and a chat - the dev user's own while she is a member, else the
# owner's. A group, the owner's account and a second account of the organization stand beside it.
#
# Outcomes: 401, 403 and 404 as answered; "allowed" for every other status - a 2xx as much as a 400,
# 409, 422 or 503, which all got past the authorization. Every request is well-formed by the
# specification (required parameters and properties filled, ids of the fixture by their name), so
# that the authorization answers and not the request validation. An id the fixture does not provide
# (providers, models, documents, notifications, tokens, ...) is one nobody uses: a role that may act
# there meets 404, a role that may not usually 403 before.
#
# Foreign ids: every operation that names an object of a space or an organization in its path
# (spaceId, libraryId, assetId, chatId, folderId, grantId, promptLibraryId, promptId; for the
# organization also groupId, userId, id) is called again with the ids of a foreign space by its
# spaceAdmin and with the ids of a foreign organization by its systemAdmin. It must answer 401, 403
# or 404, never more; "foreign: allowed" excepts an operation and needs a note saying why.
#
# A changed outcome is a decision, not a refresh: an outcome turning "allowed" for a weaker role is
# reviewed as a widening of rights.

