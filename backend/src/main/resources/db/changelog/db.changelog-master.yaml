databaseChangeLog:
  # Baseline: the whole schema as one file with one changeSet per logical module (foundation,
  # identity, rights, knowledge, connectors, workspace, assistant, external - in dependency order),
  # plus the two precondition-guarded vector_store index changeSets, which must stay separate.
  # An installation built from an earlier baseline cannot be migrated; it is set up anew.
  # Every new schema change is its own changeset with its own delta test under io.opaa.migration.
  - include:
      file: db/changelog/changes/001-baseline.yaml
