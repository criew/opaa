databaseChangeLog:
  # Baseline = Stand 09/2026 (#1492): the second and, like the first (#904), deliberately one-time
  # consolidation of the Liquibase history before production use - 56 changesets from 33 files
  # folded into changes/001-baseline.yaml. It is grouped into a handful of changeSets by schema
  # area (extensions, organizations/users/identity providers, spaces/groups, libraries/folders/
  # grants, documents, indexing runs/source state, full-text index, metadata schema, chat/model
  # catalogue, audit/permission history, diagnostics, notifications/branding, seed data) rather
  # than left as one monster changeset, so a failure during apply points at a schema area. The two
  # trailing changeSets are the precondition-guarded vector_store expression indexes, which must
  # stay separate: a precondition on a group changeSet would skip that whole group. Every
  # installation this ran against had to be rebuilt from scratch (DATABASECHANGELOG no longer
  # matches), which is only acceptable before real production data exists. From here on, one
  # changeset per schema change again, each with its own delta test under io.opaa.migration (see
  # AbstractMigrationTest's Javadoc and test-master-through-baseline.yaml).
  - include:
      file: db/changelog/changes/001-baseline.yaml
  - include:
      file: db/changelog/changes/002-documents-parent-composite-foreign-key.yaml
  - include:
      file: db/changelog/changes/003-diagnostic-impersonation-grant-delete-rules.yaml
  # Kontoschema der lokalen Benutzerverwaltung (#1532, ADR-0033 Entscheidungen 3 und 4). Der
  # Epic-Stapel war auf 003 geschnitten; 003 ist auf main inzwischen belegt, deshalb beginnt der
  # Block bei 004 (#1543).
  - include:
      file: db/changelog/changes/004-add-provider-type-to-oidc-providers.yaml
  - include:
      file: db/changelog/changes/005-add-local-email-unique-index-to-users.yaml
  - include:
      file: db/changelog/changes/006-create-local-credentials.yaml
  - include:
      file: db/changelog/changes/007-create-local-refresh-tokens.yaml
  - include:
      file: db/changelog/changes/008-create-local-revoked-tokens.yaml
  - include:
      file: db/changelog/changes/009-create-local-action-tokens.yaml
  - include:
