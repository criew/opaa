databaseChangeLog:
  # Baseline = Stand 08/2026 (#904): OPAA was still pre-production, so the 134 changesets
  # accumulated across 67 files were consolidated into changes/001-baseline.yaml, grouped into a
  # handful of changeSets by schema area (extensions, auth, spaces/groups, libraries/documents,
  # chat, audit/permission-history, notifications/branding, seed data) rather than left as one
  # monster changeset - a failure during apply then points at a schema area, not an undifferentiated
  # 134-step history. This was a deliberate, one-time consolidation, not a pattern to repeat: every
  # installation this ran against had to be rebuilt from scratch (DATABASECHANGELOG no longer
  # matches), which is only acceptable before real production data exists. From here on, one
  # changeset per schema change again, each with its own delta test under io.opaa.migration (see
  # AbstractMigrationTest's Javadoc and test-master-through-baseline.yaml).
  - include:
      file: db/changelog/changes/001-baseline.yaml
  - include:
      file: db/changelog/changes/002-documents-indexed-chunk-count-index.yaml
  - include:
