databaseChangeLog:
  - changeSet:
      id: knowledge-2026-10-11-llm-model-temperature-optional
      author: opaa
      comment: "The temperature of a managed chat model is optional (no value: the parameter is not sent, some models reject it); max_tokens defaults to 8000 for models with internal reasoning. Stored values unchanged."
      changes:
        - sql:
            sql: |
              ALTER TABLE llm_models ALTER COLUMN temperature DROP NOT NULL;
              ALTER TABLE llm_models ALTER COLUMN temperature DROP DEFAULT;
              ALTER TABLE llm_models ALTER COLUMN max_tokens SET DEFAULT 8000;
