databaseChangeLog:
  - changeSet:
      id: knowledge-2026-10-20-run-ownership
      author: opaa
      comment: "The instance that owns a running indexing job, a pending upload and the re-embedding worker (ADR-0053, Entscheidung 8): the recovery gives up only what belongs to an instance the register counts as dead. NULL, as in every row written before, names no owner. Additive: three nullable columns without default."
      changes:
        - sql:
            sql: |
              SET LOCAL lock_timeout = '5s';
              ALTER TABLE indexing_jobs ADD COLUMN owner_instance_id uuid;
              ALTER TABLE documents ADD COLUMN processing_instance_id uuid;
              ALTER TABLE embedding_index ADD COLUMN run_owner_instance_id uuid;
  - changeSet:
      id: knowledge-2026-10-20-run-ownership--pending-documents
      author: opaa
      comment: "The pending documents by the instance processing them, for the periodic upload recovery; it holds only the few rows still PENDING. Additive: a new partial, non-unique index."
      changes:
        - sql:
            sql: |
              SET LOCAL lock_timeout = '5s';
              CREATE INDEX idx_documents_pending_instance ON documents USING btree (processing_instance_id) WHERE ((status)::text = 'PENDING'::text);
