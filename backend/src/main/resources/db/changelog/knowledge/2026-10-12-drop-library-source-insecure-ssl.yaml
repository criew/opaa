databaseChangeLog:
  - changeSet:
      id: knowledge-2026-10-12-drop-library-source-insecure-ssl
      author: opaa
      comment: "The certificate of a source is always checked: a library carries no switch to skip it. Dropping source_insecure_ssl would drop chk_knowledge_libraries_upload_without_source with it, so the check is recreated without the column."
      changes:
        - sql:
            sql: |
              ALTER TABLE knowledge_libraries DROP CONSTRAINT chk_knowledge_libraries_upload_without_source;
              ALTER TABLE knowledge_libraries DROP COLUMN source_insecure_ssl;
              ALTER TABLE knowledge_libraries ADD CONSTRAINT chk_knowledge_libraries_upload_without_source CHECK ((((source_type)::text <> 'UPLOAD'::text) OR ((source_path IS NULL) AND (source_url IS NULL) AND (source_credentials IS NULL) AND (source_settings IS NULL))));
