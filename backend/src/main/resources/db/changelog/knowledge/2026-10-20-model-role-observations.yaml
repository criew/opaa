databaseChangeLog:
  - changeSet:
      id: knowledge-2026-10-20-model-role-observations
      author: opaa
      comment: "The last known state of the rerank and the transcription role (ADR-0053, Entscheidung 12): written by the instance that probes or calls the endpoint, read by every instance, so a query decides on reranking the same way whichever instance answers it. A change of the state is announced on the invalidation bus; a probe that only renews observed_at is not. Additive: a new table."
      changes:
        - sql:
            sql: |
              SET LOCAL lock_timeout = '5s';
              CREATE TABLE model_role_observations (
                  role character varying(32) NOT NULL,
                  base_url text NOT NULL,
                  model text NOT NULL,
                  reachable boolean NOT NULL,
                  timed_out boolean NOT NULL,
                  diagnostic text,
                  observed_at timestamp with time zone NOT NULL,
                  CONSTRAINT model_role_observations_pkey PRIMARY KEY (role)
              );
              CREATE TRIGGER trg_model_role_observations_invalidation
                  AFTER INSERT OR UPDATE OR DELETE ON model_role_observations
                  FOR EACH ROW EXECUTE FUNCTION notify_cache_invalidation(
                      'model-role-observations', 'observed_at');
