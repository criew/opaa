databaseChangeLog:
  - changeSet:
      id: knowledge-2026-10-11-source-values-text
      author: opaa
      comment: "source_container_key and file_name hold what a source states, whatever its length (an S3 prefix of up to 1024 characters, a Dropbox folder path, a file or attachment name): text instead of varchar(255)/varchar(500), stored values unchanged. Neither column is indexed. file_path stays the identity at its width; the ingest rejects a longer one."
      changes:
        - sql:
            sql: |
              ALTER TABLE documents ALTER COLUMN source_container_key TYPE text;
              ALTER TABLE documents ALTER COLUMN file_name TYPE text;
  - changeSet:
      id: knowledge-2026-10-11-source-values-text--revisits
      author: opaa
      comment: "source_sync_revisits.container_key takes the source_container_key of a deleted document: text like that column."
      changes:
        - sql:
            sql: |
              ALTER TABLE source_sync_revisits ALTER COLUMN container_key TYPE text;
