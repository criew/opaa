databaseChangeLog:
  - changeSet:
      id: knowledge-2026-10-10-source-sync-quota-held
      author: opaa
      comment: "Whether the full sync in progress left an item behind at a storage quota, in any of its runs; its completion then leaves the next run a full sync. NULL, as in every state written before, counts as no."
      changes:
        - sql:
            sql: |
              ALTER TABLE source_sync_state ADD COLUMN full_sync_quota_held boolean;
