databaseChangeLog:
  - changeSet:
      id: knowledge-2026-10-20-library-schedule-booking
      author: opaa
      comment: "The due time a library's schedule last booked and the cron it was booked under (ADR-0053, Entscheidung 7): a conditional UPDATE books every due time once, whichever instance ticks. Additive: two nullable columns without default."
      changes:
        - sql:
            sql: |
              SET LOCAL lock_timeout = '5s';
              ALTER TABLE knowledge_libraries
                  ADD COLUMN schedule_booked_at timestamp with time zone,
                  ADD COLUMN schedule_booked_cron character varying(100);
