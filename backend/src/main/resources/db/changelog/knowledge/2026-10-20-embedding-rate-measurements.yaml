databaseChangeLog:
  - changeSet:
      id: knowledge-2026-10-20-embedding-rate-measurements
      author: opaa
      comment: "The measured embedding throughput of the installation per embedding model (ADR-0053, Entscheidung 12): every instance adds the calls it measured, and the cost preview of a schema change reads the sum, so it names the same duration on every instance and after a restart. Additive: a new table."
      changes:
        - sql:
            sql: |
              SET LOCAL lock_timeout = '5s';
              CREATE TABLE embedding_rate_measurements (
                  embedding_model text NOT NULL,
                  measured_chunks bigint NOT NULL,
                  measured_nanos bigint NOT NULL,
                  updated_at timestamp with time zone NOT NULL,
                  CONSTRAINT embedding_rate_measurements_pkey PRIMARY KEY (embedding_model)
              );
