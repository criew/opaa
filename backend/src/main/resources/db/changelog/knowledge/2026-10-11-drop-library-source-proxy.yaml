databaseChangeLog:
  - changeSet:
      id: knowledge-2026-10-11-drop-library-source-proxy
      author: opaa
      comment: "A library carries no proxy of its own: every connection takes the house-wide outbound proxy. Dropping source_proxy would drop chk_knowledge_libraries_upload_without_source with it, so the check is recreated without the column."
      changes:
        - sql:
            sql: |
              ALTER TABLE knowledge_libraries DROP CONSTRAINT chk_knowledge_libraries_upload_without_source;
              ALTER TABLE knowledge_libraries DROP COLUMN source_proxy;
              ALTER TABLE knowledge_libraries ADD CONSTRAINT chk_knowledge_libraries_upload_without_source CHECK ((((source_type)::text <> 'UPLOAD'::text) OR ((source_path IS NULL) AND (source_url IS NULL) AND (source_credentials IS NULL) AND (source_insecure_ssl = false) AND (source_settings IS NULL))));
