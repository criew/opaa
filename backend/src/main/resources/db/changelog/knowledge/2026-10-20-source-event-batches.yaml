databaseChangeLog:
  - changeSet:
      id: knowledge-2026-10-20-source-event-batches
      author: opaa
      comment: "Push notifications (Confluence webhooks, S3 events) collect their keys per library in a table, debounced on the database clock, and one instance claims a due batch; no key is lost to a change of instance or a restart."
      changes:
        - sql:
            splitStatements: false
            sql: |
              SET LOCAL lock_timeout = '5s';
              CREATE TABLE source_event_batches (
                  id uuid NOT NULL,
                  library_id uuid NOT NULL,
                  source_type character varying(20) NOT NULL,
                  keys text[] DEFAULT '{}'::text[] NOT NULL,
                  dropped integer DEFAULT 0 NOT NULL,
                  overflowed boolean DEFAULT false NOT NULL,
                  deferrals integer DEFAULT 0 NOT NULL,
                  due_at timestamp with time zone NOT NULL,
                  claimed_until timestamp with time zone,
                  created_at timestamp with time zone DEFAULT now() NOT NULL,
                  CONSTRAINT source_event_batches_pkey PRIMARY KEY (id),
                  CONSTRAINT chk_source_event_batches_counts CHECK (((dropped >= 0) AND (deferrals >= 0)))
              );

              CREATE UNIQUE INDEX uk_source_event_batches_open
                  ON source_event_batches (library_id) WHERE (claimed_until IS NULL);

              CREATE INDEX idx_source_event_batches_due_at ON source_event_batches (due_at);
