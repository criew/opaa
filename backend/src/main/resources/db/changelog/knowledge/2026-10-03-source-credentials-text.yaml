databaseChangeLog:
  - changeSet:
      id: knowledge-2026-10-03-source-credentials-text
      author: opaa
      comment: "source_credentials holds up to 4096 plaintext characters encrypted (ADR-0040, Entscheidung 2): text instead of varchar(3000), stored values unchanged."
      changes:
        - sql:
            sql: |
              ALTER TABLE knowledge_libraries ALTER COLUMN source_credentials TYPE text;
