databaseChangeLog:
  - changeSet:
      id: identity-2026-10-20-admin-review-reminders
      author: opaa
      comment: "The day the system administrators of an organization were last sent the review reminder (ADR-0053, Entscheidung 7): a conditional upsert claims the day, so the reminder goes out once however many instances run the daily step. Additive: a new table."
      changes:
        - sql:
            sql: |
              SET LOCAL lock_timeout = '5s';
              CREATE TABLE admin_review_reminders (
                  organization_id uuid NOT NULL,
                  reminded_on date NOT NULL,
                  CONSTRAINT admin_review_reminders_pkey PRIMARY KEY (organization_id),
                  CONSTRAINT fk_admin_review_reminders_organization FOREIGN KEY (organization_id)
                      REFERENCES organizations (id) ON DELETE CASCADE
              );
