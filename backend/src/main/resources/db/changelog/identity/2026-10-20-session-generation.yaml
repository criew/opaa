databaseChangeLog:
  - changeSet:
      id: identity-2026-10-20-session-generation
      author: opaa
      comment: "The session generation of a local account (ADR-0053, Entscheidung 6): every revocation of all sessions raises it, and an access token is valid only with the generation it was minted with - no comparison of clocks of two hosts. Expand step with a lasting default; the trigger raises the generation when a previous version, which knows only password_invalidated_before, ends the sessions, and never lets it fall."
      changes:
        - sql:
            splitStatements: false
            sql: |
              SET LOCAL lock_timeout = '5s';
              ALTER TABLE local_credentials ADD COLUMN session_generation bigint DEFAULT 0 NOT NULL;

              CREATE FUNCTION local_credentials_session_generation() RETURNS trigger
                  LANGUAGE plpgsql
                  SET search_path TO 'pg_catalog', '${database.defaultSchemaName}', 'pg_temp'
                  AS $$
              BEGIN
                IF NEW.session_generation < OLD.session_generation THEN
                  NEW.session_generation := OLD.session_generation;
                END IF;
                IF NEW.password_invalidated_before IS DISTINCT FROM OLD.password_invalidated_before
                    AND NEW.session_generation = OLD.session_generation THEN
                  NEW.session_generation := OLD.session_generation + 1;
                END IF;
                RETURN NEW;
              END; $$;

              CREATE TRIGGER trg_local_credentials_session_generation
                  BEFORE UPDATE ON local_credentials
                  FOR EACH ROW EXECUTE FUNCTION local_credentials_session_generation();
