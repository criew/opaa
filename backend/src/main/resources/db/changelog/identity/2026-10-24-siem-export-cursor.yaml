databaseChangeLog:
  - changeSet:
      id: identity-2026-10-24-siem-export-cursor
      author: opaa
      comment: "The position of the SIEM export in the audit log (ADR-0055): one row, created when the export runs for the first time, moved only after a delivery succeeded; disabled_at marks a start with the export switched off, heartbeat_at the last run. Additive: a new table."
      changes:
        - sql:
            sql: |
              SET LOCAL lock_timeout = '5s';
              CREATE TABLE siem_export_cursor (
                id smallint PRIMARY KEY,
                started_at timestamptz NOT NULL,
                last_recorded_at timestamptz NOT NULL,
                last_event_id uuid,
                disabled_at timestamptz,
                heartbeat_at timestamptz,
                updated_at timestamptz NOT NULL,
                CONSTRAINT chk_siem_export_cursor_singleton CHECK (id = 1)
              );
  - changeSet:
      id: identity-2026-10-24-siem-export-cursor--audit-log-order
      author: opaa
      comment: "The order the SIEM export reads audit_log in (ADR-0055): recorded_at with event_id as tie-breaker, so each batch is an index range scan over the partitions after the cursor. Created as opaa_audit_owner, which owns the table (ADR-0015). Additive: a new, non-unique index."
      changes:
        - sql:
            sql: |
              SET LOCAL lock_timeout = '5s';
              DO $$
              BEGIN
                EXECUTE format('GRANT opaa_audit_owner TO %I WITH SET TRUE', current_user);
              END $$;
              SET LOCAL ROLE opaa_audit_owner;
              CREATE INDEX idx_audit_log_recorded_event ON audit_log USING btree (recorded_at, event_id);
              RESET ROLE;
              DO $$
              BEGIN
                EXECUTE format('REVOKE opaa_audit_owner FROM %I', current_user);
              END $$;
