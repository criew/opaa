databaseChangeLog:
  - changeSet:
      id: identity-2026-10-20-account-expiry-reminder-marker
      author: opaa
      comment: "The expiry a local account was last reminded of (ADR-0053, Entscheidung 7): a conditional UPDATE claims the reminder, so it goes out once however many instances run the daily step. Additive: a nullable column without default."
      changes:
        - sql:
            sql: |
              SET LOCAL lock_timeout = '5s';
              ALTER TABLE local_credentials ADD COLUMN expiry_reminded_for timestamp with time zone;
