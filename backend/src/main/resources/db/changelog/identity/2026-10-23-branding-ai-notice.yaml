databaseChangeLog:
  - changeSet:
      id: identity-2026-10-23-branding-ai-notice
      author: opaa
      comment: "Hinweistext der Behörde zur KI-Nutzung (Art. 50 KI-VO) im Branding. Additive: a nullable column without default; null means the OPAA standard text."
      changes:
        - sql:
            sql: |
              SET LOCAL lock_timeout = '5s';
              ALTER TABLE branding_settings ADD COLUMN ai_notice varchar(500);
