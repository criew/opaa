databaseChangeLog:
  - changeSet:
      id: identity-2026-10-15-incident-scope-retention
      author: opaa
      comment: "A grant of the anlassbezogene Klärung no longer holds the accounts of the persons it names: deleting one keeps the person in the grant as the protocol's own pseudonym and lets the account go. The grants get a deletion period, so the number of cases per year and purpose is kept apart from them for the annual report."
      changes:
        - sql:
            splitStatements: false
            sql: |
              ALTER TABLE audit_incident_scope_grants
                  ADD COLUMN subject_pseudonym_id uuid,
                  ADD COLUMN requested_by_pseudonym_id uuid,
                  ADD COLUMN approved_by_pseudonym_id uuid;

              ALTER TABLE audit_incident_scope_grants ALTER COLUMN subject_user_id DROP NOT NULL;
              ALTER TABLE audit_incident_scope_grants ALTER COLUMN requested_by_user_id DROP NOT NULL;

              ALTER TABLE audit_incident_scope_grants
                  DROP CONSTRAINT chk_audit_incident_scope_grants_requester;
              ALTER TABLE audit_incident_scope_grants
                  ADD CONSTRAINT chk_audit_incident_scope_grants_requester CHECK (
                      ((approved_at IS NOT NULL) OR (approved_by_user_id IS NULL))
                      AND ((approved_by_user_id IS NULL) OR (requested_by_user_id IS NULL)
                          OR (approved_by_user_id <> requested_by_user_id)));
              ALTER TABLE audit_incident_scope_grants
                  ADD CONSTRAINT chk_audit_incident_scope_grants_persons_named CHECK (
                      ((subject_user_id IS NOT NULL) OR (subject_pseudonym_id IS NOT NULL))
                      AND ((requested_by_user_id IS NOT NULL) OR (requested_by_pseudonym_id IS NOT NULL))
                      AND ((approved_at IS NULL) OR (approved_by_user_id IS NOT NULL)
                          OR (approved_by_pseudonym_id IS NOT NULL)));

              ALTER TABLE audit_incident_scope_grants
                  DROP CONSTRAINT fk_audit_incident_scope_grants_subject_organization;
              ALTER TABLE audit_incident_scope_grants
                  DROP CONSTRAINT fk_audit_incident_scope_grants_requester_organization;
              ALTER TABLE audit_incident_scope_grants
                  DROP CONSTRAINT fk_audit_incident_scope_grants_approver_organization;
              ALTER TABLE audit_incident_scope_grants
                  ADD CONSTRAINT fk_audit_incident_scope_grants_subject_organization
                  FOREIGN KEY (subject_user_id, organization_id) REFERENCES users(id, organization_id)
                  ON DELETE SET NULL (subject_user_id);
              ALTER TABLE audit_incident_scope_grants
                  ADD CONSTRAINT fk_audit_incident_scope_grants_requester_organization
                  FOREIGN KEY (requested_by_user_id, organization_id) REFERENCES users(id, organization_id)
                  ON DELETE SET NULL (requested_by_user_id);
              ALTER TABLE audit_incident_scope_grants
                  ADD CONSTRAINT fk_audit_incident_scope_grants_approver_organization
                  FOREIGN KEY (approved_by_user_id, organization_id) REFERENCES users(id, organization_id)
                  ON DELETE SET NULL (approved_by_user_id);

              -- Runs before the row goes, so the pseudonym mapping the same deletion cascades away is
              -- still there: the grant keeps the person as the pseudonym the protocol already carries,
              -- or as a fresh one if the person never acted in the protocol.
              CREATE FUNCTION audit_incident_scope_grants_pseudonymize_person() RETURNS trigger
                  LANGUAGE plpgsql
                  SET search_path TO 'pg_catalog', '${database.defaultSchemaName}', 'pg_temp'
                  AS $$
              DECLARE
                pseudonym uuid;
              BEGIN
                IF NOT EXISTS (SELECT 1 FROM audit_incident_scope_grants g
                    WHERE g.subject_user_id = OLD.id OR g.requested_by_user_id = OLD.id
                       OR g.approved_by_user_id = OLD.id) THEN
                  RETURN OLD;
                END IF;
                pseudonym := coalesce(
                    (SELECT p.pseudonym_id FROM audit_actor_pseudonyms p WHERE p.user_id = OLD.id),
                    gen_random_uuid());
                UPDATE audit_incident_scope_grants SET subject_pseudonym_id = pseudonym
                    WHERE subject_user_id = OLD.id;
                UPDATE audit_incident_scope_grants SET requested_by_pseudonym_id = pseudonym
                    WHERE requested_by_user_id = OLD.id;
                UPDATE audit_incident_scope_grants SET approved_by_pseudonym_id = pseudonym
                    WHERE approved_by_user_id = OLD.id;
                RETURN OLD;
              END; $$;

              CREATE TRIGGER trg_users_pseudonymize_incident_scope_grants BEFORE DELETE ON users
                  FOR EACH ROW EXECUTE FUNCTION audit_incident_scope_grants_pseudonymize_person();

              CREATE TABLE audit_incident_scope_case_counts (
                  organization_id uuid NOT NULL,
                  case_year integer NOT NULL,
                  purpose character varying(40) NOT NULL,
                  case_count integer NOT NULL,
                  CONSTRAINT audit_incident_scope_case_counts_pkey
                      PRIMARY KEY (organization_id, case_year, purpose),
                  CONSTRAINT chk_audit_incident_scope_case_counts_count CHECK ((case_count > 0)),
                  CONSTRAINT chk_audit_incident_scope_case_counts_purpose CHECK ((purpose IN ('SECURITY_INCIDENT', 'UNAUTHORIZED_ACCESS_SUSPICION', 'DATA_BREACH_INVESTIGATION', 'EXTERNAL_AUDIT_OR_INSPECTION'))),
                  CONSTRAINT fk_audit_incident_scope_case_counts_organization
                      FOREIGN KEY (organization_id) REFERENCES organizations(id) ON DELETE CASCADE
              );

              INSERT INTO audit_incident_scope_case_counts (organization_id, case_year, purpose, case_count)
                  SELECT organization_id, extract(year FROM approved_at)::integer, purpose, count(*)
                  FROM audit_incident_scope_grants
                  WHERE approved_at IS NOT NULL
                  GROUP BY organization_id, extract(year FROM approved_at)::integer, purpose;
