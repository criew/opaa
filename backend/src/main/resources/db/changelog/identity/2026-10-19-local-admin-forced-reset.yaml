databaseChangeLog:
  - changeSet:
      id: identity-2026-10-19-local-admin-forced-reset
      author: opaa
      comment: "When OPAA_LOCAL_ADMIN_RESET=force was last carried out, so that one setting of the variable resets the emergency account once across all instances and starts; cleared by the first start without it."
      changes:
        - sql:
            sql: |
              SET LOCAL lock_timeout = '5s';
              ALTER TABLE local_admin_seed_marker ADD COLUMN forced_reset_at timestamp with time zone;
