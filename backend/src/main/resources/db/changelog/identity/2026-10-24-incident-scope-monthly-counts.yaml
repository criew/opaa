databaseChangeLog:
  - changeSet:
      id: identity-2026-10-24-incident-scope-monthly-counts
      author: opaa
      comment: "The disclosure of the data collection reports the anlassbezogenen Klärungen of a reporting period: a count per month of requests, approvals and ends of usability, without person or grant. Purely additive; audit_incident_scope_case_counts is no longer written and goes with a contract changeSet in a later release."
      changes:
        - sql:
            splitStatements: false
            sql: |
              SET LOCAL lock_timeout = '5s';
              CREATE TABLE audit_incident_scope_monthly_counts (
                  organization_id uuid NOT NULL,
                  case_month date NOT NULL,
                  purpose character varying(40) NOT NULL,
                  transition character varying(10) NOT NULL,
                  case_count integer NOT NULL,
                  CONSTRAINT audit_incident_scope_monthly_counts_pkey
                      PRIMARY KEY (organization_id, case_month, purpose, transition),
                  CONSTRAINT chk_audit_incident_scope_monthly_counts_count CHECK ((case_count > 0)),
                  CONSTRAINT chk_audit_incident_scope_monthly_counts_month
                      CHECK ((case_month = (date_trunc('month', case_month))::date)),
                  CONSTRAINT chk_audit_incident_scope_monthly_counts_purpose CHECK ((purpose IN ('SECURITY_INCIDENT', 'UNAUTHORIZED_ACCESS_SUSPICION', 'DATA_BREACH_INVESTIGATION', 'EXTERNAL_AUDIT_OR_INSPECTION'))),
                  CONSTRAINT chk_audit_incident_scope_monthly_counts_transition
                      CHECK ((transition IN ('REQUESTED', 'APPROVED', 'EXPIRED'))),
                  CONSTRAINT fk_audit_incident_scope_monthly_counts_organization
                      FOREIGN KEY (organization_id) REFERENCES organizations(id) ON DELETE CASCADE
              );
