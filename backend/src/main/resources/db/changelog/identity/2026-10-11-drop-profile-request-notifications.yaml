databaseChangeLog:
  - changeSet:
      id: identity-2026-10-11-drop-profile-request-notifications
      author: opaa
      comment: "Connection profile requests are withdrawn, and with them their two notification types. A stored notification of either type could no longer be read and would break the recipient's whole list, so it goes."
      changes:
        - sql:
            sql: |
              DELETE FROM notifications
                  WHERE type IN ('CONNECTION_PROFILE_REQUESTED', 'CONNECTION_PROFILE_REQUEST_RESOLVED');
