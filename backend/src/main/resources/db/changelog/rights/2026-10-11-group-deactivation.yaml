databaseChangeLog:
  - changeSet:
      id: rights-2026-10-11-group-deactivation
      author: opaa
      comment: "An internal group can be deactivated for the time being (ADR-0036, Entscheidung 14): a switch of its own beside released_for_use, only for AD_HOC groups, with the moment it was set. The membership history records the switch as the end and the restart of every membership interval of the group, so the Stichtagsauskunft knows the group reached nobody meanwhile."
      changes:
        - sql:
            splitStatements: false
            sql: |
              ALTER TABLE groups ADD COLUMN deactivated boolean DEFAULT false NOT NULL;
              ALTER TABLE groups ADD COLUMN deactivated_at timestamp with time zone;
              ALTER TABLE groups ADD CONSTRAINT chk_groups_deactivated_internal
                  CHECK ((NOT deactivated) OR ((kind)::text = 'AD_HOC'::text));
              ALTER TABLE groups ADD CONSTRAINT chk_groups_deactivated_at
                  CHECK (deactivated = (deactivated_at IS NOT NULL));

              ALTER TABLE group_membership_history DROP CONSTRAINT chk_group_membership_history_cause;
              ALTER TABLE group_membership_history ADD CONSTRAINT chk_group_membership_history_cause
                  CHECK ((cause IN ('ADDED', 'REMOVED', 'DIRECTORY_SYNC_ADDED', 'DIRECTORY_SYNC_REMOVED', 'BACKFILL', 'GROUP_DELETED', 'IDENTITY_PROVIDER_ADDED', 'IDENTITY_PROVIDER_REMOVED', 'GROUP_DEACTIVATED', 'GROUP_REACTIVATED')));
