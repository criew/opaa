databaseChangeLog:
  - changeSet:
      id: rights-2026-10-02-drop-asset-listed
      author: opaa
      comment: "Visible means readable: the asset shell loses its findability flag (listed), its partial index, the listed column of the reach history and the history cause that recorded a change of it."
      changes:
        - sql:
            sql: |
              DROP INDEX idx_assets_organization_listed;
              ALTER TABLE assets DROP COLUMN listed;
              ALTER TABLE asset_visibility_history DROP COLUMN listed;
              ALTER TABLE asset_visibility_history DROP CONSTRAINT chk_asset_visibility_history_cause;
              ALTER TABLE asset_visibility_history ADD CONSTRAINT chk_asset_visibility_history_cause CHECK ((cause IN ('CREATED', 'BACKFILL', 'ASSET_DELETED', 'EXTERNAL_ACCESS_CHANGED', 'EXTERNAL_ACCESS_EXPIRED')));
