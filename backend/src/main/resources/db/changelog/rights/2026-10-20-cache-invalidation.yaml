databaseChangeLog:
  - changeSet:
      id: rights-2026-10-20-cache-invalidation
      author: opaa
      comment: "Binds the rights caches to the invalidation bus (ADR-0053, Entscheidung 5): every change of a group, its deactivation included, of a membership and of an asset grant is announced at commit, from whichever instance or version writes it."
      changes:
        - sql:
            sql: |
              SET LOCAL lock_timeout = '5s';
              CREATE TRIGGER trg_groups_invalidation
                  AFTER INSERT OR UPDATE OR DELETE OR TRUNCATE ON groups
                  FOR EACH STATEMENT EXECUTE FUNCTION notify_cache_invalidation('rights');
              CREATE TRIGGER trg_group_memberships_invalidation
                  AFTER INSERT OR UPDATE OR DELETE OR TRUNCATE ON group_memberships
                  FOR EACH STATEMENT EXECUTE FUNCTION notify_cache_invalidation('rights');
              CREATE TRIGGER trg_asset_grants_invalidation
                  AFTER INSERT OR UPDATE OR DELETE OR TRUNCATE ON asset_grants
                  FOR EACH STATEMENT EXECUTE FUNCTION notify_cache_invalidation('rights');
