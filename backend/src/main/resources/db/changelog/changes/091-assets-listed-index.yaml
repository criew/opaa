databaseChangeLog:
  - changeSet:
      id: 091-assets-listed-index
      author: opaa
      comment: >-
        Der Katalog (#1904) liest die Assets einer Organisation, die gelistet oder fuer die
        anfragende Person lesbar sind, in einer Abfrage. Fuer den lesbaren Teil gibt es den
        Primaerschluessel und idx_assets_organization_wide; der gelistete Teil bekommt hier den
        gleich gebauten Teilindex, damit die Abfrage nicht alle Assets der Organisation lesen muss,
        um die wenigen gelisteten zu finden.
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE INDEX idx_assets_organization_listed ON assets USING btree (organization_id, asset_type) WHERE listed;
      rollback:
        - sql:
            splitStatements: false
            sql: |
              DROP INDEX idx_assets_organization_listed;
