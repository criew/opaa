databaseChangeLog:
  # #229 (validating the Rheinfurt demo corpus against a real Compose stack) surfaced that
  # chk_indexing_run_events_category never accepted FORMAT_MISMATCH (io.opaa.indexing.
  # IndexingEventCategory), even though #404 introduced that category and both UrlIndexingExecutor
  # and RssFeedIndexingExecutor have recorded it since. The actual trigger in the demo run was a
  # separate, now-fixed crawler bug (AutoindexCrawlerService#parseHtmlTableLayout losing a long file
  # name's extension to Apache's truncated display text, see the AutoindexCrawlerServiceTest fix in
  # the same PR): a document Tika detected as e.g. application/pdf while its own name still ended in
  # something else is a genuine extensionMismatch, and every one of those hit this constraint.
  #
  # IndexingRunEventRecorder#record already catches any persistence failure here (PR #604 review,
  # finding 2, "Never breaks the run") - so this was never a document-indexing bug: no run failed and
  # no document was skipped because of it. What actually happened is narrower: every FORMAT_MISMATCH
  # event was silently dropped instead of persisted (one log.warn per occurrence), and
  # IndexingJob#eventsTruncatedCount was incremented for each one - the "… und N weitere" a caller
  # sees for a run's protocol is thereby overstated by exactly that many events, without any of them
  # ever being either shown or actually truncated for capacity reasons. Same widen-only shape as 056,
  # one changeSet after it in the same table's history.
  - changeSet:
      id: 057-widen-indexing-run-event-category-format-mismatch
      author: opaa
      comment: "Widens chk_indexing_run_events_category to also accept FORMAT_MISMATCH (#229, #404)"
      changes:
        - sql:
            comment: "Drop and recreate chk_indexing_run_events_category to include FORMAT_MISMATCH"
            sql: >
              ALTER TABLE indexing_run_events DROP CONSTRAINT chk_indexing_run_events_category;
              ALTER TABLE indexing_run_events
              ADD CONSTRAINT chk_indexing_run_events_category
              CHECK (category IN ('REJECTED', 'UNREACHABLE', 'UNSUPPORTED_FORMAT', 'ALLOWLIST', 'ERROR', 'SCHEDULE_SKIPPED', 'FORMAT_MISMATCH'));
      rollback:
        - sql:
            sql: >
              ALTER TABLE indexing_run_events DROP CONSTRAINT chk_indexing_run_events_category;
              ALTER TABLE indexing_run_events
              ADD CONSTRAINT chk_indexing_run_events_category
              CHECK (category IN ('REJECTED', 'UNREACHABLE', 'UNSUPPORTED_FORMAT', 'ALLOWLIST', 'ERROR', 'SCHEDULE_SKIPPED'));
