databaseChangeLog:
  # #862 (Epic #826, Befund B4): chk_audit_log_event_type duplicated AuditEventType's full value
  # list on every extension (022/035/040/042/053/059/061) - dropped here without replacement. The
  # Java enum (@Enumerated(STRING)) remains the sole write guard; a value outside it is no longer
  # stopped by the database, only by the application. Runs as opaa_audit_owner via the same
  # temporary SET TRUE / SET ROLE bracket migration 022/063 established, since audit_log's DDL is
  # otherwise unreachable from the migration account after 017's ownership transfer.
  - changeSet:
      id: 064-drop-audit-log-event-type-check
      author: opaa
      comment: >
        Drops chk_audit_log_event_type. See this file's header comment for the trade-off.
      changes:
        - sql:
            splitStatements: false
            sql: >
              DO $$
              BEGIN
                EXECUTE format('GRANT opaa_audit_owner TO %I WITH SET TRUE', current_user);
              END $$;
              SET ROLE opaa_audit_owner;
              ALTER TABLE audit_log DROP CONSTRAINT chk_audit_log_event_type;
              RESET ROLE;
              DO $$
              BEGIN
                EXECUTE format('REVOKE opaa_audit_owner FROM %I', current_user);
              END $$;
      rollback:
        - sql:
            splitStatements: false
            sql: >
              DO $$
              BEGIN
                EXECUTE format('GRANT opaa_audit_owner TO %I WITH SET TRUE', current_user);
              END $$;
              SET ROLE opaa_audit_owner;
              ALTER TABLE audit_log
              ADD CONSTRAINT chk_audit_log_event_type
              CHECK (event_type IN (
                'ASSET_GRANT_GRANTED', 'ASSET_GRANT_CHANGED', 'ASSET_GRANT_REVOKED',
                'ASSET_GRANT_EXPIRED', 'ASSET_VISIBILITY_CHANGED', 'ASSET_GRANT_SUSPENDED',
                'SPACE_CREATED', 'SPACE_CHANGED', 'SPACE_DELETED',
                'LIBRARY_CREATED', 'LIBRARY_CHANGED', 'LIBRARY_DELETED',
                'GROUP_CREATED', 'GROUP_CHANGED', 'GROUP_DELETED',
                'SPACE_MEMBER_ADDED', 'SPACE_MEMBER_ROLE_CHANGED', 'SPACE_MEMBER_REMOVED',
                'GROUP_MEMBER_ADDED', 'GROUP_MEMBER_REMOVED',
                'LIBRARY_SHARED_TO_SPACE',
                'ASSET_OWNER_CHANGED', 'ASSET_OWNERSHIP_CLAIMED', 'ASSET_SUCCESSION_OPENED',
                'SYSTEM_ADMIN_ROLE_GRANTED', 'SYSTEM_ADMIN_ROLE_REVOKED',
                'AUDITOR_ROLE_GRANTED', 'AUDITOR_ROLE_REVOKED',
                'ACCOUNT_DEACTIVATED', 'ACCOUNT_REAUTHENTICATION_FORCED',
                'API_TOKEN_ISSUED', 'API_TOKEN_REVOKED',
                'DIRECTORY_SYNC_CHANGE_APPLIED', 'DIRECTORY_SYNC_RUN_COMPLETED',
                'GOVERNANCE_SETTINGS_CHANGED', 'AUDIT_LOG_CONFIGURATION_CHANGED',
                'MODEL_POLICY_CHANGED', 'CONNECTOR_LIBRARY_SHARE_LIMIT_CHANGED',
                'AUDIT_LOG_ACCESSED',
                'LIBRARY_SOURCE_UPDATED', 'SPACE_ARCHIVED', 'BRANDING_SETTINGS_CHANGED',
                'LIBRARY_DETACHED_FROM_SPACE',
                'LLM_MODEL_CREATED', 'LLM_MODEL_CHANGED', 'LLM_MODEL_ACTIVATED',
                'LLM_MODEL_DELETED', 'LLM_MODEL_DEACTIVATED'
              ));
              RESET ROLE;
              DO $$
              BEGIN
                EXECUTE format('REVOKE opaa_audit_owner FROM %I', current_user);
              END $$;
