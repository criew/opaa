databaseChangeLog:
  # ADR-0027, Entscheidung 3 (#1380): the resumption state of an S3 library's full sync and the
  # bytes a run downloaded. Each changeset is one schema change with its own delta test
  # (io.opaa.migration.Migration031S3RunStateTest).
  - changeSet:
      id: 031-s3-sync-state
      author: opaa
      comment: >-
        ADR-0027, Entscheidung 3: one row per S3 library (the confluence_sync_state pattern) holding
        the job of the full sync in progress, the scopes it has already listed completely as
        bucket/prefix keys (never a list index - an index shifts when a scope is removed) and the
        time the last full sync completed - cleared again when the next one begins, so the column
        reads "completed" only between two full syncs. A run after an interrupted one lists every scope
        again, unfinished scopes first, and only saves the downloads. Deleted with the library
        (cascade) and by KnowledgeLibraryService whenever the endpoint or the scopes change.
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE TABLE public.s3_sync_state (
                  id uuid NOT NULL,
                  library_id uuid NOT NULL,
                  full_sync_job_id uuid,
                  completed_scope_keys text,
                  full_sync_completed_at timestamp with time zone,
                  updated_at timestamp with time zone NOT NULL,
                  CONSTRAINT s3_sync_state_pkey PRIMARY KEY (id),
                  CONSTRAINT uk_s3_sync_state_library UNIQUE (library_id),
                  CONSTRAINT fk_s3_sync_state_library FOREIGN KEY (library_id)
                      REFERENCES public.knowledge_libraries(id) ON DELETE CASCADE
              );
      rollback:
        - sql:
            sql: DROP TABLE IF EXISTS public.s3_sync_state;

  - changeSet:
      id: 031-indexing-jobs-bytes-downloaded
      author: opaa
      comment: >-
        #1380: the bytes a run downloaded from its source - what an operator reads bandwidth and the
        object size bound against. NULL for runs recorded before this change; 0 for a run of a
        source type that does not count them.
      changes:
        - sql:
            sql: ALTER TABLE public.indexing_jobs ADD COLUMN bytes_downloaded bigint;
      rollback:
        - sql:
            sql: ALTER TABLE public.indexing_jobs DROP COLUMN bytes_downloaded;
