databaseChangeLog:
  # The single, system-wide branding configuration (#582, docs/design/guidelines.md#7): product
  # name, claim, accent colour, default colour scheme and the operator's logo - everything the
  # interface needs to look like the operating Behörde's own without a rebuild or a redeployment.
  #
  # A singleton (id fixed to 1 via chk_branding_settings_singleton), not one row per organization,
  # for the same reason 023-create-audit-retention-settings is one: OPAA is deployed once per
  # Behörde (ADR-0015, AGENTS.md), and "das Branding" is what that one deployment looks like.
  # Unlike audit_retention_settings, this table stays owned by the migration/application account -
  # there is no opaa_audit_owner-style ownership split to make here, because branding is ordinary
  # configuration an administrator changes, not evidence that has to survive that administrator.
  #
  # **Every configurable column is nullable, and seeded NULL.** NULL means "never configured", not
  # "empty": io.opaa.branding.BrandingSettingsService resolves each field individually against
  # io.opaa.branding.BrandingDefaults at read time. Seeding the OPAA defaults into the row instead
  # would freeze today's standard into every deployment's database, and would make "back to the
  # standard" indistinguishable from "the operator happened to type the same value".
  #
  # The logo lives here as a bytea rather than on disk: it is at most 512 KiB, it must survive the
  # restart of a container without a persistent volume, and every replica must see the same one the
  # moment it changes. logo_content_type is the type the server itself detected in the bytes at
  # upload time (io.opaa.branding.BrandingLogoValidator), never one an uploader declared - which is
  # what makes serving it back a safe "Content-Type erzwingen" rather than an echo.
  #
  # The CHECK constraints below mirror the service-layer validation rather than replacing it: the
  # service rejects bad input with a German-language message before ever writing, and these catch a
  # future direct write or an application bug that bypasses it. chk_branding_settings_logo_complete
  # is the one with no service-layer counterpart worth the name - it makes the four logo columns
  # provably all-or-nothing, so no read path ever has to handle "content without a type".

  - changeSet:
      id: 041-create-branding-settings
      author: opaa
      comment: >
        Create branding_settings - the singleton row holding the operator's branding, seeded with
        NULLs so an unconfigured deployment resolves to the OPAA standard at read time (see the
        changelog header for why NULL rather than seeded defaults).
      changes:
        - createTable:
            tableName: branding_settings
            columns:
              - column:
                  name: id
                  type: int
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: product_name
                  type: varchar(60)
                  constraints:
                    nullable: true
              - column:
                  name: claim
                  type: varchar(120)
                  constraints:
                    nullable: true
              - column:
                  name: primary_color
                  type: varchar(7)
                  constraints:
                    nullable: true
              - column:
                  name: default_color_scheme
                  type: varchar(10)
                  constraints:
                    nullable: true
              - column:
                  name: logo_content
                  type: bytea
                  constraints:
                    nullable: true
              - column:
                  name: logo_content_type
                  type: varchar(50)
                  constraints:
                    nullable: true
              - column:
                  name: logo_version
                  type: varchar(16)
                  constraints:
                    nullable: true
              - column:
                  name: logo_updated_at
                  type: timestamp with time zone
                  constraints:
                    nullable: true
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false

        - sql:
            comment: >
              Bounds every configurable value at the database level. Kept as one statement block
              because these constraints only make sense together - each one alone would leave a
              gap the next one closes.
            splitStatements: true
            sql: >
              ALTER TABLE branding_settings
              ADD CONSTRAINT chk_branding_settings_singleton CHECK (id = 1);

              ALTER TABLE branding_settings
              ADD CONSTRAINT chk_branding_settings_primary_color
              CHECK (primary_color IS NULL OR primary_color ~ '^#[0-9A-Fa-f]{6}$');

              ALTER TABLE branding_settings
              ADD CONSTRAINT chk_branding_settings_color_scheme
              CHECK (default_color_scheme IS NULL
                     OR default_color_scheme IN ('LIGHT', 'DARK', 'SYSTEM'));

              ALTER TABLE branding_settings
              ADD CONSTRAINT chk_branding_settings_logo_content_type
              CHECK (logo_content_type IS NULL
                     OR logo_content_type IN ('image/png', 'image/jpeg'));

              ALTER TABLE branding_settings
              ADD CONSTRAINT chk_branding_settings_logo_size
              CHECK (logo_content IS NULL OR octet_length(logo_content) <= 524288);

              ALTER TABLE branding_settings
              ADD CONSTRAINT chk_branding_settings_logo_complete
              CHECK ((logo_content IS NULL AND logo_content_type IS NULL
                      AND logo_version IS NULL AND logo_updated_at IS NULL)
                     OR (logo_content IS NOT NULL AND logo_content_type IS NOT NULL
                         AND logo_version IS NOT NULL AND logo_updated_at IS NOT NULL));

        - insert:
            tableName: branding_settings
            columns:
              - column:
                  name: id
                  valueNumeric: 1
              - column:
                  name: updated_at
                  valueComputed: now()

      rollback:
        - dropTable:
            tableName: branding_settings
