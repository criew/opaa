databaseChangeLog:
  # #706 review: LIBRARY_SHARED_TO_SPACE (io.opaa.audit.AuditEventType) was being written for both
  # associating AND detaching a library from a space, with no way to tell the two apart from the
  # event type alone. Adds LIBRARY_DETACHED_FROM_SPACE as the reverse operation's own event type -
  # SpaceAssetAssociationService#detach now writes this instead of reusing
  # LIBRARY_SHARED_TO_SPACE, which stays reserved for the association itself.
  #
  # Same widen-only shape as 022/035/040/042: drop and recreate chk_audit_log_event_type with the
  # one new value added, nothing removed, via the same temporary opaa_audit_owner SET ROLE dance
  # 022's changeSet comment explains in full (audit_log is owned by opaa_audit_owner after 017, not
  # by the migration/application account).
  #
  # The value list below is 042's complete list plus LIBRARY_DETACHED_FROM_SPACE, and the rollback
  # restores exactly 042's.

  - changeSet:
      id: 053-widen-audit-event-type-library-detached-from-space
      author: opaa
      comment: >
        Widens chk_audit_log_event_type to also accept LIBRARY_DETACHED_FROM_SPACE
        (io.opaa.audit.AuditEventType#LIBRARY_DETACHED_FROM_SPACE) - the event
        SpaceAssetAssociationService#detach now writes, distinct from
        LIBRARY_SHARED_TO_SPACE (#706 review). Runs as opaa_audit_owner via a temporary SET TRUE
        membership grant plus SET ROLE (see the changelog header comment above) since audit_log's
        DDL is otherwise unreachable from the migration account after 017's ownership transfer.
      changes:
        - sql:
            comment: >
              Drop and recreate chk_audit_log_event_type to include LIBRARY_DETACHED_FROM_SPACE,
              bracketed by the temporary membership grant/revoke this requires.
            splitStatements: false
            sql: >
              DO $$
              BEGIN
                EXECUTE format('GRANT opaa_audit_owner TO %I WITH SET TRUE', current_user);
              END $$;
              SET ROLE opaa_audit_owner;
              ALTER TABLE audit_log DROP CONSTRAINT chk_audit_log_event_type;
              ALTER TABLE audit_log
              ADD CONSTRAINT chk_audit_log_event_type
              CHECK (event_type IN (
                'ASSET_GRANT_GRANTED', 'ASSET_GRANT_CHANGED', 'ASSET_GRANT_REVOKED',
                'ASSET_GRANT_EXPIRED', 'ASSET_VISIBILITY_CHANGED', 'ASSET_GRANT_SUSPENDED',
                'SPACE_CREATED', 'SPACE_CHANGED', 'SPACE_DELETED', 'SPACE_ARCHIVED',
                'LIBRARY_CREATED', 'LIBRARY_CHANGED', 'LIBRARY_DELETED', 'LIBRARY_SOURCE_UPDATED',
                'GROUP_CREATED', 'GROUP_CHANGED', 'GROUP_DELETED',
                'SPACE_MEMBER_ADDED', 'SPACE_MEMBER_ROLE_CHANGED', 'SPACE_MEMBER_REMOVED',
                'GROUP_MEMBER_ADDED', 'GROUP_MEMBER_REMOVED',
                'LIBRARY_SHARED_TO_SPACE', 'LIBRARY_DETACHED_FROM_SPACE',
                'ASSET_OWNER_CHANGED', 'ASSET_OWNERSHIP_CLAIMED', 'ASSET_SUCCESSION_OPENED',
                'SYSTEM_ADMIN_ROLE_GRANTED', 'SYSTEM_ADMIN_ROLE_REVOKED',
                'AUDITOR_ROLE_GRANTED', 'AUDITOR_ROLE_REVOKED',
                'ACCOUNT_DEACTIVATED', 'ACCOUNT_REAUTHENTICATION_FORCED',
                'API_TOKEN_ISSUED', 'API_TOKEN_REVOKED',
                'DIRECTORY_SYNC_CHANGE_APPLIED', 'DIRECTORY_SYNC_RUN_COMPLETED',
                'GOVERNANCE_SETTINGS_CHANGED', 'AUDIT_LOG_CONFIGURATION_CHANGED',
                'MODEL_POLICY_CHANGED', 'CONNECTOR_LIBRARY_SHARE_LIMIT_CHANGED',
                'BRANDING_SETTINGS_CHANGED',
                'AUDIT_LOG_ACCESSED'
              ));
              RESET ROLE;
              DO $$
              BEGIN
                EXECUTE format('REVOKE opaa_audit_owner FROM %I', current_user);
              END $$;
      rollback:
        - sql:
            splitStatements: false
            sql: >
              DO $$
              BEGIN
                EXECUTE format('GRANT opaa_audit_owner TO %I WITH SET TRUE', current_user);
              END $$;
              SET ROLE opaa_audit_owner;
              ALTER TABLE audit_log DROP CONSTRAINT chk_audit_log_event_type;
              ALTER TABLE audit_log
              ADD CONSTRAINT chk_audit_log_event_type
              CHECK (event_type IN (
                'ASSET_GRANT_GRANTED', 'ASSET_GRANT_CHANGED', 'ASSET_GRANT_REVOKED',
                'ASSET_GRANT_EXPIRED', 'ASSET_VISIBILITY_CHANGED', 'ASSET_GRANT_SUSPENDED',
                'SPACE_CREATED', 'SPACE_CHANGED', 'SPACE_DELETED', 'SPACE_ARCHIVED',
                'LIBRARY_CREATED', 'LIBRARY_CHANGED', 'LIBRARY_DELETED', 'LIBRARY_SOURCE_UPDATED',
                'GROUP_CREATED', 'GROUP_CHANGED', 'GROUP_DELETED',
                'SPACE_MEMBER_ADDED', 'SPACE_MEMBER_ROLE_CHANGED', 'SPACE_MEMBER_REMOVED',
                'GROUP_MEMBER_ADDED', 'GROUP_MEMBER_REMOVED',
                'LIBRARY_SHARED_TO_SPACE',
                'ASSET_OWNER_CHANGED', 'ASSET_OWNERSHIP_CLAIMED', 'ASSET_SUCCESSION_OPENED',
                'SYSTEM_ADMIN_ROLE_GRANTED', 'SYSTEM_ADMIN_ROLE_REVOKED',
                'AUDITOR_ROLE_GRANTED', 'AUDITOR_ROLE_REVOKED',
                'ACCOUNT_DEACTIVATED', 'ACCOUNT_REAUTHENTICATION_FORCED',
                'API_TOKEN_ISSUED', 'API_TOKEN_REVOKED',
                'DIRECTORY_SYNC_CHANGE_APPLIED', 'DIRECTORY_SYNC_RUN_COMPLETED',
                'GOVERNANCE_SETTINGS_CHANGED', 'AUDIT_LOG_CONFIGURATION_CHANGED',
                'MODEL_POLICY_CHANGED', 'CONNECTOR_LIBRARY_SHARE_LIMIT_CHANGED',
                'BRANDING_SETTINGS_CHANGED',
                'AUDIT_LOG_ACCESSED'
              ));
              RESET ROLE;
              DO $$
              BEGIN
                EXECUTE format('REVOKE opaa_audit_owner FROM %I', current_user);
              END $$;
