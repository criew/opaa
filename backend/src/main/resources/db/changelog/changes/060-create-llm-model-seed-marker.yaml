databaseChangeLog:
  # #756 review (PR #763): the original design inferred "has the initial takeover already run?"
  # from "is llm_models currently empty?" - which re-seeds a stale environment configuration the
  # moment a Systemverwaltung deletes every model, contradicting
  # docs/features/llm-integration.md#übergang-aus-der-heutigen-konfiguration's own "Danach ist die
  # Datenbank für das Chat-Modell führend. Die Umgebungsvariablen werden nicht mehr ausgewertet."
  # This table replaces that inference with an explicit, permanent marker: once
  # io.opaa.llm.LlmModelSeeder has attempted the one-time takeover - whether or not it actually
  # found a matching spring.ai.model.chat configuration to seed from - it inserts exactly one row
  # here, and never attempts it again for the lifetime of this database.
  #
  # A singleton, same shape as 041-create-branding-settings and 058-create-llm-models' own active-
  # row uniqueness: id is fixed to 1 via a CHECK constraint, and the row is inserted by the
  # application (io.opaa.llm.LlmModelSeeder), not by this migration - a fresh installation that
  # has never run the seeder at all has no row here yet, which is exactly the "not yet attempted"
  # state the check needs to distinguish from "attempted, found nothing".

  - changeSet:
      id: 060-create-llm-model-seed-marker
      author: opaa
      comment: >
        Create llm_model_seed_marker - the permanent record that the one-time environment-to-
        llm_models takeover (io.opaa.llm.LlmModelSeeder) has been attempted, so a later deletion
        of every managed model can never trigger it a second time.
      changes:
        - createTable:
            tableName: llm_model_seed_marker
            columns:
              - column:
                  name: id
                  type: int
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: seeded_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false

        - sql:
            comment: "Exactly one row, ever - the same singleton shape as branding_settings."
            sql: >
              ALTER TABLE llm_model_seed_marker
              ADD CONSTRAINT chk_llm_model_seed_marker_singleton CHECK (id = 1);

      rollback:
        - dropTable:
            tableName: llm_model_seed_marker
