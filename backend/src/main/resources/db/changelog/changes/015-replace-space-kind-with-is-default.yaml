databaseChangeLog:
  # Four changeSets, in dependency order, replacing spaces.kind with spaces.is_default (#333, see
  # docs/features/spaces-and-assets.md#es-gibt-nur-eine-art-von-space):
  #   1. 015-add-is-default              - the new column, defaulting to false
  #   2. 015-backfill-is-default         - PERSONAL spaces become the owner's default space
  #   3. 015-replace-personal-owner-index- the partial unique index moves from kind to is_default
  #   4. 015-drop-kind                   - the old column and its check constraint
  #
  # The order matters: the index must exist on the new column before the old one is dropped, or a
  # concurrent insert between the two steps could create a second default space for one owner.
  #
  # Rollback order (reverse of apply order):
  # 015-drop-kind
  # 015-replace-personal-owner-index
  # 015-backfill-is-default
  # 015-add-is-default

  - changeSet:
      id: 015-add-is-default
      author: opaa
      comment: >
        Add spaces.is_default. SpaceKind (PERSONAL/PROJECT/TEAM) is dropped because the distinction
        did not carry: PERSONAL was simply "a space nobody else is a member of", and everything that
        hung on it hangs elsewhere - the unnarrowed search scope on the absence of associated
        libraries, the works-council assurance on the private status of content, the retention
        period likewise. TEAM differed from PROJECT only in who may create it, which is a permission
        rather than a kind. What remains is the one space created automatically on first login.
      changes:
        - addColumn:
            tableName: spaces
            columns:
              - column:
                  name: is_default
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
      rollback:
        - dropColumn:
            tableName: spaces
            columnName: is_default

  - changeSet:
      id: 015-backfill-is-default
      author: opaa
      comment: >
        Every existing PERSONAL space becomes its owner's default space. Migration 010 already
        guarantees at most one PERSONAL space per owner (uk_spaces_personal_owner), so this cannot
        produce two default spaces for one user. PROJECT and TEAM spaces keep is_default = false and
        become ordinary spaces - no data is lost, only the label.
      changes:
        - update:
            tableName: spaces
            columns:
              - column:
                  name: is_default
                  valueBoolean: true
            where: kind = 'PERSONAL'
      rollback:
        # Intentionally empty: 015-add-is-default's rollback drops the column outright.
        - empty

  - changeSet:
      id: 015-replace-personal-owner-index
      author: opaa
      comment: >
        Move the partial unique index from kind to is_default. It is created before the old column
        is dropped so that the "at most one default space per owner" guarantee is never absent, not
        even for the duration of the migration.
      changes:
        - sql:
            comment: "The new partial unique index on is_default"
            sql: >
              CREATE UNIQUE INDEX uk_spaces_default_owner
              ON spaces (owner_id)
              WHERE is_default;
        - sql:
            comment: "The kind-based index from migration 010 is now redundant"
            sql: "DROP INDEX IF EXISTS uk_spaces_personal_owner;"
      rollback:
        - sql:
            sql: >
              CREATE UNIQUE INDEX uk_spaces_personal_owner
              ON spaces (owner_id)
              WHERE kind = 'PERSONAL';
        - sql:
            sql: "DROP INDEX IF EXISTS uk_spaces_default_owner;"

  - changeSet:
      id: 015-drop-kind
      author: opaa
      comment: >
        Drop spaces.kind and its check constraint. Runs last so that every earlier step could still
        read the column.
      changes:
        - sql:
            comment: "Drop the kind check constraint if migration 007/008 created one"
            sql: >
              ALTER TABLE spaces
              DROP CONSTRAINT IF EXISTS chk_spaces_kind;
        - dropColumn:
            tableName: spaces
            columnName: kind
      rollback:
        - addColumn:
            tableName: spaces
            columns:
              - column:
                  name: kind
                  type: varchar(20)
                  defaultValue: "PROJECT"
                  constraints:
                    nullable: false
