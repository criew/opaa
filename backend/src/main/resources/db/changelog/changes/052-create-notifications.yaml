databaseChangeLog:
  # #203: a minimal, persisted in-app notification - just enough to satisfy "Der Eigentümer wird
  # aktiv benachrichtigt" (docs/features/spaces-and-assets.md#assets-in-einen-space-assoziieren)
  # without building the in-app postbox (notifications + todos) the maintainer has explicitly not
  # specified yet. Deliberately cut narrow but shaped to grow into that postbox later without a
  # rename: recipient/type/objectType/objectId/title/body/readAt/createdAt is the same shape a
  # todo-capable postbox item would need, just without the fields such an item would add on top
  # (e.g. an action/due date) - nothing about this table forecloses that.
  #
  # type was a closed vocabulary enforced by chk_notifications_type, mirroring
  # chk_audit_log_event_type (migration 017): "was hier nicht steht, wird nicht geschrieben" was the
  # same discipline that class already applied. LIBRARY_ASSOCIATED_TO_MIXED_SPACE is the only value
  # #203 needs. Migration 066 (#862) later dropped chk_notifications_type without replacement - the
  # NotificationType Java enum is the sole write guard from there on, so a later feature simply adds
  # its own enum value, no migration required.
  - changeSet:
      id: 052-create-notifications
      author: opaa
      comment: >
        Creates notifications (#203) - a minimal, persisted in-app notification. recipient_user_id
        plus organization_id is a composite foreign key onto users(id, organization_id)
        (uk_users_id_organization, migration 047), matching the pattern every other
        organization-scoped table has used since migrations 046-050. ON DELETE CASCADE: a deleted
        user's own notifications are deleted with them - there is no one left to read them.
      changes:
        - createTable:
            tableName: notifications
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: organization_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: recipient_user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: object_type
                  type: varchar(30)
                  constraints:
                    nullable: true
              - column:
                  name: object_id
                  type: uuid
                  constraints:
                    nullable: true
              - column:
                  name: title
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: body
                  type: varchar(2000)
                  constraints:
                    nullable: true
              - column:
                  name: read_at
                  type: timestamp with time zone
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: notifications
            baseColumnNames: recipient_user_id, organization_id
            referencedTableName: users
            referencedColumnNames: id, organization_id
            constraintName: fk_notifications_recipient_organization
            onDelete: CASCADE
        - createIndex:
            tableName: notifications
            indexName: idx_notifications_recipient_read
            columns:
              - column:
                  name: recipient_user_id
              - column:
                  name: read_at
        - sql:
            comment: "Closed vocabulary for notifications.type, mirroring chk_audit_log_event_type."
            sql: >
              ALTER TABLE notifications
              ADD CONSTRAINT chk_notifications_type
              CHECK (type IN ('LIBRARY_ASSOCIATED_TO_MIXED_SPACE'));
      rollback:
        - dropTable:
            tableName: notifications
