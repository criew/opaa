databaseChangeLog:
  # #513: an indexing run's protocol of skipped/rejected items and errors - before this issue,
  # the only trace of why a run's documentsSkipped/documentsFailed count was lower than the
  # number of items its source offered was the backend log (see the issue's motivating BMF case:
  # 19 of 20 RSS entries skipped by bot protection, invisible without server access). ON DELETE
  # CASCADE (not SET NULL, unlike indexing_jobs.library_id in migration 019): an event with no
  # job to belong to is meaningless, not merely stale history - IndexingJobService#pruneOldRuns
  # relies on exactly this cascade to remove a pruned run's events without needing to know about
  # this table itself.
  - changeSet:
      id: 037-create-indexing-run-events
      author: opaa
      comment: "Create indexing_run_events table for per-run skip/error protocols (#513)"
      changes:
        - createTable:
            tableName: indexing_run_events
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: job_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: category
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: message
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: reference
                  type: text
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: indexing_run_events
            baseColumnNames: job_id
            referencedTableName: indexing_jobs
            referencedColumnNames: id
            constraintName: fk_indexing_run_events_job
            onDelete: CASCADE
        - createIndex:
            indexName: idx_indexing_run_events_job_id
            tableName: indexing_run_events
            columns:
              - column:
                  name: job_id
        - sql:
            comment: "Add check constraint for indexing run event category values"
            sql: >
              ALTER TABLE indexing_run_events
              ADD CONSTRAINT chk_indexing_run_events_category
              CHECK (category IN ('REJECTED', 'UNREACHABLE', 'UNSUPPORTED_FORMAT', 'ALLOWLIST', 'ERROR'));
      rollback:
        - dropTable:
            tableName: indexing_run_events
