databaseChangeLog:
  # #862 (Epic #826, Befund B4): chk_notifications_type replicated the chk_audit_log_event_type
  # pattern (052) that grows one migration per new value - dropped here before it accumulates the
  # same history. The Java enum (@Enumerated(STRING)) remains the sole write guard; a value outside
  # it is no longer stopped by the database, only by the application.
  - changeSet:
      id: 066-drop-notifications-type-check
      author: opaa
      comment: >
        Drops chk_notifications_type. See this file's header comment for the trade-off.
      changes:
        - sql:
            sql: "ALTER TABLE notifications DROP CONSTRAINT chk_notifications_type;"
      rollback:
        - sql:
            sql: >
              ALTER TABLE notifications
              ADD CONSTRAINT chk_notifications_type
              CHECK (type IN ('LIBRARY_ASSOCIATED_TO_MIXED_SPACE'));
