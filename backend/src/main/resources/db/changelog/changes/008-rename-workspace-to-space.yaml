databaseChangeLog:
  # Rollback order (reverse of apply order), see docs/migrations/008-rename-workspace-to-space.md:
  # 008-add-space-memberships-organization
  # 008-remap-space-membership-roles
  # 008-rename-workspace-memberships-to-space-memberships
  # 008-add-spaces-organization
  # 008-add-spaces-visibility
  # 008-migrate-spaces-kind
  # 008-rename-workspaces-to-spaces
  # 008-add-users-organization
  # 008-seed-default-organization
  # 008-create-organizations-table
  #
  # Every changeSet below is a single Postgres transaction (Liquibase's default for DDL on
  # Postgres). If a run aborts, already-applied changeSets are recorded in
  # DATABASECHANGELOG and are skipped on the next run - re-running this changelog resumes
  # exactly where it stopped, and no changeSet leaves the schema half-updated.

  - changeSet:
      id: 008-create-organizations-table
      author: opaa
      comment: "Create organizations table - the hard tenant boundary"
      changes:
        - createTable:
            tableName: organizations
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: organizations

  - changeSet:
      id: 008-seed-default-organization
      author: opaa
      comment: "Seed exactly one organization; multi-organization management is out of scope here"
      changes:
        - insert:
            tableName: organizations
            columns:
              - column:
                  name: id
                  value: "00000000-0000-0000-0000-000000000001"
              - column:
                  name: name
                  value: "Default"
      rollback:
        - delete:
            tableName: organizations
            where: "id = '00000000-0000-0000-0000-000000000001'"

  - changeSet:
      id: 008-add-users-organization
      author: opaa
      comment: "Assign every existing user to the seeded organization"
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: organization_id
                  type: uuid
        - sql:
            comment: "Backfill existing users with the default organization"
            sql: >
              UPDATE users SET organization_id = '00000000-0000-0000-0000-000000000001'
              WHERE organization_id IS NULL;
        - addNotNullConstraint:
            tableName: users
            columnName: organization_id
            columnDataType: uuid
        - addForeignKeyConstraint:
            baseTableName: users
            baseColumnNames: organization_id
            referencedTableName: organizations
            referencedColumnNames: id
            constraintName: fk_users_organization
            onDelete: RESTRICT
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: users
            constraintName: fk_users_organization
        - dropColumn:
            tableName: users
            columnName: organization_id

  - changeSet:
      id: 008-rename-workspaces-to-spaces
      author: opaa
      comment: "Rename workspaces table to spaces; ownerId and timestamps are unaffected"
      changes:
        - renameTable:
            oldTableName: workspaces
            newTableName: spaces
        - dropForeignKeyConstraint:
            baseTableName: spaces
            constraintName: fk_workspaces_owner
        - addForeignKeyConstraint:
            baseTableName: spaces
            baseColumnNames: owner_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_spaces_owner
            onDelete: RESTRICT
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: spaces
            constraintName: fk_spaces_owner
        - addForeignKeyConstraint:
            baseTableName: spaces
            baseColumnNames: owner_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_workspaces_owner
            onDelete: RESTRICT
        - renameTable:
            oldTableName: spaces
            newTableName: workspaces

  - changeSet:
      id: 008-migrate-spaces-kind
      author: opaa
      comment: >
        Replace the workspace `type` column (PERSONAL, SHARED) with `kind`
        (PERSONAL, PROJECT, TEAM). Historical SHARED workspaces could only be created by
        a system administrator, which matches TEAM semantics most closely, so SHARED maps
        to TEAM. PERSONAL stays PERSONAL.
      changes:
        - addColumn:
            tableName: spaces
            columns:
              - column:
                  name: kind
                  type: varchar(20)
        - sql:
            comment: "Map historical workspace types onto the new space kinds"
            sql: >
              UPDATE spaces SET kind = CASE type
                WHEN 'PERSONAL' THEN 'PERSONAL'
                ELSE 'TEAM'
              END;
        - addNotNullConstraint:
            tableName: spaces
            columnName: kind
            columnDataType: varchar(20)
        - sql:
            comment: "Add check constraint for space kind values"
            sql: >
              ALTER TABLE spaces
              ADD CONSTRAINT chk_spaces_kind
              CHECK (kind IN ('PERSONAL', 'PROJECT', 'TEAM'));
        - sql:
            comment: "Drop the old check constraint for workspace type values"
            sql: >
              ALTER TABLE spaces
              DROP CONSTRAINT IF EXISTS chk_workspaces_type;
        - dropColumn:
            tableName: spaces
            columnName: type
      rollback:
        - addColumn:
            tableName: spaces
            columns:
              - column:
                  name: type
                  type: varchar(20)
        - sql:
            sql: >
              UPDATE spaces SET type = CASE kind
                WHEN 'PERSONAL' THEN 'PERSONAL'
                ELSE 'SHARED'
              END;
        - addNotNullConstraint:
            tableName: spaces
            columnName: type
            columnDataType: varchar(20)
        - sql:
            sql: >
              ALTER TABLE spaces
              ADD CONSTRAINT chk_workspaces_type
              CHECK (type IN ('PERSONAL', 'SHARED'));
        - sql:
            sql: >
              ALTER TABLE spaces
              DROP CONSTRAINT IF EXISTS chk_spaces_kind;
        - dropColumn:
            tableName: spaces
            columnName: kind

  - changeSet:
      id: 008-add-spaces-visibility
      author: opaa
      comment: "Add visibility to spaces; existing spaces default to PRIVATE"
      changes:
        - addColumn:
            tableName: spaces
            columns:
              - column:
                  name: visibility
                  type: varchar(20)
                  defaultValue: PRIVATE
                  constraints:
                    nullable: false
        - sql:
            comment: "Add check constraint for space visibility values"
            sql: >
              ALTER TABLE spaces
              ADD CONSTRAINT chk_spaces_visibility
              CHECK (visibility IN ('PRIVATE', 'DISCOVERABLE', 'OPEN'));
      rollback:
        - sql:
            sql: >
              ALTER TABLE spaces
              DROP CONSTRAINT IF EXISTS chk_spaces_visibility;
        - dropColumn:
            tableName: spaces
            columnName: visibility

  - changeSet:
      id: 008-add-spaces-organization
      author: opaa
      comment: "Assign every existing space to the seeded organization"
      changes:
        - addColumn:
            tableName: spaces
            columns:
              - column:
                  name: organization_id
                  type: uuid
        - sql:
            comment: "Backfill existing spaces with the default organization"
            sql: >
              UPDATE spaces SET organization_id = '00000000-0000-0000-0000-000000000001'
              WHERE organization_id IS NULL;
        - addNotNullConstraint:
            tableName: spaces
            columnName: organization_id
            columnDataType: uuid
        - addForeignKeyConstraint:
            baseTableName: spaces
            baseColumnNames: organization_id
            referencedTableName: organizations
            referencedColumnNames: id
            constraintName: fk_spaces_organization
            onDelete: RESTRICT
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: spaces
            constraintName: fk_spaces_organization
        - dropColumn:
            tableName: spaces
            columnName: organization_id

  - changeSet:
      id: 008-rename-workspace-memberships-to-space-memberships
      author: opaa
      comment: "Rename workspace_memberships table and its workspace_id column to space terms"
      changes:
        - renameTable:
            oldTableName: workspace_memberships
            newTableName: space_memberships
        - dropForeignKeyConstraint:
            baseTableName: space_memberships
            constraintName: fk_workspace_memberships_user
        - dropForeignKeyConstraint:
            baseTableName: space_memberships
            constraintName: fk_workspace_memberships_workspace
        - dropUniqueConstraint:
            tableName: space_memberships
            constraintName: uk_workspace_memberships_user_workspace
        - renameColumn:
            tableName: space_memberships
            oldColumnName: workspace_id
            newColumnName: space_id
            columnDataType: uuid
        - addForeignKeyConstraint:
            baseTableName: space_memberships
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_space_memberships_user
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: space_memberships
            baseColumnNames: space_id
            referencedTableName: spaces
            referencedColumnNames: id
            constraintName: fk_space_memberships_space
            onDelete: CASCADE
        - addUniqueConstraint:
            tableName: space_memberships
            columnNames: user_id, space_id
            constraintName: uk_space_memberships_user_space
      rollback:
        - dropUniqueConstraint:
            tableName: space_memberships
            constraintName: uk_space_memberships_user_space
        - dropForeignKeyConstraint:
            baseTableName: space_memberships
            constraintName: fk_space_memberships_space
        - dropForeignKeyConstraint:
            baseTableName: space_memberships
            constraintName: fk_space_memberships_user
        - renameColumn:
            tableName: space_memberships
            oldColumnName: space_id
            newColumnName: workspace_id
            columnDataType: uuid
        - addUniqueConstraint:
            tableName: space_memberships
            columnNames: user_id, workspace_id
            constraintName: uk_workspace_memberships_user_workspace
        - addForeignKeyConstraint:
            baseTableName: space_memberships
            baseColumnNames: workspace_id
            referencedTableName: spaces
            referencedColumnNames: id
            constraintName: fk_workspace_memberships_workspace
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: space_memberships
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_workspace_memberships_user
            onDelete: CASCADE
        - renameTable:
            oldTableName: space_memberships
            newTableName: workspace_memberships

  - changeSet:
      id: 008-remap-space-membership-roles
      author: opaa
      comment: >
        Remap membership roles: VIEWER->MEMBER, EDITOR->CURATOR, ADMIN->ADMIN, OWNER->ADMIN.
        No data is lost - the actual owner remains recorded in spaces.owner_id.
      changes:
        - sql:
            comment: "Remap workspace roles onto the three space roles"
            sql: >
              UPDATE space_memberships SET role = CASE role
                WHEN 'VIEWER' THEN 'MEMBER'
                WHEN 'EDITOR' THEN 'CURATOR'
                WHEN 'OWNER' THEN 'ADMIN'
                ELSE role
              END;
        - sql:
            comment: "Drop the old check constraint for workspace membership role values"
            sql: >
              ALTER TABLE space_memberships
              DROP CONSTRAINT IF EXISTS chk_workspace_memberships_role;
        - sql:
            comment: "Add check constraint for space membership role values"
            sql: >
              ALTER TABLE space_memberships
              ADD CONSTRAINT chk_space_memberships_role
              CHECK (role IN ('MEMBER', 'CURATOR', 'ADMIN'));
      rollback:
        - sql:
            sql: >
              ALTER TABLE space_memberships
              DROP CONSTRAINT IF EXISTS chk_space_memberships_role;
        - sql:
            sql: >
              ALTER TABLE space_memberships
              ADD CONSTRAINT chk_workspace_memberships_role
              CHECK (role IN ('VIEWER', 'EDITOR', 'ADMIN', 'OWNER'));
        - sql:
            comment: >
              The reverse mapping is lossy by construction (ADMIN no longer distinguishes
              the former OWNER); rows keep their current role value on rollback and must be
              reviewed manually where that distinction matters.
            sql: >
              UPDATE space_memberships SET role = CASE role
                WHEN 'MEMBER' THEN 'VIEWER'
                WHEN 'CURATOR' THEN 'EDITOR'
                ELSE role
              END;

  - changeSet:
      id: 008-add-space-memberships-organization
      author: opaa
      comment: "Assign every existing space membership to the seeded organization"
      changes:
        - addColumn:
            tableName: space_memberships
            columns:
              - column:
                  name: organization_id
                  type: uuid
        - sql:
            comment: "Backfill existing space memberships with the default organization"
            sql: >
              UPDATE space_memberships SET organization_id = '00000000-0000-0000-0000-000000000001'
              WHERE organization_id IS NULL;
        - addNotNullConstraint:
            tableName: space_memberships
            columnName: organization_id
            columnDataType: uuid
        - addForeignKeyConstraint:
            baseTableName: space_memberships
            baseColumnNames: organization_id
            referencedTableName: organizations
            referencedColumnNames: id
            constraintName: fk_space_memberships_organization
            onDelete: RESTRICT
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: space_memberships
            constraintName: fk_space_memberships_organization
        - dropColumn:
            tableName: space_memberships
            columnName: organization_id
