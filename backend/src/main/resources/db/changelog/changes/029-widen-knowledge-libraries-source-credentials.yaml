databaseChangeLog:
  - changeSet:
      id: 029-widen-knowledge-libraries-source-credentials
      author: opaa
      comment: >
        #483 (ADR-0018, Entscheidung 4): knowledge_libraries.source_credentials moves from
        cleartext to CredentialsEncryptor's AES-256-GCM encoding ("enc:v1:" + base64(iv ||
        ciphertext || tag)), which needs more room than the varchar(500) migration 027 gave the
        cleartext value it replaces. Worst case: the 500-character plaintext LibraryRequest.
        sourceCredentials still allows (openapi/opaa-api.yaml, unchanged by this issue), encoded
        as up to 2000 UTF-8 bytes, plus a 12-byte IV and 16-byte GCM tag = 2028 bytes, base64-
        encoded to 2704 characters, plus the 7-character "enc:v1:" prefix = 2711 characters.
        3000 leaves headroom without another migration for a small prefix/format change.
        Migration only, no data change: this changeSet runs before the application (and its key)
        exist for a given deployment, so it cannot itself encrypt the legacy cleartext rows still
        sitting in this column - CredentialsEncryptor's decrypt() treats any value without the
        "enc:v1:" prefix as legacy cleartext and returns it unchanged (see its Javadoc); the next
        write to a given row (any credential rotation via the existing update API) encrypts it.
        Rollback caveat: rolling back to varchar(500) fails outright for any row that by then holds
        an encrypted ("enc:v1:...") value longer than 500 characters - Postgres raises a "value too
        long for type" error on the ALTER COLUMN, since narrowing does not truncate. A rollback is
        therefore only safe before any credentials have actually been encrypted under this widened
        column.
      changes:
        - modifyDataType:
            tableName: knowledge_libraries
            columnName: source_credentials
            newDataType: varchar(3000)
      rollback:
        - modifyDataType:
            tableName: knowledge_libraries
            columnName: source_credentials
            newDataType: varchar(500)
