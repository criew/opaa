databaseChangeLog:
  - changeSet:
      id: 009-chunk-full-text-skip-table
      author: opaa
      comment: >-
        #1093: tracks a chunk the full-text backfill (io.opaa.indexing.FullTextBackfillService)
        cannot index - a "poison chunk" candidate - instead of retrying it, and therefore the whole
        batch containing it, forever. Keyed by chunk_id like chunk_full_text itself;
        content_tsv_version records which version the failing attempt was made at, mirroring
        chunk_full_text's own version column - a later version bump (the lexical analysis chain
        changed) makes the row eligible for a fresh attempt again, exactly like a stale
        chunk_full_text row would be. attempts counts consecutive failures at the current
        content_tsv_version; only once it reaches FullTextBackfillService's confirmation threshold
        is the chunk excluded from further selection - a transient failure that heals within a
        couple of ticks (e.g. a concurrent DELETE on the same row, a lock timeout) never reaches
        that threshold and the chunk is retried normally. sqlstate is the PostgreSQL error class
        (e.g. 54000) that classified the failure as attributable to this row rather than to the
        database itself - nullable, since a non-SQL failure (a malformed document_id/library_id
        metadata value) can also be recorded here. document_id is likewise nullable: a chunk whose
        document_id metadata is not even a well-formed UUID is recorded here immediately (see
        FullTextBackfillService's own handling of that case) with a null document_id rather than
        being dropped from selection entirely - dropping it would leave it permanently pending,
        which keeps a library's chunk_full_text_skip-aware completion check from ever reporting
        that library complete. No FK to vector_store for the same reason
        003-chunk-full-text-table.yaml has none: that table is not Liquibase-owned.
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE TABLE IF NOT EXISTS public.chunk_full_text_skip (
                  chunk_id uuid NOT NULL PRIMARY KEY,
                  document_id uuid,
                  library_id uuid NOT NULL,
                  content_tsv_version smallint NOT NULL,
                  error_message text NOT NULL,
                  sqlstate text,
                  attempts smallint NOT NULL DEFAULT 1,
                  skipped_at timestamptz NOT NULL DEFAULT now()
              );
              CREATE INDEX IF NOT EXISTS idx_chunk_full_text_skip_library_id ON public.chunk_full_text_skip (library_id);
      rollback:
        - sql:
            sql: DROP TABLE IF EXISTS public.chunk_full_text_skip CASCADE;
