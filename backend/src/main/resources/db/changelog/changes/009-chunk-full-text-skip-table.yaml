databaseChangeLog:
  - changeSet:
      id: 009-chunk-full-text-skip-table
      author: opaa
      comment: >-
        #1093: persists a chunk the full-text backfill (io.opaa.indexing.FullTextBackfillService)
        gave up on permanently ("poison chunk", e.g. content to_tsvector cannot process) instead of
        retrying it - and therefore the whole batch containing it - forever. Keyed by chunk_id like
        chunk_full_text itself; content_tsv_version records which version the failing attempt was
        made at, mirroring chunk_full_text's own version column - a later version bump (the lexical
        analysis chain changed) makes the row eligible for a fresh attempt again, exactly like a
        stale chunk_full_text row would be. No FK to vector_store for the same reason
        003-chunk-full-text-table.yaml has none: that table is not Liquibase-owned.
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE TABLE IF NOT EXISTS public.chunk_full_text_skip (
                  chunk_id uuid NOT NULL PRIMARY KEY,
                  document_id uuid NOT NULL,
                  library_id uuid NOT NULL,
                  content_tsv_version smallint NOT NULL,
                  error_message text NOT NULL,
                  skipped_at timestamptz NOT NULL DEFAULT now()
              );
              CREATE INDEX IF NOT EXISTS idx_chunk_full_text_skip_library_id ON public.chunk_full_text_skip (library_id);
      rollback:
        - sql:
            sql: DROP TABLE IF EXISTS public.chunk_full_text_skip CASCADE;
