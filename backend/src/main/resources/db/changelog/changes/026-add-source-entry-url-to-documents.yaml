databaseChangeLog:
  - changeSet:
      id: 026-add-source-entry-url-to-documents
      author: opaa
      comment: >
        Adds source_entry_url to documents: for an attachment discovered on an RSS entry's detail
        page (#468), this is that entry's own file_path (the detail page URL) - the trace back to
        "which entry does this attachment belong to" the #468 acceptance criteria require. NULL for
        every other document, including the RSS entry's own row and every FILESYSTEM/HTTP_DIRECTORY/
        UPLOAD document, none of which have a second document they were found through. Deliberately
        not a foreign key to documents.id: an attachment is discovered and downloaded before its
        owning entry's row is known to still exist by the time the attachment itself is processed
        (the entry's own document row is looked up by file_path, not by id, and could in rare cases
        already have been replaced by a re-index), and the column exists purely for attribution, not
        for referential integrity a query needs to rely on.
      changes:
        - addColumn:
            tableName: documents
            columns:
              - column:
                  name: source_entry_url
                  type: varchar(2000)
                  constraints:
                    nullable: true
      rollback:
        - dropColumn:
            tableName: documents
            columnName: source_entry_url
