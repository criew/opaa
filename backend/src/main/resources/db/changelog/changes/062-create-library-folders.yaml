databaseChangeLog:
  # #820 (Epic #520 Phase 2, ADR-0020): library_folders is a real entity rather than a virtual path
  # prefix on documents, so an empty folder can exist and rename/move stay single-row updates - see
  # the ADR's Entscheidung 2 for the full reasoning. Three changeSets:
  #   1. 062-create-library-folders          - the table itself, self-referencing parent
  #   2. 062-add-library-folder-uniqueness   - two partial unique indexes instead of one plain
  #                                             unique constraint, because a plain unique constraint
  #                                             on (library_id, parent_folder_id, name) would not
  #                                             enforce uniqueness among root-level folders at all
  #                                             (Postgres never considers two NULLs equal)
  #   3. 062-add-folder-id-to-documents      - the nullable documents.folder_id column, null meaning
  #                                             the library's root, mirroring library_folders'
  #                                             own null parent_folder_id
  #
  # Every foreign key here that points from one organization_id-carrying table to another is
  # composite - never a plain single-column key - per the schema-wide rule
  # OrganizationBoundarySchemaTest (#390) enforces. fk_library_folders_parent and fk_documents_folder
  # go one step further than the minimum that rule requires (organization_id alone): both also carry
  # library_id, so a parent/folder reference can never cross library boundaries within the same
  # organization either - a document from library B could otherwise reference a folder in library A
  # (both in the same organization), which would make LibraryFolderService#deleteRecursive 404 on
  # that document's own library check while fk_documents_folder's RESTRICT still refused to let the
  # foreign folder be deleted. uk_library_folders_id_library_organization on (id, library_id,
  # organization_id) is what both self- and cross-table references below target for exactly that
  # reason.

  - changeSet:
      id: 062-create-library-folders
      author: opaa
      comment: >
        library_folders has no cross-cutting side effects of its own (no file, no vector store
        chunk) - unlike documents, whose deletion the application service must drive (ADR-0020,
        Entscheidung 5), a folder row can be safely cascade-deleted with its owning library.
        parent_folder_id, by contrast, uses RESTRICT: LibraryFolderService always deletes a
        folder's children (their documents, then their own rows) before the folder itself, leaf to
        root - RESTRICT turns any future violation of that order into a loud database error instead
        of a silent orphaned subtree. organization_id is denormalized from the owning library, the
        same pattern documents.organization_id already uses, so a query never needs a join back to
        knowledge_libraries to filter by organization. uk_library_folders_id_library_organization on
        (id, library_id, organization_id) - not just (id, organization_id) - is what
        fk_library_folders_parent (this changeSet) and fk_documents_folder
        (062-add-folder-id-to-documents) both reference: binding library_id into the key, not only
        organization_id, additionally guarantees a parent folder (or a document's folder) always
        belongs to the very same library as the row referencing it, not merely the same
        organization - see this file's header comment.
      changes:
        - createTable:
            tableName: library_folders
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: library_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: parent_folder_id
                  type: uuid
                  constraints:
                    nullable: true
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: organization_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: library_folders
            columnNames: id, library_id, organization_id
            constraintName: uk_library_folders_id_library_organization
        - addForeignKeyConstraint:
            baseTableName: library_folders
            baseColumnNames: library_id, organization_id
            referencedTableName: knowledge_libraries
            referencedColumnNames: id, organization_id
            constraintName: fk_library_folders_library
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: library_folders
            baseColumnNames: parent_folder_id, library_id, organization_id
            referencedTableName: library_folders
            referencedColumnNames: id, library_id, organization_id
            constraintName: fk_library_folders_parent
            onDelete: RESTRICT
        - createIndex:
            tableName: library_folders
            indexName: idx_library_folders_parent
            columns:
              - column:
                  name: parent_folder_id
      rollback:
        - dropIndex:
            tableName: library_folders
            indexName: idx_library_folders_parent
        - dropForeignKeyConstraint:
            baseTableName: library_folders
            constraintName: fk_library_folders_parent
        - dropForeignKeyConstraint:
            baseTableName: library_folders
            constraintName: fk_library_folders_library
        - dropUniqueConstraint:
            tableName: library_folders
            constraintName: uk_library_folders_id_library_organization
        - dropTable:
            tableName: library_folders

  - changeSet:
      id: 062-add-library-folder-uniqueness
      author: opaa
      comment: >
        Two partial unique indexes, not one plain unique constraint on (library_id,
        parent_folder_id, name) - Postgres never treats two NULLs as equal, so a plain constraint
        would let arbitrarily many root-level folders (parent_folder_id IS NULL) share the same
        name in the same library. Mirrors uk_documents_library_checksum's partial-index approach
        (020-add-upload-metadata-to-documents.yaml).
      changes:
        - sql:
            comment: "Root-level folders: unique name per library among rows with no parent"
            sql: >
              CREATE UNIQUE INDEX uk_library_folders_root_name
              ON library_folders (library_id, name)
              WHERE parent_folder_id IS NULL;
        - sql:
            comment: "Nested folders: unique name per parent"
            sql: >
              CREATE UNIQUE INDEX uk_library_folders_child_name
              ON library_folders (library_id, parent_folder_id, name)
              WHERE parent_folder_id IS NOT NULL;
      rollback:
        - sql:
            sql: "DROP INDEX IF EXISTS uk_library_folders_child_name;"
        - sql:
            sql: "DROP INDEX IF EXISTS uk_library_folders_root_name;"

  - changeSet:
      id: 062-add-folder-id-to-documents
      author: opaa
      comment: >
        documents.folder_id, nullable - null means the document sits at the library's root, the
        same convention library_folders.parent_folder_id uses one level up. RESTRICT:
        LibraryFolderService#deleteFolder always removes every document referencing a folder before
        deleting that folder's own row - see 062-create-library-folders' identical reasoning for
        parent_folder_id. Composite (folder_id, library_id, organization_id) against
        uk_library_folders_id_library_organization, same as that changeSet's own
        fk_library_folders_parent (#390 plus the library-boundary guarantee described in this file's
        header comment) - a document can never reference a folder from a different library, even
        within the same organization.
      changes:
        - addColumn:
            tableName: documents
            columns:
              - column:
                  name: folder_id
                  type: uuid
                  constraints:
                    nullable: true
        - addForeignKeyConstraint:
            baseTableName: documents
            baseColumnNames: folder_id, library_id, organization_id
            referencedTableName: library_folders
            referencedColumnNames: id, library_id, organization_id
            constraintName: fk_documents_folder
            onDelete: RESTRICT
        - createIndex:
            tableName: documents
            indexName: idx_documents_folder
            columns:
              - column:
                  name: folder_id
      rollback:
        - dropIndex:
            tableName: documents
            indexName: idx_documents_folder
        - dropForeignKeyConstraint:
            baseTableName: documents
            constraintName: fk_documents_folder
        - dropColumn:
            tableName: documents
            columnName: folder_id
