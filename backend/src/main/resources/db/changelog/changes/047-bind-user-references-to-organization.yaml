            baseTableName: chats
            baseColumnNames: space_id
            referencedTableName: spaces
            referencedColumnNames: id
            constraintName: fk_chats_space
            onDelete: RESTRICT
        - dropForeignKeyConstraint:
            baseTableName: chats
            constraintName: fk_chats_author_organization
        - addForeignKeyConstraint:
            baseTableName: chats
            baseColumnNames: author_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_chats_author
            onDelete: RESTRICT
        - dropForeignKeyConstraint:
            baseTableName: group_membership_history
            constraintName: fk_group_membership_history_user_organization
        - addForeignKeyConstraint:
