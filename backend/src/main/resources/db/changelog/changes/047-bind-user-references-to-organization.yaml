            baseColumnNames: requested_by_user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_audit_incident_scope_grants_requester
            onDelete: RESTRICT
        - dropForeignKeyConstraint:
            baseTableName: audit_incident_scope_grants
            constraintName: fk_audit_incident_scope_grants_subject_organization
        - addForeignKeyConstraint:
            baseTableName: audit_incident_scope_grants
            baseColumnNames: subject_user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_audit_incident_scope_grants_subject
            onDelete: RESTRICT
        - dropForeignKeyConstraint:
            baseTableName: audit_actor_pseudonyms
            constraintName: fk_audit_actor_pseudonyms_user_organization
        - addForeignKeyConstraint:
            baseTableName: audit_actor_pseudonyms
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_audit_actor_pseudonyms_user
            onDelete: CASCADE
        - dropForeignKeyConstraint:
            baseTableName: asset_grants
            constraintName: fk_asset_grants_granted_by_user_organization
        - addForeignKeyConstraint:
            baseTableName: asset_grants
            baseColumnNames: granted_by_user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_asset_grants_granted_by_user
            onDelete: RESTRICT
        - dropForeignKeyConstraint:
            baseTableName: asset_grants
            constraintName: fk_asset_grants_subject_user_organization
        - addForeignKeyConstraint:
            baseTableName: asset_grants
            baseColumnNames: subject_user_id
