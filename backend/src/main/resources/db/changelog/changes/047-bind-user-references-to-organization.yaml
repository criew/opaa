            baseColumnNames: granted_by_user_id, organization_id
            referencedTableName: users
            referencedColumnNames: id, organization_id
            constraintName: fk_asset_grants_granted_by_user_organization
            onDelete: RESTRICT
        # audit_actor_pseudonyms.user_id (CASCADE)
        - dropForeignKeyConstraint:
            baseTableName: audit_actor_pseudonyms
            constraintName: fk_audit_actor_pseudonyms_user
        - addForeignKeyConstraint:
            baseTableName: audit_actor_pseudonyms
            baseColumnNames: user_id, organization_id
            referencedTableName: users
            referencedColumnNames: id, organization_id
            constraintName: fk_audit_actor_pseudonyms_user_organization
            onDelete: CASCADE
        # audit_incident_scope_grants.subject_user_id (RESTRICT)
        - dropForeignKeyConstraint:
            baseTableName: audit_incident_scope_grants
            constraintName: fk_audit_incident_scope_grants_subject
        - addForeignKeyConstraint:
            baseTableName: audit_incident_scope_grants
            baseColumnNames: subject_user_id, organization_id
            referencedTableName: users
            referencedColumnNames: id, organization_id
            constraintName: fk_audit_incident_scope_grants_subject_organization
            onDelete: RESTRICT
        # audit_incident_scope_grants.requested_by_user_id (RESTRICT)
        - dropForeignKeyConstraint:
            baseTableName: audit_incident_scope_grants
            constraintName: fk_audit_incident_scope_grants_requester
        - addForeignKeyConstraint:
            baseTableName: audit_incident_scope_grants
            baseColumnNames: requested_by_user_id, organization_id
            referencedTableName: users
            referencedColumnNames: id, organization_id
            constraintName: fk_audit_incident_scope_grants_requester_organization
            onDelete: RESTRICT
        # audit_incident_scope_grants.approved_by_user_id (RESTRICT)
        - dropForeignKeyConstraint:
            baseTableName: audit_incident_scope_grants
            constraintName: fk_audit_incident_scope_grants_approver
        - addForeignKeyConstraint:
            baseTableName: audit_incident_scope_grants
            baseColumnNames: approved_by_user_id, organization_id
            referencedTableName: users
            referencedColumnNames: id, organization_id
            constraintName: fk_audit_incident_scope_grants_approver_organization
            onDelete: RESTRICT
        # asset_grant_history.subject_user_id (RESTRICT)
        - dropForeignKeyConstraint:
            baseTableName: asset_grant_history
            constraintName: fk_asset_grant_history_subject_user
        - addForeignKeyConstraint:
            baseTableName: asset_grant_history
            baseColumnNames: subject_user_id, organization_id
            referencedTableName: users
