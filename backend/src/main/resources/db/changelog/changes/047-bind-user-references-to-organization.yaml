            referencedColumnNames: id
            constraintName: fk_spaces_owner
            onDelete: RESTRICT

  - changeSet:
      id: 047-bind-user-references-to-organization-set-null
      author: opaa
      comment: >
        The remaining 4 of the 18 foreign keys from this file's top-level comment: ON DELETE SET
        NULL composite keys need Postgres 15+'s column-list syntax
        ("ON DELETE SET NULL (<column>)"), the same reasoning migration 046's own bind changeSet
        documents in full - organization_id is NOT NULL and belongs to the row itself, not to the
        deleted user, so the plain (whole-row) SET NULL that addForeignKeyConstraint would generate
        for a composite key is not an option: it would try to null organization_id too and fail
        that NOT NULL constraint on every referenced user's deletion. Each rollback restores the
        original single-column foreign key; it always succeeds because the composite constraint it
        replaces is strictly stronger, so no row can violate the weaker one.
      changes:
        - sql:
            comment: "documents.uploaded_by_user_id (migration 020)"
            sql: >
              ALTER TABLE documents DROP CONSTRAINT fk_documents_uploaded_by_user;
              ALTER TABLE documents
              ADD CONSTRAINT fk_documents_uploaded_by_user_organization
              FOREIGN KEY (uploaded_by_user_id, organization_id)
              REFERENCES users (id, organization_id)
              ON DELETE SET NULL (uploaded_by_user_id);
        - sql:
            comment: "asset_grant_history.actor_user_id (migration 018)"
            sql: >
              ALTER TABLE asset_grant_history DROP CONSTRAINT fk_asset_grant_history_actor_user;
              ALTER TABLE asset_grant_history
              ADD CONSTRAINT fk_asset_grant_history_actor_user_organization
              FOREIGN KEY (actor_user_id, organization_id)
              REFERENCES users (id, organization_id)
              ON DELETE SET NULL (actor_user_id);
        - sql:
            comment: "group_membership_history.actor_user_id (migration 018)"
            sql: >
              ALTER TABLE group_membership_history
              DROP CONSTRAINT fk_group_membership_history_actor_user;
              ALTER TABLE group_membership_history
              ADD CONSTRAINT fk_group_membership_history_actor_user_organization
              FOREIGN KEY (actor_user_id, organization_id)
              REFERENCES users (id, organization_id)
              ON DELETE SET NULL (actor_user_id);
        - sql:
            comment: "library_visibility_history.actor_user_id (migration 018)"
            sql: >
              ALTER TABLE library_visibility_history
              DROP CONSTRAINT fk_library_visibility_history_actor_user;
              ALTER TABLE library_visibility_history
              ADD CONSTRAINT fk_library_visibility_history_actor_user_organization
              FOREIGN KEY (actor_user_id, organization_id)
              REFERENCES users (id, organization_id)
              ON DELETE SET NULL (actor_user_id);
      rollback:
        - sql:
            sql: >
              ALTER TABLE library_visibility_history
              DROP CONSTRAINT fk_library_visibility_history_actor_user_organization;
              ALTER TABLE library_visibility_history
              ADD CONSTRAINT fk_library_visibility_history_actor_user
              FOREIGN KEY (actor_user_id)
              REFERENCES users (id)
              ON DELETE SET NULL;
        - sql:
            sql: >
              ALTER TABLE group_membership_history
              DROP CONSTRAINT fk_group_membership_history_actor_user_organization;
              ALTER TABLE group_membership_history
              ADD CONSTRAINT fk_group_membership_history_actor_user
              FOREIGN KEY (actor_user_id)
              REFERENCES users (id)
              ON DELETE SET NULL;
        - sql:
            sql: >
              ALTER TABLE asset_grant_history
              DROP CONSTRAINT fk_asset_grant_history_actor_user_organization;
              ALTER TABLE asset_grant_history
