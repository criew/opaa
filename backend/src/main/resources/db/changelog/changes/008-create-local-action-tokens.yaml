databaseChangeLog:
  # #1532 (ADR-0033 Entscheidung 3): single-use links - invitation (SET_PASSWORD), password reset
  # (RESET_PASSWORD), self-registration confirmation (VERIFY_EMAIL) and the handover of a local
  # account to a provider identity (HANDOVER, Entscheidung 12) - in one table with a purpose column
  # instead of qnop's two identical tables. Only the HMAC of the raw token is stored (key derived
  # from OPAA_AUTH_JWT_SECRET, purpose opaa:jwt:action-token-lookup); consumed_at marks redemption,
  # the atomic consume is an UPDATE guarded on consumed_at IS NULL (#1533). Single-column foreign
  # key: no organization_id here, see 005's comment.
  - changeSet:
      id: 008-create-local-action-tokens
      author: opaa
      comment: "local_action_tokens: single-use invitation, reset, verification and handover links with a purpose (#1532, ADR-0033)"
      changes:
        - createTable:
            tableName: local_action_tokens
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: local_action_tokens_pkey
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: purpose
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: token_hash
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: consumed_at
                  type: timestamp with time zone
        - addForeignKeyConstraint:
            baseTableName: local_action_tokens
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_local_action_tokens_user
            onDelete: CASCADE
        - addUniqueConstraint:
            tableName: local_action_tokens
            columnNames: token_hash
            constraintName: ux_local_action_tokens_hash
        - sql:
            sql: >
              ALTER TABLE local_action_tokens
              ADD CONSTRAINT chk_local_action_tokens_purpose
              CHECK (purpose IN ('SET_PASSWORD', 'RESET_PASSWORD', 'VERIFY_EMAIL', 'HANDOVER'));
        - createIndex:
            tableName: local_action_tokens
            indexName: idx_local_action_tokens_user_purpose
            columns:
              - column:
                  name: user_id
              - column:
                  name: purpose
        - createIndex:
            tableName: local_action_tokens
            indexName: idx_local_action_tokens_expires_at
            columns:
              - column:
                  name: expires_at
      rollback:
        - dropTable:
            tableName: local_action_tokens
