databaseChangeLog:
  # #1532 (ADR-0033 Entscheidung 3): the local fields live in a 1:1 side table keyed by users.id,
  # not as a dozen nullable columns on users (read in every request, and a "local => password set"
  # CHECK would not fit invited accounts without a password). The account state (INVITED, ACTIVE,
  # LOCKED, EXPIRED) is derived from these columns, never stored. Invariants the database carries:
  #   - password_change_required and password_change_reason come together (the person learns why)
  #   - locked_at and locked_reason come together (lock by administrator, failed logins or inactivity)
  #   - both reasons are enums; failed_login_attempts never negative
  #   - created_reason is mandatory, non-blank, at most 200 characters (purpose-bound, ADR 11)
  #   - at most one row is the bootstrap account (ux_local_credentials_single_bootstrap)
  # "A row exists exactly when users.issuer is the local issuer" is enforced by the single write path
  # of the local account service and an integration test, not by a trigger (ADR-0033, Entscheidung 3). The
  # foreign key is single-column on purpose: this table carries no organization_id of its own, so
  # the composite-key rule of MigrationBaselineTest does not apply to it.
  - changeSet:
      id: 006-create-local-credentials
      author: opaa
      comment: "local_credentials: 1:1 password and account-state columns of a local account (#1532, ADR-0033)"
      changes:
        - createTable:
            tableName: local_credentials
            columns:
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: local_credentials_pkey
                    nullable: false
              - column:
                  name: password_hash
                  type: varchar(255)
              - column:
                  name: password_change_required
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: password_change_reason
                  type: varchar(32)
              - column:
                  name: password_invalidated_before
                  type: timestamp with time zone
              - column:
                  name: locked_at
                  type: timestamp with time zone
              - column:
                  name: locked_reason
                  type: varchar(32)
              - column:
                  name: failed_login_attempts
                  type: integer
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: lockout_until
                  type: timestamp with time zone
              - column:
                  name: expires_at
                  type: timestamp with time zone
              - column:
                  name: email_verified_at
                  type: timestamp with time zone
              - column:
                  name: created_reason
                  type: varchar(200)
                  constraints:
                    nullable: false
              - column:
                  name: is_bootstrap
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: bigint
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: local_credentials
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_local_credentials_user
            onDelete: CASCADE
        - sql:
            comment: "Enum and pairing CHECKs, mandatory reason, single bootstrap row"
            sql: >
              ALTER TABLE local_credentials
              ADD CONSTRAINT chk_local_credentials_password_change_reason
              CHECK (password_change_reason IS NULL
                     OR password_change_reason IN ('INITIAL', 'ADMIN_RESET', 'SECURITY'));
              ALTER TABLE local_credentials
              ADD CONSTRAINT chk_local_credentials_password_change_consistent
              CHECK (password_change_required = (password_change_reason IS NOT NULL));
              ALTER TABLE local_credentials
              ADD CONSTRAINT chk_local_credentials_locked_reason
              CHECK (locked_reason IS NULL
                     OR locked_reason IN ('ADMIN', 'FAILED_LOGINS', 'INACTIVITY'));
              ALTER TABLE local_credentials
              ADD CONSTRAINT chk_local_credentials_lock_consistent
              CHECK ((locked_at IS NULL) = (locked_reason IS NULL));
              ALTER TABLE local_credentials
              ADD CONSTRAINT chk_local_credentials_failed_login_attempts
              CHECK (failed_login_attempts >= 0);
              ALTER TABLE local_credentials
              ADD CONSTRAINT chk_local_credentials_created_reason
              CHECK (btrim(created_reason) <> '');
              CREATE UNIQUE INDEX ux_local_credentials_single_bootstrap
              ON local_credentials (is_bootstrap) WHERE is_bootstrap;
      rollback:
        - dropTable:
            tableName: local_credentials
