databaseChangeLog:
  # #1532 (ADR-0033 Entscheidung 1): the e-mail address is the sign-in name of a local account,
  # unique case-insensitively - but only among local accounts. Accounts of an OIDC provider may
  # carry the same address (ADR-0025 keeps (issuer, subject) as the identity and forbids merging by
  # e-mail), so the index is partial on the local issuer. The application still stores the address
  # as entered; lower() is the comparison key only.
  - changeSet:
      id: 004-add-local-email-unique-index-to-users
      author: opaa
      comment: "Partial unique index lower(email) WHERE issuer = 'urn:opaa:local' (#1532, ADR-0033)"
      changes:
        - sql:
            sql: >
              CREATE UNIQUE INDEX ux_users_local_email
              ON users (lower(email)) WHERE issuer = 'urn:opaa:local';
      rollback:
        - sql:
            sql: "DROP INDEX IF EXISTS ux_users_local_email;"
