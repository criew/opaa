databaseChangeLog:
  # #485: LibraryIndexingScheduler records a SCHEDULE_SKIPPED event (io.opaa.indexing.
  # IndexingEventCategory) against the still-RUNNING job's own protocol when a scheduled tick finds
  # a library already indexing - widen-only, same shape as 024-allow-rss-feed-source-type (plain
  # DROP/ADD, indexing_run_events carries no special table ownership unlike audit_log).
  - changeSet:
      id: 053-widen-indexing-run-event-category-schedule-skipped
      author: opaa
      comment: "Widens chk_indexing_run_events_category to also accept SCHEDULE_SKIPPED (#485)"
      changes:
        - sql:
            comment: "Drop and recreate chk_indexing_run_events_category to include SCHEDULE_SKIPPED"
            sql: >
              ALTER TABLE indexing_run_events DROP CONSTRAINT chk_indexing_run_events_category;
              ALTER TABLE indexing_run_events
              ADD CONSTRAINT chk_indexing_run_events_category
              CHECK (category IN ('REJECTED', 'UNREACHABLE', 'UNSUPPORTED_FORMAT', 'ALLOWLIST', 'ERROR', 'SCHEDULE_SKIPPED'));
      rollback:
        - sql:
            sql: >
              ALTER TABLE indexing_run_events DROP CONSTRAINT chk_indexing_run_events_category;
              ALTER TABLE indexing_run_events
              ADD CONSTRAINT chk_indexing_run_events_category
              CHECK (category IN ('REJECTED', 'UNREACHABLE', 'UNSUPPORTED_FORMAT', 'ALLOWLIST', 'ERROR'));
