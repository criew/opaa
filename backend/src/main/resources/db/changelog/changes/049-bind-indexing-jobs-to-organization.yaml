databaseChangeLog:
  # #401: indexing_jobs never carried organization_id - not a considered exception, just a column
  # that was never added while every other organization-bound entity grew one. Harmless while
  # exactly one organization exists (the pre-multi-tenancy invariant #271/#289/#400 all rely on),
  # but a genuine gap the moment a second one is created: a run could not be attributed to an
  # organization at all, and (before #478 made concurrency per-library) a running job for one
  # organization's library could block another organization's trigger.
  #
  # Maintainer update (20.08.2026, comment on #401): library_id has been nullable with
  # ON DELETE SET NULL since migration 019 - after a library is deleted, a run's organization is
  # not reconstructable via library_id at all, and migration 003's original rows never had a
  # library_id to begin with. Deriving organization_id from library_id at query time (rather than
  # storing it directly) would therefore not even work for those rows. indexing_run_events is
  # deliberately *not* touched here - see the note at the bottom of this comment.
  #
  # Four changeSets, in dependency order:
  #   1. 049-add-organization-id-to-indexing-jobs   - the column, nullable for now (SQL below still
  #      needs to write into it before it can become NOT NULL)
  #   2. 049-backfill-indexing-jobs-organization-id - existing rows: derive organization_id from
  #      the target library where library_id is set, and fall back to the single existing
  #      organization otherwise (see that changeSet's own comment for why that fallback is safe)
  #   3. 049-enforce-indexing-jobs-organization-id  - NOT NULL + a plain foreign key against
  #      organizations(id) (organizations is the tenant root, not itself organization-bound, so a
  #      composite key does not apply here - mirrors fk_chats_organization, migration 032)
  #   4. 049-bind-indexing-jobs-library-to-organization - upgrades fk_indexing_jobs_library
  #      (migration 019, plain FK against knowledge_libraries(id)) to a composite FK against
  #      knowledge_libraries(id, organization_id), the same structural rule #390 will check for
  #      every organization_id-bearing table: a foreign key to an organization-bound target must
  #      carry organization_id alongside it, so library_id can never point at a library from a
  #      different organization than the one recorded on the job's own organization_id. No
  #      "cross-organization cleanup" step is needed here (unlike migration 046's
  #      046-clear-cross-organization-parent-groups for groups.parent_group_id): changeSet 2 above
  #      derives every non-null library_id row's organization_id from that very library, so no row
  #      can violate the composite key by construction.
  #
  # indexing_run_events is deliberately out of scope for this migration, on the maintainer's
  # explicit recommendation: it only ever references indexing_jobs via job_id, with
  # fk_indexing_run_events_job already ON DELETE CASCADE (migration 037) - an event with no job to
  # belong to is meaningless, exactly the same "strictly dependent child, no organization column of
  # its own" shape chat_messages already has relative to chats (migration 032:
  # fk_chat_messages_chat, ON DELETE CASCADE, no organization_id on chat_messages itself). Nothing
  # ever queries indexing_run_events directly by organization - every access path
  # (LibraryController#listIndexingRuns) goes through IndexingJobRepository first, which is exactly
  # where this migration adds the organization boundary.
  #
  # Rollback order (reverse of apply order):
  # 049-bind-indexing-jobs-library-to-organization
  # 049-enforce-indexing-jobs-organization-id
  # 049-backfill-indexing-jobs-organization-id (irreversible no-op, see its rollback block)
  # 049-add-organization-id-to-indexing-jobs

  - changeSet:
      id: 049-add-organization-id-to-indexing-jobs
      author: opaa
      comment: "Add nullable organization_id to indexing_jobs, backfilled by the next changeSet (#401)"
      changes:
        - addColumn:
            tableName: indexing_jobs
            columns:
              - column:
                  name: organization_id
                  type: uuid
      rollback:
        - dropColumn:
            tableName: indexing_jobs
            columnName: organization_id

  - changeSet:
      id: 049-backfill-indexing-jobs-organization-id
      author: opaa
      comment: >
        Backfills organization_id for every existing indexing_jobs row (#401). Two cases: a row
        with a library_id takes that library's own organization_id (the run demonstrably wrote
        into that library, so its organization is exactly the library's); a row without one -
        either a pre-#419 row (migration 003 predates library_id entirely) or one whose library was
        since deleted (ON DELETE SET NULL, migration 019) - falls back to the single organization
        seeded by migration 008. That fallback is only correct because #401 is itself the
        prerequisite for a second organization ever existing (#271/#289/#400 rely on the same
        precondition): every row in this table today was necessarily written while exactly one
        organization existed, so "the one existing organization" and "the row's true organization"
        are the same fact, not a guess.
      changes:
        - sql:
            sql: >
              UPDATE indexing_jobs AS job
              SET organization_id = library.organization_id
              FROM knowledge_libraries AS library
              WHERE job.library_id = library.id;
        - sql:
            sql: >
              UPDATE indexing_jobs
              SET organization_id = '00000000-0000-0000-0000-000000000001'
              WHERE organization_id IS NULL;
      rollback:
        - sql:
            comment: >
              Irreversible: nothing records which rows this changeSet actually touched versus
              already having a (hypothetically pre-set) organization_id - same reasoning as
              045-clear-rss-feed-state and 046-clear-cross-organization-parent-groups. Setting
              organization_id back to NULL for every row would not undo anything more precise than
              what the surrounding, lossless changeSets already roll back on their own.
            sql: "SELECT 1;"

  - changeSet:
      id: 049-enforce-indexing-jobs-organization-id
      author: opaa
      comment: >
        Every indexing_jobs row now belongs to exactly one organization (#401): organization_id is
        NOT NULL, and fk_indexing_jobs_organization enforces it against organizations(id). ON
        DELETE RESTRICT, not CASCADE - deleting an organization must not silently make its
        indexing history vanish; it must fail loudly until the organization's data is actually
        wound down (mirrors fk_chats_organization, migration 032).
      changes:
        - addNotNullConstraint:
            tableName: indexing_jobs
            columnName: organization_id
            columnDataType: uuid
        - addForeignKeyConstraint:
            baseTableName: indexing_jobs
            baseColumnNames: organization_id
            referencedTableName: organizations
            referencedColumnNames: id
            constraintName: fk_indexing_jobs_organization
            onDelete: RESTRICT
        - createIndex:
            tableName: indexing_jobs
            indexName: idx_indexing_jobs_organization_id
            columns:
              - column:
                  name: organization_id
      rollback:
        - dropIndex:
            tableName: indexing_jobs
            indexName: idx_indexing_jobs_organization_id
        - dropForeignKeyConstraint:
            baseTableName: indexing_jobs
            constraintName: fk_indexing_jobs_organization
        - dropNotNullConstraint:
            tableName: indexing_jobs
            columnName: organization_id
            columnDataType: uuid

  - changeSet:
      id: 049-bind-indexing-jobs-library-to-organization
      author: opaa
      comment: >
        Upgrades fk_indexing_jobs_library (migration 019, a plain foreign key against
        knowledge_libraries(id)) to a composite foreign key against
        knowledge_libraries(id, organization_id) - the #390 structural rule applied to the column
        this migration just added: a job can no longer name a library from a different organization
        than the one recorded on the job itself, enforced by the database, not just by
        DocumentIndexingService#loadLibraryInOrganization. Raw SQL rather than Liquibase's
        addForeignKeyConstraint changeType, for the same reason as
        046-bind-groups-parent-group-to-organization: ON DELETE SET NULL must be restricted to the
        library_id column alone (Postgres 15+ column-list syntax) because organization_id is NOT
        NULL and belongs to the job row itself, not to the deleted library - the plain (whole-row)
        SET NULL addForeignKeyConstraint would generate for a composite key would try to null
        organization_id too and fail that NOT NULL constraint on every library deletion. Uses the
        existing uk_knowledge_libraries_id_organization unique index (migration 012) as its target,
        the same one fk_documents_library_organization (migration 012) already relies on.
      changes:
        - sql:
            sql: >
              ALTER TABLE indexing_jobs DROP CONSTRAINT fk_indexing_jobs_library;
              ALTER TABLE indexing_jobs
              ADD CONSTRAINT fk_indexing_jobs_library_organization
              FOREIGN KEY (library_id, organization_id)
              REFERENCES knowledge_libraries (id, organization_id)
              ON DELETE SET NULL (library_id);
      rollback:
        - sql:
            sql: >
              ALTER TABLE indexing_jobs DROP CONSTRAINT fk_indexing_jobs_library_organization;
              ALTER TABLE indexing_jobs
              ADD CONSTRAINT fk_indexing_jobs_library
              FOREIGN KEY (library_id)
              REFERENCES knowledge_libraries (id)
              ON DELETE SET NULL;
