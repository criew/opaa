databaseChangeLog:
  # #1532 (ADR-0033 Entscheidung 7): the jti denylist for individual access tokens (logout), read
  # through a Caffeine cache by the revocation validator (#1533). Rows live until the token's own
  # expiry plus the cleanup grace period, so the SHA-256 of the jti is the key itself - a jti is a
  # random UUID, not a bearer secret, so an unkeyed hash is enough and the list survives a rotation
  # of OPAA_AUTH_JWT_SECRET (which invalidates every access token anyway). Single-column foreign
  # key: no organization_id here, see 005's comment.
  - changeSet:
      id: 008-create-local-revoked-tokens
      author: opaa
      comment: "local_revoked_tokens: jti denylist of revoked access tokens (#1532, ADR-0033)"
      changes:
        - createTable:
            tableName: local_revoked_tokens
            columns:
              - column:
                  name: jti_hash
                  type: varchar(64)
                  constraints:
                    primaryKey: true
                    primaryKeyName: local_revoked_tokens_pkey
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: revoked_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: local_revoked_tokens
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_local_revoked_tokens_user
            onDelete: CASCADE
        - createIndex:
            tableName: local_revoked_tokens
            indexName: idx_local_revoked_tokens_expires_at
            columns:
              - column:
                  name: expires_at
        - createIndex:
            tableName: local_revoked_tokens
            indexName: idx_local_revoked_tokens_user
            columns:
              - column:
                  name: user_id
      rollback:
        - dropTable:
            tableName: local_revoked_tokens
