databaseChangeLog:
  - changeSet:
      id: 024-allow-rss-feed-source-type
      author: opaa
      comment: >
        Widen chk_documents_source_type (migration 004, last widened by 020-allow-upload-source-type)
        to also accept RSS_FEED (DocumentSourceType#RSS_FEED, #466), the value a future RSS
        indexing run (#467) writes for documents discovered through an RSS-2.0 feed. Same drop-and-
        recreate pattern as 020-allow-upload-source-type - the already-executed changeSet is never
        edited, a new one widens the constraint instead.
      changes:
        - sql:
            comment: "Drop and recreate chk_documents_source_type to include RSS_FEED"
            sql: >
              ALTER TABLE documents DROP CONSTRAINT chk_documents_source_type;
              ALTER TABLE documents
              ADD CONSTRAINT chk_documents_source_type
              CHECK (source_type IN ('FILESYSTEM', 'HTTP_DIRECTORY', 'UPLOAD', 'RSS_FEED'));
      rollback:
        - sql:
            sql: >
              ALTER TABLE documents DROP CONSTRAINT chk_documents_source_type;
              ALTER TABLE documents
              ADD CONSTRAINT chk_documents_source_type
              CHECK (source_type IN ('FILESYSTEM', 'HTTP_DIRECTORY', 'UPLOAD'));
