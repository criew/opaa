databaseChangeLog:
  - changeSet:
      id: 002-documents-indexed-chunk-count-index
      author: opaa
      comment: >
        Backs LowChunkDocumentAuditService#findLowChunkDocuments: (organization_id, chunk_count),
        partial on status = 'INDEXED' - the only status this query filters on. Not CONCURRENTLY:
        documents is a small table and the resulting short exclusive lock is accepted, unlike the
        larger-table build #1047 uses CONCURRENTLY for.
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE INDEX idx_documents_indexed_chunk_count ON public.documents USING btree (organization_id, chunk_count) WHERE ((status)::text = 'INDEXED'::text);
      rollback:
        - sql:
            sql: DROP INDEX IF EXISTS idx_documents_indexed_chunk_count;
