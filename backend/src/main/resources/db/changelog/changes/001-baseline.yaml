databaseChangeLog:
  - changeSet:
      id: 001-baseline-a
      author: opaa
      comment: "Extensions: pgvector, required by the vector_store table Spring AI creates at startup."
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE EXTENSION IF NOT EXISTS vector;
      rollback:
        - sql:
            sql: "DROP EXTENSION IF EXISTS vector;"

  - changeSet:
      id: 001-baseline-b
      author: opaa
      comment: "Auth / Nutzer / Organisationen: the tenant root (organizations) and the account table (users)."
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE TABLE public.organizations (
                  id uuid NOT NULL,
                  name character varying(255) NOT NULL,
                  created_at timestamp with time zone DEFAULT now() NOT NULL
              );

              CREATE TABLE public.users (
                  id uuid DEFAULT gen_random_uuid() NOT NULL,
                  subject character varying(255) NOT NULL,
                  issuer character varying(500) NOT NULL,
                  email character varying(320),
                  display_name character varying(255),
                  created_at timestamp with time zone DEFAULT now() NOT NULL,
                  last_login_at timestamp with time zone,
                  system_role character varying(20) DEFAULT 'USER'::character varying NOT NULL,
                  organization_id uuid NOT NULL
              );

              ALTER TABLE ONLY public.organizations
                  ADD CONSTRAINT organizations_pkey PRIMARY KEY (id);

              ALTER TABLE ONLY public.users
                  ADD CONSTRAINT uk_users_id_organization UNIQUE (id, organization_id);

              ALTER TABLE ONLY public.users
                  ADD CONSTRAINT uq_users_subject_issuer UNIQUE (subject, issuer);

              ALTER TABLE ONLY public.users
                  ADD CONSTRAINT users_pkey PRIMARY KEY (id);

              ALTER TABLE ONLY public.users
                  ADD CONSTRAINT fk_users_organization FOREIGN KEY (organization_id) REFERENCES public.organizations(id) ON DELETE RESTRICT;
      rollback:
        - sql:
            sql: "DROP TABLE IF EXISTS users, organizations CASCADE;"

  - changeSet:
      id: 001-baseline-c
      author: opaa
      comment: "Spaces / Gruppen / Mitgliedschaften: workspaces, directory-synced groups and their memberships."
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE TABLE public.directory_sync_status (
                  id uuid NOT NULL,
                  organization_id uuid NOT NULL,
                  last_run_at timestamp with time zone NOT NULL,
                  last_outcome character varying(30) NOT NULL,
                  last_message character varying(2000),
                  last_changed_fraction double precision,
                  last_applied_at timestamp with time zone
              );

              CREATE TABLE public.group_memberships (
                  id uuid NOT NULL,
                  user_id uuid NOT NULL,
                  group_id uuid NOT NULL,
                  organization_id uuid NOT NULL,
                  created_at timestamp with time zone DEFAULT now() NOT NULL
              );

              CREATE TABLE public.groups (
                  id uuid NOT NULL,
                  organization_id uuid NOT NULL,
                  kind character varying(20) NOT NULL,
                  name character varying(255) NOT NULL,
                  description character varying(2000),
                  external_id character varying(255),
                  parent_group_id uuid,
                  created_at timestamp with time zone DEFAULT now() NOT NULL,
                  updated_at timestamp with time zone DEFAULT now() NOT NULL,
                  dissolved boolean DEFAULT false NOT NULL,
                  dissolved_at timestamp with time zone,
                  CONSTRAINT chk_groups_kind CHECK ((kind IN ('ORG_UNIT', 'AD_HOC')))
              );

              CREATE TABLE public.space_memberships (
                  id uuid CONSTRAINT workspace_memberships_id_not_null NOT NULL,
                  user_id uuid CONSTRAINT workspace_memberships_user_id_not_null NOT NULL,
                  space_id uuid CONSTRAINT workspace_memberships_workspace_id_not_null NOT NULL,
                  role character varying(20) CONSTRAINT workspace_memberships_role_not_null NOT NULL,
                  created_at timestamp with time zone DEFAULT now() CONSTRAINT workspace_memberships_created_at_not_null NOT NULL,
                  organization_id uuid NOT NULL,
                  CONSTRAINT chk_space_memberships_role CHECK ((role IN ('MEMBER', 'CURATOR', 'ADMIN')))
              );

              CREATE TABLE public.spaces (
                  id uuid CONSTRAINT workspaces_id_not_null NOT NULL,
                  name character varying(255) CONSTRAINT workspaces_name_not_null NOT NULL,
                  description character varying(2000),
                  owner_id uuid CONSTRAINT workspaces_owner_id_not_null NOT NULL,
                  created_at timestamp with time zone DEFAULT now() CONSTRAINT workspaces_created_at_not_null NOT NULL,
                  updated_at timestamp with time zone DEFAULT now() CONSTRAINT workspaces_updated_at_not_null NOT NULL,
                  visibility character varying(20) DEFAULT 'PRIVATE'::character varying NOT NULL,
                  organization_id uuid NOT NULL,
                  is_default boolean DEFAULT false NOT NULL,
                  archived boolean DEFAULT false NOT NULL,
                  CONSTRAINT chk_spaces_visibility CHECK ((visibility IN ('PRIVATE', 'DISCOVERABLE', 'OPEN')))
              );

              ALTER TABLE ONLY public.directory_sync_status
                  ADD CONSTRAINT directory_sync_status_pkey PRIMARY KEY (id);

              ALTER TABLE ONLY public.group_memberships
                  ADD CONSTRAINT group_memberships_pkey PRIMARY KEY (id);

              ALTER TABLE ONLY public.groups
                  ADD CONSTRAINT groups_pkey PRIMARY KEY (id);

              ALTER TABLE ONLY public.directory_sync_status
                  ADD CONSTRAINT uk_directory_sync_status_organization UNIQUE (organization_id);

              ALTER TABLE ONLY public.group_memberships
                  ADD CONSTRAINT uk_group_memberships_user_group UNIQUE (user_id, group_id);

              ALTER TABLE ONLY public.groups
                  ADD CONSTRAINT uk_groups_id_organization UNIQUE (id, organization_id);

              ALTER TABLE ONLY public.groups
                  ADD CONSTRAINT uk_groups_organization_external_id UNIQUE (organization_id, external_id);

              ALTER TABLE ONLY public.space_memberships
                  ADD CONSTRAINT uk_space_memberships_user_space UNIQUE (user_id, space_id);

              ALTER TABLE ONLY public.spaces
                  ADD CONSTRAINT uk_spaces_id_organization UNIQUE (id, organization_id);

              ALTER TABLE ONLY public.space_memberships
                  ADD CONSTRAINT workspace_memberships_pkey PRIMARY KEY (id);

              ALTER TABLE ONLY public.spaces
                  ADD CONSTRAINT workspaces_pkey PRIMARY KEY (id);

              CREATE INDEX idx_space_memberships_space_id ON public.space_memberships USING btree (space_id);

              CREATE UNIQUE INDEX uk_spaces_default_owner ON public.spaces USING btree (owner_id) WHERE is_default;

              ALTER TABLE ONLY public.directory_sync_status
                  ADD CONSTRAINT fk_directory_sync_status_organization FOREIGN KEY (organization_id) REFERENCES public.organizations(id) ON DELETE RESTRICT;

              ALTER TABLE ONLY public.group_memberships
                  ADD CONSTRAINT fk_group_memberships_group_organization FOREIGN KEY (group_id, organization_id) REFERENCES public.groups(id, organization_id) ON DELETE CASCADE;

              ALTER TABLE ONLY public.group_memberships
                  ADD CONSTRAINT fk_group_memberships_user_organization FOREIGN KEY (user_id, organization_id) REFERENCES public.users(id, organization_id) ON DELETE CASCADE;

              ALTER TABLE ONLY public.groups
                  ADD CONSTRAINT fk_groups_organization FOREIGN KEY (organization_id) REFERENCES public.organizations(id) ON DELETE RESTRICT;

              ALTER TABLE ONLY public.groups
                  ADD CONSTRAINT fk_groups_parent_group_organization FOREIGN KEY (parent_group_id, organization_id) REFERENCES public.groups(id, organization_id) ON DELETE SET NULL (parent_group_id);

              ALTER TABLE ONLY public.space_memberships
                  ADD CONSTRAINT fk_space_memberships_organization FOREIGN KEY (organization_id) REFERENCES public.organizations(id) ON DELETE RESTRICT;

              ALTER TABLE ONLY public.space_memberships
                  ADD CONSTRAINT fk_space_memberships_space_organization FOREIGN KEY (space_id, organization_id) REFERENCES public.spaces(id, organization_id) ON DELETE CASCADE;

              ALTER TABLE ONLY public.space_memberships
                  ADD CONSTRAINT fk_space_memberships_user_organization FOREIGN KEY (user_id, organization_id) REFERENCES public.users(id, organization_id) ON DELETE CASCADE;

              ALTER TABLE ONLY public.spaces
                  ADD CONSTRAINT fk_spaces_organization FOREIGN KEY (organization_id) REFERENCES public.organizations(id) ON DELETE RESTRICT;

              ALTER TABLE ONLY public.spaces
                  ADD CONSTRAINT fk_spaces_owner_organization FOREIGN KEY (owner_id, organization_id) REFERENCES public.users(id, organization_id) ON DELETE RESTRICT;
      rollback:
        - sql:
            sql: "DROP TABLE IF EXISTS directory_sync_status, group_memberships, groups, space_memberships, spaces CASCADE;"

  - changeSet:
      id: 001-baseline-d
      author: opaa
      comment: "Bibliotheken / Dokumente / Indexing: knowledge_libraries and everything hung off it - documents, folders, indexing jobs/run events, asset grants, space associations, RSS feed state."
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE TABLE public.asset_grants (
                  id uuid NOT NULL,
                  library_id uuid NOT NULL,
                  organization_id uuid NOT NULL,
                  subject_type character varying(20) NOT NULL,
                  subject_user_id uuid,
                  subject_group_id uuid,
                  role character varying(20) NOT NULL,
                  expires_at timestamp with time zone,
                  granted_by_user_id uuid,
                  created_at timestamp with time zone DEFAULT now() NOT NULL,
                  updated_at timestamp with time zone DEFAULT now() NOT NULL,
                  CONSTRAINT chk_asset_grants_role CHECK ((role IN ('VIEWER', 'EDITOR', 'MANAGER', 'OWNER'))),
                  CONSTRAINT chk_asset_grants_subject CHECK (((((subject_type)::text = 'USER'::text) AND (subject_user_id IS NOT NULL) AND (subject_group_id IS NULL)) OR (((subject_type)::text = 'GROUP'::text) AND (subject_group_id IS NOT NULL) AND (subject_user_id IS NULL)))),
                  CONSTRAINT chk_asset_grants_subject_type CHECK ((subject_type IN ('USER', 'GROUP')))
              );

              CREATE TABLE public.documents (
                  id uuid DEFAULT gen_random_uuid() NOT NULL,
                  file_name character varying(500) NOT NULL,
                  file_path character varying(2000) NOT NULL,
                  content_type character varying(255),
                  file_size bigint,
                  chunk_count integer DEFAULT 0,
                  indexed_at timestamp with time zone,
                  checksum character varying(64),
                  status character varying(20) DEFAULT 'PENDING'::character varying NOT NULL,
                  source_type character varying(20) DEFAULT 'FILESYSTEM'::character varying NOT NULL,
                  last_modified_remote character varying(64),
                  library_id uuid NOT NULL,
                  organization_id uuid NOT NULL,
                  uploaded_by_user_id uuid,
                  source_entry_url character varying(2000),
                  error_message text,
                  created_at timestamp with time zone DEFAULT now() NOT NULL,
                  folder_id uuid,
                  CONSTRAINT chk_documents_source_type CHECK ((source_type IN ('FILESYSTEM', 'HTTP_DIRECTORY', 'UPLOAD', 'RSS_FEED'))),
                  CONSTRAINT chk_documents_status CHECK ((status IN ('PENDING', 'INDEXED', 'FAILED')))
              );

              CREATE TABLE public.indexing_jobs (
                  id uuid DEFAULT gen_random_uuid() NOT NULL,
                  status character varying(20) DEFAULT 'RUNNING'::character varying NOT NULL,
                  documents_total integer DEFAULT 0,
                  documents_processed integer DEFAULT 0,
                  documents_failed integer DEFAULT 0,
                  documents_skipped integer DEFAULT 0,
                  started_at timestamp with time zone DEFAULT now() NOT NULL,
                  completed_at timestamp with time zone,
                  error_message text,
                  library_id uuid,
                  documents_indexed_total integer DEFAULT 0 NOT NULL,
                  events_truncated_count integer DEFAULT 0 NOT NULL,
                  last_progress_at timestamp with time zone NOT NULL,
                  organization_id uuid NOT NULL,
                  triggered_by character varying(20) DEFAULT 'MANUAL'::character varying NOT NULL,
                  CONSTRAINT chk_indexing_jobs_status CHECK ((status IN ('RUNNING', 'COMPLETED', 'FAILED'))),
                  CONSTRAINT chk_indexing_jobs_triggered_by CHECK ((triggered_by IN ('MANUAL', 'SCHEDULED')))
              );

              CREATE TABLE public.indexing_run_events (
                  id uuid NOT NULL,
                  job_id uuid NOT NULL,
                  category character varying(30) NOT NULL,
                  message text NOT NULL,
                  reference text,
                  created_at timestamp with time zone DEFAULT now() NOT NULL
              );

              CREATE TABLE public.knowledge_libraries (
                  id uuid NOT NULL,
                  organization_id uuid NOT NULL,
                  name character varying(255) NOT NULL,
                  description character varying(2000),
                  owner_type character varying(20) NOT NULL,
                  owner_user_id uuid,
                  owner_group_id uuid,
                  visibility character varying(20) NOT NULL,
                  listed boolean DEFAULT false NOT NULL,
                  created_at timestamp with time zone DEFAULT now() NOT NULL,
                  updated_at timestamp with time zone DEFAULT now() NOT NULL,
                  source_type character varying(20) NOT NULL,
                  source_path character varying(2000),
                  source_url character varying(2000),
                  source_proxy character varying(255),
                  source_credentials character varying(3000),
                  source_insecure_ssl boolean DEFAULT false NOT NULL,
                  schedule_enabled boolean DEFAULT false NOT NULL,
                  schedule_cron character varying(100),
                  CONSTRAINT chk_knowledge_libraries_owner CHECK (((((owner_type)::text = 'USER'::text) AND (owner_user_id IS NOT NULL) AND (owner_group_id IS NULL)) OR (((owner_type)::text = 'GROUP'::text) AND (owner_group_id IS NOT NULL) AND (owner_user_id IS NULL)))),
                  CONSTRAINT chk_knowledge_libraries_owner_type CHECK ((owner_type IN ('USER', 'GROUP'))),
                  CONSTRAINT chk_knowledge_libraries_schedule CHECK ((((schedule_enabled = false) AND (schedule_cron IS NULL)) OR ((schedule_enabled = true) AND (schedule_cron IS NOT NULL) AND ((source_type)::text <> 'UPLOAD'::text)))),
                  CONSTRAINT chk_knowledge_libraries_source_configuration CHECK (((((source_type)::text = 'UPLOAD'::text) AND (source_path IS NULL) AND (source_url IS NULL) AND (source_proxy IS NULL) AND (source_credentials IS NULL) AND (source_insecure_ssl = false)) OR (((source_type)::text = 'FILESYSTEM'::text) AND (source_path IS NOT NULL) AND (source_url IS NULL) AND (source_proxy IS NULL) AND (source_credentials IS NULL) AND (source_insecure_ssl = false)) OR (((source_type)::text = 'HTTP_DIRECTORY'::text) AND (source_path IS NULL) AND (source_url IS NOT NULL)) OR (((source_type)::text = 'RSS_FEED'::text) AND (source_path IS NULL) AND (source_url IS NOT NULL)))),
                  CONSTRAINT chk_knowledge_libraries_source_type CHECK ((source_type IN ('FILESYSTEM', 'HTTP_DIRECTORY', 'UPLOAD', 'RSS_FEED'))),
                  CONSTRAINT chk_knowledge_libraries_visibility CHECK ((visibility IN ('PRIVATE', 'SHARED', 'ORGANIZATION')))
              );

              CREATE TABLE public.library_folders (
                  id uuid NOT NULL,
                  library_id uuid NOT NULL,
                  parent_folder_id uuid,
                  name character varying(255) NOT NULL,
                  organization_id uuid NOT NULL,
                  created_at timestamp with time zone DEFAULT now() NOT NULL
              );

              CREATE TABLE public.rss_feed_state (
                  id uuid NOT NULL,
                  feed_url character varying(2000) NOT NULL,
                  etag character varying(500),
                  last_modified character varying(200),
                  updated_at timestamp with time zone NOT NULL,
                  library_id uuid NOT NULL
              );

              CREATE TABLE public.space_asset_associations (
                  id uuid NOT NULL,
                  space_id uuid NOT NULL,
                  library_id uuid NOT NULL,
                  organization_id uuid NOT NULL,
                  created_by_user_id uuid NOT NULL,
                  created_at timestamp with time zone DEFAULT now() NOT NULL
              );

              ALTER TABLE ONLY public.asset_grants
                  ADD CONSTRAINT asset_grants_pkey PRIMARY KEY (id);

              ALTER TABLE ONLY public.documents
                  ADD CONSTRAINT documents_pkey PRIMARY KEY (id);

              ALTER TABLE ONLY public.indexing_jobs
                  ADD CONSTRAINT indexing_jobs_pkey PRIMARY KEY (id);

              ALTER TABLE ONLY public.indexing_run_events
                  ADD CONSTRAINT indexing_run_events_pkey PRIMARY KEY (id);

              ALTER TABLE ONLY public.knowledge_libraries
                  ADD CONSTRAINT knowledge_libraries_pkey PRIMARY KEY (id);

              ALTER TABLE ONLY public.library_folders
                  ADD CONSTRAINT library_folders_pkey PRIMARY KEY (id);

              ALTER TABLE ONLY public.rss_feed_state
                  ADD CONSTRAINT rss_feed_state_pkey PRIMARY KEY (id);

              ALTER TABLE ONLY public.space_asset_associations
                  ADD CONSTRAINT space_asset_associations_pkey PRIMARY KEY (id);

              ALTER TABLE ONLY public.documents
                  ADD CONSTRAINT uk_documents_library_path UNIQUE (library_id, file_path);

              ALTER TABLE ONLY public.knowledge_libraries
                  ADD CONSTRAINT uk_knowledge_libraries_id_organization UNIQUE (id, organization_id);

              ALTER TABLE ONLY public.library_folders
                  ADD CONSTRAINT uk_library_folders_id_library_organization UNIQUE (id, library_id, organization_id);

              ALTER TABLE ONLY public.rss_feed_state
                  ADD CONSTRAINT uk_rss_feed_state_library_feed_url UNIQUE (library_id, feed_url);

              ALTER TABLE ONLY public.space_asset_associations
                  ADD CONSTRAINT uk_space_asset_associations_space_library UNIQUE (space_id, library_id);

              CREATE INDEX idx_asset_grants_subject_group_organization ON public.asset_grants USING btree (subject_group_id, organization_id) WHERE ((subject_type)::text = 'GROUP'::text);

              CREATE INDEX idx_asset_grants_subject_user_organization ON public.asset_grants USING btree (subject_user_id, organization_id) WHERE ((subject_type)::text = 'USER'::text);

              CREATE INDEX idx_documents_folder ON public.documents USING btree (folder_id);

              CREATE INDEX idx_indexing_jobs_organization_id ON public.indexing_jobs USING btree (organization_id);

              CREATE INDEX idx_indexing_run_events_job_id ON public.indexing_run_events USING btree (job_id);

              CREATE INDEX idx_library_folders_parent ON public.library_folders USING btree (parent_folder_id);

              CREATE INDEX idx_space_asset_associations_library_organization ON public.space_asset_associations USING btree (library_id, organization_id);

              CREATE UNIQUE INDEX uk_asset_grants_group_subject ON public.asset_grants USING btree (library_id, subject_group_id) WHERE ((subject_type)::text = 'GROUP'::text);

              CREATE UNIQUE INDEX uk_asset_grants_user_subject ON public.asset_grants USING btree (library_id, subject_user_id) WHERE ((subject_type)::text = 'USER'::text);

              CREATE UNIQUE INDEX uk_documents_library_checksum ON public.documents USING btree (library_id, checksum) WHERE ((checksum IS NOT NULL) AND ((source_type)::text = 'UPLOAD'::text));

              CREATE UNIQUE INDEX uk_indexing_jobs_library_running ON public.indexing_jobs USING btree (library_id) WHERE ((status)::text = 'RUNNING'::text);

              CREATE UNIQUE INDEX uk_library_folders_child_name ON public.library_folders USING btree (library_id, parent_folder_id, name) WHERE (parent_folder_id IS NOT NULL);

              CREATE UNIQUE INDEX uk_library_folders_root_name ON public.library_folders USING btree (library_id, name) WHERE (parent_folder_id IS NULL);

              ALTER TABLE ONLY public.asset_grants
                  ADD CONSTRAINT fk_asset_grants_granted_by_user_organization FOREIGN KEY (granted_by_user_id, organization_id) REFERENCES public.users(id, organization_id) ON DELETE RESTRICT;

              ALTER TABLE ONLY public.asset_grants
                  ADD CONSTRAINT fk_asset_grants_library_organization FOREIGN KEY (library_id, organization_id) REFERENCES public.knowledge_libraries(id, organization_id) ON DELETE CASCADE;

              ALTER TABLE ONLY public.asset_grants
                  ADD CONSTRAINT fk_asset_grants_subject_group_organization FOREIGN KEY (subject_group_id, organization_id) REFERENCES public.groups(id, organization_id) ON DELETE RESTRICT;

              ALTER TABLE ONLY public.asset_grants
                  ADD CONSTRAINT fk_asset_grants_subject_user_organization FOREIGN KEY (subject_user_id, organization_id) REFERENCES public.users(id, organization_id) ON DELETE RESTRICT;

              ALTER TABLE ONLY public.documents
                  ADD CONSTRAINT fk_documents_folder FOREIGN KEY (folder_id, library_id, organization_id) REFERENCES public.library_folders(id, library_id, organization_id) ON DELETE RESTRICT;

              ALTER TABLE ONLY public.documents
                  ADD CONSTRAINT fk_documents_library_organization FOREIGN KEY (library_id, organization_id) REFERENCES public.knowledge_libraries(id, organization_id) ON DELETE RESTRICT;

              ALTER TABLE ONLY public.documents
                  ADD CONSTRAINT fk_documents_uploaded_by_user_organization FOREIGN KEY (uploaded_by_user_id, organization_id) REFERENCES public.users(id, organization_id) ON DELETE SET NULL (uploaded_by_user_id);

              ALTER TABLE ONLY public.indexing_jobs
                  ADD CONSTRAINT fk_indexing_jobs_library_organization FOREIGN KEY (library_id, organization_id) REFERENCES public.knowledge_libraries(id, organization_id) ON DELETE SET NULL (library_id);

              ALTER TABLE ONLY public.indexing_jobs
                  ADD CONSTRAINT fk_indexing_jobs_organization FOREIGN KEY (organization_id) REFERENCES public.organizations(id) ON DELETE RESTRICT;

              ALTER TABLE ONLY public.indexing_run_events
                  ADD CONSTRAINT fk_indexing_run_events_job FOREIGN KEY (job_id) REFERENCES public.indexing_jobs(id) ON DELETE CASCADE;

              ALTER TABLE ONLY public.knowledge_libraries
                  ADD CONSTRAINT fk_knowledge_libraries_organization FOREIGN KEY (organization_id) REFERENCES public.organizations(id) ON DELETE RESTRICT;

              ALTER TABLE ONLY public.knowledge_libraries
                  ADD CONSTRAINT fk_knowledge_libraries_owner_group_organization FOREIGN KEY (owner_group_id, organization_id) REFERENCES public.groups(id, organization_id) ON DELETE RESTRICT;

              ALTER TABLE ONLY public.knowledge_libraries
                  ADD CONSTRAINT fk_knowledge_libraries_owner_user_organization FOREIGN KEY (owner_user_id, organization_id) REFERENCES public.users(id, organization_id) ON DELETE RESTRICT;

              ALTER TABLE ONLY public.library_folders
                  ADD CONSTRAINT fk_library_folders_library FOREIGN KEY (library_id, organization_id) REFERENCES public.knowledge_libraries(id, organization_id) ON DELETE CASCADE;

              ALTER TABLE ONLY public.library_folders
                  ADD CONSTRAINT fk_library_folders_parent FOREIGN KEY (parent_folder_id, library_id, organization_id) REFERENCES public.library_folders(id, library_id, organization_id) ON DELETE RESTRICT;

              ALTER TABLE ONLY public.rss_feed_state
                  ADD CONSTRAINT fk_rss_feed_state_library FOREIGN KEY (library_id) REFERENCES public.knowledge_libraries(id) ON DELETE CASCADE;

              ALTER TABLE ONLY public.space_asset_associations
                  ADD CONSTRAINT fk_space_asset_associations_created_by_user_organization FOREIGN KEY (created_by_user_id, organization_id) REFERENCES public.users(id, organization_id) ON DELETE RESTRICT;

              ALTER TABLE ONLY public.space_asset_associations
                  ADD CONSTRAINT fk_space_asset_associations_library_organization FOREIGN KEY (library_id, organization_id) REFERENCES public.knowledge_libraries(id, organization_id) ON DELETE CASCADE;

              ALTER TABLE ONLY public.space_asset_associations
                  ADD CONSTRAINT fk_space_asset_associations_space_organization FOREIGN KEY (space_id, organization_id) REFERENCES public.spaces(id, organization_id) ON DELETE CASCADE;
      rollback:
        - sql:
            sql: "DROP TABLE IF EXISTS asset_grants, documents, indexing_jobs, indexing_run_events, knowledge_libraries, library_folders, rss_feed_state, space_asset_associations CASCADE;"

  - changeSet:
      id: 001-baseline-e
      author: opaa
      comment: "Chat / Query: chats and their messages/library references, plus the configured LLM model catalogue."
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE FUNCTION public.chat_library_references_set_organization() RETURNS trigger
                  LANGUAGE plpgsql
                  SET search_path TO 'pg_catalog', 'public', 'pg_temp'
                  AS $$ BEGIN
                SELECT organization_id INTO STRICT NEW.organization_id
                FROM chats
                WHERE id = NEW.chat_id;
                RETURN NEW;
              END; $$;

              CREATE TABLE public.chat_library_references (
                  chat_id uuid NOT NULL,
                  library_id uuid NOT NULL,
                  organization_id uuid NOT NULL
              );

              CREATE TABLE public.chat_messages (
                  id uuid NOT NULL,
                  chat_id uuid NOT NULL,
                  sequence integer NOT NULL,
                  role character varying(20) NOT NULL,
                  content text NOT NULL,
                  sources json,
                  created_at timestamp with time zone DEFAULT now() NOT NULL,
                  CONSTRAINT chk_chat_messages_role CHECK ((role IN ('USER', 'ASSISTANT')))
              );

              CREATE TABLE public.chats (
                  id uuid NOT NULL,
                  space_id uuid NOT NULL,
                  author_id uuid NOT NULL,
                  organization_id uuid NOT NULL,
                  title character varying(255),
                  use_knowledge boolean DEFAULT true NOT NULL,
                  status character varying(20) DEFAULT 'PRIVATE'::character varying NOT NULL,
                  created_at timestamp with time zone DEFAULT now() NOT NULL,
                  updated_at timestamp with time zone DEFAULT now() NOT NULL,
                  title_source character varying(20) DEFAULT 'GENERATED'::character varying NOT NULL,
                  CONSTRAINT chk_chats_status CHECK (((status)::text = 'PRIVATE'::text)),
                  CONSTRAINT chk_chats_title_source CHECK ((title_source IN ('GENERATED', 'CUSTOM')))
              );

              CREATE TABLE public.llm_model_seed_marker (
                  id integer NOT NULL,
                  seeded_at timestamp with time zone NOT NULL,
                  CONSTRAINT chk_llm_model_seed_marker_singleton CHECK ((id = 1))
              );

              CREATE TABLE public.llm_models (
                  id uuid NOT NULL,
                  display_name character varying(120) NOT NULL,
                  base_url character varying(500) NOT NULL,
                  model_identifier character varying(200) NOT NULL,
                  temperature numeric(3,2) DEFAULT 0.7 NOT NULL,
                  max_tokens integer DEFAULT 2000 NOT NULL,
                  api_key_ciphertext text,
                  active boolean DEFAULT false NOT NULL,
                  created_at timestamp with time zone DEFAULT now() NOT NULL,
                  updated_at timestamp with time zone DEFAULT now() NOT NULL,
                  CONSTRAINT chk_llm_models_max_tokens CHECK ((max_tokens > 0)),
                  CONSTRAINT chk_llm_models_temperature CHECK (((temperature >= (0)::numeric) AND (temperature <= (2)::numeric)))
              );

              ALTER TABLE ONLY public.chat_messages
                  ADD CONSTRAINT chat_messages_pkey PRIMARY KEY (id);

              ALTER TABLE ONLY public.chats
                  ADD CONSTRAINT chats_pkey PRIMARY KEY (id);

              ALTER TABLE ONLY public.llm_model_seed_marker
                  ADD CONSTRAINT llm_model_seed_marker_pkey PRIMARY KEY (id);

              ALTER TABLE ONLY public.llm_models
                  ADD CONSTRAINT llm_models_pkey PRIMARY KEY (id);

              ALTER TABLE ONLY public.chat_library_references
                  ADD CONSTRAINT pk_chat_library_references PRIMARY KEY (chat_id, library_id);

              ALTER TABLE ONLY public.chat_messages
                  ADD CONSTRAINT uk_chat_messages_chat_sequence UNIQUE (chat_id, sequence);

              ALTER TABLE ONLY public.chats
                  ADD CONSTRAINT uk_chats_id_organization UNIQUE (id, organization_id);

              CREATE INDEX idx_chat_messages_chat_id ON public.chat_messages USING btree (chat_id);

              CREATE INDEX idx_chats_author_id ON public.chats USING btree (author_id);

