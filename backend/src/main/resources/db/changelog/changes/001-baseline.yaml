                  ('SATZUNG_ORDNUNG', 'groessenordnung'),
                  ('VERMERK', 'sperrvermerk'),
                  ('VERMERK', 'sichtvermerk'),
                  ('VERMERK', 'eingangsvermerk');
      # No rollback: the baseline is never rolled back - a broken installation is discarded and re-run from an empty database instead.

  - changeSet:
      id: 001-baseline-knowledge-vector-store-library-id
      author: opaa
      comment: >-
        Expression index on vector_store's metadata->>'library_id', backing
        FullTextIndexFillStateService. vector_store is created by Spring AI at
        application startup (spring.ai.vectorstore.pgvector.initialize-schema=true),
        never by Liquibase, so on a fresh install this changeSet's precondition fails on
        the very first start; onFail: CONTINUE skips it without recording it as
        executed, and Liquibase retries it on the next start. Its own changeSet, never
        folded into a module changeSet: a precondition there would skip the whole
        module. Built CONCURRENTLY (and therefore outside a transaction) because it
        runs against an already-populated table; the leading DROP INDEX CONCURRENTLY IF
        EXISTS finishes an index a previously interrupted build left behind as invalid.
        Looks for vector_store in the default schema, which opaa.database.schema also
        binds spring.ai.vectorstore.pgvector.schema-name to; an installation overriding
        spring.ai.vectorstore.pgvector.table-name needs its own changeSet.
      preConditions:
        onFail: CONTINUE
        onFailMessage: >-
          vector_store does not exist yet (Spring AI creates it at application
          startup, not Liquibase - see this changeSet's own comment); retried on the
          next application start.
        tableExists:
          tableName: vector_store
      runInTransaction: false
      changes:
        - sql:
            sql: |
              DROP INDEX CONCURRENTLY IF EXISTS idx_vector_store_library_id;
              CREATE INDEX CONCURRENTLY idx_vector_store_library_id ON vector_store USING btree (((metadata ->> 'library_id'::text)));
      # No rollback: the baseline is never rolled back - a broken installation is discarded and re-run from an empty database instead.

  - changeSet:
      id: 001-baseline-knowledge-vector-store-document-id
      author: opaa
      comment: >-
        Expression index on vector_store's metadata->>'document_id', backing
        VectorStoreWriter#updateDocumentMetadata and VectorChunkStore#deleteByDocumentId.
        Same precondition, CONCURRENTLY and retry mechanics as changeSet
        001-baseline-knowledge-vector-store-library-id, for the same reasons - see that changeSet's comment.
      preConditions:
        onFail: CONTINUE
        onFailMessage: >-
          vector_store does not exist yet (Spring AI creates it at application
          startup, not Liquibase - see this changeSet's own comment); retried on the
          next application start.
        tableExists:
          tableName: vector_store
      runInTransaction: false
      changes:
        - sql:
            sql: |
              DROP INDEX CONCURRENTLY IF EXISTS idx_vector_store_document_id;
              CREATE INDEX CONCURRENTLY idx_vector_store_document_id ON vector_store USING btree (((metadata ->> 'document_id'::text)));
      # No rollback: the baseline is never rolled back - a broken installation is discarded and re-run from an empty database instead.

