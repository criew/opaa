  - changeSet:
      id: 001-baseline-n
      author: opaa
      comment: >-
        Expression index on vector_store's metadata->>'library_id', backing
        FullTextIndexFillStateService. vector_store is created by Spring AI at
        application startup (spring.ai.vectorstore.pgvector.initialize-schema=true),
        never by Liquibase, so on a fresh install this changeSet's precondition fails on
        the very first start; onFail: CONTINUE skips it without recording it as
        executed, and Liquibase retries it on the next start. Its own changeSet, never
        folded into a group above: a precondition on a group changeSet would skip the
        whole group. Built CONCURRENTLY (and therefore outside a transaction) because it
        runs against an already-populated table; the leading DROP INDEX CONCURRENTLY IF
        EXISTS finishes an index a previously interrupted build left behind as invalid.
        Hardcodes public.vector_store: an installation overriding
        spring.ai.vectorstore.pgvector.schema-name/table-name needs its own changeSet.
      preConditions:
        onFail: CONTINUE
        onFailMessage: >-
          public.vector_store does not exist yet (Spring AI creates it at application
          startup, not Liquibase - see this changeSet's own comment); retried on the
          next application start.
        tableExists:
          schemaName: public
          tableName: vector_store
      runInTransaction: false
      changes:
        - sql:
            sql: |
              DROP INDEX CONCURRENTLY IF EXISTS public.idx_vector_store_library_id;
              CREATE INDEX CONCURRENTLY idx_vector_store_library_id ON public.vector_store USING btree (((metadata ->> 'library_id'::text)));
      # No rollback: this baseline is never rolled back (#1492) - a broken installation is discarded and re-run from an empty database instead.

