  - changeSet:
      id: 001-baseline-g
      author: opaa
      comment: "Full-text index: chunk_full_text and its GIN index, the lexical search path beside vector_store. Deliberately without foreign keys, mirroring vector_store itself, which Spring AI - not Liquibase - creates. The two vector_store expression indexes are deliberately not part of this changeSet either; see the two guarded changeSets at the end of this file."
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE TABLE public.chunk_full_text (
                  chunk_id uuid NOT NULL,
                  document_id uuid NOT NULL,
                  library_id uuid NOT NULL,
                  content_tsv tsvector NOT NULL,
                  content_tsv_version smallint DEFAULT 1 NOT NULL
              );

              ALTER TABLE ONLY public.chunk_full_text
                  ADD CONSTRAINT chunk_full_text_pkey PRIMARY KEY (chunk_id);

              CREATE INDEX idx_chunk_full_text_content_tsv ON public.chunk_full_text USING gin (content_tsv);

              CREATE INDEX idx_chunk_full_text_document_id ON public.chunk_full_text USING btree (document_id);

              CREATE INDEX idx_chunk_full_text_library_id ON public.chunk_full_text USING btree (library_id);
      # No rollback: this baseline is never rolled back (#1492) - a broken installation is discarded and re-run from an empty database instead.

  - changeSet:
      id: 001-baseline-h
      author: opaa
      comment: "Metadata schema: the Dokumentart vocabulary with its synonyms, endings and exclusions, the per-document values, the per-library schema fields with their controlled value lists, and the bookkeeping of the model-backed extraction (keywords, counters, rejections) - including the delivered seed rows of the vocabulary."
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE TABLE public.document_keywords (
                  id uuid NOT NULL,
                  document_id uuid NOT NULL,
                  library_id uuid NOT NULL,
                  keyword character varying(40) NOT NULL,
                  model_id character varying(255),
                  extraction_version integer,
                  created_at timestamp with time zone DEFAULT now() NOT NULL
              );

              CREATE TABLE public.document_metadata_values (
                  id uuid NOT NULL,
                  document_id uuid NOT NULL,
                  field_key character varying(100) NOT NULL,
                  value_state character varying(20) DEFAULT 'SET'::character varying NOT NULL,
                  text_value character varying(1000),
                  vocabulary_code character varying(50),
                  date_value date,
                  date_precision character varying(10),
                  origin character varying(20) NOT NULL,
                  confidence double precision,
                  actor_user_id uuid,
                  model_id character varying(255),
                  extraction_version integer,
                  created_at timestamp with time zone NOT NULL,
                  updated_at timestamp with time zone NOT NULL,
                  library_field_id uuid,
                  library_value_id uuid,
                  CONSTRAINT chk_document_metadata_values_confidence_only_derived CHECK (((confidence IS NULL) OR ((origin)::text = 'DERIVED'::text))),
                  CONSTRAINT chk_document_metadata_values_core_field_type CHECK (((((field_key)::text = 'title'::text) AND (vocabulary_code IS NULL) AND (date_value IS NULL)) OR (((field_key)::text = 'document_type'::text) AND (text_value IS NULL) AND (date_value IS NULL)) OR (((field_key)::text = 'document_date'::text) AND (text_value IS NULL) AND (vocabulary_code IS NULL)) OR (field_key NOT IN ('title', 'document_type', 'document_date')))),
                  CONSTRAINT chk_document_metadata_values_date_has_precision CHECK (((date_value IS NULL) = (date_precision IS NULL))),
                  CONSTRAINT chk_document_metadata_values_extraction_version CHECK ((((origin)::text = 'MANUAL'::text) OR (extraction_version IS NOT NULL))),
                  CONSTRAINT chk_document_metadata_values_library_field CHECK (((library_field_id IS NOT NULL) = ((field_key)::text ~~ 'lib:%'::text))),
                  CONSTRAINT chk_document_metadata_values_library_value CHECK (((library_value_id IS NULL) OR ((library_field_id IS NOT NULL) AND (text_value IS NOT NULL)))),
                  CONSTRAINT chk_document_metadata_values_not_determinable_is_manual CHECK ((((value_state)::text <> 'NOT_DETERMINABLE'::text) OR ((origin)::text = 'MANUAL'::text))),
                  CONSTRAINT chk_document_metadata_values_one_value CHECK (((((value_state)::text = 'NOT_DETERMINABLE'::text) AND (text_value IS NULL) AND (vocabulary_code IS NULL) AND (date_value IS NULL)) OR (((value_state)::text = 'SET'::text) AND (((((text_value IS NOT NULL))::integer + ((vocabulary_code IS NOT NULL))::integer) + ((date_value IS NOT NULL))::integer) = 1)))),
                  CONSTRAINT chk_document_metadata_values_origin CHECK ((origin IN ('DETERMINISTIC', 'DERIVED', 'MANUAL'))),
                  CONSTRAINT chk_document_metadata_values_precision CHECK (((date_precision IS NULL) OR (date_precision IN ('DAY', 'MONTH', 'YEAR')))),
                  CONSTRAINT chk_document_metadata_values_state CHECK ((value_state IN ('SET', 'NOT_DETERMINABLE')))
              );

              CREATE TABLE public.document_type_suffix_exclusions (
                  code character varying(50) NOT NULL,
                  token character varying(100) NOT NULL
              );

              CREATE TABLE public.document_type_suffixes (
                  code character varying(50) NOT NULL,
                  suffix character varying(100) NOT NULL,
                  min_prefix_length integer DEFAULT 3 NOT NULL,
                  CONSTRAINT chk_document_type_suffixes_min_prefix_length CHECK ((min_prefix_length >= 1))
              );

              CREATE TABLE public.document_type_synonyms (
                  code character varying(50) NOT NULL,
                  synonym character varying(100) NOT NULL
              );

              CREATE TABLE public.document_type_vocabulary (
                  code character varying(50) NOT NULL,
                  label character varying(100) NOT NULL,
                  sort_order integer NOT NULL,
                  CONSTRAINT chk_document_type_vocabulary_code CHECK (((code)::text ~ '^[A-Z][A-Z0-9_]*$'::text))
              );

              CREATE TABLE public.library_metadata_field_values (
                  id uuid NOT NULL,
                  field_id uuid NOT NULL,
                  code character varying(50) NOT NULL,
                  label character varying(100) NOT NULL,
                  sort_order integer NOT NULL,
                  CONSTRAINT chk_library_metadata_field_values_code CHECK (((code)::text ~ '^[A-Za-z0-9][A-Za-z0-9_.-]*$'::text))
              );

              CREATE TABLE public.library_metadata_fields (
                  id uuid NOT NULL,
                  library_id uuid NOT NULL,
                  field_key character varying(50) NOT NULL,
                  label character varying(100) NOT NULL,
                  field_type character varying(20) NOT NULL,
                  value_pattern character varying(200),
                  filter_enabled boolean DEFAULT false NOT NULL,
                  context_prefix_enabled boolean DEFAULT false NOT NULL,
                  citation_enabled boolean DEFAULT false NOT NULL,
                  citation_position integer,
                  sort_order integer NOT NULL,
                  created_at timestamp with time zone NOT NULL,
                  updated_at timestamp with time zone NOT NULL,
                  CONSTRAINT chk_library_metadata_fields_citation_position CHECK (((citation_enabled = (citation_position IS NOT NULL)) AND ((citation_position IS NULL) OR (citation_position = ANY (ARRAY[1, 2]))))),
                  CONSTRAINT chk_library_metadata_fields_key CHECK (((field_key)::text ~ '^[a-z][a-z0-9_]*$'::text)),
                  CONSTRAINT chk_library_metadata_fields_pattern CHECK ((((field_type)::text = 'PATTERN'::text) = (value_pattern IS NOT NULL))),
                  CONSTRAINT chk_library_metadata_fields_retrieval_effect CHECK ((filter_enabled OR context_prefix_enabled)),
                  CONSTRAINT chk_library_metadata_fields_type CHECK ((field_type IN ('SELECT', 'DATE', 'PATTERN')))
              );

              CREATE TABLE public.metadata_model_extraction_stats (
                  library_id uuid NOT NULL,
                  calls bigint DEFAULT 0 NOT NULL,
                  accepted_values bigint DEFAULT 0 NOT NULL,
                  rejected_below_threshold bigint DEFAULT 0 CONSTRAINT metadata_model_extraction_sta_rejected_below_threshold_not_null NOT NULL,
                  rejected_outside_vocabulary bigint DEFAULT 0 CONSTRAINT metadata_model_extraction_s_rejected_outside_vocabular_not_null NOT NULL,
                  failures bigint DEFAULT 0 NOT NULL,
                  rejected_pool_full bigint DEFAULT 0 NOT NULL,
                  keywords_assigned bigint DEFAULT 0 NOT NULL,
                  last_call_at timestamp with time zone
              );

              CREATE TABLE public.metadata_model_rejections (
                  id uuid NOT NULL,
                  library_id uuid NOT NULL,
                  document_id uuid,
                  field_key character varying(100) NOT NULL,
                  proposed_value character varying(200),
                  confidence double precision,
                  reason character varying(30) NOT NULL,
                  created_at timestamp with time zone DEFAULT now() NOT NULL,
                  CONSTRAINT chk_metadata_model_rejections_reason CHECK ((reason IN ('BELOW_THRESHOLD', 'OUTSIDE_VOCABULARY')))
              );

              ALTER TABLE ONLY public.document_keywords
                  ADD CONSTRAINT document_keywords_pkey PRIMARY KEY (id);

              ALTER TABLE ONLY public.document_metadata_values
                  ADD CONSTRAINT document_metadata_values_pkey PRIMARY KEY (id);

              ALTER TABLE ONLY public.document_type_suffix_exclusions
                  ADD CONSTRAINT document_type_suffix_exclusions_pkey PRIMARY KEY (code, token);

              ALTER TABLE ONLY public.document_type_suffixes
                  ADD CONSTRAINT document_type_suffixes_pkey PRIMARY KEY (code, suffix);

              ALTER TABLE ONLY public.document_type_synonyms
                  ADD CONSTRAINT document_type_synonyms_pkey PRIMARY KEY (code, synonym);

              ALTER TABLE ONLY public.document_type_vocabulary
                  ADD CONSTRAINT document_type_vocabulary_pkey PRIMARY KEY (code);

              ALTER TABLE ONLY public.library_metadata_field_values
                  ADD CONSTRAINT library_metadata_field_values_pkey PRIMARY KEY (id);

              ALTER TABLE ONLY public.library_metadata_fields
                  ADD CONSTRAINT library_metadata_fields_pkey PRIMARY KEY (id);

              ALTER TABLE ONLY public.metadata_model_extraction_stats
                  ADD CONSTRAINT metadata_model_extraction_stats_pkey PRIMARY KEY (library_id);

              ALTER TABLE ONLY public.metadata_model_rejections
                  ADD CONSTRAINT metadata_model_rejections_pkey PRIMARY KEY (id);

              ALTER TABLE ONLY public.library_metadata_field_values
                  ADD CONSTRAINT uk_library_metadata_field_values_id_field UNIQUE (id, field_id);

              ALTER TABLE ONLY public.document_keywords
                  ADD CONSTRAINT uq_document_keywords_document_keyword UNIQUE (document_id, keyword);

              CREATE INDEX idx_document_keywords_document ON public.document_keywords USING btree (document_id);

              CREATE INDEX idx_document_metadata_values_library_field ON public.document_metadata_values USING btree (library_field_id);

              CREATE INDEX idx_document_metadata_values_library_value ON public.document_metadata_values USING btree (library_value_id);

              CREATE INDEX idx_document_metadata_values_vocabulary_code ON public.document_metadata_values USING btree (vocabulary_code);

              CREATE INDEX idx_metadata_model_rejections_library_created ON public.metadata_model_rejections USING btree (library_id, created_at DESC);

              CREATE UNIQUE INDEX uk_document_metadata_values_document_field ON public.document_metadata_values USING btree (document_id, field_key);

              CREATE UNIQUE INDEX uk_library_metadata_field_values_code ON public.library_metadata_field_values USING btree (field_id, code);

              CREATE UNIQUE INDEX uk_library_metadata_fields_citation_position ON public.library_metadata_fields USING btree (library_id, citation_position) WHERE (citation_position IS NOT NULL);

              CREATE UNIQUE INDEX uk_library_metadata_fields_key ON public.library_metadata_fields USING btree (library_id, field_key);

              ALTER TABLE ONLY public.document_keywords
                  ADD CONSTRAINT fk_document_keywords_document FOREIGN KEY (document_id) REFERENCES public.documents(id) ON DELETE CASCADE;

              ALTER TABLE ONLY public.document_keywords
                  ADD CONSTRAINT fk_document_keywords_library FOREIGN KEY (library_id) REFERENCES public.knowledge_libraries(id) ON DELETE CASCADE;

              ALTER TABLE ONLY public.document_metadata_values
                  ADD CONSTRAINT fk_document_metadata_values_actor FOREIGN KEY (actor_user_id) REFERENCES public.users(id) ON DELETE SET NULL;

              ALTER TABLE ONLY public.document_metadata_values
                  ADD CONSTRAINT fk_document_metadata_values_document FOREIGN KEY (document_id) REFERENCES public.documents(id) ON DELETE CASCADE;

              ALTER TABLE ONLY public.document_metadata_values
                  ADD CONSTRAINT fk_document_metadata_values_library_field FOREIGN KEY (library_field_id) REFERENCES public.library_metadata_fields(id) ON DELETE CASCADE;

              ALTER TABLE ONLY public.document_metadata_values
                  ADD CONSTRAINT fk_document_metadata_values_library_value FOREIGN KEY (library_value_id, library_field_id) REFERENCES public.library_metadata_field_values(id, field_id) ON DELETE RESTRICT;

              ALTER TABLE ONLY public.document_metadata_values
                  ADD CONSTRAINT fk_document_metadata_values_vocabulary FOREIGN KEY (vocabulary_code) REFERENCES public.document_type_vocabulary(code) ON DELETE RESTRICT;

              ALTER TABLE ONLY public.document_type_suffix_exclusions
                  ADD CONSTRAINT fk_document_type_suffix_exclusions_code FOREIGN KEY (code) REFERENCES public.document_type_vocabulary(code) ON DELETE CASCADE;

              ALTER TABLE ONLY public.document_type_suffixes
                  ADD CONSTRAINT fk_document_type_suffixes_code FOREIGN KEY (code) REFERENCES public.document_type_vocabulary(code) ON DELETE CASCADE;

              ALTER TABLE ONLY public.document_type_synonyms
                  ADD CONSTRAINT fk_document_type_synonyms_code FOREIGN KEY (code) REFERENCES public.document_type_vocabulary(code) ON DELETE CASCADE;

