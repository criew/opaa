                  updated_at timestamp with time zone DEFAULT now() NOT NULL,
                  CONSTRAINT chk_branding_settings_color_scheme CHECK (((default_color_scheme IS NULL) OR (default_color_scheme IN ('LIGHT', 'DARK', 'SYSTEM')))),
