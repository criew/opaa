                  CONSTRAINT chk_audit_log_object_type CHECK ((object_type IN ('KNOWLEDGE_LIBRARY', 'SPACE', 'GROUP', 'ASSET_GRANT', 'USER_ACCOUNT', 'API_TOKEN', 'SYSTEM_SETTING', 'AUDIT_LOG', 'DIRECTORY_SYNC_RUN'))),
                  CONSTRAINT chk_audit_log_outcome CHECK ((outcome IN ('SUCCESS', 'DENIED', 'FAILURE'))),
                  CONSTRAINT chk_audit_log_subject CHECK ((((subject_kind IS NULL) AND (subject_ref IS NULL)) OR ((subject_kind IS NOT NULL) AND (subject_kind IN ('USER', 'GROUP')) AND (subject_ref IS NOT NULL))))
              )
              PARTITION BY RANGE (recorded_at);

              ALTER TABLE ONLY public.audit_log
                  ADD CONSTRAINT audit_log_pkey PRIMARY KEY (event_id, recorded_at);

              CREATE INDEX idx_audit_log_object ON public.audit_log USING btree (organization_id, object_type, object_id, recorded_at);

              CREATE INDEX idx_audit_log_event_type ON public.audit_log USING btree (organization_id, event_type, recorded_at);

              CREATE INDEX idx_audit_log_correlation ON public.audit_log USING btree (organization_id, correlation_ref) WHERE (correlation_ref IS NOT NULL);

              CREATE INDEX idx_audit_log_time_range ON public.audit_log USING btree (organization_id, recorded_at);

              CREATE INDEX idx_audit_log_incident_scope ON public.audit_log USING btree (organization_id, actor_ref, recorded_at);

              ALTER TABLE public.audit_log
                  ADD CONSTRAINT fk_audit_log_organization FOREIGN KEY (organization_id) REFERENCES public.organizations(id) ON DELETE RESTRICT;

              -- Long, fixed horizon of monthly partitions - three months back through 16 years forward from
              -- the moment this migration runs (see the history of this file for the original changeset's full
              -- rationale); no DEFAULT partition, so a write outside this horizon fails loudly instead of
              -- landing somewhere retention deletion can never reclaim.
              DO $$
              DECLARE
                start_month date := date_trunc('month', now() - interval '3 months');
                i integer;
                partition_start date;
                partition_end date;
                partition_name text;
              BEGIN
                FOR i IN 0..194 LOOP
                  partition_start := (start_month + (i || ' months')::interval)::date;
                  partition_end := (start_month + ((i + 1) || ' months')::interval)::date;
                  partition_name := 'audit_log_' || to_char(partition_start, 'YYYY_MM');
                  EXECUTE format(
                    'CREATE TABLE IF NOT EXISTS %I PARTITION OF audit_log FOR VALUES FROM (%L) TO (%L)',
                    partition_name, partition_start, partition_end
                  );
                END LOOP;
              END $$;

              CREATE TABLE public.audit_actor_pseudonyms (
                  pseudonym_id uuid NOT NULL,
                  user_id uuid NOT NULL,
                  organization_id uuid NOT NULL,
                  created_at timestamp with time zone DEFAULT now() NOT NULL
              );

              ALTER TABLE ONLY public.audit_actor_pseudonyms
                  ADD CONSTRAINT audit_actor_pseudonyms_pkey PRIMARY KEY (pseudonym_id);

              ALTER TABLE ONLY public.audit_actor_pseudonyms
                  ADD CONSTRAINT uk_audit_actor_pseudonyms_user UNIQUE (user_id);

              ALTER TABLE ONLY public.audit_actor_pseudonyms
                  ADD CONSTRAINT fk_audit_actor_pseudonyms_organization FOREIGN KEY (organization_id) REFERENCES public.organizations(id) ON DELETE RESTRICT;

              ALTER TABLE ONLY public.audit_actor_pseudonyms
                  ADD CONSTRAINT fk_audit_actor_pseudonyms_user_organization FOREIGN KEY (user_id, organization_id) REFERENCES public.users(id, organization_id) ON DELETE CASCADE;

              -- opaa_audit_owner: a dedicated, NOLOGIN role nothing ever authenticates as. Ownership of
              -- audit_log, its partitions, audit_actor_pseudonyms, audit_retention_settings and the retention
              -- deletion function moves to it below, so the application account (current_user) - which created
              -- every object above as their owner - can never bypass the narrow INSERT/SELECT/EXECUTE grants it
              -- keeps by dropping a CHECK constraint, rewriting a partition or deleting rows directly (an owner
              -- always retains DDL on its own objects regardless of REVOKEs). See ADR-0015 for the full
              -- reasoning, including the residual CREATEROLE-time membership this migration cannot close.
              DO $$
              BEGIN
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'opaa_audit_owner') THEN
                  EXECUTE 'CREATE ROLE opaa_audit_owner NOLOGIN';
                END IF;
                EXECUTE format('GRANT opaa_audit_owner TO %I', current_user);
              END $$;

              GRANT CREATE ON SCHEMA public TO opaa_audit_owner;

              ALTER TABLE audit_log OWNER TO opaa_audit_owner;
              ALTER TABLE audit_actor_pseudonyms OWNER TO opaa_audit_owner;

              -- Every partition of audit_log, whichever statement above created it.
              DO $$
              DECLARE
                partition regclass;
              BEGIN
                FOR partition IN
                  SELECT inhrelid::regclass FROM pg_inherits
                  WHERE inhparent = 'audit_log'::regclass
                LOOP
                  EXECUTE format('ALTER TABLE %s OWNER TO opaa_audit_owner', partition);
                END LOOP;
              END $$;

              REVOKE ALL ON TABLE audit_log, audit_actor_pseudonyms FROM PUBLIC;
              DO $$
              BEGIN
                EXECUTE format('GRANT INSERT, SELECT ON TABLE audit_log TO %I', current_user);
                EXECUTE format('GRANT INSERT, SELECT ON TABLE audit_actor_pseudonyms TO %I', current_user);
              END $$;
              -- Future partitions opaa_audit_owner creates inherit exactly this grant automatically.
              DO $$
              BEGIN
                EXECUTE format(
                  'ALTER DEFAULT PRIVILEGES FOR ROLE opaa_audit_owner IN SCHEMA public'
                  ' GRANT SELECT, INSERT ON TABLES TO %I',
                  current_user);
              END $$;
              DO $$
              BEGIN
                EXECUTE format('REVOKE opaa_audit_owner FROM %I', current_user);
              END $$;

              CREATE TABLE public.audit_retention_settings (
                  id integer DEFAULT 1 NOT NULL,
                  retention_months integer NOT NULL,
                  last_cutoff timestamp with time zone,
                  last_run_month date,
                  updated_at timestamp with time zone NOT NULL,
                  CONSTRAINT chk_audit_retention_settings_months CHECK (((retention_months >= 12) AND (retention_months <= 120))),
                  CONSTRAINT chk_audit_retention_settings_singleton CHECK ((id = 1))
              );

              ALTER TABLE ONLY public.audit_retention_settings
                  ADD CONSTRAINT audit_retention_settings_pkey PRIMARY KEY (id);

              INSERT INTO audit_retention_settings
                (id, retention_months, last_cutoff, last_run_month, updated_at)
              VALUES (
                1, 36,
                date_trunc('month', now()) - interval '36 months',
                date_trunc('month', now())::date,
                now()
              );

              REVOKE ALL ON TABLE audit_retention_settings FROM PUBLIC;
              DO $$
              BEGIN
                EXECUTE format('GRANT opaa_audit_owner TO %I WITH SET TRUE', current_user);
              END $$;
              ALTER TABLE audit_retention_settings OWNER TO opaa_audit_owner;
              GRANT SELECT ON TABLE audit_retention_settings TO CURRENT_USER;
              GRANT UPDATE (retention_months, updated_at) ON TABLE audit_retention_settings TO CURRENT_USER;
              DO $$
              BEGIN
                EXECUTE format('REVOKE opaa_audit_owner FROM %I', current_user);
              END $$;

              CREATE FUNCTION public.opaa_audit_delete_expired_partitions() RETURNS SETOF text
                  LANGUAGE plpgsql SECURITY DEFINER
                  SET search_path TO 'pg_catalog', 'public', 'pg_temp'
                  AS $_$ DECLARE
                cfg RECORD;
                current_month date := date_trunc('month', now())::date;
                candidate_cutoff timestamptz;
                new_cutoff timestamptz;
                elapsed_months integer;
                rec RECORD;
                partition_month date;
              BEGIN
                SELECT retention_months, last_cutoff, last_run_month INTO cfg
                FROM public.audit_retention_settings WHERE id = 1 FOR UPDATE;

                IF NOT FOUND THEN
                  RAISE EXCEPTION 'audit_retention_settings has no row with id=1 - migration 023 should have seeded it; refusing to silently skip retention deletion';
                END IF;

                candidate_cutoff := current_month
                  - (cfg.retention_months::text || ' months')::interval;

                IF cfg.last_cutoff IS NULL OR cfg.last_run_month IS NULL THEN
                  new_cutoff := candidate_cutoff;
                ELSE
                  elapsed_months := GREATEST(
                    0,
                    (extract(year FROM current_month) - extract(year FROM cfg.last_run_month)) * 12
                      + (extract(month FROM current_month) - extract(month FROM cfg.last_run_month))
                  );
                  new_cutoff := LEAST(
                    candidate_cutoff, cfg.last_cutoff + (elapsed_months || ' months')::interval);
                END IF;

                FOR rec IN
                  SELECT inhrelid::regclass AS partition_rel,
                         inhrelid::regclass::text AS partition_name
                  FROM pg_catalog.pg_inherits
                  WHERE inhparent = 'public.audit_log'::regclass
                LOOP
                  partition_month := to_date(
                    substring(rec.partition_name from 'audit_log_(\d{4}_\d{2})$'), 'YYYY_MM');
                  IF partition_month IS NOT NULL
                     AND (partition_month + interval '1 month') <= new_cutoff THEN
                    EXECUTE format('DROP TABLE %s', rec.partition_rel);
                    RETURN NEXT rec.partition_name;
                  END IF;
                END LOOP;

                UPDATE public.audit_retention_settings
                SET last_cutoff = new_cutoff, last_run_month = current_month
                WHERE id = 1;

                RETURN;
              END; $_$;

              DO $$
              BEGIN
                EXECUTE format('GRANT opaa_audit_owner TO %I WITH SET TRUE', current_user);
              END $$;
              ALTER FUNCTION opaa_audit_delete_expired_partitions() OWNER TO opaa_audit_owner;
              GRANT EXECUTE ON FUNCTION opaa_audit_delete_expired_partitions() TO CURRENT_USER;
              REVOKE EXECUTE ON FUNCTION opaa_audit_delete_expired_partitions() FROM PUBLIC;
              DO $$
              BEGIN
                EXECUTE format('REVOKE opaa_audit_owner FROM %I', current_user);
              END $$;
