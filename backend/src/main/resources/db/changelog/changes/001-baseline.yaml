                  partition_start := (start_month + (i || ' months')::interval)::date;
                  partition_end := (start_month + ((i + 1) || ' months')::interval)::date;
                  partition_name := 'diagnostic_context_log_' || to_char(partition_start, 'YYYY_MM');
                  EXECUTE format(
                    'CREATE TABLE IF NOT EXISTS %I PARTITION OF diagnostic_context_log FOR VALUES FROM (%L) TO (%L)',
                    partition_name, partition_start, partition_end
                  );
                END LOOP;
              END $$;

              CREATE TABLE public.diagnostic_context_retention_settings (
                  id integer DEFAULT 1 NOT NULL,
                  retention_months integer NOT NULL,
                  last_cutoff timestamp with time zone,
                  last_run_month date,
                  updated_at timestamp with time zone NOT NULL,
                  CONSTRAINT chk_diagnostic_context_retention_months
                      CHECK (((retention_months >= 1) AND (retention_months <= 24))),
                  CONSTRAINT chk_diagnostic_context_retention_singleton CHECK ((id = 1))
              );

              ALTER TABLE ONLY public.diagnostic_context_retention_settings
                  ADD CONSTRAINT diagnostic_context_retention_settings_pkey PRIMARY KEY (id);

              INSERT INTO diagnostic_context_retention_settings
                (id, retention_months, last_cutoff, last_run_month, updated_at)
              VALUES (
                1, 12,
                date_trunc('month', now()) - interval '12 months',
                date_trunc('month', now())::date,
                now()
              );

              -- Ownership separation per ADR-0015, exactly as for audit_log: the application account creates
              -- these objects and is therefore their owner at first; ownership moves to opaa_audit_owner, and
              -- the application account is left only the narrow grants below. The membership is taken briefly
              -- and given back - the ADMIN OPTION residual that cannot be revoked is documented as open in
              -- ADR-0015.
              DO $$
              BEGIN
                EXECUTE format('GRANT opaa_audit_owner TO %I WITH SET TRUE', current_user);
              END $$;

              ALTER TABLE diagnostic_context_log OWNER TO opaa_audit_owner;
              ALTER TABLE diagnostic_context_retention_settings OWNER TO opaa_audit_owner;

              DO $$
              DECLARE
                partition regclass;
              BEGIN
                FOR partition IN
                  SELECT inhrelid::regclass FROM pg_inherits
                  WHERE inhparent = 'diagnostic_context_log'::regclass
                LOOP
                  EXECUTE format('ALTER TABLE %s OWNER TO opaa_audit_owner', partition);
                END LOOP;
              END $$;

              REVOKE ALL ON TABLE diagnostic_context_log, diagnostic_context_retention_settings FROM PUBLIC;
              DO $$
              BEGIN
                EXECUTE format('GRANT INSERT, SELECT ON TABLE diagnostic_context_log TO %I', current_user);
                EXECUTE format('GRANT SELECT ON TABLE diagnostic_context_retention_settings TO %I', current_user);
                EXECUTE format('GRANT UPDATE (retention_months, updated_at) ON TABLE diagnostic_context_retention_settings TO %I', current_user);
              END $$;

              -- Deletion itself cannot be switched off (Leitplanke (i)): there is no on/off flag, the retention
              -- period is bounded to 1-24 months by chk_diagnostic_context_retention_months, and this function
              -- is the only way anything can ever disappear from diagnostic_context_log. It never removes
              -- individual rows, only fully expired monthly partitions, and its forward cap (last_cutoff)
              -- limits every single run to one calendar month of progress - so a drastically shortened
              -- retention period takes effect step by step instead of as a mass deletion.
              CREATE FUNCTION public.opaa_diagnostic_context_delete_expired_partitions() RETURNS SETOF text
                  LANGUAGE plpgsql SECURITY DEFINER
                  SET search_path TO 'pg_catalog', 'public', 'pg_temp'
                  AS $_$ DECLARE
                cfg RECORD;
                current_month date := date_trunc('month', now())::date;
                candidate_cutoff timestamptz;
                new_cutoff timestamptz;
                elapsed_months integer;
                rec RECORD;
                partition_month date;
              BEGIN
                SELECT retention_months, last_cutoff, last_run_month INTO cfg
                FROM public.diagnostic_context_retention_settings WHERE id = 1 FOR UPDATE;

                IF NOT FOUND THEN
                  RAISE EXCEPTION 'diagnostic_context_retention_settings has no row with id=1 - changeset 007 should have seeded it; refusing to silently skip retention deletion';
                END IF;

                candidate_cutoff := current_month
                  - (cfg.retention_months::text || ' months')::interval;

                IF cfg.last_cutoff IS NULL OR cfg.last_run_month IS NULL THEN
                  new_cutoff := candidate_cutoff;
                ELSE
                  elapsed_months := GREATEST(
                    0,
                    (extract(year FROM current_month) - extract(year FROM cfg.last_run_month)) * 12
                      + (extract(month FROM current_month) - extract(month FROM cfg.last_run_month))
                  );
                  new_cutoff := LEAST(
                    candidate_cutoff, cfg.last_cutoff + (elapsed_months || ' months')::interval);
                END IF;

                FOR rec IN
                  SELECT inhrelid::regclass AS partition_rel,
                         inhrelid::regclass::text AS partition_name
                  FROM pg_catalog.pg_inherits
                  WHERE inhparent = 'public.diagnostic_context_log'::regclass
                LOOP
                  partition_month := to_date(
                    substring(rec.partition_name from 'diagnostic_context_log_(\d{4}_\d{2})$'), 'YYYY_MM');
                  IF partition_month IS NOT NULL
                     AND (partition_month + interval '1 month') <= new_cutoff THEN
                    EXECUTE format('DROP TABLE %s', rec.partition_rel);
                    RETURN NEXT rec.partition_name;
                  END IF;
                END LOOP;

                UPDATE public.diagnostic_context_retention_settings
                SET last_cutoff = new_cutoff, last_run_month = current_month
                WHERE id = 1;

                RETURN;
              END; $_$;

              ALTER FUNCTION opaa_diagnostic_context_delete_expired_partitions() OWNER TO opaa_audit_owner;
              GRANT EXECUTE ON FUNCTION opaa_diagnostic_context_delete_expired_partitions() TO CURRENT_USER;
              REVOKE EXECUTE ON FUNCTION opaa_diagnostic_context_delete_expired_partitions() FROM PUBLIC;

              DO $$
              BEGIN
                EXECUTE format('REVOKE opaa_audit_owner FROM %I', current_user);
              END $$;
