databaseChangeLog:
  - changeSet:
      id: 025-library-metadata-fields
      author: opaa
      comment: >-
        #1071 (docs/features/metadata-schema.md Teil II (b), ADR-0024 Nachtrag): the per-library
        schema fields beside the built-in core fields - up to five typed fields with a controlled
        value list, their Wirkstellen and their citation position. One changeset, because the four
        objects are one change: a value list without its field has nothing to belong to, and a
        document value referencing neither has no meaning.

        library_metadata_fields holds the schema. chk_library_metadata_fields_retrieval_effect is
        the Aufnahmeregel of the specification written into the database: a field that serves
        neither the filter nor the Kontextpraefix is not storable at all, so "nur Beleg-Anzeige"
        cannot be reached by any code path. citation_position is 1 or 2 and set exactly when the
        field appears in the Belegzeile; uk_library_metadata_fields_citation_position enforces the
        "hoechstens zwei" of the specification per library. A PATTERN field carries its regex, and
        only a PATTERN field does - the pattern is part of the field definition so a value is
        checkable (Teil II (b), "Kontrolliertes Vokabular statt Freitext").

        library_metadata_field_values is the controlled list of a SELECT field, with stable codes
        (a code is never renamed in place - relabeling is free, removing or replacing a code needs
        the confirmed remapping of the specification).

        document_metadata_values gains two references. library_field_id links a value row to its
        field - ON DELETE CASCADE, so deleting a field removes its values with it (the service
        clears them explicitly first, see LibraryMetadataFieldService#deleteField, and the cascade
        is the net beneath it). library_value_id is the database-level form of "der Zustand
        'Dokument traegt einen Wert, den es im Schema nicht mehr gibt' ist nicht erzeugbar": a
        SELECT value is a real foreign key onto a list entry, and ON DELETE RESTRICT blocks
        removing a list entry while a document still carries it - the confirmed remapping is the
        only way past it. field_key stays the single key of the values table; a library field's
        key is namespaced 'lib:<key>' and chk_document_metadata_values_library_field pins that
        namespace to the presence of library_field_id in both directions.
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE TABLE public.library_metadata_fields (
                  id uuid NOT NULL,
                  library_id uuid NOT NULL,
                  field_key character varying(50) NOT NULL,
                  label character varying(100) NOT NULL,
                  field_type character varying(20) NOT NULL,
                  value_pattern character varying(200),
                  filter_enabled boolean NOT NULL DEFAULT false,
                  context_prefix_enabled boolean NOT NULL DEFAULT false,
                  citation_enabled boolean NOT NULL DEFAULT false,
                  citation_position integer,
                  sort_order integer NOT NULL,
                  created_at timestamp with time zone NOT NULL,
                  updated_at timestamp with time zone NOT NULL,
                  CONSTRAINT library_metadata_fields_pkey PRIMARY KEY (id),
                  CONSTRAINT fk_library_metadata_fields_library FOREIGN KEY (library_id)
                      REFERENCES public.knowledge_libraries(id) ON DELETE CASCADE,
                  CONSTRAINT chk_library_metadata_fields_key
                      CHECK ((field_key ~ '^[a-z][a-z0-9_]*$')),
                  CONSTRAINT chk_library_metadata_fields_type
                      CHECK ((field_type IN ('SELECT', 'DATE', 'PATTERN'))),
                  CONSTRAINT chk_library_metadata_fields_pattern
                      CHECK (((field_type = 'PATTERN') = (value_pattern IS NOT NULL))),
                  CONSTRAINT chk_library_metadata_fields_retrieval_effect
                      CHECK ((filter_enabled OR context_prefix_enabled)),
                  CONSTRAINT chk_library_metadata_fields_citation_position
                      CHECK (((citation_enabled = (citation_position IS NOT NULL))
                          AND ((citation_position IS NULL) OR (citation_position IN (1, 2)))))
              );

              CREATE UNIQUE INDEX uk_library_metadata_fields_key
                  ON public.library_metadata_fields USING btree (library_id, field_key);

              CREATE UNIQUE INDEX uk_library_metadata_fields_citation_position
                  ON public.library_metadata_fields USING btree (library_id, citation_position)
                  WHERE (citation_position IS NOT NULL);

              CREATE TABLE public.library_metadata_field_values (
                  id uuid NOT NULL,
                  field_id uuid NOT NULL,
                  code character varying(50) NOT NULL,
                  label character varying(100) NOT NULL,
                  sort_order integer NOT NULL,
                  CONSTRAINT library_metadata_field_values_pkey PRIMARY KEY (id),
                  CONSTRAINT fk_library_metadata_field_values_field FOREIGN KEY (field_id)
                      REFERENCES public.library_metadata_fields(id) ON DELETE CASCADE,
                  CONSTRAINT chk_library_metadata_field_values_code
                      CHECK ((code ~ '^[A-Za-z0-9][A-Za-z0-9_.-]*$'))
              );

              CREATE UNIQUE INDEX uk_library_metadata_field_values_code
                  ON public.library_metadata_field_values USING btree (field_id, code);

              ALTER TABLE public.document_metadata_values
                  ADD COLUMN library_field_id uuid,
                  ADD COLUMN library_value_id uuid;

              ALTER TABLE public.document_metadata_values
                  ADD CONSTRAINT fk_document_metadata_values_library_field
                      FOREIGN KEY (library_field_id)
                      REFERENCES public.library_metadata_fields(id) ON DELETE CASCADE,
                  ADD CONSTRAINT fk_document_metadata_values_library_value
                      FOREIGN KEY (library_value_id)
                      REFERENCES public.library_metadata_field_values(id) ON DELETE RESTRICT,
                  ADD CONSTRAINT chk_document_metadata_values_library_field
                      CHECK (((library_field_id IS NOT NULL) = (field_key LIKE 'lib:%'))),
                  ADD CONSTRAINT chk_document_metadata_values_library_value
                      CHECK (((library_value_id IS NULL)
                          OR ((library_field_id IS NOT NULL) AND (text_value IS NOT NULL))));

              CREATE INDEX idx_document_metadata_values_library_field
                  ON public.document_metadata_values USING btree (library_field_id);

              CREATE INDEX idx_document_metadata_values_library_value
                  ON public.document_metadata_values USING btree (library_value_id);
      rollback:
        - sql:
            sql: |
              ALTER TABLE public.document_metadata_values
                  DROP CONSTRAINT IF EXISTS chk_document_metadata_values_library_value,
                  DROP CONSTRAINT IF EXISTS chk_document_metadata_values_library_field,
                  DROP CONSTRAINT IF EXISTS fk_document_metadata_values_library_value,
                  DROP CONSTRAINT IF EXISTS fk_document_metadata_values_library_field;
              ALTER TABLE public.document_metadata_values
                  DROP COLUMN IF EXISTS library_value_id,
                  DROP COLUMN IF EXISTS library_field_id;
              DROP TABLE IF EXISTS public.library_metadata_field_values;
              DROP TABLE IF EXISTS public.library_metadata_fields;
