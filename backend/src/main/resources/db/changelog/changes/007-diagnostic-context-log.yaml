databaseChangeLog:
  - changeSet:
      id: 007-diagnostic-context-log
      author: opaa
      comment: >-
        Das Protokoll der Ausfuehrungen in fremdem Rechtekontext (#1052,
        docs/features/hybrid-retrieval.md, Leitplanken (f)-(i)) samt Aufbewahrungseinstellung und
        Loeschfunktion - ein Changeset, weil die drei Objekte eine Aenderung sind: ohne die
        Einstellungszeile und die Funktion gibt es keine Loeschung, und ohne die Tabelle nichts zu
        loeschen. Eigene Tabelle statt weiterer Ereignistyp in audit_log, obwohl die
        Unveraenderlichkeit nach denselben Regeln (ADR-0015) hergestellt wird: audit_log wird
        partitionsweise nach einer systemweiten Frist von 12-120 Monaten geloescht (Voreinstellung
        36), Leitplanke (i) verlangt fuer dieses Protokoll dagegen 12 Monate. Eine kuerzere Frist
        fuer eine Teilmenge der Zeilen einer Partition ist ohne zeilenweises DELETE nicht
        erreichbar - und genau das darf es auf audit_log nicht geben. Getrennte Tabelle, getrennte
        Partitionen, getrennte Frist ist die einzige Loesung, die beide Zusagen haelt. Die
        Eigentuemerschaft geht an dieselbe Rolle opaa_audit_owner: eine zweite NOLOGIN-Rolle
        brauchte es nur, wenn die beiden Protokolle unterschiedliche Vertrauensgrenzen haetten -
        haben sie nicht. Das Anwendungskonto behaelt INSERT und SELECT und kann daher keine Zeile
        aendern oder loeschen; die einzige Loeschung ist der Partitionsabwurf durch die
        SECURITY-DEFINER-Funktion unten. chk_diagnostic_context_log_justification setzt Leitplanke
        (d) auf Datenbankebene durch: ein Personenkontext ohne Freitextbegruendung ist nicht
        speicherbar. Der Eigentuemerwechsel unten nimmt den in ADR-0015 offen beschriebenen
        Restweg (GRANT opaa_audit_owner TO current_user WITH SET TRUE) - also genau die
        Eskalation, die criew/opaa#426 abloesen soll; dieses Changeset ist nach audit_log der
        zweite Nutzer dieses Wegs und ist beim Schliessen von #426 mit umzustellen. Kein
        DEFAULT-Partitionsziel: eine Schreiboperation ausserhalb des Horizonts
        scheitert laut, statt in einer Partition zu landen, die die Loeschung nie erreicht.
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE TABLE public.diagnostic_context_log (
                  event_id uuid NOT NULL,
                  recorded_at timestamp with time zone NOT NULL,
                  organization_id uuid NOT NULL,
                  actor_ref character varying(255) NOT NULL,
                  target_kind character varying(20) NOT NULL,
                  target_ref character varying(255) NOT NULL,
                  test_question character varying(2000) NOT NULL,
                  hit_count integer NOT NULL,
                  hit_refs text NOT NULL,
                  permission_snapshot text NOT NULL,
                  justification character varying(1000),
                  CONSTRAINT chk_diagnostic_context_log_target_kind
                      CHECK ((target_kind IN ('PERMISSION_PROFILE', 'USER'))),
                  CONSTRAINT chk_diagnostic_context_log_hit_count CHECK ((hit_count >= 0)),
                  CONSTRAINT chk_diagnostic_context_log_justification
                      CHECK (((target_kind <> 'USER')
                              OR ((justification IS NOT NULL) AND (btrim(justification) <> ''))))
              )
              PARTITION BY RANGE (recorded_at);

              ALTER TABLE ONLY public.diagnostic_context_log
                  ADD CONSTRAINT diagnostic_context_log_pkey PRIMARY KEY (event_id, recorded_at);

              ALTER TABLE public.diagnostic_context_log
                  ADD CONSTRAINT fk_diagnostic_context_log_organization
                  FOREIGN KEY (organization_id) REFERENCES public.organizations(id) ON DELETE RESTRICT;

              CREATE INDEX idx_diagnostic_context_log_time_range
                  ON public.diagnostic_context_log USING btree (organization_id, recorded_at);

              -- Der einzige Lesepfad, der ueberhaupt nach target_ref filtert, ist das
              -- Einsichtsrecht aus Leitplanke (h): eine Person sieht die Eintraege zu ihrem
              -- eigenen Pseudonym. Dafuer ist dieser Index da - nicht fuer eine Auswertung nach
              -- Zielperson, die es nach Leitplanke (g) nicht geben darf und die kein Lesepfad
              -- dieser Anwendung anbietet.
              CREATE INDEX idx_diagnostic_context_log_target
                  ON public.diagnostic_context_log USING btree (organization_id, target_kind, target_ref, recorded_at);

              DO $$
              DECLARE
                start_month date := date_trunc('month', now() - interval '3 months');
                i integer;
                partition_start date;
                partition_end date;
                partition_name text;
              BEGIN
                FOR i IN 0..194 LOOP
                  partition_start := (start_month + (i || ' months')::interval)::date;
                  partition_end := (start_month + ((i + 1) || ' months')::interval)::date;
                  partition_name := 'diagnostic_context_log_' || to_char(partition_start, 'YYYY_MM');
                  EXECUTE format(
                    'CREATE TABLE IF NOT EXISTS %I PARTITION OF diagnostic_context_log FOR VALUES FROM (%L) TO (%L)',
                    partition_name, partition_start, partition_end
                  );
                END LOOP;
              END $$;

              CREATE TABLE public.diagnostic_context_retention_settings (
                  id integer DEFAULT 1 NOT NULL,
                  retention_months integer NOT NULL,
                  last_cutoff timestamp with time zone,
                  last_run_month date,
                  updated_at timestamp with time zone NOT NULL,
                  CONSTRAINT chk_diagnostic_context_retention_months
                      CHECK (((retention_months >= 1) AND (retention_months <= 24))),
                  CONSTRAINT chk_diagnostic_context_retention_singleton CHECK ((id = 1))
              );

              ALTER TABLE ONLY public.diagnostic_context_retention_settings
                  ADD CONSTRAINT diagnostic_context_retention_settings_pkey PRIMARY KEY (id);

              INSERT INTO diagnostic_context_retention_settings
                (id, retention_months, last_cutoff, last_run_month, updated_at)
              VALUES (
                1, 12,
                date_trunc('month', now()) - interval '12 months',
                date_trunc('month', now())::date,
                now()
              );

              -- Eigentuemertrennung nach ADR-0015, wie bei audit_log: das Anwendungskonto legt die
              -- Objekte an und ist damit zunaechst ihr Eigentuemer; die Eigentuemerschaft geht an
              -- opaa_audit_owner ueber, danach bleiben dem Anwendungskonto nur die schmalen Rechte
              -- unten. Die Mitgliedschaft wird kurz genommen und wieder entzogen - der nicht
              -- wegrevokbare ADMIN-OPTION-Rest ist in ADR-0015 offen beschrieben.
              DO $$
              BEGIN
                EXECUTE format('GRANT opaa_audit_owner TO %I WITH SET TRUE', current_user);
              END $$;

              ALTER TABLE diagnostic_context_log OWNER TO opaa_audit_owner;
              ALTER TABLE diagnostic_context_retention_settings OWNER TO opaa_audit_owner;

              DO $$
              DECLARE
                partition regclass;
              BEGIN
                FOR partition IN
                  SELECT inhrelid::regclass FROM pg_inherits
                  WHERE inhparent = 'diagnostic_context_log'::regclass
                LOOP
                  EXECUTE format('ALTER TABLE %s OWNER TO opaa_audit_owner', partition);
                END LOOP;
              END $$;

              REVOKE ALL ON TABLE diagnostic_context_log, diagnostic_context_retention_settings FROM PUBLIC;
              DO $$
              BEGIN
                EXECUTE format('GRANT INSERT, SELECT ON TABLE diagnostic_context_log TO %I', current_user);
                EXECUTE format('GRANT SELECT ON TABLE diagnostic_context_retention_settings TO %I', current_user);
                EXECUTE format('GRANT UPDATE (retention_months, updated_at) ON TABLE diagnostic_context_retention_settings TO %I', current_user);
              END $$;

              -- Die Loeschung selbst ist nicht abschaltbar (Leitplanke (i)): es gibt keinen
              -- Ein/Aus-Schalter, die Frist ist durch chk_diagnostic_context_retention_months auf
              -- 1-24 Monate begrenzt, und diese Funktion ist der einzige Weg, auf dem ueberhaupt
              -- etwas aus diagnostic_context_log verschwinden kann. Sie entfernt nie einzelne
              -- Zeilen, sondern nur vollstaendig abgelaufene Monatspartitionen, und ihr
              -- Vorwaertsdeckel (last_cutoff) begrenzt jeden einzelnen Lauf auf einen
              -- Kalendermonat Fortschritt - eine drastisch verkuerzte Frist wirkt damit
              -- schrittweise statt als Massenloeschung.
              CREATE FUNCTION public.opaa_diagnostic_context_delete_expired_partitions() RETURNS SETOF text
                  LANGUAGE plpgsql SECURITY DEFINER
                  SET search_path TO 'pg_catalog', 'public', 'pg_temp'
                  AS $_$ DECLARE
                cfg RECORD;
                current_month date := date_trunc('month', now())::date;
                candidate_cutoff timestamptz;
                new_cutoff timestamptz;
                elapsed_months integer;
                rec RECORD;
                partition_month date;
              BEGIN
                SELECT retention_months, last_cutoff, last_run_month INTO cfg
                FROM public.diagnostic_context_retention_settings WHERE id = 1 FOR UPDATE;

                IF NOT FOUND THEN
                  RAISE EXCEPTION 'diagnostic_context_retention_settings has no row with id=1 - changeset 007 should have seeded it; refusing to silently skip retention deletion';
                END IF;

                candidate_cutoff := current_month
                  - (cfg.retention_months::text || ' months')::interval;

                IF cfg.last_cutoff IS NULL OR cfg.last_run_month IS NULL THEN
                  new_cutoff := candidate_cutoff;
                ELSE
                  elapsed_months := GREATEST(
                    0,
                    (extract(year FROM current_month) - extract(year FROM cfg.last_run_month)) * 12
                      + (extract(month FROM current_month) - extract(month FROM cfg.last_run_month))
                  );
                  new_cutoff := LEAST(
                    candidate_cutoff, cfg.last_cutoff + (elapsed_months || ' months')::interval);
                END IF;

                FOR rec IN
                  SELECT inhrelid::regclass AS partition_rel,
                         inhrelid::regclass::text AS partition_name
                  FROM pg_catalog.pg_inherits
                  WHERE inhparent = 'public.diagnostic_context_log'::regclass
                LOOP
                  partition_month := to_date(
                    substring(rec.partition_name from 'diagnostic_context_log_(\d{4}_\d{2})$'), 'YYYY_MM');
                  IF partition_month IS NOT NULL
                     AND (partition_month + interval '1 month') <= new_cutoff THEN
                    EXECUTE format('DROP TABLE %s', rec.partition_rel);
                    RETURN NEXT rec.partition_name;
                  END IF;
                END LOOP;

                UPDATE public.diagnostic_context_retention_settings
                SET last_cutoff = new_cutoff, last_run_month = current_month
                WHERE id = 1;

                RETURN;
              END; $_$;

              ALTER FUNCTION opaa_diagnostic_context_delete_expired_partitions() OWNER TO opaa_audit_owner;
              GRANT EXECUTE ON FUNCTION opaa_diagnostic_context_delete_expired_partitions() TO CURRENT_USER;
              REVOKE EXECUTE ON FUNCTION opaa_diagnostic_context_delete_expired_partitions() FROM PUBLIC;

              DO $$
              BEGIN
                EXECUTE format('REVOKE opaa_audit_owner FROM %I', current_user);
              END $$;
      rollback:
        - sql:
            sql: |
              DROP FUNCTION IF EXISTS public.opaa_diagnostic_context_delete_expired_partitions();
              DROP TABLE IF EXISTS public.diagnostic_context_log CASCADE;
              DROP TABLE IF EXISTS public.diagnostic_context_retention_settings CASCADE;
