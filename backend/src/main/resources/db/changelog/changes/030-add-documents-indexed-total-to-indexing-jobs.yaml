databaseChangeLog:
  - changeSet:
      id: 030-add-documents-indexed-total-to-indexing-jobs
      author: opaa
      comment: >
        #518: documents_processed/failed/skipped on an RSS_FEED run count feed entries, not the
        documents actually written to the index - every entry's detail page can carry additional
        attachment documents (#468) that never showed up in any counter. documents_indexed_total
        tracks the true count of indexed documents (an entry's own document plus every attachment
        indexed for it, including attachments backfilled for an otherwise-unchanged entry). For
        FILESYSTEM/HTTP_DIRECTORY runs, where one processed file is exactly one document, this
        column always equals documents_processed - IndexingRunProgress#recordProcessed increments
        both, so the existing FILESYSTEM/HTTP_DIRECTORY display keeps working unchanged.
      changes:
        - addColumn:
            tableName: indexing_jobs
            columns:
              - column:
                  name: documents_indexed_total
                  type: int
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
      rollback:
        - dropColumn:
            tableName: indexing_jobs
            columnName: documents_indexed_total

  - changeSet:
      id: 030-backfill-documents-indexed-total
      author: opaa
      comment: >
        #518 review, finding 1: the addColumn above leaves every pre-existing row at the new
        column's default of 0 - without this backfill, a completed run from before this migration
        would show "0 Dokumente insgesamt" instead of its own already-known documents_processed.
        For every source type, documents_processed is the best available estimate for a
        pre-existing row: it is exact for FILESYSTEM/HTTP_DIRECTORY (one processed file is exactly
        one document, unchanged by this issue) and a lower bound - rather than the misleading 0 -
        for a pre-existing RSS_FEED row, whose attachments were never counted at all before this
        issue.
      changes:
        - sql:
            comment: "Backfill documents_indexed_total from documents_processed for pre-existing rows"
            sql: "UPDATE indexing_jobs SET documents_indexed_total = documents_processed;"
      rollback:
        - sql:
            comment: >
              Not reversible: distinguishing a backfilled row from one this issue's own code has
              since written documents_indexed_total for is impossible from the data alone -
              deliberately a no-op, same reasoning as migration 016's backfill.
            sql: "SELECT 1;"
