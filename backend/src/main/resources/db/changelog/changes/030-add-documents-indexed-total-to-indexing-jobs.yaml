databaseChangeLog:
  - changeSet:
      id: 030-add-documents-indexed-total-to-indexing-jobs
      author: opaa
      comment: >
        #518: documents_processed/failed/skipped on an RSS_FEED run count feed entries, not the
        documents actually written to the index - every entry's detail page can carry additional
        attachment documents (#468) that never showed up in any counter. documents_indexed_total
        tracks the true count of indexed documents (an entry's own document plus every attachment
        indexed for it, including attachments backfilled for an otherwise-unchanged entry). For
        FILESYSTEM/HTTP_DIRECTORY runs, where one processed file is exactly one document, this
        column always equals documents_processed - IndexingRunProgress#recordProcessed increments
        both, so the existing FILESYSTEM/HTTP_DIRECTORY display keeps working unchanged.
      changes:
        - addColumn:
            tableName: indexing_jobs
            columns:
              - column:
                  name: documents_indexed_total
                  type: int
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
      rollback:
        - dropColumn:
            tableName: indexing_jobs
            columnName: documents_indexed_total
