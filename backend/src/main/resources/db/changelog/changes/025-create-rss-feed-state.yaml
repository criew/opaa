databaseChangeLog:
  - changeSet:
      id: 025-create-rss-feed-state
      author: opaa
      comment: >
        Creates rss_feed_state, tracking the ETag/Last-Modified pair an RSS_FEED indexing run
        (#467) last saw for a given feed URL - the state a conditional GET needs to let an
        unchanged feed end the run in a single request (ADR-0017). Deliberately its own small
        table rather than a row in documents: a feed is a change-notifier, not a document, and
        giving it a documents row would need a sourceType with no real content and would show
        up wherever documents of a library are listed. This is unrelated to the "no source
        table" item ADR-0017 leaves open - that item is about persisted run configuration
        (address, credentials, schedule), not this narrowly-scoped HTTP caching optimization.
      changes:
        - createTable:
            tableName: rss_feed_state
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: feed_url
                  type: varchar(2000)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_rss_feed_state_feed_url
              - column:
                  name: etag
                  type: varchar(500)
              - column:
                  name: last_modified
                  type: varchar(200)
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: rss_feed_state
