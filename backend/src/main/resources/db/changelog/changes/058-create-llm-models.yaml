databaseChangeLog:
  # Stufe 1 der Modellverwaltung (#756, docs/features/llm-integration.md#stufe-1-verwaltete-chat-modelle-in-umsetzung):
  # a list of managed chat models instead of the environment variables that decide today
  # (spring.ai.model.chat plus the ollama/openai blocks in application.yml). Exactly one row may be
  # active at a time (chk_llm_models_single_active_partial_index below), enforced by the database,
  # not merely by the service - the same "backstop, not the primary defense" shape
  # 041-create-branding-settings already uses for its own constraints.
  #
  # Deliberately no organization_id: like branding_settings, this is system-wide configuration for
  # the one Behörde a deployment serves (ADR-0015), not a per-organization row.
  #
  # Deliberately no provider-type column: the connection is always the OpenAI-compatible protocol
  # (docs/features/llm-integration.md#ein-anbindungsweg-nicht-zwei) - Ollama is entered via its own
  # /v1 endpoint like any other target. base_url therefore has no default at any layer, the same
  # reasoning io.opaa.config.OpenAiBaseUrlGuard already applies to the environment-variable
  # configuration this table is starting to replace.
  #
  # api_key_ciphertext is the write-only, encrypted access key (io.opaa.security.SettingsEncryptor,
  # AES-256-GCM, OPAA_SETTINGS_ENCRYPTION_KEY) - optional, because locally operated endpoints
  # regularly run without authentication. Nullable, never plaintext, never returned by any read
  # path once #757 (the admin API) exists.

  - changeSet:
      id: 058-create-llm-models
      author: opaa
      comment: >
        Create llm_models - the managed list of chat models Stufe 1 introduces, with at most one
        active entry (partial unique index on active) and an optional, encrypted access key.
      changes:
        - createTable:
            tableName: llm_models
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: display_name
                  type: varchar(120)
                  constraints:
                    nullable: false
              - column:
                  name: base_url
                  type: varchar(500)
                  constraints:
                    nullable: false
              - column:
                  name: model_identifier
                  type: varchar(200)
                  constraints:
                    nullable: false
              - column:
                  name: temperature
                  type: numeric(3,2)
                  defaultValueNumeric: 0.7
                  constraints:
                    nullable: false
              - column:
                  name: max_tokens
                  type: integer
                  defaultValueNumeric: 2000
                  constraints:
                    nullable: false
              - column:
                  name: api_key_ciphertext
                  type: text
                  constraints:
                    nullable: true
              - column:
                  name: active
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false

        - sql:
            comment: >
              Bounds temperature and max_tokens to the ranges the seed migration and every future
              write path are expected to respect (docs/deployment.md's existing
              OPAA_OPENAI_CHAT_TEMPERATURE/OPAA_OPENAI_CHAT_MAX_TOKENS documentation), and enforces
              "at most one active model" as a partial unique index: since the index only contains
              rows where active is true, and every included row carries the same value (true), a
              second such row collides with the first on that same value - the standard PostgreSQL
              pattern for "at most one row with this flag set".
            splitStatements: true
            sql: >
              ALTER TABLE llm_models
              ADD CONSTRAINT chk_llm_models_temperature CHECK (temperature >= 0 AND temperature <= 2);

              ALTER TABLE llm_models
              ADD CONSTRAINT chk_llm_models_max_tokens CHECK (max_tokens > 0);

              CREATE UNIQUE INDEX ux_llm_models_single_active ON llm_models (active) WHERE active;

      rollback:
        - dropTable:
            tableName: llm_models
