databaseChangeLog:
  # Foundation of the append-only audit trail (#391, see
  # docs/features/security-and-compliance.md#revisionssicheres-protokoll, decision #355). Four
  # changeSets, in dependency order:
  #   1. 017-create-audit-log                - the record itself, partitioned by month
  #   2. 017-create-audit-log-partitions      - a long, fixed horizon of monthly partitions
  #   3. 017-create-audit-actor-pseudonyms    - the separately held actor_ref -> person mapping
  #   4. 017-restrict-audit-log-privileges    - transfers ownership of audit_log (parent and every
  #                                              partition) and audit_actor_pseudonyms to a
  #                                              dedicated, non-login role and grants the
  #                                              application account exactly INSERT+SELECT - see
  #                                              ADR-0015 and that changeSet's own comment
  #
  # Rollback order (reverse of apply order):
  # 017-restrict-audit-log-privileges
  # 017-create-audit-actor-pseudonyms
  # 017-create-audit-log-partitions
  # 017-create-audit-log
  #
  # One thing is deliberately left out of this migration's scope, matching #391's own stated
  # boundary ("Nicht in diesem Vorgang: ... die Löschung"): the retention deletion that removes
  # whole expired partitions once they age out of the fixed horizon 017-create-audit-log-partitions
  # creates. A separate, unrelated gap found while building this migration - that this project's
  # shipped docker-compose.yml runs its database account as a superuser, and that the migration
  # account needs the CREATEROLE attribute this changelog now relies on - is tracked in #426 (see
  # ADR-0015 and the #391/#428 PR description for detail).

  - changeSet:
      id: 017-create-audit-log
      author: opaa
      comment: >
        Create audit_log holding the record set decided in #355 and specified in
        docs/features/security-and-compliance.md#der-protokollsatz: event_id, recorded_at,
        organization_id, actor_kind, actor_ref, event_type, object_type, object_id, object_label,
        subject_kind, subject_ref, before, after, outcome, reason, correlation_ref. Deliberately no
        network address, device/browser fingerprint or location field - the specification excludes
        them from the standard record by name.

        Partitioned by month on recorded_at (PARTITION BY RANGE), so the later retention deletion
        can drop whole expired time slices instead of deleting individual rows - a plain
        createTable cannot express PARTITION BY, hence the raw SQL. Postgres requires every unique
        constraint on a partitioned table to include the partition key, so the primary key is the
        composite (event_id, recorded_at) rather than event_id alone; event_id itself stays the
        only identifier the application ever needs; it is a client-generated UUID (see
        AuditLogEntry), so cross-partition uniqueness relies on UUID collision being practically
        impossible, the same trade-off every UUID primary key in this schema already makes.

        recorded_at has deliberately no column DEFAULT: the application (AuditLogEntry's
        @PrePersist) is the single source of the timestamp every later query and the retention
        deletion key off, so any writer - JPA or a future raw-SQL maintenance tool - must supply it
        explicitly rather than silently picking up a second, potentially different time source.

        actor_kind, event_type, object_type, subject_kind and outcome are closed vocabularies
        (CHECK constraints), not free text - event_type explicitly per the #391 acceptance
        criteria ("geschlossene Liste, nicht als freier Text"); the others are closed for the same
        reason since the cost of doing so here is the same. subject_kind/subject_ref are paired:
        either both present or both absent, mirroring the subject-pairing pattern
        chk_asset_grants_subject established in migration 013 for a different table. before/after
        are plain text holding a JSON-formatted string produced by the caller (AuditLogService),
        not a jsonb column: nothing in #391 queries into their structure, and a text column avoids
        pulling in a Hibernate JSON type mapping for a value nothing here needs to filter on.
      changes:
        - sql:
            sql: >
              CREATE TABLE audit_log (
                event_id uuid NOT NULL,
                recorded_at timestamp with time zone NOT NULL,
                organization_id uuid NOT NULL,
                actor_kind varchar(30) NOT NULL,
                actor_ref varchar(255) NOT NULL,
                event_type varchar(60) NOT NULL,
                object_type varchar(30) NOT NULL,
                object_id varchar(255) NOT NULL,
                object_label varchar(500),
                subject_kind varchar(10),
                subject_ref varchar(255),
                before text,
                after text,
                outcome varchar(10) NOT NULL,
                reason varchar(1000),
                correlation_ref varchar(255),
                PRIMARY KEY (event_id, recorded_at)
              ) PARTITION BY RANGE (recorded_at);
        - addForeignKeyConstraint:
            baseTableName: audit_log
            baseColumnNames: organization_id
            referencedTableName: organizations
            referencedColumnNames: id
            constraintName: fk_audit_log_organization
            onDelete: RESTRICT
        - sql:
            comment: "Closed list for actor_kind - person, service account or automated system process"
            sql: >
              ALTER TABLE audit_log
              ADD CONSTRAINT chk_audit_log_actor_kind
              CHECK (actor_kind IN ('USER', 'SERVICE_ACCOUNT', 'SYSTEM_PROCESS'));
        - sql:
            comment: >
              Closed list for event_type - see AuditEventType, kept in lockstep with this
              constraint. Only the store exists in #391; services start writing these once they
              are wired up in later issues.
            sql: >
              ALTER TABLE audit_log
              ADD CONSTRAINT chk_audit_log_event_type
              CHECK (event_type IN (
                'ASSET_GRANT_GRANTED', 'ASSET_GRANT_CHANGED', 'ASSET_GRANT_REVOKED',
                'ASSET_GRANT_EXPIRED', 'ASSET_VISIBILITY_CHANGED', 'ASSET_GRANT_SUSPENDED',
                'SPACE_CREATED', 'SPACE_CHANGED', 'SPACE_DELETED',
                'LIBRARY_CREATED', 'LIBRARY_CHANGED', 'LIBRARY_DELETED',
                'GROUP_CREATED', 'GROUP_CHANGED', 'GROUP_DELETED',
                'SPACE_MEMBER_ADDED', 'SPACE_MEMBER_ROLE_CHANGED', 'SPACE_MEMBER_REMOVED',
                'GROUP_MEMBER_ADDED', 'GROUP_MEMBER_REMOVED',
                'LIBRARY_SHARED_TO_SPACE',
                'ASSET_OWNER_CHANGED', 'ASSET_OWNERSHIP_CLAIMED', 'ASSET_SUCCESSION_OPENED',
                'SYSTEM_ADMIN_ROLE_GRANTED', 'SYSTEM_ADMIN_ROLE_REVOKED',
                'ACCOUNT_DEACTIVATED', 'ACCOUNT_REAUTHENTICATION_FORCED',
                'API_TOKEN_ISSUED', 'API_TOKEN_REVOKED',
                'DIRECTORY_SYNC_CHANGE_APPLIED', 'DIRECTORY_SYNC_RUN_COMPLETED',
                'GOVERNANCE_SETTINGS_CHANGED', 'AUDIT_LOG_CONFIGURATION_CHANGED',
                'MODEL_POLICY_CHANGED', 'CONNECTOR_LIBRARY_SHARE_LIMIT_CHANGED',
                'AUDIT_LOG_ACCESSED'
              ));
        - sql:
            comment: "Closed list for object_type - see io.opaa.audit.AuditObjectType"
            sql: >
              ALTER TABLE audit_log
              ADD CONSTRAINT chk_audit_log_object_type
              CHECK (object_type IN (
                'KNOWLEDGE_LIBRARY', 'SPACE', 'GROUP', 'ASSET_GRANT', 'USER_ACCOUNT',
                'API_TOKEN', 'SYSTEM_SETTING', 'AUDIT_LOG', 'DIRECTORY_SYNC_RUN'
              ));
        - sql:
            comment: "Closed list for outcome - success, denied or failed administrative action"
            sql: >
              ALTER TABLE audit_log
              ADD CONSTRAINT chk_audit_log_outcome
              CHECK (outcome IN ('SUCCESS', 'DENIED', 'FAILURE'));
        - sql:
            comment: >
              subject_kind/subject_ref are paired: either both set or both absent. The leading
              "subject_kind IS NOT NULL" in the second branch is deliberate, not redundant with
              "IN (...)": a bare "subject_kind IN ('USER', 'GROUP')" evaluates to NULL (not FALSE)
              when subject_kind is NULL, and Postgres treats a NULL CHECK result as satisfied, not
              violated - without the explicit null check, a row with subject_kind NULL and
              subject_ref set would silently pass this constraint.
            sql: >
              ALTER TABLE audit_log
              ADD CONSTRAINT chk_audit_log_subject
              CHECK (
                (subject_kind IS NULL AND subject_ref IS NULL)
                OR (subject_kind IS NOT NULL AND subject_kind IN ('USER', 'GROUP')
                    AND subject_ref IS NOT NULL)
              );
        - sql:
            comment: >
              Supports the object-scoped access path #393 will build
              (docs/features/security-and-compliance.md#zugriffswege-was-es-gibt-und-was-es-nicht-gibt),
              which always begins at an object and a time range together.
            sql: >
              CREATE INDEX idx_audit_log_object
              ON audit_log (organization_id, object_type, object_id, recorded_at);
        - sql:
            comment: "Supports the event-type-scoped access path (\"alle Änderungen an Systemeinstellungen\")"
            sql: >
              CREATE INDEX idx_audit_log_event_type
              ON audit_log (organization_id, event_type, recorded_at);
        - sql:
            comment: "Supports the correlation-ref-scoped access path (\"alle Einträge des Verzeichnislaufs\")"
            sql: >
              CREATE INDEX idx_audit_log_correlation
              ON audit_log (organization_id, correlation_ref)
              WHERE correlation_ref IS NOT NULL;
      rollback:
        - sql:
            sql: "DROP TABLE IF EXISTS audit_log CASCADE;"

  - changeSet:
      id: 017-create-audit-log-partitions
      author: opaa
      comment: >
        Creates a long, fixed horizon of monthly partitions - three months back (clock skew,
        backfill, timezone edges) through 16 years forward from the moment this migration runs,
        comfortably above the specification's 10-year retention ceiling
        (docs/features/security-and-compliance.md#aufbewahrung) - and deliberately no DEFAULT
        partition.

        A DEFAULT partition was considered and rejected in code review (#428): it looks like a
        safety net ("a write can never fail even if partition provisioning falls behind"), but a
        Postgres DEFAULT partition cannot be un-DEFAULTed once a row lands in it - the moment any
        row is caught by DEFAULT, the specific monthly partition that row belongs to can no longer
        be created ("updated partition constraint for default partition ... would be violated"),
        and that row is then permanently exempt from the retention deletion this partitioning
        exists to serve. A long, fixed horizon of real partitions removes the reason a DEFAULT
        partition would ever be needed in ordinary operation: any INSERT within the next 16 years
        lands in a real, droppable monthly partition. A write with a timestamp outside that
        horizon fails loudly with "no partition of relation found for row" instead of silently
        landing in a partition nothing can ever reclaim - a loud failure here is the correct
        outcome, not a bug to work around.

        Provisioning further partitions once this horizon runs out is explicitly not part of #391
        (see the changelog header); it belongs with the future retention-deletion work. Whoever
        builds that work should treat this horizon, not "whenever partitions run low", as the
        trigger to extend it, and must use the same ownership (ALTER DEFAULT PRIVILEGES in
        017-restrict-audit-log-privileges only applies to tables opaa_audit_owner itself creates).
      changes:
        - sql:
            # Without this, Liquibase's own statement splitter (not just the JDBC driver) can cut
            # the block at an internal semicolon inside the DO $$ ... $$ body before ever reaching
            # the closing $$, producing a PSQLException "Unterminated dollar quote" - the anonymous
            # code block must be sent to the driver whole.
            splitStatements: false
            sql: >
              DO $$
              DECLARE
                start_month date := date_trunc('month', now() - interval '3 months');
                i integer;
                partition_start date;
                partition_end date;
                partition_name text;
              BEGIN
                FOR i IN 0..194 LOOP
                  partition_start := (start_month + (i || ' months')::interval)::date;
                  partition_end := (start_month + ((i + 1) || ' months')::interval)::date;
                  partition_name := 'audit_log_' || to_char(partition_start, 'YYYY_MM');
                  EXECUTE format(
                    'CREATE TABLE IF NOT EXISTS %I PARTITION OF audit_log FOR VALUES FROM (%L) TO (%L)',
                    partition_name, partition_start, partition_end
                  );
                END LOOP;
              END $$;
      rollback:
        - sql:
            comment: >
              No explicit per-partition drop needed - DROP TABLE ... CASCADE on the parent
              (017-create-audit-log's rollback) removes every partition along with it.
            sql: "SELECT 1;"

  - changeSet:
      id: 017-create-audit-actor-pseudonyms
      author: opaa
      comment: >
        The pseudonym-to-person mapping, held apart from audit_log itself
        (docs/features/security-and-compliance.md#unveränderlichkeit-und-löschrecht): audit_log
        carries only the opaque pseudonym_id as actor_ref, this table is the only place that
        connects it back to a user. fk_audit_actor_pseudonyms_user is ON DELETE CASCADE
        deliberately: deleting a user's account removes its pseudonym mapping automatically, with
        no application code required to remember to do so, while audit_log itself is untouched -
        it has no foreign key to this table and cannot be, since the whole point is that a deleted
        mapping must not cascade into changing or removing an already-written record. One row per
        user (uk_audit_actor_pseudonyms_user): the pseudonym is stable for as long as the account
        exists, not re-minted per event, so an auditor can still tell that a set of entries share
        one (unnamed) actor across multiple audit_log rows.
      changes:
        - createTable:
            tableName: audit_actor_pseudonyms
            columns:
              - column:
                  name: pseudonym_id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: organization_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: audit_actor_pseudonyms
            columnNames: user_id
            constraintName: uk_audit_actor_pseudonyms_user
        - addForeignKeyConstraint:
            baseTableName: audit_actor_pseudonyms
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_audit_actor_pseudonyms_user
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: audit_actor_pseudonyms
            baseColumnNames: organization_id
            referencedTableName: organizations
            referencedColumnNames: id
            constraintName: fk_audit_actor_pseudonyms_organization
            onDelete: RESTRICT
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: audit_actor_pseudonyms
            constraintName: fk_audit_actor_pseudonyms_organization
        - dropForeignKeyConstraint:
            baseTableName: audit_actor_pseudonyms
            constraintName: fk_audit_actor_pseudonyms_user
        - dropUniqueConstraint:
            tableName: audit_actor_pseudonyms
            constraintName: uk_audit_actor_pseudonyms_user
        - dropTable:
            tableName: audit_actor_pseudonyms

  - changeSet:
      id: 017-restrict-audit-log-privileges
      author: opaa
      comment: >
        "Einfaches Anfügen" (#391,
        docs/features/security-and-compliance.md#der-sicherheitsgrad-der-ersten-stufe-einfaches-anfügen,
        ADR-0015): the application account gets INSERT and SELECT on audit_log and
        audit_actor_pseudonyms and nothing else - no UPDATE, no DELETE, no TRUNCATE, and per the
        #391 acceptance criteria, "keine Rechte am Schema der Tabelle".

        A plain REVOKE/GRANT against the application account is not enough for that last part: this
        project runs migrations and the application under the same database role (see
        spring.datasource.username in application.yml), which is also the role CREATE TABLE made
        the owner of every object above - and ownership cannot be revoked from itself. An owner
        keeps full DDL on its own object regardless of what has been REVOKEd from it (it can always
        GRANT itself privileges back, drop a CHECK constraint, detach and rewrite a partition, or
        drop the table outright - all four verified against real Postgres in the #428 review).
        Ownership must therefore move to a role the application account is not.

        This changeSet creates opaa_audit_owner - a dedicated, NOLOGIN role nothing ever
        authenticates as - and transfers ownership of audit_log, every one of its partitions
        (looked up via pg_inherits, not just the ones 017-create-audit-log-partitions happened to
        create) and audit_actor_pseudonyms to it. The application account (current_user) then gets
        exactly INSERT and SELECT, granted on the two parent tables only - never on an individual
        partition directly, which matters because every Postgres partition carries its own ACL:
        an application account with no grant on a partition cannot touch it by naming it directly,
        even though ordinary inserts routed through the partitioned parent work exactly as before.
        ALTER DEFAULT PRIVILEGES FOR ROLE opaa_audit_owner ensures a partition opaa_audit_owner
        creates later (the future retention/provisioning work, explicitly out of #391's scope)
        inherits the same restricted grant automatically, without this migration running again.

        ALTER TABLE ... OWNER TO and ALTER DEFAULT PRIVILEGES FOR ROLE both require the executing
        role to be a member of the target role. Postgres 16 already grants that membership
        automatically the moment CREATE ROLE runs (a CREATEROLE role gets ADMIN OPTION on any role
        it creates) - the explicit GRANT below is a harmless no-op restating what already holds,
        kept for clarity about what this changeSet relies on. The REVOKE at the very end removes
        the *additional* membership this changeSet explicitly granted; the automatic
        CREATE-ROLE-time grant survives it (verified against real Postgres - a plain REVOKE issued
        by current_user only revokes grants current_user itself made, and that automatic one is
        attributed to a different grantor). This residual is intentionally not a security gap:
        it carries ADMIN OPTION only, with INHERIT and SET both false, so it lets current_user
        manage who else is a member of opaa_audit_owner, but grants no access to anything
        opaa_audit_owner owns and no way to become opaa_audit_owner via SET ROLE. See ADR-0015 for
        the full reasoning, and Migration017AuditLogTest for the tests that verify this directly -
        including that SET ROLE opaa_audit_owner itself fails for the application account.

        This is still not a defense against direct database access with sufficient privilege, and
        the specification says so plainly: a superuser bypasses ACLs and ownership checks entirely,
        and whoever can grant CREATEROLE or membership in opaa_audit_owner to the application
        account undoes this changeSet's effect. The boundary this changeSet enforces is the one
        #391 actually asks for: the *application account itself*, including anything that runs SQL
        through it (a bug, an injected statement) and including a direct reference to a specific
        partition, cannot alter, remove, detach or drop an already-written entry, nor grant itself
        the privilege to.
      changes:
        - sql:
            splitStatements: false
            sql: >
              DO $$
              BEGIN
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'opaa_audit_owner') THEN
                  EXECUTE 'CREATE ROLE opaa_audit_owner NOLOGIN';
                END IF;
                EXECUTE format('GRANT opaa_audit_owner TO %I', current_user);
              END $$;
        - sql:
            comment: >
              ALTER TABLE ... OWNER TO requires the new owner to hold CREATE on the object's
              schema, not merely to be a member of a role that holds it - opaa_audit_owner needs
              its own grant. Executing this requires current_user to hold CREATE on schema public
              WITH GRANT OPTION (documented as a migration-account requirement in ADR-0015 and the
              #426 follow-up), not merely CREATE itself.
            sql: "GRANT CREATE ON SCHEMA public TO opaa_audit_owner;"
        - sql:
            sql: "ALTER TABLE audit_log OWNER TO opaa_audit_owner;"
        - sql:
            sql: "ALTER TABLE audit_actor_pseudonyms OWNER TO opaa_audit_owner;"
        - sql:
            comment: "Every partition of audit_log, whichever changeSet or later tool created it - not just the ones 017-create-audit-log-partitions happened to create."
            splitStatements: false
            sql: >
              DO $$
              DECLARE
                partition regclass;
              BEGIN
                FOR partition IN
                  SELECT inhrelid::regclass FROM pg_inherits
                  WHERE inhparent = 'audit_log'::regclass
                LOOP
                  EXECUTE format('ALTER TABLE %s OWNER TO opaa_audit_owner', partition);
                END LOOP;
              END $$;
        - sql:
            sql: "REVOKE ALL ON TABLE audit_log, audit_actor_pseudonyms FROM PUBLIC;"
        - sql:
            splitStatements: false
            sql: >
              DO $$
              BEGIN
                EXECUTE format('GRANT INSERT, SELECT ON TABLE audit_log TO %I', current_user);
                EXECUTE format(
                  'GRANT INSERT, SELECT ON TABLE audit_actor_pseudonyms TO %I', current_user);
              END $$;
        - sql:
            comment: >
              Future partitions opaa_audit_owner creates (the later provisioning work) inherit
              exactly this grant automatically, without this migration running again.
            splitStatements: false
            sql: >
              DO $$
              BEGIN
                EXECUTE format(
                  'ALTER DEFAULT PRIVILEGES FOR ROLE opaa_audit_owner IN SCHEMA public'
                  ' GRANT SELECT, INSERT ON TABLES TO %I',
                  current_user);
              END $$;
        - sql:
            comment: >
              Removes the explicit membership grant made above (see the changeSet comment's third
              paragraph). A separate, automatic membership from CREATE ROLE's own CREATEROLE
              side effect survives this - documented there as an accepted, harmless residual
              (ADMIN OPTION only, no INHERIT, no SET), not something this statement failed to do.
            splitStatements: false
            sql: >
              DO $$
              BEGIN
                EXECUTE format('REVOKE opaa_audit_owner FROM %I', current_user);
              END $$;
      rollback:
        - sql:
            comment: >
              Best-effort reversal, run by current_user: re-acquire membership (requires
              current_user's CREATEROLE attribute to still be present - see ADR-0015), move
              ownership of the parent tables and every partition back, drop the default-privilege
              entry, then release membership again. If current_user's CREATEROLE attribute has
              since been removed (the hardening #426 anticipates), this rollback fails and
              ownership must be reassigned manually - an acceptable limitation for a rollback path,
              matching this project's existing precedent of documented, non-silent rollback limits
              (e.g. 013-backfill-owner-grants).
            splitStatements: false
            sql: >
              DO $$
              BEGIN
                EXECUTE format('GRANT opaa_audit_owner TO %I', current_user);
              END $$;
        - sql:
            sql: "ALTER TABLE audit_log OWNER TO CURRENT_USER;"
        - sql:
            sql: "ALTER TABLE audit_actor_pseudonyms OWNER TO CURRENT_USER;"
        - sql:
            splitStatements: false
            sql: >
              DO $$
              DECLARE
                partition regclass;
              BEGIN
                FOR partition IN
                  SELECT inhrelid::regclass FROM pg_inherits
                  WHERE inhparent = 'audit_log'::regclass
                LOOP
                  EXECUTE format('ALTER TABLE %s OWNER TO CURRENT_USER', partition);
                END LOOP;
              END $$;
        - sql:
            splitStatements: false
            sql: >
              DO $$
              BEGIN
                EXECUTE format(
                  'ALTER DEFAULT PRIVILEGES FOR ROLE opaa_audit_owner IN SCHEMA public'
                  ' REVOKE SELECT, INSERT ON TABLES FROM %I',
                  current_user);
              END $$;
        - sql:
            splitStatements: false
            sql: >
              DO $$
              BEGIN
                EXECUTE format('REVOKE opaa_audit_owner FROM %I', current_user);
              END $$;
