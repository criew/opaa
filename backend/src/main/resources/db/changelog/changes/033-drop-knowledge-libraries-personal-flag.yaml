databaseChangeLog:
  # #522: the automatic personal upload library ("Meine Dokumente") that used to accompany every
  # user's personal space at first login is deleted without replacement - a maintainer decision, not
  # a data migration. Who wants a library now creates one themselves via POST /api/v1/libraries,
  # exactly like any other library. This changeSet removes the schema-level trace of the automation:
  # the personal column and the partial unique index that capped a user at one such library.
  #
  # Every knowledge_libraries row a previous version of KnowledgeLibraryService#ensurePersonalLibrary
  # already created is deliberately left untouched by this migration beyond losing the flag: its
  # owner OWNER grant (asset_grants) already exists from that provisioning, so the library keeps
  # working exactly like any other user-owned UPLOAD library - readable, writable, deletable by its
  # owner. There is nothing else to migrate: personal never fed any other table, and no other column
  # or constraint referenced it.
  #
  # Rollback: dropColumn/dropUniqueConstraint (via the raw index DROP) are reversed with
  # addColumn/the matching CREATE UNIQUE INDEX, mirroring 012-create-knowledge-libraries' own
  # rollback for the same two objects. The restored column defaults every row (old and any created
  # after the rollback) to personal = false - the same "not personal" state the application already
  # treats every library as being in once this PR's code is reverted alongside the schema, so this is
  # a lossless rollback, not a reconstruction of history.

  - changeSet:
      id: 033-drop-knowledge-libraries-personal-owner-index
      author: opaa
      comment: >
        Drops uk_knowledge_libraries_personal_owner (migration 012), the partial unique index that
        capped a user at one personal = true library - dead once the personal column itself goes in
        the next changeSet.
      changes:
        - sql:
            sql: "DROP INDEX IF EXISTS uk_knowledge_libraries_personal_owner;"
      rollback:
        - sql:
            sql: >
              CREATE UNIQUE INDEX uk_knowledge_libraries_personal_owner
              ON knowledge_libraries (owner_user_id)
              WHERE personal = true;

  - changeSet:
      id: 033-drop-knowledge-libraries-personal-column
      author: opaa
      comment: >
        Drops knowledge_libraries.personal (#522) - the automatic personal library and its
        categorisation are gone from the application; see this file's top-level comment for what
        happens to libraries the now-deleted automation already created.
      changes:
        - dropColumn:
            tableName: knowledge_libraries
            columnName: personal
      rollback:
        - addColumn:
            tableName: knowledge_libraries
            columns:
              - column:
                  name: personal
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
