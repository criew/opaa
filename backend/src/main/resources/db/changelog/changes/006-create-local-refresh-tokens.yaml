databaseChangeLog:
  # #1532 (ADR-0033 Entscheidung 7): server-side refresh-token records. Only the HMAC lookup hash
  # of the opaque cookie value is stored (key derived from OPAA_AUTH_JWT_SECRET, so a rotation of the
  # secret ends every session). Tokens form families: a presented token is revoked (ROTATED) and
  # succeeded by rotated_to_id; presenting an already revoked one revokes the whole family
  # (REUSE_DETECTED). expires_at is the idle limit, family_expires_at the absolute end no rotation
  # extends - both are copied into every successor by the issuer (#1533). revocation_reason is an
  # enum, never free text; the two partial indexes serve the two revoke hot paths (per user, per
  # family) and only ever cover active rows. Single-column foreign key: no organization_id here,
  # see 005's comment.
  - changeSet:
      id: 006-create-local-refresh-tokens
      author: opaa
      comment: "local_refresh_tokens: refresh-token families with absolute end, rotation pointer and revocation reason (#1532, ADR-0033)"
      changes:
        - createTable:
            tableName: local_refresh_tokens
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: local_refresh_tokens_pkey
                    nullable: false
              - column:
                  name: family_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: token_lookup_hash
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: issued_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: family_expires_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: revoked_at
                  type: timestamp with time zone
              - column:
                  name: revocation_reason
                  type: varchar(32)
              - column:
                  name: rotated_to_id
                  type: uuid
        - addForeignKeyConstraint:
            baseTableName: local_refresh_tokens
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_local_refresh_tokens_user
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: local_refresh_tokens
            baseColumnNames: rotated_to_id
            referencedTableName: local_refresh_tokens
            referencedColumnNames: id
            constraintName: fk_local_refresh_tokens_rotated_to
            onDelete: SET NULL
        - addUniqueConstraint:
            tableName: local_refresh_tokens
            columnNames: token_lookup_hash
            constraintName: ux_local_refresh_tokens_lookup_hash
        - sql:
            comment: "Enum and pairing CHECKs, chronological order, partial indexes over active rows, cleanup index"
            sql: >
              ALTER TABLE local_refresh_tokens
              ADD CONSTRAINT chk_local_refresh_tokens_revocation_reason
              CHECK (revocation_reason IS NULL OR revocation_reason IN
                     ('ROTATED', 'REUSE_DETECTED', 'LOGOUT', 'PASSWORD_CHANGED', 'ADMIN_RESET',
                      'ACCOUNT_LOCKED', 'HANDED_OVER', 'ADMIN'));
              ALTER TABLE local_refresh_tokens
              ADD CONSTRAINT chk_local_refresh_tokens_revocation_consistent
              CHECK ((revoked_at IS NULL) = (revocation_reason IS NULL));
              ALTER TABLE local_refresh_tokens
              ADD CONSTRAINT chk_local_refresh_tokens_expiry_order
              CHECK (expires_at > issued_at AND family_expires_at >= issued_at);
              CREATE INDEX idx_local_refresh_tokens_active_user
              ON local_refresh_tokens (user_id) WHERE revoked_at IS NULL;
              CREATE INDEX idx_local_refresh_tokens_active_family
              ON local_refresh_tokens (family_id) WHERE revoked_at IS NULL;
              CREATE INDEX idx_local_refresh_tokens_expires_at
              ON local_refresh_tokens (expires_at);
      rollback:
        - dropTable:
            tableName: local_refresh_tokens
