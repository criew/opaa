databaseChangeLog:
  - changeSet:
      id: 037-add-archived-to-spaces
      author: opaa
      comment: >
        Add spaces.archived (#543, docs/features/spaces-and-assets.md#archivieren-statt-löschen).
        A Space with fk_chats_space (ON DELETE RESTRICT, migration 032) referencing a chat authored
        by someone other than the space owner was permanently undeletable - the owner cannot even
        see the foreign chat, let alone remove it, so deleteSpace's existing 409 check on
        ChatRepository#existsBySpaceId never clears. Archiving is the maintainer-decided way out:
        it stops new content, hides the space from listSpaces for members without a chat of their
        own in it, and leaves every existing chat - including the ones the owner cannot see -
        fully readable for its author. It does not remove the fk_chats_space guard or change
        deleteSpace's behaviour: a real delete remains possible once every chat (foreign or not) is
        actually gone.
      changes:
        - addColumn:
            tableName: spaces
            columns:
              - column:
                  name: archived
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
      rollback:
        - dropColumn:
            tableName: spaces
            columnName: archived
