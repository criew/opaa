databaseChangeLog:
  # #521: the single, well-known system library (seeded by 012-seed-system-library) and every row
  # dependent on it are deleted outright - a maintainer decision, not a data migration: the
  # dependent content (pre-#201 documents, indexed chunks) had already been reachable only to a
  # system administrator since it was seeded, and nothing else in the product still writes into it
  # (#419 gave every indexing run its own caller-chosen target library). Deletion order follows the
  # foreign keys migrations 012/013/019 established:
  #   1. vector_store chunks    - not under Liquibase control (see 016's own precondition), joined
  #                                back to documents by metadata->>'document_id'; must run first,
  #                                while documents.library_id below still names the library.
  #   2. indexing_jobs          - fk_indexing_jobs_library is ON DELETE SET NULL (migration 019), so
  #                                these rows would merely be orphaned, not removed, if left to the
  #                                library delete alone; #521 wants them gone, not orphaned.
  #   3. documents               - fk_documents_library_organization is ON DELETE RESTRICT
  #                                (migration 012), so these rows must be deleted before the library
  #                                itself, not left to a cascade.
  #   4. asset_grants            - fk_asset_grants_library_organization is ON DELETE CASCADE
  #                                (migration 013) and would remove these automatically once the
  #                                library row goes, but an explicit delete keeps this changeSet's
  #                                own comment (and any row count it reports) honest about what it
  #                                actually removes, rather than leaning on a side effect.
  #   5. knowledge_libraries      - the library row itself.
  #
  # Deliberately not touched: asset_grant_history/library_visibility_history (permission_history,
  # migration 018). Both carry library_id as a plain value column with no foreign key, by design
  # (see that migration's "Deletion survival" comment and
  # docs/decisions/0016-loeschschicksal-rechtehistorie.md) - deleting the library must never lose or
  # corrupt the record of rights it once carried, so those rows survive exactly as they do for any
  # other deleted library. audit_log likewise carries no foreign key to knowledge_libraries.
  #
  # Rollback: a deliberate no-op, the same reasoning 012-backfill-document-library-id and
  # 013-backfill-owner-grants already document - a bulk delete cannot distinguish the rows it
  # removed from rows an unrelated write created afterwards, so reconstructing them would be
  # fabrication, not rollback.

  - changeSet:
      id: 030-delete-system-library-vector-store-chunks
      author: opaa
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: vector_store
      comment: >
        Deletes every vector_store chunk belonging to a document in the system library
        (00000000-0000-0000-0000-000000000002), joined via metadata->>'document_id' - the same join
        016-backfill-vector-store-library-metadata uses. The precondition mirrors that changeSet's
        own: vector_store is created by Spring AI at startup (PgVectorStore#initializeSchema), not
        by Liquibase, so it may not exist yet on a fresh installation - MARK_RAN is correct there,
        since a fresh installation has no system library content to remove either.
      changes:
        - sql:
            sql: >
              DELETE FROM vector_store v
              USING documents d
              WHERE d.id::text = v.metadata->>'document_id'
                AND d.library_id = '00000000-0000-0000-0000-000000000002';
      rollback:
        - sql:
            sql: "SELECT 1;"

  - changeSet:
      id: 030-delete-system-library-indexing-jobs
      author: opaa
      comment: >
        Deletes every indexing_jobs row that targeted the system library - see this file's top-level
        comment for why this is explicit rather than left to fk_indexing_jobs_library's
        ON DELETE SET NULL.
      changes:
        - sql:
            sql: >
              DELETE FROM indexing_jobs
              WHERE library_id = '00000000-0000-0000-0000-000000000002';
      rollback:
        - sql:
            sql: "SELECT 1;"

  - changeSet:
      id: 030-delete-system-library-documents
      author: opaa
      comment: >
        Deletes every document in the system library - required before the library row itself can
        be removed, since fk_documents_library_organization (migration 012) is ON DELETE RESTRICT.
      changes:
        - sql:
            sql: >
              DELETE FROM documents
              WHERE library_id = '00000000-0000-0000-0000-000000000002';
      rollback:
        - sql:
            sql: "SELECT 1;"

  - changeSet:
      id: 030-delete-system-library-asset-grants
      author: opaa
      comment: >
        Deletes every asset_grants row on the system library - by design there are none (it is
        seeded with no grants at all, migration 012), but this keeps the deletion explicit rather
        than relying on fk_asset_grants_library_organization's ON DELETE CASCADE.
      changes:
        - sql:
            sql: >
              DELETE FROM asset_grants
              WHERE library_id = '00000000-0000-0000-0000-000000000002';
      rollback:
        - sql:
            sql: "SELECT 1;"

  - changeSet:
      id: 030-delete-system-library
      author: opaa
      comment: >
        Deletes the system library row itself (#521). LibraryOwnerType no longer has a SYSTEM value
        - after this changeSet, no row in knowledge_libraries has owner_type = 'SYSTEM', and
        chk_knowledge_libraries_owner_type (migration 012) still permits only 'USER'/'GROUP' values
        for any future insert at the database level, unchanged since that CHECK constraint was never
        narrowed - application code (KnowledgeLibraryService, the OpenAPI spec) is what stops a new
        SYSTEM row from being created, the same layering #201's original SYSTEM support already
        used.
      changes:
        - sql:
            sql: >
              DELETE FROM knowledge_libraries
              WHERE id = '00000000-0000-0000-0000-000000000002';
      rollback:
        - sql:
            sql: "SELECT 1;"
