databaseChangeLog:
  # Retention and automatic deletion for the audit trail (#395,
  # docs/features/security-and-compliance.md#aufbewahrung; depends on #391's monthly partitioning
  # and opaa_audit_owner ownership split, ADR-0015). Two changeSets:
  #   1. 023-create-audit-retention-settings  - the single, system-wide configuration row (lower
  #                                              bound 1 year, default 3 years, upper bound 10 years,
  #                                              both enforced by a CHECK constraint the application
  #                                              cannot widen)
  #   2. 023-create-audit-retention-deletion-function - a parameterless, SECURITY DEFINER function
  #                                              owned by opaa_audit_owner that drops exactly the
  #                                              complete monthly partitions the configured retention
  #                                              has expired, and nothing else - the application
  #                                              account only ever gets EXECUTE on this one function,
  #                                              never DELETE/DROP/TRUNCATE/ownership on audit_log
  #                                              itself (that boundary already exists since #391).
  #
  # Retention is deliberately a single, system-wide setting, not one row per organization: the
  # specification (docs/features/security-and-compliance.md#aufbewahrung) speaks of "die
  # Protokollfrist" in the singular, and audit_log's partitioning is purely time-based (PARTITION BY
  # RANGE (recorded_at), migration 017) - it does not partition by organization_id. A per-organization
  # retention would make "drop the whole expired monthly partition" incoherent the moment two
  # organizations in the same deployment configured different periods (a partition holding one
  # organization's still-retained rows next to another organization's expired ones could not be
  # dropped as a whole slice without deleting individual rows, which is exactly what this table
  # partitioning exists to avoid). This matches the deployment model documented in ADR-0015 and
  # AGENTS.md's own "eine Behörde" framing - one OPAA deployment per agency.
  #
  # Rollback order (reverse of apply order):
  # 023-create-audit-retention-deletion-function
  # 023-create-audit-retention-settings

  - changeSet:
      id: 023-create-audit-retention-settings
      author: opaa
      comment: >
        A singleton table (id fixed to 1 via chk_audit_retention_settings_singleton - not one row
        per organization, see the changelog header) holding the currently configured retention
        period in months, plus last_cutoff and last_run_month - the "wirkt nur nach vorn"
        bookkeeping columns described in the deletion function's own comment below.

        retention_months is bounded 12..120 (1..10 years) by chk_audit_retention_settings_months -
        the specification's non-negotiable lower and upper bound
        (docs/features/security-and-compliance.md#aufbewahrung), enforced at the database level so
        neither an application bug nor a future direct write can configure something outside it; the
        service layer (AuditRetentionSettingsService) validates the same bound before ever issuing a
        write, so a caller sees a clear, German-language rejection rather than a raw constraint
        violation, but the database is still the binding guarantee.

        Ownership moves to opaa_audit_owner (the same role migration 017 established for audit_log
        and audit_actor_pseudonyms) for the same reason: the deletion function below must be able to
        update last_cutoff regardless of what the application account is separately granted, and an
        application account that could freely rewrite last_cutoff could defeat the forward-only cap
        the deletion function relies on. Unlike audit_log itself, the application account keeps a
        narrow write path here (UPDATE on retention_months/updated_at only, never last_cutoff) -
        this table is ordinary configuration an administrator changes, not append-only evidence.

        Grants happen **after** ownership moves to opaa_audit_owner, not before - a `GRANT ... TO
        CURRENT_USER` issued while current_user is still the table's own owner does not create a
        distinguishable ACL entry (current_user already implicitly holds every privilege as owner,
        so Postgres folds the redundant grant into that same implicit entry), and the following
        `ALTER TABLE ... OWNER TO` replaces that entry with the new owner's rather than preserving
        it as a separate grant to the old owner (verified empirically against real Postgres while
        building this migration - an earlier version of this changeSet granted before transferring
        ownership and the application account silently ended up with no privileges at all). Once
        ownership has moved, current_user's persisting inherited membership in opaa_audit_owner
        (the automatic CREATEROLE-time residual migration 017 leaves behind, or the explicit
        temporary grant below) is enough to run GRANT on a table it no longer owns - unlike `ALTER
        TABLE ... OWNER TO` itself, an ordinary `GRANT`/`REVOKE` only needs the executing role to
        act with the owner's privileges (INHERIT), not the *SET* option `ALTER ... OWNER TO`
        additionally requires (see the bracket below).

        A brief, explicit `WITH SET TRUE` membership grant brackets the `ALTER TABLE ... OWNER TO`
        statement, revoked again after the grants that follow it - empirically, `ALTER TABLE ...
        OWNER TO` requires the executing role to hold the *SET* option on membership in the target
        role, not merely plain/inherited membership; the residual, automatic CREATEROLE-time
        membership migration 017 leaves behind does not carry SET (only ADMIN OPTION - see
        migration 022's own changeSet comment for the same finding). No full `SET ROLE`/`RESET
        ROLE` identity switch is needed here, unlike migration 022's `ALTER TABLE ... DROP/ADD
        CONSTRAINT` on an *already* opaa_audit_owner-owned table: `ALTER ... OWNER TO` only checks
        the SET privilege, it does not require current_user to actually assume the new owner's
        identity to run it.
      changes:
        - sql:
            sql: >
              CREATE TABLE audit_retention_settings (
                id integer PRIMARY KEY DEFAULT 1,
                retention_months integer NOT NULL,
                last_cutoff timestamp with time zone,
                last_run_month date,
                updated_at timestamp with time zone NOT NULL,
                CONSTRAINT chk_audit_retention_settings_singleton CHECK (id = 1),
                CONSTRAINT chk_audit_retention_settings_months
                  CHECK (retention_months BETWEEN 12 AND 120)
              );
        - sql:
            comment: >
              The specification's default: 3 years
              (docs/features/security-and-compliance.md#aufbewahrung). last_cutoff/last_run_month
              are seeded here too, not left NULL (code review of #454, finding 3): the deletion
              function's forward-only cap (see that function's own comment) only holds once a
              baseline exists to advance from - a NULL baseline made the very first call after this
              migration adopt an uncapped candidate cutoff, so a retention shortened before that
              first call still deleted retroactively. Seeding the same 36-month baseline this
              changeSet's own default configures means the cap applies from the first call onward,
              never only from the second. The safe direction for an existing installation is to
              retain slightly longer at first, never to delete early.
            sql: >
              INSERT INTO audit_retention_settings
                (id, retention_months, last_cutoff, last_run_month, updated_at)
              VALUES (
                1, 36,
                date_trunc('month', now()) - interval '36 months',
                date_trunc('month', now())::date,
                now()
              );
        - sql:
            sql: "REVOKE ALL ON TABLE audit_retention_settings FROM PUBLIC;"
        - sql:
            comment: >
              Ownership transfer, then (while the temporary SET TRUE membership grant is still
              held, so a subsequent narrower-privilege GRANT statement is still reachable via
              inherited membership) the narrow write path for the application account: it may
              change the configured period (validated 12..120 by
              chk_audit_retention_settings_months regardless) but never last_cutoff directly - that
              column is written exclusively by the deletion function below, which is what makes the
              "wirkt nur nach vorn" cap in that function's comment an actual guarantee rather than a
              convention the application could bypass.
            splitStatements: false
            sql: >
              DO $$
              BEGIN
                EXECUTE format('GRANT opaa_audit_owner TO %I WITH SET TRUE', current_user);
              END $$;
              ALTER TABLE audit_retention_settings OWNER TO opaa_audit_owner;
              GRANT SELECT ON TABLE audit_retention_settings TO CURRENT_USER;
              GRANT UPDATE (retention_months, updated_at) ON TABLE audit_retention_settings
              TO CURRENT_USER;
              DO $$
              BEGIN
                EXECUTE format('REVOKE opaa_audit_owner FROM %I', current_user);
              END $$;
      rollback:
        - sql:
            comment: >
              Best-effort reversal, matching 017-restrict-audit-log-privileges's own rollback
              precedent: re-acquire membership, hand ownership back, then drop.
            splitStatements: false
            sql: >
              DO $$
              BEGIN
                EXECUTE format('GRANT opaa_audit_owner TO %I', current_user);
              END $$;
        - sql:
            sql: "ALTER TABLE audit_retention_settings OWNER TO CURRENT_USER;"
        - sql:
            sql: "DROP TABLE IF EXISTS audit_retention_settings;"

  - changeSet:
      id: 023-create-audit-retention-deletion-function
      author: opaa
      comment: >
        opaa_audit_delete_expired_partitions() - the one and only path anything ever removes a row
        from audit_log through (#395 acceptance criteria: "ein Aufruf, der einzelne Sätze entfernen
        würde, existiert nicht" and "das Anwendungskonto kann die Löschung nicht auslösen" - meaning
        it cannot reach deletion any way other than this narrowly scoped call, exactly as the issue's
        own suggested mechanism, a SECURITY DEFINER function owned by opaa_audit_owner and callable
        by the application account's scheduler, describes).

        Takes **no parameters at all** - it cannot be told which partition, which organization or
        which time range to delete; it only ever consults audit_retention_settings, the single
        persisted configuration row, and only ever DROPs a complete monthly partition table, never a
        DELETE against individual audit_log rows. That is the whole of its attack surface: an
        application account with EXECUTE on this function and nothing else on audit_log itself
        cannot use it to remove anything but a fully expired month, and cannot parameterize its way
        around that.

        SECURITY DEFINER means the DROP TABLE statements this function issues execute with
        opaa_audit_owner's privileges regardless of who calls it - the application account's own
        session never gains DROP/DELETE/TRUNCATE on audit_log itself (that restriction is migration
        017's, unchanged here); it only ever gets to invoke this one pre-defined operation. This is
        the same separation the specification calls for
        (docs/features/security-and-compliance.md#der-sicherheitsgrad-der-ersten-stufe-einfaches-anfügen):
        "sie läuft deshalb nicht über das Anwendungskonto, sondern über ein getrenntes
        Wartungskonto" - technically realised here as "the statement that actually drops the table
        runs as opaa_audit_owner, not as the application role", not as a second database login the
        scheduler would need credentials for.

        **"Wirkt nur nach vorn" (#395 acceptance criteria):** a change that shortens
        retention_months must not let a single scheduled run - nor a burst of rapid, repeated calls
        to this same function, since the application account is free to call it as often as it
        likes - delete an arbitrarily large backlog that only just fell out of the (now shorter)
        window. That would make the setting a tool to make an inconvenient period disappear, exactly
        what the specification rules out, and a naive "advance by at most one month per call" cap
        would not actually prevent it: calling the function twice in the same second already
        "advances" twice.

        The function instead ties its advance to real elapsed calendar time via last_cutoff and
        last_run_month: each run computes how many whole months have passed since the last run's
        month (0 if called again within the same month) and lets the cutoff advance by at most that
        many months beyond the previous run's cutoff - `LEAST(candidate_cutoff, last_cutoff +
        (elapsed_months || ' months')::interval)`. Calling the function any number of times within
        the same month can never move the cutoff further than a single natural month-boundary crossing
        would have; the only way to expire more months is for real time to actually pass. A
        lengthened period is not capped this way - a longer retention_months always yields a
        candidate_cutoff further in the past than last_cutoff plus the elapsed months, so LEAST
        already picks it, taking effect immediately (it only ever protects more data, never removes
        it faster). Verified by Migration023AuditRetentionTest.

        Partition identification relies on the exact naming convention
        017-create-audit-log-partitions established (audit_log_YYYY_MM) - this function does not
        create partitions, only removes ones already matching that pattern once their entire month
        lies at or before the computed cutoff; a partition whose name does not match the pattern is
        silently left alone rather than guessed at.

        **search_path hardening (code review of #454, finding 1, confirmed empirically):** `SET
        search_path = public` alone leaves `pg_temp` searched *before* `public` (Postgres's own
        "Writing SECURITY DEFINER Functions Safely" guidance: the temporary schema is implicitly
        searched second, and is writable by anyone) - the application account could `CREATE TEMP
        TABLE audit_retention_settings (...)` with an out-of-bounds retention_months and a NULL
        last_cutoff, and this function would resolve the unqualified table name against that shadow
        row instead of the real one, defeating both the 12..120 floor/ceiling and the forward-only
        cap in a single call while leaving the real configuration untouched. Fixed by listing
        `pg_temp` explicitly and *last* (`SET search_path = pg_catalog, public, pg_temp`) and
        schema-qualifying every object this function touches (`public.audit_retention_settings`,
        `'public.audit_log'::regclass`) rather than relying on search_path resolution for them at
        all - belt and braces, verified against the same shadow-table attack in
        Migration023AuditRetentionTest.

        The function is created while still owned by current_user (the application/migration
        account, which already holds CREATE on schema public), and ownership moves to
        opaa_audit_owner **before** its EXECUTE grant and REVOKE-from-PUBLIC run - not after, and
        not before creation either: granting to current_user while it is still the function's own
        owner would not create a distinguishable ACL entry (see the settings-table changeSet's own
        comment for the same finding, made building this migration, about `GRANT ... TO
        CURRENT_USER` issued before an ownership transfer). SECURITY DEFINER always resolves
        against the function's *current* owner at call time, not its owner at creation time, so
        this ordering is equivalent to creating it directly as opaa_audit_owner. No full SET
        ROLE/RESET ROLE identity switch is needed for the ALTER FUNCTION ... OWNER TO itself, only
        the same brief, explicit WITH SET TRUE membership bracket the settings-table changeSet
        needs (empirically, plain/inherited residual membership carries no SET option) - and that
        same bracket's inherited membership is what then lets the EXECUTE grant/revoke run
        immediately afterward, against a function current_user no longer owns.
      changes:
        - sql:
            splitStatements: false
            sql: >
              CREATE FUNCTION opaa_audit_delete_expired_partitions()
              RETURNS SETOF text
              LANGUAGE plpgsql
              SECURITY DEFINER
              SET search_path = pg_catalog, public, pg_temp
              AS $fn$
              DECLARE
                cfg RECORD;
                current_month date := date_trunc('month', now())::date;
                candidate_cutoff timestamptz;
                new_cutoff timestamptz;
                elapsed_months integer;
                rec RECORD;
                partition_month date;
              BEGIN
                SELECT retention_months, last_cutoff, last_run_month INTO cfg
                FROM public.audit_retention_settings WHERE id = 1 FOR UPDATE;

                IF NOT FOUND THEN
                  RAISE EXCEPTION 'audit_retention_settings has no row with id=1 - migration 023 should have seeded it; refusing to silently skip retention deletion';
                END IF;

                candidate_cutoff := current_month
                  - (cfg.retention_months::text || ' months')::interval;

                IF cfg.last_cutoff IS NULL OR cfg.last_run_month IS NULL THEN
                  new_cutoff := candidate_cutoff;
                ELSE
                  elapsed_months := GREATEST(
                    0,
                    (extract(year FROM current_month) - extract(year FROM cfg.last_run_month)) * 12
                      + (extract(month FROM current_month) - extract(month FROM cfg.last_run_month))
                  );
                  new_cutoff := LEAST(
                    candidate_cutoff, cfg.last_cutoff + (elapsed_months || ' months')::interval);
                END IF;

                FOR rec IN
                  SELECT inhrelid::regclass AS partition_rel,
                         inhrelid::regclass::text AS partition_name
                  FROM pg_catalog.pg_inherits
                  WHERE inhparent = 'public.audit_log'::regclass
                LOOP
                  partition_month := to_date(
                    substring(rec.partition_name from 'audit_log_(\d{4}_\d{2})$'), 'YYYY_MM');
                  IF partition_month IS NOT NULL
                     AND (partition_month + interval '1 month') <= new_cutoff THEN
                    EXECUTE format('DROP TABLE %s', rec.partition_rel);
                    RETURN NEXT rec.partition_name;
                  END IF;
                END LOOP;

                UPDATE public.audit_retention_settings
                SET last_cutoff = new_cutoff, last_run_month = current_month
                WHERE id = 1;

                RETURN;
              END;
              $fn$;
        - sql:
            comment: >
              Ownership transfer first (see the changeSet comment above for why grants must come
              after it, not before), then - while the temporary SET TRUE membership grant is still
              held, reachable via inherited membership - the application account's EXECUTE grant,
              and finally removing Postgres's own default EXECUTE-for-PUBLIC grant a freshly
              created function otherwise carries.
            splitStatements: false
            sql: >
              DO $$
              BEGIN
                EXECUTE format('GRANT opaa_audit_owner TO %I WITH SET TRUE', current_user);
              END $$;
              ALTER FUNCTION opaa_audit_delete_expired_partitions() OWNER TO opaa_audit_owner;
              GRANT EXECUTE ON FUNCTION opaa_audit_delete_expired_partitions() TO CURRENT_USER;
              REVOKE EXECUTE ON FUNCTION opaa_audit_delete_expired_partitions() FROM PUBLIC;
              DO $$
              BEGIN
                EXECUTE format('REVOKE opaa_audit_owner FROM %I', current_user);
              END $$;
      rollback:
        - sql:
            comment: "Symmetric to the changeSet: hand ownership back before dropping."
            sql: "ALTER FUNCTION opaa_audit_delete_expired_partitions() OWNER TO CURRENT_USER;"
        - sql:
            sql: "DROP FUNCTION IF EXISTS opaa_audit_delete_expired_partitions();"
