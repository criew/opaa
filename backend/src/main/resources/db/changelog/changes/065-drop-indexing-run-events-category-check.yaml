databaseChangeLog:
  # #862 (Epic #826, Befund B4): chk_indexing_run_events_category duplicated the category value
  # list on every extension (056/057) - dropped here without replacement. The Java enum
  # (@Enumerated(STRING)) remains the sole write guard; a value outside it is no longer stopped by
  # the database, only by the application.
  - changeSet:
      id: 065-drop-indexing-run-events-category-check
      author: opaa
      comment: >
        Drops chk_indexing_run_events_category. See this file's header comment for the trade-off.
      changes:
        - sql:
            sql: "ALTER TABLE indexing_run_events DROP CONSTRAINT chk_indexing_run_events_category;"
      rollback:
        - sql:
            sql: >
              ALTER TABLE indexing_run_events
              ADD CONSTRAINT chk_indexing_run_events_category
              CHECK (category IN (
                'REJECTED', 'UNREACHABLE', 'UNSUPPORTED_FORMAT', 'ALLOWLIST', 'ERROR',
                'SCHEDULE_SKIPPED', 'FORMAT_MISMATCH'
              ));
