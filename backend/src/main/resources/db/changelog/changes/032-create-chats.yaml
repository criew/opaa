databaseChangeLog:
  # Three changeSets, in dependency order, introducing persistent chats as space-owned objects
  # (#525, part of epic #523, see docs/features/spaces-and-assets.md#chats):
  #   1. 032-create-chats                  - the chat itself, always in exactly one space
  #   2. 032-create-chat-library-references - the sticky @-references a chat keeps when
  #                                            useKnowledge is false (many-to-many join table)
  #   3. 032-create-chat-messages          - the persisted question/answer turns, replacing the
  #                                            purely in-memory CaffeineChatMemoryRepository as the
  #                                            source of truth for a chat's conversation history
  #
  # A chat is composition, not association (docs/features/spaces-and-assets.md#warum-chats-und-
  # artefakte-keine-assets-sind): space_id is NOT NULL and has no update path in the application -
  # a chat cannot be moved to another space. status is a single-value enum for now (PRIVATE only);
  # the column exists so the SHARED/WITHDRAWN axis from the specification's sharing model (#205)
  # can be added later without a further migration.
  #
  # fk_chats_space is ON DELETE RESTRICT, not CASCADE: docs/features/spaces-and-assets.md#chats-
  # sind-vor-fremder-löschung-geschützt says a chat "bleibt für seinen Autor und im Nachweis
  # erhalten" - a cascading delete would silently destroy every chat in a space the moment the
  # space itself is deleted, the opposite of that guarantee. SpaceService#deleteSpace checks for
  # existing chats itself and rejects with a clear 409 before this constraint would ever fire.
  #
  # Rollback order (reverse of apply order):
  # 032-create-chat-messages
  # 032-create-chat-library-references
  # 032-create-chats

  - changeSet:
      id: 032-create-chats
      author: opaa
      comment: >
        Create chats - a persistent, space-owned object (docs/features/spaces-and-assets.md#chats).
        Every chat belongs to exactly one space (space_id NOT NULL, no nullable transitional state
        unlike documents.library_id in migration 012, because there is no legacy chat data to
        backfill) and to exactly one author. use_knowledge and the sticky library references
        (032-create-chat-library-references) together determine the search scope for every query
        run in this chat - see io.opaa.query.QueryService. title is nullable: a chat without any
        question yet, or one whose title was never set explicitly, falls back to a title derived
        from the first question at read time.
      changes:
        - createTable:
            tableName: chats
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: space_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: author_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: organization_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: varchar(255)
                  constraints:
                    nullable: true
              - column:
                  name: use_knowledge
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(20)
                  defaultValue: "PRIVATE"
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: chats
            baseColumnNames: space_id
            referencedTableName: spaces
            referencedColumnNames: id
            constraintName: fk_chats_space
            onDelete: RESTRICT
        - addForeignKeyConstraint:
            baseTableName: chats
            baseColumnNames: author_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_chats_author
            onDelete: RESTRICT
        - addForeignKeyConstraint:
            baseTableName: chats
            baseColumnNames: organization_id
            referencedTableName: organizations
            referencedColumnNames: id
            constraintName: fk_chats_organization
            onDelete: RESTRICT
        - createIndex:
            tableName: chats
            indexName: idx_chats_space_id
            columns:
              - column:
                  name: space_id
        - createIndex:
            tableName: chats
            indexName: idx_chats_author_id
            columns:
              - column:
                  name: author_id
        - sql:
            comment: "Add check constraint for chat status values"
            sql: >
              ALTER TABLE chats
              ADD CONSTRAINT chk_chats_status
              CHECK (status IN ('PRIVATE'));
      rollback:
        - sql:
            comment: "Drop check constraint for chat status values"
            sql: >
              ALTER TABLE chats
              DROP CONSTRAINT IF EXISTS chk_chats_status;
        - dropTable:
            tableName: chats

  - changeSet:
      id: 032-create-chat-library-references
      author: opaa
      comment: >
        Create chat_library_references - the @-references a chat keeps sticky
        (docs/features/spaces-and-assets.md, epic #523 "Entschiedene Semantik"). Used as the search
        scope when use_knowledge is false; ignored when it is true. A plain many-to-many join table,
        not an array column, so both foreign keys are enforced at the database level.
      changes:
        - createTable:
            tableName: chat_library_references
            columns:
              - column:
                  name: chat_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: library_id
                  type: uuid
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: chat_library_references
            columnNames: chat_id, library_id
            constraintName: pk_chat_library_references
        - addForeignKeyConstraint:
            baseTableName: chat_library_references
            baseColumnNames: chat_id
            referencedTableName: chats
            referencedColumnNames: id
            constraintName: fk_chat_library_references_chat
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: chat_library_references
            baseColumnNames: library_id
            referencedTableName: knowledge_libraries
            referencedColumnNames: id
            constraintName: fk_chat_library_references_library
            onDelete: CASCADE
      rollback:
        - dropTable:
            tableName: chat_library_references

  - changeSet:
      id: 032-create-chat-messages
      author: opaa
      comment: >
        Create chat_messages - the persisted question/answer turns of a chat. Becomes the source of
        truth for conversation memory (io.opaa.query.QueryService), replacing the purely in-memory,
        TTL-evicted CaffeineChatMemoryRepository for chats that have a persisted chat_id; that cache
        may remain in front of it as a pure read optimisation, but is no longer where multi-turn
        context actually lives. sources is a JSON array shaped like QueryResponse.sources
        (SourceReference), nullable because a USER message never carries any. sequence is a
        per-chat, application-assigned ordinal (0, 1, 2, ...) - created_at alone is not a reliable
        ordering for two messages of the same turn written moments apart (timestamp resolution/
        clock skew), so ordering queries sort by (chat_id, sequence), never by created_at alone.
      changes:
        - createTable:
            tableName: chat_messages
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: chat_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: sequence
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: content
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: sources
                  type: json
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: chat_messages
            baseColumnNames: chat_id
            referencedTableName: chats
            referencedColumnNames: id
            constraintName: fk_chat_messages_chat
            onDelete: CASCADE
        - createIndex:
            tableName: chat_messages
            indexName: idx_chat_messages_chat_id
            columns:
              - column:
                  name: chat_id
        - addUniqueConstraint:
            tableName: chat_messages
            columnNames: chat_id, sequence
            constraintName: uk_chat_messages_chat_sequence
        - sql:
            comment: "Add check constraint for chat message role values"
            sql: >
              ALTER TABLE chat_messages
              ADD CONSTRAINT chk_chat_messages_role
              CHECK (role IN ('USER', 'ASSISTANT'));
      rollback:
        - sql:
            comment: "Drop check constraint for chat message role values"
            sql: >
              ALTER TABLE chat_messages
              DROP CONSTRAINT IF EXISTS chk_chat_messages_role;
        - dropTable:
            tableName: chat_messages
