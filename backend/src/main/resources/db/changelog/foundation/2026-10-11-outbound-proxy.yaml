databaseChangeLog:
  - changeSet:
      id: foundation-2026-10-11-outbound-proxy
      author: opaa
      comment: "The house-wide outbound proxy and its NO_PROXY-style exclusion list, as the system administration set them. No row or no host means every connection goes direct."
      changes:
        - sql:
            sql: |
              CREATE TABLE outbound_proxy_settings (
                  id integer NOT NULL,
                  proxy_host text,
                  proxy_port integer,
                  no_proxy text NOT NULL,
                  updated_at timestamp with time zone NOT NULL,
                  CONSTRAINT outbound_proxy_settings_pkey PRIMARY KEY (id),
                  CONSTRAINT chk_outbound_proxy_settings_singleton CHECK (id = 1),
                  CONSTRAINT chk_outbound_proxy_settings_port CHECK (proxy_port BETWEEN 1 AND 65535),
                  CONSTRAINT chk_outbound_proxy_settings_host_and_port CHECK ((proxy_host IS NULL) = (proxy_port IS NULL))
              );
