databaseChangeLog:
  - changeSet:
      id: workspace-2026-10-11-space-model-instruction
      author: opaa
      comment: "Instruction of a space to the model for every answer in it; null while it has none."
      changes:
        - sql:
            sql: |
              ALTER TABLE spaces ADD COLUMN model_instruction character varying(1000);
              ALTER TABLE spaces ADD CONSTRAINT chk_spaces_model_instruction_not_blank
                  CHECK (model_instruction IS NULL OR model_instruction ~ '[^[:space:]]');
