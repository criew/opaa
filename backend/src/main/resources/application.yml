server:
  address: ${OPAA_SERVER_ADDRESS:localhost}
  # Honor X-Forwarded-* from the reverse proxy chain so that same-origin browser requests are
  # recognized as such behind a TLS-terminating proxy (#553). The outer proxy MUST set
  # X-Forwarded-Proto authoritatively (overwriting any client-supplied value) - see
  # docs/deployment.md; a spoofed header would otherwise let a request bypass the CORS check.
  forward-headers-strategy: framework

spring:
  application:
    name: opaa
  profiles:
    default: local
  # Feste deutsche Locale, damit Bean-Validation-Meldungen in API-Antworten
  # unabhängig vom Accept-Language-Header des Clients deutsch sind.
  web:
    locale: de_DE
    locale-resolver: fixed
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  servlet:
    multipart:
      # Bound to the exact same value as opaa.upload.max-file-size below (#420 code review, finding
      # 2), not a separately chosen, larger container-level cap: a gap between the two would leave
      # every file above this limit and up to that gap answered by Spring's own untranslated 500 /
      # multipart error page instead of GlobalExceptionHandler's German 413. Both this and
      # opaa.upload.max-file-size read the same OPAA_UPLOAD_MAX_FILE_SIZE env var (bytes, "B" suffix
      # for DataSize parsing here) so they can never drift apart. GlobalExceptionHandler still
      # answers 413 for the (rare, container-level) MaxUploadSizeExceededException this produces -
      # not because the size differs from opaa.upload.max-file-size's own check, but because
      # multipart request framing overhead can push a request that size alone but under the limit
      # over max-request-size first.
      max-file-size: ${OPAA_UPLOAD_MAX_FILE_SIZE:52428800}B
      max-request-size: ${OPAA_UPLOAD_MAX_FILE_SIZE:52428800}B
  datasource:
    url: ${OPAA_DB_URL:jdbc:postgresql://localhost:5432/opaa?prepareThreshold=0}
    username: ${OPAA_DB_USERNAME:opaa}
    password: ${OPAA_DB_PASSWORD:opaa}
    hikari:
      # #307: written out explicitly as a deliberate value, not left as an implicit Spring Boot
      # default that could silently drift on a future Boot upgrade. 10 is enough even for the
      # highest-pressure case #307 measured - many different users' first logins arriving at once
      # (e.g. a whole organization's staff onboarding in one morning) - because that path no longer
      # spends more pooled connections than necessary: UserService.findOrCreateUser only ever holds
      # one connection at a time (#293/#299), and SpaceService.ensureDefaultSpaceForNewUser skips
      # the existence check that used to double a first login's round trips (see its Javadoc and
      # UserServiceConcurrentDistinctUserLoginIntegrationTest, which exercises exactly this scenario
      # at this pool size). Raising this number was considered and rejected as treating the symptom,
      # not the cause - PR #305 already rejected it once for the same reason.
      maximum-pool-size: 10
  ai:
    # #762: a single connection path for both functions - the OpenAI-compatible protocol. Ollama
    # speaks it too (under its own /v1 endpoint), which is why there is no separate "ollama"
    # provider anymore - see docs/features/llm-integration.md#ein-anbindungsweg-nicht-zwei. The
    # value is fixed, not driven by an environment variable: with the native Ollama starter gone,
    # "openai" is the only autoconfiguration Spring AI can wire here.
    model:
      chat: openai
      embedding: openai
    # Unlike before #762, the base URL DOES have a default: locally operated models are the
    # default (docs/features/llm-integration.md#eigene-modelle-zuerst), and that default is
    # now expressed here directly rather than through a second, native configuration block. The
    # profile-specific overrides below point at the same Ollama server the removed "ollama" blocks
    # used to (docker: the "ollama" service name; local/default: localhost) - only the property
    # holding the address changed, not the target. A real vendor's endpoint still has to be stated
    # explicitly by overriding the variables below; nothing here silently reaches outside the
    # organisation, because the default itself stays local. Ollama needs no access key at all, so
    # the placeholder default below is never sent anywhere that checks it.
    openai:
      api-key: ${OPAA_OPENAI_API_KEY:sk-placeholder}
      base-url: ${OPAA_OPENAI_BASE_URL:http://localhost:11434/v1}
      chat:
        api-key: ${OPAA_OPENAI_CHAT_API_KEY:${OPAA_OPENAI_API_KEY:sk-placeholder}}
        base-url: ${OPAA_OPENAI_CHAT_BASE_URL:${OPAA_OPENAI_BASE_URL:http://localhost:11434/v1}}
        model: ${OPAA_OPENAI_CHAT_MODEL:phi3:mini}
        temperature: ${OPAA_OPENAI_CHAT_TEMPERATURE:0.7}
        max-tokens: ${OPAA_OPENAI_CHAT_MAX_TOKENS:2000}
      embedding:
        api-key: ${OPAA_OPENAI_EMBEDDING_API_KEY:${OPAA_OPENAI_API_KEY:sk-placeholder}}
        base-url: ${OPAA_OPENAI_EMBEDDING_BASE_URL:${OPAA_OPENAI_BASE_URL:http://localhost:11434/v1}}
        model: ${OPAA_OPENAI_EMBEDDING_MODEL:nomic-embed-text}
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: hnsw
        distance-type: ${OPAA_PGVECTOR_DISTANCE_TYPE:cosine_distance}
        dimensions: ${OPAA_PGVECTOR_DIMENSIONS:1536}

opaa:
  auth:
    # No default mode on purpose: the active Spring profile ("oidc" or "dev")
    # sets it. Starting without one of those profiles fails fast, see
    # io.opaa.auth.AuthProfileGuard.
    initial-admin-email: ${OPAA_INITIAL_ADMIN_EMAIL:admin@opaa.local}
  http:
    force-http1: ${OPAA_HTTP_FORCE_HTTP1:false}
  query:
    top-k: ${OPAA_QUERY_TOP_K:5}
    similarity-threshold: ${OPAA_QUERY_SIMILARITY_THRESHOLD:0.3}
  indexing:
    document-path: ${OPAA_INDEXING_DOCUMENT_PATH:./documents}
    chunk-size: ${OPAA_INDEXING_CHUNK_SIZE:1000}
    chunk-overlap: ${OPAA_INDEXING_CHUNK_OVERLAP:100}
    batch-size: ${OPAA_INDEXING_BATCH_SIZE:50}
    embedding-concurrency: ${OPAA_INDEXING_EMBEDDING_CONCURRENCY:3}
    retry-attempts: ${OPAA_INDEXING_RETRY_ATTEMPTS:3}
    thread-pool:
      core-size: ${OPAA_INDEXING_THREAD_POOL_CORE_SIZE:2}
      max-size: ${OPAA_INDEXING_THREAD_POOL_MAX_SIZE:4}
      queue-capacity: ${OPAA_INDEXING_THREAD_POOL_QUEUE_CAPACITY:20}
    rss:
      max-entries: ${OPAA_INDEXING_RSS_MAX_ENTRIES:200}
      max-feed-size-bytes: ${OPAA_INDEXING_RSS_MAX_FEED_SIZE_BYTES:10485760}
      max-page-size-bytes: ${OPAA_INDEXING_RSS_MAX_PAGE_SIZE_BYTES:5242880}
      request-delay-ms: ${OPAA_INDEXING_RSS_REQUEST_DELAY_MS:1000}
      user-agent: ${OPAA_INDEXING_RSS_USER_AGENT:OPAA-Indexer/1.0}
      main-content-selector: ${OPAA_INDEXING_RSS_MAIN_CONTENT_SELECTOR:main, article, [role=main]}
      attachment-profile: ${OPAA_INDEXING_RSS_ATTACHMENT_PROFILE:GENERIC}
      max-attachments-per-entry: ${OPAA_INDEXING_RSS_MAX_ATTACHMENTS_PER_ENTRY:10}
      max-attachment-size-bytes: ${OPAA_INDEXING_RSS_MAX_ATTACHMENT_SIZE_BYTES:20971520}
    # #484/ADR-0018 Entscheidung 6: absolute base directories a FILESYSTEM library's sourcePath
    # must resolve underneath. No default on purpose - an empty allowlist disables the FILESYSTEM
    # quellentyp entirely, the safe default for a fresh installation.
    filesystem-allowlist: ${OPAA_INDEXING_FILESYSTEM_ALLOWLIST:}
    # #267: SSRF hardening for HTTP_DIRECTORY/RSS_FEED fetches - see TargetAddressValidator.
    target-validation:
      enabled: ${OPAA_INDEXING_TARGET_VALIDATION_ENABLED:true}
      allowlist: ${OPAA_INDEXING_TARGET_VALIDATION_ALLOWLIST:}
  upload:
    storage-path: ${OPAA_UPLOAD_STORAGE_PATH:./uploads}
    max-file-size: ${OPAA_UPLOAD_MAX_FILE_SIZE:52428800}
    # #614: own pool, deliberately not opaa.indexing.thread-pool - see UploadProperties#threadPool.
    thread-pool:
      core-size: ${OPAA_UPLOAD_THREAD_POOL_CORE_SIZE:2}
      max-size: ${OPAA_UPLOAD_THREAD_POOL_MAX_SIZE:4}
      queue-capacity: ${OPAA_UPLOAD_THREAD_POOL_QUEUE_CAPACITY:20}
    # #614: threshold, in minutes, after which a PENDING upload row is considered abandoned by a
    # dead process and set to FAILED at the next application startup - see
    # UploadPendingRecoveryRunner.
    pending-recovery-threshold-minutes: ${OPAA_UPLOAD_PENDING_RECOVERY_THRESHOLD_MINUTES:30}
    # #119: maximum total size (bytes), summed across every document a library holds, that library
    # may occupy - enforced at every path that stores document content (upload, and the FILESYSTEM/
    # HTTP_DIRECTORY/RSS_FEED connectors), not only this REST endpoint. Default 10 GiB. 0 or
    # negative disables the quota entirely - see UploadProperties#libraryQuotaBytes.
    library-quota-bytes: ${OPAA_UPLOAD_LIBRARY_QUOTA_BYTES:10737418240}
  documents:
    # #748 review, finding 1: the synchronous remote-content proxy path (GET
    # /api/v1/documents/{documentId}/content for a HTTP_DIRECTORY/RSS_FEED document, #747) gets its
    # own, smaller bound and shorter per-hop timeout instead of reusing opaa.upload.max-file-size
    # and UrlFileDownloader#downloadBounded's 120s background-indexing timeout - see
    # RemoteContentProperties.
    remote-content:
      max-bytes: ${OPAA_DOCUMENTS_REMOTE_CONTENT_MAX_BYTES:20971520}
      timeout-seconds: ${OPAA_DOCUMENTS_REMOTE_CONTENT_TIMEOUT_SECONDS:20}
  rate-limit:
    enabled: ${OPAA_RATE_LIMIT_ENABLED:true}
    query:
      max-requests: ${OPAA_RATE_LIMIT_QUERY_MAX_REQUESTS:10}
      window-seconds: ${OPAA_RATE_LIMIT_QUERY_WINDOW_SECONDS:60}
      global-max-requests: ${OPAA_RATE_LIMIT_QUERY_GLOBAL_MAX_REQUESTS:100}
    indexing:
      max-requests: ${OPAA_RATE_LIMIT_INDEXING_MAX_REQUESTS:1}
      window-seconds: ${OPAA_RATE_LIMIT_INDEXING_WINDOW_SECONDS:60}
      global-max-requests: ${OPAA_RATE_LIMIT_INDEXING_GLOBAL_MAX_REQUESTS:5}
    # #514/PR #537 review, finding 3: the source connection test is a synchronous probe with its
    # own outbound connections - looser than the indexing trigger (a caller is expected to test
    # a few configurations while filling out the create dialog) but still capped, so it cannot be
    # used to tie up worker threads or as a fast internal port/host scanner.
    source-test:
      max-requests: ${OPAA_RATE_LIMIT_SOURCE_TEST_MAX_REQUESTS:10}
      window-seconds: ${OPAA_RATE_LIMIT_SOURCE_TEST_WINDOW_SECONDS:60}
      global-max-requests: ${OPAA_RATE_LIMIT_SOURCE_TEST_GLOBAL_MAX_REQUESTS:30}
    # #748 review, finding 1: GET /api/v1/documents/{documentId}/content is, for a HTTP_DIRECTORY/
    # RSS_FEED document, a synchronous proxy fetch with its own outbound connection (#747) - the
    # same reason source-test above is limited, except this one is reachable by any VIEWER on
    # routine "Im Dokument öffnen" clicks rather than gated behind library creation, so its limit is
    # looser than source-test's but still capped.
    document-content:
      max-requests: ${OPAA_RATE_LIMIT_DOCUMENT_CONTENT_MAX_REQUESTS:20}
      window-seconds: ${OPAA_RATE_LIMIT_DOCUMENT_CONTENT_WINDOW_SECONDS:60}
      global-max-requests: ${OPAA_RATE_LIMIT_DOCUMENT_CONTENT_GLOBAL_MAX_REQUESTS:100}
  cors:
    allowed-origins: ${OPAA_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  directory-sync:
    change-threshold-fraction: ${OPAA_DIRECTORY_SYNC_CHANGE_THRESHOLD_FRACTION:0.3}
  security:
    credentials:
      # AES-256 key (Base64, 32 raw bytes) for encrypting knowledge_libraries.source_credentials at
      # rest (#483). No default here on purpose - a real deployment must set one before storing any
      # library's credentials; see docs/deployment.md. The dev profile below (not local) sets an
      # explicitly-marked non-production default so bootRun and tests work without operator setup.
      encryption-key: ${OPAA_CREDENTIALS_ENCRYPTION_KEY:}
    settings:
      # AES-256 key (Base64, 32 raw bytes) for io.opaa.security.SettingsEncryptor - encrypts
      # llm_models.api_key_ciphertext at rest (#756, docs/features/llm-integration.md#stufe-1-verwaltete-chat-modelle-in-umsetzung).
      # A deliberately separate key from OPAA_CREDENTIALS_ENCRYPTION_KEY above: the two protect
      # different kinds of secret (a knowledge library's source credentials vs. a managed model's
      # API key) with no reason to share a key or its rotation schedule. Validated lazily, on first
      # use, exactly like OPAA_CREDENTIALS_ENCRYPTION_KEY (PR #763 review) - not eagerly at startup:
      # most deployments never store a model API key at all, and an unconditional startup check
      # would refuse to start every one of them, including an existing installation upgrading in
      # place. No default here on purpose; the dev profile below sets an explicitly-marked
      # non-production default so bootRun and tests work without operator setup.
      encryption-key: ${OPAA_SETTINGS_ENCRYPTION_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    org.hibernate.orm.connections.pooling: WARN

---
spring:
  config:
    activate:
      on-profile: local
  # No override needed: the top-level defaults above already point at localhost, the correct
  # target for this profile. This section exists only so the "local" profile documents the same
  # explicit choice the "docker" profile below makes for its own target.

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${OPAA_DB_URL:jdbc:postgresql://postgres:5432/opaa?prepareThreshold=0}
  ai:
    openai:
      base-url: ${OPAA_OPENAI_BASE_URL:http://ollama:11434/v1}
      chat:
        base-url: ${OPAA_OPENAI_CHAT_BASE_URL:${OPAA_OPENAI_BASE_URL:http://ollama:11434/v1}}
      embedding:
        base-url: ${OPAA_OPENAI_EMBEDDING_BASE_URL:${OPAA_OPENAI_BASE_URL:http://ollama:11434/v1}}

---
spring:
  config:
    activate:
      on-profile: oidc
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${OPAA_OIDC_JWK_SET_URI:http://localhost:8180/realms/opaa/protocol/openid-connect/certs}
          issuer-uri: ${OPAA_OIDC_ISSUER_URI:http://localhost:8180/realms/opaa}

opaa:
  auth:
    mode: oidc
    oidc:
      authority: ${OPAA_OIDC_AUTHORITY:http://localhost:8180/realms/opaa}
      client-id: ${OPAA_OIDC_CLIENT_ID:opaa-frontend}

---
# Development and test profile: no credential check at all. Requests are
# authenticated as opaa.auth.dev.default-user, or as the user named in the
# X-OPAA-Dev-User header. See io.opaa.auth.DevAuthFilter.
spring:
  config:
    activate:
      on-profile: dev

opaa:
  auth:
    mode: dev
    dev:
      issuer: ${OPAA_AUTH_DEV_ISSUER:opaa-dev}
      default-user: ${OPAA_AUTH_DEV_DEFAULT_USER:dev-admin}
      users:
        # Matches the default opaa.auth.initial-admin-email, and is therefore
        # provisioned as SYSTEM_ADMIN on first request.
        - subject: dev-admin
          email: admin@opaa.local
          display-name: Dev Admin
        - subject: dev-user
          email: dev-user@opaa.local
          display-name: Dev User
  indexing:
    # #484: the dev profile (also active for the backend test suite, see AGENTS.md) opens /data and
    # /tmp so existing FILESYSTEM fixtures (literal "/data/documents"/"/tmp/..." sourcePaths in
    # KnowledgeLibraryServiceIntegrationTest et al.) keep working without every test wiring its own
    # allowlist. Tests that need a genuinely different allowlist (e.g. an empty one, to exercise the
    # "FILESYSTEM disabled" path, or a @TempDir outside /tmp) override
    # opaa.indexing.filesystem-allowlist via @DynamicPropertySource.
    filesystem-allowlist: ${OPAA_INDEXING_FILESYSTEM_ALLOWLIST:/data,/tmp}
  security:
    credentials:
      # NICHT FUER DEN PRODUKTIVBETRIEB - a fixed, publicly-known 32-byte AES key so bootRun and
      # every backend test (all activate "dev", see AGENTS.md) can create/rotate credentials
      # without operator setup (#483). Any deployment that does not activate the "dev" profile
      # falls back to the (empty) base value above and must set OPAA_CREDENTIALS_ENCRYPTION_KEY
      # itself - see docs/deployment.md.
      encryption-key: ${OPAA_CREDENTIALS_ENCRYPTION_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    settings:
      # NICHT FUER DEN PRODUKTIVBETRIEB - the same reasoning as opaa.security.credentials above, a
      # distinct fixed key so bootRun and the backend test suite (#756) can encrypt a seeded or
      # test-created model's API key without operator setup. Any deployment that does not activate
      # the "dev" profile falls back to the (empty) base value above and must set
      # OPAA_SETTINGS_ENCRYPTION_KEY itself before storing a model's API key - see
      # docs/deployment.md.
      encryption-key: ${OPAA_SETTINGS_ENCRYPTION_KEY:c2V0dGluZ3NkZXZrZXkwMHNldHRpbmdzZGV2a2V5MDE=}
