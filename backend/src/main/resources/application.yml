server:
  address: ${OPAA_SERVER_ADDRESS:localhost}
  # Honor X-Forwarded-* from the reverse proxy chain so that same-origin browser requests are
  # recognized as such behind a TLS-terminating proxy. The outer proxy MUST set X-Forwarded-Proto
  # authoritatively (overwriting any client-supplied value) - see
  # docs/handbuch/betrieb/netz-und-sicherheit.md; a spoofed header would otherwise let a request
  # bypass the CORS check.
  forward-headers-strategy: framework
  # A stop lets requests already being handled finish instead of cutting them off; new connections
  # are refused from the first moment of the shutdown. The window below bounds the wait.
  shutdown: graceful

spring:
  application:
    name: opaa
  lifecycle:
    # How long a shutdown phase may take - a window per phase, not a budget for the whole stop. It
    # is meant for the HTTP requests in flight - a chat answer is the longest ordinary one - not
    # for background runs: ShutdownLifecycleConfiguration pins the task executors' phase to zero,
    # so an indexing run is interrupted at once and recovered on the next start, exactly as
    # before, and gives the two pools without any recovery a short window of their own.
    timeout-per-shutdown-phase: ${OPAA_SHUTDOWN_TIMEOUT:60s}
  profiles:
    default: local
  # Feste deutsche Locale, damit Bean-Validation-Meldungen in API-Antworten
  # unabhängig vom Accept-Language-Header des Clients deutsch sind.
  web:
    locale: de_DE
    locale-resolver: fixed
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
      # Chat is now resolved at runtime from the active io.opaa.llm.LlmModel row via
      # io.opaa.llm.ActiveChatModelResolver, built programmatically per request rather than once at
      # startup from this static autoconfiguration - so the ChatModel/ChatClient.Builder beans it
      # would otherwise register are unused dead weight. The first chat model comes from the
      # installation (ADR-0060), in the dev mode from spring.ai.openai.base-url.
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  servlet:
    multipart:
      # Bound to the exact same value as opaa.upload.max-file-size below, not a separately chosen,
      # larger container-level cap: a gap between the two would leave every file above this limit
      # and up to that gap answered by Spring's own untranslated 500 / multipart error page instead
      # of GlobalExceptionHandler's German 413. Both this and opaa.upload.max-file-size read the
      # same OPAA_UPLOAD_MAX_FILE_SIZE env var (bytes, "B" suffix for DataSize parsing here) so they
      # can never drift apart. GlobalExceptionHandler still answers 413 for the (rare,
      # container-level) MaxUploadSizeExceededException this produces - not because the size differs
      # from opaa.upload.max-file-size's own check, but because multipart request framing overhead
      # can push a request that size alone but under the limit over max-request-size first.
      max-file-size: ${OPAA_UPLOAD_MAX_FILE_SIZE:52428800}B
      max-request-size: ${OPAA_UPLOAD_MAX_FILE_SIZE:52428800}B
  datasource:
    url: ${OPAA_DB_URL:jdbc:postgresql://localhost:5432/opaa?prepareThreshold=0}
    username: ${OPAA_DB_USERNAME:opaa}
    password: ${OPAA_DB_PASSWORD:opaa}
    hikari:
      # Written out explicitly as a deliberate value, not left as an implicit Spring Boot default
      # that could silently drift on a future Boot upgrade. 10 is enough even for the
      # highest-pressure case - many different users' first logins arriving at once (e.g. a whole
      # organization's staff onboarding in one morning) - because that path spends no more pooled
      # connections than necessary: UserService.findOrCreateUser only ever holds one connection at a
      # time, and SpaceService.ensureDefaultSpaceForNewUser skips a redundant existence check (see
      # its Javadoc and UserServiceConcurrentDistinctUserLoginIntegrationTest, which exercises
      # exactly this scenario at this pool size). Raising this number was considered and rejected as
      # treating the symptom, not the cause. The pool belongs to one instance; several instances
      # need max_connections for all their pools, see docs/handbuch/betrieb/datenbank.md.
      maximum-pool-size: ${OPAA_DB_POOL_SIZE:10}
      # Every unqualified name - migration DDL, JPA entities, native queries - resolves through this
      # search_path (ADR-0034). public stays behind the application schema only so an extension
      # installed there beforehand (vector) remains resolvable; nothing of OPAA's own lands in it.
      data-source-properties:
        currentSchema: ${opaa.database.schema},public
  flyway:
    # One directory per logical module under db/migration; Flyway orders every script by its version
    # across the directories (backend/docs/migrationen.md).
    locations: classpath:db/migration
    # Explicit so that the schema history and ${flyway:defaultSchema} name the application schema;
    # a missing schema fails the migration instead of being created or falling through to public.
    default-schema: ${opaa.database.schema}
    create-schemas: false
    # A migration merged after a later-versioned one still runs on an installation that already has
    # the later one; every script is written to be correct in both orders.
    out-of-order: true
  ai:
    # A single connection path for both functions - the OpenAI-compatible protocol. Ollama speaks it
    # too (under its own /v1 endpoint), which is why there is no separate "ollama" provider anymore
    # - see docs/features/llm-integration.md#ein-anbindungsweg-nicht-zwei. The value is fixed, not
    # driven by an environment variable: with the native Ollama starter gone, "openai" is the only
    # autoconfiguration Spring AI can wire here.
    # The embedding model is no autoconfiguration either: it is the row of embedding_model, chosen
    # in the installation (ADR-0060, Entscheidung 10) and served by io.opaa.llm.InstalledEmbeddingModel.
    model:
      chat: openai
      embedding: none
    # The shared model address and key exist in the dev mode only, see the "dev" document below:
    # every other mode gets its models from the installation (ADR-0060).
    openai:
      embedding:
        # Per embedding call; a batch of bge-m3 on CPU takes well over a minute. Address, model, key
        # and input limit are no configuration: they belong to the installed embedding model.
        timeout: ${OPAA_OPENAI_EMBEDDING_TIMEOUT:180s}
    mcp:
      server:
        # The MCP server of the external-access channel (ADR-0035): stateless Streamable HTTP,
        # synchronous because the tools call synchronous domain services. The path belongs to the
        # streamable-http group even in the stateless mode - a key under "stateless." would be
        # ignored without a word, and the filter chain rule would then guard another path than the
        # endpoint listens on (io.opaa.mcp.McpEndpoint derives both from this value).
        protocol: STATELESS
        type: SYNC
        name: opaa
        streamable-http:
          mcp-endpoint: /mcp
        # Tools are the only surface offered; resources, prompts and completions each carry their
        # own permission question, and registering one is the decision to expose it.
        capabilities:
          resource: false
          prompt: false
          completion: false
    vectorstore:
      pgvector:
        # vector_store and its indexes are created once, with the dimension of the probe embedding,
        # when the embedding model is installed (io.opaa.knowledge.VectorTableCreator), so no
        # instance runs DDL for it at start-up.
        initialize-schema: false
        # Must equal opaa.database.schema (io.opaa.config.DatabaseSchemaGuard).
        schema-name: ${opaa.database.schema}
        index-type: hnsw
        distance-type: ${OPAA_PGVECTOR_DISTANCE_TYPE:cosine_distance}

opaa:
  permission:
    # Mindestgruppengroesse eines Rechteprofil-Laufs mit Space-Kontext (ADR-0036). 5 ist zugleich
    # Voreinstellung und erzwungene Untergrenze: GroupSizeProperties bricht den Start bei einem
    # kleineren Wert ab.
    minimum-group-size: ${OPAA_MINIMUM_GROUP_SIZE:5}
  # The self-disclosure of a person (io.opaa.selfdisclosure): exports streaming at once on this
  # instance (1 to 16; above it 503) and how long one export may stream (5m to 2h). Emergency
  # switch and daily limit live in the database (self_disclosure_settings).
  self-disclosure:
    max-concurrent-exports: ${OPAA_SELF_DISCLOSURE_MAX_CONCURRENT_EXPORTS:2}
    max-duration: ${OPAA_SELF_DISCLOSURE_MAX_DURATION:30m}
  database:
    # PostgreSQL schema that holds every table of OPAA (ADR-0034). It must exist and belong to the
    # database account before the first start; validated by io.opaa.config.DatabaseSchemaGuard.
    schema: ${OPAA_DB_SCHEMA:public}
  # Installation of a fresh instance (ADR-0060, io.opaa.installation): the token the installation API
  # requires (empty: the first start generates one and prints it once), the networks the API answers
  # from (empty: no restriction) and the answer file a start applies while the installation is
  # pending (empty: none).
  installation:
    token: ${OPAA_INSTALLATION_TOKEN:}
    allowed-cidrs: ${OPAA_INSTALLATION_ALLOWED_CIDRS:}
    answer-file: ${OPAA_INSTALLATION_ANSWER_FILE:}
    # Mail servers the installation's MAIL step may reach on internal addresses; entries host or
    # host:port. The administration checks no mail server address.
    mail-target-allowlist: ${OPAA_INSTALLATION_MAIL_TARGET_ALLOWLIST:}
  auth:
    # No default mode on purpose: the active Spring profile ("oidc" or "dev")
    # sets it. Starting without one of those profiles fails fast, see
    # io.opaa.auth.AuthProfileGuard.
    # How old the sign-in behind a token (its auth_time) may be for an operation marked
    # @RequiresRecentLogin (io.opaa.auth.RecentLoginPolicy); a non-positive value refuses the start.
    recent-login:
      max-age: ${OPAA_AUTH_RECENT_LOGIN_MAX_AGE:5m}
    # The address of the account that may become the first AUDITOR of an organization without an
    # identity provider's roles claim; every later AUDITOR grant needs an auditor's confirmation
    # (io.opaa.auth.AuditorRoleProperties). Empty means none.
    auditor-role:
      first-auditor-email: ${OPAA_AUTH_FIRST_AUDITOR_EMAIL:}
    # Local accounts (ADR-0033): the one secret every key of the local token issuer is derived from
    # (HKDF, io.opaa.security.LocalAuthKeyService - access-token signature, refresh-token lookup,
    # action-token lookup) and the session limits of the local issuer. No default for the secret on
    # purpose: the "oidc" profile refuses to start without a strong one (at least 32 characters, no
    # placeholder - io.opaa.account.LocalAuthSecretGuard); the dev profile below sets an
    # explicitly-marked non-production value. Rotating the secret ends every local session and
    # invalidates every open invitation, reset and handover link - the documented step after a
    # database restore. The limits are validated at startup in every profile (LocalAuthProperties):
    # refresh-token-ttl is the idle limit (at most 30 days), session-max-lifetime the absolute end
    # of a session no refresh extends (at most 90 days); local SYSTEM_ADMIN accounts get the shorter
    # admin-* values. The issuer of local accounts is fixed to urn:opaa:local and not configurable.
    local:
      jwt-secret: ${OPAA_AUTH_JWT_SECRET:}
      access-token-ttl: ${OPAA_AUTH_LOCAL_ACCESS_TOKEN_TTL:15m}
      refresh-token-ttl: ${OPAA_AUTH_LOCAL_REFRESH_TOKEN_TTL:7d}
      session-max-lifetime: ${OPAA_AUTH_LOCAL_SESSION_MAX_LIFETIME:30d}
      admin-refresh-token-ttl: ${OPAA_AUTH_LOCAL_ADMIN_REFRESH_TOKEN_TTL:4h}
      admin-session-max-lifetime: ${OPAA_AUTH_LOCAL_ADMIN_SESSION_MAX_LIFETIME:12h}
      cookie-secure: ${OPAA_AUTH_LOCAL_COOKIE_SECURE:true}
      # A rotated refresh token whose successor was never used is renewed once more instead of
      # counting as a replay for this long after its rotation (at most 60s, 0 switches it off):
      # the reload that discarded the rotation's answer (ADR-0033, Entscheidung 7).
      refresh-grace-period: ${OPAA_AUTH_LOCAL_REFRESH_GRACE_PERIOD:20s}
      # Emergency account of the system administration (ADR-0033, Entscheidungen 5 and 9), created
      # by the installation: "force" restores it once at start-up with a password printed once,
      # or creates it under admin-reset-email where there is none (io.opaa.account.LocalAdminReset);
      # the CIDR list limits the sign-in of local SYSTEM_ADMIN accounts, empty means no restriction.
      admin-reset: ${OPAA_LOCAL_ADMIN_RESET:}
      admin-reset-email: ${OPAA_LOCAL_ADMIN_RESET_EMAIL:}
      admin-allowed-cidrs: ${OPAA_LOCAL_ADMIN_ALLOWED_CIDRS:}
      # Lockout after failed sign-ins (Entscheidung 9; io.opaa.account.LocalAccountLockoutListener):
      # a fixed duration, no progressive extension; the counter returns to zero on success. The
      # single failed attempt is an application-log line, the lock an audit event.
      lockout:
        max-attempts: ${OPAA_AUTH_LOCAL_LOCKOUT_MAX_ATTEMPTS:5}
        duration: ${OPAA_AUTH_LOCAL_LOCKOUT_DURATION:15m}
  http:
    force-http1: ${OPAA_HTTP_FORCE_HTTP1:false}
  chat:
    note:
      # Points the Gespraechsnotiz of one chat keeps at most; appending beyond it drops the
      # oldest point. Ebene-1 benchmark value, only judgeable with the multi-turn harness
      # (docs/features/conversation-memory.md). Everything else about the note is a fixed
      # value with no addressee to reconfigure it.
      max-items: ${OPAA_CHAT_NOTE_MAX_ITEMS:10}
  # SPIKE (#1789), throwaway ahead of epic #1747 - never for production use. A message starting
  # with "@test " (case-insensitive) runs through a model-driven tool-calling loop instead of the
  # ordinary retrieval/answer path; every other message is unaffected. Off by default; the beans
  # behind it (io.opaa.query.spike) only exist while this is set.
  spike:
    tool-loop:
      enabled: ${OPAA_SPIKE_TOOL_LOOP_ENABLED:false}
  # Installation-wide feature flags (ADR-0044, io.opaa.common.FeatureFlags): every flag is on
  # unless the installation sets it to false; read once at start-up. Switching a feature off hides
  # it and ignores its existing data, it deletes nothing. A new flag is one constant in
  # io.opaa.common.Feature, one entry here and one property in FeaturesConfig (auth.yaml).
  features:
    prompt-libraries:
      enabled: ${OPAA_FEATURES_PROMPT_LIBRARIES_ENABLED:true}
    metadata:
      enabled: ${OPAA_FEATURES_METADATA_ENABLED:true}
    speech-input:
      enabled: ${OPAA_FEATURES_SPEECH_INPUT_ENABLED:true}
    external-access:
      enabled: ${OPAA_FEATURES_EXTERNAL_ACCESS_ENABLED:true}
  # Demo seed only: POST /api/v1/spaces/{spaceId}/chat-imports writes prepared chat transcripts
  # without a model call. The route exists only while this is true; off everywhere else.
  demo:
    chat-import:
      enabled: ${OPAA_DEMO_CHAT_IMPORT_ENABLED:false}
  query:
    top-k: ${OPAA_QUERY_TOP_K:20}
    fetch-k: ${OPAA_QUERY_FETCH_K:25}
    mmr-lambda: ${OPAA_QUERY_MMR_LAMBDA:1.0}
    similarity-threshold: ${OPAA_QUERY_SIMILARITY_THRESHOLD:0.3}
    query-decomposition-enabled: ${OPAA_QUERY_DECOMPOSITION_ENABLED:true}
    max-sub-queries: ${OPAA_QUERY_MAX_SUB_QUERIES:3}
    # Fill target of document completion, not a cap: a document already in the selection is topped
    # up to this many chunks from the candidate pool. One holding more is never trimmed to it, it
    # loses chunks only as an eviction source for another document. 1 (the default) switches
    # completion off; the selection may still hold several chunks of a document.
    max-chunks-per-document: ${OPAA_QUERY_MAX_CHUNKS_PER_DOCUMENT:1}
    full-text-search-enabled: ${OPAA_QUERY_FULL_TEXT_SEARCH_ENABLED:true}
    # How many fused candidates the rerank stage scores, and the budget the fusion keeps for it
    # while reranking runs. An Ebene-1 benchmark value (see QueryProperties); 0 switches the stage
    # off through its own parameter, independently of the role switch below.
    rerank-candidate-count: ${OPAA_QUERY_RERANK_CANDIDATE_COUNT:50}
    # Sizes the selection by score instead of always filling top-k (RelevanceCutoffProperties):
    # fixed | relative | knee. top-k stays the upper bound. Ebene-1 benchmark values.
    relevance-cutoff:
      mode: ${OPAA_QUERY_RELEVANCE_CUTOFF_MODE:fixed}
      min-chunks: ${OPAA_QUERY_RELEVANCE_CUTOFF_MIN_CHUNKS:10}
      relative-threshold: ${OPAA_QUERY_RELEVANCE_CUTOFF_RELATIVE_THRESHOLD:0.6}
      knee-drop: ${OPAA_QUERY_RELEVANCE_CUTOFF_KNEE_DROP:0.25}
    # How the fusion scores the candidate lists (rrf | score), whether every sub-query gets its
    # share of the selection, and how many top candidates of every list enter it whatever their
    # fused rank (QueryProperties.Fusion). Ebene-1 benchmark values.
    fusion:
      method: ${OPAA_QUERY_FUSION_METHOD:rrf}
      sub-query-quota: ${OPAA_QUERY_FUSION_SUB_QUERY_QUOTA:true}
      vector-weight: ${OPAA_QUERY_FUSION_VECTOR_WEIGHT:0.7}
      guaranteed-per-list: ${OPAA_QUERY_FUSION_GUARANTEED_PER_LIST:1}
    # The conversation window (messages the chat memory keeps, always even) and how many of its
    # most recent turns the sub-question decomposition sees - the search never sees more of the
    # conversation than the answer. Ebene-1 benchmark values, only judgeable with the multi-turn
    # harness (docs/features/conversation-memory.md).
    conversation-window-messages: ${OPAA_QUERY_CONVERSATION_WINDOW_MESSAGES:20}
    search-window-turns: ${OPAA_QUERY_SEARCH_WINDOW_TURNS:2}
    # How many HNSW index entries one vector search may visit to fill fetch-k within its filter
    # (VectorIndexScanProperties); a narrower search ends with a short list the protocol names.
    vector-index:
      max-scan-tuples: ${OPAA_QUERY_VECTOR_INDEX_MAX_SCAN_TUPLES:20000}
    # The neighbours of every selected chunk the answer prompt additionally carries
    # (NeighborChunkProperties): chunk_index +- radius of the same document, bounded in characters.
    # Radius 0 switches it off.
    neighbor-chunks:
      radius: ${OPAA_QUERY_NEIGHBOR_CHUNKS_RADIUS:1}
      max-added-characters: ${OPAA_QUERY_NEIGHBOR_CHUNKS_MAX_ADDED_CHARACTERS:40000}
    # The entry condition of the core-field filter - the fill level a field must reach in the asking
    # person's search scope before the filter interface offers it. Committed before the first
    # measurement (ADR-0012); overridable for tests and deliberate experiments, not an
    # administration setting. The cache TTL bounds staleness of the bestand only; a rights change
    # discards a person's cached options immediately.
    metadata-filter:
      document-type-offer-threshold: ${OPAA_QUERY_METADATA_FILTER_DOCUMENT_TYPE_THRESHOLD:0.90}
      document-date-offer-threshold: ${OPAA_QUERY_METADATA_FILTER_DOCUMENT_DATE_THRESHOLD:0.75}
      library-field-offer-threshold: ${OPAA_QUERY_METADATA_FILTER_LIBRARY_FIELD_THRESHOLD:0.75}
      options-cache-ttl: ${OPAA_QUERY_METADATA_FILTER_OPTIONS_CACHE_TTL:5m}
  # The reading path without generation. The hit count is cut out of the retrieval's own selection
  # (opaa.query.top-k), it never searches further. The fetch cap is the one place a single call can
  # return a whole document, and it is deliberately finite.
  search:
    default-max-hits: ${OPAA_SEARCH_DEFAULT_MAX_HITS:10}
    max-hits: ${OPAA_SEARCH_MAX_HITS:50}
    excerpt-max-characters: ${OPAA_SEARCH_EXCERPT_MAX_CHARACTERS:1500}
    fetch-max-characters: ${OPAA_SEARCH_FETCH_MAX_CHARACTERS:200000}
    context-passages: ${OPAA_SEARCH_CONTEXT_PASSAGES:1}
  # Address check of every model endpoint the installation or the model administration stores or
  # tests (chat, embedding, rerank, transcription); separate from opaa.indexing.target-validation,
  # so a model host released here is no permitted source and vice versa. Entries host or host:port.
  model:
    target-validation:
      enabled: ${OPAA_MODEL_TARGET_VALIDATION_ENABLED:true}
      allowlist: ${OPAA_MODEL_TARGET_VALIDATION_ALLOWLIST:}
  # The load limits of the rerank model role. Switch, address, model and key are rows of the
  # model administration (rerank_model, ADR-0060, Entscheidung 10); the factory default is off.
  rerank:
    # 240s carries the measured CPU case (~3 min/query, 50 candidates, 20 CPU cores,
    # BAAI/bge-reranker-v2-m3) - a shorter default reports normal CPU latency as UNREACHABLE.
    # Installations with a faster (typically GPU-backed) endpoint may lower this.
    timeout: ${OPAA_RERANK_TIMEOUT:240s}
    # Longest gap without a result from the endpoint before the role probes it; each probe is a
    # real, billable rerank request, and every real call resets the gap. At least 10s.
    probe-interval: ${OPAA_RERANK_PROBE_INTERVAL:60s}
  # The load limits of the transcription model role (dictation in the chat input). Switch, address,
  # model, key and language are rows of the model administration (transcription_model); the
  # factory default is off. The audio is passed through in memory and never stored or logged.
  transcription:
    max-audio-bytes: ${OPAA_TRANSCRIPTION_MAX_AUDIO_BYTES:10485760}
    timeout: ${OPAA_TRANSCRIPTION_TIMEOUT:120s}
    # Recordings passed on at the same time, installation-wide; each is held in memory meanwhile.
    max-concurrent: ${OPAA_TRANSCRIPTION_MAX_CONCURRENT:4}
  # Malware scan of every file before a library takes it in: a clamd daemon over TCP (INSTREAM).
  # Off by default; enabled without a host refuses the start. on-unavailable: REJECT keeps a file
  # the scanner could not judge out, ACCEPT takes it in unscanned. clamd's StreamMaxLength must
  # cover the largest file, or such a file counts as not judged. timeout bounds one whole scan.
  malware-scan:
    enabled: ${OPAA_MALWARE_SCAN_ENABLED:false}
    host: ${OPAA_MALWARE_SCAN_HOST:}
    port: ${OPAA_MALWARE_SCAN_PORT:3310}
    timeout: ${OPAA_MALWARE_SCAN_TIMEOUT:30s}
    on-unavailable: ${OPAA_MALWARE_SCAN_ON_UNAVAILABLE:REJECT}
  # Export of the audit log to a SIEM (ADR-0055): syslog/CEF over TCP, TLS by default, without
  # pseudonyms and, unless include-labels, without object names, from the moment it is switched
  # on. Off by default; enabled without a host refuses the start. An entry waits for every older
  # open transaction; settle-delay is only a small extra margin.
  siem-export:
    enabled: ${OPAA_SIEM_EXPORT_ENABLED:false}
    host: ${OPAA_SIEM_EXPORT_HOST:}
    port: ${OPAA_SIEM_EXPORT_PORT:6514}
    tls: ${OPAA_SIEM_EXPORT_TLS:true}
    include-labels: ${OPAA_SIEM_EXPORT_INCLUDE_LABELS:false}
    timeout: ${OPAA_SIEM_EXPORT_TIMEOUT:30s}
    settle-delay: ${OPAA_SIEM_EXPORT_SETTLE_DELAY:5s}
    batch-size: ${OPAA_SIEM_EXPORT_BATCH_SIZE:500}
  indexing:
    # Tokens; only the Tika fallback and plain texts. Structured formats cut by characters below.
    chunk-size: ${OPAA_INDEXING_CHUNK_SIZE:1000}
    chunk-overlap: ${OPAA_INDEXING_CHUNK_OVERLAP:100}
    # Target size of the structure-aware cut (Markdown, DOCX, ODT, HTML, PDF, Confluence, slides,
    # tables) in characters, 500-8000; existing chunks are re-cut by the pipeline re-index.
    chunk-target-characters: ${OPAA_INDEXING_CHUNK_TARGET_CHARACTERS:4000}
    batch-size: ${OPAA_INDEXING_BATCH_SIZE:50}
    embedding-concurrency: ${OPAA_INDEXING_EMBEDDING_CONCURRENCY:3}
    # Fallback rate of the Folgekosten estimate, in chunks per second. Only used until
    # EmbeddingRateEstimator has measured enough real embedding calls; the answer names which of the
    # two it used.
    embedding-rate-estimate: ${OPAA_INDEXING_EMBEDDING_RATE_ESTIMATE:4.0}
    stale-job-timeout: ${OPAA_INDEXING_STALE_JOB_TIMEOUT:4h}
    thread-pool:
      core-size: ${OPAA_INDEXING_THREAD_POOL_CORE_SIZE:2}
      max-size: ${OPAA_INDEXING_THREAD_POOL_MAX_SIZE:4}
      queue-capacity: ${OPAA_INDEXING_THREAD_POOL_QUEUE_CAPACITY:20}
    # What every request to a source OPAA does not operate carries and tolerates - RSS feed, web
    # directory and Confluence alike; see SourceHttpProperties. Confluence keeps its own
    # rate-limit numbers below. The two per-run bounds apply to the feed and web-directory
    # connectors only; Confluence and S3 keep their own request budgets.
    http:
      user-agent: ${OPAA_INDEXING_HTTP_USER_AGENT:OPAA-Indexer/1.0}
      max-rate-limit-retries: ${OPAA_INDEXING_HTTP_MAX_RATE_LIMIT_RETRIES:6}
      max-retry-after: ${OPAA_INDEXING_HTTP_MAX_RETRY_AFTER:2m}
      request-budget-per-run: ${OPAA_INDEXING_HTTP_REQUEST_BUDGET_PER_RUN:0}
      max-rate-limit-wait-per-run: ${OPAA_INDEXING_HTTP_MAX_RATE_LIMIT_WAIT_PER_RUN:15m}
    rss:
      max-entries: ${OPAA_INDEXING_RSS_MAX_ENTRIES:200}
      max-feed-size-bytes: ${OPAA_INDEXING_RSS_MAX_FEED_SIZE_BYTES:10485760}
      max-page-size-bytes: ${OPAA_INDEXING_RSS_MAX_PAGE_SIZE_BYTES:5242880}
      request-delay-ms: ${OPAA_INDEXING_RSS_REQUEST_DELAY_MS:1000}
      main-content-selector: ${OPAA_INDEXING_RSS_MAIN_CONTENT_SELECTOR:main, article, [role=main]}
      attachment-profile: ${OPAA_INDEXING_RSS_ATTACHMENT_PROFILE:GENERIC}
      max-attachments-per-entry: ${OPAA_INDEXING_RSS_MAX_ATTACHMENTS_PER_ENTRY:10}
      max-attachment-size-bytes: ${OPAA_INDEXING_RSS_MAX_ATTACHMENT_SIZE_BYTES:20971520}
    # Bounds AutoindexCrawlerService's recursive HTTP_DIRECTORY crawl - see CrawlProperties. A
    # separate opaa.indexing.crawl.* property block, not nested fields of IndexingProperties itself
    # (own record, own binding prefix). max-file-size-bytes caps a single crawled entry's transfer
    # while it streams to disk, so neither an oversized nor an afterwards-rejected entry can fill
    # the temp partition.
    crawl:
      max-depth: ${OPAA_INDEXING_CRAWL_MAX_DEPTH:10}
      max-entries: ${OPAA_INDEXING_CRAWL_MAX_ENTRIES:50000}
      max-file-size-bytes: ${OPAA_INDEXING_CRAWL_MAX_FILE_SIZE_BYTES:104857600}
    # ADR-0023: bounds of the Confluence access layer (io.opaa.indexing.source.confluence) - own
    # property block like crawl above, see ConfluenceProperties.
    confluence:
      page-size: ${OPAA_INDEXING_CONFLUENCE_PAGE_SIZE:100}
      request-timeout: ${OPAA_INDEXING_CONFLUENCE_REQUEST_TIMEOUT:30s}
      detection-timeout: ${OPAA_INDEXING_CONFLUENCE_DETECTION_TIMEOUT:10s}
      max-rate-limit-retries: ${OPAA_INDEXING_CONFLUENCE_MAX_RATE_LIMIT_RETRIES:6}
      max-retry-after: ${OPAA_INDEXING_CONFLUENCE_MAX_RETRY_AFTER:2m}
      max-response-bytes: ${OPAA_INDEXING_CONFLUENCE_MAX_RESPONSE_BYTES:10485760}
      max-attachment-size-bytes: ${OPAA_INDEXING_CONFLUENCE_MAX_ATTACHMENT_SIZE_BYTES:20971520}
      max-listing-pages: ${OPAA_INDEXING_CONFLUENCE_MAX_LISTING_PAGES:500}
      incremental-overlap: ${OPAA_INDEXING_CONFLUENCE_INCREMENTAL_OVERLAP:10m}
      # Requests one run may send before it ends as "unvollständig, wird fortgesetzt"; 0 disables
      # the budget. Default measured against a real Data Center (see
      # ConfluenceProperties.DEFAULT_REQUEST_BUDGET_PER_RUN and
      # docs/handbuch/betrieb/konfiguration.md).
      request-budget-per-run: ${OPAA_INDEXING_CONFLUENCE_REQUEST_BUDGET_PER_RUN:50000}
    # ADR-0027: bounds of the S3 access layer (io.opaa.indexing.source.s3) - own property block
    # like confluence above, see S3Properties.
    s3:
      list-page-size: ${OPAA_INDEXING_S3_LIST_PAGE_SIZE:1000}
      max-object-size-bytes: ${OPAA_INDEXING_S3_MAX_OBJECT_SIZE_BYTES:52428800}
      request-timeout: ${OPAA_INDEXING_S3_REQUEST_TIMEOUT:30s}
      max-retries: ${OPAA_INDEXING_S3_MAX_RETRIES:5}
      retry-backoff: ${OPAA_INDEXING_S3_RETRY_BACKOFF:500ms}
      # requests one run may send before it ends as "unvollständig, wird fortgesetzt"; 0 disables
      # the budget (see S3Properties.DEFAULT_REQUEST_BUDGET_PER_RUN).
      request-budget-per-run: ${OPAA_INDEXING_S3_REQUEST_BUDGET_PER_RUN:20000}
      # listed objects one run may hold before it fails visibly asking for narrower scopes - an
      # emergency brake for heap and runtime (see S3Properties.DEFAULT_MAX_OBJECTS_PER_RUN).
      max-objects-per-run: ${OPAA_INDEXING_S3_MAX_OBJECTS_PER_RUN:1000000}
      # object downloads one run keeps in flight while its listing goes on (a bound on the load
      # put on the store; 1 downloads serially, see S3Properties.DEFAULT_DOWNLOAD_CONCURRENCY).
      download-concurrency: ${OPAA_INDEXING_S3_DOWNLOAD_CONCURRENCY:2}
    # Bounds of the Nextcloud connector (io.opaa.indexing.source.nextcloud), see
    # NextcloudProperties; 0 falls back to the default.
    nextcloud:
      max-file-size-bytes: ${OPAA_INDEXING_NEXTCLOUD_MAX_FILE_SIZE_BYTES:52428800}
      request-timeout: ${OPAA_INDEXING_NEXTCLOUD_REQUEST_TIMEOUT:30s}
      # requests one run may send before it ends as "unvollständig, wird fortgesetzt"
      request-budget-per-run: ${OPAA_INDEXING_NEXTCLOUD_REQUEST_BUDGET_PER_RUN:20000}
      max-entries-per-run: ${OPAA_INDEXING_NEXTCLOUD_MAX_ENTRIES_PER_RUN:1000000}
      download-concurrency: ${OPAA_INDEXING_NEXTCLOUD_DOWNLOAD_CONCURRENCY:2}
      max-response-bytes: ${OPAA_INDEXING_NEXTCLOUD_MAX_RESPONSE_BYTES:67108864}
    # Bounds of the SMB connector (io.opaa.indexing.source.smb, SmbProperties); 0 falls back to the
    # default.
    smb:
      max-file-size-bytes: ${OPAA_INDEXING_SMB_MAX_FILE_SIZE_BYTES:52428800}
      request-timeout: ${OPAA_INDEXING_SMB_REQUEST_TIMEOUT:30s}
      # SMB messages one run may send before it ends as "unvollständig, wird fortgesetzt"
      request-budget-per-run: ${OPAA_INDEXING_SMB_REQUEST_BUDGET_PER_RUN:100000}
      max-entries-per-run: ${OPAA_INDEXING_SMB_MAX_ENTRIES_PER_RUN:1000000}
      download-concurrency: ${OPAA_INDEXING_SMB_DOWNLOAD_CONCURRENCY:2}
      list-page-size: ${OPAA_INDEXING_SMB_LIST_PAGE_SIZE:1000}
    # Bounds of the Google Drive connector (ADR-0040, Entscheidung 10; GoogleDriveProperties).
    google-drive:
      page-size: ${OPAA_INDEXING_GOOGLE_DRIVE_PAGE_SIZE:1000}
      max-file-size-bytes: ${OPAA_INDEXING_GOOGLE_DRIVE_MAX_FILE_SIZE_BYTES:52428800}
      request-timeout: ${OPAA_INDEXING_GOOGLE_DRIVE_REQUEST_TIMEOUT:30s}
      download-timeout: ${OPAA_INDEXING_GOOGLE_DRIVE_DOWNLOAD_TIMEOUT:10m}
      max-retries: ${OPAA_INDEXING_GOOGLE_DRIVE_MAX_RETRIES:5}
      retry-backoff: ${OPAA_INDEXING_GOOGLE_DRIVE_RETRY_BACKOFF:1s}
      request-budget-per-run: ${OPAA_INDEXING_GOOGLE_DRIVE_REQUEST_BUDGET_PER_RUN:20000}
      max-files-per-run: ${OPAA_INDEXING_GOOGLE_DRIVE_MAX_FILES_PER_RUN:1000000}
      download-concurrency: ${OPAA_INDEXING_GOOGLE_DRIVE_DOWNLOAD_CONCURRENCY:2}
    # SharePoint document libraries over Microsoft Graph (see SharePointProperties).
    sharepoint:
      page-size: ${OPAA_INDEXING_SHAREPOINT_PAGE_SIZE:200}
      max-file-size-bytes: ${OPAA_INDEXING_SHAREPOINT_MAX_FILE_SIZE_BYTES:52428800}
      request-timeout: ${OPAA_INDEXING_SHAREPOINT_REQUEST_TIMEOUT:30s}
      download-timeout: ${OPAA_INDEXING_SHAREPOINT_DOWNLOAD_TIMEOUT:10m}
      max-retries: ${OPAA_INDEXING_SHAREPOINT_MAX_RETRIES:5}
      max-retry-wait: ${OPAA_INDEXING_SHAREPOINT_MAX_RETRY_WAIT:60s}
      max-throttle-wait-per-run: ${OPAA_INDEXING_SHAREPOINT_MAX_THROTTLE_WAIT_PER_RUN:30m}
      request-budget-per-run: ${OPAA_INDEXING_SHAREPOINT_REQUEST_BUDGET_PER_RUN:20000}
      max-files-per-run: ${OPAA_INDEXING_SHAREPOINT_MAX_FILES_PER_RUN:1000000}
      download-concurrency: ${OPAA_INDEXING_SHAREPOINT_DOWNLOAD_CONCURRENCY:2}
    # Dropbox over its API v2 (see DropboxProperties). The addresses are Dropbox's own; they move
    # only to a stand-in for tests.
    dropbox:
      api-base: ${OPAA_INDEXING_DROPBOX_API_BASE:https://api.dropboxapi.com}
      content-base: ${OPAA_INDEXING_DROPBOX_CONTENT_BASE:https://content.dropboxapi.com}
      authorization-endpoint: ${OPAA_INDEXING_DROPBOX_AUTHORIZATION_ENDPOINT:https://www.dropbox.com/oauth2/authorize}
      token-endpoint: ${OPAA_INDEXING_DROPBOX_TOKEN_ENDPOINT:https://api.dropboxapi.com/oauth2/token}
      revocation-endpoint: ${OPAA_INDEXING_DROPBOX_REVOCATION_ENDPOINT:https://api.dropboxapi.com/2/auth/token/revoke}
      page-size: ${OPAA_INDEXING_DROPBOX_PAGE_SIZE:2000}
      max-file-size-bytes: ${OPAA_INDEXING_DROPBOX_MAX_FILE_SIZE_BYTES:52428800}
      request-timeout: ${OPAA_INDEXING_DROPBOX_REQUEST_TIMEOUT:30s}
      download-timeout: ${OPAA_INDEXING_DROPBOX_DOWNLOAD_TIMEOUT:10m}
      max-retries: ${OPAA_INDEXING_DROPBOX_MAX_RETRIES:5}
      max-retry-wait: ${OPAA_INDEXING_DROPBOX_MAX_RETRY_WAIT:5m}
      request-budget-per-run: ${OPAA_INDEXING_DROPBOX_REQUEST_BUDGET_PER_RUN:20000}
      max-files-per-run: ${OPAA_INDEXING_DROPBOX_MAX_FILES_PER_RUN:1000000}
      download-concurrency: ${OPAA_INDEXING_DROPBOX_DOWNLOAD_CONCURRENCY:2}
    # The shared event intake behind every push path (Confluence webhooks, S3 event
    # notifications): how long reported keys are collected before one targeted run checks them,
    # how many keys a batch holds before the connector's ordinary run takes over, and how often a
    # batch waits for a run in progress before it is dropped (see SourceEventProperties).
    events:
      debounce: ${OPAA_INDEXING_EVENTS_DEBOUNCE:5s}
      max-pending-keys: ${OPAA_INDEXING_EVENTS_MAX_PENDING_KEYS:500}
      max-deferrals: ${OPAA_INDEXING_EVENTS_MAX_DEFERRALS:120}
    # DoS-hardening limits for TabularDocumentFormat (XLSX/CSV/ODS) - own property block, own
    # binding prefix, see TabularProperties's own Javadoc for why.
    tabular:
      max-row-columns: ${OPAA_INDEXING_TABULAR_MAX_ROW_COLUMNS:200}
      max-ods-cell-repeat: ${OPAA_INDEXING_TABULAR_MAX_ODS_CELL_REPEAT:50}
      max-ods-content-xml-bytes: ${OPAA_INDEXING_TABULAR_MAX_ODS_CONTENT_XML_BYTES:10485760}
      max-ods-rows: ${OPAA_INDEXING_TABULAR_MAX_ODS_ROWS:100000}
    # DoS-hardening limits for MailDocumentFormat (EML/MSG) - own property block, own binding
    # prefix, see MailProperties's own Javadoc for why.
    mail:
      max-attachments-per-message: ${OPAA_INDEXING_MAIL_MAX_ATTACHMENTS_PER_MESSAGE:50}
      max-attachment-bytes: ${OPAA_INDEXING_MAIL_MAX_ATTACHMENT_BYTES:52428800}
      max-message-bytes: ${OPAA_INDEXING_MAIL_MAX_MESSAGE_BYTES:104857600}
    # DoS-hardening limits for OdtDocumentFormat/OdpDocumentFormat (ODT/ODP) - own property block,
    # own binding prefix, see OdfProperties's own Javadoc for why.
    odf:
      max-content-xml-bytes: ${OPAA_INDEXING_ODF_MAX_CONTENT_XML_BYTES:10485760}
      max-odt-paragraphs: ${OPAA_INDEXING_ODF_MAX_ODT_PARAGRAPHS:50000}
      max-odp-slides: ${OPAA_INDEXING_ODF_MAX_ODP_SLIDES:5000}
      max-space-repeat: ${OPAA_INDEXING_ODF_MAX_SPACE_REPEAT:1000}
      max-text-characters: ${OPAA_INDEXING_ODF_MAX_TEXT_CHARACTERS:10000000}
    # DoS-hardening limits for the structure formats (PDF, DOCX, PPTX, XLSX/CSV, HTML, Markdown),
    # see ParserLimitProperties: text per document, the unpacked XML of an OOXML package and the
    # content-stream operators, decoded content bytes (per document and per stream), reading
    # time, pages and objects of a PDF.
    parser-limits:
      max-text-characters: ${OPAA_INDEXING_PARSER_LIMITS_MAX_TEXT_CHARACTERS:10000000}
      max-ooxml-part-bytes: ${OPAA_INDEXING_PARSER_LIMITS_MAX_OOXML_PART_BYTES:33554432}
      max-ooxml-total-bytes: ${OPAA_INDEXING_PARSER_LIMITS_MAX_OOXML_TOTAL_BYTES:67108864}
      max-pdf-operators: ${OPAA_INDEXING_PARSER_LIMITS_MAX_PDF_OPERATORS:200000000}
      max-pdf-content-bytes: ${OPAA_INDEXING_PARSER_LIMITS_MAX_PDF_CONTENT_BYTES:536870912}
      max-pdf-stream-bytes: ${OPAA_INDEXING_PARSER_LIMITS_MAX_PDF_STREAM_BYTES:33554432}
      max-pdf-parse-seconds: ${OPAA_INDEXING_PARSER_LIMITS_MAX_PDF_PARSE_SECONDS:120}
      max-pdf-pages: ${OPAA_INDEXING_PARSER_LIMITS_MAX_PDF_PAGES:10000}
      max-pdf-objects: ${OPAA_INDEXING_PARSER_LIMITS_MAX_PDF_OBJECTS:1000000}
    # ADR-0018 Entscheidung 6: own opaa.indexing.filesystem.* property block, own binding prefix
    # (FilesystemProperties), mirroring crawl/tabular/mail/odf above. allowlist: absolute base
    # directories a FILESYSTEM library's sourcePath must resolve underneath. No default on purpose -
    # an empty allowlist disables the FILESYSTEM quellentyp entirely, the safe default for a fresh
    # installation.
    filesystem:
      allowlist: ${OPAA_INDEXING_FILESYSTEM_ALLOWLIST:}
    # The attachment-nesting depth (Mail-in-Mail, Feed-Anlage) is one general value, not a
    # per-connector one - own opaa.indexing.attachments.* property block (AttachmentProperties),
    # applied by AttachmentIndexer regardless of which connector discovered the attachment.
    attachments:
      max-depth: ${OPAA_INDEXING_ATTACHMENTS_MAX_DEPTH:5}
      max-per-parent: ${OPAA_INDEXING_ATTACHMENTS_MAX_PER_PARENT:10}
      max-size-bytes: ${OPAA_INDEXING_ATTACHMENTS_MAX_SIZE_BYTES:20971520}
      # budget of one root document over all levels of nesting together
      max-per-root: ${OPAA_INDEXING_ATTACHMENTS_MAX_PER_ROOT:500}
      max-bytes-per-root: ${OPAA_INDEXING_ATTACHMENTS_MAX_BYTES_PER_ROOT:1073741824}
    # SSRF hardening for HTTP_DIRECTORY/RSS_FEED fetches - see
    # io.opaa.security.TargetAddressValidator.
    target-validation:
      enabled: ${OPAA_INDEXING_TARGET_VALIDATION_ENABLED:true}
      allowlist: ${OPAA_INDEXING_TARGET_VALIDATION_ALLOWLIST:}
  upload:
    storage-path: ${OPAA_UPLOAD_STORAGE_PATH:./uploads}
    # ADR-0030: which storage holds the uploaded originals - "filesystem" (the directory above) or
    # "s3" (the block below); any other value refuses the start instead of falling back silently.
    store: ${OPAA_UPLOAD_STORE:filesystem}
    # ADR-0030: the S3 storage of uploaded originals, read only with store=s3 - endpoint, bucket,
    # access-key and secret-key are required then, see UploadS3Properties. The target validation
    # has its own namespace so switching the connectors' check off never switches this one off;
    # the configured endpoint itself always passes.
    s3:
      endpoint: ${OPAA_UPLOAD_S3_ENDPOINT:}
      region: ${OPAA_UPLOAD_S3_REGION:us-east-1}
      bucket: ${OPAA_UPLOAD_S3_BUCKET:}
      key-prefix: ${OPAA_UPLOAD_S3_KEY_PREFIX:}
      path-style: ${OPAA_UPLOAD_S3_PATH_STYLE:true}
      access-key: ${OPAA_UPLOAD_S3_ACCESS_KEY:}
      secret-key: ${OPAA_UPLOAD_S3_SECRET_KEY:}
      temp-directory: ${OPAA_UPLOAD_S3_TEMP_DIRECTORY:}
      target-validation:
        enabled: ${OPAA_UPLOAD_S3_TARGET_VALIDATION_ENABLED:true}
        allowlist: ${OPAA_UPLOAD_S3_TARGET_VALIDATION_ALLOWLIST:}
    max-file-size: ${OPAA_UPLOAD_MAX_FILE_SIZE:52428800}
    # Own pool, deliberately not opaa.indexing.thread-pool - see UploadProperties#threadPool. An
    # upload takes a place (max-size plus queue-capacity) before it is stored; a full pool is a 429.
    thread-pool:
      core-size: ${OPAA_UPLOAD_THREAD_POOL_CORE_SIZE:2}
      max-size: ${OPAA_UPLOAD_THREAD_POOL_MAX_SIZE:4}
      queue-capacity: ${OPAA_UPLOAD_THREAD_POOL_QUEUE_CAPACITY:20}
    # How old a stored original must be before the orphan cleanup may report or remove it - the
    # window between writing the bytes and inserting the row, and the whole asynchronous processing
    # of an upload, must lie inside it. A report may raise it per call, never lower it.
    orphan-grace-minutes: ${OPAA_UPLOAD_ORPHAN_GRACE_MINUTES:60}
  library:
    # Maximum total size (bytes), summed across every document a library holds, that library may
    # occupy - enforced at every path that stores document content (upload, and the
    # FILESYSTEM/HTTP_DIRECTORY/RSS_FEED connectors), not only the upload endpoint. Default 10 GiB.
    # 0 or negative disables the quota entirely - see LibraryProperties#quotaBytes.
    quota-bytes: ${OPAA_LIBRARY_QUOTA_BYTES:10737418240}
  external-access:
    # Longest admissible Befristung of a library's release for Fremdzugaenge. How many days before
    # it ends the responsible person is reminded is a setting of the external AI tools.
    max-release-days: ${OPAA_EXTERNAL_ACCESS_MAX_RELEASE_DAYS:365}
    # Days the last sign-in of an account of an identity provider may lie back for its access tokens
    # to work; deactivation and groups at the provider reach OPAA only with a sign-in.
    provider-sign-in-max-age-days: ${OPAA_EXTERNAL_ACCESS_PROVIDER_SIGN_IN_MAX_AGE_DAYS:30}
  documents:
    # The synchronous remote-content proxy path (GET /api/v1/documents/{documentId}/content for an
    # HTTP_DIRECTORY/RSS_FEED document) has its own, smaller bound, a short timeout per hop and a
    # bound of the whole body transfer - see RemoteContentProperties.
    remote-content:
      max-bytes: ${OPAA_DOCUMENTS_REMOTE_CONTENT_MAX_BYTES:20971520}
      timeout-seconds: ${OPAA_DOCUMENTS_REMOTE_CONTENT_TIMEOUT_SECONDS:20}
      transfer-timeout-seconds: ${OPAA_DOCUMENTS_REMOTE_CONTENT_TRANSFER_TIMEOUT_SECONDS:0}
    # Opening an attachment re-extracts its bytes from the parent original, which every VIEWER can
    # trigger repeatedly and in parallel - see AttachmentExtractionLimiter. Bounds the extractions
    # running at once, not the responses still streaming out (that is the rate limit).
    attachment-extraction:
      max-concurrent: ${OPAA_DOCUMENTS_ATTACHMENT_EXTRACTION_MAX_CONCURRENT:4}
      acquire-timeout: ${OPAA_DOCUMENTS_ATTACHMENT_EXTRACTION_ACQUIRE_TIMEOUT:10s}
  rate-limit:
    enabled: ${OPAA_RATE_LIMIT_ENABLED:true}
    # ADR-0033, Entscheidung 9: X-Forwarded-For is honoured only when the connection comes from one
    # of these networks (io.opaa.security.TrustedProxyClientIpResolver; the client is the first
    # entry from the right that is not a trusted proxy). Empty = the header is ignored and every
    # request counts under the address of its connection - behind a reverse proxy (the Compose
    # stack's nginx included) every client then shares one bucket per limit, which the "oidc"
    # profile warns about at start-up. Serves the rate limits and OPAA_LOCAL_ADMIN_ALLOWED_CIDRS
    # alike; a wildcard (0.0.0.0/0, ::/0) refuses the start.
    trusted-proxy-cidrs: ${OPAA_RATE_LIMIT_TRUSTED_PROXY_CIDRS:}
    # query to document-upload: max-requests per client, global-max-requests across all clients;
    # past either the answer is 429. Both count only requests the security chain authenticated (the
    # push intake: its handler), so strangers cannot use them up; see RateLimitFilter.Counting.
    # max-requests-per-account (query, chat-search, search, transcription, document-upload) counts
    # per signed-in account, per access token and per person over all her access tokens, whatever
    # address they use; checked behind the security chain, 0 switches it off, an empty value fails
    # the start. An access token gives back its address token; any 429 of a later limit that
    # refuses before the actual work (the token quota, the busy answer of the attachment
    # extraction) gives back the global token.
    query:
      max-requests: ${OPAA_RATE_LIMIT_QUERY_MAX_REQUESTS:10}
      window-seconds: ${OPAA_RATE_LIMIT_QUERY_WINDOW_SECONDS:60}
      global-max-requests: ${OPAA_RATE_LIMIT_QUERY_GLOBAL_MAX_REQUESTS:100}
      max-requests-per-account: ${OPAA_RATE_LIMIT_QUERY_MAX_REQUESTS_PER_ACCOUNT:10}
    indexing:
      max-requests: ${OPAA_RATE_LIMIT_INDEXING_MAX_REQUESTS:1}
      window-seconds: ${OPAA_RATE_LIMIT_INDEXING_WINDOW_SECONDS:60}
      global-max-requests: ${OPAA_RATE_LIMIT_INDEXING_GLOBAL_MAX_REQUESTS:5}
    # The source connection test is a synchronous probe with its own outbound connections - looser
    # than the indexing trigger (a caller is expected to test a few configurations while filling out
    # the create dialog) but still capped, so it cannot be used to tie up worker threads or as a
    # fast internal port/host scanner.
    source-test:
      max-requests: ${OPAA_RATE_LIMIT_SOURCE_TEST_MAX_REQUESTS:10}
      window-seconds: ${OPAA_RATE_LIMIT_SOURCE_TEST_WINDOW_SECONDS:60}
      global-max-requests: ${OPAA_RATE_LIMIT_SOURCE_TEST_GLOBAL_MAX_REQUESTS:30}
    # GET /api/v1/documents/{documentId}/content is, for a HTTP_DIRECTORY/ RSS_FEED document, a
    # synchronous proxy fetch with its own outbound connection - the same reason source-test above
    # is limited, except this one is reachable by any VIEWER on routine "Im Dokument öffnen" clicks
    # rather than gated behind library creation, so its limit is looser than source-test's but still
    # capped.
    document-content:
      max-requests: ${OPAA_RATE_LIMIT_DOCUMENT_CONTENT_MAX_REQUESTS:20}
      window-seconds: ${OPAA_RATE_LIMIT_DOCUMENT_CONTENT_WINDOW_SECONDS:60}
      global-max-requests: ${OPAA_RATE_LIMIT_DOCUMENT_CONTENT_GLOBAL_MAX_REQUESTS:100}
    # The push intake is reachable without a session; the limiter bounds the secret checks an
    # unauthenticated caller can cause. Per library (capture group, a well-formed library id only),
    # generous enough for a busy source - an author saving every few seconds - and the intake
    # debounces anyway, so a burst above this costs freshness, not correctness. Pushes that do not
    # authenticate, or are refused before the secret check, draw on one budget per address,
    # whichever library they name.
    webhook:
      max-requests: ${OPAA_RATE_LIMIT_WEBHOOK_MAX_REQUESTS:120}
      window-seconds: ${OPAA_RATE_LIMIT_WEBHOOK_WINDOW_SECONDS:60}
      global-max-requests: ${OPAA_RATE_LIMIT_WEBHOOK_GLOBAL_MAX_REQUESTS:600}
    # The chat search runs while the person types (one request per typing pause, Enter searches at
    # once), so it has its own budget instead of the query rule's: one request per second on
    # average per client, which brisk typing with pauses stays below.
    chat-search:
      max-requests: ${OPAA_RATE_LIMIT_CHAT_SEARCH_MAX_REQUESTS:60}
      window-seconds: ${OPAA_RATE_LIMIT_CHAT_SEARCH_WINDOW_SECONDS:60}
      global-max-requests: ${OPAA_RATE_LIMIT_CHAT_SEARCH_GLOBAL_MAX_REQUESTS:1200}
      max-requests-per-account: ${OPAA_RATE_LIMIT_CHAT_SEARCH_MAX_REQUESTS_PER_ACCOUNT:60}
    # POST /api/v1/search embeds every question with the configured model, GET
    # /api/v1/search/hits/{hitId} reads stored chunks; one budget for both, so fetching other hits
    # buys no fresh searches. Sized for a tool that runs one search and fetches a few of its hits;
    # an access token is bounded by its own quota on top.
    search:
      max-requests: ${OPAA_RATE_LIMIT_SEARCH_MAX_REQUESTS:30}
      window-seconds: ${OPAA_RATE_LIMIT_SEARCH_WINDOW_SECONDS:60}
      global-max-requests: ${OPAA_RATE_LIMIT_SEARCH_GLOBAL_MAX_REQUESTS:300}
      max-requests-per-account: ${OPAA_RATE_LIMIT_SEARCH_MAX_REQUESTS_PER_ACCOUNT:30}
    # POST /api/v1/transcriptions holds a transcription slot and calls the transcription model for
    # every recording; sized like the query, a dictated question each few seconds.
    transcription:
      max-requests: ${OPAA_RATE_LIMIT_TRANSCRIPTION_MAX_REQUESTS:10}
      window-seconds: ${OPAA_RATE_LIMIT_TRANSCRIPTION_WINDOW_SECONDS:60}
      global-max-requests: ${OPAA_RATE_LIMIT_TRANSCRIPTION_GLOBAL_MAX_REQUESTS:100}
      max-requests-per-account: ${OPAA_RATE_LIMIT_TRANSCRIPTION_MAX_REQUESTS_PER_ACCOUNT:10}
    # POST /api/v1/libraries/{libraryId}/documents, one budget across all libraries (GET on the same
    # path is not counted). It bounds how fast one account sends uploads; a full upload pool
    # (opaa.upload.thread-pool) is answered with 429 on its own, before anything is stored. Either
    # way the browser waits for Retry-After and goes on with the same file.
    document-upload:
      max-requests: ${OPAA_RATE_LIMIT_DOCUMENT_UPLOAD_MAX_REQUESTS:120}
      window-seconds: ${OPAA_RATE_LIMIT_DOCUMENT_UPLOAD_WINDOW_SECONDS:60}
      global-max-requests: ${OPAA_RATE_LIMIT_DOCUMENT_UPLOAD_GLOBAL_MAX_REQUESTS:600}
      max-requests-per-account: ${OPAA_RATE_LIMIT_DOCUMENT_UPLOAD_MAX_REQUESTS_PER_ACCOUNT:60}
    # ADR-0033, Entscheidung 9: the local sign-in and its self-service endpoints. login, refresh,
    # register, forgot-password, set-password and verify-email (the confirm-registration endpoint)
    # are keyed by client address in RateLimitFilter; change-password by the authenticated
    # account, register and forgot-password additionally by the (hashed) e-mail address they name -
    # both in io.opaa.account.LocalAuthRateLimiter. The global ceilings of login, register and
    # forgot-password count every attempt, failed ones included, and are the operator's early
    # warning against distributed credential stuffing: past one the answer is 429 for every client,
    # with a WARN line and a metric.
    local-auth:
      login:
        max-requests: ${OPAA_RATE_LIMIT_LOCAL_AUTH_LOGIN_MAX_REQUESTS:10}
        window-seconds: ${OPAA_RATE_LIMIT_LOCAL_AUTH_LOGIN_WINDOW_SECONDS:60}
        global-max-requests: ${OPAA_RATE_LIMIT_LOCAL_AUTH_LOGIN_GLOBAL_MAX_REQUESTS:100}
      refresh:
        max-requests: ${OPAA_RATE_LIMIT_LOCAL_AUTH_REFRESH_MAX_REQUESTS:30}
        window-seconds: ${OPAA_RATE_LIMIT_LOCAL_AUTH_REFRESH_WINDOW_SECONDS:60}
      change-password:
        max-requests: ${OPAA_RATE_LIMIT_LOCAL_AUTH_CHANGE_PASSWORD_MAX_REQUESTS:5}
        window-seconds: ${OPAA_RATE_LIMIT_LOCAL_AUTH_CHANGE_PASSWORD_WINDOW_SECONDS:300}
      register:
        max-requests: ${OPAA_RATE_LIMIT_LOCAL_AUTH_REGISTER_MAX_REQUESTS:5}
        window-seconds: ${OPAA_RATE_LIMIT_LOCAL_AUTH_REGISTER_WINDOW_SECONDS:3600}
        global-max-requests: ${OPAA_RATE_LIMIT_LOCAL_AUTH_REGISTER_GLOBAL_MAX_REQUESTS:50}
        max-requests-per-address: ${OPAA_RATE_LIMIT_LOCAL_AUTH_REGISTER_MAX_REQUESTS_PER_ADDRESS:3}
      forgot-password:
        max-requests: ${OPAA_RATE_LIMIT_LOCAL_AUTH_FORGOT_PASSWORD_MAX_REQUESTS:5}
        window-seconds: ${OPAA_RATE_LIMIT_LOCAL_AUTH_FORGOT_PASSWORD_WINDOW_SECONDS:3600}
        global-max-requests: ${OPAA_RATE_LIMIT_LOCAL_AUTH_FORGOT_PASSWORD_GLOBAL_MAX_REQUESTS:50}
        max-requests-per-address: ${OPAA_RATE_LIMIT_LOCAL_AUTH_FORGOT_PASSWORD_MAX_REQUESTS_PER_ADDRESS:3}
      set-password:
        max-requests: ${OPAA_RATE_LIMIT_LOCAL_AUTH_SET_PASSWORD_MAX_REQUESTS:10}
        window-seconds: ${OPAA_RATE_LIMIT_LOCAL_AUTH_SET_PASSWORD_WINDOW_SECONDS:900}
      verify-email:
        max-requests: ${OPAA_RATE_LIMIT_LOCAL_AUTH_VERIFY_EMAIL_MAX_REQUESTS:10}
        window-seconds: ${OPAA_RATE_LIMIT_LOCAL_AUTH_VERIFY_EMAIL_WINDOW_SECONDS:900}
      # Preview and redemption of a handover code share one budget (ADR-0033 Entscheidung 12): one
      # redemption is one of each, by the same person. The budget is deliberately wider than the
      # other link flows - a handover is what a whole migration runs through, and a Behörde sits
      # behind one client address.
      handover:
        max-requests: ${OPAA_RATE_LIMIT_LOCAL_AUTH_HANDOVER_MAX_REQUESTS:60}
        window-seconds: ${OPAA_RATE_LIMIT_LOCAL_AUTH_HANDOVER_WINDOW_SECONDS:900}
  cors:
    allowed-origins: ${OPAA_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # The address this installation is reachable under from outside, used for the links in mail
  # (ADR-0033 Entscheidung 10). A deployment property like opaa.cors.allowed-origins, never a
  # setting in the administration and never taken from the request's Host header. Without a value
  # OPAA sends no mail that depends on a link.
  public-base-url: ${OPAA_PUBLIC_BASE_URL:}
  mail:
    # Bounds for the synchronous SMTP send: the request thread of the person waiting for their
    # invitation is the one that waits, so a stalled mail server must not hold it for longer than an
    # operator chose.
    connect-timeout: ${OPAA_MAIL_CONNECT_TIMEOUT:10s}
    read-timeout: ${OPAA_MAIL_READ_TIMEOUT:15s}
    write-timeout: ${OPAA_MAIL_WRITE_TIMEOUT:15s}
  audit:
    payload:
      # A before/after key the event catalog (AuditEventCatalog) does not list is dropped and
      # logged; the dev profile and every test refuse the write instead.
      reject-unlisted: false
  succession:
    # Wann der Feststellungslauf hinsieht. Er schreibt nur Erstfeststellung und Ende; der Zustand
    # selbst ist abgeleitet und gilt auch ohne ihn.
    detection-cron: ${OPAA_SUCCESSION_DETECTION_CRON:0 5 * * * *}
  directory-sync:
    # The minute tick that starts a due provider's run. The interval itself is a setting of the
    # provider row (ADR-0036, Entscheidung 2); this switch only decides whether the tick exists.
    schedule-enabled: ${OPAA_DIRECTORY_SYNC_SCHEDULE_ENABLED:true}
    keycloak:
      # Tuning of the Keycloak connector. No credentials here on purpose: those live encrypted in
      # directory_connectors, one row per provider.
      page-size: ${OPAA_DIRECTORY_SYNC_KEYCLOAK_PAGE_SIZE:100}
      # A run that would exceed either ceiling fails as unreachable instead of applying a
      # truncated list, which is indistinguishable from a reorganisation that dissolved the rest.
      max-groups: ${OPAA_DIRECTORY_SYNC_KEYCLOAK_MAX_GROUPS:5000}
      max-members-per-group: ${OPAA_DIRECTORY_SYNC_KEYCLOAK_MAX_MEMBERS_PER_GROUP:20000}
      # The same ceiling for the realm's account list, which the run reads for the account status; a
      # truncated one would look like a mass departure.
      max-accounts: ${OPAA_DIRECTORY_SYNC_KEYCLOAK_MAX_ACCOUNTS:50000}
      connect-timeout: ${OPAA_DIRECTORY_SYNC_KEYCLOAK_CONNECT_TIMEOUT:5s}
      request-timeout: ${OPAA_DIRECTORY_SYNC_KEYCLOAK_REQUEST_TIMEOUT:30s}
  instance:
    # The instance register (ADR-0053, Entscheidung 3): every instance writes its heartbeat at this
    # interval by the database clock and counts as dead after dead-after without one. dead-after is
    # at least four intervals (io.opaa.instance.InstanceProperties) and the same on every instance.
    heartbeat-interval: ${OPAA_INSTANCE_HEARTBEAT_INTERVAL:15s}
    dead-after: ${OPAA_INSTANCE_DEAD_AFTER:120s}
  security:
    credentials:
      # AES-256 key (Base64, 32 raw bytes) for encrypting knowledge_libraries.source_credentials at
      # rest. No default here on purpose - a real deployment must set one before storing any
      # library's credentials; see docs/handbuch/betrieb/netz-und-sicherheit.md. The dev profile
      # below (not local) sets an explicitly-marked non-production default so bootRun and tests work
      # without operator setup.
      encryption-key: ${OPAA_CREDENTIALS_ENCRYPTION_KEY:}
    settings:
      # AES-256 key (Base64, 32 raw bytes) for io.opaa.security.SettingsEncryptor - encrypts
      # llm_models.api_key_ciphertext at rest
      # (docs/features/llm-integration.md#stufe-1-verwaltete-chat-modelle-in-umsetzung). A
      # deliberately separate key from OPAA_CREDENTIALS_ENCRYPTION_KEY above: the two protect
      # different kinds of secret (a knowledge library's source credentials vs. a managed model's
      # API key) with no reason to share a key or its rotation schedule. Validated lazily, on first
      # use, exactly like OPAA_CREDENTIALS_ENCRYPTION_KEY - not eagerly at startup: most deployments
      # never store a model API key at all, and an unconditional startup check would refuse to start
      # every one of them, including an existing installation upgrading in place. No default here on
      # purpose; the dev profile below sets an explicitly-marked non-production default so bootRun
      # and tests work without operator setup.
      encryption-key: ${OPAA_SETTINGS_ENCRYPTION_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      # Spring Boot enables the two probes in a web application anyway; set here so the paths a
      # load balancer and a container health check rely on stay a deliberate choice.
      probes:
        enabled: true
      group:
        # What an instance needs in order to answer at all: the process itself and its database.
        # The chat, embedding and vector-store contributors deliberately stay out - each of them
        # calls a foreign service, and an unreachable model must not take an instance out of
        # rotation while sign-in, library management and document access keep working.
        readiness:
          include: readinessState,db

logging:
  # The stack trace of the plain-text log with every exception message unable to forge an entry;
  # the conversion word is registered by io.opaa.observability.SafeLogMessages.
  exception-conversion-word: "%opaaEx"
  level:
    org.hibernate.orm.connections.pooling: WARN
    # The SDK's SigV4 signer logs the canonical request at DEBUG - session token included - and the
    # HTTP client underneath prints every request header (Authorization, x-amz-security-token) at
    # DEBUG. Pinned so raising software.amazon.awssdk or org.apache.hc.client5 to DEBUG for
    # diagnosis never prints a credential; the pins are guarded by S3LogLeakTest.
    software.amazon.awssdk.http.auth.aws.internal.signer: INFO
    org.apache.hc.client5.http.headers: INFO
    org.apache.hc.client5.http.wire: INFO
    # The SMTP transport's protocol trace prints every mail on the wire - the links of the local
    # account management included. Pinned so raising org.eclipse.angus.mail to DEBUG/TRACE for
    # diagnosis never prints a link token; guarded by LocalSelfServiceIntegrationTest.
    org.eclipse.angus.mail: INFO
    # Request bodies are user content (the chat search term, a sign-in password). Spring MVC prints
    # read and written bodies at DEBUG and handler arguments at TRACE, Hibernate Validator the
    # validated object and the PostgreSQL driver every bind value at TRACE. Pinned so raising
    # their parents for diagnosis never prints one; guarded by ChatSearchPrivacyIntegrationTest.
    org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor: INFO
    org.springframework.web.method.HandlerMethod: INFO
    org.hibernate.validator.internal.engine.resolver.JPATraversableResolver: INFO
    org.postgresql.core.v3.QueryExecutorImpl: INFO

---
spring:
  config:
    activate:
      on-profile: local
  # No override needed: the "dev" document below already points the model address at localhost,
  # the correct target for this profile.

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${OPAA_DB_URL:jdbc:postgresql://postgres:5432/opaa?prepareThreshold=0}

---
spring:
  config:
    activate:
      on-profile: oidc

opaa:
  auth:
    mode: oidc
    # The providers come from the installation and the Anbieterverwaltung (ADR-0060); the address
    # check of every issuer and JWK set address is a limit of the operation.
    oidc:
      target-validation:
        enabled: ${OPAA_OIDC_TARGET_VALIDATION_ENABLED:true}
        allowlist: ${OPAA_OIDC_TARGET_VALIDATION_ALLOWLIST:}

---
# Development and test profile: no credential check at all. Requests are
# authenticated as opaa.auth.dev.default-user, or as the user named in the
# X-OPAA-Dev-User header. See io.opaa.auth.DevAuthFilter.
spring:
  config:
    activate:
      on-profile: dev
  ai:
    # The address and key of the chat and embedding model the dev mode installs itself with
    # (InstallationService, DevelopmentEmbeddingConfiguration): a locally operated Ollama server,
    # which needs no key, so the placeholder is never sent anywhere that checks it. Any other mode
    # reads neither; io.opaa.config.RetiredSettingVariables names the variables there.
    openai:
      api-key: ${OPAA_OPENAI_API_KEY:sk-placeholder}
      base-url: ${OPAA_OPENAI_BASE_URL:http://localhost:11434/v1}

opaa:
  audit:
    payload:
      reject-unlisted: true
  auth:
    mode: dev
    local:
      # NICHT FUER DEN PRODUKTIVBETRIEB - a fixed, publicly-known secret so bootRun and the backend
      # test suite (all activate "dev", see AGENTS.md) have working local-issuer keys without
      # operator setup. LocalAuthSecretGuard does not run in this profile; any deployment that does
      # not activate "dev" falls back to the (empty) base value above and must set
      # OPAA_AUTH_JWT_SECRET itself - see docs/handbuch/betrieb/netz-und-sicherheit.md. The value
      # carries io.opaa.security.SecretValidator.NON_PRODUCTION_MARKER, so the "oidc" profile
      # refuses it even when copied over (SecretValidatorTest#rejectsTheShippedDevDefault).
      jwt-secret: ${OPAA_AUTH_JWT_SECRET:NICHT-FUER-DEN-PRODUKTIVBETRIEB-opaa-dev-jwt-secret-2026}
    dev:
      # The dev user with this address becomes the system administrator on its first request.
      system-admin-email: admin@opaa.local
      issuer: ${OPAA_AUTH_DEV_ISSUER:opaa-dev}
      default-user: ${OPAA_AUTH_DEV_DEFAULT_USER:dev-admin}
      # Host address the Compose stack publishes the frontend on (docker-compose.yml passes
      # OPAA_FRONTEND_BIND_ADDRESS in); empty outside that stack. Beyond loopback the start is
      # refused unless allow-remote confirms it (io.opaa.auth.DevExposureGuard).
      published-address: ${OPAA_AUTH_DEV_PUBLISHED_ADDRESS:}
      allow-remote: ${OPAA_AUTH_DEV_ALLOW_REMOTE:false}
      users:
        # Matches opaa.auth.dev.system-admin-email, and is therefore provisioned as SYSTEM_ADMIN
        # on first request.
        - subject: dev-admin
          email: admin@opaa.local
          display-name: Dev Admin
        - subject: dev-user
          email: dev-user@opaa.local
          display-name: Dev User
  indexing:
    # The dev profile (also active for the backend test suite, see AGENTS.md) opens /data and /tmp
    # so existing FILESYSTEM fixtures (literal "/data/documents"/"/tmp/..." sourcePaths in
    # KnowledgeLibraryServiceIntegrationTest et al.) keep working. The test suite widens this by its
    # own process-wide base directory in OpaaTestPathInitializer, never per class - a class-local
    # @DynamicPropertySource would split the Spring context (AGENTS.md, "Spring-Testkontexte").
    filesystem:
      allowlist: ${OPAA_INDEXING_FILESYSTEM_ALLOWLIST:/data,/tmp}
  security:
    credentials:
      # NICHT FUER DEN PRODUKTIVBETRIEB - a fixed, publicly-known 32-byte AES key so bootRun and
      # every backend test (all activate "dev", see AGENTS.md) can create/rotate credentials without
      # operator setup. Any deployment that does not activate the "dev" profile falls back to the
      # (empty) base value above and must set OPAA_CREDENTIALS_ENCRYPTION_KEY itself - see
      # docs/handbuch/betrieb/netz-und-sicherheit.md. The "oidc" profile refuses this value even
      # when copied over (io.opaa.security.PublishedEncryptionKeyGuard), as it does the next one.
      encryption-key: ${OPAA_CREDENTIALS_ENCRYPTION_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    settings:
      # NICHT FUER DEN PRODUKTIVBETRIEB - the same reasoning as opaa.security.credentials above, a
      # distinct fixed key so bootRun and the backend test suite can encrypt a seeded or
      # test-created model's API key without operator setup. Any deployment that does not activate
      # the "dev" profile falls back to the (empty) base value above and must set
      # OPAA_SETTINGS_ENCRYPTION_KEY itself before storing a model's API key - see
      # docs/handbuch/betrieb/modelle.md.
      encryption-key: ${OPAA_SETTINGS_ENCRYPTION_KEY:c2V0dGluZ3NkZXZrZXkwMHNldHRpbmdzZGV2a2V5MDE=}

---
# The dev mode of the Compose stack: its optional "ollama" service instead of localhost. After the
# "dev" document, since the later document wins.
spring:
  config:
    activate:
      on-profile: docker & dev
  ai:
    openai:
      base-url: ${OPAA_OPENAI_BASE_URL:http://ollama:11434/v1}
