server:
  address: ${OPAA_SERVER_ADDRESS:localhost}

spring:
  application:
    name: opaa
  profiles:
    default: local
  # Feste deutsche Locale, damit Bean-Validation-Meldungen in API-Antworten
  # unabhängig vom Accept-Language-Header des Clients deutsch sind.
  web:
    locale: de_DE
    locale-resolver: fixed
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  servlet:
    multipart:
      # Bound to the exact same value as opaa.upload.max-file-size below (#420 code review, finding
      # 2), not a separately chosen, larger container-level cap: a gap between the two would leave
      # every file above this limit and up to that gap answered by Spring's own untranslated 500 /
      # multipart error page instead of GlobalExceptionHandler's German 413. Both this and
      # opaa.upload.max-file-size read the same OPAA_UPLOAD_MAX_FILE_SIZE env var (bytes, "B" suffix
      # for DataSize parsing here) so they can never drift apart. GlobalExceptionHandler still
      # answers 413 for the (rare, container-level) MaxUploadSizeExceededException this produces -
      # not because the size differs from opaa.upload.max-file-size's own check, but because
      # multipart request framing overhead can push a request that size alone but under the limit
      # over max-request-size first.
      max-file-size: ${OPAA_UPLOAD_MAX_FILE_SIZE:52428800}B
      max-request-size: ${OPAA_UPLOAD_MAX_FILE_SIZE:52428800}B
  datasource:
    url: ${OPAA_DB_URL:jdbc:postgresql://localhost:5432/opaa?prepareThreshold=0}
    username: ${OPAA_DB_USERNAME:opaa}
    password: ${OPAA_DB_PASSWORD:opaa}
  liquibase:
    enabled: true
  ai:
    model:
      chat: ${OPAA_AI_CHAT_PROVIDER:ollama}
      embedding: ${OPAA_AI_EMBEDDING_PROVIDER:ollama}
    # "openai" names the wire protocol, not a vendor: locally operated model
    # servers speak the same API. There is deliberately no default base URL —
    # whoever selects this provider must state the target address, otherwise
    # OpenAiBaseUrlGuard refuses to start. See docs/features/llm-integration.md.
    openai:
      api-key: ${OPAA_OPENAI_API_KEY:sk-placeholder}
      base-url: ${OPAA_OPENAI_BASE_URL:}
      chat:
        api-key: ${OPAA_OPENAI_CHAT_API_KEY:${OPAA_OPENAI_API_KEY:sk-placeholder}}
        base-url: ${OPAA_OPENAI_CHAT_BASE_URL:${OPAA_OPENAI_BASE_URL:}}
        model: ${OPAA_OPENAI_CHAT_MODEL:gpt-4o}
        temperature: ${OPAA_OPENAI_CHAT_TEMPERATURE:0.7}
        max-tokens: ${OPAA_OPENAI_CHAT_MAX_TOKENS:2000}
      embedding:
        api-key: ${OPAA_OPENAI_EMBEDDING_API_KEY:${OPAA_OPENAI_API_KEY:sk-placeholder}}
        base-url: ${OPAA_OPENAI_EMBEDDING_BASE_URL:${OPAA_OPENAI_BASE_URL:}}
        model: ${OPAA_OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    ollama:
      chat:
        model: ${OPAA_OLLAMA_CHAT_MODEL:phi3:mini}
      embedding:
        model: ${OPAA_OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: hnsw
        distance-type: ${OPAA_PGVECTOR_DISTANCE_TYPE:cosine_distance}
        dimensions: ${OPAA_PGVECTOR_DIMENSIONS:1536}

opaa:
  auth:
    # No default mode on purpose: the active Spring profile ("oidc" or "dev")
    # sets it. Starting without one of those profiles fails fast, see
    # io.opaa.auth.AuthProfileGuard.
    initial-admin-email: ${OPAA_INITIAL_ADMIN_EMAIL:admin@opaa.local}
  http:
    force-http1: ${OPAA_HTTP_FORCE_HTTP1:false}
  query:
    top-k: ${OPAA_QUERY_TOP_K:5}
    similarity-threshold: ${OPAA_QUERY_SIMILARITY_THRESHOLD:0.3}
  indexing:
    document-path: ${OPAA_INDEXING_DOCUMENT_PATH:./documents}
    chunk-size: ${OPAA_INDEXING_CHUNK_SIZE:1000}
    chunk-overlap: ${OPAA_INDEXING_CHUNK_OVERLAP:100}
    batch-size: ${OPAA_INDEXING_BATCH_SIZE:50}
    retry-attempts: ${OPAA_INDEXING_RETRY_ATTEMPTS:3}
    thread-pool:
      core-size: ${OPAA_INDEXING_THREAD_POOL_CORE_SIZE:2}
      max-size: ${OPAA_INDEXING_THREAD_POOL_MAX_SIZE:4}
      queue-capacity: ${OPAA_INDEXING_THREAD_POOL_QUEUE_CAPACITY:20}
    rss:
      max-entries: ${OPAA_INDEXING_RSS_MAX_ENTRIES:200}
      max-feed-size-bytes: ${OPAA_INDEXING_RSS_MAX_FEED_SIZE_BYTES:10485760}
      max-page-size-bytes: ${OPAA_INDEXING_RSS_MAX_PAGE_SIZE_BYTES:5242880}
      request-delay-ms: ${OPAA_INDEXING_RSS_REQUEST_DELAY_MS:1000}
      user-agent: ${OPAA_INDEXING_RSS_USER_AGENT:OPAA-Indexer/1.0}
      main-content-selector: ${OPAA_INDEXING_RSS_MAIN_CONTENT_SELECTOR:main, article, [role=main]}
      attachment-profile: ${OPAA_INDEXING_RSS_ATTACHMENT_PROFILE:GENERIC}
      max-attachments-per-entry: ${OPAA_INDEXING_RSS_MAX_ATTACHMENTS_PER_ENTRY:10}
      max-attachment-size-bytes: ${OPAA_INDEXING_RSS_MAX_ATTACHMENT_SIZE_BYTES:20971520}
  upload:
    storage-path: ${OPAA_UPLOAD_STORAGE_PATH:./uploads}
    max-file-size: ${OPAA_UPLOAD_MAX_FILE_SIZE:52428800}
  rate-limit:
    enabled: ${OPAA_RATE_LIMIT_ENABLED:true}
    query:
      max-requests: ${OPAA_RATE_LIMIT_QUERY_MAX_REQUESTS:10}
      window-seconds: ${OPAA_RATE_LIMIT_QUERY_WINDOW_SECONDS:60}
      global-max-requests: ${OPAA_RATE_LIMIT_QUERY_GLOBAL_MAX_REQUESTS:100}
    indexing:
      max-requests: ${OPAA_RATE_LIMIT_INDEXING_MAX_REQUESTS:1}
      window-seconds: ${OPAA_RATE_LIMIT_INDEXING_WINDOW_SECONDS:60}
      global-max-requests: ${OPAA_RATE_LIMIT_INDEXING_GLOBAL_MAX_REQUESTS:5}
  cors:
    allowed-origins: ${OPAA_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  directory-sync:
    change-threshold-fraction: ${OPAA_DIRECTORY_SYNC_CHANGE_THRESHOLD_FRACTION:0.3}
  security:
    credentials:
      # AES-256 key (Base64, 32 raw bytes) for encrypting knowledge_libraries.source_credentials at
      # rest (#483). No default here on purpose - a real deployment must set one before storing any
      # library's credentials; see docs/deployment.md. The dev profile below (not local) sets an
      # explicitly-marked non-production default so bootRun and tests work without operator setup.
      encryption-key: ${OPAA_CREDENTIALS_ENCRYPTION_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    org.hibernate.orm.connections.pooling: WARN

---
spring:
  config:
    activate:
      on-profile: local
  ai:
    ollama:
      base-url: ${OPAA_OLLAMA_BASE_URL:http://localhost:11434}

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${OPAA_DB_URL:jdbc:postgresql://postgres:5432/opaa?prepareThreshold=0}
  ai:
    ollama:
      base-url: ${OPAA_OLLAMA_BASE_URL:http://ollama:11434}

---
spring:
  config:
    activate:
      on-profile: oidc
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${OPAA_OIDC_JWK_SET_URI:http://localhost:8180/realms/opaa/protocol/openid-connect/certs}
          issuer-uri: ${OPAA_OIDC_ISSUER_URI:http://localhost:8180/realms/opaa}

opaa:
  auth:
    mode: oidc
    oidc:
      authority: ${OPAA_OIDC_AUTHORITY:http://localhost:8180/realms/opaa}
      client-id: ${OPAA_OIDC_CLIENT_ID:opaa-frontend}

---
# Development and test profile: no credential check at all. Requests are
# authenticated as opaa.auth.dev.default-user, or as the user named in the
# X-OPAA-Dev-User header. See io.opaa.auth.DevAuthFilter.
spring:
  config:
    activate:
      on-profile: dev

opaa:
  auth:
    mode: dev
    dev:
      issuer: ${OPAA_AUTH_DEV_ISSUER:opaa-dev}
      default-user: ${OPAA_AUTH_DEV_DEFAULT_USER:dev-admin}
      users:
        # Matches the default opaa.auth.initial-admin-email, and is therefore
        # provisioned as SYSTEM_ADMIN on first request.
        - subject: dev-admin
          email: admin@opaa.local
          display-name: Dev Admin
        - subject: dev-user
          email: dev-user@opaa.local
          display-name: Dev User
  security:
    credentials:
      # NICHT FUER DEN PRODUKTIVBETRIEB - a fixed, publicly-known 32-byte AES key so bootRun and
      # every backend test (all activate "dev", see AGENTS.md) can create/rotate credentials
      # without operator setup (#483). Any deployment that does not activate the "dev" profile
      # falls back to the (empty) base value above and must set OPAA_CREDENTIALS_ENCRYPTION_KEY
      # itself - see docs/deployment.md.
      encryption-key: ${OPAA_CREDENTIALS_ENCRYPTION_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
