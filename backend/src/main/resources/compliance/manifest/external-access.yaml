title: Externe KI-Werkzeuge
data:
  - id: external-access-tokens
    title: Persönliche Zugangstokens für fremde Werkzeuge
    purpose: Zugriff fremder KI-Werkzeuge auf freigegebene Bibliotheken im Namen einer Person
    personalReference: EMPLOYEE
    tables:
      - name: external_access_tokens
        personalColumns: [user_id, name, created_at, expires_at, last_used_on, revoked_at]
        nonPersonalColumns:
          [id, token_prefix, token_lookup_hash, revocation_reason, lapse_recorded_at, expiry_reminded_days]
        person:
          columns: [user_id]
          excludedColumns:
            token_prefix: Bestandteil des Geheimnisses
            token_lookup_hash: Geheimnis (Prüfwert des Tokens)
    storage: Anwendungsdatenbank; Token nur als Hash
    retention:
      rule: >-
        Gültig höchstens 90 Tage (Voreinstellung); die Zeile wird nach Ablauf der Protokollfrist
        über dem Erlöschen gelöscht
      settings:
        - external_access_settings.token_max_lifetime_days
        - audit_retention_settings.retention_months
    visibility: [die Person selbst, "SYSTEM_ADMIN (Kennung, Ablauf, Zustand)"]
    accessPaths: [UI, API, EXPORT, DATABASE]
    deletion: Retention-Schritt gekoppelt an die Protokollfrist
    evaluations: >-
      Letzter Nutzungstag je Token; die Nutzung selbst wird nicht protokolliert, der Zähler des
      Abflussalarms lebt nur im Arbeitsspeicher
nonPersonalTables:
  external_access_token_libraries: [token_id, library_id, extinguished_at]
settings:
  - key: external_access_settings.token_max_lifetime_days
    source: DATABASE
    defaultValue: "90"
    range: 1 bis 365 Tage
    effect: Höchstlaufzeit eines Zugangstokens
    bearings: [DATA, DATA_FLOW]
  - key: external_access_settings.release_reminder_lead_days
    source: DATABASE
    defaultValue: "14"
    range: 0 bis einen Tag unter der längsten Befristung; 0 schaltet die Erinnerung ab
    effect: >-
      Tage vor Ablauf einer Freigabe für externe KI-Werkzeuge, an denen die verantwortliche Person per
      E-Mail erinnert wird
    bearings: [DATA_FLOW]
    notes:
      - >-
        Werkseinstellung, solange die Systemverwaltung in den Einstellungen der externen
        KI-Werkzeuge keinen eigenen Wert setzt
  - key: opaa.external-access.max-release-days
    source: PROPERTY
    defaultValue: "365"
    effect: Längste Befristung der Freigabe einer Bibliothek für externe KI-Werkzeuge
    bearings: [VISIBILITY, DATA_FLOW]
  - key: opaa.external-access.provider-sign-in-max-age-days
    source: PROPERTY
    defaultValue: "30"
    effect: >-
      Wie lange die letzte Anmeldung eines Kontos eines Identitätsanbieters zurückliegen darf, damit
      seine Zugangstokens wirken; danach ruhen sie bis zur nächsten Anmeldung. Begrenzt, wie lange
      eine Deaktivierung beim Anbieter und Gruppen aus dem Anmeldetoken unbemerkt bleiben
    bearings: [VISIBILITY, DATA_FLOW]
  - key: io.opaa.externalaccess.ExternalAccessAlertRetention#RETENTION
    source: CONSTANT
    defaultValue: P14D
    effect: Wie lange eine Meldung des Abflussalarms erhalten bleibt
    bearings: [DATA]
