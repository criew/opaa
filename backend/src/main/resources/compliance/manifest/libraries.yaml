title: Bibliotheken und Indexierung
data:
  - id: library-settings
    title: Bibliotheksverwaltung
    purpose: Quellkonfiguration, Freigabe für externe KI-Werkzeuge und Löschantrag einer Bibliothek
    personalReference: IDENTIFIABLE
    tables:
      - name: knowledge_libraries
        personalColumns:
          [external_access_set_by_user_id, source_credentials, source_url, source_path]
        nonPersonalColumns:
          - id
          - organization_id
          - source_type
          - schedule_enabled
          - schedule_cron
          - schedule_booked_at
          - schedule_booked_cron
          - diagnostics_locked
          - source_webhook_secret
          - core_context_prefix_document_type
          - core_context_prefix_document_date
          - model_extraction_enabled
          - keywords_enabled
          - source_settings
          - external_access_state
          - external_access_expires_at
          - external_access_set_at
          - external_access_reminder_sent_at
          - all_accounts_grant_allowed
          - erasure_requested_at
          - erasure_cause
        person:
          columns: [external_access_set_by_user_id]
          via: assets
          excludedColumns:
            source_credentials: Geheimnis (verschlüsselte Zugangsdaten der Quelle)
            source_webhook_secret: Geheimnis
          note: >-
            Zwei Wege: die Freigabe für externe KI-Werkzeuge, die die Person gesetzt hat, und ihre
            privaten Bibliotheken über das Eigentum am Asset der Bibliothek (assets im Datum
            rights); die Quelladresse geht nur ohne Zugangsdaten und Abfrageteil heraus
    storage: Anwendungsdatenbank; Zugangsdaten verschlüsselt
    retention:
      rule: Solange die Bibliothek besteht
      settings: []
    visibility: [Verwaltende der Bibliothek, SYSTEM_ADMIN]
    accessPaths: [UI, API, EXPORT, DATABASE]
    deletion: Mit der Bibliothek
    evaluations: keine
  - id: documents
    title: Dokumentbestand
    purpose: Durchsuchbarer Wissensbestand; Antworten werden auf ihn gestützt
    personalReference: IDENTIFIABLE
    tables:
      - name: documents
        personalColumns:
          - file_name
          - file_path
          - source_hierarchy_path
          - source_container_key
          - context_prefix_title
          - uploaded_by_user_id
          - source_entry_url
        nonPersonalColumns:
          - id
          - content_type
          - file_size
          - chunk_count
          - indexed_at
          - checksum
          - status
          - source_type
          - last_modified_remote
          - library_id
          - organization_id
          - error_message
          - created_at
          - folder_id
          - parent_document_id
          - metadata_extraction_version
          - context_prefix_stamp
          - context_prefix_eligible
          - model_extraction_version
          - keyword_extraction_version
          - processing_instance_id
          - malware_signature
        person:
          columns: [uploaded_by_user_id]
          via: assets
          excludedColumns:
            source_container_key: Technischer Schlüssel der Quelle
            source_entry_url: Technischer Verweis der Quelle
            context_prefix_title: Aus dem Dokumentinhalt abgeleitet
          note: >-
            Nur ein Verzeichnis, nie Inhalte, auf zwei Wegen: eigene Uploads über
            uploaded_by_user_id mit Dateiname, Datum und Bibliothek; Dokumente in privaten
            Bibliotheken der Person, auch konnektor-gespeist, über library_id und das Eigentum am
            Asset der Bibliothek (assets im Datum rights), zusätzlich mit file_path und
            source_hierarchy_path. Bei Uploads in geteilte Bibliotheken bleiben Pfad und Ordner
            draußen (Ablage der Organisation, keine Aussage über die Person)
      - name: chunk_full_text
        personalColumns: [content_tsv]
        nonPersonalColumns: [chunk_id, document_id, library_id, content_tsv_version]
        person:
          excluded: Dokumentinhalt (Volltextindex), keine Daten über die Person
      - name: vector_store
        personalColumns: [content, metadata]
        nonPersonalColumns: [id, embedding]
        person:
          excluded: Dokumentinhalt und Einbettungen, keine Daten über die Person
      - name: document_metadata_values
        personalColumns: [text_value, actor_user_id]
        nonPersonalColumns:
          - id
          - document_id
          - field_key
          - value_state
          - vocabulary_code
          - date_value
          - date_precision
          - origin
          - confidence
          - model_id
          - extraction_version
          - created_at
          - updated_at
          - library_field_id
          - library_value_id
        person:
          excluded: Metadaten des Dokumentinhalts; Handänderungen an Metadaten stehen im Protokoll
      - name: indexing_run_events
        personalColumns: [message, reference]
        nonPersonalColumns: [id, job_id, category, created_at]
        person:
          excluded: Betriebsdaten des Bestands, kein Weg zur Person
      - name: source_sync_revisits
        personalColumns: [hierarchy_path, container_key]
        nonPersonalColumns: [id, sync_state_id, created_at]
        person:
          excluded: Betriebsdaten des Bestands, kein Weg zur Person
      - name: source_event_batches
        personalColumns: [keys]
        nonPersonalColumns:
          [id, library_id, source_type, dropped, overflowed, deferrals, due_at, claimed_until, created_at]
        person:
          excluded: Betriebsdaten des Bestands, kein Weg zur Person
    storage: >-
      Anwendungsdatenbank (Textabschnitte, Volltext- und Vektorindex); Originale in der
      Originalablage
    retention:
      rule: >-
        Solange das Dokument in der Bibliothek oder der Quelle besteht; private Bibliotheken
        deaktivierter Personen nach 30 Tagen
      settings: [opaa.connection.private-library-deletion-days]
    visibility: [Personen mit Leserecht an der Bibliothek]
    accessPaths: [UI, API, EXPORT, DATABASE]
    deletion: >-
      Löschen des Dokuments oder der Bibliothek, Abgleich mit der Quelle, Löschung privater
      Bibliotheken
    evaluations: Suche und Antwortgenerierung im Rahmen der Leserechte
    notes:
      - Inhalte stammen aus Fachverfahren und können Personendaten Dritter enthalten
  - id: original-storage
    title: Originalablage hochgeladener Dateien
    purpose: Aufbewahrung des Originals für Anzeige und erneute Verarbeitung
    personalReference: IDENTIFIABLE
    tables: []
    personExcluded: >-
      Sachinhalte der Bibliotheken, keine Daten über die Person; eigene Uploads erscheinen im
      Verzeichnis des Dokumentbestands
    storage: Dateisystem oder S3-kompatibler Objektspeicher des Betriebs
    retention:
      rule: Solange das Dokument besteht; verwaiste Originale entfernt die Verwaltung
      settings: []
    visibility: [Personen mit Leserecht an der Bibliothek]
    accessPaths: [UI, API, STORAGE]
    deletion: Mit dem Dokument; verwaiste Originale auf Anstoß der Systemverwaltung
    evaluations: keine
  - id: indexing-runs
    title: Indexierungsläufe
    purpose: Fortschritt und Fehler von Indexierungs- und Einbettungsläufen
    personalReference: IDENTIFIABLE
    tables:
      - name: indexing_jobs
        personalColumns: []
        nonPersonalColumns:
          - id
          - triggered_by
          - status
          - documents_total
          - documents_processed
          - documents_failed
          - documents_skipped
          - started_at
          - completed_at
          - error_message
          - library_id
          - documents_indexed_total
          - events_truncated_count
          - last_progress_at
          - organization_id
          - run_mode
          - requests_sent
          - throttle_count
          - throttle_wait_millis
          - attachments_processed
          - attachments_skipped
          - attachments_failed
          - incomplete
          - listing_complete
          - unlisted_scope_keys
          - bytes_downloaded
          - unreadable_scope_count
          - failure_category
          - owner_instance_id
        person:
          excluded: >-
            Kein Weg zur Person: triggered_by hält nur die Art des Anstoßes fest (manuell, Zeitplan,
            Webhook), nicht wer ihn gab
      - name: embedding_index
        personalColumns: [run_started_by]
        nonPersonalColumns:
          - id
          - model
          - base_url
          - dimensions
          - target_model
          - target_base_url
          - target_dimensions
          - run_status
          - run_started_at
          - run_organization_id
          - run_finished_at
          - run_message
          - updated_at
          - run_owner_instance_id
        person:
          columns: [run_started_by]
    storage: Anwendungsdatenbank
    retention:
      rule: Ohne eigene Löschfrist; mit der Bibliothek
      settings: []
    visibility: [Verwaltende der Bibliothek, SYSTEM_ADMIN]
    accessPaths: [UI, API, EXPORT, DATABASE]
    deletion: Mit der Bibliothek
    evaluations: keine
