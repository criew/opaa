    - calls
    - accepted_values
    - rejected_below_threshold
    - rejected_outside_vocabulary
    - failures
    - rejected_pool_full
    - keywords_assigned
    - last_call_at
  metadata_model_rejections:
    [id, library_id, document_id, field_key, proposed_value, confidence, reason, created_at]
  llm_models:
    - id
    - display_name
    - base_url
    - model_identifier
    - temperature
    - max_tokens
    - api_key_ciphertext
    - active
    - created_at
    - updated_at
  llm_model_seed_marker: [id, seeded_at]
  private_storage_quota_settings: [id, quota_bytes, updated_at]
  rss_feed_state: [id, feed_url, etag, last_modified, updated_at, library_id]
  outbound_proxy_settings: [id, proxy_host, proxy_port, no_proxy, updated_at]
  backend_instances:
    - id
    - host_name
    - version
    - oldest_compatible_version
    - started_at
    - heartbeat_at
    - stopped_at
    - fingerprint
    - fingerprint_hash
  backend_instance_fingerprint_key: [id, hmac_key, created_at]
