title: Rechte, Gruppen und Verzeichnisabgleich
data:
  - id: rights
    title: Geltende Rechte und Eigentümerschaft
    purpose: Wer welches Asset lesen, bearbeiten oder verwalten darf, und wer es verantwortet
    personalReference: IDENTIFIABLE
    tables:
      - name: assets
        personalColumns: [owner_user_id, created_by_user_id]
        nonPersonalColumns:
          - id
          - asset_type
          - organization_id
          - name
          - description
          - owner_type
          - owner_group_id
          - origin
          - created_at
          - updated_at
          - owner_only
        person:
          columns: [owner_user_id, created_by_user_id]
          note: >-
            Eigene Assets mit Art und Name, eigene Prompt-Bibliotheken eingeschlossen; Inhalte der
            Assets wie Prompt-Texte sind Sachdaten ohne Personenbezug und gehören nicht dazu
      - name: asset_grants
        personalColumns: [subject_user_id, granted_by_user_id]
        nonPersonalColumns:
          - id
          - asset_id
          - organization_id
          - subject_type
          - subject_group_id
          - role
          - expires_at
          - created_at
          - updated_at
          - asset_type
        person:
          columns: [subject_user_id, granted_by_user_id]
          note: >-
            Grants Dritter an fremden Assets gehören nicht dazu; andere Personen erscheinen als
            „andere Person“
      - name: capability_grants
        personalColumns: [subject_user_id, granted_by_user_id]
        nonPersonalColumns:
          [id, organization_id, capability, subject_type, subject_group_id, created_at, scope]
        person:
          columns: [subject_user_id, granted_by_user_id]
    storage: Anwendungsdatenbank
    retention:
      rule: Solange das Recht besteht; danach nur in der Rechtehistorie
      settings: []
    visibility:
      - Verwaltende des Assets (Freigabeliste)
      - SYSTEM_ADMIN (Rechteübersicht, Anlegerechte)
    accessPaths: [UI, API, EXPORT, DATABASE]
    deletion: >-
      Entzug des Rechts oder Löschen des Assets; nicht mit dem Konto, ein Recht verhindert die
      Löschung des Kontos
    evaluations: Wer hat welches Recht an einem Asset; Rechteübersicht je Subjekt für die Verwaltung
  - id: permission-history
    title: Rechtehistorie
    purpose: Stichtagsauskunft „wer konnte am Tag X was lesen“ für Prüfungen
    personalReference: EMPLOYEE
    tables:
      - name: asset_grant_history
        personalColumns: [subject_user_id, actor_user_id, valid_from, valid_to]
        nonPersonalColumns:
          - id
          - asset_id
          - organization_id
          - subject_type
          - subject_group_id
          - role
          - expires_at
          - cause
          - created_at
          - asset_type
          - transfer_id
        person:
          columns: [subject_user_id, actor_user_id]
      - name: asset_ownership_history
        personalColumns: [owner_user_id, actor_user_id, valid_from, valid_to]
        nonPersonalColumns:
          - id
          - asset_type
          - asset_id
          - organization_id
          - owner_type
          - owner_group_id
          - cause
          - created_at
          - transfer_id
        person:
          columns: [owner_user_id, actor_user_id]
      - name: asset_visibility_history
        personalColumns: [actor_user_id]
        nonPersonalColumns:
          - id
          - asset_id
          - organization_id
          - cause
          - valid_from
          - valid_to
          - created_at
          - external_access_state
          - external_access_expires_at
          - asset_type
        person:
          columns: [actor_user_id]
      - name: capability_grant_history
        personalColumns: [subject_user_id, actor_user_id, valid_from, valid_to]
        nonPersonalColumns:
          - id
          - organization_id
          - capability
          - subject_type
          - subject_group_id
          - cause
          - created_at
          - transfer_id
          - scope
        person:
          columns: [subject_user_id, actor_user_id]
      - name: group_membership_history
        personalColumns: [user_id, actor_user_id, valid_from, valid_to]
        nonPersonalColumns: [id, group_id, organization_id, cause, created_at]
        person:
          columns: [user_id, actor_user_id]
    storage: Anwendungsdatenbank, nur anfügend
    retention:
      rule: Voreinstellung 36 Monate nach Ende eines Intervalls, einstellbar 12 bis 120 Monate
      settings: [permission_history_retention_settings.retention_months]
    visibility: [AUDITOR über die Stichtagsauskunft je Objekt]
    accessPaths: [UI, API, EXPORT, DATABASE]
    deletion: Retention-Lauf der Rechtehistorie
    evaluations: >-
      Stichtagsauskunft je Bibliothek oder Space, mit Person, Grundlage (auch Eigentum eines Space)
      und Zeitraum; jeder Abruf wird protokolliert
  - id: groups
    title: Gruppenmitgliedschaften und Verantwortliche
    purpose: Rechtevergabe an Gruppen, Verantwortung für interne Gruppen
    personalReference: IDENTIFIABLE
    tables:
      - name: group_memberships
        personalColumns: [user_id]
        nonPersonalColumns: [id, group_id, organization_id, created_at]
        person:
          columns: [user_id]
      - name: group_stewards
        personalColumns: [user_id, appointed_by_user_id]
        nonPersonalColumns: [id, group_id, organization_id, created_at]
        person:
          columns: [user_id, appointed_by_user_id]
    storage: Anwendungsdatenbank
    retention:
      rule: Solange die Mitgliedschaft besteht
      settings: []
    visibility:
      - Verantwortliche der Gruppe
      - SYSTEM_ADMIN (Abruf der Mitgliederliste wird protokolliert)
    accessPaths: [UI, API, EXPORT, DATABASE]
    deletion: >-
      Austritt, Auflösung der Gruppe oder Verzeichnisabgleich; mit dem Konto nur, wenn es löschbar
      ist. Verantwortung und Mitgliedschaftshistorie verhindern das in der Regel; eine
      Mitgliedschaft in einer deaktivierten Gruppe hat keine Historie und endet mit dem Konto
    evaluations: Mitgliederliste je Gruppe
  - id: directory-sync
    title: Abgleichspläne des Verzeichnisabgleichs
    purpose: Bestätigung großer Änderungen aus dem Verzeichnis vor ihrer Anwendung
    personalReference: IDENTIFIABLE
    tables:
      - name: directory_sync_pending_plans
        personalColumns: [report, accounts_locked]
        nonPersonalColumns:
          - id
          - organization_id
          - provider_id
          - created_at
          - fingerprint
          - changed_fraction
          - memberships_removed
        person:
          excluded: >-
            Arbeitsstand vor einer Bestätigung, der viele Personen nennt; die bewirkten Änderungen
            stehen in Rechten, Historie und Protokoll
    storage: Anwendungsdatenbank
    retention:
      rule: Bis zur Bestätigung, zum Verwerfen oder zum nächsten Plan
      settings: []
    visibility: [SYSTEM_ADMIN (Auslieferung mit Namen wird protokolliert)]
    accessPaths: [UI, API, DATABASE]
    deletion: Mit Anwendung oder Verwerfen des Plans
    evaluations: keine
  - id: permission-transfers
    title: Rechteübertragungen
    purpose: Nachweis, welche Rechte von einem Subjekt auf ein anderes übertragen wurden
    personalReference: IDENTIFIABLE
    tables:
      - name: permission_transfers
        personalColumns:
          [source_user_id, source_label, target_user_id, target_label, actor_user_id]
        nonPersonalColumns:
          - id
          - organization_id
          - source_type
          - source_group_id
          - target_type
          - target_group_id
          - scope
          - grant_count
          - space_membership_count
          - capability_count
          - ownership_count
          - stewardship_count
          - performed_at
          - created_at
        person:
          columns: [source_user_id, target_user_id, actor_user_id]
          note: Die Bezeichnung der jeweils anderen Seite geht nicht heraus
    storage: Anwendungsdatenbank
    retention:
      rule: Wie die Rechtehistorie, an deren Intervallen die Übertragung hängt
      settings: [permission_history_retention_settings.retention_months]
    visibility: [SYSTEM_ADMIN, AUDITOR]
    accessPaths: [UI, API, EXPORT, DATABASE]
    deletion: Retention-Lauf der Rechtehistorie
    evaluations: keine
  - id: succession
    title: Nachfolgefälle
    purpose: Assets, deren verantwortliche Person ausgeschieden ist
    personalReference: IDENTIFIABLE
    tables:
      - name: succession_cases
        personalColumns: [object_id, closed_by_user_id]
        nonPersonalColumns:
          - id
          - organization_id
          - kind
          - object_type
          - first_seen_at
          - last_seen_at
          - closed_at
          - created_at
          - asset_type
        person:
          columns: [closed_by_user_id]
          via: assets
          note: >-
            Der Weg über assets gilt nur für Fälle mit object_type ASSET: Fälle an Assets der Person
            über deren Eigentum; Fälle an Spaces und Gruppen erreichen die Person nur über
            closed_by_user_id
    storage: Anwendungsdatenbank
    retention:
      rule: Geschlossene Fälle nach der Protokollfrist
      settings: [audit_retention_settings.retention_months]
    visibility: [SYSTEM_ADMIN]
    accessPaths: [UI, API, EXPORT, DATABASE]
    deletion: Retention-Lauf nach der Protokollfrist, nur geschlossene Fälle
    evaluations: Liste offener Nachfolgefälle
  - id: favorites
    title: Favoriten an Assets
    purpose: Persönliche Ordnung der eigenen Ansicht
    personalReference: IDENTIFIABLE
    tables:
      - name: asset_favorites
        personalColumns: [user_id]
        nonPersonalColumns: [asset_id, organization_id, created_at]
        person:
          columns: [user_id]
    storage: Anwendungsdatenbank
    retention:
      rule: Bis die Person sie entfernt oder Konto oder Asset gelöscht wird
      settings: []
    visibility: [nur die Person selbst]
    accessPaths: [UI, API, EXPORT, DATABASE]
    deletion: Durch die Person, mit Konto oder Asset
    evaluations: Keine; weder protokolliert noch gezählt
    notes:
      - In der Menge ein Interessenprofil; nur in der Selbstauskunft exportiert
nonPersonalTables:
  groups:
    - id
    - organization_id
    - kind
    - name
    - description
    - external_id
    - parent_group_id
    - created_at
    - updated_at
    - dissolved
    - dissolved_at
    - provider_id
    - source_path
    - released_for_use
    - protected
    - deactivated
    - deactivated_at
  directory_sync_status:
    - id
    - organization_id
    - last_run_at
    - last_outcome
    - last_message
    - last_changed_fraction
    - last_applied_at
    - provider_id
  directory_connectors:
    - id
    - organization_id
    - provider_id
    - connector_type
    - base_url
    - client_id
    - client_secret
    - created_at
    - updated_at
  permission_history_retention_settings:
    [id, retention_months, last_cutoff, updated_at, account_state_complete_since]
  permission_transfer_objects: [id, transfer_id, organization_id, asset_type, asset_id, created_at]
settings:
  - key: permission_history_retention_settings.retention_months
    source: DATABASE
    defaultValue: "36"
    range: 12 bis 120 Monate
    effect: Aufbewahrungshöchstdauer der Rechtehistorie
    bearings: [DATA, EVALUATION]
