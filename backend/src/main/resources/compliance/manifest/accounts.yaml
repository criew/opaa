title: Konten, Anmeldung und Rollen
data:
  - id: accounts
    title: Benutzerkonten
    purpose: Anmeldung, Zuordnung von Rechten und Anzeige der Person in geteilten Inhalten
    personalReference: EMPLOYEE
    tables:
      - name: users
        personalColumns:
          [subject, issuer, email, display_name, last_login_at, system_role, directory_locked_at]
        nonPersonalColumns: [id, created_at, organization_id]
        person:
          columns: [subject, issuer]
          note: Die Zeile ist das Konto der Person selbst
    storage: Anwendungsdatenbank
    retention:
      rule: >-
        Unbegrenzt; ein Konto bleibt bestehen, solange es nicht gelöscht wird, und löschbar sind in
        der Praxis nur nie benutzte lokale Konten
      settings: []
    visibility:
      - die Person selbst
      - Mitglieder geteilter Spaces und Gruppen (Anzeigename)
      - SYSTEM_ADMIN in der Kontenverwaltung
    accessPaths: [UI, API, EXPORT, DATABASE]
    deletion: >-
      Durch die Systemverwaltung nur bei lokalen Konten, auf die nichts verweist (u. a. kein Chat,
      kein Besitz, keine Rechtevergabe, keine Verbindung, kein Eintrag der Rechtehistorie),
      praktisch also bei nie benutzten Konten. Ein offener Antrag oder eine noch nutzbare Freigabe
      der anlassbezogenen Klärung hält die Löschung auf; danach nicht mehr, die Person bleibt dort
      als Pseudonym bis zu deren Löschfrist. Konten eines
      Identitätsanbieters haben keinen Löschweg; benutzte Konten werden gesperrt, nicht gelöscht
    evaluations: >-
      Letzte Anmeldung ist ein Anwesenheitsmerkmal; die Kontenübersicht zeigt Inaktivitätsklassen
      lokaler Konten (90-Tage-Fenster), keine Zeitreihe
    notes:
      - last_login_at ist ein Anwesenheitsmerkmal; Verhaltenskontrolle prüfen
  - id: local-credentials
    title: Anmeldedaten lokaler Konten
    purpose: Anmeldung ohne externen Identitätsanbieter, Sperre nach Fehlversuchen, Kontoablauf
    personalReference: EMPLOYEE
    tables:
      - name: local_credentials
        personalColumns:
          - user_id
          - password_hash
          - locked_at
          - locked_reason
          - failed_login_attempts
          - lockout_until
          - expires_at
          - expiry_reminded_for
          - email_verified_at
          - email_changed_by_admin_at
          - created_reason
          - session_generation
        nonPersonalColumns:
          - password_change_required
          - password_change_reason
          - password_invalidated_before
          - is_bootstrap
          - created_at
          - updated_at
          - version
        person:
          columns: [user_id]
          excludedColumns:
            password_hash: >-
              Geheimnis, nur als Hash gespeichert; seine Ausgabe wäre ein Sicherheitsrisiko
            failed_login_attempts: >-
              Nach der erneuten Anmeldung vor der Auskunft stets zurückgesetzt, ohne Aussage
            lockout_until: >-
              Nach der erneuten Anmeldung vor der Auskunft stets zurückgesetzt, ohne Aussage
            session_generation: Technischer Merker ohne Aussage über die Person
            email_changed_by_admin_at: >-
              Vermerk für die Revision; die Adressänderung selbst steht als LOCAL_USER_CHANGED im
              Protokoll und damit in der Selbstauskunft
            expiry_reminded_for: Technischer Merker ohne Aussage über die Person
    storage: Anwendungsdatenbank; Passwort nur als Hash
    retention:
      rule: >-
        Bis zur Löschung des Kontos, bei gesperrten Konten damit faktisch unbefristet; Ablauf nach
        Voreinstellung 90 Tagen, Sperre nach 90 Tagen Inaktivität
      settings:
        - local_auth_settings.default_expiry_days
        - local_auth_settings.inactive_days
    visibility: ["SYSTEM_ADMIN (Zustand, nie Passwort oder Zähler)", die Person selbst]
    accessPaths: [UI, API, EXPORT, DATABASE]
    deletion: Mit dem Konto
    evaluations: >-
      Keine; der Fehlversuchszähler wird weder ausgegeben noch historisiert und geht bei Erfolg auf
      null. Die Sitzungsgeneration zählt, wie oft alle Sitzungen des Kontos beendet wurden
      (Passwortwechsel, Sperre, Rücksetzung, erkannte Wiederverwendung, Ausschalten der lokalen
      Konten); sie wird nicht ausgegeben und nur auf Gleichheit mit dem Zugangstoken geprüft
  - id: installation-steps
    title: Zwischenstand der Installation
    purpose: Fortsetzen einer unterbrochenen Erstinstallation bis zu ihrem Abschluss
    personalReference: EMPLOYEE
    tables:
      - name: installation_steps
        personalColumns: [payload, secret, checked_at, updated_at]
        nonPersonalColumns: [step, check_succeeded, check_message]
        person:
          excluded: >-
            Zwischenstand vor dem ersten Konto; Adresse, Anzeigename und Passwort-Hash des ersten
            Kontos stehen hier nur bis zum Abschluss der Installation und gehen dann in dessen
            Konto über; ebenso Mailserver, Zugangsname und Absender des Schritts E-Mail-Versand,
            die in die Mail-Einstellungen übergehen. Die Adresse einer Testmail wird nicht
            gespeichert
    storage: >-
      Anwendungsdatenbank; Passwort des ersten Kontos nur als Hash, Modellschlüssel und
      Passwort des Mailservers verschlüsselt
    retention:
      rule: Bis zum Abschluss der Installation; der Abschluss löscht jede Zeile
      settings: []
    visibility:
      - wer das Installations-Token kennt, über die Installations-API (ohne Passwörter und Schlüssel)
    accessPaths: [API, DATABASE]
    deletion: Mit dem Abschluss der Installation
    evaluations: keine
  - id: local-sessions-and-links
    title: Sitzungen, Einladungs- und Rücksetzlinks lokaler Konten
    purpose: Sitzungsverlängerung, Widerruf, Einladung, Passwortrücksetzung, Kontoübergabe
    personalReference: IDENTIFIABLE
    tables:
      - name: local_refresh_tokens
        personalColumns: [user_id, issued_at, revoked_at, revocation_reason]
        nonPersonalColumns:
          [id, family_id, token_lookup_hash, expires_at, family_expires_at, rotated_to_id]
        person:
          columns: [user_id]
          excludedColumns:
            family_id: Technische Kennung der Sitzungsfamilie
            token_lookup_hash: Geheimnis (Prüfwert des Tokens)
            rotated_to_id: Technische Verkettung innerhalb der Sitzungsfamilie
      - name: local_revoked_tokens
        personalColumns: [user_id]
        nonPersonalColumns: [jti_hash, expires_at, revoked_at]
        person:
          excluded: >-
            Hält nur Prüfwert und Ablauf eines widerrufenen Zugriffstokens; der Widerruf steht schon
            bei der Sitzung
      - name: local_action_tokens
        personalColumns: [user_id, reason, provider_id]
        nonPersonalColumns: [id, purpose, token_hash, created_at, expires_at, consumed_at]
        person:
          columns: [user_id]
          excludedColumns:
            token_hash: Geheimnis (Prüfwert des Links)
    storage: Anwendungsdatenbank; Token nur als Hash
    retention:
      rule: >-
        Höchstens 7 Tage nach Ablauf, Familienende, Widerruf oder Einlösung; Gültigkeit nach den
        Sitzungs- und Linkfristen
      settings:
        - io.opaa.account.LocalTokenCleanupService#RETENTION
        - opaa.auth.local.access-token-ttl
        - opaa.auth.local.refresh-token-ttl
        - opaa.auth.local.session-max-lifetime
        - opaa.auth.local.admin-refresh-token-ttl
        - opaa.auth.local.admin-session-max-lifetime
        - local_auth_settings.invitation_token_ttl_hours
        - local_auth_settings.reset_token_ttl_minutes
    visibility:
      - niemand über die Oberfläche
      - die Person selbst in ihrer Selbstauskunft (ohne Prüfwerte und Familienkennungen)
    accessPaths: [EXPORT, DATABASE]
    deletion: Täglicher Bereinigungslauf
    evaluations: keine
  - id: account-state-history
    title: Kontozustandshistorie
    purpose: >-
      Nachweis, wann ein Konto nutzbar war und wann nicht (Rechtehistorie): Sperre durch den
      Verzeichnisabgleich, durch die Verwaltung oder wegen Inaktivität, Ablauf, offene
      Einladung, abgeschaltete lokale
      Kontenverwaltung, abgeschalteter oder gelöschter Anmeldeanbieter
    personalReference: EMPLOYEE
    tables:
      - name: account_state_history
        personalColumns: [user_id, state, cause, valid_from, valid_to]
        nonPersonalColumns: [id, organization_id, created_at]
        person:
          columns: [user_id]
    storage: Anwendungsdatenbank
    retention:
      rule: >-
        Höchstdauer der Rechtehistorie, Voreinstellung 36 Monate nach Ende des Intervalls; die
        Zeiträume eines gelöschten Kontos gehen mit ihm
      settings: [permission_history_retention_settings.retention_months]
    visibility: [AUDITOR über die Stichtagsauskunft, die Person selbst in ihrer Selbstauskunft]
    accessPaths: [UI, API, EXPORT, DATABASE]
    deletion: Retention-Lauf der Rechtehistorie; mit dem Konto
    evaluations: >-
      Stichtagsauskunft je Objekt: Zeiten, in denen eine dort genannte Person ihr Konto nicht
      nutzen konnte, kürzen ihre Zugriffszeiträume und sind an der Lücke ablesbar; über die
      Datenbank auch der Grund (Sperre, Ablauf, Einladung, Anbieter); Anmeldesperren nach
      Fehlversuchen werden bewusst nicht festgehalten; keine Zeitreihe je Person in der
      Oberfläche
  - id: settings-editors
    title: Bearbeitungsvermerke verwalteter Einstellungen
    purpose: Wer eine verwaltete Einstellung zuletzt geändert hat
    personalReference: IDENTIFIABLE
    tables:
      - name: local_auth_settings
        personalColumns: [updated_by]
        nonPersonalColumns:
          - id
          - self_registration_enabled
          - self_registration_allowed_domains
          - password_reset_enabled
          - password_min_length
          - invitation_token_ttl_hours
          - reset_token_ttl_minutes
          - default_expiry_days
          - inactive_days
          - lockout_max_attempts
          - lockout_duration_minutes
          - updated_at
          - version
        person:
          columns: [updated_by]
      - name: mail_settings
        personalColumns: [updated_by, username, from_address, from_name]
        nonPersonalColumns:
          - id
          - enabled
          - host
          - port
          - password_ciphertext
          - encryption
          - last_success_at
          - last_failure_at
          - last_failure_reason
          - updated_at
        person:
          columns: [updated_by]
          excludedColumns:
            username: Gehört dem Dienstkonto des Mailversands, keine Angabe über die Person
            from_address: Gehört dem Dienstkonto des Mailversands, keine Angabe über die Person
            from_name: Gehört dem Dienstkonto des Mailversands, keine Angabe über die Person
            password_ciphertext: Geheimnis (verschlüsseltes Passwort des Mailservers)
      - name: mail_templates
        personalColumns: [updated_by]
        nonPersonalColumns: [id, template_key, locale, subject, body_plain, body_html, updated_at]
        person:
          columns: [updated_by]
      - name: external_access_settings
        personalColumns: [updated_by]
        nonPersonalColumns:
          - id
          - enabled
          - token_max_lifetime_days
          - token_rate_limit_per_hour
          - allowed_cidrs
          - mass_retrieval_alert_threshold
          - server_instructions
          - release_reminder_lead_days
          - updated_at
          - version
        person:
          columns: [updated_by]
      - name: self_disclosure_settings
        personalColumns: [updated_by]
        nonPersonalColumns: [id, enabled, daily_limit, updated_at]
        person:
          columns: [updated_by]
      - name: link_target_settings
        personalColumns: [updated_by]
        nonPersonalColumns: [id, allowed_origins, updated_at]
        person:
          columns: [updated_by]
    storage: Anwendungsdatenbank
    retention:
      rule: Bis zur nächsten Änderung der Einstellung
      settings: []
    visibility:
      - SYSTEM_ADMIN
      - die Person selbst in ihrer Selbstauskunft (Bereich und Zeitpunkt, keine Werte)
    accessPaths: [UI, API, EXPORT, DATABASE]
    deletion: Überschrieben bei der nächsten Änderung
    evaluations: keine
  - id: mail-outbox
    title: Warteschlange ausgehender E-Mails
    purpose: >-
      Zustellung von E-Mails, auf deren Ergebnis niemand in derselben Anfrage wartet (Kennwort vergessen,
      Selbstregistrierung, Sperre, Erinnerungen), auch über Neustart und Instanzwechsel hinweg
    personalReference: IDENTIFIABLE
    tables:
      - name: mail_outbox
        personalColumns:
          [recipient_ciphertext, subject_ciphertext, body_plain_ciphertext, body_html_ciphertext, created_at]
        nonPersonalColumns: [id, template_key, attempts, next_attempt_at, last_failure_reason]
        person:
          excluded: >-
            Zustellpuffer von höchstens rund zwei Stunden; die Mails selbst liegen im Postfach der
            Person
    storage: Anwendungsdatenbank, Empfänger und Inhalt verschlüsselt mit dem Einstellungsschlüssel
    retention:
      rule: >-
        Bis zur Zustellung, längstens bis zum letzten von acht Zustellversuchen (rund zwei Stunden); bei
        ausgeschaltetem Versand bis zum Wiedereinschalten
      settings: []
    visibility: [niemand über die Oberfläche]
    accessPaths: [DATABASE]
    deletion: Nach der Zustellung oder dem letzten Fehlversuch gelöscht
    evaluations: keine
  - id: auditor-role-requests
    title: Offene Anträge auf die Rolle Revision
    purpose: >-
      Trennung von Systemverwaltung und Revision: Die Systemverwaltung oder der Rollen-Claim eines
      Identitätsanbieters beantragt die Rolle AUDITOR, eine Person der Revision bestätigt oder
      lehnt ab
    personalReference: EMPLOYEE
    tables:
      - name: auditor_role_requests
        personalColumns: [user_id, requested_by_user_id, requested_at, declined_at]
        nonPersonalColumns: [id, organization_id, requested_by_provider_id]
        person:
          excluded: >-
            Kurzlebiger Vorgangsstand; Antrag und Entscheidung stehen als Protokollereignisse der
            betroffenen Person in ihrer Selbstauskunft
    storage: Anwendungsdatenbank
    retention:
      rule: >-
        Bis zur Entscheidung; ein bestätigter, abgelehnter oder zurückgezogener Antrag wird gelöscht,
        mit dem Konto der Person, der beantragenden Person oder dem Identitätsanbieter auch. Ein
        abgelehnter Antrag eines Identitätsanbieters bleibt als abgelehnt stehen, bis der Rollen-Claim
        die Rolle nicht mehr nennt
      settings: []
    visibility:
      - >-
        Revision (AUDITOR) mit Name und Adresse des Kontos, Datum des letzten Adresswechsels durch
        die Systemverwaltung und Name der beantragenden Person oder des Identitätsanbieters
      - SYSTEM_ADMIN als Vermerk „beantragt“ in der Kontenverwaltung
    accessPaths: [UI, API, DATABASE]
    deletion: Bei Entscheidung oder mit einem der beiden Konten (ON DELETE CASCADE)
    evaluations: >-
      Keine; wer wen beantragt und entschieden hat, steht im Revisionsprotokoll
      (AUDITOR_ROLE_REQUESTED, AUDITOR_ROLE_GRANTED, AUDITOR_ROLE_REQUEST_DECLINED)
  - id: notifications
    title: Benachrichtigungen
    purpose: Hinweise an eine Person über Ereignisse an ihren Objekten
    personalReference: IDENTIFIABLE
    tables:
      - name: notifications
        personalColumns: [recipient_user_id, title, body, read_at]
        nonPersonalColumns: [id, organization_id, type, object_type, object_id, created_at]
        person:
          columns: [recipient_user_id]
    storage: Anwendungsdatenbank
    retention:
      rule: >-
        Bis zur Löschung des Kontos oder des betroffenen Objekts; Abflussalarme zum Zugriff externer KI-Werkzeuge
        14 Tage
      settings: [io.opaa.externalaccess.ExternalAccessAlertRetention#RETENTION]
    visibility: [die empfangende Person]
    accessPaths: [UI, API, EXPORT, DATABASE]
    deletion: Mit dem Konto (ON DELETE CASCADE), mit dem Objekt, Alarme täglich nach Frist
    evaluations: keine
  - id: self-disclosure
    title: Stand der Selbstauskunft
    purpose: >-
      Tagesgrenze und Starts der Selbstauskunft je Person durchsetzen, höchstens einen laufenden
      Export je Person zulassen und der Person den Stand ihrer Selbstauskunft zeigen
    personalReference: EMPLOYEE
    tables:
      - name: self_disclosure_usage
        personalColumns:
          - account_id
          - count_day
          - starts_count
          - completed_count
          - last_completed_at
          - last_result
          - run_id
          - lease_until
          - ticket_hash
          - ticket_expires_at
        nonPersonalColumns: []
        person:
          columns: [account_id]
          excludedColumns:
            run_id: Reservierung des laufenden Exports; betrifft immer den Export selbst, ohne Aussage
            lease_until: >-
              Reservierung des laufenden Exports; betrifft immer den Export selbst, ohne Aussage
            ticket_hash: Geheimnis (Prüfwert des Einmal-Tickets für den Download)
            ticket_expires_at: Ablauf des Einmal-Tickets; höchstens 60 Sekunden, ohne Aussage
          note: >-
            Eine Zeile je Person; Zähler nur des laufenden Tages, am nächsten Tag überschrieben,
            Ergebnis nur des letzten Versuchs, kein Verlauf
    storage: Anwendungsdatenbank
    retention:
      rule: >-
        Bis zur Löschung des Kontos; Zähler und Ergebnis werden beim nächsten Export überschrieben,
        der Ticket-Prüfwert beim Einlösen gelöscht
      settings: []
    visibility: [die Person selbst]
    accessPaths: [UI, API, EXPORT, DATABASE]
    deletion: Mit dem Konto (ON DELETE CASCADE)
    evaluations: >-
      In der Anwendung keine: Der letzte Export erscheint in keiner Kontenliste und keiner
      Schnittstelle der Verwaltung. Über die Datenbank je Person der Zeitpunkt des letzten
      vollständigen Exports sowie Starts, vollständige Exporte und Ergebnis des laufenden Tages,
      also wer sein Auskunftsrecht wann zuletzt genutzt hat; kein Verlauf der Exportzeitpunkte
    notes:
      - Zeitpunkt des letzten vollständigen Exports ist ein Verhaltensmerkmal; nur für die Person selbst
  - id: application-log
    title: Technisches Anwendungslog
    purpose: Betrieb und Fehlersuche; enthält u. a. einzelne fehlgeschlagene Anmeldungen
    personalReference: IDENTIFIABLE
    tables: []
    personExcluded: Liegt beim Betrieb, nicht in OPAA; Auskunft darüber gibt die Behörde
    storage: Standardausgabe des Prozesses, abgelegt durch den Betrieb (Container-Log)
    retention:
      rule: Legt der Betrieb fest; OPAA speichert das Log nicht selbst
      settings: []
    visibility: [Betrieb der Installation]
    accessPaths: [STORAGE]
    deletion: Durch den Betrieb
    evaluations: Keine Auswertungsoberfläche in OPAA
    notes:
      - Kurze Frist im Betrieb festlegen; Konto-Kennung statt Adresse
nonPersonalTables:
  organizations: [id, name, created_at]
  admin_review_reminders: [organization_id, reminded_on]
  installation_state:
    [id, status, token_hash, token_source, completion_source, completed_at, updated_at]
  oidc_providers:
    - id
    - display_name
    - enabled
    - is_default
    - sort_order
    - issuer_uri
    - client_id
    - jwk_set_uri
    - email_claim
    - display_name_claim
    - roles_claim
    - system_admin_role
    - auditor_role
    - groups_claim
    - created_at
    - updated_at
    - provider_type
    - is_external
    - directory_sync_enabled
    - directory_sync_interval_minutes
  oidc_provider_seed_marker: [id, seeded_at]
  oidc_provider_removals: [issuer_uri_normalized, removed_at]
  local_admin_seed_marker: [id, seeded_at, forced_reset_at]
  branding_settings:
    - id
    - product_name
    - claim
    - ai_notice
    - primary_color
    - default_color_scheme
    - logo_content
    - logo_content_type
    - logo_version
    - logo_updated_at
    - updated_at
    - login_logo_content
    - login_logo_content_type
    - login_logo_version
    - login_logo_updated_at
    - login_background_content
    - login_background_content_type
    - login_background_version
    - login_background_updated_at
settings:
  - key: opaa.auth.local.access-token-ttl
    source: PROPERTY
    defaultValue: 15m
    effect: Gültigkeit eines Zugriffstokens lokaler Konten
    bearings: [DATA]
  - key: opaa.auth.local.refresh-token-ttl
    source: PROPERTY
    defaultValue: 7d
    range: höchstens 30 Tage
    effect: Leerlaufgrenze einer Sitzung lokaler Konten
    bearings: [DATA]
  - key: opaa.auth.local.session-max-lifetime
    source: PROPERTY
    defaultValue: 30d
    range: höchstens 90 Tage
    effect: Absolutes Ende einer Sitzung lokaler Konten
    bearings: [DATA]
  - key: opaa.auth.local.admin-refresh-token-ttl
    source: PROPERTY
    defaultValue: 4h
    effect: Leerlaufgrenze der Sitzung lokaler Systemverwaltungskonten
    bearings: [DATA]
  - key: opaa.auth.local.admin-session-max-lifetime
    source: PROPERTY
    defaultValue: 12h
    effect: Absolutes Ende der Sitzung lokaler Systemverwaltungskonten
    bearings: [DATA]
  - key: io.opaa.account.LocalTokenCleanupService#RETENTION
    source: CONSTANT
    defaultValue: P7D
    effect: Wie lange abgelaufene oder widerrufene Token-Zeilen erkennbar bleiben
    bearings: [DATA]
  - key: local_auth_settings.invitation_token_ttl_hours
    source: DATABASE
    defaultValue: "72"
    range: 1 bis 720 Stunden
    effect: Gültigkeit eines Einladungslinks
    bearings: [DATA]
  - key: local_auth_settings.reset_token_ttl_minutes
    source: DATABASE
    defaultValue: "30"
    range: 1 bis 1440 Minuten
    effect: Gültigkeit eines Rücksetzlinks
    bearings: [DATA]
  - key: local_auth_settings.default_expiry_days
    source: DATABASE
    defaultValue: "90"
    range: mindestens 1 Tag
    effect: Voreingestellter Ablauf eines neuen lokalen Kontos
    bearings: [DATA, VISIBILITY]
  - key: local_auth_settings.inactive_days
    source: DATABASE
    defaultValue: "90"
    range: mindestens 30 Tage
    effect: Sperre eines lokalen Kontos nach so vielen Tagen ohne Anmeldung
    bearings: [DATA, EVALUATION]
  - key: local_auth_settings.lockout_max_attempts
    source: DATABASE
    defaultValue: "5"
    range: 1 bis OPAA_AUTH_LOCAL_LOCKOUT_MAX_ATTEMPTS (Voreinstellung 5)
    effect: >-
      Falsche Passwörter in Folge, nach denen ein lokales Konto vorübergehend gesperrt wird; jede
      Sperre steht im Revisionsprotokoll. Wirkt ab dem nächsten Fehlversuch auf allen Instanzen
    bearings: [DATA]
    notes:
      - >-
        Werkseinstellung, solange die Systemverwaltung unter Administration → Benutzer →
        Einstellungen keinen eigenen Wert setzt; die Obergrenze legt der Betrieb fest, ein darüber
        gespeicherter Wert wirkt als Obergrenze
  - key: local_auth_settings.lockout_duration_minutes
    source: DATABASE
    defaultValue: "15"
    range: OPAA_AUTH_LOCAL_LOCKOUT_MIN_DURATION (Voreinstellung 15 Minuten) bis 1440 Minuten
    effect: >-
      Dauer der Sperre nach Fehlversuchen; eine laufende Sperre behält ihr Ende, wenn sich der Wert
      ändert
    bearings: [DATA]
    notes:
      - >-
        Werkseinstellung, solange die Systemverwaltung unter Administration → Benutzer →
        Einstellungen keinen eigenen Wert setzt; die Untergrenze legt der Betrieb fest, ein darunter
        gespeicherter Wert wirkt als Untergrenze
  - key: self_disclosure_settings.enabled
    source: DATABASE
    defaultValue: "true"
    range: an / aus
    effect: >-
      Notabschaltung der Selbstauskunft; wirkt ohne Neustart auf allen Instanzen, ein laufender
      Export läuft zu Ende
    bearings: [DATA, VISIBILITY]
  - key: self_disclosure_settings.daily_limit
    source: DATABASE
    defaultValue: "1"
    range: 1 bis 10
    effect: >-
      Vollständige Exporte der Selbstauskunft je Person und Kalendertag; Starts je Tag höchstens
      Tagesgrenze plus vier
    bearings: [DATA]
  - key: link_target_settings.allowed_origins
    source: DATABASE
    defaultValue: leer
    range: höchstens 50 Ziele, je Schema https oder http, Host und optional Port
    effect: >-
      Erlaubte Linkziele: Links in Antworten sind nur zur eigenen Adresse der Anwendung und zu
      diesen Zielen klickbar, alle anderen erscheinen als Text. Begrenzt, wohin ein Klick Inhalte
      aus einer Antwort tragen kann; wirkt ohne Neustart auf allen Instanzen, in bereits
      geöffneten Fenstern erst nach dem Neuladen der Seite. Ist die Liste nicht ladbar, ist nur
      die eigene Adresse klickbar
    bearings: [DATA_FLOW]
roles:
  - id: USER
    seesAboutOthers: >-
      Anzeigenamen der Mitglieder geteilter Spaces und Gruppen sowie von Eigentümern und Autoren
      geteilter Inhalte; keine Protokolle, keine Nutzungsdaten anderer
  - id: SYSTEM_ADMIN
    seesAboutOthers: >-
      Konten mit Adresse, Anzeigename, Rolle, Kontozustand und Inaktivitätsklasse; Mitgliederlisten
      von Gruppen (der Abruf wird protokolliert); Abgleichsberichte mit Namen (protokolliert);
      Zugangstokens nach Kennung und Ablauf. Keine Protokolleinträge und ohne Recht keine Inhalte
      von Dokumenten oder Chats
  - id: AUDITOR
    seesAboutOthers: >-
      Protokolleinträge über die vier begrenzten Abfragewege und das Verbindungsprotokoll, jeweils
      ohne Kennung der handelnden oder betroffenen Person; die Rechtehistorie als Stichtagsauskunft
      zu einem Objekt mit den Personen, die es lesen durften; das Diagnoseprotokoll mit dem
      Pseudonym der handelnden Systemverwaltung bei „Sicht als“; die offenen Anträge auf die Rolle
      Revision mit Name und Adresse des Kontos und der beantragenden Person, weil sie die Person vor
      der Bestätigung prüft. Eine Person im Revisionsprotokoll
      nur in einer freigegebenen anlassbezogenen Klärung im Vier-Augen-Prinzip. Keine
      Verwaltungsrechte
capabilities:
  - id: CREATE_SPACE
    seesAboutOthers: Nichts über andere Personen; öffnet nur das Anlegen eines Space
  - id: CREATE_LIBRARY
    seesAboutOthers: Nichts über andere Personen; öffnet nur das Anlegen einer Upload-Bibliothek
  - id: CREATE_CONNECTOR_LIBRARY
    seesAboutOthers: >-
      Nichts über andere Personen; die angelegte Bibliothek kann Inhalte einer Quelle mit den dort
      enthaltenen Personendaten aufnehmen
  - id: CREATE_INTERNAL_GROUP
    seesAboutOthers: Anzeigenamen der Personen, die in die eigene Gruppe aufgenommen werden
  - id: CREATE_PROMPT_LIBRARY
    seesAboutOthers: Nichts über andere Personen
