title: Chats und Prompts
data:
  - id: chats
    title: Chats und Nachrichten
    purpose: Gesprächsverlauf der Person mit dem Assistenten, mit Fundstellen
    personalReference: EMPLOYEE
    tables:
      - name: chats
        personalColumns: [author_id, title, metadata_filter, created_at, updated_at]
        nonPersonalColumns:
          [id, space_id, organization_id, use_knowledge, status, title_source, import_key]
        person:
          columns: [author_id]
      - name: chat_messages
        personalColumns: [content, content_tsv, sources, used_prompt_title, created_at]
        nonPersonalColumns: [id, chat_id, sequence, role, used_prompt_id]
        person:
          via: chats
          excludedColumns:
            content_tsv: Abgeleiteter Suchindex desselben Inhalts
          note: >-
            Aus sources gehen nur Dokumenttitel, Bibliothek und Seite der Fundstellen heraus, nie
            ihre Textausschnitte, Überschriften oder Blattnamen (Dokumentinhalt), auch nicht die
            Zitate und der Abschnittspfad des gespeicherten Fundstellen-Ankers
      - name: chat_note_items
        personalColumns: [text]
        nonPersonalColumns: [id, chat_id, organization_id, position, kind, created_at]
        person:
          via: chats
      - name: chat_personal_marks
        personalColumns: [user_id, pinned_at, archived_at, unarchived_at]
        nonPersonalColumns: [chat_id, organization_id]
        person:
          columns: [user_id]
    storage: Anwendungsdatenbank; Inhalte gehen an das Sprachmodell (Datenfluss)
    retention:
      rule: >-
        Unbegrenzt bis zur Löschung durch die Person; in Spaces mit eingeschalteter Bereinigung
        Archiv nach 90 Tagen ohne Aktivität und Löschung 365 Tage nach der Archivierung,
        angeheftete Chats ausgenommen. Unabhängig davon werden alle Chats eines lokalen Kontos
        365 Tage nach seiner Sperre durch die Verwaltung gelöscht, auch angeheftete; die Frist
        beginnt frühestens mit der Einführung bzw. dem Einschalten, ruht nicht, wird aber
        ausgesetzt, solange die Verwaltung die Löschung für das Konto anhält oder das Konto in
        einer offenen anlassbezogenen Klärung steht. Sperren wegen Inaktivität oder Fehlversuchen
        und Konten eines Identitätsanbieters lösen sie nicht aus
      settings:
        - chat_auto_cleanup_settings.archive_after_days
        - chat_auto_cleanup_settings.delete_after_days
        - locked_account_chat_cleanup_settings.enabled
        - locked_account_chat_cleanup_settings.delete_after_days
    visibility: [nur die Autorin oder der Autor]
    accessPaths: [UI, API, EXPORT, DATABASE]
    deletion: >-
      Durch die Person, die automatische Bereinigung je Space oder den nächtlichen Lauf nach der
      Sperre eines lokalen Kontos durch die Verwaltung (auf demselben Weg wie durch die Person,
      mit Verlauf, Gesprächsnotiz und persönlichen Merkmalen; Nachweis im Protokoll ohne Zahl,
      Titel oder Inhalt); nicht mit dem Konto, ein vorhandener Chat verhindert die Löschung des
      Kontos
    evaluations: >-
      Chatsuche der Person über eigene Chats; Export eines eigenen Chats als Markdown- oder
      PDF-Datei durch die Person; keine Auswertung durch andere, Fragen werden nicht protokolliert
    notes:
      - Fragen und Antworten können Inhalte aus Fachverfahren und Personendaten Dritter enthalten
      - >-
        Die Person kann einen eigenen Chat als Markdown- oder PDF-Datei herunterladen (Fragen,
        Antworten, Gesprächsnotiz, Dokumenttitel und Fundorte der Quellen); der Export wird weder
        protokolliert noch gespeichert
  - id: chat-cleanup-holds
    title: Angehaltene Löschung der Chats eines gesperrten Kontos
    purpose: >-
      Hält die Löschung der Chats eines lokalen Kontos nach dessen Sperre an, etwa für ein
      Disziplinarverfahren außerhalb von OPAA
    personalReference: EMPLOYEE
    tables:
      - name: chat_cleanup_holds
        personalColumns: [user_id, held_at]
        nonPersonalColumns: [organization_id]
        person:
          columns: [user_id]
    storage: Anwendungsdatenbank
    retention:
      rule: Bis die Verwaltung die Löschung fortsetzt oder das Konto gelöscht wird
      settings: []
    visibility: [SYSTEM_ADMIN in der Einzelansicht des Kontos]
    accessPaths: [UI, API, EXPORT, DATABASE]
    deletion: Durch die Systemverwaltung („Löschung fortsetzen“) oder mit dem Konto
    evaluations: >-
      Ob und seit wann die Löschung für ein Konto angehalten ist; ohne Begründung. Keine Liste,
      kein Filter und kein Export der angehaltenen Konten in der Oberfläche. Zahl der Anhalte-
      vorgänge je Kalendermonat ohne Person, in der Auskunft über die Datenerhebung an die
      Personalvertretung
nonPersonalTables:
  chat_locked_account_cleanup_state: [id, counting_since]
  chat_auto_cleanup_settings: [id, archive_after_days, delete_after_days, updated_at]
  locked_account_chat_cleanup_settings: [id, enabled, delete_after_days, updated_at]
  search_status_probes: [role, condition, base_url, model, detail, observed_at]
  chat_library_references: [chat_id, library_id, organization_id]
  prompt_libraries: [id, asset_type, organization_id]
  prompts:
    - id
    - library_id
    - organization_id
    - name
    - title
    - description
    - text
    - variables
    - sort_order
    - created_at
    - updated_at
settings:
  - key: chat_auto_cleanup_settings.archive_after_days
    source: DATABASE
    defaultValue: "90"
    range: 90 bis 3650 Tage
    effect: Archivierung inaktiver Chats in Spaces mit eingeschalteter Bereinigung
    bearings: [DATA]
    notes:
      - >-
        Werkseinstellung, solange die Systemverwaltung unter Administration → Datenschutz keinen
        eigenen Wert setzt
  - key: chat_auto_cleanup_settings.delete_after_days
    source: DATABASE
    defaultValue: "365"
    range: 30 bis 3650 Tage
    effect: Löschung von Chats in Spaces mit eingeschalteter Bereinigung
    bearings: [DATA]
    notes:
      - >-
        Werkseinstellung, solange die Systemverwaltung unter Administration → Datenschutz keinen
        eigenen Wert setzt
  - key: locked_account_chat_cleanup_settings.enabled
    source: DATABASE
    defaultValue: "true"
    range: true oder false
    effect: >-
      Ob die Chats lokaler Konten nach der Sperre durch die Verwaltung gelöscht werden; nach dem
      Wiedereinschalten beginnt jede Frist neu
    bearings: [DATA]
    notes:
      - >-
        Werkseinstellung, solange die Systemverwaltung unter Administration → Datenschutz keinen
        eigenen Wert setzt
  - key: locked_account_chat_cleanup_settings.delete_after_days
    source: DATABASE
    defaultValue: "365"
    range: 90 bis 3650 Tage
    effect: >-
      Frist zwischen der Sperre eines lokalen Kontos durch die Verwaltung und der Löschung seiner
      Chats; eine Verlängerung ist eine längere Speicherfrist und gehört in die Dienstvereinbarung
    bearings: [DATA]
    notes:
      - >-
        Werkseinstellung, solange die Systemverwaltung unter Administration → Datenschutz keinen
        eigenen Wert setzt
