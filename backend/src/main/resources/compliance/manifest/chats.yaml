settings:
  - key: document_template_settings.enabled
    source: DATABASE
    defaultValue: "false"
    range: an oder aus
    effect: >-
      Schalter „Vorlagen“: Dokumentvorlagen lassen sich anlegen, finden und von Agenten befüllen;
      aus, bleiben gespeicherte Vorlagen erhalten, sind aber nirgends erreichbar
    bearings: [DATA]
  - key: opaa.chat.attachments.unbound-retention
    source: PROPERTY
    defaultValue: "24h"
    range: 1 Stunde bis 7 Tage
    effect: Löschung von Chat-Anhängen, die nie mit einer Frage gesendet wurden
    bearings: [DATA]
  - key: opaa.chat.attachments.inline-max-chars
    source: PROPERTY
    defaultValue: "120000"
    range: mindestens 1000 Zeichen
    effect: >-
      Bis zu dieser Zeichenzahl aller Anhänge eines Chats geht ihr ganzer Text mit jeder Frage an
      das Sprachmodell; darüber nur die zur Frage passenden Abschnitte
    bearings: [DATA_FLOW]
  - key: opaa.chat.attachments.excerpt-max-chars
    source: PROPERTY
    defaultValue: "40000"
    range: mindestens 1000 Zeichen
    effect: >-
      Höchstzahl der Zeichen aus Anhängen, die oberhalb von opaa.chat.attachments.inline-max-chars
      je Frage an das Sprachmodell gehen
    bearings: [DATA_FLOW]
  - key: chat_auto_cleanup_settings.archive_after_days
    source: DATABASE
    defaultValue: "90"
    range: 90 bis 3650 Tage
    effect: Archivierung inaktiver Chats in Spaces mit eingeschalteter Bereinigung
    bearings: [DATA]
    notes:
      - >-
        Werkseinstellung, solange die Systemverwaltung unter Administration → Datenschutz keinen
        eigenen Wert setzt
  - key: chat_auto_cleanup_settings.delete_after_days
    source: DATABASE
    defaultValue: "365"
    range: 30 bis 3650 Tage
    effect: Löschung von Chats in Spaces mit eingeschalteter Bereinigung
    bearings: [DATA]
    notes:
      - >-
        Werkseinstellung, solange die Systemverwaltung unter Administration → Datenschutz keinen
        eigenen Wert setzt
  - key: locked_account_chat_cleanup_settings.enabled
    source: DATABASE
    defaultValue: "true"
    range: true oder false
    effect: >-
      Ob die Chats von Konten nach der Sperre durch die Verwaltung (lokal) oder durch den
      Verzeichnisabgleich (Anbieterkonten) gelöscht werden; nach dem
      Wiedereinschalten beginnt jede Frist neu
    bearings: [DATA]
    notes:
      - >-
        Werkseinstellung, solange die Systemverwaltung unter Administration → Datenschutz keinen
        eigenen Wert setzt
  - key: opaa.chat.locked-account-cleanup.hold-max-days
    source: PROPERTY
    defaultValue: "180"
    range: 7 bis 730 Tage
    effect: >-
      Längste Dauer einer freigegebenen Anhaltung der Löschung der Chats eines gesperrten Kontos;
      danach endet sie von selbst, weiter geht es nur mit neuem Antrag und neuer Freigabe. Gilt
      für Freigaben ab der Änderung
    bearings: [DATA]
  - key: locked_account_chat_cleanup_settings.delete_after_days
    source: DATABASE
    defaultValue: "365"
    range: 90 bis 3650 Tage
    effect: >-
      Frist zwischen der Sperre eines lokalen Kontos durch die Verwaltung oder eines Anbieterkontos
      durch den Verzeichnisabgleich und der Löschung seiner Chats; eine Verlängerung ist eine längere Speicherfrist und gehört in die Dienstvereinbarung
    bearings: [DATA]
    notes:
      - >-
        Werkseinstellung, solange die Systemverwaltung unter Administration → Datenschutz keinen
        eigenen Wert setzt
  - key: agent_run_log_retention_settings.step_log_retention_days
    source: DATABASE
    defaultValue: "7"
    range: 1 bis 30 Tage
    effect: Aufbewahrungsfrist des Schrittprotokolls der Agentenläufe
    bearings: [DATA]
  - key: agent_run_log_retention_settings.sandbox_log_retention_days
    source: DATABASE
    defaultValue: "7"
    range: 1 Tag bis zur Frist des Schrittprotokolls
    effect: Aufbewahrungsfrist des Sandboxprotokolls der Agentenläufe
    bearings: [DATA]
