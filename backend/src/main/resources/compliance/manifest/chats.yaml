title: Chats und Prompts
data:
  - id: chats
    title: Chats und Nachrichten
    purpose: Gesprächsverlauf der Person mit dem Assistenten, mit Fundstellen
    personalReference: EMPLOYEE
    tables:
      - name: chats
        personalColumns: [author_id, title, metadata_filter, created_at, updated_at]
        nonPersonalColumns:
          [id, space_id, organization_id, use_knowledge, status, title_source, import_key]
        person:
          columns: [author_id]
      - name: chat_messages
        personalColumns:
          [content, content_tsv, sources, answer_evidence, agent_run, used_prompt_title, created_at]
        nonPersonalColumns: [id, chat_id, sequence, role, used_prompt_id]
        person:
          via: chats
          excludedColumns:
            content_tsv: Abgeleiteter Suchindex desselben Inhalts
          note: >-
            Aus sources gehen nur Dokumenttitel, Bibliothek und Seite der Fundstellen heraus, nie
            ihre Textausschnitte, Überschriften oder Blattnamen (Dokumentinhalt), auch nicht die
            Zitate und der Abschnittspfad des gespeicherten Fundstellen-Ankers; agent_run nennt je
            Werkzeugschritt die Unterfrage, bei run_code die Namen der erzeugten Dateien und bei
            fill_template den Namen der Vorlage mit den Namen der erzeugten Dateien, dazu den
            Fassungsstempel der Antwort: Agent mit Name und Fassung, die durchsuchbaren Bibliotheken
            mit Namen zum Zeitpunkt, ausgefüllte Vorlagen mit Fassung und das Modell
      - name: chat_note_items
        personalColumns: [text]
        nonPersonalColumns: [id, chat_id, organization_id, position, kind, created_at]
        person:
          via: chats
      - name: chat_personal_marks
        personalColumns: [user_id, pinned_at, archived_at, unarchived_at]
        nonPersonalColumns: [chat_id, organization_id]
        person:
          columns: [user_id]
    storage: Anwendungsdatenbank; Inhalte gehen an das Sprachmodell (Datenfluss)
    retention:
      rule: >-
        Unbegrenzt bis zur Löschung durch die Person; in Spaces mit eingeschalteter Bereinigung
        Archiv nach 90 Tagen ohne Aktivität und Löschung 365 Tage nach der Archivierung,
        angeheftete Chats ausgenommen. Unabhängig davon werden alle Chats eines Kontos 365 Tage
        nach seiner Sperre gelöscht, auch angeheftete: bei lokalen Konten nach der Sperre durch
        die Verwaltung, bei Anbieterkonten nach der Sperre durch den Verzeichnisabgleich. Alle drei
        Fristen sind Voreinstellungen, die die Systemverwaltung ändern kann; die Frist nach der
        Sperre beginnt frühestens mit der Einführung bzw. dem Einschalten, ruht nicht, wird aber
        ausgesetzt, solange eine freigegebene Anhaltung der Löschung für das Konto läuft (nur
        lokale Konten, höchstens opaa.chat.locked-account-cleanup.hold-max-days Tage je Freigabe)
        oder das Konto in einer offenen anlassbezogenen Klärung steht. Sperren wegen Inaktivität
        oder Fehlversuchen und Anbieterkonten ohne Verzeichnisabgleich lösen sie nicht aus
      settings:
        - chat_auto_cleanup_settings.archive_after_days
        - chat_auto_cleanup_settings.delete_after_days
        - locked_account_chat_cleanup_settings.enabled
        - locked_account_chat_cleanup_settings.delete_after_days
        - opaa.chat.locked-account-cleanup.hold-max-days
    visibility: [nur die Autorin oder der Autor]
    accessPaths: [UI, API, EXPORT, DATABASE]
    deletion: >-
      Durch die Person, die automatische Bereinigung je Space oder den nächtlichen Lauf nach der
      Sperre eines lokalen Kontos durch die Verwaltung (auf demselben Weg wie durch die Person,
      mit Verlauf, Gesprächsnotiz und persönlichen Merkmalen; Nachweis im Protokoll ohne Zahl,
      Titel oder Inhalt) und beim Entfernen des Personenbezugs des Kontos sofort, in allen Spaces; ein vorhandener Chat
      verhindert die Löschung des Kontos
    evaluations: >-
      Chatsuche der Person über eigene Chats; Export eines eigenen Chats als Markdown- oder
      PDF-Datei durch die Person; keine Auswertung durch andere, Fragen werden nicht protokolliert.
      Über die Datenbank ließe sich aus dem Fassungsstempel ablesen, welche Person wann mit welchem
      Agenten in welcher Fassung, welchen Bibliotheken, Vorlagen und welchem Modell gearbeitet
      hat; die Anwendung bietet dafür keine Abfrage, die Person sieht den Stempel nur an der eigenen
      Antwort
    notes:
      - Fragen und Antworten können Inhalte aus Fachverfahren und Personendaten Dritter enthalten
      - >-
        Die Person kann einen eigenen Chat als Markdown- oder PDF-Datei herunterladen (Fragen,
        Antworten, Gesprächsnotiz, Dokumenttitel und Fundorte der Quellen); der Export wird weder
        protokolliert noch gespeichert
  - id: chat-attachments
    title: Anhänge an Chatfragen
    purpose: >-
      Dokumente, die die Person einer Chatfrage anhängt, damit die Antwort ihren Inhalt nutzt; Text
      und Original, ohne Einbettung und ohne Aufnahme in eine Bibliothek. Das Agentenwerkzeug
      run_code und fill_template (nur mit eingeschalteter Sandbox) legen die Dateien, die ein Skript
      im Lauf erzeugt oder die eine befüllte Dokumentvorlage ergibt, ohne eigene Handlung der Person
      als ihre Anhänge an, durch dieselben Prüfungen wie ein Hochladen, und binden sie an die
      Antwortnachricht
    personalReference: EMPLOYEE
    tables:
      - name: chat_attachments
        personalColumns: [author_id, file_name, created_at]
        nonPersonalColumns:
          - id
          - organization_id
          - space_id
          - chat_id
          - message_id
          - content_type
          - size_bytes
          - original_locator
          - status
          - failure_reason
          - text_chars
          - processed_at
        person:
          columns: [author_id]
      - name: chat_attachment_chunks
        personalColumns: [content]
        nonPersonalColumns: [attachment_id, chunk_index, metadata]
        person:
          excluded: >-
            Dokumentinhalt, den die Person selbst angehängt hat; das Verzeichnis steht in der
            Auskunft, das Original lädt sie selbst herunter
    storage: >-
      Anwendungsdatenbank (Text) und Ablage der Uploads, Dateisystem oder S3 (Original); der Text
      geht mit jeder Frage des Chats an das Sprachmodell (Datenfluss)
    retention:
      rule: >-
        Mit dem Chat, an dem der Anhang hängt (Löschung durch die Person, Bereinigung des Space,
        Löschung nach der Sperre des Kontos), oder vorher durch die Person einzeln. Ein Anhang, der
        nie mit einer Frage gesendet wurde, nach opaa.chat.attachments.unbound-retention
        (Voreinstellung 24 Stunden). Das Original verschwindet mit dem Anhang, spätestens mit der
        stündlichen Bereinigung
      settings: [opaa.chat.attachments.unbound-retention]
    visibility: [nur die Autorin oder der Autor]
    accessPaths: [UI, API, EXPORT, DATABASE, STORAGE]
    deletion: >-
      Durch die Person einzeln (Anhang löschen, auch unter „Meine Uploads“), mit dem Chat auf jedem
      seiner Löschwege, nach Ablauf der Frist für nie gesendete Anhänge, mit dem Space, dem Konto
      oder beim Entfernen des Personenbezugs; das Original entfernt die stündliche Bereinigung, sobald kein Anhang mehr darauf zeigt
    evaluations: >-
      Übersicht „Meine Uploads“ der Person über ihre eigenen Anhänge; keine Auswertung durch
      andere, weder Raum- noch Systemverwaltung sehen Anhänge. Kein Protokolleintrag zu Anhängen;
      ein Fund der Virenprüfung wird ohne Dateiname und Person protokolliert
    notes:
      - Anhänge können Inhalte aus Fachverfahren und Personendaten Dritter enthalten
      - >-
        Bis opaa.chat.attachments.inline-max-chars Zeichen je Chat geht der ganze Text an das
        Sprachmodell, darüber die zur Frage passenden Abschnitte bis
        opaa.chat.attachments.excerpt-max-chars Zeichen
      - >-
        Die Person kann einen Anhang mit einem Klick als gewöhnlichen Upload in eine Bibliothek
        übernehmen, in der sie bearbeiten darf; die Kopie folgt dann den Regeln der Bibliothek
      - Abschaltbar mit opaa.features.chat-upload.enabled; vorhandene Anhänge bleiben dann unberührt
  - id: chat-cleanup-holds
    title: Angehaltene Löschung der Chats eines gesperrten Kontos
    purpose: >-
      Hält die Löschung der Chats eines lokalen Kontos nach dessen Sperre befristet an, nur für
      einen Zweck aus fester Liste: behördliche oder gerichtliche Anordnung, Sicherung von
      Beweismitteln nach einem Sicherheitsvorfall, laufender Auskunfts- oder Löschantrag. Ein
      disziplinarischer, arbeitsrechtlicher oder leistungsbezogener Zweck ist nicht wählbar
    personalReference: EMPLOYEE
    tables:
      - name: chat_cleanup_holds
        personalColumns: [user_id, held_at, purpose, reason, held_until]
        nonPersonalColumns: [organization_id]
        person:
          columns: [user_id]
          excludedColumns:
            reason: >-
              Freitext der Verwaltung, der eine Anordnung oder ein Verfahren nennen kann, über das
              die Person noch nicht unterrichtet werden darf; Zweck, Beginn und Ende stehen in der
              Auskunft
      - name: chat_cleanup_hold_requests
        personalColumns: [user_id, purpose, reason, requested_by_user_id, requested_at]
        nonPersonalColumns: [organization_id]
        person:
          columns: [user_id, requested_by_user_id]
          excludedColumns:
            purpose: >-
              Ein Antrag hält nichts an; Stellung, Freigabe und Ablehnung stehen mit Zweck im
              Protokollteil der Selbstauskunft
            reason: Freitext wie bei der Anhaltung, nicht Teil der Auskunft
            requested_at: Zeitpunkt der Stellung steht im Protokollteil der Selbstauskunft
    storage: Anwendungsdatenbank
    retention:
      rule: >-
        Ein Antrag bis zur Freigabe oder Ablehnung durch die Systemverwaltung, unbeantwortet
        höchstens 14 Tage; eine Anhaltung bis zu ihrem Ende nach höchstens
        opaa.chat.locked-account-cleanup.hold-max-days Tagen ab Freigabe, bis die Verwaltung sie
        vorher aufhebt oder das Konto gelöscht wird. Weiter geht es nur mit neuem Antrag und neuer
        Freigabe
      settings: [opaa.chat.locked-account-cleanup.hold-max-days]
    visibility: [SYSTEM_ADMIN in der Einzelansicht des Kontos]
    accessPaths: [UI, API, EXPORT, DATABASE]
    deletion: >-
      Ablehnen oder Zurückziehen des Antrags, Ablauf der Anhaltung im nächtlichen Lauf, Aufheben
      durch die Systemverwaltung („Löschung fortsetzen“), mit dem Konto oder eine beendete
      Anhaltung beim Entfernen des Personenbezugs (eine laufende oder beantragte hält es auf); ein Antrag auch mit
      dem Konto der beantragenden Person
    evaluations: >-
      Ob, seit wann, bis wann und zu welchem Zweck die Löschung für ein Konto angehalten ist, mit
      Begründung, nur in der Einzelansicht des Kontos. Keine Liste, kein Filter und kein Export der
      angehaltenen Konten in der Oberfläche. Zahl der Anhaltungen je Kalendermonat sowie der
      Anträge, Freigaben, Verlängerungen, Ablehnungen und Abläufe je Zweck und Kalendermonat ohne
      Person, in der Auskunft über die Datenerhebung an die Personalvertretung. Die betroffene
      Person sieht Beginn, Ende und Zweck in ihrer Selbstauskunft, die Begründung nicht
    notes:
      - >-
        Vier-Augen-Prinzip: Eine Person der Systemverwaltung beantragt mit Zweck und Begründung,
        eine zweite, andere gibt frei; erst mit der Freigabe greift die Anhaltung. Ein Antrag
        allein hält nichts an. Aufheben und Ablehnen darf eine Person allein
      - >-
        Anhaltungen aus der Zeit vor der Freigabe im Vier-Augen-Prinzip haben weder Zweck noch
        Begründung; der erste nächtliche Lauf nach dem Update gibt ihnen das Ende nach der
        Höchstdauer, danach laufen sie wie jede andere ab
  - id: transcription-vocabularies
    title: Persönliche Begriffsliste der Spracheingabe
    purpose: >-
      Bessere Erkennung eigener Fachbegriffe, Namen und Abkürzungen beim Diktat; die Liste geht mit
      jeder Aufnahme der Person als Prompt an den Transkriptions-Endpunkt
    personalReference: IDENTIFIABLE
    tables:
      - name: transcription_vocabularies
        personalColumns: [user_id, vocabulary, updated_at]
        nonPersonalColumns: [organization_id]
        person:
          columns: [user_id]
    storage: Anwendungsdatenbank
    retention:
      rule: Bis die Person die Liste leert oder das Konto gelöscht wird
      settings: []
    visibility: [nur die Person selbst]
    accessPaths: [UI, API, EXPORT, DATABASE]
    deletion: Durch die Person (Liste leeren), mit dem Konto oder beim Entfernen des Personenbezugs
    evaluations: Keine; weder protokolliert noch gezählt
    notes:
      - Von der Person selbst gepflegt; die Verwaltung sieht die Liste nicht
  - id: agent-run-logs
    title: Schritt- und Sandboxprotokoll der Agentenläufe
    purpose: >-
      Fehlersuche in Agentenläufen: welches Werkzeug ein Schritt mit welchem Ergebnis und welcher
      Dauer lief, und wie viele Skripte, Dateien und Bytes eine Sandbox hatte
    personalReference: EMPLOYEE
    tables:
      - name: agent_step_log
        personalColumns: [run_id, recorded_at]
        nonPersonalColumns:
          [step_index, organization_id, tool, status, hit_count, duration_ms, abort_reason]
        person:
          excluded: >-
            Kein Konto, keine Suchanfrage; der Lauf ist nur über die Laufkennung im Chat seines
            Autors einer Person zuzuordnen
      - name: agent_sandbox_log
        personalColumns: [run_id, recorded_at]
        nonPersonalColumns:
          - session_ref
          - organization_id
          - tool
          - status
          - script_runs
          - duration_ms
          - file_count
          - file_bytes
          - abort_reason
        person:
          excluded: >-
            Kein Konto, kein Skript, kein Dateiinhalt; der Lauf ist nur über die Laufkennung im
            Chat seines Autors einer Person zuzuordnen
    storage: Anwendungsdatenbank, nur anfügend, Tagespartitionen
    retention:
      rule: >-
        Voreinstellung 7 Tage, einstellbar 1 bis 30 Tage; das Sandboxprotokoll nie länger als das
        Schrittprotokoll
      settings:
        - agent_run_log_retention_settings.step_log_retention_days
        - agent_run_log_retention_settings.sandbox_log_retention_days
    visibility: [SYSTEM_ADMIN mit Laufkennung und Begründung]
    accessPaths: [API, DATABASE]
    deletion: Täglicher Lauf verwirft abgelaufene Tagespartitionen; nicht abschaltbar
    evaluations: >-
      In der Anwendung keine: kein Personenfilter, keine Liste der Läufe, kein Export, nur ein Lauf
      je Abruf. Über die Datenbank lässt sich die Laufkennung mit chat_messages.agent_run verbinden;
      das ergäbe für höchstens 30 Tage, welche Werkzeuge die Autorin oder der Autor eines Chats wann
      und wie lange genutzt hat
    notes:
      - Jeder Abruf, auch ein verweigerter oder gescheiterter, steht als AUDIT_LOG_ACCESSED im
        Revisionsprotokoll
      - Ein fremder Lauf antwortet wie ein unbekannter
nonPersonalTables:
