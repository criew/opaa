title: Ausgehende Datenflüsse
# One entry per id of @io.opaa.compliance.DataFlow; ComplianceManifestTest holds both sides equal.
dataFlows:
  - id: chat-model
    group: MODEL
    viaOutboundProxy: true
    target: >-
      Das systemweit aktive Chat-Modell, ein OpenAI-kompatibler Endpunkt, den die Installation
      festlegt und die Systemverwaltung später wechseln kann
    data: >-
      Frage und Gesprächsverlauf, die gefundenen Textstellen aus den Bibliotheken samt Titeln und
      System-Prompt; Chatinhalte für Titel und Notizen; Dokumenttext für die modellgestützte
      Metadatenextraktion
    trigger: >-
      Jede Chat-Anfrage, Zerlegung einer Suchanfrage, Chattitel und -notiz, Metadatenextraktion beim
      Indizieren, Statusprüfung des Modells; endet eine gestreamte Antwort ohne ersten Teil oder
      lehnt das Modell die gestreamte Anfrage ab (nicht bei Netz-, Anmelde-, Last- oder
      Serverfehlern), geht dieselbe Anfrage einmal ohne Streaming erneut an das Modell
    switchOff: >-
      Nicht abschaltbar, der Chat braucht ein Modell. Das erste Ziel legt der Schritt Chat-Modell der
      Installation fest, im Helm-Chart über bootstrap.chatModel in der Antwortdatei; danach bestimmt
      es die Systemverwaltung. Wird der Schritt übersprungen, gibt es bis zum Eintrag in der
      Modellverwaltung kein Ziel. Eine Voreinstellung (lokaler Modellserver) gibt es nur im
      Entwicklungsprofil
    settings:
      [llm_models.base_url, llm_models.model_identifier, opaa.query.query-decomposition-enabled,
      installation_steps.payload]
  - id: embedding-model
    group: MODEL
    viaOutboundProxy: true
    target: >-
      Der Einbettungs-Endpunkt (OpenAI-kompatibel), den die Installation festlegt und die
      Systemverwaltung später wechseln kann
    data: >-
      Textabschnitte der indizierten Dokumente, Suchanfragen, Prüftexte der Statusanzeige, feste
      Probetexte der Probeeinbettung und des Referenzankers und künstliche Texte der
      Durchsatzprobe; ein Entwurf eines neuen Modells bekommt vor der Bestätigung nur Probetexte
      und künstliche Texte
    trigger: >-
      Indizierung, Neueinbettung nach einem Modellwechsel und Nachfüllen nach einem Verwerfen,
      jede Suche und jede Chat-Anfrage, Statusprüfung, Probeeinbettung bei der Installation, bei
      Modell- und Endpunktwechsel, Erhebung eines fehlenden Referenzankers
    switchOff: >-
      Nicht abschaltbar, die Suche braucht Einbettungen; das Ziel legt die Installation fest,
      wechseln kann es die Systemverwaltung (Modell- oder Endpunktwechsel)
    settings: [embedding_model.base_url, embedding_model.model_identifier]
  - id: rerank-model
    group: MODEL
    viaOutboundProxy: true
    target: >-
      Der Rerank-Endpunkt, den die Systemverwaltung in der Modellverwaltung hinterlegt, und im
      Installationsassistenten der Endpunkt, den die einrichtende Person angibt
    data: >-
      Suchanfrage und die Kandidaten-Textstellen; beim Verbindungstest der Verwaltung und bei der
      Prüfung im Assistenten eine feste Probe ohne Inhalte
    trigger: >-
      Jede Suche und Chat-Anfrage bei eingeschaltetem Reranking, Statusprüfung, Verbindungstest in
      der Modellverwaltung; im Installationsassistenten die Prüfung des Schritts Rerank-Modell, nur
      mit dem Installations-Token oder beim Start aus der Antwortdatei, vor dem Abschluss
    switchOff: >-
      Abschaltbar in der Modellverwaltung, Voreinstellung aus; der Abschluss der Installation
      schaltet das Reranking nur ein, wenn der Schritt Rerank-Modell geprüft und nicht übersprungen
      ist
    settings: [rerank_model.enabled, rerank_model.base_url, installation_steps.payload]
  - id: transcription-model
    group: MODEL
    viaOutboundProxy: true
    target: >-
      Der Transkriptions-Endpunkt, den die Systemverwaltung in der Modellverwaltung hinterlegt, und
      im Installationsassistenten der Endpunkt, den die einrichtende Person angibt
    data: >-
      Die Sprachaufnahme einer Person, dazu als Prompt die Begriffsliste der Installation und die
      persönliche Begriffsliste der Person, soweit hinterlegt; Statusprüfung, Verbindungstest und
      die Prüfung im Assistenten fragen nur die Modellliste ab
    trigger: >-
      Spracheingabe im Chat, Statusprüfung, Verbindungstest in der Modellverwaltung; im
      Installationsassistenten die Prüfung des Schritts Transkriptionsmodell, nur mit dem
      Installations-Token oder beim Start aus der Antwortdatei, vor dem Abschluss
    switchOff: >-
      Abschaltbar in der Modellverwaltung, Voreinstellung aus; zusätzlich über das Feature-Flag der
      Spracheingabe, das auch den Schritt im Assistenten ausblendet. Der Abschluss der Installation
      schaltet die Spracheingabe nur ein, wenn die Person mit dem Installations-Token den Schritt
      Transkriptionsmodell geprüft und nicht übersprungen hat; sie legt damit das Ziel der Aufnahmen
      fest
    settings:
      [transcription_model.enabled, transcription_model.base_url, opaa.features.speech-input.enabled,
      installation_steps.payload]
  - id: transcription-realtime
    group: MODEL
    viaOutboundProxy: true
    target: >-
      Der Live-Dienst (WebSocket, Protokoll OpenAI, vLLM oder Mistral), den die Systemverwaltung in
      der Modellverwaltung hinterlegt, und im Installationsassistenten der Dienst, den die
      einrichtende Person angibt
    data: >-
      Die Sprachaufnahme einer Person fortlaufend während des Diktats, als PCM-Audio, dazu Sprache
      und die Begriffslisten der Installation und der Person, soweit hinterlegt;
      Statusprüfung, Verbindungstest und die Prüfung im Assistenten eröffnen nur eine Sitzung ohne
      Audio
    trigger: >-
      Spracheingabe im Chat mit Live-Transkript, Statusprüfung (beim Start, nach jeder Änderung und
      höchstens einmal je Minute von einer Instanz), Verbindungstest in der Modellverwaltung; im
      Installationsassistenten die Prüfung des Schritts Transkriptionsmodell, nur mit dem
      Installations-Token oder beim Start aus der Antwortdatei, vor dem Abschluss
    switchOff: >-
      Ohne Live-Dienst in der Modellverwaltung (Voreinstellung) findet er nicht statt; er setzt
      die eingeschaltete Spracheingabe voraus und endet mit ihr und mit dem Feature-Flag der
      Spracheingabe
    settings:
      [transcription_model.realtime_protocol, transcription_model.realtime_url,
      transcription_model.enabled, opaa.features.speech-input.enabled, installation_steps.payload]
  - id: text-recognition-model
    group: MODEL
    viaOutboundProxy: true
    target: >-
      Der Texterkennungsdienst, den die Systemverwaltung in der Modellverwaltung hinterlegt, und im
      Installationsassistenten der Dienst, den die einrichtende Person angibt: ein docling-serve,
      etwa der mitgelieferte Container, oder ein OpenAI-kompatibles Vision-Modell
    data: >-
      Ganze Seiten gescannter PDF-Dokumente der Bibliotheken, als PDF (docling-serve) oder als
      Seitenbild (Vision-Modell), mit allem, was darauf steht; Verbindungstest nur die mitgelieferte
      Testseite ohne Inhalte, Statusprüfung nur die Abfrage von Zustand und Schlüssel (docling-serve)
      oder der Modellliste
    trigger: >-
      Indizierung eines gescannten PDF-Dokuments ohne Textebene, auch das Nachholen wartender Scans
      hochgeladener Dokumente im Takt opaa.ocr.catch-up-interval (Voreinstellung fünf Minuten,
      mindestens 20 Sekunden), solange die Texterkennung eingeschaltet ist, höchstens
      opaa.ocr.max-pages-per-run Seiten je Lauf oder Durchgang; nie bei einer Neuindizierung
      unveränderter Dokumente, die den gespeicherten Erkennungsstand nutzt; Statusprüfung und
      Verbindungstest in der Modellverwaltung ohne Dokumentseiten; im Installationsassistenten die
      Prüfung des Schritts Texterkennung mit der Testseite, nur mit dem Installations-Token oder
      beim Start aus der Antwortdatei, vor dem Abschluss
    switchOff: >-
      Zweistufig, beide Stufen Voreinstellung aus: der Betriebsschalter opaa.ocr.enabled, ohne den
      die Rolle weder ausgewertet noch kontaktiert wird, und der Schalter der Rolle in der
      Modellverwaltung. Der Abschluss der Installation schaltet die Rolle nur ein, wenn der Schritt
      Texterkennung geprüft und nicht übersprungen ist
    settings:
      [opaa.ocr.enabled, opaa.ocr.catch-up-interval, opaa.ocr.max-pages-per-run,
      text_recognition_model.enabled, text_recognition_model.connection_type,
      text_recognition_model.base_url, installation_steps.payload]
  - id: model-endpoint
    group: MODEL
    viaOutboundProxy: true
    target: >-
      Die Adresse eines Chat-Modells, die die Systemverwaltung im Formular angibt, und im
      Installationsassistenten die Adresse von Chat-, Embedding-, Rerank- oder
      Transkriptionsmodell, die die einrichtende Person angibt
    data: >-
      Abruf der angebotenen Modelle, eine Testanfrage von einem Token; der hinterlegte API-Schlüssel
      nur an die Herkunft des eigenen Modells, ein im Assistenten gespeicherter nur an dieselbe
      Adresse. Keine personenbezogenen Daten
    trigger: >-
      Modellauswahl und Verbindungstest in der Verwaltung der Chat-Modelle; im
      Installationsassistenten der Modellabruf in den Schritten Chat-, Embedding-, Rerank- und
      Transkriptionsmodell (beim Verlassen von Adresse oder Schlüssel, auf „Modelle abrufen“ und
      beim Öffnen eines gespeicherten Modellschritts) und die Prüfung des Chat-Modells, nur mit dem
      Installations-Token oder beim Start aus der Antwortdatei, vor dem Abschluss
    switchOff: >-
      Findet nur auf Handlung der Systemverwaltung oder der Person mit dem Installations-Token
      statt, im Assistenten auch beim Öffnen eines gespeicherten Modellschritts; nach dem Abschluss
      der Installation gibt es den Abruf des Assistenten nicht mehr
    settings: [llm_models.base_url, installation_steps.payload]
  - id: source-web
    group: CONNECTOR
    viaOutboundProxy: true
    target: Webserver mit Verzeichnisauflistung, die eine Bibliothek als Quelle nennt
    data: Abrufanfragen und die Zugangsdaten der Bibliothek; Inhalte gehen nicht hinaus
    trigger: Indizierungslauf (manuell, Zeitplan), Verbindungstest
    switchOff: Je Bibliothek, durch Ausschalten des Zeitplans oder Löschen der Bibliothek
    settings: [knowledge_libraries.source_url, knowledge_libraries.schedule_enabled]
  - id: source-rss
    group: CONNECTOR
    viaOutboundProxy: true
    target: RSS- und Atom-Feeds und die verlinkten Detailseiten
    data: Abrufanfragen und die Zugangsdaten der Bibliothek; Inhalte gehen nicht hinaus
    trigger: Indizierungslauf (manuell, Zeitplan), Verbindungstest
    switchOff: Je Bibliothek, durch Ausschalten des Zeitplans oder Löschen der Bibliothek
    settings: [knowledge_libraries.source_url, knowledge_libraries.schedule_enabled]
  - id: source-confluence
    group: CONNECTOR
    viaOutboundProxy: true
    target: Confluence (Cloud oder Data Center) des Zugangs bzw. der Bibliothek
    data: >-
      API-Anfragen mit Zugangsdaten oder Token des Zugangs; Inhalte gehen nicht hinaus
    trigger: Indizierungslauf, Benachrichtigung der Quelle, Verbindungstest, Original öffnen
    switchOff: Je Bibliothek, durch Ausschalten des Zeitplans oder Löschen der Bibliothek
    settings:
      - connection_profiles.server_url
      - knowledge_libraries.source_url
      - knowledge_libraries.schedule_enabled
  - id: source-dropbox
    group: CONNECTOR
    viaOutboundProxy: true
    target: Die Dropbox-API (api.dropboxapi.com, content.dropboxapi.com)
    data: >-
      API-Anfragen mit dem Token des Zugangs; bei einer Team-App ein Token des ganzen Teams, mit
      dem OPAA als zustimmende Team-Administration Team-Ordner liest und die Namespaces des Teams
      auflistet; Inhalte gehen nicht hinaus
    trigger: Indizierungslauf, Verbindungstest, Ordnerauswahl, Original öffnen
    switchOff: Je Bibliothek, durch Ausschalten des Zeitplans oder Löschen der Bibliothek
    settings:
      - opaa.indexing.dropbox.api-base
      - opaa.indexing.dropbox.content-base
      - knowledge_libraries.schedule_enabled
    notes:
      - >-
        Über eine Team-App liest eine Bibliothek Team-Ordner, auch solche, die kein einzelnes
        Mitgliedskonto sieht; wer die Bibliothek lesen darf, liest deren Inhalt. Mitgliederordner,
        geteilte Ordner und App-Ordner liest OPAA nicht und bietet sie nicht zur Auswahl an
      - >-
        Das Token einer Team-App erlaubt Dropbox-seitig mehr, als OPAA nutzt: Es könnte im Namen
        jedes Mitglieds dessen Ordner lesen. OPAA hält es verschlüsselt, schickt es nur an die
        Dropbox-API und widerruft es beim Trennen
  - id: source-google-drive
    group: CONNECTOR
    viaOutboundProxy: true
    target: Die Google-Drive-API (www.googleapis.com)
    data: API-Anfragen mit dem Token des Zugangs oder Dienstkontos; Inhalte gehen nicht hinaus
    trigger: Indizierungslauf, Verbindungstest, Original öffnen
    switchOff: Je Bibliothek, durch Ausschalten des Zeitplans oder Löschen der Bibliothek
    settings: [knowledge_libraries.schedule_enabled]
  - id: source-nextcloud
    group: CONNECTOR
    viaOutboundProxy: true
    target: Der Nextcloud-Server des Zugangs (WebDAV)
    data: WebDAV-Anfragen mit den Zugangsdaten; Inhalte gehen nicht hinaus
    trigger: Indizierungslauf, Verbindungstest, Original öffnen
    switchOff: Je Bibliothek, durch Ausschalten des Zeitplans oder Löschen der Bibliothek
    settings: [connection_profiles.server_url, knowledge_libraries.schedule_enabled]
  - id: source-sharepoint
    group: CONNECTOR
    viaOutboundProxy: true
    target: Microsoft Graph (graph.microsoft.com) und die Anmeldung bei login.microsoftonline.com
    data: API-Anfragen mit dem Token des Zugangs; Inhalte gehen nicht hinaus
    trigger: Indizierungslauf, Ordnerauswahl, Verbindungstest, Original öffnen
    switchOff: Je Bibliothek, durch Ausschalten des Zeitplans oder Löschen der Bibliothek
    settings: [connection_profiles.tenant, knowledge_libraries.schedule_enabled]
  - id: source-onedrive
    group: CONNECTOR
    viaOutboundProxy: true
    target: >-
      Microsoft Graph (graph.microsoft.com) und die Anmeldung der Person bei
      login.microsoftonline.com
    data: >-
      API-Anfragen mit dem Token des verbundenen Kontos der Person, das nur ihr eigenes OneDrive
      liest; Inhalte gehen nicht hinaus
    trigger: Indizierungslauf, Ordnerauswahl, Verbindungstest, Konto verbinden, Original öffnen
    switchOff: >-
      Je private Bibliothek, durch Ausschalten des Zeitplans, Trennen des Kontos oder Löschen der
      Bibliothek
    settings: [connection_profiles.tenant, knowledge_libraries.schedule_enabled]
  - id: source-s3
    group: CONNECTOR
    viaOutboundProxy: true
    target: Der S3-kompatible Objektspeicher, den die Bibliothek nennt
    data: Signierte Anfragen mit den Zugangsdaten; Inhalte gehen nicht hinaus
    trigger: Indizierungslauf, Verbindungstest, Original öffnen
    switchOff: Je Bibliothek, durch Ausschalten des Zeitplans oder Löschen der Bibliothek
    settings: [knowledge_libraries.source_url, knowledge_libraries.schedule_enabled]
  - id: source-smb
    group: CONNECTOR
    viaOutboundProxy: false
    target: Die SMB-Freigabe, die die Bibliothek nennt
    data: SMB-Anmeldung und Leseanfragen; Inhalte gehen nicht hinaus
    trigger: Indizierungslauf, Verbindungstest, Original öffnen
    switchOff: Je Bibliothek, durch Ausschalten des Zeitplans oder Löschen der Bibliothek
    settings: [knowledge_libraries.source_url, knowledge_libraries.schedule_enabled]
  - id: source-original
    group: CONNECTOR
    viaOutboundProxy: true
    target: Der Webserver bzw. Feed, aus dem ein Dokument einer Web- oder RSS-Bibliothek stammt
    data: Abruf des Originals mit den Zugangsdaten der Bibliothek
    trigger: Eine Person öffnet das Original eines solchen Dokuments
    switchOff: Findet nur auf Handlung einer berechtigten Person statt
    settings: [knowledge_libraries.source_url]
  - id: source-attachment
    group: CONNECTOR
    viaOutboundProxy: true
    target: Die Ziele der Anhänge, die ein Feed-Eintrag verlinkt
    data: Abrufanfragen; die Zugangsdaten nur an die Herkunft des Feeds
    trigger: Indizierungslauf einer RSS-Bibliothek
    switchOff: Über das Anlagenprofil der Bibliothek und die Höchstzahl der Anhänge je Eintrag
    settings: [knowledge_libraries.source_settings, opaa.indexing.rss.max-attachments-per-entry]
  - id: service-account-token
    group: CONNECTOR
    viaOutboundProxy: true
    target: Der Token-Endpunkt des Anbieters eines Dienstkontos (Google Drive)
    data: Eine mit dem Dienstkontoschlüssel signierte Anforderung eines Zugriffstokens
    trigger: Vor Anfragen eines Laufs oder Tests, höchstens etwa einmal je Stunde
    switchOff: Entfällt ohne Zugang mit Dienstkonto
    settings: [connection_profiles.auth_method]
  - id: connection-oauth
    group: CONNECTOR
    viaOutboundProxy: true
    target: Der Autorisierungsserver eines Zugangs (OAuth)
    data: >-
      Client-Kennung und -Geheimnis, Autorisierungscode, Erneuerungs- und Widerrufsanfragen der
      Tokens
    trigger: Verbinden eines Kontos, Erneuerung eines Tokens, Trennen
    switchOff: Entfällt ohne Zugang mit OAuth
    settings: [connection_profiles.server_url, connection_profiles.auth_method]
  - id: mcp-discovery
    group: CONNECTOR
    viaOutboundProxy: true
    target: Ein externer MCP-Server und sein Autorisierungsserver
    data: Abruf der veröffentlichten Metadaten (RFC 9728, RFC 8414)
    trigger: Speichern eines MCP-Server-Profils durch die Systemverwaltung
    switchOff: Findet nur auf Handlung der Systemverwaltung statt
    settings: [connection_profiles.server_url]
  - id: oidc-provider
    group: IDENTITY
    viaOutboundProxy: true
    target: >-
      Die Identitätsanbieter (OIDC), die die Systemverwaltung einträgt, und im
      Installationsassistenten der Anbieter, den die einrichtende Person angibt
    data: Abruf des Discovery-Dokuments und der Signaturschlüssel
    trigger: >-
      Anmeldung über den Anbieter, Verbindungstest in der Verwaltung; im Installationsassistenten
      die Prüfung des Schritts Anmeldeverfahren, nur mit dem Installations-Token oder beim Start
      aus der Antwortdatei, vor dem Abschluss
    switchOff: Je Anbieter abschaltbar; ohne Anbieter nur lokale Anmeldung
    settings:
      [oidc_providers.enabled, oidc_providers.issuer_uri, oidc_providers.jwk_set_uri,
      installation_steps.payload]
  - id: directory-sync
    group: IDENTITY
    viaOutboundProxy: true
    target: Die Admin-Schnittstelle des Verzeichnisses (Keycloak)
    data: Anmeldung des Dienstkontos, Abruf von Gruppen, Mitgliedschaften und Konten
    trigger: Zeitplan des Verzeichnisabgleichs, manueller Abgleich
    switchOff: Je Anbieter abschaltbar; der Takt global
    settings:
      - oidc_providers.directory_sync_enabled
      - directory_connectors.base_url
      - opaa.directory-sync.schedule-enabled
  - id: mail
    group: MAIL
    viaOutboundProxy: false
    target: >-
      Der Mailserver (SMTP), den die Systemverwaltung einträgt, und im Installationsassistenten der
      Mailserver, den die einrichtende Person angibt
    data: >-
      E-Mail-Adresse und Name der Empfängerin oder des Empfängers (bei der Bestätigung einer
      Selbstregistrierung ohne Namen), Inhalt der Benachrichtigung (Einladung, Kennwort,
      Zugangslinks, Sperre mit Sperrgrund und bei einer Sperre durch die Systemverwaltung Hinweis auf
      die Löschung der Chats, Freischaltung, Ablaufdatum des Kontos, Kontoübergabe, Zeitpunkt einer
      gestarteten Selbstauskunft, Zeitpunkt der Anmeldung des Bootstrap-Kontos, Name des erzeugten
      oder ablaufenden Zugangstokens, Name der Bibliothek bei einer ablaufenden Freigabe, bei den
      Erinnerungen zu einem Dienstkonto dessen Name, Name des ablaufenden Tokens oder der
      Bibliothek, deren Zustimmung endet, und das Ablaufdatum, bei der Erinnerung an die Prüfung
      der Zugänge nur deren Anzahl, Testmail); bei der Prüfung im
      Assistenten nur Verbindungsaufbau und Anmeldung, eine Testmail nur an die dort angegebene
      Adresse
    trigger: >-
      Einladung und Kennwortvorgänge lokaler Konten, Bestätigung einer Selbstregistrierung, Sperre
      durch die Systemverwaltung oder wegen Inaktivität und Freischaltung, bevorstehender Ablauf
      eines Kontos, angefragte und erfolgte Kontoübergabe, Erinnerung der Systemverwaltung an die
      Prüfung der Zugänge, Anmeldung des Bootstrap-Kontos der Systemverwaltung, ablaufende Freigaben
      für externe KI-Werkzeuge, erzeugte und ablaufende Zugangstokens, bevorstehender Ablauf eines
      Tokens eines Dienstkontos oder der Zustimmung einer Bibliothek zu ihm (an die verantwortliche
      Person und die Systemverwaltung), Start einer Selbstauskunft, Testmail; im
      Installationsassistenten die Prüfung des Schritts E-Mail-Versand, nur mit dem
      Installations-Token oder beim Start aus der Antwortdatei, vor dem Abschluss
    switchOff: >-
      Abschaltbar, Voreinstellung aus; der Abschluss der Installation schaltet den Versand nur ein,
      wenn der Schritt E-Mail-Versand geprüft und nicht übersprungen ist
    settings: [mail_settings.enabled, mail_settings.host, installation_steps.payload]
  - id: original-store
    group: STORAGE
    viaOutboundProxy: false
    target: Der S3-kompatible Objektspeicher der Originalablage
    data: Die hochgeladenen Originaldateien
    trigger: Upload, Öffnen und Löschen eines Originals
    switchOff: >-
      Nur bei Ablage in S3; Voreinstellung der Anwendung ist das Dateisystem, das Helm-Chart setzt
      S3 voreingestellt
    settings: [opaa.upload.store, opaa.upload.s3.endpoint]
  - id: malware-scanner
    group: SECURITY
    viaOutboundProxy: false
    target: >-
      Der Virenscanner (clamd), den der Betrieb stellt und die Systemverwaltung oder der
      Installationsassistent einträgt, meist im eigenen Netz
    data: >-
      Der vollständige Inhalt jeder Datei, die eine Bibliothek oder ein Chat aufnehmen soll
      (Upload, Datei einer Quelle, Anhang), ohne Dateiname, Bibliothek oder Person; bei der Prüfung
      der Verbindung nur die Frage nach der Version
    trigger: Jede Aufnahme einer Datei bei eingeschalteter Virenprüfung
    switchOff: Abschaltbar, Voreinstellung aus
    settings: [malware_scan_settings.enabled, malware_scan_settings.host]
  - id: siem-export
    group: SECURITY
    viaOutboundProxy: false
    target: Das zentrale Sicherheitsmonitoring (SIEM) der Behörde, ein Syslog-Empfänger
    data: >-
      Je Eintrag des Revisionsprotokolls Ereignisart, Zeitpunkt, Ergebnis, Organisation, Art und
      Kennung des betroffenen Objekts und die Version des Ereigniskatalogs, den Namen des Objekts
      nur auf eigenen Schalter; keine Pseudonyme
      handelnder oder betroffener Personen, keine Begründung und keine Inhalte. Bei einem Konto,
      einem Zugangstoken, dem persönlichen Bereich, einer privaten Bibliothek und einem privaten
      Prompt weder Kennung noch Name. Dazu ein Hinweis auf jede Lücke durch Abschalten oder die
      Aufbewahrungsfrist
    trigger: Laufend, alle 30 Sekunden, ab dem Einschalten
    switchOff: Abschaltbar, Voreinstellung aus
    settings: [opaa.siem-export.enabled, opaa.siem-export.host, opaa.siem-export.tls, opaa.siem-export.include-labels]
  - id: code-sandbox
    group: SECURITY
    viaOutboundProxy: false
    target: >-
      Der Sandbox-Dienst des Betriebs (OpenSandbox-Server) neben dem Backend, der je Agentenlauf
      einen Container ohne Netz startet und am Ende des Laufs löscht
    data: >-
      Die Python-Skripte, die das Chat-Modell im Werkzeug run_code schreibt, mit den Inhalten, die
      es aus den gefundenen Textstellen übernimmt; beim Werkzeug fill_template die DOCX-Datei einer
      Dokumentvorlage, die die fragende Person lesen darf, und die Werte, die das Chat-Modell für
      ihre Platzhalter liefert, gefüllt von einem festen Skript des Images. Zurück kommen Ausgaben
      und die erzeugten Dateien, die als Anhang der fragenden Person an die Antwort gehen. Keine
      Kontokennung, kein Zugriff auf Index, Datenbank oder Dateiablage
    trigger: >-
      Ein Werkzeugaufruf run_code oder fill_template eines Agenten, dem das Werkzeug zugeordnet und
      eingeschaltet ist; fill_template zusätzlich nur bei eingeschaltetem Schalter „Vorlagen“
    switchOff: Abschaltbar, Voreinstellung aus; eingeschaltet ohne Adresse oder Schlüssel bricht der Start ab
    settings: [opaa.sandbox.enabled, opaa.sandbox.base-url]
  - id: trace-export
    group: OPERATIONS
    viaOutboundProxy: true
    target: >-
      Der Trace-Collector des Betriebs (OpenTelemetry, OTLP/HTTP), meist im eigenen Netz; ist ein
      Ausgangsproxy eingestellt, geht die Verbindung über ihn, außer die Adresse steht in seinen
      Ausnahmen
    data: >-
      Je erfasster Anfrage und Hintergrundaufgabe Spans mit Zeitpunkt, Dauer, Trace- und Span-ID und
      nur den freigegebenen Merkmalen: Methode, Routenvorlage ohne Kennungen und Suchparameter,
      Status, Ergebnisklasse, Fehlerklasse, Zieldienst, Modell, Tokenzahlen. Keine Adresse mit Pfad
      oder Abfrage, kein Konto, keine Anmeldedaten, kein SQL, keine Frage, Antwort, Suchtext oder
      Fehlermeldung. Ein Trace endet an der Installation: Kein ausgehender Aufruf an Modelle,
      Quellen oder Mailserver trägt einen Kopf traceparent, auch nicht bei eingeschaltetem Tracing,
      und ein mitgeschickter traceparent eines Aufrufers wird verworfen
    trigger: >-
      Jede Anfrage und Hintergrundaufgabe, die die Stichprobe trifft (Voreinstellung 5 Prozent),
      gezogen über eine Trace-ID, die OPAA selbst erzeugt; der Aufruf zum Rundgang-Hinweis nie
    switchOff: Abschaltbar, Voreinstellung aus; eingeschaltet ohne Adresse bricht der Start ab
    settings:
      - management.tracing.export.enabled
      - management.opentelemetry.tracing.export.otlp.endpoint
      - management.tracing.sampling.probability
settings:
  - key: management.tracing.export.enabled
    source: PROPERTY
    defaultValue: "false"
    effect: Ob Traces an den Trace-Collector des Betriebs gehen
    bearings: [DATA_FLOW]
    helm:
      values: tracing.enabled
      defaultValue: "false"
  - key: management.opentelemetry.tracing.export.otlp.endpoint
    source: PROPERTY
    defaultValue: ""
    effect: Adresse des Trace-Collectors; Pflicht bei eingeschaltetem Tracing
    bearings: [DATA_FLOW]
    helm:
      values: tracing.otlpEndpoint
      defaultValue: ""
  - key: management.tracing.sampling.probability
    source: PROPERTY
    defaultValue: "0.05"
    range: 0.0 bis 1.0
    effect: >-
      Anteil der Anfragen, die als Trace erfasst werden; bei 1.0 entsteht beim Collector ein
      lückenloses Ablaufprotokoll jeder Anfrage mit Zeitstempel
    bearings: [DATA, EVALUATION]
    helm:
      values: tracing.samplingProbability
      defaultValue: ""
