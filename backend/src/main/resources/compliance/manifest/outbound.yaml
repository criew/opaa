title: Ausgehende Datenflüsse
# One entry per id of @io.opaa.compliance.DataFlow; ComplianceManifestTest holds both sides equal.
dataFlows:
  - id: chat-model
    group: MODEL
    viaOutboundProxy: true
    target: Das systemweit aktive Chat-Modell, ein OpenAI-kompatibler Endpunkt der Systemverwaltung
    data: >-
      Frage und Gesprächsverlauf, die gefundenen Textstellen aus den Bibliotheken samt Titeln und
      System-Prompt; Chatinhalte für Titel und Notizen; Dokumenttext für die modellgestützte
      Metadatenextraktion
    trigger: >-
      Jede Chat-Anfrage, Zerlegung einer Suchanfrage, Chattitel und -notiz, Metadatenextraktion beim
      Indizieren, Statusprüfung des Modells
    switchOff: >-
      Nicht abschaltbar, der Chat braucht ein Modell; das Ziel bestimmt die Systemverwaltung.
      Voreinstellung der Anwendung ist ein lokaler Modellserver; das Helm-Chart hat keine
      Voreinstellung und verlangt die Adresse
    settings: [llm_models.base_url, llm_models.model_identifier, opaa.query.query-decomposition-enabled]
  - id: embedding-model
    group: MODEL
    viaOutboundProxy: true
    target: >-
      Der Einbettungs-Endpunkt (OpenAI-kompatibel), den die Installation festlegt und die
      Systemverwaltung später wechseln kann
    data: >-
      Textabschnitte der indizierten Dokumente, Suchanfragen, Prüftexte der Statusanzeige, feste
      Probetexte der Probeeinbettung und des Referenzankers und künstliche Texte der
      Durchsatzprobe; ein Entwurf eines neuen Modells bekommt vor der Bestätigung nur Probetexte
      und künstliche Texte
    trigger: >-
      Indizierung, Neueinbettung nach einem Modellwechsel und Nachfüllen nach einem Verwerfen,
      jede Suche und jede Chat-Anfrage, Statusprüfung, Probeeinbettung bei der Installation, bei
      Modell- und Endpunktwechsel, Erhebung eines fehlenden Referenzankers
    switchOff: >-
      Nicht abschaltbar, die Suche braucht Einbettungen; das Ziel legt die Installation fest,
      wechseln kann es die Systemverwaltung (Modell- oder Endpunktwechsel)
    settings: [embedding_model.base_url, embedding_model.model_identifier]
  - id: rerank-model
    group: MODEL
    viaOutboundProxy: true
    target: >-
      Der Rerank-Endpunkt, den die Systemverwaltung in der Modellverwaltung hinterlegt, und im
      Installationsassistenten der Endpunkt, den die einrichtende Person angibt
    data: >-
      Suchanfrage und die Kandidaten-Textstellen; beim Verbindungstest der Verwaltung und bei der
      Prüfung im Assistenten eine feste Probe ohne Inhalte
    trigger: >-
      Jede Suche und Chat-Anfrage bei eingeschaltetem Reranking, Statusprüfung, Verbindungstest in
      der Modellverwaltung; im Installationsassistenten die Prüfung des Schritts Rerank-Modell, nur
      mit dem Installations-Token und vor dem Abschluss
    switchOff: >-
      Abschaltbar in der Modellverwaltung, Voreinstellung aus; der Abschluss der Installation
      schaltet das Reranking nur ein, wenn der Schritt Rerank-Modell geprüft und nicht übersprungen
      ist
    settings: [rerank_model.enabled, rerank_model.base_url, installation_steps.payload]
  - id: transcription-model
    group: MODEL
    viaOutboundProxy: true
    target: >-
      Der Transkriptions-Endpunkt, den die Systemverwaltung in der Modellverwaltung hinterlegt, und
      im Installationsassistenten der Endpunkt, den die einrichtende Person angibt
    data: >-
      Die Sprachaufnahme einer Person; Statusprüfung, Verbindungstest und die Prüfung im Assistenten
      fragen nur die Modellliste ab
    trigger: >-
      Spracheingabe im Chat, Statusprüfung, Verbindungstest in der Modellverwaltung; im
      Installationsassistenten die Prüfung des Schritts Transkriptionsmodell, nur mit dem
      Installations-Token und vor dem Abschluss
    switchOff: >-
      Abschaltbar in der Modellverwaltung, Voreinstellung aus; zusätzlich über das Feature-Flag der
      Spracheingabe, das auch den Schritt im Assistenten ausblendet. Der Abschluss der Installation
      schaltet die Spracheingabe nur ein, wenn die Person mit dem Installations-Token den Schritt
      Transkriptionsmodell geprüft und nicht übersprungen hat; sie legt damit das Ziel der Aufnahmen
      fest
    settings:
      [transcription_model.enabled, transcription_model.base_url, opaa.features.speech-input.enabled,
      installation_steps.payload]
  - id: model-endpoint
    group: MODEL
    viaOutboundProxy: true
    target: >-
      Die Adresse eines Chat-Modells, die die Systemverwaltung im Formular angibt, und im
      Installationsassistenten die Adresse von Chat-, Embedding-, Rerank- oder
      Transkriptionsmodell, die die einrichtende Person angibt
    data: >-
      Abruf der angebotenen Modelle, eine Testanfrage von einem Token; der hinterlegte API-Schlüssel
      nur an die Herkunft des eigenen Modells, ein im Assistenten gespeicherter nur an dieselbe
      Adresse. Keine personenbezogenen Daten
    trigger: >-
      Modellauswahl und Verbindungstest in der Verwaltung der Chat-Modelle; im
      Installationsassistenten der Modellabruf in den Schritten Chat-, Embedding-, Rerank- und
      Transkriptionsmodell (beim Verlassen von Adresse oder Schlüssel, auf „Modelle abrufen“ und
      beim Öffnen eines gespeicherten Modellschritts) und die Prüfung des Chat-Modells, nur mit dem
      Installations-Token und vor dem Abschluss
    switchOff: >-
      Findet nur auf Handlung der Systemverwaltung oder der Person mit dem Installations-Token
      statt, im Assistenten auch beim Öffnen eines gespeicherten Modellschritts; nach dem Abschluss
      der Installation gibt es den Abruf des Assistenten nicht mehr
    settings: [llm_models.base_url, installation_steps.payload]
  - id: source-web
    group: CONNECTOR
    viaOutboundProxy: true
    target: Webserver mit Verzeichnisauflistung, die eine Bibliothek als Quelle nennt
    data: Abrufanfragen und die Zugangsdaten der Bibliothek; Inhalte gehen nicht hinaus
    trigger: Indizierungslauf (manuell, Zeitplan), Verbindungstest
    switchOff: Je Bibliothek, durch Ausschalten des Zeitplans oder Löschen der Bibliothek
    settings: [knowledge_libraries.source_url, knowledge_libraries.schedule_enabled]
  - id: source-rss
    group: CONNECTOR
    viaOutboundProxy: true
    target: RSS- und Atom-Feeds und die verlinkten Detailseiten
    data: Abrufanfragen und die Zugangsdaten der Bibliothek; Inhalte gehen nicht hinaus
    trigger: Indizierungslauf (manuell, Zeitplan), Verbindungstest
    switchOff: Je Bibliothek, durch Ausschalten des Zeitplans oder Löschen der Bibliothek
    settings: [knowledge_libraries.source_url, knowledge_libraries.schedule_enabled]
  - id: source-confluence
    group: CONNECTOR
    viaOutboundProxy: true
    target: Confluence (Cloud oder Data Center) des Zugangs bzw. der Bibliothek
    data: >-
      API-Anfragen mit Zugangsdaten oder Token des Zugangs; Inhalte gehen nicht hinaus
    trigger: Indizierungslauf, Benachrichtigung der Quelle, Verbindungstest, Original öffnen
    switchOff: Je Bibliothek, durch Ausschalten des Zeitplans oder Löschen der Bibliothek
    settings:
      - connection_profiles.server_url
      - knowledge_libraries.source_url
      - knowledge_libraries.schedule_enabled
  - id: source-dropbox
    group: CONNECTOR
    viaOutboundProxy: true
    target: Die Dropbox-API (api.dropboxapi.com, content.dropboxapi.com)
    data: >-
      API-Anfragen mit dem Token des Zugangs; bei einer Team-App ein Token des ganzen Teams, mit
      dem OPAA als zustimmende Team-Administration Team-Ordner liest und die Namespaces des Teams
      auflistet; Inhalte gehen nicht hinaus
    trigger: Indizierungslauf, Verbindungstest, Ordnerauswahl, Original öffnen
    switchOff: Je Bibliothek, durch Ausschalten des Zeitplans oder Löschen der Bibliothek
    settings:
      - opaa.indexing.dropbox.api-base
      - opaa.indexing.dropbox.content-base
      - knowledge_libraries.schedule_enabled
    notes:
      - >-
        Über eine Team-App liest eine Bibliothek Team-Ordner, auch solche, die kein einzelnes
        Mitgliedskonto sieht; wer die Bibliothek lesen darf, liest deren Inhalt. Mitgliederordner,
        geteilte Ordner und App-Ordner liest OPAA nicht und bietet sie nicht zur Auswahl an
      - >-
        Das Token einer Team-App erlaubt Dropbox-seitig mehr, als OPAA nutzt: Es könnte im Namen
        jedes Mitglieds dessen Ordner lesen. OPAA hält es verschlüsselt, schickt es nur an die
        Dropbox-API und widerruft es beim Trennen
  - id: source-google-drive
    group: CONNECTOR
    viaOutboundProxy: true
    target: Die Google-Drive-API (www.googleapis.com)
    data: API-Anfragen mit dem Token des Zugangs oder Dienstkontos; Inhalte gehen nicht hinaus
    trigger: Indizierungslauf, Verbindungstest, Original öffnen
    switchOff: Je Bibliothek, durch Ausschalten des Zeitplans oder Löschen der Bibliothek
    settings: [knowledge_libraries.schedule_enabled]
  - id: source-nextcloud
    group: CONNECTOR
    viaOutboundProxy: true
    target: Der Nextcloud-Server des Zugangs (WebDAV)
    data: WebDAV-Anfragen mit den Zugangsdaten; Inhalte gehen nicht hinaus
    trigger: Indizierungslauf, Verbindungstest, Original öffnen
    switchOff: Je Bibliothek, durch Ausschalten des Zeitplans oder Löschen der Bibliothek
    settings: [connection_profiles.server_url, knowledge_libraries.schedule_enabled]
  - id: source-sharepoint
    group: CONNECTOR
    viaOutboundProxy: true
    target: Microsoft Graph (graph.microsoft.com) und die Anmeldung bei login.microsoftonline.com
    data: API-Anfragen mit dem Token des Zugangs; Inhalte gehen nicht hinaus
    trigger: Indizierungslauf, Ordnerauswahl, Verbindungstest, Original öffnen
    switchOff: Je Bibliothek, durch Ausschalten des Zeitplans oder Löschen der Bibliothek
    settings: [connection_profiles.tenant, knowledge_libraries.schedule_enabled]
  - id: source-onedrive
    group: CONNECTOR
    viaOutboundProxy: true
    target: >-
      Microsoft Graph (graph.microsoft.com) und die Anmeldung der Person bei
      login.microsoftonline.com
    data: >-
      API-Anfragen mit dem Token des verbundenen Kontos der Person, das nur ihr eigenes OneDrive
      liest; Inhalte gehen nicht hinaus
    trigger: Indizierungslauf, Ordnerauswahl, Verbindungstest, Konto verbinden, Original öffnen
    switchOff: >-
      Je private Bibliothek, durch Ausschalten des Zeitplans, Trennen des Kontos oder Löschen der
      Bibliothek
    settings: [connection_profiles.tenant, knowledge_libraries.schedule_enabled]
  - id: source-s3
    group: CONNECTOR
    viaOutboundProxy: true
    target: Der S3-kompatible Objektspeicher, den die Bibliothek nennt
    data: Signierte Anfragen mit den Zugangsdaten; Inhalte gehen nicht hinaus
    trigger: Indizierungslauf, Verbindungstest, Original öffnen
    switchOff: Je Bibliothek, durch Ausschalten des Zeitplans oder Löschen der Bibliothek
    settings: [knowledge_libraries.source_url, knowledge_libraries.schedule_enabled]
  - id: source-smb
    group: CONNECTOR
    viaOutboundProxy: false
    target: Die SMB-Freigabe, die die Bibliothek nennt
    data: SMB-Anmeldung und Leseanfragen; Inhalte gehen nicht hinaus
    trigger: Indizierungslauf, Verbindungstest, Original öffnen
    switchOff: Je Bibliothek, durch Ausschalten des Zeitplans oder Löschen der Bibliothek
    settings: [knowledge_libraries.source_url, knowledge_libraries.schedule_enabled]
  - id: source-original
    group: CONNECTOR
    viaOutboundProxy: true
    target: Der Webserver bzw. Feed, aus dem ein Dokument einer Web- oder RSS-Bibliothek stammt
    data: Abruf des Originals mit den Zugangsdaten der Bibliothek
    trigger: Eine Person öffnet das Original eines solchen Dokuments
    switchOff: Findet nur auf Handlung einer berechtigten Person statt
    settings: [knowledge_libraries.source_url]
  - id: source-attachment
    group: CONNECTOR
    viaOutboundProxy: true
    target: Die Ziele der Anhänge, die ein Feed-Eintrag verlinkt
    data: Abrufanfragen; die Zugangsdaten nur an die Herkunft des Feeds
    trigger: Indizierungslauf einer RSS-Bibliothek
    switchOff: Über das Anhangsprofil und die Höchstzahl der Anhänge je Eintrag
    settings: [opaa.indexing.rss.attachment-profile, opaa.indexing.rss.max-attachments-per-entry]
  - id: service-account-token
    group: CONNECTOR
    viaOutboundProxy: true
    target: Der Token-Endpunkt des Anbieters eines Dienstkontos (Google Drive)
    data: Eine mit dem Dienstkontoschlüssel signierte Anforderung eines Zugriffstokens
    trigger: Vor Anfragen eines Laufs oder Tests, höchstens etwa einmal je Stunde
    switchOff: Entfällt ohne Zugang mit Dienstkonto
    settings: [connection_profiles.auth_method]
  - id: connection-oauth
    group: CONNECTOR
    viaOutboundProxy: true
    target: Der Autorisierungsserver eines Zugangs (OAuth)
    data: >-
      Client-Kennung und -Geheimnis, Autorisierungscode, Erneuerungs- und Widerrufsanfragen der
      Tokens
    trigger: Verbinden eines Kontos, Erneuerung eines Tokens, Trennen
    switchOff: Entfällt ohne Zugang mit OAuth
    settings: [connection_profiles.server_url, connection_profiles.auth_method]
  - id: mcp-discovery
    group: CONNECTOR
    viaOutboundProxy: true
    target: Ein externer MCP-Server und sein Autorisierungsserver
    data: Abruf der veröffentlichten Metadaten (RFC 9728, RFC 8414)
    trigger: Speichern eines MCP-Server-Profils durch die Systemverwaltung
    switchOff: Findet nur auf Handlung der Systemverwaltung statt
    settings: [connection_profiles.server_url]
  - id: oidc-provider
    group: IDENTITY
    viaOutboundProxy: true
    target: Die Identitätsanbieter (OIDC), die die Systemverwaltung einträgt
    data: Abruf des Discovery-Dokuments und der Signaturschlüssel
    trigger: Anmeldung über den Anbieter, Verbindungstest in der Verwaltung
    switchOff: Je Anbieter abschaltbar; ohne Anbieter nur lokale Anmeldung
    settings: [oidc_providers.enabled, oidc_providers.issuer_uri, oidc_providers.jwk_set_uri]
  - id: directory-sync
    group: IDENTITY
    viaOutboundProxy: true
    target: Die Admin-Schnittstelle des Verzeichnisses (Keycloak)
    data: Anmeldung des Dienstkontos, Abruf von Gruppen, Mitgliedschaften und Konten
    trigger: Zeitplan des Verzeichnisabgleichs, manueller Abgleich
    switchOff: Je Anbieter abschaltbar; der Takt global
    settings:
      - oidc_providers.directory_sync_enabled
      - directory_connectors.base_url
      - opaa.directory-sync.schedule-enabled
  - id: mail
    group: MAIL
    viaOutboundProxy: false
    target: >-
      Der Mailserver (SMTP), den die Systemverwaltung einträgt, und im Installationsassistenten der
      Mailserver, den die einrichtende Person angibt
    data: >-
      E-Mail-Adresse und Name der Empfängerin oder des Empfängers, Inhalt der Benachrichtigung
      (Einladung, Kennwort, Zugangslinks, Erinnerungen, Testmail); bei der Prüfung im Assistenten
      nur Verbindungsaufbau und Anmeldung, eine Testmail nur an die dort angegebene Adresse
    trigger: >-
      Einladung und Kennwortvorgänge lokaler Konten, Anmeldung des Bootstrap-Kontos der Systemverwaltung, ablaufende
      Freigaben für externe KI-Werkzeuge, erzeugte und ablaufende Zugangstokens, Testmail; im Installationsassistenten die Prüfung des
      Schritts E-Mail-Versand, nur mit dem Installations-Token und vor dem Abschluss
    switchOff: >-
      Abschaltbar, Voreinstellung aus; der Abschluss der Installation schaltet den Versand nur ein,
      wenn der Schritt E-Mail-Versand geprüft und nicht übersprungen ist
    settings: [mail_settings.enabled, mail_settings.host, installation_steps.payload]
  - id: original-store
    group: STORAGE
    viaOutboundProxy: false
    target: Der S3-kompatible Objektspeicher der Originalablage
    data: Die hochgeladenen Originaldateien
    trigger: Upload, Öffnen und Löschen eines Originals
    switchOff: >-
      Nur bei Ablage in S3; Voreinstellung der Anwendung ist das Dateisystem, das Helm-Chart setzt
      S3 voreingestellt
    settings: [opaa.upload.store, opaa.upload.s3.endpoint]
  - id: malware-scanner
    group: SECURITY
    viaOutboundProxy: false
    target: Der Virenscanner (clamd), den der Betrieb konfiguriert, meist im eigenen Netz
    data: >-
      Der vollständige Inhalt jeder Datei, die eine Bibliothek aufnehmen soll (Upload, Datei einer
      Quelle, Anhang), ohne Dateiname, Bibliothek oder Person
    trigger: Jede Aufnahme einer Datei bei eingeschalteter Virenprüfung
    switchOff: Abschaltbar, Voreinstellung aus
    settings: [opaa.malware-scan.enabled, opaa.malware-scan.host]
  - id: siem-export
    group: SECURITY
    viaOutboundProxy: false
    target: Das zentrale Sicherheitsmonitoring (SIEM) der Behörde, ein Syslog-Empfänger
    data: >-
      Je Eintrag des Revisionsprotokolls Ereignisart, Zeitpunkt, Ergebnis, Organisation, Art und
      Kennung des betroffenen Objekts und die Version des Ereigniskatalogs, den Namen des Objekts
      nur auf eigenen Schalter; keine Pseudonyme
      handelnder oder betroffener Personen, keine Begründung und keine Inhalte. Bei einem Konto,
      einem Zugangstoken, dem persönlichen Bereich, einer privaten Bibliothek und einem privaten
      Prompt weder Kennung noch Name. Dazu ein Hinweis auf jede Lücke durch Abschalten oder die
      Aufbewahrungsfrist
    trigger: Laufend, alle 30 Sekunden, ab dem Einschalten
    switchOff: Abschaltbar, Voreinstellung aus
    settings: [opaa.siem-export.enabled, opaa.siem-export.host, opaa.siem-export.tls, opaa.siem-export.include-labels]
