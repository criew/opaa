title: Konfiguration und Standardmodelle
defaults:
  settings:
    source: PROPERTY
settings:
  # Standardmodelle: Modell und Adresse jeder Modellrolle
  - key: llm_models.model_identifier
    source: DATABASE
    defaultValue: ""
    effect: >-
      Aktives Chat-Modell, das Antworten, Titel, Gesprächsnotizen und Teilfragen erzeugt; kommt aus
      der Installation und wird in der Modellverwaltung geändert
    bearings: [DATA_FLOW]
    notes:
      - Im Modus dev richtet sich die Instanz mit phi3:mini unter OPAA_OPENAI_BASE_URL ein
  - key: embedding_model.base_url
    source: DATABASE
    defaultValue: keine, Angabe der Installation
    effect: Adresse des Embedding-Modells, an das Dokumentabschnitte und Suchanfragen gehen
    bearings: [DATA_FLOW]
    notes:
      - >-
        Wird bei der Installation festgelegt; die Systemverwaltung ändert sie unter Modelle →
        Einbettung, bei gleichem Modell als Endpunktwechsel ohne Neueinbettung
      - >-
        Bei Installation, Modell- und Endpunktwechsel gegen die Adressprüfung der Modelle geprüft
        (OPAA_MODEL_TARGET_VALIDATION_*); ein gespeicherter Zugangsschlüssel geht nie an eine
        andere Adresse mit
  - key: embedding_model.model_identifier
    source: DATABASE
    defaultValue: keine, Angabe der Installation
    effect: Embedding-Modell, das Dokumentabschnitte und Suchanfragen in Vektoren umrechnet
    bearings: [DATA_FLOW]
    notes:
      - >-
        Wird bei der Installation mit einer Probeeinbettung festgelegt, die die Vektordimension
        bestimmt. Die Systemverwaltung wechselt das Modell unter Modelle → Einbettung; bis zum
        Abschluss der Neueinbettung ist die Vektorsuche ausgesetzt
  - key: rerank_model.enabled
    source: DATABASE
    defaultValue: "false"
    effect: Ob die Rerank-Rolle Suchtreffer samt Frage an ein Rerank-Modell sendet
    bearings: [DATA_FLOW]
    notes:
      - Werkseinstellung im Code; die Systemverwaltung schaltet unter Modelle → Reranking
      - >-
        Auch der Abschluss der Installation schaltet ein, wenn der Schritt Rerank-Modell geprüft
        und nicht übersprungen ist
  - key: rerank_model.base_url
    source: DATABASE
    defaultValue: ""
    effect: Adresse des Rerank-Modells; ohne Angabe ist die Rolle nicht gebunden
    bearings: [DATA_FLOW]
    notes:
      - Geprüft gegen die Adressprüfung der Modelle (OPAA_MODEL_TARGET_VALIDATION_*)
      - >-
        Auch der Abschluss der Installation legt sie fest, wenn der Schritt Rerank-Modell geprüft
        ist; die Systemverwaltung ändert sie unter Modelle → Reranking
  - key: rerank_model.model_identifier
    source: DATABASE
    defaultValue: ""
    effect: Rerank-Modell; ohne Angabe ist die Rolle nicht gebunden
    bearings: [DATA_FLOW]
    notes:
      - >-
        Auch der Abschluss der Installation legt es fest, wenn der Schritt Rerank-Modell geprüft
        ist; die Systemverwaltung ändert es unter Modelle → Reranking
  - key: malware_scan_settings.enabled
    source: DATABASE
    defaultValue: "false"
    effect: >-
      Ob jede Datei vor der Aufnahme in eine Bibliothek oder einen Chat an den Virenscanner geht
    bearings: [DATA_FLOW]
    notes:
      - >-
        Werkseinstellung im Code; die Systemverwaltung schaltet unter Administration →
        Virenprüfung, oder der Abschluss der Installation mit einem geprüften Schritt Virenprüfung.
        OPAA liefert keinen Virenscanner mit, der Betrieb stellt den clamd-Dienst
  - key: malware_scan_settings.host
    source: DATABASE
    defaultValue: ""
    effect: Adresse des Virenscanners (clamd); Pflicht bei eingeschalteter Virenprüfung
    bearings: [DATA_FLOW]
    notes:
      - Im Installationsassistenten nur mit Port 3310, in der Administration ohne Adressprüfung
  - key: malware_scan_settings.on_unavailable
    source: DATABASE
    defaultValue: REJECT
    effect: >-
      Ob eine Datei, die der Virenscanner nicht prüfen konnte, abgewiesen (REJECT) oder ungeprüft
      aufgenommen wird (ACCEPT)
    bearings: [DATA]
  - key: transcription_model.enabled
    source: DATABASE
    defaultValue: "false"
    effect: Ob die Spracheingabe Aufnahmen an ein Transkriptionsmodell sendet
    bearings: [DATA_FLOW]
    notes:
      - >-
        Werkseinstellung im Code; die Systemverwaltung schaltet unter Modelle → Spracheingabe, oder
        der Abschluss der Installation mit einem geprüften Schritt Transkriptionsmodell, beides
        begrenzt durch opaa.features.speech-input.enabled
  - key: transcription_model.base_url
    source: DATABASE
    defaultValue: ""
    effect: Adresse des Transkriptionsmodells; ohne Angabe ist die Rolle nicht gebunden
    bearings: [DATA_FLOW]
    notes:
      - Geprüft gegen die Adressprüfung der Modelle (OPAA_MODEL_TARGET_VALIDATION_*)
      - >-
        Auch der Abschluss der Installation legt sie fest, wenn der Schritt Transkriptionsmodell
        geprüft ist; die Systemverwaltung ändert sie unter Modelle → Spracheingabe
  - key: transcription_model.model_identifier
    source: DATABASE
    defaultValue: ""
    effect: Transkriptionsmodell; ohne Angabe ist die Rolle nicht gebunden
    bearings: [DATA_FLOW]
    notes:
      - >-
        Auch der Abschluss der Installation legt es fest, wenn der Schritt Transkriptionsmodell
        geprüft ist; die Systemverwaltung ändert es unter Modelle → Spracheingabe
  - key: transcription_model.realtime_protocol
    source: DATABASE
    defaultValue: ""
    effect: >-
      Ob und in welchem Protokoll (OPENAI, VLLM, MISTRAL) die Spracheingabe zusätzlich ein
      Live-Transkript bei einem Live-Dienst anfragt; ohne Angabe nur Diktat mit ganzer Aufnahme
    bearings: [DATA_FLOW]
    notes:
      - >-
        Die Systemverwaltung wählt es unter Modelle → Spracheingabe, oder der Abschluss der
        Installation mit einem geprüften Schritt Transkriptionsmodell, der das Live-Transkript wählt;
        wirkt nur, solange auch die Spracheingabe eingeschaltet ist
  - key: transcription_model.realtime_url
    source: DATABASE
    defaultValue: ""
    effect: WebSocket-Adresse (ws:// oder wss://) des Live-Dienstes
    bearings: [DATA_FLOW]
    notes:
      - Geprüft gegen die Adressprüfung der Modelle (OPAA_MODEL_TARGET_VALIDATION_*)
  - key: transcription_model.realtime_model
    source: DATABASE
    defaultValue: ""
    effect: Modell des Live-Dienstes
    bearings: [DATA_FLOW]
  - key: transcription_model.realtime_max_sessions
    source: DATABASE
    defaultValue: "1"
    effect: >-
      Höchstzahl gleichzeitiger Live-Sitzungen der ganzen Installation, über alle Instanzen;
      darüber diktiert die Person mit ganzer Aufnahme
    bearings: [DATA_FLOW]
  - key: opaa.sandbox.enabled
    defaultValue: "false"
    effect: >-
      Ob Agenten das Werkzeug run_code angeboten bekommt: Skripte des Chat-Modells laufen dann je
      Agentenlauf in einer Sandbox ohne Netz beim Sandbox-Dienst; erzeugte Dateien werden Anhang der
      Antwort. Ausgeschaltet gibt es weder Client noch Werkzeug
    bearings: [DATA_FLOW]
    notes:
      - >-
        Eingeschaltet startet das Backend nicht ohne opaa.sandbox.base-url und opaa.sandbox.api-key;
        zusätzlich entscheiden der Werkzeugschalter und die Zuordnung am Agenten
    helm:
      values: sandbox.enabled
      defaultValue: "false"
  - key: opaa.sandbox.base-url
    defaultValue: "http://opensandbox-server:8090"
    effect: >-
      Adresse des Sandbox-Dienstes, an den die Skripte gehen; vom Betrieb gesetzt, nie aus Modell
      oder Anfrage
    bearings: [DATA_FLOW]
    helm:
      values: sandbox.baseUrl
      defaultValue: ""
  - key: opaa.ocr.enabled
    defaultValue: "false"
    effect: >-
      Ob diese Installation gescannte PDF-Dokumente überhaupt an einen Texterkennungsdienst senden
      darf; zusätzlich muss die Rolle Texterkennung in der Modellverwaltung eingeschaltet sein
    bearings: [DATA_FLOW]
    notes:
      - >-
        Ausgeschaltet wird die Rolle weder ausgewertet noch kontaktiert; die Systemverwaltung kann
        sie nur vorbereiten, Gespeichertes bleibt erhalten
      - >-
        Grenzen je Dokument, Lauf und Instanz: OPAA_OCR_MAX_PAGES_PER_DOCUMENT,
        OPAA_OCR_DOCUMENT_TIMEOUT, OPAA_OCR_MAX_CONCURRENT, OPAA_OCR_MAX_PAGES_PER_RUN,
        OPAA_OCR_CALL_TIMEOUT; Abstand des Nachholens hochgeladener Scans:
        OPAA_OCR_CATCH_UP_INTERVAL
      - >-
        Der Helm-Chart kann den Dienst opaa-ocr mitliefern (ocr.service.enabled, Voreinstellung
        aus): nur von den Backend-Pods erreichbar, ohne Ausgang, mit Pflichtschlüssel; ebenso das
        Compose-Overlay docker-compose.ocr.yml im internen Netz ohne veröffentlichten Port
    helm:
      values: ocr.enabled
      defaultValue: "false"
  - key: text_recognition_model.enabled
    source: DATABASE
    defaultValue: "false"
    effect: Ob die Rolle Texterkennung eingeschaltet ist und ihr Dienst angesprochen werden darf
    bearings: [DATA_FLOW]
    notes:
      - >-
        Werkseinstellung im Code; die Systemverwaltung schaltet in der Modellverwaltung, begrenzt
        durch opaa.ocr.enabled
  - key: text_recognition_model.connection_type
    source: DATABASE
    defaultValue: DOCLING_SERVE
    effect: >-
      Art des Texterkennungsdienstes: docling-serve (ganze PDF) oder OpenAI-kompatibles
      Vision-Modell (je Seite ein Bild)
    bearings: [DATA_FLOW]
  - key: text_recognition_model.base_url
    source: DATABASE
    defaultValue: ""
    effect: Adresse des Texterkennungsdienstes; ohne Angabe ist die Rolle nicht gebunden
    bearings: [DATA_FLOW]
    notes:
      - Geprüft gegen die Adressprüfung der Modelle (OPAA_MODEL_TARGET_VALIDATION_*)
  - key: text_recognition_model.model_identifier
    source: DATABASE
    defaultValue: ""
    effect: Vision-Modell der Texterkennung; nur beim Verbindungstyp Vision-Modell nötig
    bearings: [DATA_FLOW]
  # Funktionen
  - key: opaa.features.prompt-libraries.enabled
    defaultValue: "true"
    effect: Prompt-Bibliotheken sind angeboten; ausgeschaltet bleiben ihre Daten erhalten
    bearings: [DATA, VISIBILITY]
    helm:
      values: features.promptLibraries.enabled
      defaultValue: "true"
  - key: opaa.features.metadata.enabled
    defaultValue: "true"
    effect: >-
      Metadaten von Dokumenten und Bibliotheken werden erhoben und gezeigt, auch durch ein Modell
      extrahiert; ausgeschaltet bleibt nur der Titel sichtbar
    bearings: [DATA, EVALUATION, DATA_FLOW]
    helm:
      values: features.metadata.enabled
      defaultValue: "true"
  - key: opaa.features.speech-input.enabled
    defaultValue: "true"
    effect: Spracheingabe im Chat ist angeboten, sobald die Transkriptionsrolle gebunden ist
    bearings: [DATA_FLOW]
    helm:
      values: features.speechInput.enabled
      defaultValue: "true"
  - key: opaa.features.external-access.enabled
    defaultValue: "true"
    effect: >-
      Der Zugriffsweg für externe KI-Werkzeuge (Zugangstokens, Freigaben, MCP-Server) besteht; geöffnet wird er
      erst über seinen Schalter in der Administration
    bearings: [VISIBILITY, DATA_FLOW]
    helm:
      values: features.externalAccess.enabled
      defaultValue: "true"
  - key: opaa.features.chat-upload.enabled
    defaultValue: "true"
    effect: >-
      Dokumente lassen sich an eine Chatfrage anhängen; ihr Text geht mit den Fragen des Chats an
      das Sprachmodell
    bearings: [DATA, DATA_FLOW]
    helm:
      values: features.chatUpload.enabled
      defaultValue: "true"
  - key: opaa.features.quick-tour.enabled
    defaultValue: "true"
    effect: >-
      Der Rundgang für neue Nutzer samt Schreibroute ist eingeschaltet; je Konto wird nur
      festgehalten, ob der Hinweis zum Rundgang erledigt ist. Ausgeschaltet bleibt dieser Merker
      unverändert erhalten
    bearings: [DATA]
    helm:
      values: features.quickTour.enabled
      defaultValue: "true"
  - key: opaa.demo.chat-import.enabled
    defaultValue: "false"
    effect: Ob vorbereitete Chatverläufe ohne Modellaufruf eingespielt werden können (nur Demo)
    bearings: [DATA]
  # Chats, Rechte und Auswertung
  - key: opaa.chat.note.max-items
    defaultValue: "10"
    range: 1 bis 50
    effect: Punkte, die die Gesprächsnotiz eines Chats höchstens festhält; der älteste fällt weg
    bearings: [DATA]
  - key: opaa.permission.minimum-group-size
    defaultValue: "5"
    range: mindestens 5, nur nach oben änderbar
    effect: Kleinste Gruppe, die ein Rechteprofil-Lauf mit Space-Kontext zeigt
    bearings: [VISIBILITY, EVALUATION]
  - key: opaa.directory-sync.schedule-enabled
    defaultValue: "true"
    effect: >-
      Ob die Verzeichnis-Synchronisation planmäßig läuft und Gruppen, Mitgliedschaften und
      Kontostatus aus dem Verzeichnis übernimmt
    bearings: [DATA, VISIBILITY]
  # Ablage der Originale und Quellen
  - key: opaa.upload.store
    defaultValue: filesystem
    range: filesystem oder s3
    effect: Wo hochgeladene Originale liegen
    bearings: [DATA]
    helm:
      values: uploads.store
      defaultValue: s3
  - key: opaa.upload.s3.endpoint
    defaultValue: ""
    effect: Adresse des Objektspeichers der Originale, wenn sie in S3 liegen
    bearings: [DATA, DATA_FLOW]
    helm:
      values: uploads.s3.endpoint
      defaultValue: ""
  - key: opaa.upload.orphan-grace-minutes
    defaultValue: "60"
    effect: Alter, ab dem ein Original ohne Dokument von der Bereinigung gemeldet oder entfernt wird
    bearings: [DATA]
  - key: opaa.indexing.filesystem.allowlist
    defaultValue: ""
    effect: >-
      Verzeichnisse des Servers, aus denen Bibliotheken indexieren dürfen; leer schaltet die
      Dateisystem-Quelle ab
    bearings: [DATA]
    helm:
      values: filesystemSources
      defaultValue: ""
  - key: opaa.indexing.dropbox.api-base
    defaultValue: https://api.dropboxapi.com
    effect: Adresse der Dropbox-API, an die Zugangstoken und Abfragen gehen
    bearings: [DATA_FLOW]
  - key: opaa.indexing.dropbox.content-base
    defaultValue: https://content.dropboxapi.com
    effect: Adresse, von der Dropbox-Dateien geladen werden
    bearings: [DATA_FLOW]
  - key: opaa.indexing.dropbox.authorization-endpoint
    defaultValue: https://www.dropbox.com/oauth2/authorize
    effect: Adresse, an der eine Person der Dropbox-Anbindung zustimmt
    bearings: [DATA_FLOW]
  - key: opaa.indexing.dropbox.token-endpoint
    defaultValue: https://api.dropboxapi.com/oauth2/token
    effect: Adresse, an der Zustimmungscodes und Erneuerungstoken gegen Zugangstoken getauscht werden
    bearings: [DATA_FLOW]
  - key: opaa.indexing.dropbox.revocation-endpoint
    defaultValue: https://api.dropboxapi.com/2/auth/token/revoke
    effect: Adresse, an der ein verworfenes Dropbox-Token widerrufen wird
    bearings: [DATA_FLOW]
  # Vollabgleiche: erst sie entfernen, was in der Quelle gelöscht wurde
  - key: full_sync_rhythm_settings.interval_days[CONFLUENCE]
    source: DATABASE
    defaultValue: "7"
    range: 1 bis 365 Tage
    effect: >-
      Tage zwischen zwei Vollabgleichen von Confluence; nur sie entfernen Seiten aus dem Bestand, die
      in der Quelle gelöscht wurden
    bearings: [DATA]
    notes:
      - >-
        Werkseinstellung, solange die Systemverwaltung unter Anbindungen → Einstellungen keinen
        eigenen Wert setzt; eine Bibliothek kann einen eigenen Rhythmus setzen
  - key: full_sync_rhythm_settings.interval_days[SHAREPOINT]
    source: DATABASE
    defaultValue: "1"
    range: 1 bis 365 Tage
    effect: >-
      Tage zwischen zwei Vollabgleichen von SharePoint; sie entfernen Dateien gelöschter oder
      verschobener Ordner, die der Änderungslauf nicht einzeln meldet
    bearings: [DATA]
    notes:
      - >-
        Werkseinstellung, solange die Systemverwaltung unter Anbindungen → Einstellungen keinen
        eigenen Wert setzt; eine Bibliothek kann einen eigenen Rhythmus setzen
  - key: full_sync_rhythm_settings.interval_days[ONEDRIVE]
    source: DATABASE
    defaultValue: "1"
    range: 1 bis 365 Tage
    effect: >-
      Tage zwischen zwei Vollabgleichen von OneDrive; sie entfernen Dateien gelöschter oder
      verschobener Ordner, die der Änderungslauf nicht einzeln meldet
    bearings: [DATA]
    notes:
      - >-
        Werkseinstellung, solange die Systemverwaltung unter Anbindungen → Einstellungen keinen
        eigenen Wert setzt; eine Bibliothek kann einen eigenen Rhythmus setzen
  - key: full_sync_rhythm_settings.interval_days[DROPBOX]
    source: DATABASE
    defaultValue: "7"
    range: 1 bis 365 Tage
    effect: >-
      Tage zwischen zwei Vollabgleichen von Dropbox; sie entfernen, was der Änderungslauf nicht als
      gelöscht gemeldet hat
    bearings: [DATA]
    notes:
      - >-
        Werkseinstellung, solange die Systemverwaltung unter Anbindungen → Einstellungen keinen
        eigenen Wert setzt; eine Bibliothek kann einen eigenen Rhythmus setzen
  - key: full_sync_rhythm_settings.interval_days[GOOGLE_DRIVE]
    source: DATABASE
    defaultValue: "7"
    range: 1 bis 365 Tage
    effect: >-
      Tage zwischen zwei Vollabgleichen von Google Drive; sie entfernen, was der Änderungslauf nicht
      als gelöscht gemeldet hat
    bearings: [DATA]
    notes:
      - >-
        Werkseinstellung, solange die Systemverwaltung unter Anbindungen → Einstellungen keinen
        eigenen Wert setzt; eine Bibliothek kann einen eigenen Rhythmus setzen
  - key: full_sync_rhythm_settings.interval_days[NEXTCLOUD]
    source: DATABASE
    defaultValue: "7"
    range: 1 bis 365 Tage
    effect: >-
      Tage, die gemerkte Ordnerkennungen von Nextcloud einen Ordner von der Auflistung verschonen;
      erst die volle Auflistung entfernt, was dort fehlt
    bearings: [DATA]
    notes:
      - >-
        Werkseinstellung, solange die Systemverwaltung unter Anbindungen → Einstellungen keinen
        eigenen Wert setzt; einen eigenen Rhythmus je Bibliothek gibt es für Nextcloud nicht
