title: Protokoll
defaults:
  auditEvents:
    purpose: >-
      Nachweis von Rechteänderungen, Verwaltungshandeln, Zugriffen auf Protokolldaten und
      Sicherheitsereignissen wie einem Befund der Virenprüfung (revisionssicheres Protokoll); kein
      Nachweis von Nutzungsverhalten
    personalReference: EMPLOYEE
    storage: Tabelle audit_log der Anwendungsdatenbank, nach Monaten partitioniert, nur anfügend
    retention:
      rule: >-
        Einheitliche Frist für alle Ereignisse, Voreinstellung 36 Monate; gelöscht werden ganze
        abgelaufene Monatspartitionen im monatlichen Lauf
      settings: [audit_retention_settings.retention_months]
    visibility:
      - AUDITOR über die vier begrenzten Abfragewege (nach Objekt, Zeitraum, Ereignisart, Vorgang)
      - AUDITOR im Vier-Augen-Verfahren der anlassbezogenen Klärung (Personenfilter, befristet)
    accessPaths: [UI, API, EXPORT, DATABASE]
    deletion: >-
      Automatisch über die Datenbankfunktion opaa_audit_delete_expired_partitions (ganze
      Monatspartitionen); einzelne Einträge sind nicht löschbar. Mit dem Konto entfällt die
      Pseudonymzuordnung, der Eintrag bleibt ohne Personenbezug. Ausnahme: Nennt eine Freigabe der
      anlassbezogenen Klärung die Person, bleibt dort ihr Protokollpseudonym bis zur Löschfrist der
      Freigabe; bis dahin lassen sich ihre Protokolleinträge über die Freigabe (mit Begründung und
      Zeitraum) wieder ihr zuordnen
    evaluations: >-
      Abfragen nach Objekt, Zeitraum, Ereignisart oder Vorgang mit Zeitraum bis 92 Tage und
      höchstens 50 Seiten; kein Filter, keine Zählung und keine Zeitreihe je Person, keine
      Freitextsuche. Personenfilter nur in der freigegebenen anlassbezogenen Klärung
    recordFields:
      - event_id
      - recorded_at
      - organization_id
      - actor_kind
      - actor_ref (Pseudonym)
      - event_type
      - object_type
      - object_id
      - object_label
      - subject_kind
      - subject_ref (Pseudonym bei Personen)
      - before
      - after
      - outcome
      - reason
      - correlation_ref
      - schema_version
    readers:
      - AUDITOR (Revision) zur Prüfung von Rechte- und Verwaltungshandeln
    notes:
      - >-
        Das Protokoll enthält Handlungen von Beschäftigten (Pseudonym); Hinweis: Mitbestimmung bei
        technischen Einrichtungen zur Verhaltens- und Leistungskontrolle prüfen (§ 80 Abs. 1
        Nr. 21 BPersVG bzw. Landesrecht)
      - >-
        Was before und after tragen, legt der Ereigniskatalog je Ereignisart fest; eine Angabe, die
        er nicht nennt, wird nicht gespeichert. schema_version nennt die Version des Katalogs, unter
        der ein Eintrag geschrieben ist; Einträge von vor dem Katalog tragen keine
      - >-
        Objekte, die genau einer Person gehören, stehen nur mit Kennung und neutraler Bezeichnung
        im Protokoll, nie mit ihrem Namen, auch nicht in den Angaben des Eintrags: private
        Bibliothek („Private Bibliothek“), Prompt einer privaten Prompt-Bibliothek („Privater
        Prompt“) und persönlicher Bereich („Persönlicher Bereich“)
data:
  - id: audit-log
    title: Revisionssicheres Protokoll
    purpose: >-
      Nachweis von Rechteänderungen, Verwaltungshandeln und Zugriffen auf Protokolldaten
    personalReference: EMPLOYEE
    tables:
      - name: audit_log
        personalColumns: [actor_ref, subject_ref, object_id, object_label, before, after, reason]
        nonPersonalColumns:
          - event_id
          - recorded_at
          - organization_id
          - actor_kind
          - event_type
          - object_type
          - subject_kind
          - outcome
          - correlation_ref
          - schema_version
        person:
          columns: [actor_ref, subject_ref, object_id, before, after]
          excludedColumns:
            actor_ref: >-
              Pseudonymkennung, auch die eigene; sie machte die Auskunft zum Schlüssel ins Protokoll
            subject_ref: >-
              Pseudonymkennung, auch die eigene; sie machte die Auskunft zum Schlüssel ins Protokoll
            object_id: >-
              Bei Kontoobjekten Pseudonymkennung, auch die eigene; sie machte die Auskunft zum
              Schlüssel ins Protokoll
            reason: >-
              Begründungsfreitext, auch der eigene, der andere Personen nennen kann; die Auskunft
              sagt nur, ob ein Anlass angegeben war
          note: >-
            Pseudonyme, der Person zugeordnet über audit_actor_pseudonyms; object_id ist bei
            Kontoobjekten (USER_ACCOUNT) das Pseudonym der Person. In before und after sucht die
            Auskunft unter ownerId bei SPACE_CREATED, SPACE_DELETED, SPACE_ARCHIVED und
            ASSET_OWNER_CHANGED (die Besitzerin) und unter targetId nur bei
            PERMISSION_TRANSFER_EXECUTED (das Ziel der Übertragung), jeweils nach dem Pseudonym und
            nach der Kontokennung älterer Einträge, auch wenn die Person kein Pseudonym hat; beide
            Angaben gehen nur als „Sie“ oder „andere Person oder Gruppe“ heraus. Die anlassbezogene
            Klärung durchsucht before und after nicht. Ereignisse einer
            anlassbezogenen Klärung über die Person gehören nicht dazu; object_label an fremden Kontoobjekten
            entfällt, Bezeichnungen anderer Objekte (Spaces, Gruppen, Bibliotheken) bleiben
    storage: Anwendungsdatenbank, Tabelle audit_log, nur anfügend (Eigentümertrennung)
    retention:
      rule: Voreinstellung 36 Monate, einstellbar 12 bis 120 Monate
      settings: [audit_retention_settings.retention_months]
    visibility:
      - AUDITOR
      - >-
        die Person selbst in ihrer Selbstauskunft: Einträge, in denen sie handelt, betroffen,
        Kontoobjekt, als Besitzerin oder als Ziel einer ausgeführten Rechteübertragung genannt
        ist (die Vorschau einer Übertragung nicht), ohne Pseudonyme und Begründungen, andere
        Beteiligte als „andere Person“ oder „System“
    accessPaths: [UI, API, EXPORT, DATABASE]
    deletion: Monatsweise Löschung ganzer abgelaufener Partitionen durch eine Datenbankfunktion
    evaluations: >-
      Nur nach Objekt, Zeitraum, Ereignisart oder Vorgang; keine Auswertung je Person außer in
      der anlassbezogenen Klärung im Vier-Augen-Prinzip
    notes:
      - Beschäftigtendaten; Mitbestimmung bei Verhaltens- und Leistungskontrolle prüfen
  - id: audit-pseudonyms
    title: Pseudonymzuordnung des Protokolls
    purpose: >-
      Trennt die Person vom Protokolleintrag; nur über sie ist ein Eintrag zuordenbar, nach
      Löschung des Kontos nur noch über eine Freigabe der anlassbezogenen Klärung, die die Person
      nennt, bis zu deren Löschfrist
    personalReference: IDENTIFIABLE
    tables:
      - name: audit_actor_pseudonyms
        personalColumns: [user_id, pseudonym_id]
        nonPersonalColumns: [organization_id, created_at]
        person:
          excluded: >-
            Die eigene Kennung machte die Auskunft zum Schlüssel ins Protokoll; wer ihre Vorlage
            erzwingt, hätte den ausgeschlossenen Personeneinstieg
    storage: Anwendungsdatenbank, eigene Tabelle getrennt vom Protokoll
    retention:
      rule: Bis zur Löschung des Kontos, bei gesperrten Konten damit faktisch unbefristet
      settings: []
    visibility: [AUDITOR nur innerhalb der anlassbezogenen Klärung]
    accessPaths: [DATABASE]
    deletion: >-
      Fällt mit der Löschung des Kontos weg (Fremdschlüssel mit ON DELETE CASCADE); nennt eine
      Freigabe der anlassbezogenen Klärung die Person, übernimmt sie vorher deren Pseudonym
    evaluations: keine eigene Auswertung
  - id: audit-incident-scopes
    title: Freigaben der anlassbezogenen Klärung
    purpose: >-
      Vier-Augen-Freigabe eines personenbezogenen Protokollzugriffs mit festgelegter Person,
      Zeitraum und Zweck
    personalReference: EMPLOYEE
    tables:
      - name: audit_incident_scope_grants
        personalColumns:
          - subject_user_id
          - requested_by_user_id
          - approved_by_user_id
          - subject_pseudonym_id
          - requested_by_pseudonym_id
          - approved_by_pseudonym_id
          - purpose
          - reason
        nonPersonalColumns:
          - id
          - organization_id
          - scope_start
          - scope_end
          - requested_at
          - approved_at
          - usable_until
          - status
        person:
          excluded: >-
            Die Auskunft über anlassbezogene Klärungen läuft über die oder den
            Datenschutzbeauftragten; die Übersicht sagt nur, dass es sie geben kann
    storage: Anwendungsdatenbank
    retention:
      rule: >-
        Anträge und Freigaben samt Zweck und Begründung bis zum Ende des Kalenderjahres, das auf
        das Ende der Nutzbarkeit folgt (Voreinstellung, verlängerbar auf bis zu 10 Jahre). Eine
        Freigabe ist 30 Tage ab Freigabe nutzbar, danach nur noch Nachweis. Für die Löschfrist zählt
        bei einem nie freigegebenen Antrag als Ende der Nutzbarkeit der Antragszeitpunkt plus 30
        Tage; freigeben lässt er sich unverändert auch danach
      settings:
        - io.opaa.audit.AuditIncidentScopeGrant#USABLE_WINDOW
        - opaa.audit.incident-scope-retention-years
    visibility: [AUDITOR]
    accessPaths: [UI, API, DATABASE]
    deletion: >-
      Automatisch im täglichen Löschlauf nach Ablauf der Frist, freigegebene und nie freigegebene
      gleich; kein Löschweg von Hand. Ein offener Antrag und eine noch nutzbare Freigabe halten die
      Löschung der Konten der betroffenen, beantragenden und freigebenden Person auf. Danach nicht
      mehr: Wird eines dieser Konten gelöscht, bleibt die Person im Nachweis als Pseudonym des
      Protokolls erhalten (ohne Protokolleinträge ein eigenes), bis die Frist abläuft. Der
      Löschlauf schreibt keinen Protokolleintrag
    evaluations: >-
      Einzelne Klärungen mit Person, Zeitraum, Zweck und Begründung; nach Löschung eines Kontos
      lässt sich über das Pseudonym erkennen, welche Protokolleinträge dieselbe Person betreffen.
      Zahl der beantragten, freigegebenen und abgelaufenen Klärungen je Kalendermonat und Zweck,
      in der Auskunft über die Datenerhebung für einen wählbaren Berichtszeitraum aus ganzen,
      abgeschlossenen Monaten an die Personalvertretung; der laufende Monat wird nicht
      ausgewiesen. Aus überlappenden Zeiträumen lässt sich die Zahl eines einzelnen
      abgeschlossenen Monats erschließen
    notes:
      - >-
        Nach Löschung eines Kontos führt die Klärung keinen Personenfilter mehr aus; das Pseudonym
        im Nachweis wird nicht als Filter verwendet
      - >-
        Für den Bericht an die Personalvertretung zählt OPAA jeden Antrag bei seiner Stellung, jede
        Freigabe bei ihrer Erteilung und das Ende ihrer Nutzbarkeit je Kalendermonat und Zweck in
        einer eigenen Tabelle ohne Person und ohne Verweis auf den Antrag; die Zahlen bleiben nach
        Löschung der Anträge und Freigaben unbefristet erhalten. Eine Ablehnung gibt es nicht. In
        der Auskunft erscheinen Zahlen von 1 bis 2 nur als „weniger als 3“
nonPersonalTables:
  audit_incident_scope_case_counts: [organization_id, case_year, purpose, case_count]
  audit_incident_scope_monthly_counts:
    [organization_id, case_month, purpose, transition, case_count]
  audit_retention_settings: [id, retention_months, last_cutoff, last_run_month, updated_at]
  siem_export_cursor: [id, started_at, last_recorded_at, last_event_id, disabled_at, updated_at]
  audit_chain_checkpoints:
    [month, position, last_recorded_at, last_event_id, head_hash, algorithm, created_at]
  audit_chain_seals: [month, entry_count, head_hash, algorithm, sealed_at, seal_event_id]
settings:
  - key: opaa.siem-export.enabled
    source: PROPERTY
    defaultValue: "false"
    effect: >-
      Ob das Revisionsprotokoll vollständig der Reihe nach gelesen und ohne Pseudonyme an das
      zentrale Sicherheitsmonitoring gesendet wird; beim Wiedereinschalten beginnt die Ausleitung neu
    bearings: [DATA_FLOW]
    helm:
      values: siemExport.enabled
      defaultValue: "false"
  - key: opaa.siem-export.tls
    source: PROPERTY
    defaultValue: "true"
    effect: Ob die Ausleitung an das Sicherheitsmonitoring verschlüsselt (TLS) geht
    bearings: [DATA_FLOW]
    helm:
      values: siemExport.tls
      defaultValue: ""
  - key: opaa.siem-export.include-labels
    source: PROPERTY
    defaultValue: "false"
    effect: >-
      Ob neben der Kennung eines Objekts auch sein Name (etwa eines Space oder einer Gruppe) an das
      Sicherheitsmonitoring geht
    bearings: [DATA_FLOW]
    helm:
      values: siemExport.includeLabels
      defaultValue: "false"
  - key: opaa.siem-export.host
    source: PROPERTY
    defaultValue: ""
    effect: Adresse des Syslog-Empfängers; Pflicht bei eingeschalteter Ausleitung
    bearings: [DATA_FLOW]
    helm:
      values: siemExport.host
      defaultValue: ""
  - key: audit_retention_settings.retention_months
    source: DATABASE
    defaultValue: "36"
    range: 12 bis 120 Monate
    effect: Aufbewahrungsfrist des Protokolls; Verkürzung wirkt mit dem nächsten Monatslauf
    bearings: [DATA, EVALUATION]
  - key: io.opaa.audit.AuditIncidentScopeGrant#USABLE_WINDOW
    source: CONSTANT
    defaultValue: P30D
    effect: Wie lange eine freigegebene anlassbezogene Klärung genutzt werden kann
    bearings: [VISIBILITY, EVALUATION]
  - key: opaa.audit.incident-scope-retention-years
    source: PROPERTY
    defaultValue: "1"
    range: 1 bis 10 Jahre
    effect: >-
      Löschfrist der Anträge und Freigaben der anlassbezogenen Klärung: gelöscht wird am Ende des
      Kalenderjahres, das so viele Jahre nach dem Ende der Nutzbarkeit liegt
    bearings: [DATA]
auditEvents:
  - id: ASSET_GRANT_GRANTED
    trigger: Ein Recht an einem Asset wird vergeben, auch als Mitfreigabe aus der Freigabekette
    details: Subjekt ist die berechtigte Person oder Gruppe; after trägt Rolle und Befristung
    payloadKeys: [expiresAt, role, subjectType]
  - id: ASSET_GRANT_CHANGED
    trigger: Rolle oder Befristung eines Rechts an einem Asset wird geändert
    details: before und after tragen Rolle und Befristung
    payloadKeys: [expiresAt, role, subjectType]
  - id: ASSET_GRANT_REVOKED
    trigger: Ein Recht an einem Asset wird entzogen, auch durch eine gesenkte Freigabe-Obergrenze
    details: before trägt Rolle und Befristung
    payloadKeys: [expiresAt, role, subjectType]
  - id: ASSET_GRANT_EXPIRED
    trigger: Eine Befristung eines Rechts wird wirksam (noch nicht verdrahtet)
  - id: ASSET_VISIBILITY_CHANGED
    trigger: >-
      Nicht mehr geschrieben; frühere Änderung der Katalog-Auffindbarkeit, lesbar bis zum
      Fristablauf
  - id: ASSET_EXTERNAL_ACCESS_CHANGED
    trigger: Die Freigabe einer Bibliothek für externe KI-Werkzeuge wird gesetzt oder zurückgenommen
    details: Richtung und Ablaufdatum, nie ein Name von Token-Inhabern
    payloadKeys: [expiresAt, externalAccess]
  - id: ASSET_EXTERNAL_ACCESS_EXPIRED
    trigger: Die Freigabe einer Bibliothek für externe KI-Werkzeuge erlischt durch Fristablauf (Systemvorgang)
    payloadKeys: [cause, expiresAt, externalAccess]
  - id: SPACE_CREATED
    trigger: Ein Space wird angelegt
    payloadKeys: [chatAutoCleanup, name, ownerId]
  - id: SPACE_CHANGED
    trigger: >-
      Name, Beschreibung, Anweisung oder der Schalter der automatischen Chat-Bereinigung eines
      Space ändert sich
    details: before und after der geänderten Felder
    payloadKeys: [changedFields, chatAutoCleanup]
  - id: SPACE_DELETED
    trigger: Ein Space wird gelöscht
    payloadKeys: [chatAutoCleanup, name, ownerId]
  - id: SPACE_ARCHIVED
    trigger: Ein Space wird stillgelegt statt gelöscht, weil er Chats anderer Personen enthält
    payloadKeys: [chatAutoCleanup, name, ownerId]
  - id: LIBRARY_CREATED
    trigger: Eine Wissensbibliothek wird angelegt
    payloadKeys: [name, sourceType]
  - id: LIBRARY_CHANGED
    trigger: Name oder Beschreibung einer Wissensbibliothek ändert sich
    payloadKeys: [changedFields]
  - id: LIBRARY_DELETED
    trigger: Eine Wissensbibliothek wird gelöscht
    payloadKeys: [documentsRemoved, name, sourceType]
  - id: LOCKED_ACCOUNT_CHATS_DELETED
    trigger: >-
      Der nächtliche Lauf löscht Chats eines lokalen Kontos, dessen Frist nach der Sperre durch
      die Verwaltung abgelaufen ist; ein Eintrag je Konto und Lauf
    details: >-
      Beginn der Frist und Sperrgrund, nie Zahl, Titel, Inhalt oder Space der Chats; betroffene
      Person ist das gesperrte Konto
    purpose: >-
      Allein der Nachweis, dass die Chats eines gesperrten Kontos fristgerecht gelöscht wurden;
      keine Aussage über Nutzung oder Umfang
    evaluations: >-
      Wie jedes Ereignis nur nach Objekt, Zeitraum, Ereignisart oder Vorgang, ohne Zählung je
      Person; die Zahl der gelöschten Chats steht nur als Gesamtzahl im Anwendungslog
    payloadKeys: [lockReason, periodStart]
  - id: LOCKED_ACCOUNT_CHAT_CLEANUP_HELD
    trigger: Die Systemverwaltung hält die Löschung der Chats eines Kontos nach der Sperre an
    details: Keine Begründung
  - id: LOCKED_ACCOUNT_CHAT_CLEANUP_RESUMED
    trigger: Die Systemverwaltung setzt die angehaltene Löschung der Chats eines Kontos fort
  - id: PRIVATE_LIBRARY_ERASED
    trigger: Eine private Bibliothek wird mit ihrem Inhalt gelöscht
    details: Zeitpunkt des Antrags, Anlass und Zahlen des Entfernten, nie Name, Pfad oder Inhalt
    payloadKeys:
      - cause
      - chunksRemoved
      - documentsRemoved
      - erasedCompletely
      - foldersRemoved
      - originalsRemoved
      - requestedAt
      - runsRemoved
      - sourceType
      - spaceAssociationsRemoved
  - id: PROMPT_LIBRARY_CREATED
    trigger: Eine Prompt-Bibliothek wird angelegt
    payloadKeys: [name]
  - id: PROMPT_LIBRARY_CHANGED
    trigger: Name oder Beschreibung einer Prompt-Bibliothek ändert sich
    payloadKeys: [changedFields]
  - id: PROMPT_LIBRARY_DELETED
    trigger: Eine Prompt-Bibliothek wird mit ihren Prompts gelöscht
    payloadKeys: [name, promptsRemoved]
  - id: PROMPT_CREATED
    trigger: Ein Prompt wird einer Bibliothek hinzugefügt
    details: Bibliothek und Kurzname des Prompts, nie Titel oder Text
    payloadKeys: [name, promptLibraryId]
  - id: PROMPT_CHANGED
    trigger: Ein Prompt wird geändert
    details: Nur die Namen der geänderten Felder
    payloadKeys: [changedFields, promptLibraryId]
  - id: PROMPT_DELETED
    trigger: Ein Prompt wird entfernt
    details: Bibliothek und Kurzname des Prompts, nie Titel oder Text
    payloadKeys: [name, promptLibraryId]
  - id: LIBRARY_SOURCE_UPDATED
    trigger: Die Quellkonfiguration einer Bibliothek ändert sich
    details: Nur welche Felder sich änderten, nie Werte oder Zugangsdaten
    payloadKeys: [changedFields, serviceAccountConfirmed]
  - id: GROUP_CREATED
    trigger: Eine Gruppe wird angelegt
    payloadKeys: [externalId, provider]
  - id: GROUP_CHANGED
    trigger: Name oder Beschreibung einer Gruppe ändert sich
    payloadKeys: [changedFields]
  - id: GROUP_DELETED
    trigger: Eine Gruppe wird gelöscht oder aufgelöst
    payloadKeys: [memberCount, name]
  - id: SPACE_MEMBER_ADDED
    trigger: Eine Person oder Gruppe wird in einen Space aufgenommen
    details: Bei externen Personen zusätzlich die ausdrückliche Bestätigung
    payloadKeys: [role]
  - id: SPACE_MEMBER_ROLE_CHANGED
    trigger: Die Rolle eines Space-Mitglieds ändert sich
    payloadKeys: [role]
  - id: SPACE_MEMBER_REMOVED
    trigger: Ein Mitglied wird aus einem Space entfernt
    payloadKeys: [role]
  - id: GROUP_MEMBER_ADDED
    trigger: Eine Person wird in eine Gruppe aufgenommen
    payloadKeys: [member, provider]
  - id: GROUP_MEMBER_REMOVED
    trigger: Eine Person wird aus einer Gruppe entfernt
    payloadKeys: [member]
  - id: GROUP_STEWARD_APPOINTED
    trigger: Eine Person wird für eine interne Gruppe verantwortlich benannt
    payloadKeys: [transferId]
  - id: GROUP_STEWARD_DISMISSED
    trigger: Eine verantwortliche Person wird entlassen oder gibt die Verantwortung ab
    payloadKeys: [transferId]
  - id: GROUP_RELEASE_CHANGED
    trigger: Eine interne Gruppe wird zur Verwendung freigegeben oder die Freigabe zurückgenommen
    payloadKeys: [releasedForUse]
  - id: GROUP_PROTECTION_CHANGED
    trigger: Das Schutzkennzeichen einer Gruppe wird gesetzt oder gelöst
    payloadKeys: [protected]
  - id: GROUP_DEACTIVATED
    trigger: Eine interne Gruppe wird vorübergehend deaktiviert
    details: Gezählte Folgen, nie Namen von Mitgliedern
    payloadKeys: [assetGrants, capabilities, deactivated, memberCount, spaceMemberships]
  - id: GROUP_REACTIVATED
    trigger: Eine deaktivierte Gruppe wird wieder aktiviert
    payloadKeys: [assetGrants, capabilities, deactivated, memberCount, spaceMemberships]
  - id: GROUP_MEMBERS_READ
    trigger: Die Systemverwaltung ruft die Mitgliederliste einer Gruppe ab, die sie nicht verantwortet
    details: Zahl der Mitglieder
    payloadKeys: [memberCount]
  - id: ASSET_SHARED_TO_SPACE
    trigger: Ein Asset wird in einem Space bereitgestellt
    payloadKeys: [spaceId]
  - id: ASSET_DETACHED_FROM_SPACE
    trigger: Ein Asset wird aus einem Space gelöst
    payloadKeys: [spaceId]
  - id: LIBRARY_SHARED_TO_SPACE
    trigger: Nicht mehr geschrieben; frühere Fassung von ASSET_SHARED_TO_SPACE
  - id: LIBRARY_DETACHED_FROM_SPACE
    trigger: Nicht mehr geschrieben; frühere Fassung von ASSET_DETACHED_FROM_SPACE
  - id: ASSET_OWNER_CHANGED
    trigger: Die Eigentümerschaft eines Assets geht über
    details: >-
      before und after nennen die bisherige und die neue Besitzerin: eine Person als Pseudonym,
      eine Gruppe mit ihrer Kennung. Ein Eintrag je Vorgang; beide Personen finden ihn in ihrer
      Selbstauskunft, auch wenn eine Dritte handelt. Die anlassbezogene Klärung findet ihn nur über
      die handelnde Person. Einträge von vor dem Update tragen die Kontokennung bis zum Ablauf der
      Frist
    payloadKeys: [ownerId, transferId]
  - id: ASSET_OWNERSHIP_CLAIMED
    trigger: Ein Asset ohne Zuständigkeit wird übernommen (noch nicht verdrahtet)
  - id: ASSET_SUCCESSION_OPENED
    trigger: Ein Asset geht in „Nachfolge offen“ über (noch nicht verdrahtet)
  - id: SYSTEM_ADMIN_ROLE_GRANTED
    trigger: Die Rolle SYSTEM_ADMIN wird erteilt
    payloadKeys: [provider, role]
  - id: SYSTEM_ADMIN_ROLE_REVOKED
    trigger: Die Rolle SYSTEM_ADMIN wird entzogen
    payloadKeys: [provider, role]
  - id: AUDITOR_ROLE_GRANTED
    trigger: Die Rolle AUDITOR wird erteilt
    payloadKeys: [provider, role]
  - id: AUDITOR_ROLE_REVOKED
    trigger: Die Rolle AUDITOR wird entzogen
    payloadKeys: [provider, role]
  - id: SYSTEM_ADMIN_ROLE_REVOCATION_REFUSED
    trigger: >-
      Der Entzug von SYSTEM_ADMIN für die letzte Systemverwaltung durch den Identitätsanbieter wird
      abgewiesen
    payloadKeys: [role, tokenRole]
  - id: ACCOUNT_DEACTIVATED
    trigger: Ein Konto wird deaktiviert (noch nicht verdrahtet)
  - id: ACCOUNT_REAUTHENTICATION_FORCED
    trigger: Eine erneute Anmeldung wird erzwungen (noch nicht verdrahtet)
  - id: API_TOKEN_ISSUED
    trigger: Ein persönliches Zugangstoken für externe KI-Werkzeuge wird ausgestellt
    details: Bibliotheksauswahl und Ablauf; Token-Kennung statt Tokenname
    payloadKeys: [expiresAt, libraryIds]
  - id: API_TOKEN_REVOKED
    trigger: Ein Zugangstoken wird von der Person oder der Systemverwaltung widerrufen
    details: Anlass und wer widerrufen hat
    payloadKeys: [by, reason]
  - id: API_TOKEN_EXPIRED
    trigger: Ein Zugangstoken erlischt durch Ablauf oder Kontenlebenszyklus
    details: after.reason nennt EXPIRED oder ACCOUNT_LIFECYCLE
    payloadKeys: [reason]
  - id: DIRECTORY_SYNC_CHANGE_APPLIED
    trigger: Ein Verzeichnisabgleich bewirkt eine einzelne Rechteänderung
    details: Je Änderung ein Eintrag, verbunden über correlation_ref
    payloadKeys: [created, dissolved, member, memberCount, name]
  - id: DIRECTORY_SYNC_RUN_COMPLETED
    trigger: Ein Verzeichnislauf endet (Kopfeintrag mit Ergebnis), auch wenn er mit einem Fehler abbricht
    details: >-
      Oberhalb der Schwelle mit bestätigender Person und Anlass in reason; ein nicht erreichbares
      Verzeichnis und ein abgebrochener Lauf mit Ergebnis FAILURE und fester Meldung, ohne die
      Fehlerursache
    payloadKeys: [membershipsAdded, membershipsRemoved, outcome, providerId]
  - id: DIRECTORY_SYNC_PLAN_DISCARDED
    trigger: Ein vorgelegter Abgleichsplan oberhalb der Schwelle wird verworfen
    payloadKeys: [changedFraction, membershipsRemoved, providerId]
  - id: DIRECTORY_SYNC_REPORT_READ
    trigger: Die Systemverwaltung erhält einen Abgleichsbericht mit Namen
    details: Anbieter, Weg und Zahl der genannten Gruppen und Personen, nie Namen
    payloadKeys: [channel, groupCount, personCount, planId, providerId]
  - id: DIRECTORY_ACCOUNT_LOCKED
    trigger: Ein Konto verliert den Zugang, weil das Verzeichnis es deaktiviert oder nicht mehr führt
    payloadKeys: [directoryLocked, providerId]
  - id: DIRECTORY_ACCOUNT_UNLOCKED
    trigger: Das Verzeichnis meldet ein gesperrtes Konto wieder als aktiv
    payloadKeys: [directoryLocked, providerId]
  - id: GOVERNANCE_SETTINGS_CHANGED
    trigger: Governance-Einstellungen ändern sich (noch nicht verdrahtet)
  - id: AUDIT_LOG_CONFIGURATION_CHANGED
    trigger: Die Protokollkonfiguration ändert sich, einschließlich der Aufbewahrungsfrist
    details: before und after der Frist
    payloadKeys: [retentionMonths]
  - id: AUDIT_LOG_MONTH_SEALED
    trigger: Die Prüfsummenkette eines abgeschlossenen Protokollmonats ist vollständig und wird versiegelt
    details: Monat, Anzahl der verketteten Einträge, Kopf-Prüfsumme und Verfahren; ausgelöst vom Kettenlauf selbst, nicht von einer Person
    payloadKeys: [algorithm, entries, headHash, month]
  - id: PERMISSION_HISTORY_RETENTION_CHANGED
    trigger: Die Aufbewahrungshöchstdauer der Rechtehistorie ändert sich
    details: before und after der Monatszahl
    payloadKeys: [retentionMonths]
  - id: MODEL_POLICY_CHANGED
    trigger: Modellvorgaben oder die Freigabe externer Modelle ändern sich (noch nicht verdrahtet)
  - id: CONNECTOR_LIBRARY_SHARE_LIMIT_CHANGED
    trigger: Die Freigabe-Obergrenze einer konnektor-gespeisten Bibliothek wird gesetzt oder geändert
    payloadKeys: [allAccountsGrantAllowed]
  - id: PRIVATE_STORAGE_QUOTA_CHANGED
    trigger: Das hausweite Speicherkontingent privater Bibliotheken ändert sich
    payloadKeys: [overridden, quotaBytes]
  - id: FULL_SYNC_RHYTHM_CHANGED
    trigger: Der hausweite Vollabgleich-Rhythmus einer Quellart ändert sich
    payloadKeys: [intervalDays, overridden, sourceType]
  - id: CAPABILITY_GRANTED
    trigger: Ein Anlegerecht wird einem Konto, einer Gruppe oder allen Konten erteilt
    payloadKeys: [capability, scope, subjectType]
  - id: CAPABILITY_REVOKED
    trigger: Ein Anlegerecht wird entzogen
    payloadKeys: [capability, scope, subjectType]
  - id: PERMISSION_TRANSFER_PREVIEWED
    trigger: Die Vorschau einer Rechteübertragung wird abgerufen, auch ohne Ausführung
    details: >-
      Die Vorschau erscheint nicht in der Selbstauskunft der Zielperson; sie nennt Umfangszahlen
      der Quelle zu einer Übertragung, die nie ausgeführt sein muss. In der Auskunft der
      Handelnden und der Quelle fehlt das Ziel
    payloadKeys:
      - assetGrants
      - capabilities
      - ownedAssets
      - rows
      - scope
      - spaceMemberships
      - stewardships
      - targetId
      - targetType
  - id: PERMISSION_TRANSFER_EXECUTED
    trigger: Die Rechte eines Subjekts werden auf ein anderes übertragen
    details: >-
      Quelle, Ziel, Umfang und Zahl der Zeilen; eine Person als Ziel erscheint als Pseudonym und
      findet den Eintrag in ihrer Selbstauskunft, mit den Umfangszahlen der auf sie übertragenen
      Rechte
    payloadKeys:
      - assetGrants
      - capabilities
      - ownedAssets
      - rows
      - scope
      - spaceMemberships
      - stewardships
      - targetId
      - targetType
  - id: INDEXING_PIPELINE_REINDEX_TRIGGERED
    trigger: Eine Neuindexierung nach Pipeline-Version wird ausgelöst
    payloadKeys:
      - batchSize
      - belowVersion
      - markedForNextRun
      - pipelineId
      - reindexedDocuments
      - removedOrphanChunkSets
      - skippedDocuments
  - id: INDEXING_METADATA_BACKFILL_TRIGGERED
    trigger: Ein Metadaten-Bestandslauf über eine Bibliothek wird ausgelöst
    payloadKeys:
      - batchSize
      - extractionVersion
      - markedForNextRun
      - processedDocuments
      - skippedDocuments
  - id: INDEXING_CONTEXT_PREFIX_RERUN_TRIGGERED
    trigger: Ein Nachlauf mit neuem Kontextpräfix wird ausgelöst
    payloadKeys: [batchSize, processedDocuments, skippedDocuments]
  - id: EMBEDDING_REINDEX_STARTED
    trigger: Eine Neueinbettung des Vektorindex wird gestartet
    payloadKeys: [dimensions, embeddedChunks, model, privateLibrariesCounted, totalChunks]
  - id: EMBEDDING_REINDEX_CANCELLED
    trigger: Eine laufende Neueinbettung wird abgebrochen
    payloadKeys: [dimensions, embeddedChunks, model, privateLibrariesCounted, totalChunks]
  - id: EMBEDDING_REINDEX_COMPLETED
    trigger: Eine Neueinbettung endet mit Umschaltung oder Fehler (Systemvorgang)
    payloadKeys: [status]
  - id: UPLOAD_ORPHAN_ORIGINALS_DELETED
    trigger: Verwaiste Originale werden aus der Originalablage entfernt
    details: Die entfernten Ablageorte
    payloadKeys: [deleted, deletedCount, requestedCount, skippedCount]
  - id: MALWARE_DETECTED
    trigger: >-
      Die Virenprüfung meldet in einer Datei, die in eine Bibliothek aufgenommen werden soll, ein
      Schadprogramm; die Datei wird nicht aufgenommen (Systemvorgang)
    details: >-
      Bibliothek als Objekt, Name der Signatur und Art der Quelle; bei einer privaten Bibliothek
      statt der Bibliothek die Virenprüfung selbst als Objekt und nur die Art der Quelle; weder
      Dateiname noch die Person, die die Datei hochgeladen hat. Dieselbe unveränderte Datei erzeugt
      keinen weiteren Eintrag
    payloadKeys: [signature, sourceType]
  - id: DOCUMENT_METADATA_CHANGED
    trigger: Eine Person setzt, ändert oder entfernt einen Kernmetadatenwert von Hand
    details: Dokument, Feld, alter und neuer Wert; Sammelzuweisungen über correlation_ref
    payloadKeys:
      - confidence
      - datePrecision
      - displayValue
      - documentId
      - extractionVersion
      - fieldKey
      - fileName
      - modelId
      - origin
      - state
      - value
  - id: BRANDING_SETTINGS_CHANGED
    trigger: Das Erscheinungsbild (Name, Claim, Logo, Farben) ändert sich
    payloadKeys:
      - aiNotice
      - claim
      - defaultColorScheme
      - loginBackgroundContentType
      - loginBackgroundVersion
      - loginLogoContentType
      - loginLogoVersion
      - logoContentType
      - logoVersion
      - primaryColor
      - productName
  - id: OIDC_PROVIDER_CREATED
    trigger: Ein Identitätsanbieter wird angelegt
    payloadKeys:
      - auditorRole
      - clientId
      - displayName
      - displayNameClaim
      - emailClaim
      - enabled
      - groupsClaim
      - isDefault
      - isExternal
      - issuerUri
      - jwkSetUri
      - providerType
      - rolesClaim
      - sortOrder
      - systemAdminRole
  - id: OIDC_PROVIDER_CHANGED
    trigger: Ein Identitätsanbieter oder sein Verzeichniszugang wird geändert
    details: >-
      Das Geheimnis des Dienstkontos nur als „gesetzt“ oder „geändert“ (clientSecretChange), nie mit
      dem Wert
    payloadKeys:
      - auditorRole
      - baseUrl
      - clientId
      - clientSecretChange
      - connectorType
      - directorySyncEnabled
      - directorySyncIntervalMinutes
      - displayName
      - displayNameClaim
      - emailClaim
      - enabled
      - groupsClaim
      - isDefault
      - isExternal
      - issuerUri
      - jwkSetUri
      - providerType
      - rolesClaim
      - sortOrder
      - systemAdminRole
  - id: OIDC_PROVIDER_DELETED
    trigger: Ein Identitätsanbieter wird gelöscht
    payloadKeys:
      - auditorRole
      - clientId
      - displayName
      - displayNameClaim
      - emailClaim
      - enabled
      - groupsClaim
      - isDefault
      - isExternal
      - issuerUri
      - jwkSetUri
      - providerType
      - rolesClaim
      - sortOrder
      - systemAdminRole
  - id: OIDC_PROVIDER_ENABLED
    trigger: Ein Identitätsanbieter wird eingeschaltet
    payloadKeys: [enabled]
  - id: OIDC_PROVIDER_DISABLED
    trigger: Ein Identitätsanbieter wird ausgeschaltet
    payloadKeys: [enabled]
  - id: LLM_MODEL_CREATED
    trigger: Ein Chatmodell wird in der Modellverwaltung angelegt
    details: Der Zugangsschlüssel nur als „gesetzt ja/nein“ und als „gesetzt“ (apiKeyChange)
    payloadKeys:
      [active, apiKeyChange, apiKeySet, baseUrl, displayName, maxTokens, modelIdentifier, temperature]
  - id: LLM_MODEL_CHANGED
    trigger: Ein Chatmodell wird geändert
    details: >-
      Der Zugangsschlüssel nur als „gesetzt ja/nein“ und, wenn er sich ändert, als „gesetzt“,
      „geändert“ oder „entfernt“ (apiKeyChange), nie mit dem Wert
    payloadKeys:
      [active, apiKeyChange, apiKeySet, baseUrl, displayName, maxTokens, modelIdentifier, temperature]
  - id: LLM_MODEL_DELETED
    trigger: Ein Chatmodell wird gelöscht
    payloadKeys: [active, apiKeySet, baseUrl, displayName, maxTokens, modelIdentifier, temperature]
  - id: LLM_MODEL_ACTIVATED
    trigger: Ein Chatmodell wird zum systemweit aktiven Modell
    payloadKeys: [active]
  - id: LLM_MODEL_DEACTIVATED
    trigger: Ein Chatmodell ist nicht mehr aktiv, weil ein anderes aktiviert wurde
    payloadKeys: [active]
  - id: DIAGNOSTIC_IMPERSONATION_GRANTED
    trigger: Die Befugnis „Sicht als“ wird einer Person erteilt
    payloadKeys: [revoked, scopeGroupId, validFrom, validUntil]
  - id: DIAGNOSTIC_IMPERSONATION_REVOKED
    trigger: Die Befugnis „Sicht als“ wird vor Ablauf widerrufen
    payloadKeys: [revoked, scopeGroupId, validFrom, validUntil]
  - id: DIAGNOSTIC_CONTEXT_RETENTION_CHANGED
    trigger: Die Aufbewahrungsfrist des Diagnoseprotokolls ändert sich
    payloadKeys: [retentionMonths]
  - id: LIBRARY_DIAGNOSTICS_LOCK_CHANGED
    trigger: Die Diagnosesperre einer Bibliothek wird gesetzt oder aufgehoben
    payloadKeys: [diagnosticsLocked]
  - id: SEARCH_DIAGNOSIS_PROFILE_RUN
    trigger: Eine Suchdiagnose läuft im Rechtekontext einer Gruppe und eines Space
    payloadKeys: [profileGroupId, profileName, spaceName]
  - id: AUDIT_LOG_ACCESSED
    trigger: Protokolldaten werden gelesen, ausgewertet oder exportiert, auch abgewiesen
    details: Abfrageweg, Zeitraum, Anlass und Umfang
    payloadKeys:
      - accessPath
      - correlationRef
      - eventId
      - eventType
      - from
      - month
      - objectId
      - objectType
      - scopeId
      - to
  - id: PERMISSION_HISTORY_ACCESSED
    trigger: Eine Stichtagsauskunft aus der Rechtehistorie wird abgerufen, auch abgewiesen
    payloadKeys: [accessPath, from, objectId, objectType, to]
  - id: CONNECTION_LOG_ACCESSED
    trigger: Das Verbindungsprotokoll wird gelesen, auch abgewiesen
    details: Zeitraum und Filter
    payloadKeys: [accessPath, eventType, from, profileId, to]
  - id: CONNECTION_LOG_RETENTION_CHANGED
    trigger: Die Aufbewahrungsfrist des Verbindungsprotokolls ändert sich
    payloadKeys: [retentionMonths]
  - id: OUTBOUND_PROXY_CHANGED
    trigger: Der hausweite Ausgangsproxy oder seine Ausnahmeliste ändert sich
    payloadKeys: [noProxy, proxyUrl]
  - id: LOCAL_SESSION_REVOKED
    trigger: Sitzungen eines lokalen Kontos werden fremdveranlasst beendet
    details: Grund in after; die eigene Abmeldung erzeugt keinen Eintrag
    payloadKeys: [reason]
  - id: LOCAL_PASSWORD_CHANGED
    trigger: Eine Person ändert ihr Passwort
  - id: LOCAL_ADMIN_SEEDED
    trigger: Das Notanker-Konto der Systemverwaltung wird beim ersten Start angelegt
    payloadKeys: [passwordSource, state]
  - id: LOCAL_ADMIN_RESET
    trigger: Das Notanker-Konto wird per Startschalter wiederhergestellt
    payloadKeys: [passwordSource, recreated]
  - id: LOCAL_BOOTSTRAP_ACCOUNT_LOGIN
    trigger: Erfolgreiche Anmeldung mit dem Notanker-Konto
  - id: INSTALLATION_STEP_SAVED
    trigger: Ein Schritt der Erstinstallation wird gespeichert
    details: >-
      Schritt und Werte vorher und nachher, ohne die Adresse des ersten Kontos und ohne Passwort
      oder Schlüssel, nur ob eines gesetzt ist
    payloadKeys: [apiKeySet, baseUrl, issuerUri, model, passwordSet, signInMode, step]
  - id: INSTALLATION_STEP_CHECKED
    trigger: Die Prüfung eines Schritts der Erstinstallation läuft
    payloadKeys: [step, succeeded]
  - id: INSTALLATION_COMPLETED
    trigger: Die Erstinstallation wird abgeschlossen, genau einmal je Installation
    payloadKeys: [signInMode, source]
  - id: LOCAL_ACCOUNTS_ENABLED
    trigger: Die lokale Kontenverwaltung wird eingeschaltet
    payloadKeys: [enabled]
  - id: LOCAL_ACCOUNTS_DISABLED
    trigger: Die lokale Kontenverwaltung wird ausgeschaltet
    payloadKeys: [enabled, revokedSessions]
  - id: LOCAL_ACCOUNT_LOCKED_AFTER_FAILED_LOGINS
    trigger: Ein lokales Konto wird nach zu vielen Fehlversuchen gesperrt
    details: Kein Zähler, kein einzelner Fehlversuch
    payloadKeys: [lockedReason, lockoutUntil]
  - id: MAIL_SETTINGS_CHANGED
    trigger: Die SMTP-Einstellungen ändern sich, auch wenn sich nur das Passwort ändert
    details: >-
      Das Passwort nur als „gesetzt ja/nein“ und, wenn es sich ändert, als „gesetzt“, „geändert“
      oder „entfernt“ (passwordChange), nie mit dem Wert
    payloadKeys:
      [enabled, encryption, fromAddress, fromName, host, passwordChange, passwordSet, port, username]
  - id: MAIL_TEMPLATE_CHANGED
    trigger: Eine Mail-Vorlage wird überschrieben; eine unveränderte Fassung erzeugt keinen Eintrag
    details: >-
      Betreff, Text und HTML-Teil vorher und nachher nur als SHA-256 und Länge, nie im Wortlaut;
      vorher die ausgelieferte Fassung, solange keine eigene gespeichert war (overridden)
    payloadKeys:
      - bodyHtmlLength
      - bodyHtmlSha256
      - bodyPlainLength
      - bodyPlainSha256
      - overridden
      - subjectLength
      - subjectSha256
  - id: MAIL_TEMPLATE_RESET
    trigger: Eine überschriebene Mail-Vorlage wird zurückgesetzt
    details: >-
      Betreff und Text der eigenen Fassung vorher und der ausgelieferten nachher, nur als SHA-256
      und Länge
    payloadKeys:
      - bodyHtmlLength
      - bodyHtmlSha256
      - bodyPlainLength
      - bodyPlainSha256
      - overridden
      - subjectLength
      - subjectSha256
  - id: MAIL_TEST_SENT
    trigger: Die Systemverwaltung löst einen Testversand aus
  - id: LOCAL_USER_CREATED
    trigger: Die Systemverwaltung legt ein lokales Konto an
    details: Modus und Ablauf; nie Adresse, Name oder Anlagegrund
    payloadKeys: [expiresAt, mode]
  - id: LOCAL_USER_INVITED
    trigger: Ein Einladungslink wird ausgestellt
    details: Zustellweg (MAIL_SENT, MAIL_FAILED, LINK_DISPLAYED)
    payloadKeys: [deliveryPath]
  - id: LOCAL_USER_CHANGED
    trigger: Die Systemverwaltung ändert ein lokales Konto
    details: Vorher/Nachher nur für das Ablaufdatum, sonst nur Feldnamen
    payloadKeys: [changedFields, expiresAt]
  - id: LOCAL_USER_LOCKED
    trigger: Ein lokales Konto wird durch die Verwaltung oder wegen Inaktivität gesperrt
    details: after.reason ADMIN oder INACTIVITY
    payloadKeys: [reason]
  - id: LOCAL_USER_UNLOCKED
    trigger: Ein lokales Konto wird entsperrt
    payloadKeys: [lockedReason]
  - id: LOCAL_USER_PASSWORD_RESET_REQUESTED
    trigger: Die Systemverwaltung stellt einen Rücksetzlink aus
    payloadKeys: [deliveryPath]
  - id: LOCAL_USER_PASSWORD_GENERATED
    trigger: Die Systemverwaltung setzt ein erzeugtes Passwort
  - id: LOCAL_USER_DELETED
    trigger: Ein lokales Konto, auf das nichts verweist, wird gelöscht
    payloadKeys: [state, systemRole]
  - id: LOCAL_ACCOUNTS_SETTINGS_CHANGED
    trigger: Die Einstellungen der lokalen Kontenverwaltung ändern sich
    payloadKeys:
      - defaultExpiryDays
      - inactiveDays
      - invitationTokenTtlHours
      - passwordMinLength
      - passwordResetEnabled
      - resetTokenTtlMinutes
      - selfRegistrationAllowedDomains
      - selfRegistrationEnabled
  - id: LOCAL_PASSWORD_SET
    trigger: Eine Person setzt ihr Passwort über einen Einladungs- oder Rücksetzlink
    payloadKeys: [purpose]
  - id: LOCAL_USER_REGISTERED
    trigger: Ein lokales Konto entsteht durch Selbstregistrierung
    payloadKeys: [expiresAt]
  - id: LOCAL_USER_HANDOVER_REQUESTED
    trigger: Die Übergabe eines lokalen Kontos an eine Anbieteridentität wird angestoßen
    details: Anbieter-Kennung und Zustellweg, nie das Subject
    payloadKeys: [deliveryPath, providerId]
  - id: LOCAL_USER_HANDED_OVER
    trigger: Die Person schließt die Übergabe an die Anbieteridentität ab
    payloadKeys:
      - groupMemberships
      - personalSpace
      - providerId
      - revokedSessions
      - spaceMemberships
      - systemRole
  - id: EXTERNAL_ACCESS_SETTINGS_CHANGED
    trigger: Die Einstellungen für externe KI-Werkzeuge ändern sich
    details: >-
      Vorher/Nachher der geänderten Schlüssel; der Einleitungstext nur als SHA-256 und Länge, nie im
      Wortlaut
    payloadKeys:
      - allowedCidrs
      - enabled
      - massRetrievalAlertThreshold
      - serverInstructionsLength
      - serverInstructionsSha256
      - tokenMaxLifetimeDays
      - tokenRateLimitPerHour
  - id: CONNECTION_PROFILE_CREATED
    trigger: Ein Verbindungsprofil wird angelegt
    details: Das Client-Geheimnis nur als „gesetzt“ (clientSecretChange), nie mit dem Wert
    payloadKeys:
      - authMethod
      - authorizationEndpoint
      - clientIdSet
      - clientSecretChange
      - clientSecretSet
      - connectorSettingsSet
      - issuer
      - kind
      - name
      - ownership
      - responsibleGroupId
      - revocationEndpoint
      - scopesSet
      - serverUrl
      - sourceType
      - tenantSet
      - tokenEndpoint
  - id: CONNECTION_PROFILE_CHANGED
    trigger: Ein Verbindungsprofil wird geändert
    details: >-
      Zahl der Verbindungen, die ihr Geheimnis verloren; das Client-Geheimnis nur als „gesetzt“,
      „geändert“ oder „entfernt“ (clientSecretChange), nie mit dem Wert
    payloadKeys:
      - authMethod
      - authorizationEndpoint
      - clientIdSet
      - clientSecretChange
      - clientSecretSet
      - connectionsDiscarded
      - connectorSettingsSet
      - issuer
      - kind
      - name
      - ownership
      - responsibleGroupId
      - revocationEndpoint
      - scopesSet
      - serverUrl
      - sourceType
      - tenantSet
      - tokenEndpoint
  - id: CONNECTION_PROFILE_DELETED
    trigger: Ein Verbindungsprofil wird gelöscht
    payloadKeys:
      - authMethod
      - authorizationEndpoint
      - clientIdSet
      - clientSecretSet
      - connectionsRemoved
      - connectorSettingsSet
      - issuer
      - kind
      - name
      - ownership
      - responsibleGroupId
      - revocationEndpoint
      - scopesSet
      - serverUrl
      - sourceType
      - tenantSet
      - tokenEndpoint
  - id: CONNECTION_PROFILE_DISCONNECTED
    trigger: Die Notabschaltung „Alle Verbindungen trennen“ verwirft alle Geheimnisse eines Profils
    payloadKeys: [clientSecretDeleted, connectionsDisconnected]
  - id: CONNECTOR_LOCKED
    trigger: Ein Konnektortyp oder Verbindungsprofil wird gesperrt
    payloadKeys: [kind, profile, sourceType]
  - id: CONNECTOR_UNLOCKED
    trigger: Eine Konnektorsperre wird aufgehoben
    payloadKeys: [kind, profile, sourceType]
  - id: CONNECTOR_PROFILE_REQUIRED
    trigger: Ein Konnektortyp ist nur noch über Zugänge nutzbar
    payloadKeys: [ownAddressStock, profileRequired, sourceType]
  - id: CONNECTOR_PROFILE_OPTIONAL
    trigger: Ein Konnektortyp ist wieder mit eigener Adresse nutzbar
    payloadKeys: [ownAddressStock, profileRequired, sourceType]
  - id: CONNECTION_PROFILE_REQUEST_RESOLVED
    trigger: Nicht mehr geschrieben; frühere Erledigung einer Profilanfrage
  - id: CONNECTION_PROFILE_SIGN_IN_TESTED
    trigger: Die Systemverwaltung testet die Anmeldung eines Profils
    payloadKeys: [success]
  - id: DATA_COLLECTION_DISCLOSURE_EXPORTED
    trigger: >-
      Die Auskunft über die Datenerhebung samt Konfigurationsexport der Installation wird
      abgerufen, auch abgewiesen
    details: >-
      Das Format (JSON oder Markdown) und der Berichtszeitraum (erster und letzter Tag); nie der
      Inhalt der Auskunft
    payloadKeys: [format, periodFrom, periodTo]
  - id: SELF_DISCLOSURE_EXPORT_STARTED
    trigger: Eine Person beginnt den Export ihrer Selbstauskunft (Einlösen des Einmal-Tickets)
    details: >-
      Handelnde, betroffene Person und Kontoobjekt sind die Person selbst; after nennt die
      Kategorien, correlation_ref den Export. Kein Inhalt, keine Datensatzzahlen, keine Netzadresse.
      Ein Beginn ohne Ende heißt abgebrochen mit der Instanz; abgewiesene Versuche schreiben kein
      Ereignis
    purpose: >-
      Nachweis gegenüber der Revision, dass und wann eine Selbstauskunft gestartet wurde, etwa
      wenn eine Person bestreitet, sie selbst ausgelöst zu haben
    readers:
      - AUDITOR über die Wege nach Zeitraum, Ereignisart und Vorgang, nicht nach Objekt
      - AUDITOR in der freigegebenen anlassbezogenen Klärung über die Person
      - die Person selbst in ihrer nächsten Selbstauskunft
    payloadKeys: [categories]
  - id: SELF_DISCLOSURE_EXPORT_FINISHED
    trigger: Der Export einer Selbstauskunft endet, vollständig ausgeliefert oder abgebrochen
    details: >-
      after trägt Ergebnis (COMPLETED oder ABORTED), Abbruchgrund (CLIENT_DISCONNECTED, TIMEOUT,
      SHUTDOWN, ERROR), ausgelieferte Bytes, deren SHA-256-Prüfsumme und die Kategorien; die
      Prüfsumme steht nicht im ZIP. Kein Inhalt, keine Datensatzzahlen, keine Netzadresse
    purpose: >-
      Nachweis gegenüber der Revision, was als Selbstauskunft ausgeliefert wurde (Größe und
      Prüfsumme), ohne den Inhalt zu speichern
    readers:
      - AUDITOR über die Wege nach Zeitraum, Ereignisart und Vorgang, nicht nach Objekt
      - AUDITOR in der freigegebenen anlassbezogenen Klärung über die Person
      - die Person selbst in ihrer nächsten Selbstauskunft
    payloadKeys: [abortCause, bytes, categories, result, sha256]
  - id: SELF_DISCLOSURE_SETTINGS_CHANGED
    trigger: Die Systemverwaltung schaltet die Selbstauskunft um oder ändert ihre Tagesgrenze
    details: Vorher/Nachher der geänderten Schlüssel (enabled, dailyLimit)
    payloadKeys: [dailyLimit, enabled]
  - id: LINK_TARGETS_CHANGED
    trigger: Die Systemverwaltung ändert die erlaubten Linkziele in Antworten
    details: Vorher/Nachher der ganzen Liste (allowedOrigins)
    payloadKeys: [allowedOrigins]
  - id: SETTINGS_IMPORTED
    trigger: >-
      Die Systemverwaltung importiert eine Einstellungsdatei, und der Import ändert etwas; ein Import
      ohne Änderung erzeugt keinen Eintrag
    details: >-
      Version des Dateiformats und die geänderten Abschnitte; jede einzelne Änderung steht als ihr
      eigenes Ereignis mit Vorher/Nachher daneben, unter derselben Vorgangskennung
    payloadKeys: [formatVersion, sections]
