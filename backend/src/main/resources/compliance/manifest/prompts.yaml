title: System-Prompts und KI-Funktionen
prompts:
  - id: answer-generation
    purpose: >-
      Regeln für die Antwort auf eine Frage: Belegpflicht, Zitierformat, Antwortsprache, Anweisung
      des Space und Gesprächsnotiz
    classes:
      - io.opaa.query.answer.AnswerGenerationService
      - io.opaa.query.answer.SpaceInstructionBlock
      - io.opaa.retrieval.ConversationNoteBlock
    sha256: "7865e8d0e67c5cbc648aeeba6ceba4890346212412e02d67e332e51d78651e20"
  - id: query-decomposition
    purpose: Zerlegt eine Frage mit dem Gesprächsverlauf in Suchanfragen oder erkennt „keine Suche“
    classes:
      - io.opaa.retrieval.search.QueryDecompositionService
      - io.opaa.retrieval.search.DecompositionContext
      - io.opaa.retrieval.ConversationNoteBlock
    sha256: "11aae7c367b2f10f4333a97c8dcfc54aa09c358cd37331e13fca72e16f87ba3e"
  - id: chat-title
    purpose: Erzeugt aus erster Frage und Antwort einen Titel für den Chat
    classes: [io.opaa.chat.ChatTitleGenerationService]
    sha256: "a7a8b336c74c1c23134bcf58a7d8d55738416eb20eb097343d41f16cf2b6bed1"
  - id: chat-note-extraction
    purpose: Verdichtet eine Nachricht zu Punkten der Gesprächsnotiz
    classes: [io.opaa.chat.ChatNoteExtraction]
    sha256: "b642eb44720453f950ce49d422dc2356c30d8df21460e7f00f4b5c8b3c930abb"
  - id: metadata-extraction
    purpose: Ordnet einem Dokument Metadatencodes und freie Schlagworte zu
    classes: [io.opaa.metadata.ModelExtractionPrompt]
    sha256: "e2b44a307f70ff0f67b0b695b594001c648e95d91858f23e073a2005e86699df"
  - id: tool-loop-spike
    purpose: Erprobung einer modellgesteuerten Suche mit Werkzeugaufrufen, standardmäßig aus
    classes:
      - io.opaa.query.spike.SpikeToolLoopQueryHandler
      - io.opaa.query.spike.SearchKnowledgeTool
    sha256: "f86c65c9c6773c6427efa3a8ad3b39f9c4a9c727b5380a23a197781a09ef9975"
  - id: mcp-tool-descriptions
    purpose: Beschreibungen der Werkzeuge, nach denen das Modell eines externen KI-Werkzeugs entscheidet
    classes: [io.opaa.mcp.McpToolCatalog]
    sha256: "fec039697767cfa1c9d308630815e3a5d6c76df463b0116d0c8bc9e984893801"
  - id: mcp-server-instructions
    purpose: >-
      Voreingestellter Einleitungstext an externe KI-Werkzeuge; die Systemverwaltung
      kann ihn ändern, die Änderung erzeugt keinen Protokolleintrag
    databaseDefault: external_access_settings.server_instructions
    sha256: "4f1638b7db75eaf01192f176e393cdd0ce7be59ab68af69c142f8d5d2fe4b38d"
aiFunctions:
  - id: chat-answer
    purpose: Beantwortet Fragen einer Person im Chat auf Grundlage der lesbaren Bibliotheken
    outputKind: TEXT
    interactsWithPersons: true
    assessesPersons: false
    labelling: >-
      Keine ausdrückliche Kennzeichnung als KI-erzeugt; die Antwort erscheint im Chat als Antwort
      des Assistenten mit Fundstellen
    prompts: [answer-generation, query-decomposition]
  - id: chat-title
    purpose: Schlägt den Titel eines Chats vor
    outputKind: TEXT
    interactsWithPersons: false
    assessesPersons: false
    labelling: Keine Kennzeichnung; die Person kann den Titel ändern
    prompts: [chat-title]
  - id: chat-note-extraction
    purpose: Hält Rahmenangaben und Wünsche der Person als Gesprächsnotiz fest
    outputKind: TEXT
    interactsWithPersons: false
    assessesPersons: false
    labelling: Die Notiz ist im Chat sichtbar und bearbeitbar; keine Kennzeichnung als KI-erzeugt
    prompts: [chat-note-extraction]
  - id: metadata-extraction
    purpose: Erschließt Metadaten und Schlagworte von Dokumenten bei der Indexierung
    outputKind: TEXT
    interactsWithPersons: false
    assessesPersons: false
    labelling: >-
      Modellgesetzte Werte sind mit ihrer Herkunft (origin) und einer Konfidenz gespeichert;
      eine Kennzeichnung als KI-erzeugt in der Oberfläche ist nicht erhoben
    prompts: [metadata-extraction]
    notes:
      - Der Prompt verbietet Personennamen als Schlagworte
  - id: tool-loop-spike
    purpose: Erprobung, nur mit Präfix „@test “ und eingeschaltetem Schalter
    outputKind: TEXT
    interactsWithPersons: true
    assessesPersons: false
    labelling: Wie die Chat-Antwort
    prompts: [tool-loop-spike]
  - id: speech-transcription
    purpose: Wandelt eine Sprachaufnahme der Person in Text für die Eingabe um (Diktat)
    outputKind: TEXT
    interactsWithPersons: true
    assessesPersons: false
    labelling: Der Text erscheint im Eingabefeld und wird von der Person selbst abgeschickt
    prompts: []
