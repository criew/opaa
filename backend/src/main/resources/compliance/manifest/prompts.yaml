title: System-Prompts und KI-Funktionen
prompts:
  - id: answer-generation
    purpose: >-
      Regeln für die Antwort auf eine Frage: Belegpflicht, Zitierformat, Antwortsprache, Anweisung
      des Space und Gesprächsnotiz; die Fundstellen stehen als gekennzeichnete Daten in einem
      Block mit Kennung je Anfrage, mit dem Hinweis, dass ihr Inhalt keine Anweisung ist
    classes:
      - io.opaa.query.answer.AnswerGenerationService
      - io.opaa.common.ContentFence
      - io.opaa.common.PromptText
      - io.opaa.query.answer.DocumentBlock
      - io.opaa.query.answer.PassageRules
      - io.opaa.query.answer.SpaceInstructionBlock
      - io.opaa.retrieval.ConversationNoteBlock
    sha256: "1641942805a2aef568eeec580c0f273eaa45c1ad751a86a6d48c075febb45e15"
  - id: query-decomposition
    purpose: Zerlegt eine Frage mit dem Gesprächsverlauf in Suchanfragen oder erkennt „keine Suche“
    classes:
      - io.opaa.retrieval.search.QueryDecompositionService
      - io.opaa.retrieval.search.DecompositionContext
      - io.opaa.retrieval.ConversationNoteBlock
      - io.opaa.common.PromptText
    sha256: "69e776f659a9e6f200dbac6da39a4661b86395f58beb2bb6faa41d9f571f8643"
  - id: chat-title
    purpose: Erzeugt aus erster Frage und Antwort einen Titel für den Chat
    classes: [io.opaa.chat.ChatTitleGenerationService]
    sha256: "a7a8b336c74c1c23134bcf58a7d8d55738416eb20eb097343d41f16cf2b6bed1"
  - id: chat-note-extraction
    purpose: Verdichtet eine Nachricht zu Punkten der Gesprächsnotiz
    classes: [io.opaa.chat.ChatNoteExtraction]
    sha256: "b642eb44720453f950ce49d422dc2356c30d8df21460e7f00f4b5c8b3c930abb"
  - id: metadata-extraction
    purpose: Ordnet einem Dokument Metadatencodes und freie Schlagworte zu
    classes:
      - io.opaa.metadata.ModelExtractionPrompt
      - io.opaa.common.ContentFence
      - io.opaa.common.PromptText
    sha256: "91af4169c942a12372b950ab4611af05805377f17a883a7f23071857d78c688e"
  - id: agent-run
    purpose: >-
      Regeln für einen Agentenlauf: Werkzeuge in Schritten nutzen, Belegpflicht, Antwortsprache,
      Anweisung des Agenten und des Space, Gesprächsnotiz; dazu die Beschreibungen der Werkzeuge,
      nach denen das Modell entscheidet. Fundstellen kommen als gekennzeichnete Daten zurück, mit
      dem Hinweis, dass ihr Inhalt keine Anweisung ist
    classes:
      - io.opaa.query.toolloop.AgentPrompt
      - io.opaa.query.toolloop.AgentToolCallback
      - io.opaa.query.toolloop.SearchKnowledgeTool
      - io.opaa.query.toolloop.ReadDocumentTool
      - io.opaa.query.toolloop.ListSourcesTool
      - io.opaa.query.toolloop.RunCodeTool
      - io.opaa.query.toolloop.FillTemplateTool
      - io.opaa.query.toolloop.AskUserTool
      - io.opaa.query.answer.PassageRules
      - io.opaa.query.answer.DocumentBlock
      - io.opaa.query.answer.SpaceInstructionBlock
      - io.opaa.retrieval.ConversationNoteBlock
      - io.opaa.common.ContentFence
      - io.opaa.common.PromptText
    sha256: "c5d6f67fd91d85f3d5af4c5777005e9055818a0f893d8ccedbcca9d3f540112b"
  - id: mcp-tool-descriptions
    purpose: Beschreibungen der Werkzeuge, nach denen das Modell eines externen KI-Werkzeugs entscheidet
    classes: [io.opaa.mcp.McpToolCatalog]
    sha256: "fec039697767cfa1c9d308630815e3a5d6c76df463b0116d0c8bc9e984893801"
  - id: mcp-server-instructions
    purpose: >-
      Voreingestellter Einleitungstext an externe KI-Werkzeuge; die Systemverwaltung
      kann ihn ändern, die Änderung erzeugt keinen Protokolleintrag
    databaseDefault: external_access_settings.server_instructions
    sha256: "4f1638b7db75eaf01192f176e393cdd0ce7be59ab68af69c142f8d5d2fe4b38d"
  - id: text-recognition-vision
    purpose: >-
      Bittet ein Vision-Modell der Texterkennung, den Text einer gescannten Seite wortgetreu und
      ohne Zusätze wiederzugeben
    classes: [io.opaa.llm.textrecognition.TextRecognitionVisionPrompt]
    sha256: "54c5316716f8591a052e95ac0bc9b407d3368585aac9ec47d8feec423fd422bb"
aiFunctions:
  - id: chat-answer
    purpose: Beantwortet Fragen einer Person im Chat auf Grundlage der lesbaren Bibliotheken
    outputKind: TEXT
    interactsWithPersons: true
    assessesPersons: false
    labelling: >-
      Hinweis zur KI-Nutzung im Chat vor der ersten Frage und unter dem Eingabefeld, Kennzeichen
      „KI-erzeugt“ an jeder Antwort, Feld generatedByAi in der API und in der Selbstauskunft, Vermerk
      beim Kopierknopf; keine Markierung im Antworttext
    prompts: [answer-generation, query-decomposition]
  - id: chat-title
    purpose: Schlägt den Titel eines Chats vor
    outputKind: TEXT
    interactsWithPersons: false
    assessesPersons: false
    labelling: Keine Kennzeichnung; die Person kann den Titel ändern
    prompts: [chat-title]
  - id: chat-note-extraction
    purpose: Hält Rahmenangaben und Wünsche der Person als Gesprächsnotiz fest
    outputKind: TEXT
    interactsWithPersons: false
    assessesPersons: false
    labelling: Die Notiz ist im Chat sichtbar und bearbeitbar; keine Kennzeichnung als KI-erzeugt
    prompts: [chat-note-extraction]
  - id: metadata-extraction
    purpose: Erschließt Metadaten und Schlagworte von Dokumenten bei der Indexierung
    outputKind: TEXT
    interactsWithPersons: false
    assessesPersons: false
    labelling: >-
      Modellgesetzte Werte sind mit ihrer Herkunft (origin) und einer Konfidenz gespeichert;
      eine Kennzeichnung als KI-erzeugt in der Oberfläche ist nicht erhoben
    prompts: [metadata-extraction]
    notes:
      - Der Prompt verbietet Personennamen als Schlagworte
  - id: agent-run
    purpose: >-
      Bearbeitet eine Frage im Chat in mehreren Schritten mit Werkzeugen, wenn die Person einen
      Agenten mit @ wählt; nur bei eingeschalteten Agenten der Installation
    outputKind: TEXT
    interactsWithPersons: true
    assessesPersons: false
    labelling: >-
      Wie die Chat-Antwort; zusätzlich nennt die Frage den gewählten Agenten und die Antwort zeigt
      die Schritte des Laufs
    prompts: [agent-run]
  - id: speech-transcription
    purpose: Wandelt eine Sprachaufnahme der Person in Text für die Eingabe um (Diktat)
    outputKind: TEXT
    interactsWithPersons: true
    assessesPersons: false
    labelling: Der Text erscheint im Eingabefeld und wird von der Person selbst abgeschickt
    prompts: []
  - id: text-recognition
    purpose: >-
      Liest den Text gescannter PDF-Seiten beim Indizieren, damit sie durchsuchbar werden
      (Texterkennung, OCR)
    outputKind: TEXT
    interactsWithPersons: false
    assessesPersons: false
    labelling: >-
      Jeder Abschnitt aus erkanntem Text trägt den Vermerk der Texterkennung mit Verfahren, den der
      Beleg weitergibt; das Original bleibt maßgeblich und abrufbar, der erkannte Text dient nur der
      Suche und als Fundstelle
    prompts: [text-recognition-vision]
