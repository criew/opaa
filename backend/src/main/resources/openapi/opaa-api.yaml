openapi: 3.0.3
info:
  title: OPAA API
  description: Open Project AI Assistant REST API
  version: 0.1.0
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html

paths:
  /api/health:
    get:
      operationId: getHealth
      tags: [system]
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/query:
    post:
      operationId: submitQuery
      tags: [query]
      summary: Ask a question against indexed documents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
      responses:
        "200":
          description: Query answered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/config:
    get:
      operationId: getAuthConfig
      tags: [auth]
      summary: Get authentication configuration
      responses:
        "200":
          description: Authentication configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthConfigResponse"

  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current user info
      responses:
        "200":
          description: Current user information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfoResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/me/groups:
    get:
      operationId: listMyGroups
      tags: [auth]
      summary: >
        List the groups the caller is a direct member of - deliberately not admin-restricted,
        unlike GET /api/v1/admin/groups. Any authenticated user needs their own group membership
        to choose a group owner when creating a knowledge library (see the library ownership
        picker in the frontend); listGroups requires SYSTEM_ADMIN and returns every group in the
        organization regardless of membership, so it cannot serve that purpose. Reuses
        GroupListResponse rather than a slimmer schema: every field on it (including externalId,
        the directory objectGUID, and memberCount) describes a group the caller already belongs
        to and can already see the name and kind of, so nothing here exposes information the
        caller could not already infer; a second schema would only duplicate the first for no
        access-control benefit.
      responses:
        "200":
          description: Groups the caller is a member of
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/admin/users:
    get:
      operationId: listUsers
      tags: [admin]
      summary: List all users (system admin only)
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserInfoResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/users/{id}/role:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      operationId: changeUserRole
      tags: [admin]
      summary: Change a user's system role (system admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleChangeRequest"
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfoResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/groups:
    get:
      operationId: listGroups
      tags: [admin]
      summary: List groups in the caller's organization (system admin only)
      responses:
        "200":
          description: List of groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupListResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      operationId: createGroup
      tags: [admin]
      summary: Create an ad-hoc group (system admin only)
      description: >
        Always creates a group of kind AD_HOC. Groups of kind ORG_UNIT are created only by
        directory synchronisation (see #237) and cannot be created through this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupRequest"
      responses:
        "201":
          description: Group created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/groups/{groupId}:
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: getGroup
      tags: [admin]
      summary: Get group details (system admin only)
      responses:
        "200":
          description: Group details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: updateGroup
      tags: [admin]
      summary: Rename an ad-hoc group or change its description (system admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupUpdateRequest"
      responses:
        "200":
          description: Group updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: deleteGroup
      tags: [admin]
      summary: Delete an ad-hoc group (system admin only)
      responses:
        "204":
          description: Group deleted
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/groups/{groupId}/members:
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: listGroupMembers
      tags: [admin]
      summary: List group members (system admin only)
      responses:
        "200":
          description: List of members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupMemberResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      operationId: addGroupMember
      tags: [admin]
      summary: Add a member to an ad-hoc group (system admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupAddMemberRequest"
      responses:
        "201":
          description: Member added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupMemberResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/admin/groups/{groupId}/members/{userId}:
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    delete:
      operationId: removeGroupMember
      tags: [admin]
      summary: Remove a member from an ad-hoc group (system admin only)
      responses:
        "204":
          description: Member removed
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/directory-sync/dry-run:
    post:
      operationId: runDirectorySyncDryRun
      tags: [admin]
      summary: Compute the directory synchronisation diff without applying it (system admin only)
      description: >
        Fetches the current directory state and computes what would change, but never writes
        anything - not even when the run would otherwise be applicable. See #237.
      responses:
        "200":
          description: Dry-run report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectorySyncReportResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/directory-sync/run:
    post:
      operationId: runDirectorySync
      tags: [admin]
      summary: Run directory synchronisation and apply changes if plausible (system admin only)
      description: >
        Applies changes only if the directory is reachable, did not return an empty group list
        while ORG_UNIT groups already exist, and the fraction of memberships that would be
        removed does not exceed the configured threshold. Otherwise the run is aborted without
        writing anything, and the report explains why. See #237.
      responses:
        "200":
          description: Synchronisation report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectorySyncReportResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/directory-sync/status:
    get:
      operationId: getDirectorySyncStatus
      tags: [admin]
      summary: Get the outcome of the most recent directory synchronisation run (system admin only)
      responses:
        "200":
          description: Last known synchronisation status; all fields are null if no run has happened yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectorySyncStatusResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/spaces:
    get:
      operationId: listSpaces
      tags: [space]
      summary: List spaces the current user is a member of
      responses:
        "200":
          description: List of spaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SpaceListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      operationId: createSpace
      tags: [space]
      summary: Create a new space (project spaces are self-service, team spaces are system admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpaceRequest"
      responses:
        "201":
          description: Space created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/spaces/{spaceId}:
    parameters:
      - name: spaceId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: getSpace
      tags: [space]
      summary: Get space details
      responses:
        "200":
          description: Space details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: updateSpace
      tags: [space]
      summary: Update space name, description and visibility (admin or owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpaceUpdateRequest"
      responses:
        "200":
          description: Space updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

    delete:
      operationId: deleteSpace
      tags: [space]
      summary: Delete a space (owner or system admin only)
      responses:
        "204":
          description: Space deleted
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/spaces/{spaceId}/members:
    parameters:
      - name: spaceId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: listSpaceMembers
      tags: [space]
      summary: List space members
      responses:
        "200":
          description: List of members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SpaceMemberResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      operationId: addSpaceMember
      tags: [space]
      summary: Add a member to a space (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpaceAddMemberRequest"
      responses:
        "201":
          description: Member added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceMemberResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/spaces/{spaceId}/members/{userId}:
    parameters:
      - name: spaceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    delete:
      operationId: removeSpaceMember
      tags: [space]
      summary: Remove a member from a space (admin only)
      responses:
        "204":
          description: Member removed
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/spaces/{spaceId}/members/{userId}/role:
    parameters:
      - name: spaceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    put:
      operationId: updateSpaceMemberRole
      tags: [space]
      summary: Update a member's role (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpaceRoleUpdateRequest"
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceMemberResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/spaces/{spaceId}/transfer-ownership:
    parameters:
      - name: spaceId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      operationId: transferSpaceOwnership
      tags: [space]
      summary: Transfer space ownership to another member (owner or system admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpaceTransferOwnershipRequest"
      responses:
        "204":
          description: Ownership transferred
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/spaces/{spaceId}/chats:
    parameters:
      - name: spaceId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: listSpaceChats
      tags: [chat]
      summary: List the current user's own chats in this space (#525 - a chat is visible only to its author)
      responses:
        "200":
          description: List of the caller's chats in this space
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatSummary"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      operationId: createChat
      tags: [chat]
      summary: Create a new chat in this space (requires space membership)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCreateRequest"
      responses:
        "201":
          description: Chat created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/chats/{chatId}:
    parameters:
      - name: chatId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: getChat
      tags: [chat]
      summary: Get a chat with its messages - only the author may retrieve it, not even a space or system admin (#525)
      responses:
        "200":
          description: Chat with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatDetail"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      operationId: updateChat
      tags: [chat]
      summary: Update a chat's title, useKnowledge switch or sticky library references - author only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatUpdateRequest"
      responses:
        "200":
          description: Chat updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: deleteChat
      tags: [chat]
      summary: Delete a chat - author only
      responses:
        "204":
          description: Chat deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/libraries:
    get:
      operationId: listLibraries
      tags: [library]
      summary: List knowledge libraries the current user holds rights on - direct grant, grant to one of their groups, or organization-wide visibility (ownership is included, since creating a library grants the creator OWNER)
      responses:
        "200":
          description: List of libraries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LibraryListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      operationId: createLibrary
      tags: [library]
      summary: Create a new knowledge library, owned by the caller or by one of the caller's groups
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryRequest"
      responses:
        "201":
          description: Library created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/libraries/source-test:
    post:
      operationId: testLibrarySource
      tags: [library]
      summary: >
        Test a quellkonfiguration before a library is created (#514) - same permission bar as
        createLibrary (any authenticated user; there is no library yet to hold a role on).
      description: >
        Checks the given sourceType/sourcePath/sourceUrl/sourceProxy/sourceCredentials/
        sourceInsecureSsl combination the way the corresponding indexing run later would,
        using the same HTTP client building blocks (AutoindexCrawlerService.buildHttpClient)
        and, for FILESYSTEM, the same operator-configured allowlist (FilesystemPathAllowlist)
        createLibrary itself enforces - a path outside the allowlist is rejected with 400
        before anything on disk is touched, exactly like creation. sourceType UPLOAD has
        nothing to test and is rejected with 400. The response never reveals more about a
        FILESYSTEM directory than a count, and every failure message is German and intended
        to be shown to the caller as-is. HTTP_DIRECTORY/RSS_FEED response bodies are bounded
        the same way the RSS indexing run bounds them (opaa.indexing.rss.max-page-size-bytes/
        max-feed-size-bytes) - an unbounded read here would let a caller crash the server with
        a single oversized or endless response. This endpoint is rate-limited per IP and
        globally (opaa.rate-limit.source-test), same as the indexing trigger - it is a
        synchronous probe with its own outbound connections and short timeouts, not a
        replacement for #267's still-outstanding target validation (blocking internal/private
        address ranges) for HTTP_DIRECTORY/RSS_FEED, which this endpoint makes cheaper to
        reach than the indexing run it mirrors (see docs/features/knowledge-sources.md).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceConnectionTestRequest"
      responses:
        "200":
          description: >
            The test ran to completion - reachable distinguishes success from a diagnosed
            failure (see message); this is not itself an error response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceConnectionTestResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/libraries/{libraryId}:
    parameters:
      - name: libraryId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: getLibrary
      tags: [library]
      summary: Get library details
      responses:
        "200":
          description: Library details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: updateLibrary
      tags: [library]
      summary: Update library name, description, visibility and listed flag (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryUpdateRequest"
      responses:
        "200":
          description: Library updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: deleteLibrary
      tags: [library]
      summary: >
        Delete a library (owner only). A non-empty UPLOAD
        library is rejected with 409 (documents must be removed individually first). A non-empty
        connector library (FILESYSTEM/HTTP_DIRECTORY/RSS_FEED) is deleted together with its
        documents and vector store chunks - deleting individual connector documents would be
        undone by the next indexing run (ADR-0018, Entscheidung 5). The delete is also rejected
        with 409 while an indexing run for the library is RUNNING.
      responses:
        "204":
          description: Library deleted
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/libraries/{libraryId}/documents:
    parameters:
      - name: libraryId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: listLibraryDocuments
      tags: [library]
      summary: >
        List documents contained in a library, paged and optionally filtered by a case-insensitive
        substring of the file name (#517). Available for every sourceType, not just UPLOAD - a
        connector library's indexed bestand is just as visible here. Ordered by fileName ascending,
        id ascending as a tiebreaker - a deterministic total order, not just "ascending fileName":
        without it, LIMIT/OFFSET across two separate requests (e.g. two pages fetched moments
        apart, or the same page re-polled while indexing concurrently updates a row) has no
        guaranteed stable result in PostgreSQL and could return a document twice or skip it.
      parameters:
        - name: page
          in: query
          required: false
          description: Rejected with 400 if negative.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: Rejected with 400 outside 1..100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: q
          in: query
          required: false
          description: Case-insensitive substring match against the document's file name.
          schema:
            type: string
      responses:
        "200":
          description: Page of documents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryDocumentPageResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      operationId: uploadLibraryDocument
      tags: [library]
      summary: >
        Upload a document into a library (EDITOR role or above required). Only accepted for
        libraries with sourceType UPLOAD - a connector library (FILESYSTEM/HTTP_DIRECTORY/
        RSS_FEED) rejects the upload with 409 (ADR-0018, #479). Processed through the same
        indexing pipeline (chunking, checksum, metadata) used by the other ingestion paths.
        Malware scanning is explicitly out of scope - see #420.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Document uploaded and indexed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryDocumentResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  /api/v1/libraries/{libraryId}/documents/{documentId}:
    parameters:
      - name: libraryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    delete:
      operationId: deleteLibraryDocument
      tags: [library]
      summary: >
        Remove a document from a library (EDITOR role or above required): the document row, its
        chunks in the vector store, and the stored file.
      responses:
        "204":
          description: Document deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/libraries/{libraryId}/grants:
    parameters:
      - name: libraryId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: listAssetGrants
      tags: [library]
      summary: >
        List the grants on a library (MANAGER role or above required). See
        docs/features/spaces-and-assets.md#asset-rollen.
      responses:
        "200":
          description: List of grants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssetGrantResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      operationId: upsertAssetGrant
      tags: [library]
      summary: >
        Grant (or update the role of) a user or group on a library (MANAGER role or above
        required). Idempotent per subject: submitting again for the same subject replaces its role
        and expiry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetGrantRequest"
      responses:
        "200":
          description: Grant created or updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetGrantResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/libraries/{libraryId}/grants/{grantId}:
    parameters:
      - name: libraryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: grantId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    delete:
      operationId: revokeAssetGrant
      tags: [library]
      summary: Revoke a grant (MANAGER role or above required). Takes effect on the next query.
      responses:
        "204":
          description: Grant revoked
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/libraries/{libraryId}/indexing:
    parameters:
      - name: libraryId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      operationId: triggerLibraryIndexing
      tags: [library, indexing]
      summary: Trigger an indexing run for a library, using its own stored quellkonfiguration
      description: >
        ADR-0018: a library carries at most one quellentyp and quellkonfiguration, so the
        trigger no longer takes any request body - it reads sourceType/sourcePath/sourceUrl/
        sourceProxy/sourceCredentials/sourceInsecureSsl from the library itself and resolves
        the matching executor through the registry (ADR-0017, decision 3). EDITOR role or
        above on the library is required (the former SYSTEM_ADMIN requirement is gone -
        ADR-0018, Entscheidung 2). A library whose sourceType is UPLOAD has no run at all
        and is rejected with 409, as is a second trigger while a run for this same library is
        still in progress - concurrency is per library, not global (#478).
      responses:
        "202":
          description: Indexing triggered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexingStatusResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/libraries/{libraryId}/indexing/status:
    parameters:
      - name: libraryId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: getLibraryIndexingStatus
      tags: [library, indexing]
      summary: Get the current or most recently completed indexing status for a library
      responses:
        "200":
          description: Current indexing status for this library, or IDLE if it never ran
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexingStatusResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/libraries/{libraryId}/indexing/runs:
    parameters:
      - name: libraryId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: listLibraryIndexingRuns
      tags: [library, indexing]
      summary: >
        The last 10 indexing runs for a library, each with its own protocol of skipped/rejected
        items and errors (#513).
      description: >
        Same read bar as GET .../indexing/status (at least a read grant on the library, #513) -
        seeing past runs' outcomes is not the same right as starting a new one. Runs are ordered
        newest first; older runs (beyond the last 10 for this library) are pruned together with
        their events, mirroring indexing_jobs' own existing retention (IndexingJobService). Every
        run's event list is capped (IndexingRunEventRecorder) - eventsTruncatedCount on a run
        names how many further events that run recorded beyond the cap, without listing them.
      responses:
        "200":
          description: The last 10 runs for this library, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexingRunListResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # #393: exactly four revision access paths, each with a mandatory time range and a bounded
  # result set - see docs/features/security-and-compliance.md#zugriffswege-was-es-gibt-und-was-es-nicht-gibt.
  # There is deliberately no `actor`/`actorRef` query parameter on any of them and no `sort`
  # parameter at all: actorRef is output-only, never an entry point (AUDITOR role only).
  /api/v1/audit/events/by-object:
    get:
      operationId: listAuditEventsByObject
      tags: [audit]
      summary: >
        Revision access path "nach Objekt" (AUDITOR role required): every event recorded against
        one object, within a mandatory time range. objectType=USER_ACCOUNT is rejected with 400
        (#393 code review, finding 2): a USER_ACCOUNT object's object_id is that person's
        pseudonym - the same pseudonym actorRef carries on that same person's own actions
        elsewhere in the log - so accepting it here would reconstruct exactly the excluded view
        "alle Ereignisse, bei denen Person X betroffen war" (read a pseudonym off actorRef via
        by-time-range, then feed it back in as objectId). The legitimate need behind a
        USER_ACCOUNT-scoped question is served by by-time-range/by-event-type (no person focus)
        or, for a genuinely person-scoped question, by the freigegebene anlassbezogene Klärung
        or the Rechtehistorie (#238) - never by this path.
      parameters:
        - name: objectType
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/AuditObjectType"
        - name: objectId
          in: query
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/AuditFrom"
        - $ref: "#/components/parameters/AuditTo"
        - $ref: "#/components/parameters/AuditPage"
        - $ref: "#/components/parameters/AuditSize"
        - $ref: "#/components/parameters/AuditReason"
      responses:
        "200":
          description: Bounded page of matching audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/audit/events/by-time-range:
    get:
      operationId: listAuditEventsByTimeRange
      tags: [audit]
      summary: >
        Revision access path "nach Zeitraum" (AUDITOR role required): every event recorded within
        a mandatory time range, regardless of object.
      parameters:
        - $ref: "#/components/parameters/AuditFrom"
        - $ref: "#/components/parameters/AuditTo"
        - $ref: "#/components/parameters/AuditPage"
        - $ref: "#/components/parameters/AuditSize"
        - $ref: "#/components/parameters/AuditReason"
      responses:
        "200":
          description: Bounded page of matching audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/audit/events/by-event-type:
    get:
      operationId: listAuditEventsByEventType
      tags: [audit]
      summary: >
        Revision access path "nach Ereignisart" (AUDITOR role required): every event of one type,
        within a mandatory time range.
      parameters:
        - name: eventType
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/AuditEventType"
        - $ref: "#/components/parameters/AuditFrom"
        - $ref: "#/components/parameters/AuditTo"
        - $ref: "#/components/parameters/AuditPage"
        - $ref: "#/components/parameters/AuditSize"
        - $ref: "#/components/parameters/AuditReason"
      responses:
        "200":
          description: Bounded page of matching audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/audit/events/by-correlation:
    get:
      operationId: listAuditEventsByCorrelation
      tags: [audit]
      summary: >
        Revision access path "nach Vorgang" (AUDITOR role required): every event sharing one
        correlation_ref (e.g. one directory sync run), within a mandatory time range.
      parameters:
        - name: correlationRef
          in: query
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/AuditFrom"
        - $ref: "#/components/parameters/AuditTo"
        - $ref: "#/components/parameters/AuditPage"
        - $ref: "#/components/parameters/AuditSize"
        - $ref: "#/components/parameters/AuditReason"
      responses:
        "200":
          description: Bounded page of matching audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/audit/incident-scopes:
    post:
      operationId: requestAuditIncidentScope
      tags: [audit]
      summary: >
        Requests the one exception to "kein Personenfilter" - the anlassbezogene Klärung
        (AUDITOR role required): names person, time range and purpose in advance. Created PENDING;
        unusable for querying until a second, different AUDITOR approves it via the approve
        endpoint (Vier-Augen-Prinzip).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditIncidentScopeRequest"
      responses:
        "201":
          description: Incident scope requested, awaiting approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditIncidentScopeResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/audit/incident-scopes/{scopeId}/approve:
    parameters:
      - name: scopeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: approveAuditIncidentScope
      tags: [audit]
      summary: >
        Approves a requested incident scope (AUDITOR role required). Rejected if the approver is
        the same person as the requester (Selbstfreigabe) or the scope was already approved.
      responses:
        "200":
          description: Incident scope approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditIncidentScopeResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/audit/incident-scopes/{scopeId}/events:
    parameters:
      - name: scopeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listAuditEventsByIncidentScope
      tags: [audit]
      summary: >
        The one personenbezogene query path (AUDITOR role required): every event whose actor is
        the scope's named person, technically bounded to the approved scope's person and time
        range. Not callable before approval; a requested from/to outside the approved scope's time
        range is rejected rather than silently clamped.
      parameters:
        - $ref: "#/components/parameters/AuditFrom"
        - $ref: "#/components/parameters/AuditTo"
        - $ref: "#/components/parameters/AuditPage"
        - $ref: "#/components/parameters/AuditSize"
        - $ref: "#/components/parameters/AuditReason"
      responses:
        "200":
          description: Bounded page of matching audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: UP

    AuthConfigResponse:
      type: object
      properties:
        mode:
          type: string
          description: Active authentication mode; "oidc" in production, "dev" for local development and tests
          example: oidc
        authority:
          type: string
          nullable: true
        clientId:
          type: string
          nullable: true

    UserInfoResponse:
      type: object
      required: [id, email, displayName, systemRole]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          nullable: true
        displayName:
          type: string
          nullable: true
        systemRole:
          type: string
          example: USER

    RoleChangeRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/SystemRole"

    SystemRole:
      type: string
      description: >
        AUDITOR (#393) grants read access to the revision access paths in io.opaa.audit and
        nothing else - it carries none of SYSTEM_ADMIN's administrative privileges.
      enum: [USER, SYSTEM_ADMIN, AUDITOR]
      example: USER

    IndexingStatusResponse:
      type: object
      required:
        [
          status,
          documentCount,
          totalDocuments,
          documentsSkipped,
          documentsFailed,
          documentsIndexedTotal,
          timestamp,
        ]
      properties:
        status:
          $ref: "#/components/schemas/IndexingStatus"
        documentCount:
          type: integer
          description: >
            The number of source items this run has processed. On an RSS_FEED run this counts feed
            entries, not indexed documents - an entry's detail page can carry additional attachment
            documents (#468) that are not counted here. See documentsIndexedTotal for the true
            document count.
          example: 42
        totalDocuments:
          type: integer
          example: 42
        documentsSkipped:
          type: integer
          example: 0
        documentsFailed:
          type: integer
          description: >
            The number of source items this run failed to process (#518 review, finding 3) -
            previously only visible inside the free-text message field, not as its own value the
            UI could name explicitly.
          example: 0
        documentsIndexedTotal:
          type: integer
          description: >
            The true count of documents this run has indexed (#518) - includes every attachment
            document indexed for an RSS_FEED entry (#468), including one backfilled for an
            otherwise-unchanged entry. Equals documentCount for FILESYSTEM/HTTP_DIRECTORY runs,
            where one processed file is exactly one document.
          example: 42
        message:
          type: string
          nullable: true
          example: Indexing completed successfully
        libraryId:
          type: string
          format: uuid
          nullable: true
          description: >
            The knowledge library this run targets (#419). Null for a run started before
            migration 019 added the column, or once the run's target library has since been
            deleted (indexing_jobs.library_id is ON DELETE SET NULL - a run's history is not the
            same thing as its right to still write there, see IndexingJob#getLibraryId's Javadoc).
        timestamp:
          type: string
          format: date-time

    IndexingStatus:
      type: string
      enum: [IDLE, RUNNING, COMPLETED, FAILED]
      example: COMPLETED

    IndexingRunEventCategory:
      type: string
      description: >
        Why a single item was skipped/rejected during a run, or that the run recorded an error for
        it (#513). Deliberately coarse (five buckets, not one per exception type) so the category
        stays a stable, translatable label rather than growing a new value with every executor
        change:
          * REJECTED - the source itself declined to hand the item over (HTTP 403/429, a redirect
            to a foreign host that looks like a bot-protection challenge, an unsupported link
            scheme) - not a failure of OPAA's own processing.
          * UNREACHABLE - the item's network location could not be reached at all (connection
            failure, timeout, non-2xx status unrelated to a rejection above).
          * UNSUPPORTED_FORMAT - the item's file format or content type is not one
            SupportedDocumentFormats indexes.
          * ALLOWLIST - the run's own source configuration (e.g. a FILESYSTEM library's
            sourcePath) falls outside an operator-configured allowlist (#484).
          * ERROR - processing started but failed unexpectedly (parsing, chunking, embedding).
      enum: [REJECTED, UNREACHABLE, UNSUPPORTED_FORMAT, ALLOWLIST, ERROR]
      example: REJECTED

    IndexingRunEvent:
      type: object
      required: [category, message]
      properties:
        category:
          $ref: "#/components/schemas/IndexingRunEventCategory"
        message:
          type: string
          description: >
            A German, human-readable reason (#513) - never a raw challenge/redirect URL or
            exception stack trace, only what an operator needs to understand why the item was
            skipped.
          example: "Vom Quellserver abgewiesen (Weiterleitung auf einen fremden Host)"
        reference:
          type: string
          nullable: true
          description: >
            The affected document name, file path or source URL - never the raw challenge/
            redirect target a bot-protection page issued (#513 acceptance criteria).
          example: https://example.org/aktuelles/pressemitteilung-42
      example:
        category: REJECTED
        message: "Vom Quellserver abgewiesen (Weiterleitung auf einen fremden Host)"
        reference: https://example.org/aktuelles/pressemitteilung-42

    IndexingRunResponse:
      type: object
      required:
        [
          id,
          status,
          documentCount,
          totalDocuments,
          documentsSkipped,
          documentsFailed,
          documentsIndexedTotal,
          startedAt,
          events,
          eventsTruncatedCount,
        ]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/IndexingStatus"
        documentCount:
          type: integer
          example: 42
        totalDocuments:
          type: integer
          example: 42
        documentsSkipped:
          type: integer
          example: 0
        documentsFailed:
          type: integer
          example: 0
        documentsIndexedTotal:
          type: integer
          example: 42
        message:
          type: string
          nullable: true
          example: Indexing completed successfully
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        events:
          type: array
          description: >
            This run's protocol (#513), capped at 500 entries (IndexingRunEventRecorder) - see
            eventsTruncatedCount for how many further events beyond the cap this run recorded.
          items:
            $ref: "#/components/schemas/IndexingRunEvent"
        eventsTruncatedCount:
          type: integer
          description: >
            How many further events this run recorded beyond the 500-entry cap on the events
            list above (#513) - 0 when every event fit. The UI renders this as "… und N weitere".
          example: 0

    IndexingRunListResponse:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          description: The last 10 runs for this library, newest first (#513).
          items:
            $ref: "#/components/schemas/IndexingRunResponse"

    QueryRequest:
      type: object
      required: [question]
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: ".*\\S.*"
          example: What is the project architecture?
        chatId:
          type: string
          format: uuid
          nullable: true
          description: >
            The persisted chat (#525) this question and its answer belong to - the question,
            answer and sources are appended to it as ChatMessages, and the search scope for this
            query is taken from the chat's useKnowledge/referencedLibraryIds settings rather than
            useKnowledge/libraryIds below. Must be a chat the caller authored (see POST
            /api/v1/spaces/{spaceId}/chats) or the request runs ephemerally instead of being
            rejected, exactly as if chatId had been omitted (see useKnowledge below) - not
            persisted, and remembered only for the lifetime of the in-memory conversation cache
            keyed by the returned chatId.
        useKnowledge:
          type: boolean
          nullable: true
          default: true
          description: >
            Ignored when chatId names a chat the caller authored - that chat's own useKnowledge
            setting applies instead (#525). Otherwise (#526): whether the query searches the
            knowledge base at all. When true (the default), the search scope is every knowledge
            library the caller may read; libraryIds is ignored in this mode. When false, the
            search scope is libraryIds narrowed to the libraries the caller may read - never
            widened beyond it - and an empty (or entirely unreadable) libraryIds performs no
            retrieval at all, see QueryMetadata.answeredWithoutKnowledge.
        libraryIds:
          type: array
          items:
            type: string
            format: uuid
          description: >
            Ignored when chatId names a chat the caller authored - that chat's own sticky
            @-references apply instead (#525). Otherwise (#526): knowledge libraries explicitly
            referenced for the query. Only consulted when useKnowledge is false.

    QueryResponse:
      type: object
      required: [answer, sources, metadata, chatId]
      properties:
        answer:
          type: string
          example: The project uses a modular monolith architecture...
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceReference"
        metadata:
          $ref: "#/components/schemas/QueryMetadata"
        chatId:
          type: string
          format: uuid
          description: >
            The chat this turn was appended to, or - for an ephemeral query that supplied no
            chatId - a freshly generated id identifying only the in-memory conversation cache
            entry, not a persisted chat.
        chatTitle:
          type: string
          nullable: true
          description: >
            The persisted chat's current title immediately after this turn (#557), or null for an
            ephemeral query. On the very first turn this is still the mechanical prefix-of-the-
            question fallback, never the LLM-derived title: title generation runs asynchronously
            after the answer is returned, precisely so it can never delay this response - the
            frontend picks up the LLM-derived title (if generation succeeds) on a later reload of
            the chat, e.g. GET /chats/{chatId}.
          example: Rückstellung für Altlastensanierung

    SourceReference:
      type: object
      required: [fileName, relevanceScore, matchCount, cited]
      properties:
        fileName:
          type: string
          example: architecture-overview.md
        spaceName:
          type: string
          nullable: true
          example: Engineering
        relevanceScore:
          type: number
          format: double
          minimum: 0
          maximum: 1
          example: 0.92
        matchCount:
          type: integer
          example: 3
        indexedAt:
          type: string
          format: date-time
          nullable: true
        cited:
          type: boolean
          example: true

    QueryMetadata:
      type: object
      required: [model, tokenCount, durationMs]
      properties:
        model:
          type: string
          example: gpt-4o
        tokenCount:
          type: integer
          example: 847
        durationMs:
          type: integer
          format: int64
          example: 1523
        answeredWithoutKnowledge:
          type: boolean
          nullable: true
          default: false
          description: >
            True when useKnowledge was false and libraryIds resolved to no readable library, so no
            vector search ran and the answer was generated without any document context (#526). The
            frontend uses this to show the corresponding hint instead of inferring it from an empty
            sources list, which alone cannot distinguish "no knowledge searched" from "searched but
            found nothing".

    ErrorResponse:
      type: object
      required: [error, status, timestamp]
      properties:
        error:
          type: string
        status:
          type: integer
        timestamp:
          type: string
          format: date-time

    SpaceRole:
      type: string
      enum: [MEMBER, CURATOR, ADMIN]
      example: CURATOR

    SpaceVisibility:
      type: string
      enum: [PRIVATE, DISCOVERABLE, OPEN]
      example: PRIVATE

    SpaceRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: Engineering
        description:
          type: string
          maxLength: 2000
          nullable: true
          example: Engineering project space
        visibility:
          $ref: "#/components/schemas/SpaceVisibility"
        ownerId:
          type: string
          format: uuid
          nullable: true
          description: Defaults to the creator; a system admin may set it explicitly
        initialMembers:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/SpaceMemberRequest"

    SpaceUpdateRequest:
      type: object
      required: [name]
      description: >
        Body for updating an existing space. Deliberately narrower than SpaceRequest: ownerId
        cannot be changed here (ownership changes go through the dedicated transfer-ownership
        endpoint), and initialMembers has no meaning for an update.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: Engineering
        description:
          type: string
          maxLength: 2000
          nullable: true
          example: Engineering project space
        visibility:
          $ref: "#/components/schemas/SpaceVisibility"

    SpaceMemberRequest:
      type: object
      required: [userId, role]
      properties:
        userId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/SpaceRole"

    SpaceListResponse:
      type: object
      required: [id, name, isDefault, memberCount, createdAt, updatedAt]
