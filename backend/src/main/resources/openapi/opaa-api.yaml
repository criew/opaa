        id:
          type: string
          format: uuid
        name:
          type: string
          example: Engineering
        description:
          type: string
          nullable: true
        isDefault:
          type: boolean
          description: True for the space created automatically on first login.
          example: false
        visibility:
          $ref: "#/components/schemas/SpaceVisibility"
        memberCount:
          type: integer
          example: 5
        userRole:
          $ref: "#/components/schemas/SpaceRole"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SpaceMemberResponse:
      type: object
      required: [userId, role, createdAt]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
          nullable: true
        role:
          $ref: "#/components/schemas/SpaceRole"
        createdAt:
          type: string
          format: date-time

    SpaceResponse:
      type: object
      required: [id, name, isDefault, ownerId, memberCount, roleCounts, members, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Engineering
        description:
          type: string
          nullable: true
        isDefault:
          type: boolean
          description: >
            True for the space created automatically on first login. Exactly one per user and not
            deletable; an ordinary space in every other respect.
          example: false
        visibility:
          $ref: "#/components/schemas/SpaceVisibility"
        ownerId:
          type: string
          format: uuid
        memberCount:
          type: integer
          example: 5
        userRole:
          $ref: "#/components/schemas/SpaceRole"
