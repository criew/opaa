openapi: 3.0.3
info:
  title: OPAA API
  description: Open Project AI Assistant REST API
  version: 0.1.0
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html

paths:
  /api/health:
    get:
      operationId: getHealth
      tags: [system]
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/indexing/trigger:
    post:
      operationId: triggerIndexing
      tags: [indexing]
      summary: Trigger document indexing
      description: |
        Triggers document indexing. Without a request body, indexes documents
        from the configured local filesystem path. With a request body containing
        a URL, crawls an Apache mod_autoindex HTTP directory listing and indexes
        all discovered documents.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndexingTriggerRequest"
      responses:
        "202":
          description: Indexing triggered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexingStatusResponse"
        "409":
          description: Indexing already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexingStatusResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/indexing/status:
    get:
      operationId: getIndexingStatus
      tags: [indexing]
      summary: Get current indexing status
      responses:
        "200":
          description: Current indexing status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexingStatusResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/query:
    post:
      operationId: submitQuery
      tags: [query]
      summary: Ask a question against indexed documents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
      responses:
        "200":
          description: Query answered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/config:
    get:
      operationId: getAuthConfig
      tags: [auth]
      summary: Get authentication configuration
      responses:
        "200":
          description: Authentication configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthConfigResponse"

  /api/v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with username and password (basic auth mode only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current user info
      responses:
        "200":
          description: Current user information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfoResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/admin/users:
    get:
      operationId: listUsers
      tags: [admin]
      summary: List all users (system admin only)
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserInfoResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/users/{id}/role:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      operationId: changeUserRole
      tags: [admin]
      summary: Change a user's system role (system admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleChangeRequest"
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfoResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/groups:
    get:
      operationId: listGroups
      tags: [admin]
      summary: List groups in the caller's organization (system admin only)
      responses:
        "200":
          description: List of groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupListResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      operationId: createGroup
      tags: [admin]
      summary: Create an ad-hoc group (system admin only)
      description: >
        Always creates a group of kind AD_HOC. Groups of kind ORG_UNIT are created only by
        directory synchronisation (see #237) and cannot be created through this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupRequest"
      responses:
        "201":
          description: Group created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/groups/{groupId}:
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: getGroup
      tags: [admin]
      summary: Get group details (system admin only)
      responses:
        "200":
          description: Group details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: updateGroup
      tags: [admin]
      summary: Rename an ad-hoc group or change its description (system admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupUpdateRequest"
      responses:
        "200":
          description: Group updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: deleteGroup
      tags: [admin]
      summary: Delete an ad-hoc group (system admin only)
      responses:
        "204":
          description: Group deleted
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/groups/{groupId}/members:
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: listGroupMembers
      tags: [admin]
      summary: List group members (system admin only)
      responses:
        "200":
          description: List of members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupMemberResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      operationId: addGroupMember
      tags: [admin]
      summary: Add a member to an ad-hoc group (system admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupAddMemberRequest"
      responses:
        "201":
          description: Member added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupMemberResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/admin/groups/{groupId}/members/{userId}:
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    delete:
      operationId: removeGroupMember
      tags: [admin]
      summary: Remove a member from an ad-hoc group (system admin only)
      responses:
        "204":
          description: Member removed
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/directory-sync/dry-run:
    post:
      operationId: runDirectorySyncDryRun
      tags: [admin]
      summary: Compute the directory synchronisation diff without applying it (system admin only)
      description: >
        Fetches the current directory state and computes what would change, but never writes
        anything - not even when the run would otherwise be applicable. See #237.
      responses:
        "200":
          description: Dry-run report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectorySyncReportResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/directory-sync/run:
    post:
      operationId: runDirectorySync
      tags: [admin]
      summary: Run directory synchronisation and apply changes if plausible (system admin only)
      description: >
        Applies changes only if the directory is reachable, did not return an empty group list
        while ORG_UNIT groups already exist, and the fraction of memberships that would be
        removed does not exceed the configured threshold. Otherwise the run is aborted without
        writing anything, and the report explains why. See #237.
      responses:
        "200":
          description: Synchronisation report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectorySyncReportResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/directory-sync/status:
    get:
      operationId: getDirectorySyncStatus
      tags: [admin]
      summary: Get the outcome of the most recent directory synchronisation run (system admin only)
      responses:
        "200":
          description: Last known synchronisation status; all fields are null if no run has happened yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectorySyncStatusResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/spaces:
    get:
      operationId: listSpaces
      tags: [space]
      summary: List spaces the current user is a member of
      responses:
        "200":
          description: List of spaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SpaceListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      operationId: createSpace
      tags: [space]
      summary: Create a new space (project spaces are self-service, team spaces are system admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpaceRequest"
      responses:
        "201":
          description: Space created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/spaces/{spaceId}:
    parameters:
      - name: spaceId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: getSpace
      tags: [space]
      summary: Get space details
      responses:
        "200":
          description: Space details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: updateSpace
      tags: [space]
      summary: Update space name, description and visibility (admin or owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpaceUpdateRequest"
      responses:
        "200":
          description: Space updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

    delete:
      operationId: deleteSpace
      tags: [space]
      summary: Delete a space (owner or system admin only)
      responses:
        "204":
          description: Space deleted
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/spaces/{spaceId}/members:
    parameters:
      - name: spaceId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: listSpaceMembers
      tags: [space]
      summary: List space members
      responses:
        "200":
          description: List of members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SpaceMemberResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      operationId: addSpaceMember
      tags: [space]
      summary: Add a member to a space (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpaceAddMemberRequest"
      responses:
        "201":
          description: Member added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceMemberResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/spaces/{spaceId}/members/{userId}:
    parameters:
      - name: spaceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    delete:
      operationId: removeSpaceMember
      tags: [space]
      summary: Remove a member from a space (admin only)
      responses:
        "204":
          description: Member removed
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/spaces/{spaceId}/members/{userId}/role:
    parameters:
      - name: spaceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    put:
      operationId: updateSpaceMemberRole
      tags: [space]
      summary: Update a member's role (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpaceRoleUpdateRequest"
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceMemberResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/spaces/{spaceId}/transfer-ownership:
    parameters:
      - name: spaceId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      operationId: transferSpaceOwnership
      tags: [space]
      summary: Transfer space ownership to another member (owner or system admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpaceTransferOwnershipRequest"
      responses:
        "204":
          description: Ownership transferred
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: UP

    AuthConfigResponse:
      type: object
      properties:
        mode:
          type: string
          example: basic
        authority:
          type: string
          nullable: true
        clientId:
          type: string
          nullable: true

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1

    LoginResponse:
      type: object
      required: [accessToken, expiresIn]
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
          format: int64

    UserInfoResponse:
      type: object
      required: [id, email, displayName, systemRole]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          nullable: true
        displayName:
          type: string
          nullable: true
        systemRole:
          type: string
          example: USER

    RoleChangeRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/SystemRole"

    SystemRole:
      type: string
      enum: [USER, SYSTEM_ADMIN]
      example: USER

    IndexingStatusResponse:
      type: object
      required: [status, documentCount, totalDocuments, documentsSkipped, timestamp]
      properties:
        status:
          $ref: "#/components/schemas/IndexingStatus"
        documentCount:
          type: integer
          example: 42
        totalDocuments:
          type: integer
          example: 42
        documentsSkipped:
          type: integer
          example: 0
        message:
          type: string
          nullable: true
          example: Indexing completed successfully
        timestamp:
          type: string
          format: date-time

    IndexingStatus:
      type: string
      enum: [IDLE, RUNNING, COMPLETED, FAILED]
      example: COMPLETED

    QueryRequest:
      type: object
      required: [question]
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: ".*\\S.*"
          example: What is the project architecture?
        conversationId:
          type: string
          pattern: "^[a-zA-Z0-9-]{1,50}$"
          example: c5aaec8d-307f-4f2f-b43e-f7ea600435eb
        spaceIds:
          type: array
          items:
            type: string
            format: uuid
          description: Optional list of space IDs to restrict the query to

    QueryResponse:
      type: object
      required: [answer, sources, metadata, conversationId]
      properties:
        answer:
          type: string
          example: The project uses a modular monolith architecture...
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceReference"
        metadata:
          $ref: "#/components/schemas/QueryMetadata"
        conversationId:
          type: string
          example: c5aaec8d-307f-4f2f-b43e-f7ea600435eb

    SourceReference:
      type: object
      required: [fileName, relevanceScore, matchCount, cited]
      properties:
        fileName:
          type: string
          example: architecture-overview.md
        spaceName:
          type: string
          nullable: true
          example: Engineering
        relevanceScore:
          type: number
          format: double
          minimum: 0
          maximum: 1
          example: 0.92
        matchCount:
          type: integer
          example: 3
        indexedAt:
          type: string
          format: date-time
          nullable: true
        cited:
          type: boolean
          example: true

    QueryMetadata:
      type: object
      required: [model, tokenCount, durationMs]
      properties:
        model:
          type: string
          example: gpt-4o
        tokenCount:
          type: integer
          example: 847
        durationMs:
          type: integer
          format: int64
          example: 1523

    IndexingTriggerRequest:
      type: object
      description: Optional request body for URL-based indexing
      properties:
        url:
          type: string
          format: uri
          description: URL of an Apache mod_autoindex directory listing to crawl
          example: https://files.example.com/documents/
        proxy:
          type: string
          description: Proxy server in host:port format
          example: proxy.example.com:8080
        credentials:
          type: string
          description: Basic auth credentials in user:password format
          example: admin:secret
        insecureSsl:
          type: boolean
          description: Skip SSL certificate verification
          default: false

    ErrorResponse:
      type: object
      required: [error, status, timestamp]
      properties:
        error:
          type: string
        status:
          type: integer
        timestamp:
          type: string
          format: date-time

    SpaceRole:
      type: string
      enum: [MEMBER, CURATOR, ADMIN]
      example: CURATOR

    SpaceKind:
      type: string
      enum: [PERSONAL, PROJECT, TEAM]
      example: PROJECT

    SpaceVisibility:
      type: string
      enum: [PRIVATE, DISCOVERABLE, OPEN]
      example: PRIVATE

    SpaceRequest:
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: Engineering
        description:
          type: string
          maxLength: 2000
          nullable: true
          example: Engineering project space
        kind:
          $ref: "#/components/schemas/SpaceKind"
        visibility:
          $ref: "#/components/schemas/SpaceVisibility"
        ownerId:
          type: string
          format: uuid
          nullable: true
          description: Defaults to the creator; a system admin may set it explicitly
        initialMembers:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/SpaceMemberRequest"

    SpaceUpdateRequest:
      type: object
      required: [name]
      description: >
        Body for updating an existing space. Deliberately narrower than SpaceRequest: kind and
        ownerId cannot be changed here (kind is fixed at creation, ownership changes go through
        the dedicated transfer-ownership endpoint), and initialMembers has no meaning for an
        update.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: Engineering
        description:
          type: string
          maxLength: 2000
          nullable: true
          example: Engineering project space
        visibility:
          $ref: "#/components/schemas/SpaceVisibility"

    SpaceMemberRequest:
      type: object
      required: [userId, role]
      properties:
        userId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/SpaceRole"

    SpaceListResponse:
      type: object
      required: [id, name, kind, memberCount, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Engineering
        description:
          type: string
          nullable: true
        kind:
          $ref: "#/components/schemas/SpaceKind"
        visibility:
          $ref: "#/components/schemas/SpaceVisibility"
        memberCount:
          type: integer
          example: 5
        userRole:
          $ref: "#/components/schemas/SpaceRole"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SpaceMemberResponse:
      type: object
      required: [userId, role, createdAt]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
          nullable: true
        role:
          $ref: "#/components/schemas/SpaceRole"
        createdAt:
          type: string
          format: date-time

    SpaceResponse:
      type: object
      required: [id, name, kind, ownerId, memberCount, roleCounts, members, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Engineering
        description:
          type: string
          nullable: true
        kind:
          $ref: "#/components/schemas/SpaceKind"
        visibility:
          $ref: "#/components/schemas/SpaceVisibility"
        ownerId:
          type: string
          format: uuid
        memberCount:
          type: integer
          example: 5
        userRole:
          $ref: "#/components/schemas/SpaceRole"
        roleCounts:
          type: object
          additionalProperties:
            type: integer
            format: int64
          example:
            MEMBER: 2
            CURATOR: 1
            ADMIN: 1
        members:
          type: array
          items:
            $ref: "#/components/schemas/SpaceMemberResponse"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SpaceAddMemberRequest:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/SpaceRole"

    SpaceRoleUpdateRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/SpaceRole"

    SpaceTransferOwnershipRequest:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
          format: uuid

    GroupKind:
      type: string
      description: >
        ORG_UNIT groups are synchronised from the directory (see #237), carry a parent unit and
        can have curators. AD_HOC groups are created in the system, have no curator and no
        distribution level of their own.
      enum: [ORG_UNIT, AD_HOC]
      example: AD_HOC

    GroupRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: Projektbeteiligte Phoenix
        description:
          type: string
          maxLength: 2000
          nullable: true
          example: Ad-hoc-Gruppe fuer das Projekt Phoenix

    GroupUpdateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: Projektbeteiligte Phoenix
        description:
          type: string
          maxLength: 2000
          nullable: true
          example: Ad-hoc-Gruppe fuer das Projekt Phoenix

    GroupMemberResponse:
      type: object
      required: [userId, createdAt]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    GroupListResponse:
      type: object
      required: [id, name, kind, memberCount, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Projektbeteiligte Phoenix
        description:
          type: string
          nullable: true
        kind:
          $ref: "#/components/schemas/GroupKind"
        externalId:
          type: string
          nullable: true
          description: Stable directory identifier (objectGUID or SCIM externalId); null for AD_HOC groups
        parentGroupId:
          type: string
          format: uuid
          nullable: true
          description: Parent organizational unit; only set for ORG_UNIT groups
        memberCount:
          type: integer
          example: 4
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    GroupResponse:
      type: object
      required: [id, name, kind, memberCount, members, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Projektbeteiligte Phoenix
        description:
          type: string
          nullable: true
        kind:
          $ref: "#/components/schemas/GroupKind"
        externalId:
          type: string
          nullable: true
          description: Stable directory identifier (objectGUID or SCIM externalId); null for AD_HOC groups
        parentGroupId:
          type: string
          format: uuid
          nullable: true
          description: Parent organizational unit; only set for ORG_UNIT groups
        memberCount:
          type: integer
          example: 4
        members:
          type: array
          items:
            $ref: "#/components/schemas/GroupMemberResponse"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    GroupAddMemberRequest:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
          format: uuid

    DirectorySyncOutcome:
      type: string
      description: >
        What a directory synchronisation run did. APPLIED and DRY_RUN both mean the run computed
        a valid diff; the ABORTED_* and UNREACHABLE values mean nothing was written on purpose -
        see #237.
      enum: [APPLIED, DRY_RUN, ABORTED_THRESHOLD, ABORTED_EMPTY_RESULT, UNREACHABLE]
      example: APPLIED

    DirectorySyncGroupChange:
      type: object
      required: [externalId, name]
      properties:
        externalId:
          type: string
          example: directory-guid-1
        name:
          type: string
          example: Referat 50
        previousName:
          type: string
          nullable: true
          description: Only set for a renamed group

    DirectorySyncUserRef:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
          nullable: true

    DirectorySyncMembershipChange:
      type: object
      required: [externalId, name, added, removed]
      description: >
        Which users would gain or lose membership of one group - the level of detail an admin
        needs to decide before a run that would revoke access is applied (see #237's acceptance
        criteria: the dry-run report must show what would change, not only how much).
      properties:
        externalId:
          type: string
          example: directory-guid-1
        name:
          type: string
          example: Referat 50
        added:
          type: array
          items:
            $ref: "#/components/schemas/DirectorySyncUserRef"
        removed:
          type: array
          items:
            $ref: "#/components/schemas/DirectorySyncUserRef"

    DirectorySyncReportResponse:
      type: object
      required:
        - outcome
        - generatedAt
        - groupsCreated
        - groupsRenamed
        - groupsDissolved
        - membershipChanges
        - membershipsAdded
        - membershipsRemoved
        - changedFraction
        - thresholdFraction
        - message
      properties:
        outcome:
          $ref: "#/components/schemas/DirectorySyncOutcome"
        generatedAt:
          type: string
          format: date-time
        groupsCreated:
          type: array
          items:
            $ref: "#/components/schemas/DirectorySyncGroupChange"
        groupsRenamed:
          type: array
          items:
            $ref: "#/components/schemas/DirectorySyncGroupChange"
        groupsDissolved:
          type: array
          items:
            $ref: "#/components/schemas/DirectorySyncGroupChange"
        membershipChanges:
          type: array
          items:
            $ref: "#/components/schemas/DirectorySyncMembershipChange"
        membershipsAdded:
          type: integer
          example: 4
        membershipsRemoved:
          type: integer
          example: 1
        unresolvedMemberCount:
          type: integer
          description: Directory members whose subject matched no known user; skipped, not an error
          example: 0
        changedFraction:
          type: number
          format: double
          description: >
            Fraction of memberships at risk this run - removals plus the memberships of groups
            that would be dissolved, since a dissolved group's reach is capped the same way a
            revoked grant would be. Relative to the memberships of every group this run actually
            touches (new, renamed, membership-changed, dissolved, reactivated); untouched groups
            are excluded from both sides of the ratio.
          example: 0.05
        thresholdFraction:
          type: number
          format: double
          example: 0.3
        message:
          type: string
          example: Synchronisation angewendet.

    DirectorySyncStatusResponse:
      type: object
      properties:
        lastRunAt:
          type: string
          format: date-time
          nullable: true
        lastOutcome:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/DirectorySyncOutcome"
        lastMessage:
          type: string
          nullable: true
        lastAppliedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the last run that actually applied changes (outcome APPLIED)
        lastChangedFraction:
          type: number
          format: double
          nullable: true

  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
