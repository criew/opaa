# Build performance (issue #644).
#
# caching: the build cache lives in the user-wide Gradle home
# (~/.gradle/caches/build-cache-1), so parallel agent worktrees share compile
# and test results instead of redoing identical work; CI persists it via
# gradle/actions/setup-gradle (only runs on main write the cache, PR runs
# restore it read-only).
# parallel + configuration-cache: skip configuration work and run independent
# tasks concurrently on repeat builds.
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
