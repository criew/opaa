# Value set of the two-instance test on kind (multi-instance-test.sh, ADR-0053): two backend pods
# with the migration job, the chart's evaluation database, originals and the corpus in the object
# store of multi-test, ai-stub as chat and embedding model, the answer file with a fixed password of
# the first account. The image tags are set by the script; the secrets are throwaway test values.
publicBaseUrl: http://localhost:18180
evaluationDatabase:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
embedding:
  baseUrl: http://ai-stub.multi-test.svc.cluster.local:8089
  model: bge-m3
bootstrap:
  initialAdmin:
    email: systemverwaltung@opaa.example
    requirePasswordChange: false
  chatModel:
    baseUrl: http://ai-stub.multi-test.svc.cluster.local:8089
    model: qwen2.5:3b
uploads:
  store: s3
  s3:
    endpoint: http://objectstore.multi-test.svc.cluster.local:9000
    bucket: opaa-originals
targetValidation:
  indexingAllowlist:
    - objectstore.multi-test.svc.cluster.local
  # The chart adds host and port of the answer file's models itself; named here as well, since the
  # suite's ai-stub is the one model endpoint of the run.
  modelAllowlist:
    - ai-stub.multi-test.svc.cluster.local:8089
  identityProviderAllowlist:
    - ai-stub.multi-test.svc.cluster.local:8089
# The backend really starts here in the "oidc" profile, which refuses the ci-only-... and
# marker-bearing values of the chart's own ci/ value sets; these guard nothing but a throwaway cluster.
secrets:
  jwtSecret: kind-install-test-jwt-secret-0123456789abcdefghij
  databasePassword: ci-only-password
  credentialsEncryptionKey: bgkeQqaMpiL1xFl4ymM9MVJ+jYlt+GCb4w9J8o5btxI=
  settingsEncryptionKey: NNEl4fE9dCl6LycesKNIxBXCY+hDKDDWV8D7hPi5e0A=
  s3AccessKey: opaa-kind
  s3SecretKey: opaa-kind-secret
  initialAdminPassword: E2eMehrinstanzKonto!2026
backend:
  image:
    repository: opaa-ci/backend
    tag: ci
    pullPolicy: Never
  replicas: 2
  migration:
    enabled: true
  # Small, so that the load scenario reaches it.
  databasePoolSize: 5
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1280Mi
  # The scenarios sign in over plain HTTP, all from the same client address, and one access token
  # outlasts the rolling update.
  extraEnv:
    - { name: OPAA_AUTH_LOCAL_COOKIE_SECURE, value: "false" }
    - { name: OPAA_AUTH_LOCAL_ACCESS_TOKEN_TTL, value: 30m }
    - { name: OPAA_RATE_LIMIT_LOCAL_AUTH_LOGIN_MAX_REQUESTS, value: "1000" }
    - { name: OPAA_RATE_LIMIT_LOCAL_AUTH_LOGIN_GLOBAL_MAX_REQUESTS, value: "2000" }
    - { name: OPAA_RATE_LIMIT_LOCAL_AUTH_CHANGE_PASSWORD_MAX_REQUESTS, value: "200" }
    - { name: OPAA_RATE_LIMIT_INDEXING_MAX_REQUESTS, value: "50" }
    - { name: OPAA_RATE_LIMIT_INDEXING_GLOBAL_MAX_REQUESTS, value: "100" }
# A Prometheus in the cluster may scrape every backend pod (alerts per pod, ADR-0053).
metrics:
  podAnnotations: true
frontend:
  image:
    repository: opaa-ci/frontend
    tag: ci
    pullPolicy: Never
