# Value set of the installation test on kind (install-test.sh): the chart's evaluation database,
# the images built from the commit and loaded into the cluster, throwaway secrets. No answer file:
# the backend stays in installation mode, whose readiness is UP. The model endpoints do not exist;
# the backend's readiness does not depend on them.
publicBaseUrl: https://opaa.example.org
evaluationDatabase:
  enabled: true
# Besides the default backend ingress policy, the egress policies are on, so the backend reaches the
# evaluation database only through the rule the chart grants it.
networkPolicy:
  egress:
    enabled: true
# kind ships a default StorageClass (local-path); fsGroup makes the volume writable for the backend.
uploads:
  store: persistentVolumeClaim
  persistence:
    fsGroup: 65532
# The backend really starts here in the "oidc" profile, which refuses the ci-only-... and
# marker-bearing values of the chart's own ci/ value sets; these guard nothing but a throwaway cluster.
# The two AES keys are not set here: install-test.sh and restore-test.sh generate them per run.
secrets:
  jwtSecret: kind-install-test-jwt-secret-0123456789abcdefghij
  databasePassword: ci-only-password
backend:
  image:
    repository: opaa-ci/backend
    tag: ci
    pullPolicy: Never
frontend:
  image:
    repository: opaa-ci/frontend
    tag: ci
    pullPolicy: Never
