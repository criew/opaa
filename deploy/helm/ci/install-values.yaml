# Value set of the installation test on kind (install-test.sh): the chart's evaluation database,
# the images built from the commit and loaded into the cluster, throwaway secrets. The model
# endpoints do not exist; the backend's readiness does not depend on them.
publicBaseUrl: https://opaa.example.org
evaluationDatabase:
  enabled: true
# Besides the default backend ingress policy, the egress policies are on, so the backend reaches the
# evaluation database only through the rule the chart grants it.
networkPolicy:
  egress:
    enabled: true
embedding:
  baseUrl: http://models.invalid/v1
  model: nomic-embed-text
  dimensions: 768
bootstrap:
  initialAdmin:
    email: it-postfach@example.org
  chatModel:
    baseUrl: http://models.invalid/v1
    model: qwen2.5:3b
# kind ships a default StorageClass (local-path); fsGroup makes the volume writable for the backend.
uploads:
  store: persistentVolumeClaim
  persistence:
    fsGroup: 65532
secrets:
  jwtSecret: ci-only-jwt-secret-0123456789abcdefghijklmnop
  databasePassword: ci-only-password
  credentialsEncryptionKey: bjzhjv2AKbnBjZCYAR2V/Glp7TYZzqABwkqXs3lEyCY=
  settingsEncryptionKey: CH1X+hsIYeijer8S9wq5wKRnQa4DpUPePzw4KxGMTMw=
backend:
  image:
    repository: opaa-ci/backend
    tag: ci
    pullPolicy: Never
frontend:
  image:
    repository: opaa-ci/frontend
    tag: ci
    pullPolicy: Never
