# Helper database of the chart's installation test on kind (install-test.sh), not a template for
# operation: no persistence, a throwaway password. The pgvector image starts as root, so it runs in a
# namespace of its own, outside of the one that enforces the Pod Security Standard "restricted".
apiVersion: v1
kind: Namespace
metadata:
  name: opaa-ci-db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: opaa-ci-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg18
          env:
            - name: POSTGRES_DB
              value: opaa
            - name: POSTGRES_USER
              value: opaa
            - name: POSTGRES_PASSWORD
              value: ci-only-password
          ports:
            - name: postgres
              containerPort: 5432
          # Over TCP: the entrypoint's temporary server during initialisation listens on the socket
          # only, so the probe cannot report ready before the final server is up.
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "opaa", "-d", "opaa"]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: opaa-ci-db
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
