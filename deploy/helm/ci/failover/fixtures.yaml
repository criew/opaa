# Stand-ins of the failover test (failover-test.sh) in the namespace failover-test, on the "infra"
# node that no disturbance drains: the chat/embedding stub of the E2E suite (its server.mjs comes
# from the ConfigMap ai-stub, created by the script) and the mail catcher. The object store of the
# originals and of the corpus runs outside the cluster (a container next to the kind nodes).
# Test values only; nothing here is a real secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-stub
  namespace: failover-test
spec:
  replicas: 1
  selector:
    matchLabels: { app: ai-stub }
  template:
    metadata:
      labels: { app: ai-stub }
    spec:
      nodeSelector: { opaa-failover/infra: "true" }
      containers:
        - name: ai-stub
          image: node:24-alpine
          command: ["node", "/app/server.mjs"]
          env:
            - { name: PORT, value: "8089" }
            - { name: EMBEDDING_DIMENSIONS, value: "1024" }
          ports:
            - containerPort: 8089
          readinessProbe:
            httpGet: { path: /health, port: 8089 }
            periodSeconds: 2
          volumeMounts:
            - { name: app, mountPath: /app }
          resources:
            limits: { memory: 256Mi }
      volumes:
        - name: app
          configMap:
            name: ai-stub
---
apiVersion: v1
kind: Service
metadata:
  name: ai-stub
  namespace: failover-test
spec:
  selector: { app: ai-stub }
  ports:
    - port: 8089
      targetPort: 8089
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: failover-test
spec:
  replicas: 1
  selector:
    matchLabels: { app: mailpit }
  template:
    metadata:
      labels: { app: mailpit }
    spec:
      nodeSelector: { opaa-failover/infra: "true" }
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.31.6
          env:
            - { name: MP_MAX_MESSAGES, value: "5000" }
            - { name: MP_SMTP_AUTH_ACCEPT_ANY, value: "1" }
            - { name: MP_SMTP_AUTH_ALLOW_INSECURE, value: "1" }
          ports:
            - containerPort: 1025
            - containerPort: 8025
          readinessProbe:
            httpGet: { path: /readyz, port: 8025 }
            periodSeconds: 2
          resources:
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: failover-test
spec:
  selector: { app: mailpit }
  ports:
    - { name: smtp, port: 1025, targetPort: 1025 }
    - { name: web, port: 8025, targetPort: 8025 }
