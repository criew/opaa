# Values of the OPAA chart. The chart runs the backend, one instance by default or several under the
# conditions of backend.replicas (ADR-0053), next to the frontend; PostgreSQL with pgvector, the
# model endpoints and an identity provider are operated outside of it and only connected (ADR-0042).
#
# Three kinds of configuration (ADR-0042, Entscheidung 3):
#   - deployment values, read on every start: everything outside of "bootstrap"
#   - the answer file of the installation, applied while the installation is pending: "bootstrap"
#   - administration settings (mail server, further providers, models): none here, they live in
#     the user interface

nameOverride: ""
fullnameOverride: ""

# The address under which users reach OPAA, with scheme and without a trailing slash, e.g.
# https://opaa.example.org. Base of every link in a mail, of the OAuth callback and of the allowed
# CORS origin. Required.
publicBaseUrl: ""

imagePullSecrets: []

serviceAccount:
  # One account for all pods of the release; it never receives an API token.
  create: true
  name: ""
  annotations: {}

# Applied to every pod of the chart. Pod Security Standard "restricted" without exceptions
# (ADR-0042, Entscheidung 6). runAsUser, runAsGroup and fsGroup stay empty on purpose, so platforms
# assigning UIDs themselves (OpenShift restricted-v2) need no override.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# Applied to every container of the chart.
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

database:
  # External PostgreSQL with the pgvector extension (0.8.0 or later). The password comes from the
  # secret (key OPAA_DB_PASSWORD). Before the first start, unless the account is a superuser, a
  # database administrator runs in the database:
  #   CREATE EXTENSION vector;
  #   CREATE ROLE opaa_audit_owner NOLOGIN;  -- or: grant the account CREATEROLE
  #   GRANT opaa_audit_owner TO <username> WITH ADMIN OPTION;
  # Managed services (RDS, Azure, Cloud SQL) let their administrator role create the extension.
  # Without pgvector on the server the backend stops with a report naming the fix.
  # Empty while evaluationDatabase.enabled: then the chart's own evaluation database is used.
  host: ""
  port: 5432
  name: opaa
  username: opaa
  # Schema for all tables of OPAA (OPAA_DB_SCHEMA); must exist before the first start. Empty: public.
  schema: ""
  # sslmode of the JDBC driver: disable, allow, prefer, require, verify-ca or verify-full. Empty
  # keeps the driver default (prefer). verify-ca and verify-full check the server certificate
  # against the Java truststore: the public CAs plus extraCACertificates.
  sslMode: ""

# A PostgreSQL with pgvector inside the release, ONLY FOR EVALUATION: no backup, no replication, no
# upgrade path across major versions. Production uses the database of the data centre or an
# operator such as CloudNativePG (ADR-0042, Entscheidung 3). It runs as the image's postgres account
# (UID 999), which platforms assigning UIDs themselves (OpenShift restricted-v2) refuse.
evaluationDatabase:
  enabled: false
  image:
    repository: docker.io/pgvector/pgvector
    tag: pg18
    digest: ""
    pullPolicy: IfNotPresent
  persistence:
    size: 8Gi
    storageClassName: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# Embedding endpoint (OpenAI-compatible API) for the transition: read only while the installation
# has no embedding model, and taken over once (ADR-0060); afterwards these values have no effect.
# The key, if the endpoint needs one, comes from the secret (key OPAA_OPENAI_EMBEDDING_API_KEY). A model server inside the cluster
# is addressed by its service, e.g. Ollama: http://ollama.ai.svc.cluster.local:11434/v1
embedding:
  baseUrl: ""
  # e.g. bge-m3, recommended for German texts
  model: ""
  # Dimensions of the embedding model, e.g. 1024 for bge-m3, 768 for nomic-embed-text, 1536 for
  # text-embedding-3-small. Used only by the takeover of an existing vector table; a new table gets
  # the size of the probe embedding. Changing the values later changes nothing.
  dimensions: null
  # Budget of one embedding call; empty keeps the application default (180s, enough for bge-m3 on
  # CPU).
  timeout: ""
  # Input limit of the endpoint in tokens, as it is served; null keeps the application default
  # (2048), right for every Ollama model as pulled (the limit is num_batch, not the context). Set
  # 8192 only for bge-m3 created with PARAMETER num_ctx/num_batch 8192. A chunk that could reach the
  # limit is embedded alone and split when the endpoint proves it too long.
  maxInputTokens: null

# Rerank endpoint (POST {baseUrl}/rerank), read on every start. The key, if needed, comes from the
# secret (key OPAA_RERANK_API_KEY).
rerank:
  enabled: false
  # Without the path /rerank and without credentials in the address, e.g. http://reranker.ai:80
  baseUrl: ""
  # e.g. BAAI/bge-reranker-v2-m3
  model: ""
  # Budget of one rerank request; empty keeps the application default (240s).
  timeout: ""
  # Longest gap without an answer before the endpoint is probed with a real, billable request
  # (at least 10s); real calls reset it. Empty keeps the application default (60s); for a paid
  # endpoint choose a large value such as 24h.
  probeInterval: ""

# Export of the audit log to the SIEM of the house (ADR-0055): syslog with CEF over TCP, TLS by
# default with the JVM trust store, without pseudonyms, from the moment it is switched on.
siemExport:
  enabled: false
  # Host name of the syslog receiver; required when enabled.
  host: ""
  # Empty keeps the application default (6514).
  port: ""
  # "false" sends without TLS; empty keeps TLS on. The receiver's certificate is checked against the
  # JVM trust store; an internal CA goes into extraCACertificates.
  tls: ""
  # true also sends the names of objects (spaces, groups, libraries); they often name persons.
  includeLabels: false
  # Budget of one delivery; empty keeps the default (30s).
  timeout: ""

# Transcription endpoint for dictation in the chat (OpenAI-compatible: POST
# {baseUrl}/audio/transcriptions, GET {baseUrl}/models), read on every start. The key, if needed,
# comes from the secret (key OPAA_TRANSCRIPTION_API_KEY). Recordings are passed through, never
# stored.
transcription:
  enabled: false
  # Without the path /audio/transcriptions and without credentials, e.g. https://stt.example:8000/v1
  baseUrl: ""
  # e.g. Systran/faster-whisper-large-v3
  model: ""
  # ISO-639-1 code passed on to the endpoint; empty keeps the application default (de).
  language: ""
  # Largest recording in bytes; empty keeps the application default (10485760).
  maxAudioBytes: ""
  # Budget of one transcription request; empty keeps the application default (120s).
  timeout: ""
  # Recordings passed on at the same time across the installation; empty keeps the application
  # default (4).
  maxConcurrent: ""

# Malware scan of every file before a library takes it in, against a clamd daemon of the house
# (TCP, INSTREAM). The chart runs no scanner itself. clamd's StreamMaxLength must cover the largest
# file; a NetworkPolicy must let the backend reach host:port.
malwareScan:
  enabled: false
  # Host name or address of clamd, without scheme; required when enabled.
  host: ""
  # Empty keeps the application default (3310).
  port: ""
  # Budget of one whole scan; empty keeps the default (30s).
  timeout: ""
  # REJECT (default when empty) keeps a file the scanner could not judge out, ACCEPT takes it in.
  onUnavailable: ""

# Time limits of the SMTP connection. The mail server itself is an administration setting in the
# user interface, not a value of the chart. Empty keeps the application defaults (10s, 15s, 15s).
mail:
  connectTimeout: ""
  readTimeout: ""
  writeTimeout: ""

# Installation-wide feature flags (OPAA_FEATURES_<NAME>_ENABLED), read once at start-up. Every flag
# is on unless switched off here; switching a feature off hides it and ignores its existing data,
# it deletes nothing. values.schema.json accepts only the flags listed here.
features:
  # Prompt libraries: false hides them from catalog, chat and interface; their data stays.
  promptLibraries:
    enabled: true
  # Metadata of documents and libraries; false keeps only a document's title.
  metadata:
    enabled: true
  # Dictation in the chat; the microphone appears only while transcription is configured too.
  speechInput:
    enabled: true
  # External access (access tokens, library releases, MCP server on /mcp); false removes the
  # channel entirely. Switched on, the channel still opens only through its switch in the
  # administration, which is off by default.
  externalAccess:
    enabled: true

# Host names exempted from the address check (SSRF protection), which refuses private and
# cluster-internal addresses by default.
targetValidation:
  # Sources of libraries inside the cluster or the data centre, e.g. an in-house S3 endpoint or
  # Confluence (OPAA_INDEXING_TARGET_VALIDATION_ALLOWLIST).
  indexingAllowlist: []
  # Further identity providers added in the user interface; the hosts of bootstrap.oidc are always
  # added (OPAA_OIDC_TARGET_VALIDATION_ALLOWLIST).
  identityProviderAllowlist: []

# Where the original documents of uploaded libraries are kept.
uploads:
  # s3 (recommended): an S3-compatible object store; the access keys come from the secret (keys
  # OPAA_UPLOAD_S3_ACCESS_KEY, OPAA_UPLOAD_S3_SECRET_KEY).
  # persistentVolumeClaim: a volume mounted at /app/uploads (ReadWriteOnce suffices for one backend
  # pod; more than one, or backend.updateStrategy RollingUpdate, need ReadWriteMany).
  store: s3
  s3:
    # Required, e.g. https://s3.example.org; for AWS https://s3.<region>.amazonaws.com with
    # pathStyle: false.
    endpoint: ""
    bucket: ""
    region: us-east-1
    # Path-style addressing (https://endpoint/bucket); most in-house stores need it.
    pathStyle: true
    # Prefix of every object key, e.g. opaa/
    keyPrefix: ""
  persistence:
    # Use an existing claim instead of creating one; accessModes below then names its access modes.
    existingClaim: ""
    size: 20Gi
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
    # Group the volume is made writable for (the backend runs as 65532). Empty by default, so that
    # platforms assigning UIDs themselves need no override; set 65532 if the volume is not writable.
    fsGroup: null

# Directories the FILESYSTEM connector may index, each mounted read-only. Their mount paths form the
# allowlist of the connector (OPAA_INDEXING_FILESYSTEM_ALLOWLIST); without entries the source type
# is switched off.
#   - name: shared-drive
#     mountPath: /data/shared-drive
#     volume:
#       persistentVolumeClaim:
#         claimName: shared-drive
#     # or e.g. nfs: { server: nas.example.org, path: /export/opaa }
filesystemSources: []

# CA certificates trusted in addition to the public CAs of the backend's Java runtime: for an
# identity provider, model endpoint, object store, database or SIEM receiver with an internal PKI.
# Every key of the ConfigMap or Secret is read, and every PEM certificate in it, so a bundle (e.g.
# from trust-manager) works as well. An init container writes the runtime's CAs plus these into a fresh
# truststore on every start, so image updates keep bringing new public CAs.
extraCACertificates:
  configMap: ""
  secret: ""

# The answer file of the installation (ADR-0060, Entscheidung 7). With bootstrap.initialAdmin.email
# set, the chart renders it and the first start installs from it, while the installation is pending;
# afterwards it is ignored and the user interface leads. Empty: the installation stays pending until
# it is completed in the browser or over the installation API, with the token from
# secrets.installationToken or, without one, from the log of the first start.
bootstrap:
  initialAdmin:
    # Address of the local emergency system administrator, a deliverable mailbox. Its password
    # comes from the secret (key installation-admin-password, value secrets.initialAdminPassword).
    email: ""
    displayName: Systemverwaltung
  # An OIDC identity provider besides the local accounts, the default provider after the
  # installation. Leave issuerUri empty to start with local user management only (ADR-0033);
  # further providers are added in the user interface. Its hosts pass the address check.
  oidc:
    issuerUri: ""
    clientId: ""
    # Address the backend reads the keys from, if it differs from the discovered one.
    jwkSetUri: ""
    # Name on the sign-in page; empty: a default name.
    displayName: ""
    # Without effect, still accepted so that existing value files keep rendering.
    authority: ""
  # The chat model, checked with a connection test before the installation completes. Its key,
  # if needed, comes from the secret (key installation-chat-api-key): set secrets.chatApiKey, or
  # apiKeyInSecret with secrets.existingSecret.
  chatModel:
    baseUrl: ""
    model: ""
    apiKeyInSecret: false
    # Empty: the defaults of the model administration.
    temperature: null
    maxTokens: null

secrets:
  # Name of an existing secret holding the keys below (recommended: External Secrets, Sealed
  # Secrets, Vault). When set, the chart creates no secret and ignores the values below. A changed
  # key reaches the backend only with its next restart (kubectl rollout restart).
  #   required: OPAA_AUTH_JWT_SECRET, OPAA_DB_PASSWORD, OPAA_CREDENTIALS_ENCRYPTION_KEY,
  #             OPAA_SETTINGS_ENCRYPTION_KEY
  #   required with uploads.store s3: OPAA_UPLOAD_S3_ACCESS_KEY, OPAA_UPLOAD_S3_SECRET_KEY
  #   required with bootstrap.initialAdmin.email: installation-admin-password (a file of the
  #             answer file, not an environment variable)
  #   required with bootstrap.chatModel.apiKeyInSecret: installation-chat-api-key (a file as well)
  #   optional: OPAA_OPENAI_EMBEDDING_API_KEY, OPAA_RERANK_API_KEY, OPAA_TRANSCRIPTION_API_KEY,
  #             OPAA_INSTALLATION_TOKEN
  existingSecret: ""
  # Values for a secret created by the chart. The chart never generates a key: a generated key is
  # lost with helm template, in GitOps tools or on reinstallation (ADR-0042, Entscheidung 5).
  # At least 32 characters, e.g. openssl rand -base64 48
  jwtSecret: ""
  databasePassword: ""
  # Base64 of 32 random bytes each, e.g. openssl rand -base64 32. Losing one makes the secrets
  # encrypted with it unreadable - keep a copy outside of the cluster.
  credentialsEncryptionKey: ""
  settingsEncryptionKey: ""
  s3AccessKey: ""
  s3SecretKey: ""
  embeddingApiKey: ""
  # Key of the chat model in the answer file (installation-chat-api-key).
  chatApiKey: ""
  rerankApiKey: ""
  transcriptionApiKey: ""
  # Password of the first account in the answer file (installation-admin-password), 12 to 64
  # characters, not the address. Can be removed once the installation is completed, together
  # with bootstrap.initialAdmin.email.
  initialAdminPassword: ""
  # Token of the installation API and the browser assistant (OPAA_INSTALLATION_TOKEN), at least
  # 32 characters, e.g. openssl rand -base64 48. Empty: the first start generates one and prints
  # it once into its log.
  installationToken: ""

backend:
  image:
    repository: ghcr.io/criew/opaa-backend
    # Defaults to the chart's appVersion. Between two releases the chart carries 0.0.0-dev, for
    # which no image exists - set "main" or a release version when installing from the repository.
    tag: ""
    # Pins the image by digest (sha256:...); takes precedence over the tag.
    digest: ""
    pullPolicy: IfNotPresent

  # Number of backend pods; 0 stops the backend. More than 1 needs migration.enabled and originals
  # every pod sees: uploads.store s3, or uploads.persistence.accessModes [ReadWriteMany]; otherwise
  # the rendering aborts (ADR-0053, Entscheidung 15). The global rate-limit ceilings
  # (OPAA_RATE_LIMIT_*_GLOBAL_MAX_REQUESTS) count for the installation; every other budget (rate
  # limits per client, embedding concurrency, transcription and attachment slots) counts per pod,
  # see installationBudgets.
  replicas: 1

  # Budgets of the whole installation for the limits that count per pod (ADR-0053, Entscheidung 12):
  # the chart sets each variable to the budget divided by replicas, rounded down, at least 1, so the
  # pods together allow the budget. Keys are the variables, e.g.
  #   OPAA_INDEXING_EMBEDDING_CONCURRENCY: 6
  #   OPAA_RATE_LIMIT_QUERY_MAX_REQUESTS: 20
  # The schema lists the admitted variables. Empty: each pod keeps the application default, the
  # installation allows replicas times as much. Not together with transcription.maxConcurrent or
  # the same variable in extraEnv.
  installationBudgets: {}

  # How a change of the pod template reaches the pods. Empty: Recreate for one pod - the old one
  # ends before the new one starts, a short interruption - and RollingUpdate (maxUnavailable 0,
  # maxSurge 1) for more. RollingUpdate on one pod needs the same as more than one pod. Recreate
  # with several pods is the way to change a value of the configuration fingerprint, which every
  # pod must share (ADR-0053, Entscheidung 4).
  updateStrategy: ""

  # The schema migration as a job of its own (OPAA_MODE=migrate) before the pods; required for more
  # than one pod and for RollingUpdate. The pods then start with SPRING_FLYWAY_ENABLED=false and
  # wait in an init container (OPAA_MODE=await-migration) until the database holds every migration
  # of their version. Off: every pod migrates on its start.
  migration:
    enabled: false
    # Retries of a failed migration; a failed job holds the new pods back, the old ones keep serving.
    backoffLimit: 2
    # Upper bound of the job in seconds; null: none.
    activeDeadlineSeconds: null
    # Of the job's container and of the waiting init container of every backend pod.
    resources:
      requests:
        cpu: 250m
        memory: 384Mi
      limits:
        memory: 768Mi

  # Connections of the database pool of each pod (OPAA_DB_POOL_SIZE); null keeps the application
  # default (10). PostgreSQL must allow
  #   (replicas + 1) x (databasePoolSize + 1) + 2 <= max_connections
  # minus the connections of everything else on the server: the 1 added to replicas is the pod a
  # RollingUpdate starts before it ends an old one (maxSurge), the 1 added to the pool each pod's
  # connection of the invalidation bus outside the pool, the 2 the migration job.
  databasePoolSize: null

  # Port of the actuator endpoints - probes and metrics (MANAGEMENT_SERVER_PORT). Kept apart from the
  # API port, so that a scraper let in by the network policy reaches no API path.
  managementPort: 8081

  # Log format: empty for plain text, or structured JSON for a log collector: ecs, logstash or gelf
  # (LOGGING_STRUCTURED_FORMAT_CONSOLE).
  logFormat: ""

  # How long a stop lets accepted HTTP requests finish (OPAA_SHUTDOWN_TIMEOUT), per shutdown phase.
  # null: 60 with Recreate; with RollingUpdate the frontend's read timeout
  # (frontend.backendReadTimeout), so a chat answer in progress survives the replacement of its pod.
  # With RollingUpdate a smaller value aborts the rendering.
  shutdownTimeoutSeconds: null
  # Must lie above shutdownTimeoutSeconds plus preStopSleepSeconds, otherwise the kubelet cuts the
  # graceful shutdown short. null: both plus 15 seconds.
  terminationGracePeriodSeconds: null
  # With RollingUpdate a stopping pod keeps serving this long (lifecycle.preStop.sleep) while the
  # endpoints drop it, before it refuses new connections. Not rendered with Recreate.
  preStopSleepSeconds: 10

  # Share of the container memory limit the JVM may use as heap (-XX:MaxRAMPercentage, set through
  # JAVA_TOOL_OPTIONS). The rest of the limit belongs to classes, compiled code, threads and buffers.
  # Only effective together with resources.limits.memory; empty leaves the JVM default (25 %).
  maxRamPercentage: 70
  # Further JVM options, appended to JAVA_TOOL_OPTIONS after the heap share, e.g. a JFR recording
  # (-XX:StartFlightRecording=filename=/tmp/opaa.jfr). Targets belong below /tmp, the only writable
  # path besides the storage.
  javaToolOptions: ""
  # Time zone of the backend (TZ): crons, day, month and year boundaries of deadlines and the dates
  # in mails follow it. Part of the configuration fingerprint, the same on every instance (ADR-0053,
  # Entscheidung 9).
  timeZone: UTC

  # Recommendation of docs/handbuch/betrieb/images-und-laufzeit.md ("Speicher und
  # Container-Grenzen").
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi

  # Init containers of the backend pod: the truststore build with extraCACertificates, and the wait
  # for the evaluation database while evaluationDatabase.enabled.
  initResources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

  # The first start runs the schema migration before the probes can answer; the startup probe
  # gives it periodSeconds * failureThreshold (here 10 minutes) before liveness and readiness begin.
  startupProbe:
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 60
  livenessProbe:
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  # /tmp is the only writable path of the backend besides its storage (Tomcat, multipart uploads,
  # downloads). Files there reach the size of a document.
  tmp:
    sizeLimit: 2Gi
    # Set to "Memory" for a tmpfs; then the size counts against the memory limit.
    medium: ""

  service:
    port: 8080

  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  # e.g. a podAntiAffinity that keeps two backend pods off one node.
  affinity: {}
  # Spreads several backend pods over nodes or zones; a constraint without labelSelector gets the
  # backend's pod labels, e.g.
  #   - maxSkew: 1
  #     topologyKey: kubernetes.io/hostname
  #     whenUnsatisfiable: ScheduleAnyway
  topologySpreadConstraints: []
  # Further environment variables, e.g. an OPAA_* setting the values do not cover yet.
  extraEnv: []
  extraEnvFrom: []
  extraVolumes: []
  extraVolumeMounts: []

frontend:
  image:
    repository: ghcr.io/criew/opaa-frontend
    # Defaults to the chart's appVersion, see backend.image.tag.
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent

  # The frontend holds no state and may run more than once.
  replicas: 1

  # A stopping frontend pod keeps serving this long (lifecycle.preStop.sleep) while the endpoints
  # drop it, so a rolling update of the frontend refuses no connection. 0 renders no preStop.
  preStopSleepSeconds: 5

  # Content Security Policy of the frontend nginx: further sources of connect-src, space-separated
  # (OPAA_CSP_CONNECT_SRC_EXTRA). Required when the issuer of an identity provider or the
  # token_endpoint of its discovery document lives on another origin than publicBaseUrl - otherwise
  # the browser blocks the sign-in. CSP Level 3 syntax: origin, host without scheme or *.domain,
  # schemes http, https, ws and wss only; the schema and the image refuse anything else.
  cspConnectSrcExtra: ""

  # How long the frontend nginx waits for the backend's answer on /api/ and /mcp
  # (OPAA_BACKEND_READ_TIMEOUT), a number with unit s, m or h; empty keeps the image default (600s,
  # frontend/Dockerfile). A chat answer arrives in one piece after retrieval, reranking and the
  # model call; raise it together with rerank.timeout. The ingress or gateway in front must wait at
  # least as long.
  backendReadTimeout: ""

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

  livenessProbe:
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3
  readinessProbe:
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

  # nginx writes its generated configuration, pid and proxy buffers (at most 64m per response)
  # below /tmp.
  tmp:
    sizeLimit: 512Mi
    medium: ""

  service:
    type: ClusterIP
    port: 80

  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []

# Metrics of the backend (Micrometer, /actuator/prometheus on backend.managementPort) for the
# cluster's monitoring.
metrics:
  # A ServiceMonitor of the Prometheus Operator, e.g. kube-prometheus-stack.
  serviceMonitor:
    enabled: false
    # Labels the Prometheus selects ServiceMonitors by; kube-prometheus-stack by default
    # release: <its release name>.
    labels: {}
    interval: 30s
    scrapeTimeout: 10s
  # prometheus.io/* annotations on the backend pod, for scrapers configured by annotations.
  podAnnotations: false
  # Who may reach the management port while metrics are on (NetworkPolicy peers). The default
  # matches the Prometheus pods of the Prometheus Operator in any namespace.
  scrapeFrom:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
  # A PrometheusRule with basic alerts; needs serviceMonitor, the readiness alert also
  # kube-state-metrics. Decimal values belong in a values file or --set-json: --set passes them as
  # strings, which the schema refuses.
  prometheusRule:
    enabled: false
    labels: {}
    # Share of answers with status 5xx over 10 minutes ...
    errorRateThreshold: 0.05
    # ... counted only from this many requests in those 10 minutes on.
    errorRateMinRequests: 20
    # Share of the maximum heap in use over 15 minutes.
    heapUsageThreshold: 0.9
    # An indexing run was active for this long without processing a document. Uploads count as
    # processed documents as well.
    indexingStallMinutes: 60

# Client addresses behind the proxy chain ingress/gateway controller -> frontend nginx -> backend.
# The backend reads X-Forwarded-For only from connections out of these networks; the resolved
# address keys every per-address rate limit, the lockout of local sign-ins and
# localAdminAllowedCidrs. Pods have no fixed address, so the list names the pod network (e.g.
# 10.244.0.0/16). That trusts every pod in it, which is acceptable only while no other pod can
# reach frontend or backend: setting the list therefore requires both ingress policies below, and
# the cluster's network plugin must enforce NetworkPolicies - the chart cannot check that.
# Empty (default): the backend sees the frontend pod as client; all users share one counter.
# The controller must set X-Forwarded-For and X-Forwarded-Proto authoritatively and see the real
# client address (e.g. externalTrafficPolicy: Local on its LoadBalancer service).
trustedProxyCidrs: []

# Networks local system administrator accounts may sign in from (OPAA_LOCAL_ADMIN_ALLOWED_CIDRS),
# judged by the client address resolved through trustedProxyCidrs. Empty: no restriction.
localAdminAllowedCidrs: []

# Networks the installation API answers from while the installation is pending
# (OPAA_INSTALLATION_ALLOWED_CIDRS), judged like localAdminAllowedCidrs. Empty: no restriction.
installationAllowedCidrs: []

networkPolicy:
  # Ingress to the backend: only from the frontend pods and the peers below. The pod of helm test
  # reaches the backend through the frontend, see frontendIngress.
  # Blocks no egress, so it breaks no fresh installation (ADR-0042, Entscheidung 4).
  backendIngress:
    enabled: true
    # Further NetworkPolicy peers reaching the API port. With trustedProxyCidrs they count as
    # trusted proxies and need a podSelector, e.g.
    #   - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: tools } }
    #     podSelector: { matchLabels: { app: mcp-gateway } }
    extraFrom: []
  # Ingress to the frontend: only from the ingress or gateway controller and the pod of helm test.
  # On as soon as both selectors name labels (matchLabels or matchExpressions).
  frontendIngress:
    # e.g. { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } }
    controllerNamespaceSelector: {}
    # e.g. { matchLabels: { app.kubernetes.io/name: ingress-nginx } }
    controllerPodSelector: {}
  # Egress of backend and frontend: DNS, the frontend to the backend, the backend to the evaluation
  # database and to the targets below. Off by default - enabled too early, it blocks identity
  # provider, models and sources that are not listed yet. Recommended after the setup.
  egress:
    enabled: false
    # Egress rules to the cluster DNS, for backend and frontend. OpenShift: namespace openshift-dns,
    # pods dns.operator.openshift.io/daemonset-dns: default, port 5353; NodeLocal DNSCache: an
    # ipBlock rule for 169.254.20.10/32.
    dns:
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
            podSelector:
              matchLabels:
                k8s-app: kube-dns
        ports:
          - port: 53
            protocol: UDP
          - port: 53
            protocol: TCP
    # NetworkPolicy egress rules of the backend for everything outside the release: database,
    # identity provider, model endpoints, object store, mail server and the sources of libraries.
    #   - to: [{ ipBlock: { cidr: 10.20.0.15/32 } }]
    #     ports: [{ port: 5432, protocol: TCP }]
    #   - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ai } } }]
    #     ports: [{ port: 11434, protocol: TCP }]
    backendRules: []

# Entry into the cluster; choose Ingress or Gateway API (HTTPRoute). TLS ends there, certificates
# are managed by the operator (e.g. cert-manager). Both send every path to the frontend, whose nginx
# forwards /api/ and /mcp to the backend.
#
# The frontend accepts uploads of up to 52m per request (client_max_body_size in
# frontend/nginx.conf). A chat answer is one response that may take minutes to start, and /mcp may
# answer as an event stream; the frontend waits frontend.backendReadTimeout for either. The
# controller must not give up earlier and must not buffer /mcp or the self-disclosure download
# (/api/v1/me/self-disclosure/download, a ZIP streamed while it is written; buffered, the backend
# would count it as delivered long before it arrived). Each controller names its own
# limits, set them through the annotations, e.g. for ingress-nginx:
#   nginx.ingress.kubernetes.io/proxy-body-size: 52m
#   nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
#   nginx.ingress.kubernetes.io/proxy-buffering: "off"
#   nginx.ingress.kubernetes.io/client-body-buffer-size: 11m
# The last one keeps a dictation recording (up to 11m, see transcription) in memory; with the
# controller's small default buffer it is written to a temporary file on the controller's disk.
# HAProxy Ingress: haproxy-ingress.github.io/proxy-body-size: 52m
# Traefik has no request size limit by default.
ingress:
  enabled: false
  className: ""
  annotations: {}
  # Host name, e.g. opaa.example.org; normally the host of publicBaseUrl.
  host: ""
  # Standard Ingress TLS block, e.g. [{ secretName: opaa-tls, hosts: [opaa.example.org] }]
  tls: []

httpRoute:
  enabled: false
  annotations: {}
  # The existing Gateway the route attaches to, e.g. [{ name: public, namespace: gateway-system }]
  parentRefs: []
  # e.g. [opaa.example.org]
  hostnames: []
  # Gateway API route timeouts, at least frontend.backendReadTimeout, e.g. { request: 600s }; the
  # upload size limit is a property of the Gateway implementation (see its documentation).
  timeouts: {}
