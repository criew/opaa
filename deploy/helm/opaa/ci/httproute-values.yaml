# Entry through the Gateway API only (HTTPRoute, no Ingress); the secrets are throwaway test values.
publicBaseUrl: https://opaa.example.org
database:
  host: postgres.example.org
embedding:
  baseUrl: http://ollama.ai.svc.cluster.local:11434/v1
  model: nomic-embed-text
  dimensions: 768
bootstrap:
  initialAdmin:
    email: it-postfach@example.org
  chatModel:
    baseUrl: http://ollama.ai.svc.cluster.local:11434/v1
    model: qwen2.5:3b
uploads:
  store: s3
  s3:
    endpoint: https://s3.example.org
    bucket: opaa-uploads
secrets:
  s3AccessKey: ci-only-access-key
  s3SecretKey: ci-only-secret-key
  jwtSecret: ci-only-jwt-secret-0123456789abcdefghijklmnop
  databasePassword: ci-only-password
  credentialsEncryptionKey: bjzhjv2AKbnBjZCYAR2V/Glp7TYZzqABwkqXs3lEyCY=
  settingsEncryptionKey: CH1X+hsIYeijer8S9wq5wKRnQa4DpUPePzw4KxGMTMw=
httpRoute:
  enabled: true
  parentRefs:
    - name: public
      namespace: gateway-system
      sectionName: https
  hostnames:
    - opaa.example.org
