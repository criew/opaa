        exp_alerts: []
      - eval_time: 70m
        alertname: OpaaMalwareSignaturesOutdated
        exp_alerts:
          - exp_labels:
              severity: "warning"
              component: "security"
            exp_annotations:
              summary: "Virensignaturen veraltet"
              description: "Die Signaturen des Virenscanners von r-opaa-backend sind älter als 3 Tage."
              runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaMalwareSignaturesOutdated"
  # A refusal at the global limit alerts; refusals of single clients do not.
  - interval: 1m
    input_series:
      - series: 'opaa_rate_limit_rejected_total{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-a",limit="login",scope="global"}'
        values: '0x10 1x20'
      - series: 'opaa_rate_limit_rejected_total{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-a",limit="login",scope="client"}'
        values: '0+5x30'
    alert_rule_test:
      - eval_time: 5m
        alertname: OpaaGlobalRateLimitHit
        exp_alerts: []
      - eval_time: 15m
        alertname: OpaaGlobalRateLimitHit
        exp_alerts:
          - exp_labels:
              severity: "warning"
              component: "security"
              limit: "login"
            exp_annotations:
              summary: "Globale Grenze login erreicht"
              description: "Das Backend r-opaa-backend hat in 15 Minuten Anfragen an der installationsweiten Grenze login abgewiesen."
              runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaGlobalRateLimitHit"
  # 75 refused local sign-ins in 15 minutes without history: above the minimum, an alert.
  - interval: 1m
    input_series:
      - series: 'opaa_auth_logins_total{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-a",method="local",result="bad_credentials"}'
        values: '0+5x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: OpaaLoginFailureSpike
        exp_alerts:
          - exp_labels:
              severity: "warning"
              component: "security"
            exp_annotations:
              summary: "Ungewöhnlich viele abgewiesene Anmeldungen"
              description: "Das Backend r-opaa-backend hat in 15 Minuten 75 Anmeldungen lokaler Konten abgewiesen, ein Vielfaches des Üblichen zu dieser Zeit."
              runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaLoginFailureSpike"
  # 30 refused sign-ins in 15 minutes: below the minimum; refused OIDC tokens do not count.
  - interval: 1m
    input_series:
      - series: 'opaa_auth_logins_total{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-a",method="local",result="bad_credentials"}'
        values: '0+2x30'
      - series: 'opaa_auth_logins_total{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-a",method="oidc",result="bad_credentials"}'
        values: '0+20x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: OpaaLoginFailureSpike
        exp_alerts: []
  # 60 refusals every quarter hour for eight days: the usual level at this time, no alert.
  - interval: 15m
    input_series:
      - series: 'opaa_auth_logins_total{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-a",method="local",result="bad_credentials"}'
        values: '0+60x800'
    alert_rule_test:
      - eval_time: 8d
        alertname: OpaaLoginFailureSpike
        exp_alerts: []
  # A refused check of a new target because the table is full: a ticket.
  - interval: 1m
    input_series:
      - series: 'opaa_target_validation_refused_checks_total{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-a"}'
        values: '0x10 1x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: OpaaTargetValidationTableFull
        exp_alerts:
          - exp_labels:
              severity: "warning"
              component: "security"
            exp_annotations:
              summary: "Zielprüfung lehnt neue Ziele ab"
              description: "Die Tabelle der bewachten Ziele von r-opaa-backend ist voll; neue Ziele lassen sich bis zum Neustart nicht speichern."
              runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaTargetValidationTableFull"
  # The oldest entry not yet exported is over an hour old for 30 minutes: a ticket.
  - interval: 1m
    input_series:
      - series: 'opaa_siem_export_lag_seconds{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-a"}'
        values: '4000x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: OpaaSiemExportLagging
        exp_alerts: []
      - eval_time: 35m
        alertname: OpaaSiemExportLagging
        exp_alerts:
          - exp_labels:
              severity: "warning"
              component: "security"
            exp_annotations:
              summary: "Ausleitung an das Sicherheitsmonitoring im Rückstand"
              description: "Der älteste nicht ausgeleitete Eintrag von r-opaa-backend ist seit 30 Minuten älter als 60 Minuten."
              runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaSiemExportLagging"
  # An installation left open for an hour: a ticket; a finished one stays silent.
  - interval: 1m
    input_series:
      - series: 'opaa_installation_pending{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-a"}'
        values: '1x70'
    alert_rule_test:
      - eval_time: 30m
        alertname: OpaaInstallationPending
        exp_alerts: []
      - eval_time: 65m
        alertname: OpaaInstallationPending
        exp_alerts:
          - exp_labels:
              severity: "warning"
              component: "security"
            exp_annotations:
              summary: "Installation nicht abgeschlossen"
              description: "Die Installation von r-opaa-backend steht seit einer Stunde offen; wer das Installations-Token kennt, kann sie übernehmen."
              runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaInstallationPending"
  # A finished installation: no alert.
  - interval: 1m
    input_series:
      - series: 'opaa_installation_pending{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-a"}'
        values: '0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: OpaaInstallationPending
        exp_alerts: []
