# Unit test of the alerts in templates/prometheusrule.yaml (release "r", namespace "opaa"), run from
# the repository root with deploy/helm/ci/rule-test.sh; that script renders the rules into
# opaa-rules.yaml next to a copy of this file.
rule_files:
  - opaa-rules.yaml
evaluation_interval: 1m
tests:
  # Idle for two hours, then a run that processes its first document after 20 minutes: no alert,
  # because the run was not active through the whole window.
  - interval: 1m
    input_series:
      - series: 'executor_active_threads{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-a",name="indexingTaskExecutor"}'
        values: '0x119 1x60'
      - series: 'opaa_indexing_documents_total{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-a",result="processed"}'
        values: '5x139 6x40'
    alert_rule_test:
      - eval_time: 136m
        alertname: OpaaIndexingStalled
        exp_alerts: []
  # A run active from the pod start on without any document: no alert before the series is as old
  # as the window, then after the window plus the 5 minutes of "for".
  - interval: 1m
    input_series:
      - series: 'executor_active_threads{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-a",name="indexingTaskExecutor"}'
        values: '1x90'
      - series: 'opaa_indexing_documents_total{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-a",result="processed"}'
        values: '5x90'
    alert_rule_test:
      - eval_time: 62m
        alertname: OpaaIndexingStalled
        exp_alerts: []
      - eval_time: 70m
        alertname: OpaaIndexingStalled
        exp_alerts:
          - exp_labels:
              severity: warning
              pod: r-opaa-backend-a
            exp_annotations:
              summary: Indexierung ohne Fortschritt
              description: "Ein Indexierungslauf im Pod r-opaa-backend-a von r-opaa-backend ist aktiv, hat aber seit 60 Minuten kein Dokument verarbeitet. Laufstatus der Bibliothek und Erreichbarkeit von Quelle und Embedding-Modell prüfen."
  # Two pods: a stalls while b keeps processing its own run. The pod of the stalled run alerts; the
  # sum over both pods would hide it.
  - interval: 1m
    input_series:
      - series: 'executor_active_threads{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-a",name="indexingTaskExecutor"}'
        values: '1x90'
      - series: 'opaa_indexing_documents_total{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-a",result="processed"}'
        values: '5x90'
      - series: 'executor_active_threads{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-b",name="indexingTaskExecutor"}'
        values: '1x90'
      - series: 'opaa_indexing_documents_total{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-b",result="processed"}'
        values: '0+1x90'
    alert_rule_test:
      - eval_time: 70m
        alertname: OpaaIndexingStalled
        exp_alerts:
          - exp_labels:
              severity: warning
              pod: r-opaa-backend-a
            exp_annotations:
              summary: Indexierung ohne Fortschritt
              description: "Ein Indexierungslauf im Pod r-opaa-backend-a von r-opaa-backend ist aktiv, hat aber seit 60 Minuten kein Dokument verarbeitet. Laufstatus der Bibliothek und Erreichbarkeit von Quelle und Embedding-Modell prüfen."
  # Stopped on purpose (replicas 0): neither readiness nor missing metrics alert.
  - interval: 1m
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="opaa",deployment="r-opaa-backend"}'
        values: '0x30'
      - series: 'kube_deployment_status_replicas_available{namespace="opaa",deployment="r-opaa-backend"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: OpaaBackendMetricsMissing
        exp_alerts: []
      - eval_time: 25m
        alertname: OpaaBackendNotReady
        exp_alerts: []
  # One replica wanted, none ready and no scrape: both alerts fire.
  - interval: 1m
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="opaa",deployment="r-opaa-backend"}'
        values: '1x30'
      - series: 'kube_deployment_status_replicas_available{namespace="opaa",deployment="r-opaa-backend"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: OpaaBackendMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Keine Metriken vom OPAA-Backend
              description: "Prometheus erreicht /actuator/prometheus von mindestens einem Pod des Backends r-opaa-backend seit zehn Minuten nicht. Pods, ServiceMonitor und die NetworkPolicy (metrics.scrapeFrom) prüfen."
      - eval_time: 25m
        alertname: OpaaBackendNotReady
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: opaa
              deployment: r-opaa-backend
            exp_annotations:
              summary: OPAA-Backend ist nicht bereit
              description: "Das Backend r-opaa-backend in opaa ist seit zehn Minuten nicht bereit. Anmeldung und Suche sind nicht verfügbar. Protokoll des Pods und /actuator/health/readiness prüfen (Datenbank erreichbar?)."
  # Two failures among few requests do not alert; a steady 10 % failure share does.
  - interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{namespace="opaa",service="r-opaa-backend",status="500"}'
        values: '0+0.2x40'
      - series: 'http_server_requests_seconds_count{namespace="opaa",service="r-opaa-backend",status="200"}'
        values: '0+0.4x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: OpaaHighErrorRate
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{namespace="opaa",service="r-opaa-backend",status="500"}'
        values: '0+1x40'
      - series: 'http_server_requests_seconds_count{namespace="opaa",service="r-opaa-backend",status="200"}'
        values: '0+9x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: OpaaHighErrorRate
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Viele Fehlerantworten des OPAA-Backends
              description: "Mehr als 5 % der Anfragen an r-opaa-backend enden seit zehn Minuten mit einem Status 5xx. Häufige Ursache: ein nicht erreichbares Modell. Protokoll des Pods prüfen."
  # Two pods wanted, one of them without scrape: the missing pod alerts although the other answers.
  - interval: 1m
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="opaa",deployment="r-opaa-backend"}'
        values: '2x30'
      - series: 'up{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-a"}'
        values: '1x30'
      - series: 'up{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-b"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: OpaaBackendMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Keine Metriken vom OPAA-Backend
              description: "Prometheus erreicht /actuator/prometheus von mindestens einem Pod des Backends r-opaa-backend seit zehn Minuten nicht. Pods, ServiceMonitor und die NetworkPolicy (metrics.scrapeFrom) prüfen."
  # Two pods wanted and both scraped: no alert.
  - interval: 1m
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="opaa",deployment="r-opaa-backend"}'
        values: '2x30'
      - series: 'up{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-a"}'
        values: '1x30'
      - series: 'up{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-b"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: OpaaBackendMetricsMissing
        exp_alerts: []
  # Without kube-state-metrics, no pod scraped at all still alerts.
  - interval: 1m
    input_series:
      - series: 'up{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-a"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: OpaaBackendMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Keine Metriken vom OPAA-Backend
              description: "Prometheus erreicht /actuator/prometheus von mindestens einem Pod des Backends r-opaa-backend seit zehn Minuten nicht. Pods, ServiceMonitor und die NetworkPolicy (metrics.scrapeFrom) prüfen."
  # Two pods, one heap full and one nearly empty: the full pod alerts; summed over both pods the
  # share would stay at 52 %.
  - interval: 1m
    input_series:
      - series: 'jvm_memory_used_bytes{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-a",area="heap",id="G1 Old Gen"}'
        values: '95x30'
      - series: 'jvm_memory_max_bytes{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-a",area="heap",id="G1 Old Gen"}'
        values: '100x30'
      - series: 'jvm_memory_used_bytes{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-b",area="heap",id="G1 Old Gen"}'
        values: '10x30'
      - series: 'jvm_memory_max_bytes{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-b",area="heap",id="G1 Old Gen"}'
        values: '100x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: OpaaHeapUsageHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              pod: r-opaa-backend-a
            exp_annotations:
              summary: Heap des OPAA-Backends fast voll
              description: "Der Pod r-opaa-backend-a von r-opaa-backend nutzt seit 15 Minuten mehr als 90 % seines Heaps. Speichergrenze (backend.resources.limits.memory) oder backend.maxRamPercentage anheben."
  # Two pods report the same overdue retention run: one alert without a pod label, after the hour of
  # "for".
  - interval: 1m
    input_series:
      - series: 'opaa_audit_retention_last_run_age_seconds{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-a"}'
        values: '3024001x90'
      - series: 'opaa_audit_retention_last_run_age_seconds{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-b"}'
        values: '3024001x90'
    alert_rule_test:
      - eval_time: 30m
        alertname: OpaaAuditRetentionOverdue
        exp_alerts: []
      - eval_time: 61m
        alertname: OpaaAuditRetentionOverdue
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Löschlauf des Revisionsprotokolls ausgeblieben
              description: "Die automatische Löschung des Revisionsprotokolls von r-opaa-backend ist seit mehr als 35 Tagen nicht gelaufen, oder das Backend kann ihren Stand nicht lesen. Abgelaufene Monate bleiben dann womöglich stehen und das Protokoll wächst über die Aufbewahrungsfrist hinaus. Log des Pods prüfen, vor allem am 1. des Monats um 03:00."
  # Neither pod can read the state (NaN): one alert after the hour of "for", as for a missed run.
  - interval: 1m
    input_series:
      - series: 'opaa_audit_retention_last_run_age_seconds{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-a"}'
        values: 'NaN+0x90'
      - series: 'opaa_audit_retention_last_run_age_seconds{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-b"}'
        values: 'NaN+0x90'
    alert_rule_test:
      - eval_time: 30m
        alertname: OpaaAuditRetentionOverdue
        exp_alerts: []
      - eval_time: 61m
        alertname: OpaaAuditRetentionOverdue
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Löschlauf des Revisionsprotokolls ausgeblieben
              description: "Die automatische Löschung des Revisionsprotokolls von r-opaa-backend ist seit mehr als 35 Tagen nicht gelaufen, oder das Backend kann ihren Stand nicht lesen. Abgelaufene Monate bleiben dann womöglich stehen und das Protokoll wächst über die Aufbewahrungsfrist hinaus. Log des Pods prüfen, vor allem am 1. des Monats um 03:00."
  # One pod cannot read the state, the other reports a recent run: no alert.
  - interval: 1m
    input_series:
      - series: 'opaa_audit_retention_last_run_age_seconds{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-a"}'
        values: 'NaN+0x90'
      - series: 'opaa_audit_retention_last_run_age_seconds{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-b"}'
        values: '864000x90'
    alert_rule_test:
      - eval_time: 80m
        alertname: OpaaAuditRetentionOverdue
        exp_alerts: []
  # The backend runs but reports no series: one alert after the hour of "for".
  - interval: 1m
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="opaa",deployment="r-opaa-backend"}'
        values: '1x90'
    alert_rule_test:
      - eval_time: 61m
        alertname: OpaaAuditRetentionOverdue
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Löschlauf des Revisionsprotokolls ausgeblieben
              description: "Die automatische Löschung des Revisionsprotokolls von r-opaa-backend ist seit mehr als 35 Tagen nicht gelaufen, oder das Backend kann ihren Stand nicht lesen. Abgelaufene Monate bleiben dann womöglich stehen und das Protokoll wächst über die Aufbewahrungsfrist hinaus. Log des Pods prüfen, vor allem am 1. des Monats um 03:00."
  # The backend is stopped on purpose (replicas 0): no series and no alert.
  - interval: 1m
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="opaa",deployment="r-opaa-backend"}'
        values: '0x90'
    alert_rule_test:
      - eval_time: 80m
        alertname: OpaaAuditRetentionOverdue
        exp_alerts: []
  # A run in the current month: no alert.
  - interval: 1m
    input_series:
      - series: 'opaa_audit_retention_last_run_age_seconds{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-a"}'
        values: '864000x90'
    alert_rule_test:
      - eval_time: 80m
        alertname: OpaaAuditRetentionOverdue
        exp_alerts: []
  # The oldest unchained entry is seven hours old on every pod: the chain stalled.
  - interval: 1m
    input_series:
      - series: 'opaa_audit_chain_lag_seconds{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-a"}'
        values: '25200x90'
      - series: 'opaa_audit_chain_lag_seconds{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-b"}'
        values: '25200x90'
    alert_rule_test:
      - eval_time: 30m
        alertname: OpaaAuditChainStalled
        exp_alerts: []
      - eval_time: 61m
        alertname: OpaaAuditChainStalled
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Prüfsummenkette des Revisionsprotokolls steht
              description: "Der älteste Eintrag des Revisionsprotokolls von r-opaa-backend ohne Kontrollpunkt der Prüfsummenkette ist seit mehr als einer Stunde älter als sechs Stunden, oder das Backend kann den Stand der Kette nicht lesen. Log der Pods, die Sperre audit-chain in der Tabelle shedlock und offene Transaktionen in pg_stat_activity prüfen."
  # Neither pod can read the chain (NaN): one alert after the hour of "for".
  - interval: 1m
    input_series:
      - series: 'opaa_audit_chain_lag_seconds{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-a"}'
        values: 'NaN+0x90'
      - series: 'opaa_audit_chain_lag_seconds{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-b"}'
        values: 'NaN+0x90'
    alert_rule_test:
      - eval_time: 61m
        alertname: OpaaAuditChainStalled
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Prüfsummenkette des Revisionsprotokolls steht
              description: "Der älteste Eintrag des Revisionsprotokolls von r-opaa-backend ohne Kontrollpunkt der Prüfsummenkette ist seit mehr als einer Stunde älter als sechs Stunden, oder das Backend kann den Stand der Kette nicht lesen. Log der Pods, die Sperre audit-chain in der Tabelle shedlock und offene Transaktionen in pg_stat_activity prüfen."
  # One pod cannot read the chain, the other reports a fresh one: no alert.
  - interval: 1m
    input_series:
      - series: 'opaa_audit_chain_lag_seconds{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-a"}'
        values: 'NaN+0x90'
      - series: 'opaa_audit_chain_lag_seconds{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-b"}'
        values: '540x90'
    alert_rule_test:
      - eval_time: 80m
        alertname: OpaaAuditChainStalled
        exp_alerts: []
  # The backend runs but reports no chain series: one alert after the hour of "for".
  - interval: 1m
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="opaa",deployment="r-opaa-backend"}'
        values: '1x90'
    alert_rule_test:
      - eval_time: 61m
        alertname: OpaaAuditChainStalled
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Prüfsummenkette des Revisionsprotokolls steht
              description: "Der älteste Eintrag des Revisionsprotokolls von r-opaa-backend ohne Kontrollpunkt der Prüfsummenkette ist seit mehr als einer Stunde älter als sechs Stunden, oder das Backend kann den Stand der Kette nicht lesen. Log der Pods, die Sperre audit-chain in der Tabelle shedlock und offene Transaktionen in pg_stat_activity prüfen."
  # The backend is stopped on purpose (replicas 0): no chain series and no alert.
  - interval: 1m
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="opaa",deployment="r-opaa-backend"}'
        values: '0x90'
    alert_rule_test:
      - eval_time: 80m
        alertname: OpaaAuditChainStalled
        exp_alerts: []
  # A lag of a few minutes between two runs: no alert.
  - interval: 1m
    input_series:
      - series: 'opaa_audit_chain_lag_seconds{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-a"}'
        values: '540x90'
    alert_rule_test:
      - eval_time: 80m
        alertname: OpaaAuditChainStalled
        exp_alerts: []
  # The counter starts at 0 with the pod; the first dropped key alerts for an hour, then silence
  # without a further drop.
  - interval: 1m
    input_series:
      - series: 'opaa_audit_payload_dropped_total{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-a",event_type="SPACE_CHANGED"}'
        values: '0x29 1x120'
    alert_rule_test:
      - eval_time: 20m
        alertname: OpaaAuditPayloadDropped
        exp_alerts: []
      - eval_time: 35m
        alertname: OpaaAuditPayloadDropped
        exp_alerts:
          - exp_labels:
              severity: warning
              event_type: SPACE_CHANGED
            exp_annotations:
              summary: Revisionsprotokoll ohne nicht gelistete Angaben geschrieben
              description: "Das Backend r-opaa-backend hat in der letzten Stunde Einträge der Art SPACE_CHANGED ohne Angaben geschrieben, die der Ereigniskatalog nicht nennt. Der Vorgang selbst ist durchgeführt. Ein Programmfehler: Log des Pods nach „Dropped audit payload keys“ durchsuchen und den Fund melden."
      - eval_time: 100m
        alertname: OpaaAuditPayloadDropped
        exp_alerts: []
  # A further drop on an older counter: an alert per event type, summed over the pods.
  - interval: 1m
    input_series:
      - series: 'opaa_audit_payload_dropped_total{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-a",event_type="SPACE_CHANGED"}'
        values: '1x89 2x60'
      - series: 'opaa_audit_payload_dropped_total{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-b",event_type="SPACE_CHANGED"}'
        values: '3x150'
    alert_rule_test:
      - eval_time: 85m
        alertname: OpaaAuditPayloadDropped
        exp_alerts: []
      - eval_time: 95m
        alertname: OpaaAuditPayloadDropped
        exp_alerts:
          - exp_labels:
              severity: warning
              event_type: SPACE_CHANGED
            exp_annotations:
              summary: Revisionsprotokoll ohne nicht gelistete Angaben geschrieben
              description: "Das Backend r-opaa-backend hat in der letzten Stunde Einträge der Art SPACE_CHANGED ohne Angaben geschrieben, die der Ereigniskatalog nicht nennt. Der Vorgang selbst ist durchgeführt. Ein Programmfehler: Log des Pods nach „Dropped audit payload keys“ durchsuchen und den Fund melden."
  # Nothing dropped, but a scrape gap of 20 minutes and a pod whose series begins only after 70
  # minutes (pod start or Prometheus restart): no alert.
  - interval: 1m
    input_series:
      - series: 'opaa_audit_payload_dropped_total{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-a",event_type="SPACE_CHANGED"}'
        values: '0x39 _x19 0x60'
      - series: 'opaa_audit_payload_dropped_total{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-b",event_type="SPACE_CHANGED"}'
        values: '_x69 0x50'
    alert_rule_test:
      - eval_time: 65m
        alertname: OpaaAuditPayloadDropped
        exp_alerts: []
      - eval_time: 80m
        alertname: OpaaAuditPayloadDropped
        exp_alerts: []
