# Unit test of the alerts in templates/prometheusrule.yaml (release "r", namespace "opaa"), run from
# the repository root with deploy/helm/ci/rule-test.sh; that script renders the rules into
# opaa-rules.yaml next to a copy of this file. Every alert has a case that fires and one that does
# not, quotients also one below their minimum volume.
rule_files:
  - opaa-rules.yaml
evaluation_interval: 1m
tests:
  # Idle for two hours, then a run that processes its first document after 20 minutes: no alert,
  # because the run was not active through the whole window.
  - interval: 1m
    input_series:
      - series: 'executor_active_threads{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-a",name="indexingTaskExecutor"}'
        values: '0x119 1x60'
      - series: 'opaa_indexing_documents_total{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-a",result="processed"}'
        values: '5x139 6x40'
    alert_rule_test:
      - eval_time: 136m
        alertname: OpaaIndexingStalled
        exp_alerts: []
  # A run active from the pod start on without any document: no alert before the series is as old
  # as the window, then after the window plus the 5 minutes of "for".
  - interval: 1m
    input_series:
      - series: 'executor_active_threads{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-a",name="indexingTaskExecutor"}'
        values: '1x90'
      - series: 'opaa_indexing_documents_total{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-a",result="processed"}'
        values: '5x90'
    alert_rule_test:
      - eval_time: 62m
        alertname: OpaaIndexingStalled
        exp_alerts: []
      - eval_time: 70m
        alertname: OpaaIndexingStalled
        exp_alerts:
          - exp_labels:
              severity: "warning"
              component: "indexing"
              pod: "r-opaa-backend-a"
            exp_annotations:
              summary: "Indexierung ohne Fortschritt"
              description: "Ein Indexierungslauf im Pod r-opaa-backend-a von r-opaa-backend ist aktiv, hat aber seit 60 Minuten kein Dokument verarbeitet."
              runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaIndexingStalled"
  # A fresh pod registers the documents series of every connector at 0 on start: its first run,
  # which never processes a document, still alerts instead of leaving the expression empty.
  - interval: 1m
    input_series:
      - series: 'executor_active_threads{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-a",name="indexingTaskExecutor"}'
        values: '1x90'
      - series: 'opaa_indexing_documents_total{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-a",connector="confluence",result="processed"}'
        values: '0x90'
      - series: 'opaa_indexing_documents_total{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-a",connector="upload",result="failed"}'
        values: '0x90'
    alert_rule_test:
      - eval_time: 70m
        alertname: OpaaIndexingStalled
        exp_alerts:
          - exp_labels:
              severity: "warning"
              component: "indexing"
              pod: "r-opaa-backend-a"
            exp_annotations:
              summary: "Indexierung ohne Fortschritt"
              description: "Ein Indexierungslauf im Pod r-opaa-backend-a von r-opaa-backend ist aktiv, hat aber seit 60 Minuten kein Dokument verarbeitet."
              runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaIndexingStalled"
  # Two pods: a stalls while b keeps processing its own run. The pod of the stalled run alerts; the
  # sum over both pods would hide it.
  - interval: 1m
    input_series:
      - series: 'executor_active_threads{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-a",name="indexingTaskExecutor"}'
        values: '1x90'
      - series: 'opaa_indexing_documents_total{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-a",result="processed"}'
        values: '5x90'
      - series: 'executor_active_threads{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-b",name="indexingTaskExecutor"}'
        values: '1x90'
      - series: 'opaa_indexing_documents_total{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-b",result="processed"}'
        values: '0+1x90'
    alert_rule_test:
      - eval_time: 70m
        alertname: OpaaIndexingStalled
        exp_alerts:
          - exp_labels:
              severity: "warning"
              component: "indexing"
              pod: "r-opaa-backend-a"
            exp_annotations:
              summary: "Indexierung ohne Fortschritt"
              description: "Ein Indexierungslauf im Pod r-opaa-backend-a von r-opaa-backend ist aktiv, hat aber seit 60 Minuten kein Dokument verarbeitet."
              runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaIndexingStalled"
  # Stopped on purpose (replicas 0): neither readiness nor missing metrics alert.
  - interval: 1m
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="opaa",deployment="r-opaa-backend"}'
        values: '0x30'
      - series: 'kube_deployment_status_replicas_available{namespace="opaa",deployment="r-opaa-backend"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: OpaaBackendMetricsMissing
        exp_alerts: []
      - eval_time: 25m
        alertname: OpaaBackendNotReady
        exp_alerts: []
  # One replica wanted, none ready and no scrape: the critical readiness alert and the missing
  # metrics fire, the partial one does not.
  - interval: 1m
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="opaa",deployment="r-opaa-backend"}'
        values: '1x30'
      - series: 'kube_deployment_status_replicas_available{namespace="opaa",deployment="r-opaa-backend"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: OpaaBackendMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: "warning"
              component: "platform"
            exp_annotations:
              summary: "Keine Metriken vom OPAA-Backend"
              description: "Prometheus erreicht /actuator/prometheus von mindestens einem Pod des Backends r-opaa-backend seit zehn Minuten nicht."
              runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaBackendMetricsMissing"
      - eval_time: 25m
        alertname: OpaaBackendNotReady
        exp_alerts:
          - exp_labels:
              severity: "critical"
              component: "platform"
              namespace: "opaa"
              deployment: "r-opaa-backend"
            exp_annotations:
              summary: "Kein Pod des OPAA-Backends bereit"
              description: "Das Backend r-opaa-backend in opaa hat seit zehn Minuten keinen bereiten Pod; Anmeldung und Fragen sind nicht möglich."
              runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaBackendNotReady"
  # Two of three pods ready: a ticket after 15 minutes, no page.
  - interval: 1m
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="opaa",deployment="r-opaa-backend"}'
        values: '3x30'
      - series: 'kube_deployment_status_replicas_available{namespace="opaa",deployment="r-opaa-backend"}'
        values: '2x30'
    alert_rule_test:
      - eval_time: 12m
        alertname: OpaaBackendNotReady
        exp_alerts: []
      - eval_time: 20m
        alertname: OpaaBackendNotReady
        exp_alerts:
          - exp_labels:
              severity: "warning"
              component: "platform"
              namespace: "opaa"
              deployment: "r-opaa-backend"
            exp_annotations:
              summary: "Nicht alle Pods des OPAA-Backends bereit"
              description: "Das Backend r-opaa-backend in opaa hat seit 15 Minuten weniger bereite Pods als gewünscht."
              runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaBackendNotReady"
  # Two pods wanted, one of them without scrape: the missing pod alerts although the other answers.
  - interval: 1m
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="opaa",deployment="r-opaa-backend"}'
        values: '2x30'
      - series: 'up{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-a"}'
        values: '1x30'
      - series: 'up{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-b"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: OpaaBackendMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: "warning"
              component: "platform"
            exp_annotations:
              summary: "Keine Metriken vom OPAA-Backend"
              description: "Prometheus erreicht /actuator/prometheus von mindestens einem Pod des Backends r-opaa-backend seit zehn Minuten nicht."
              runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaBackendMetricsMissing"
  # Two pods wanted and both scraped: no alert.
  - interval: 1m
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="opaa",deployment="r-opaa-backend"}'
        values: '2x30'
      - series: 'up{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-a"}'
        values: '1x30'
      - series: 'up{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-b"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: OpaaBackendMetricsMissing
        exp_alerts: []
  # Without kube-state-metrics, no pod scraped at all still alerts.
  - interval: 1m
    input_series:
      - series: 'up{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-a"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: OpaaBackendMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: "warning"
              component: "platform"
            exp_annotations:
              summary: "Keine Metriken vom OPAA-Backend"
              description: "Prometheus erreicht /actuator/prometheus von mindestens einem Pod des Backends r-opaa-backend seit zehn Minuten nicht."
              runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaBackendMetricsMissing"
  # Frontend: none of one pod ready pages after five minutes; one of two ready is a ticket.
  - interval: 1m
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="opaa",deployment="r-opaa-frontend"}'
        values: '1x20'
      - series: 'kube_deployment_status_replicas_available{namespace="opaa",deployment="r-opaa-frontend"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 3m
        alertname: OpaaFrontendNotReady
        exp_alerts: []
      - eval_time: 8m
        alertname: OpaaFrontendNotReady
        exp_alerts:
          - exp_labels:
              severity: "critical"
              component: "platform"
              namespace: "opaa"
              deployment: "r-opaa-frontend"
            exp_annotations:
              summary: "Kein Pod des OPAA-Frontends bereit"
              description: "Das Frontend r-opaa-frontend in opaa hat seit fünf Minuten keinen bereiten Pod; die Oberfläche ist nicht erreichbar."
              runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaFrontendNotReady"
  # Frontend with one of two pods ready: a ticket.
  - interval: 1m
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="opaa",deployment="r-opaa-frontend"}'
        values: '2x20'
      - series: 'kube_deployment_status_replicas_available{namespace="opaa",deployment="r-opaa-frontend"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 8m
        alertname: OpaaFrontendNotReady
        exp_alerts:
          - exp_labels:
              severity: "warning"
              component: "platform"
              namespace: "opaa"
              deployment: "r-opaa-frontend"
            exp_annotations:
              summary: "Nicht alle Pods des OPAA-Frontends bereit"
              description: "Das Frontend r-opaa-frontend in opaa hat seit fünf Minuten weniger bereite Pods als gewünscht."
              runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaFrontendNotReady"
  # Frontend stopped on purpose (replicas 0): no alert.
  - interval: 1m
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="opaa",deployment="r-opaa-frontend"}'
        values: '0x20'
      - series: 'kube_deployment_status_replicas_available{namespace="opaa",deployment="r-opaa-frontend"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: OpaaFrontendNotReady
        exp_alerts: []
  # Two pods, live data after garbage collection near the maximum on a, low on b: a alerts.
  - interval: 1m
    input_series:
      - series: 'jvm_gc_live_data_size_bytes{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-a"}'
        values: '90x30'
      - series: 'jvm_gc_max_data_size_bytes{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-a"}'
        values: '100x30'
      - series: 'jvm_gc_live_data_size_bytes{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-b"}'
        values: '20x30'
      - series: 'jvm_gc_max_data_size_bytes{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-b"}'
        values: '100x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: OpaaHeapUsageHigh
        exp_alerts: []
      - eval_time: 20m
        alertname: OpaaHeapUsageHigh
        exp_alerts:
          - exp_labels:
              severity: "warning"
              component: "platform"
              pod: "r-opaa-backend-a"
            exp_annotations:
              summary: "Heap des OPAA-Backends nach der Speicherbereinigung fast voll"
              description: "Der Pod r-opaa-backend-a von r-opaa-backend belegt seit 15 Minuten nach der Speicherbereinigung mehr als 85 % seines Heaps."
              runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaHeapUsageHigh"
  # A connection timeout in the pool alerts at once; without one nothing.
  - interval: 1m
    input_series:
      - series: 'hikaricp_connections_timeout_total{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-a",pool="HikariPool-1"}'
        values: '0x10 1x20'
      - series: 'hikaricp_connections_timeout_total{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-b",pool="HikariPool-1"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 5m
        alertname: OpaaDatabasePoolTimeouts
        exp_alerts: []
      - eval_time: 15m
        alertname: OpaaDatabasePoolTimeouts
        exp_alerts:
          - exp_labels:
              severity: "warning"
              component: "platform"
              pod: "r-opaa-backend-a"
            exp_annotations:
              summary: "Anfragen bekommen keine Datenbankverbindung"
              description: "Im Pod r-opaa-backend-a von r-opaa-backend haben Anfragen in den letzten zehn Minuten vergeblich auf eine Verbindung aus dem Connection Pool gewartet."
              runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaDatabasePoolTimeouts"
  # A heartbeat older than three intervals for five minutes alerts for that pod only.
  - interval: 1m
    input_series:
      - series: 'opaa_instance_heartbeat_age_seconds{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-a"}'
        values: '120x20'
      - series: 'opaa_instance_heartbeat_age_seconds{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-b"}'
        values: '10x20'
    alert_rule_test:
      - eval_time: 3m
        alertname: OpaaInstanceHeartbeatStale
        exp_alerts: []
      - eval_time: 10m
        alertname: OpaaInstanceHeartbeatStale
        exp_alerts:
          - exp_labels:
              severity: "warning"
              component: "platform"
              pod: "r-opaa-backend-a"
            exp_annotations:
              summary: "Herzschlag einer OPAA-Instanz veraltet"
              description: "Der Pod r-opaa-backend-a von r-opaa-backend hat seinen Herzschlag seit mehr als 45 Sekunden nicht geschrieben."
              runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaInstanceHeartbeatStale"
  # A pod off the invalidation bus for ten minutes alerts; a short drop does not.
  - interval: 1m
    input_series:
      - series: 'opaa_invalidation_bus_connected{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-a"}'
        values: '0x20'
      - series: 'opaa_invalidation_bus_connected{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-b"}'
        values: '1x5 0x3 1x12'
    alert_rule_test:
      - eval_time: 15m
        alertname: OpaaInvalidationBusDisconnected
        exp_alerts:
          - exp_labels:
              severity: "warning"
              component: "platform"
              pod: "r-opaa-backend-a"
            exp_annotations:
              summary: "OPAA-Instanz hört keine Cache-Meldungen"
              description: "Der Pod r-opaa-backend-a von r-opaa-backend ist seit zehn Minuten nicht mit dem Kanal der Cache-Meldungen verbunden und liest an seinen Zwischenspeichern vorbei."
              runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaInvalidationBusDisconnected"
  # Two versions for 40 minutes, reported alike by both pods: one alert; after 20 minutes none yet.
  - interval: 1m
    input_series:
      - series: 'opaa_instances_versions{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-a"}'
        values: '2x45'
      - series: 'opaa_instances_versions{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-b"}'
        values: '2x45'
    alert_rule_test:
      - eval_time: 20m
        alertname: OpaaVersionMix
        exp_alerts: []
      - eval_time: 40m
        alertname: OpaaVersionMix
        exp_alerts:
          - exp_labels:
              severity: "warning"
              component: "platform"
            exp_annotations:
              summary: "Mehrere OPAA-Versionen laufen nebeneinander"
              description: "Die Instanzen von r-opaa-backend laufen seit 30 Minuten mit mehr als einer Version; ein Rolling Update hängt."
              runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaVersionMix"
  # A queue gauge NaN on every pod alerts after 30 minutes with the metric named; NaN on one pod
  # only, the OCR backlog (NaN while text recognition is off) and private inventory do not.
  - interval: 1m
    input_series:
      - series: 'opaa_queue_depth{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-a",queue="mail_outbox"}'
        values: 'NaN+0x40'
      - series: 'opaa_queue_depth{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-b",queue="mail_outbox"}'
        values: 'NaN+0x40'
      - series: 'opaa_queue_depth{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-a",queue="source_events"}'
        values: 'NaN+0x40'
      - series: 'opaa_queue_depth{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-b",queue="source_events"}'
        values: '3x40'
      - series: 'opaa_queue_depth{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-a",queue="ocr_backlog"}'
        values: 'NaN+0x40'
      - series: 'opaa_inventory_documents{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-a",kind="private"}'
        values: 'NaN+0x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: OpaaMetricUnreadable
        exp_alerts: []
      - eval_time: 35m
        alertname: OpaaMetricUnreadable
        exp_alerts:
          - exp_labels:
              severity: "warning"
              component: "platform"
              metric: "opaa_queue_depth"
              queue: "mail_outbox"
            exp_annotations:
              summary: "OPAA kann einen Betriebswert nicht aus der Datenbank lesen"
              description: "Kein Pod von r-opaa-backend kann opaa_queue_depth seit 30 Minuten lesen; Alarme auf diesen Wert schweigen so lange."
              runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaMetricUnreadable"
  # Most calls to the identity provider refused for authentication: a page; below the volume none.
  - interval: 1m
    input_series:
      - series: 'opaa_outbound_requests_seconds_count{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-a",target="oidc",kind="none",outcome="auth_error",path_class="interactive"}'
        values: '0+2x30'
      - series: 'opaa_outbound_requests_seconds_count{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-a",target="oidc",kind="none",outcome="success",path_class="interactive"}'
        values: '0+1x30'
      - series: 'opaa_outbound_requests_seconds_count{namespace="opaa",service="r-opaa-backend",pod="r-opaa-backend-a",target="directory",kind="keycloak",outcome="auth_error",path_class="background"}'
        values: '0+0.5x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: OpaaIdentityProviderRejected
        exp_alerts:
          - exp_labels:
              severity: "critical"
              component: "platform"
              target: "oidc"
            exp_annotations:
              summary: "Identitätsanbieter oder Verzeichnisdienst lehnt OPAA ab"
              description: "Mehr als 50 % der Aufrufe von r-opaa-backend an oidc scheitern seit zehn Minuten an der Anmeldung."
              runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaIdentityProviderRejected"
  # Two failures among few requests do not alert.
  - interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{namespace="opaa",service="r-opaa-backend",status="500"}'
        values: '0+0.2x40'
      - series: 'http_server_requests_seconds_count{namespace="opaa",service="r-opaa-backend",status="200"}'
        values: '0+0.4x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: OpaaHighErrorRate
        exp_alerts: []
  # A steady 10 % failure share is a ticket, not a page.
  - interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{namespace="opaa",service="r-opaa-backend",status="500"}'
        values: '0+1x40'
      - series: 'http_server_requests_seconds_count{namespace="opaa",service="r-opaa-backend",status="200"}'
        values: '0+9x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: OpaaHighErrorRate
        exp_alerts:
          - exp_labels:
              severity: "warning"
              component: "platform"
            exp_annotations:
              summary: "Viele Fehlerantworten des OPAA-Backends"
              description: "Mehr als 5 % der Anfragen an r-opaa-backend enden seit zehn Minuten mit einem Status 5xx."
              runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaHighErrorRate"
  # 30 % failures at enough volume: ticket and page.
  - interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{namespace="opaa",service="r-opaa-backend",status="500"}'
        values: '0+3x40'
      - series: 'http_server_requests_seconds_count{namespace="opaa",service="r-opaa-backend",status="200"}'
        values: '0+7x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: OpaaHighErrorRate
        exp_alerts:
          - exp_labels:
              severity: "warning"
              component: "platform"
            exp_annotations:
              summary: "Viele Fehlerantworten des OPAA-Backends"
              description: "Mehr als 5 % der Anfragen an r-opaa-backend enden seit zehn Minuten mit einem Status 5xx."
              runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaHighErrorRate"
          - exp_labels:
              severity: "critical"
              component: "platform"
            exp_annotations:
              summary: "Sehr viele Fehlerantworten des OPAA-Backends"
