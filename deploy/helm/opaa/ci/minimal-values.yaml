# NICHT-FUER-DEN-PRODUKTIVBETRIEB: the secrets in this file are public test values. The backend
# refuses them in the "oidc" profile (ci-only-..., AES keys that decode to this marker); a real
# installation generates its own (docs/handbuch/betrieb/kubernetes.md).
# Smallest set of values a fresh installation needs: no answer file, the installation is completed
# in the browser or over the installation API. The secrets are throwaway test values.
publicBaseUrl: https://opaa.example.org
database:
  host: postgres.example.org
embedding:
  baseUrl: http://ollama.ai.svc.cluster.local:11434/v1
  model: bge-m3
  dimensions: 1024
secrets:
  jwtSecret: ci-only-jwt-secret-0123456789abcdefghijklmnop
  databasePassword: ci-only-password
  credentialsEncryptionKey: TklDSFQtRlVFUi1ERU4tUFJPRFVLVElWQkVUUklFQjE=
  settingsEncryptionKey: TklDSFQtRlVFUi1ERU4tUFJPRFVLVElWQkVUUklFQjI=
uploads:
  store: persistentVolumeClaim
