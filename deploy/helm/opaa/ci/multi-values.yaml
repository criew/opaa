# NICHT-FUER-DEN-PRODUKTIVBETRIEB: the secrets in this file are public test values. The backend
# refuses them in the "oidc" profile (ci-only-..., AES keys that decode to this marker); a real
# installation generates its own (docs/handbuch/betrieb/kubernetes.md).
# Two backend pods (ADR-0053): migration job, originals in the object store, spread over nodes, with
# the evaluation database, extraCACertificates and the egress policies, so the job runs the same
# init containers and gets its own network policy. The secrets are throwaway test values.
publicBaseUrl: https://opaa.example.org
evaluationDatabase:
  enabled: true
embedding:
  baseUrl: http://ollama.ai.svc.cluster.local:11434/v1
  model: bge-m3
  dimensions: 1024
bootstrap:
  initialAdmin:
    email: it-postfach@example.org
  chatModel:
    baseUrl: http://ollama.ai.svc.cluster.local:11434/v1
    model: qwen2.5:3b
secrets:
  initialAdminPassword: ci-only-Notanker-2026
  jwtSecret: ci-only-jwt-secret-0123456789abcdefghijklmnop
  databasePassword: ci-only-password
  credentialsEncryptionKey: TklDSFQtRlVFUi1ERU4tUFJPRFVLVElWQkVUUklFQjE=
  settingsEncryptionKey: TklDSFQtRlVFUi1ERU4tUFJPRFVLVElWQkVUUklFQjI=
  s3AccessKey: ci-only-access-key
  s3SecretKey: ci-only-secret-key
uploads:
  store: s3
  s3:
    endpoint: http://objectstore.storage.svc.cluster.local:9000
    bucket: opaa-originals
extraCACertificates:
  configMap: internal-ca
networkPolicy:
  egress:
    enabled: true
    backendRules:
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: storage
        ports:
          - port: 9000
            protocol: TCP
backend:
  replicas: 2
  migration:
    enabled: true
  databasePoolSize: 8
  installationBudgets:
    OPAA_INDEXING_EMBEDDING_CONCURRENCY: 6
    OPAA_RATE_LIMIT_QUERY_MAX_REQUESTS: 21
    OPAA_DOCUMENTS_ATTACHMENT_EXTRACTION_MAX_CONCURRENT: 1
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
