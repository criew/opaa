apiVersion: v2
name: opaa
description: OPAA (Open Project AI Assistant) unter Kubernetes, mit einer oder mehreren Backend-Instanzen
type: application
# Placeholder between two releases; the release pipeline sets both values when packaging
# (helm package --version X.Y.Z --app-version X.Y.Z), see ADR-0042, Entscheidung 7.
version: 0.0.0-dev
appVersion: 0.0.0-dev
home: https://github.com/criew/opaa
sources:
  - https://github.com/criew/opaa
keywords:
  - rag
  - knowledge-management
  - llm
annotations:
  # Prefix of the images the default values name (<prefix>-backend, <prefix>-frontend);
  # package-chart.sh refuses a package whose IMAGE_PREFIX differs. NOTES.txt compares with it.
  opaa/image-prefix: ghcr.io/criew/opaa
