{{- if .Values.metrics.grafanaDashboards.enabled }}
{{- /* The tiles of the start page read the state of the alerts; without them they stay green. */}}
{{- if not .Values.metrics.prometheusRule.enabled }}
{{- fail "metrics.grafanaDashboards.enabled needs metrics.prometheusRule.enabled: the tiles of the dashboards show the state of the chart's alerts" }}
{{- end }}
{{- $dashboards := .Values.metrics.grafanaDashboards }}
{{- /* The files carry the default runbook address; an own runbookBaseUrl replaces it. */}}
{{- $defaultRunbook := "https://opaa.io/handbuch/betrieb/alarme.html" | quote }}
{{- /* A tile that only alerts colour names their rule groups in a trailing comment of its query;
  once all of them are switched off, it shows "nicht gemessen" (-2) instead of a lasting green. */}}
{{- $off := list }}
{{- range $group, $on := .Values.metrics.prometheusRule.groups }}
{{- if not $on }}{{ $off = append $off $group }}{{ end }}
{{- end }}
{{- $offTile := printf `"expr": "(?:[^"\\]|\\.)* # opaa-alert-groups: (?:(?:%s),?)+"` (join "|" $off) }}
{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "opaa.fullname" $ }}-dashboard-{{ base $path | trimSuffix ".json" | trimPrefix "opaa-" }}
  labels:
    {{- include "opaa.labels" $ | nindent 4 }}
    {{ $dashboards.label }}: {{ $dashboards.labelValue | quote }}
    {{- with $dashboards.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- if or $dashboards.folder $dashboards.annotations }}
  annotations:
    {{- with $dashboards.folder }}
    grafana_folder: {{ . | quote }}
    {{- end }}
    {{- with $dashboards.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
data:
  {{ base $path }}: |-
{{- $content := $.Files.Get $path | replace $defaultRunbook ($.Values.metrics.runbookBaseUrl | quote) }}
{{- if $off }}
{{- $content = regexReplaceAll $offTile $content `"expr": "vector(-2)"` }}
{{- end }}
{{ $content | indent 4 }}
{{- end }}
{{- end }}
