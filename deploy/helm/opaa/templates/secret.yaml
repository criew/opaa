{{- if not .Values.secrets.existingSecret }}
{{- with .Values.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opaa.secretName" $ }}
  labels:
    {{- include "opaa.labels" $ | nindent 4 }}
type: Opaque
stringData:
  OPAA_AUTH_JWT_SECRET: {{ required "secrets.jwtSecret is required unless secrets.existingSecret is set" .jwtSecret | quote }}
  OPAA_DB_PASSWORD: {{ required "secrets.databasePassword is required unless secrets.existingSecret is set" .databasePassword | quote }}
  OPAA_CREDENTIALS_ENCRYPTION_KEY: {{ required "secrets.credentialsEncryptionKey is required unless secrets.existingSecret is set" .credentialsEncryptionKey | quote }}
  OPAA_SETTINGS_ENCRYPTION_KEY: {{ required "secrets.settingsEncryptionKey is required unless secrets.existingSecret is set" .settingsEncryptionKey | quote }}
  {{- if eq $.Values.uploads.store "s3" }}
  OPAA_UPLOAD_S3_ACCESS_KEY: {{ required "secrets.s3AccessKey is required for uploads.store s3 unless secrets.existingSecret is set" .s3AccessKey | quote }}
  OPAA_UPLOAD_S3_SECRET_KEY: {{ required "secrets.s3SecretKey is required for uploads.store s3 unless secrets.existingSecret is set" .s3SecretKey | quote }}
  {{- end }}
  {{- with .embeddingApiKey }}
  OPAA_OPENAI_EMBEDDING_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .rerankApiKey }}
  OPAA_RERANK_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .transcriptionApiKey }}
  OPAA_TRANSCRIPTION_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .installationToken }}
  OPAA_INSTALLATION_TOKEN: {{ . | quote }}
  {{- end }}
  {{- /* Files of the answer file, mounted below /etc/opaa/installation-secrets, never env. */}}
  {{- if include "opaa.installation.answerFileEnabled" $ }}
  installation-admin-password: {{ required "secrets.initialAdminPassword is required with bootstrap.initialAdmin.email unless secrets.existingSecret is set: the answer file takes the password of the first account from it" .initialAdminPassword | quote }}
  {{- if $.Values.bootstrap.chatModel.apiKeyInSecret }}
  installation-chat-api-key: {{ required "secrets.chatApiKey is required with bootstrap.chatModel.apiKeyInSecret unless secrets.existingSecret is set" .chatApiKey | quote }}
  {{- else if .chatApiKey }}
  installation-chat-api-key: {{ .chatApiKey | quote }}
  {{- end }}
  {{- end }}
{{- end }}
{{- end }}
