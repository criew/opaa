{{- if .Values.metrics.prometheusRule.enabled }}
{{- $rule := .Values.metrics.prometheusRule }}
{{- $deployment := include "opaa.backend.fullname" . }}
{{- $scrape := printf "namespace=%q, service=%q" .Release.Namespace $deployment }}
{{- $replicas := printf "kube_deployment_spec_replicas{namespace=%q, deployment=%q}" .Release.Namespace $deployment }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "opaa.fullname" . }}
  labels:
    {{- include "opaa.labels" . | nindent 4 }}
    {{- with $rule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: opaa
      rules:
        - alert: OpaaBackendNotReady
          # Ten minutes cover the schema migration of a start; 0 replicas (stopped on purpose) do not alert.
          expr: >-
            kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}", deployment="{{ $deployment }}"}
            < kube_deployment_spec_replicas{namespace="{{ .Release.Namespace }}", deployment="{{ $deployment }}"}
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: OPAA-Backend ist nicht bereit
            description: >-
              Das Backend {{ $deployment }} in {{ .Release.Namespace }} ist seit zehn Minuten nicht
              bereit. Anmeldung und Suche sind nicht verfügbar. Protokoll des Pods und
              /actuator/health/readiness prüfen (Datenbank erreichbar?).
        - alert: OpaaBackendMetricsMissing
          # Fewer pods scraped than the deployment wants, so a single silent pod of several alerts.
          # Without kube-state-metrics only the second part works: no pod scraped at all. Silent while
          # the backend is stopped on purpose (replicas 0).
          expr: >-
            (count(up{ {{- $scrape }}} == 1) or on() vector(0)) < on() max({{ $replicas }})
            or
            (absent(up{ {{- $scrape }}} == 1) unless on() ({{ $replicas }} == 0))
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Keine Metriken vom OPAA-Backend
            description: >-
              Prometheus erreicht /actuator/prometheus von mindestens einem Pod des Backends
              {{ $deployment }} seit zehn Minuten nicht. Pods, ServiceMonitor und die
              NetworkPolicy (metrics.scrapeFrom) prüfen.
        - alert: OpaaHighErrorRate
          # Needs a minimum of requests, so that two failures on a quiet night do not alert.
          expr: >-
            (
              sum(rate(http_server_requests_seconds_count{ {{- $scrape }}, status=~"5.."}[10m]))
              / sum(rate(http_server_requests_seconds_count{ {{- $scrape }}}[10m]))
              > {{ $rule.errorRateThreshold }}
            )
            and on() sum(increase(http_server_requests_seconds_count{ {{- $scrape }}}[10m])) >= {{ $rule.errorRateMinRequests }}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Viele Fehlerantworten des OPAA-Backends
            description: >-
              Mehr als {{ mulf $rule.errorRateThreshold 100 }} % der Anfragen an {{ $deployment }}
              enden seit zehn Minuten mit einem Status 5xx. Häufige Ursache: ein nicht erreichbares
              Modell. Protokoll des Pods prüfen.
        - alert: OpaaIndexingStalled
          # Per pod, since a run belongs to the pod that runs it: active through the whole window -
          # already at its start, so a young series after a pod start does not count as a full
          # window - and no document processed in it on that pod.
          expr: >-
            max by (pod) (min_over_time(executor_active_threads{ {{- $scrape }}, name="indexingTaskExecutor"}[{{ $rule.indexingStallMinutes }}m])) > 0
            and on(pod) max by (pod) (executor_active_threads{ {{- $scrape }}, name="indexingTaskExecutor"} offset {{ $rule.indexingStallMinutes }}m) > 0
            and on(pod) sum by (pod) (increase(opaa_indexing_documents_total{ {{- $scrape }}}[{{ $rule.indexingStallMinutes }}m])) == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Indexierung ohne Fortschritt
            description: >-
              Ein Indexierungslauf im Pod {{ "{{" }} $labels.pod {{ "}}" }} von {{ $deployment }} ist aktiv, hat aber seit
              {{ $rule.indexingStallMinutes }} Minuten kein Dokument verarbeitet. Laufstatus der
              Bibliothek und Erreichbarkeit von Quelle und Embedding-Modell prüfen.
        - alert: OpaaAuditRetentionOverdue
          # The run on the 1st of every month brings the value back to a few hours; above 35 days a
          # run was missed. Every pod reports the same database value, so the maximum is enough. NaN
          # on every pod (x != x) or no series at all means the state cannot be read, and alerts too;
          # silent while the backend is stopped on purpose (replicas 0).
          expr: >-
            max(opaa_audit_retention_last_run_age_seconds{ {{- $scrape }}}) > 35 * 86400
            or
            max(opaa_audit_retention_last_run_age_seconds{ {{- $scrape }}})
            != max(opaa_audit_retention_last_run_age_seconds{ {{- $scrape }}})
            or
            (max(absent(opaa_audit_retention_last_run_age_seconds{ {{- $scrape }}}))
            unless on() ({{ $replicas }} == 0))
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: Löschlauf des Revisionsprotokolls ausgeblieben
            description: >-
              Die automatische Löschung des Revisionsprotokolls von {{ $deployment }} ist seit mehr
              als 35 Tagen nicht gelaufen, oder das Backend kann ihren Stand nicht lesen.
              Abgelaufene Monate bleiben dann womöglich stehen und das Protokoll wächst über die
              Aufbewahrungsfrist hinaus. Log des Pods prüfen, vor allem am 1. des Monats um 03:00.
        - alert: OpaaAuditPayloadDropped
          # The backend registers the counter at 0 for every event type on start, so its first drop
          # is an increase too; summed over the pods per event type.
          expr: >-
            sum by (event_type) (increase(opaa_audit_payload_dropped_total{ {{- $scrape }}}[1h])) > 0
          labels:
            severity: warning
          annotations:
            summary: Revisionsprotokoll ohne nicht gelistete Angaben geschrieben
            description: >-
              Das Backend {{ $deployment }} hat in der letzten Stunde Einträge der Art
              {{ "{{" }} $labels.event_type {{ "}}" }} ohne Angaben geschrieben, die der Ereigniskatalog nicht
              nennt. Der Vorgang selbst ist durchgeführt. Ein Programmfehler: Log des Pods nach
              „Dropped audit payload keys“ durchsuchen und den Fund melden.
        - alert: OpaaHeapUsageHigh
          # Per pod: the heap of one pod fills up regardless of the others.
          expr: >-
            sum by (pod) (jvm_memory_used_bytes{ {{- $scrape }}, area="heap"})
            / sum by (pod) (jvm_memory_max_bytes{ {{- $scrape }}, area="heap"})
            > {{ $rule.heapUsageThreshold }}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Heap des OPAA-Backends fast voll
            description: >-
              Der Pod {{ "{{" }} $labels.pod {{ "}}" }} von {{ $deployment }} nutzt seit 15 Minuten mehr als
              {{ mulf $rule.heapUsageThreshold 100 }} % seines Heaps. Speichergrenze
              (backend.resources.limits.memory) oder backend.maxRamPercentage anheben.
{{- end }}
