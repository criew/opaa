{{- include "opaa.validate" . }}
{{- $secretName := include "opaa.secretName" . }}
{{- $podSecurityContext := deepCopy .Values.podSecurityContext }}
{{- if and (eq .Values.uploads.store "persistentVolumeClaim") .Values.uploads.persistence.fsGroup }}
{{- $_ := set $podSecurityContext "fsGroup" .Values.uploads.persistence.fsGroup }}
{{- /* Changes ownership only when the volume root does not match, not on every start. */}}
{{- $_ := set $podSecurityContext "fsGroupChangePolicy" "OnRootMismatch" }}
{{- end }}
{{- $requiredKeys := list "OPAA_AUTH_JWT_SECRET" "OPAA_DB_PASSWORD" "OPAA_CREDENTIALS_ENCRYPTION_KEY" "OPAA_SETTINGS_ENCRYPTION_KEY" }}
{{- if eq .Values.uploads.store "s3" }}
{{- $requiredKeys = concat $requiredKeys (list "OPAA_UPLOAD_S3_ACCESS_KEY" "OPAA_UPLOAD_S3_SECRET_KEY") }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opaa.backend.fullname" . }}
  labels:
    {{- include "opaa.componentLabels" (dict "root" . "component" "backend") | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  strategy:
    {{- if include "opaa.backend.rolling" . }}
    # Pod by pod, the next one only after the new one is ready; the migration job has extended the
    # schema beforehand, so the old version keeps working next to the new (ADR-0053).
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
    {{- else }}
    # The old pods end before the new ones start; without the migration job every pod migrates the
    # schema on its start.
    type: Recreate
    {{- end }}
  selector:
    matchLabels:
      {{- include "opaa.componentSelectorLabels" (dict "root" . "component" "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "opaa.componentSelectorLabels" (dict "root" . "component" "backend") | nindent 8 }}
        {{- with .Values.backend.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/backend-configmap.yaml") . | sha256sum }}
        {{- if not .Values.secrets.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.metrics.podAnnotations }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.backend.managementPort | quote }}
        prometheus.io/path: /actuator/prometheus
        {{- end }}
        {{- with .Values.backend.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "opaa.podSpecCommon" (dict "root" . "component" .Values.backend "podSecurityContext" $podSecurityContext) | nindent 6 }}
      terminationGracePeriodSeconds: {{ include "opaa.backend.terminationGracePeriodSeconds" . }}
      {{- with .Values.backend.topologySpreadConstraints }}
      {{- $selector := fromYaml (include "opaa.componentSelectorLabels" (dict "root" $ "component" "backend")) }}
      {{- $constraints := list }}
      {{- range . }}
      {{- $constraints = append $constraints (merge (deepCopy .) (dict "labelSelector" (dict "matchLabels" $selector))) }}
      {{- end }}
      topologySpreadConstraints:
        {{- toYaml $constraints | nindent 8 }}
      {{- end }}
      {{- $prepare := include "opaa.backend.prepareContainers" . }}
      {{- if or $prepare .Values.backend.migration.enabled }}
      initContainers:
        {{- with $prepare }}
        {{- . | trim | nindent 8 }}
        {{- end }}
        {{- if .Values.backend.migration.enabled }}
        # Started without migrating: waits, reading only, until the migration job has applied every
        # migration of this version, so a new pod never meets an older schema.
        {{- include "opaa.backend.databaseStep" (dict "root" . "name" "await-migration" "mode" "await-migration") | trim | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: backend
          image: {{ include "opaa.image" (dict "root" . "image" .Values.backend.image) | quote }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: management
              containerPort: {{ .Values.backend.managementPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "opaa.backend.fullname" . }}
            {{- with .Values.backend.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            # Fixed production mode; "dev" is reserved for development and tests (ADR-0005). Set in env
            # rather than the ConfigMap, because env takes precedence over every envFrom source.
            - name: SPRING_PROFILES_ACTIVE
              value: oidc
            - name: TZ
              value: {{ .Values.backend.timeZone | quote }}
            {{- with include "opaa.backend.javaToolOptions" . }}
            - name: JAVA_TOOL_OPTIONS
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.backend.migration.enabled }}
            # The migration job migrates; a pod never runs Flyway itself.
            - name: SPRING_FLYWAY_ENABLED
              value: "false"
            {{- end }}
            # Required keys carry no "optional": a missing key keeps the pod from starting
            # (CreateContainerConfigError) instead of surfacing at first use (ADR-0042, Entscheidung 5).
            {{- range $requiredKeys }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ . }}
            {{- end }}
            {{- range list "OPAA_OPENAI_EMBEDDING_API_KEY" "OPAA_OPENAI_CHAT_API_KEY" "OPAA_INITIAL_ADMIN_PASSWORD" }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ . }}
                  optional: true
            {{- end }}
            {{- with .Values.backend.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with int (include "opaa.backend.preStopSeconds" .) }}
          # Keeps serving while the endpoints drop the pod, so no new request meets a pod that
          # already refuses connections; a sleep action, because the image has no shell.
          lifecycle:
            preStop:
              sleep:
                seconds: {{ . }}
          {{- end }}
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            {{- with .Values.backend.startupProbe }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            {{- with .Values.backend.livenessProbe }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            {{- with .Values.backend.readinessProbe }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.backend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if eq .Values.uploads.store "persistentVolumeClaim" }}
            - name: uploads
              mountPath: /app/uploads
            {{- end }}
            {{- if include "opaa.extraCACertificates.enabled" . }}
            - name: truststore
              mountPath: /etc/opaa/truststore
              readOnly: true
            {{- end }}
            {{- range .Values.filesystemSources }}
            - name: {{ printf "source-%s" .name }}
              mountPath: {{ .mountPath }}
              readOnly: true
            {{- end }}
            {{- with .Values.backend.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          {{- include "opaa.emptyDir" .Values.backend.tmp | nindent 10 }}
        {{- if eq .Values.uploads.store "persistentVolumeClaim" }}
        - name: uploads
          persistentVolumeClaim:
            claimName: {{ include "opaa.uploads.claimName" . }}
        {{- end }}
        {{- with include "opaa.backend.truststoreVolumes" . }}
        {{- . | trim | nindent 8 }}
        {{- end }}
        {{- range .Values.filesystemSources }}
        - name: {{ printf "source-%s" .name }}
          {{- toYaml .volume | nindent 10 }}
        {{- end }}
        {{- with .Values.backend.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
