{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "opaa.serviceAccountName" . }}
  labels:
    {{- include "opaa.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# OPAA never talks to the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
