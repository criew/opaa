apiVersion: v1
kind: Service
metadata:
  name: {{ include "opaa.backend.fullname" . }}
  labels:
    {{- include "opaa.componentLabels" (dict "root" . "component" "backend") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
    - name: management
      port: {{ .Values.backend.managementPort }}
      targetPort: management
      protocol: TCP
  selector:
    {{- include "opaa.componentSelectorLabels" (dict "root" . "component" "backend") | nindent 4 }}
