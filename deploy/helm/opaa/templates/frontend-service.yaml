apiVersion: v1
kind: Service
metadata:
  name: {{ include "opaa.frontend.fullname" . }}
  labels:
    {{- include "opaa.componentLabels" (dict "root" . "component" "frontend") | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "opaa.componentSelectorLabels" (dict "root" . "component" "frontend") | nindent 4 }}
