{{- $publicBaseUrl := trimSuffix "/" .Values.publicBaseUrl }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "opaa.backend.fullname" . }}
  labels:
    {{- include "opaa.componentLabels" (dict "root" . "component" "backend") | nindent 4 }}
data:
  # server.address defaults to localhost, which the kubelet's probes cannot reach.
  OPAA_SERVER_ADDRESS: 0.0.0.0
  MANAGEMENT_SERVER_PORT: {{ .Values.backend.managementPort | quote }}
  {{- with .Values.backend.logFormat }}
  LOGGING_STRUCTURED_FORMAT_CONSOLE: {{ . | quote }}
  {{- end }}
  OPAA_SHUTDOWN_TIMEOUT: {{ printf "%ss" (include "opaa.backend.shutdownTimeoutSeconds" .) | quote }}
  OPAA_PUBLIC_BASE_URL: {{ $publicBaseUrl | quote }}
  OPAA_CORS_ALLOWED_ORIGINS: {{ $publicBaseUrl | quote }}
  OPAA_DB_URL: {{ include "opaa.databaseUrl" . | quote }}
  OPAA_DB_USERNAME: {{ .Values.database.username | quote }}
  {{- with .Values.backend.databasePoolSize }}
  OPAA_DB_POOL_SIZE: {{ . | quote }}
  {{- end }}
  {{- with .Values.database.schema }}
  OPAA_DB_SCHEMA: {{ . | quote }}
  {{- end }}
  {{- if eq .Values.uploads.store "s3" }}
  OPAA_UPLOAD_STORE: s3
  OPAA_UPLOAD_S3_ENDPOINT: {{ .Values.uploads.s3.endpoint | quote }}
  OPAA_UPLOAD_S3_BUCKET: {{ .Values.uploads.s3.bucket | quote }}
  OPAA_UPLOAD_S3_REGION: {{ .Values.uploads.s3.region | quote }}
  OPAA_UPLOAD_S3_PATH_STYLE: {{ .Values.uploads.s3.pathStyle | quote }}
  OPAA_UPLOAD_S3_KEY_PREFIX: {{ .Values.uploads.s3.keyPrefix | quote }}
  {{- else }}
  OPAA_UPLOAD_STORE: filesystem
  OPAA_UPLOAD_STORAGE_PATH: /app/uploads
  {{- end }}
  OPAA_RATE_LIMIT_TRUSTED_PROXY_CIDRS: {{ join "," .Values.trustedProxyCidrs | quote }}
  OPAA_LOCAL_ADMIN_ALLOWED_CIDRS: {{ join "," .Values.localAdminAllowedCidrs | quote }}
  OPAA_INSTALLATION_ALLOWED_CIDRS: {{ join "," .Values.installationAllowedCidrs | quote }}
  OPAA_INDEXING_FILESYSTEM_ALLOWLIST: {{ include "opaa.filesystemAllowlist" . | quote }}
  OPAA_INDEXING_TARGET_VALIDATION_ALLOWLIST: {{ join "," .Values.targetValidation.indexingAllowlist | quote }}
  OPAA_OIDC_TARGET_VALIDATION_ALLOWLIST: {{ include "opaa.identityProviderAllowlist" . | quote }}
  {{- with .Values.embedding.timeout }}
  OPAA_OPENAI_EMBEDDING_TIMEOUT: {{ . | quote }}
  {{- end }}
  {{- with .Values.rerank.timeout }}
  OPAA_RERANK_TIMEOUT: {{ . | quote }}
  {{- end }}
  {{- with .Values.rerank.probeInterval }}
  OPAA_RERANK_PROBE_INTERVAL: {{ . | quote }}
  {{- end }}
  OPAA_MALWARE_SCAN_ENABLED: {{ .Values.malwareScan.enabled | quote }}
  {{- with .Values.malwareScan.host }}
  OPAA_MALWARE_SCAN_HOST: {{ . | quote }}
  {{- end }}
  {{- with .Values.malwareScan.port }}
  OPAA_MALWARE_SCAN_PORT: {{ . | quote }}
  {{- end }}
  {{- with .Values.malwareScan.timeout }}
  OPAA_MALWARE_SCAN_TIMEOUT: {{ . | quote }}
  {{- end }}
  {{- with .Values.malwareScan.onUnavailable }}
  OPAA_MALWARE_SCAN_ON_UNAVAILABLE: {{ . | quote }}
  {{- end }}
  OPAA_SIEM_EXPORT_ENABLED: {{ .Values.siemExport.enabled | quote }}
  {{- with .Values.siemExport.host }}
  OPAA_SIEM_EXPORT_HOST: {{ . | quote }}
  {{- end }}
  {{- with .Values.siemExport.port }}
  OPAA_SIEM_EXPORT_PORT: {{ . | quote }}
  {{- end }}
  {{- with .Values.siemExport.tls }}
  OPAA_SIEM_EXPORT_TLS: {{ . | quote }}
  {{- end }}
  OPAA_SIEM_EXPORT_INCLUDE_LABELS: {{ .Values.siemExport.includeLabels | quote }}
  {{- with .Values.siemExport.timeout }}
  OPAA_SIEM_EXPORT_TIMEOUT: {{ . | quote }}
  {{- end }}
  {{- with .Values.transcription.maxAudioBytes }}
  OPAA_TRANSCRIPTION_MAX_AUDIO_BYTES: {{ . | quote }}
  {{- end }}
  {{- with .Values.transcription.timeout }}
  OPAA_TRANSCRIPTION_TIMEOUT: {{ . | quote }}
  {{- end }}
  {{- with .Values.transcription.maxConcurrent }}
  OPAA_TRANSCRIPTION_MAX_CONCURRENT: {{ . | quote }}
  {{- end }}
  {{- with .Values.mail.connectTimeout }}
  OPAA_MAIL_CONNECT_TIMEOUT: {{ . | quote }}
  {{- end }}
  {{- with .Values.mail.readTimeout }}
  OPAA_MAIL_READ_TIMEOUT: {{ . | quote }}
  {{- end }}
  {{- with .Values.mail.writeTimeout }}
  OPAA_MAIL_WRITE_TIMEOUT: {{ . | quote }}
  {{- end }}
  {{- $pods := max 1 (int .Values.backend.replicas) }}
  {{- range $variable, $budget := .Values.backend.installationBudgets }}
  {{ $variable }}: {{ max 1 (div (int $budget) $pods) | quote }}
  {{- end }}
  {{- range $name, $flag := .Values.features }}
  OPAA_FEATURES_{{ $name | snakecase | upper }}_ENABLED: {{ $flag.enabled | quote }}
  {{- end }}
