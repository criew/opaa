{{- $publicBaseUrl := trimSuffix "/" .Values.publicBaseUrl }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "opaa.backend.fullname" . }}
  labels:
    {{- include "opaa.componentLabels" (dict "root" . "component" "backend") | nindent 4 }}
data:
  # Fixed: the production mode; "dev" is reserved for development and tests (ADR-0005).
  SPRING_PROFILES_ACTIVE: oidc
  # server.address defaults to localhost, which the kubelet's probes cannot reach.
  OPAA_SERVER_ADDRESS: 0.0.0.0
  OPAA_SHUTDOWN_TIMEOUT: {{ printf "%vs" .Values.backend.shutdownTimeoutSeconds | quote }}
  OPAA_PUBLIC_BASE_URL: {{ $publicBaseUrl | quote }}
  OPAA_CORS_ALLOWED_ORIGINS: {{ $publicBaseUrl | quote }}
  OPAA_DB_URL: {{ printf "jdbc:postgresql://%s:%v/%s?prepareThreshold=0" .Values.database.host .Values.database.port .Values.database.name | quote }}
  OPAA_DB_USERNAME: {{ .Values.database.username | quote }}
  OPAA_UPLOAD_STORAGE_PATH: /app/uploads
  OPAA_OPENAI_EMBEDDING_BASE_URL: {{ .Values.embedding.baseUrl | quote }}
  OPAA_OPENAI_EMBEDDING_MODEL: {{ .Values.embedding.model | quote }}
  OPAA_PGVECTOR_DIMENSIONS: {{ .Values.embedding.dimensions | quote }}
  # Bootstrap values - read on the first start only, see values.yaml.
  OPAA_INITIAL_ADMIN_EMAIL: {{ .Values.bootstrap.initialAdmin.email | quote }}
  {{- with .Values.bootstrap.chatModel.baseUrl }}
  OPAA_OPENAI_CHAT_BASE_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.bootstrap.chatModel.model }}
  OPAA_OPENAI_CHAT_MODEL: {{ . | quote }}
  {{- end }}
  {{- with .Values.bootstrap.oidc }}
  {{- if .issuerUri }}
  OPAA_OIDC_ISSUER_URI: {{ .issuerUri | quote }}
  {{- end }}
  {{- if .clientId }}
  OPAA_OIDC_CLIENT_ID: {{ .clientId | quote }}
  {{- end }}
  {{- if .authority }}
  OPAA_OIDC_AUTHORITY: {{ .authority | quote }}
  {{- end }}
  {{- if .jwkSetUri }}
  OPAA_OIDC_JWK_SET_URI: {{ .jwkSetUri | quote }}
  {{- end }}
  {{- end }}
