{{- $publicBaseUrl := trimSuffix "/" .Values.publicBaseUrl }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "opaa.backend.fullname" . }}
  labels:
    {{- include "opaa.componentLabels" (dict "root" . "component" "backend") | nindent 4 }}
data:
  # server.address defaults to localhost, which the kubelet's probes cannot reach.
  OPAA_SERVER_ADDRESS: 0.0.0.0
  MANAGEMENT_SERVER_PORT: {{ .Values.backend.managementPort | quote }}
  {{- with .Values.backend.logFormat }}
  LOGGING_STRUCTURED_FORMAT_CONSOLE: {{ . | quote }}
  {{- end }}
  OPAA_SHUTDOWN_TIMEOUT: {{ printf "%vs" .Values.backend.shutdownTimeoutSeconds | quote }}
  OPAA_PUBLIC_BASE_URL: {{ $publicBaseUrl | quote }}
  OPAA_CORS_ALLOWED_ORIGINS: {{ $publicBaseUrl | quote }}
  OPAA_DB_URL: {{ include "opaa.databaseUrl" . | quote }}
  OPAA_DB_USERNAME: {{ .Values.database.username | quote }}
  {{- with .Values.database.schema }}
  OPAA_DB_SCHEMA: {{ . | quote }}
  {{- end }}
  {{- if eq .Values.uploads.store "s3" }}
  OPAA_UPLOAD_STORE: s3
  OPAA_UPLOAD_S3_ENDPOINT: {{ .Values.uploads.s3.endpoint | quote }}
  OPAA_UPLOAD_S3_BUCKET: {{ .Values.uploads.s3.bucket | quote }}
  OPAA_UPLOAD_S3_REGION: {{ .Values.uploads.s3.region | quote }}
  OPAA_UPLOAD_S3_PATH_STYLE: {{ .Values.uploads.s3.pathStyle | quote }}
  OPAA_UPLOAD_S3_KEY_PREFIX: {{ .Values.uploads.s3.keyPrefix | quote }}
  {{- else }}
  OPAA_UPLOAD_STORE: filesystem
  OPAA_UPLOAD_STORAGE_PATH: /app/uploads
  {{- end }}
  OPAA_RATE_LIMIT_TRUSTED_PROXY_CIDRS: {{ join "," .Values.trustedProxyCidrs | quote }}
  OPAA_LOCAL_ADMIN_ALLOWED_CIDRS: {{ join "," .Values.localAdminAllowedCidrs | quote }}
  OPAA_INDEXING_FILESYSTEM_ALLOWLIST: {{ include "opaa.filesystemAllowlist" . | quote }}
  OPAA_INDEXING_TARGET_VALIDATION_ALLOWLIST: {{ join "," .Values.targetValidation.indexingAllowlist | quote }}
  OPAA_OIDC_TARGET_VALIDATION_ALLOWLIST: {{ join "," .Values.targetValidation.identityProviderAllowlist | quote }}
  OPAA_OPENAI_EMBEDDING_BASE_URL: {{ .Values.embedding.baseUrl | quote }}
  OPAA_OPENAI_EMBEDDING_MODEL: {{ .Values.embedding.model | quote }}
  OPAA_PGVECTOR_DIMENSIONS: {{ .Values.embedding.dimensions | quote }}
  OPAA_RERANK_ENABLED: {{ .Values.rerank.enabled | quote }}
  {{- with .Values.rerank.baseUrl }}
  OPAA_RERANK_BASE_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.rerank.model }}
  OPAA_RERANK_MODEL: {{ . | quote }}
  {{- end }}
  {{- with .Values.rerank.timeout }}
  OPAA_RERANK_TIMEOUT: {{ . | quote }}
  {{- end }}
  {{- with .Values.mail.connectTimeout }}
  OPAA_MAIL_CONNECT_TIMEOUT: {{ . | quote }}
  {{- end }}
  {{- with .Values.mail.readTimeout }}
  OPAA_MAIL_READ_TIMEOUT: {{ . | quote }}
  {{- end }}
  {{- with .Values.mail.writeTimeout }}
  OPAA_MAIL_WRITE_TIMEOUT: {{ . | quote }}
  {{- end }}
  # Bootstrap values - read on the first start only, see values.yaml.
  OPAA_INITIAL_ADMIN_EMAIL: {{ .Values.bootstrap.initialAdmin.email | quote }}
  {{- with .Values.bootstrap.chatModel.baseUrl }}
  OPAA_OPENAI_CHAT_BASE_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.bootstrap.chatModel.model }}
  OPAA_OPENAI_CHAT_MODEL: {{ . | quote }}
  {{- end }}
  {{- with .Values.bootstrap.oidc }}
  {{- if .issuerUri }}
  OPAA_OIDC_ISSUER_URI: {{ .issuerUri | quote }}
  {{- end }}
  {{- if .clientId }}
  OPAA_OIDC_CLIENT_ID: {{ .clientId | quote }}
  {{- end }}
  {{- if .authority }}
  OPAA_OIDC_AUTHORITY: {{ .authority | quote }}
  {{- end }}
  {{- if .jwkSetUri }}
  OPAA_OIDC_JWK_SET_URI: {{ .jwkSetUri | quote }}
  {{- end }}
  {{- end }}
