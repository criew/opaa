{{- if and (eq .Values.uploads.store "persistentVolumeClaim") (not .Values.uploads.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "opaa.uploads.claimName" . }}
  labels:
    {{- include "opaa.componentLabels" (dict "root" . "component" "backend") | nindent 4 }}
  annotations:
    # The originals outlive helm uninstall; delete the claim deliberately.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    {{- toYaml .Values.uploads.persistence.accessModes | nindent 4 }}
  {{- with .Values.uploads.persistence.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.uploads.persistence.size }}
{{- end }}
