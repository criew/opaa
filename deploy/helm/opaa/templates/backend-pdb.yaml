{{- if ge (int .Values.backend.replicas) 2 }}
# A node drain takes one backend pod at a time; the others keep serving.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "opaa.backend.fullname" . }}
  labels:
    {{- include "opaa.componentLabels" (dict "root" . "component" "backend") | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "opaa.componentSelectorLabels" (dict "root" . "component" "backend") | nindent 6 }}
{{- end }}
