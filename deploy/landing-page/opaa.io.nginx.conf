# Static landing page and daily report of https://opaa.io, served from the web root that
# opaa-page-pull.sh mirrors. Starts as plain HTTP; certbot --nginx adds the TLS listeners and
# the redirect from port 80. Browsers ignore the HSTS header until it arrives over HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name www.opaa.io;
    return 301 https://opaa.io$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name opaa.io;

    root /var/www/opaa.io;
    index index.html;
    charset utf-8;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types text/css text/xml application/xml application/javascript application/json application/atom+xml image/svg+xml;

    # Dot paths stay hidden; certbot --nginx answers its challenge in its own location.
    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Pages change with every pull; revalidate them, keep images cached for a day.
    location ~* \.(html|xml|json)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
    location ~* \.(png|jpe?g|gif|svg|webp|ico|woff2?)$ {
        expires 1d;
    }
}
