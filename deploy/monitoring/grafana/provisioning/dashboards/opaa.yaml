# The OPAA dashboards from deploy/helm/opaa/dashboards, read only; changes belong in
# deploy/monitoring/build_dashboards.py.
apiVersion: 1
providers:
  - name: opaa
    folder: OPAA
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards/opaa
