# Generated by deploy/monitoring/render.sh from the chart's PrometheusRule; edit the chart.
groups:
  - name: opaa-platform
    rules:
      # No pod ready at all: nobody can work. Ten minutes cover the schema migration of a start;
      # 0 replicas (stopped on purpose) do not alert.
      - alert: OpaaBackendNotReady
        expr: >-
          kube_deployment_status_replicas_available{namespace="opaa", deployment="opaa-backend"} == 0 and kube_deployment_spec_replicas{namespace="opaa", deployment="opaa-backend"} > 0
        for: 10m
        labels:
          severity: critical
          component: platform
        annotations:
          summary: Kein Pod des OPAA-Backends bereit
          description: Das Backend opaa-backend in opaa hat seit zehn Minuten keinen bereiten Pod; Anmeldung und Fragen sind nicht möglich.
          runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaBackendNotReady"
      # Some pods ready, fewer than wanted: users notice nothing yet, so a ticket.
      - alert: OpaaBackendNotReady
        expr: >-
          kube_deployment_status_replicas_available{namespace="opaa", deployment="opaa-backend"} > 0 and kube_deployment_status_replicas_available{namespace="opaa", deployment="opaa-backend"} < kube_deployment_spec_replicas{namespace="opaa", deployment="opaa-backend"}
        for: 15m
        labels:
          severity: warning
          component: platform
        annotations:
          summary: Nicht alle Pods des OPAA-Backends bereit
          description: Das Backend opaa-backend in opaa hat seit 15 Minuten weniger bereite Pods als gewünscht.
          runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaBackendNotReady"
      # Fewer pods scraped than the deployment wants, so a single silent pod of several alerts.
      # Without kube-state-metrics only the second part works: no pod scraped at all. Silent while
      # the backend is stopped on purpose (replicas 0).
      - alert: OpaaBackendMetricsMissing
        expr: >-
          (count(up{namespace="opaa", service="opaa-backend"} == 1) or on() vector(0)) < on() max(kube_deployment_spec_replicas{namespace="opaa", deployment="opaa-backend"}) or (absent(up{namespace="opaa", service="opaa-backend"} == 1) unless on() (kube_deployment_spec_replicas{namespace="opaa", deployment="opaa-backend"} == 0))
        for: 10m
        labels:
          severity: warning
          component: platform
        annotations:
          summary: Keine Metriken vom OPAA-Backend
          description: Prometheus erreicht /actuator/prometheus von mindestens einem Pod des Backends opaa-backend seit zehn Minuten nicht.
          runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaBackendMetricsMissing"
      - alert: OpaaFrontendNotReady
        expr: >-
          kube_deployment_status_replicas_available{namespace="opaa", deployment="opaa-frontend"} == 0 and kube_deployment_spec_replicas{namespace="opaa", deployment="opaa-frontend"} > 0
        for: 5m
        labels:
          severity: critical
          component: platform
        annotations:
          summary: Kein Pod des OPAA-Frontends bereit
          description: Das Frontend opaa-frontend in opaa hat seit fünf Minuten keinen bereiten Pod; die Oberfläche ist nicht erreichbar.
          runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaFrontendNotReady"
      - alert: OpaaFrontendNotReady
        expr: >-
          kube_deployment_status_replicas_available{namespace="opaa", deployment="opaa-frontend"} > 0 and kube_deployment_status_replicas_available{namespace="opaa", deployment="opaa-frontend"} < kube_deployment_spec_replicas{namespace="opaa", deployment="opaa-frontend"}
        for: 5m
        labels:
          severity: warning
          component: platform
        annotations:
          summary: Nicht alle Pods des OPAA-Frontends bereit
          description: Das Frontend opaa-frontend in opaa hat seit fünf Minuten weniger bereite Pods als gewünscht.
          runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaFrontendNotReady"
      # Per pod, live data after garbage collection: the heap before a collection is regularly
      # high without any danger.
      - alert: OpaaHeapUsageHigh
        expr: >-
          sum by (pod) (jvm_gc_live_data_size_bytes{namespace="opaa", service="opaa-backend"}) / sum by (pod) (jvm_gc_max_data_size_bytes{namespace="opaa", service="opaa-backend"}) > 0.85
        for: 15m
        labels:
          severity: warning
          component: platform
        annotations:
          summary: Heap des OPAA-Backends nach der Speicherbereinigung fast voll
          description: Der Pod {{ $labels.pod }} von opaa-backend belegt seit 15 Minuten nach der Speicherbereinigung mehr als 85 % seines Heaps.
          runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaHeapUsageHigh"
      - alert: OpaaDatabasePoolTimeouts
        expr: >-
          sum by (pod) (increase(hikaricp_connections_timeout_total{namespace="opaa", service="opaa-backend"}[10m])) > 0
        labels:
          severity: warning
          component: platform
        annotations:
          summary: Anfragen bekommen keine Datenbankverbindung
          description: Im Pod {{ $labels.pod }} von opaa-backend haben Anfragen in den letzten zehn Minuten vergeblich auf eine Verbindung aus dem Connection Pool gewartet.
          runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaDatabasePoolTimeouts"
      # The instance's own heartbeat by the database clock: a pod that runs but no longer writes it
      # counts as dead for the others and loses its claims.
      - alert: OpaaInstanceHeartbeatStale
        expr: >-
          max by (pod) (opaa_instance_heartbeat_age_seconds{namespace="opaa", service="opaa-backend"}) > 45
        for: 5m
        labels:
          severity: warning
          component: platform
        annotations:
          summary: Herzschlag einer OPAA-Instanz veraltet
          description: Der Pod {{ $labels.pod }} von opaa-backend hat seinen Herzschlag seit mehr als 45 Sekunden nicht geschrieben.
          runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaInstanceHeartbeatStale"
      - alert: OpaaInvalidationBusDisconnected
        expr: >-
          max by (pod) (opaa_invalidation_bus_connected{namespace="opaa", service="opaa-backend"}) == 0
        for: 10m
        labels:
          severity: warning
          component: platform
        annotations:
          summary: OPAA-Instanz hört keine Cache-Meldungen
          description: Der Pod {{ $labels.pod }} von opaa-backend ist seit zehn Minuten nicht mit dem Kanal der Cache-Meldungen verbunden und liest an seinen Zwischenspeichern vorbei.
          runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaInvalidationBusDisconnected"
      # Every pod reads the same value from the instance register, so the maximum is enough.
      - alert: OpaaVersionMix
        expr: >-
          max(opaa_instances_versions{namespace="opaa", service="opaa-backend"}) > 1
        for: 30m
        labels:
          severity: warning
          component: platform
        annotations:
          summary: Mehrere OPAA-Versionen laufen nebeneinander
          description: Die Instanzen von opaa-backend laufen seit 30 Minuten mit mehr als einer Version; ein Rolling Update hängt.
          runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaVersionMix"
      # A gauge the instances read from the database reports NaN when the read fails; NaN on every
      # pod (x != x after max) means nobody can read it, and alerts compared against it stay
      # silent. Excluded: the audit gauges with their own NaN alerts, the OCR backlog (NaN while
      # text recognition is off) and private inventory (NaN below the minimum group size).
      - alert: OpaaMetricUnreadable
        expr: >-
          max by (metric, queue, kind, connector, provider) (label_replace({namespace="opaa", service="opaa-backend", __name__=~"opaa_queue_depth|opaa_queue_oldest_age_seconds|opaa_inventory_.+|opaa_instances_active|opaa_instances_versions|opaa_instance_heartbeat_age_seconds|opaa_scheduled_locks_held|opaa_scheduled_locks_oldest_age_seconds|opaa_audit_log_horizon_seconds|opaa_audit_chain_unsealed_months|opaa_audit_log_size_bytes|opaa_audit_log_oldest_partition_age_seconds|opaa_indexing_libraries_overdue|opaa_indexing_run_last_success_seconds|opaa_indexing_reindex_remaining|opaa_directory_sync_last_success_seconds|opaa_directory_sync_plan_pending_age_seconds", queue!="ocr_backlog", kind!="private"}, "metric", "$1", "__name__", "(.+)")) != max by (metric, queue, kind, connector, provider) (label_replace({namespace="opaa", service="opaa-backend", __name__=~"opaa_queue_depth|opaa_queue_oldest_age_seconds|opaa_inventory_.+|opaa_instances_active|opaa_instances_versions|opaa_instance_heartbeat_age_seconds|opaa_scheduled_locks_held|opaa_scheduled_locks_oldest_age_seconds|opaa_audit_log_horizon_seconds|opaa_audit_chain_unsealed_months|opaa_audit_log_size_bytes|opaa_audit_log_oldest_partition_age_seconds|opaa_indexing_libraries_overdue|opaa_indexing_run_last_success_seconds|opaa_indexing_reindex_remaining|opaa_directory_sync_last_success_seconds|opaa_directory_sync_plan_pending_age_seconds", queue!="ocr_backlog", kind!="private"}, "metric", "$1", "__name__", "(.+)"))
        for: 30m
        labels:
          severity: warning
          component: platform
        annotations:
          summary: OPAA kann einen Betriebswert nicht aus der Datenbank lesen
          description: Kein Pod von opaa-backend kann {{ $labels.metric }} seit 30 Minuten lesen; Alarme auf diesen Wert schweigen so lange.
          runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaMetricUnreadable"
      # Refused calls to the identity provider (discovery, signing keys) or the directory service:
      # an expired client secret or a revoked client keeps everyone out.
      - alert: OpaaIdentityProviderRejected
        expr: >-
          (

            sum by (target) (increase(opaa_outbound_requests_seconds_count{namespace="opaa", service="opaa-backend", target=~"oidc|directory", outcome="auth_error"}[10m]))
            / sum by (target) (increase(opaa_outbound_requests_seconds_count{namespace="opaa", service="opaa-backend", target=~"oidc|directory"}[10m]))
            > 0.5
          ) and sum by (target) (increase(opaa_outbound_requests_seconds_count{namespace="opaa", service="opaa-backend", target=~"oidc|directory"}[10m])) >= 10
        for: 5m
        labels:
          severity: critical
          component: platform
        annotations:
          summary: Identitätsanbieter oder Verzeichnisdienst lehnt OPAA ab
          description: Mehr als 50 % der Aufrufe von opaa-backend an {{ $labels.target }} scheitern seit zehn Minuten an der Anmeldung.
          runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaIdentityProviderRejected"
  - name: opaa-chat
    rules:
      # Needs a minimum of requests, so that two failures on a quiet night do not alert.
      - alert: OpaaHighErrorRate
        expr: >-
          (

            sum(rate(http_server_requests_seconds_count{namespace="opaa", service="opaa-backend", status=~"5.."}[10m]))
            / sum(rate(http_server_requests_seconds_count{namespace="opaa", service="opaa-backend"}[10m]))
            > 0.05
          ) and on() sum(increase(http_server_requests_seconds_count{namespace="opaa", service="opaa-backend"}[10m])) >= 20
        for: 10m
        labels:
          severity: warning
          component: platform
        annotations:
          summary: Viele Fehlerantworten des OPAA-Backends
          description: Mehr als 5 % der Anfragen an opaa-backend enden seit zehn Minuten mit einem Status 5xx.
          runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaHighErrorRate"
      - alert: OpaaHighErrorRate
        expr: >-
          (

            sum(rate(http_server_requests_seconds_count{namespace="opaa", service="opaa-backend", status=~"5.."}[10m]))
            / sum(rate(http_server_requests_seconds_count{namespace="opaa", service="opaa-backend"}[10m]))
            > 0.25
          ) and on() sum(increase(http_server_requests_seconds_count{namespace="opaa", service="opaa-backend"}[10m])) >= 50
        for: 10m
        labels:
          severity: critical
          component: platform
        annotations:
          summary: Sehr viele Fehlerantworten des OPAA-Backends
          description: Mehr als 25 % der Anfragen an opaa-backend enden seit zehn Minuten mit einem Status 5xx.
          runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaHighErrorRate"
      # Burn rate of the error budget of chat questions, success / (success + error); rejected
      # questions say nothing about the service and stay out. Long and short window must both
      # burn, the long one with a minimum of questions.
      - alert: OpaaChatSloBurn
        expr: >-
          (

            sum(increase(opaa_query_count_total{namespace="opaa", service="opaa-backend", status="error"}[1h]))
            / sum(increase(opaa_query_count_total{namespace="opaa", service="opaa-backend", status=~"success|error"}[1h]))
            > 0.072
          ) and on() (

            sum(increase(opaa_query_count_total{namespace="opaa", service="opaa-backend", status="error"}[5m]))
            / sum(increase(opaa_query_count_total{namespace="opaa", service="opaa-backend", status=~"success|error"}[5m]))
            > 0.072
          ) and on() sum(increase(opaa_query_count_total{namespace="opaa", service="opaa-backend", status=~"success|error"}[1h])) >= 30
        for: 2m
        labels:
          severity: critical
          component: chat
        annotations:
          summary: Fehlerbudget der Chat-Fragen verbrennt schnell
          description: In einer Stunde scheitern so viele Fragen an opaa-backend, dass das Fehlerbudget von 0.5 % in 30 Tagen 14.4-fach schneller als vorgesehen verbraucht wird.
          runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaChatSloBurn"
      - alert: OpaaChatSloBurn
        expr: >-
          (

            sum(increase(opaa_query_count_total{namespace="opaa", service="opaa-backend", status="error"}[6h]))
            / sum(increase(opaa_query_count_total{namespace="opaa", service="opaa-backend", status=~"success|error"}[6h]))
            > 0.03
          ) and on() (

            sum(increase(opaa_query_count_total{namespace="opaa", service="opaa-backend", status="error"}[30m]))
            / sum(increase(opaa_query_count_total{namespace="opaa", service="opaa-backend", status=~"success|error"}[30m]))
            > 0.03
          ) and on() sum(increase(opaa_query_count_total{namespace="opaa", service="opaa-backend", status=~"success|error"}[6h])) >= 30
        for: 15m
        labels:
          severity: warning
          component: chat
        annotations:
          summary: Fehlerbudget der Chat-Fragen verbrennt anhaltend
          description: In sechs Stunden scheitern so viele Fragen an opaa-backend, dass das Fehlerbudget von 0.5 % in 30 Tagen 6-fach schneller als vorgesehen verbraucht wird.
          runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaChatSloBurn"
      - alert: OpaaChatSloBurn
        expr: >-
          (

            sum(increase(opaa_query_count_total{namespace="opaa", service="opaa-backend", status="error"}[3d]))
            / sum(increase(opaa_query_count_total{namespace="opaa", service="opaa-backend", status=~"success|error"}[3d]))
            > 0.005
          ) and on() (

            sum(increase(opaa_query_count_total{namespace="opaa", service="opaa-backend", status="error"}[6h]))
            / sum(increase(opaa_query_count_total{namespace="opaa", service="opaa-backend", status=~"success|error"}[6h]))
            > 0.005
          ) and on() sum(increase(opaa_query_count_total{namespace="opaa", service="opaa-backend", status=~"success|error"}[3d])) >= 30
        for: 1h
        labels:
          severity: info
          component: chat
        annotations:
          summary: Fehlerbudget der Chat-Fragen verbrennt schleichend
          description: In drei Tagen scheitern so viele Fragen an opaa-backend, dass das Fehlerbudget von 0.5 % in 30 Tagen 1-fach schneller als vorgesehen verbraucht wird.
          runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaChatSloBurn"
      - alert: OpaaTimeToFirstTokenHigh
        expr: >-
          histogram_quantile(0.95, sum by (le) (rate(opaa_query_time_to_first_token_seconds_bucket{namespace="opaa", service="opaa-backend"}[30m]))) > 10 and on() sum(increase(opaa_query_time_to_first_token_seconds_count{namespace="opaa", service="opaa-backend"}[30m])) >= 30
        for: 5m
        labels:
          severity: info
          component: chat
        annotations:
          summary: Chat antwortet langsam
          description: 95 % der Antworten von opaa-backend zeigen ihr erstes Wort seit 30 Minuten erst nach mehr als 10 Sekunden.
          runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaTimeToFirstTokenHigh"
      # Nearly every question with search finds nothing: index gone, vector search suspended or a
      # permission fault. A few empty searches only say something about the questions.
      - alert: OpaaRetrievalMostlyEmpty
        expr: >-
          (

            sum(increase(opaa_retrieval_empty_total{namespace="opaa", service="opaa-backend"}[30m]))
            / sum(increase(opaa_retrieval_hits_count{namespace="opaa", service="opaa-backend"}[30m]))
            >= 0.8
          ) and on() sum(increase(opaa_retrieval_hits_count{namespace="opaa", service="opaa-backend"}[30m])) >= 30
        for: 5m
        labels:
          severity: critical
          component: search
        annotations:
          summary: Suche findet fast nichts mehr
          description: Mindestens 80 % der Fragen mit Suche an opaa-backend haben seit 30 Minuten keine einzige Fundstelle.
          runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaRetrievalMostlyEmpty"
  - name: opaa-model
    rules:
      # A role without setup has no series. The value stands still without calls, so only a role
      # with traffic in the window alerts; down means down on every pod.
      - alert: OpaaModelRoleDown
        expr: >-
          max by (role) (opaa_model_role_available{namespace="opaa", service="opaa-backend", role=~"chat|embedding"}) == 0 and on() sum(increase(opaa_query_count_total{namespace="opaa", service="opaa-backend", status=~"success|error"}[10m])) > 0
        for: 10m
        labels:
          severity: critical
          component: model
        annotations:
          summary: Modellrolle {{ $labels.role }} nicht erreichbar
          description: Das Modell der Rolle {{ $labels.role }} ist für keinen Pod von opaa-backend erreichbar, obwohl Fragen gestellt werden.
          runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaModelRoleDown"
      - alert: OpaaModelRoleDown
        expr: >-
          max by (role) (opaa_model_role_available{namespace="opaa", service="opaa-backend", role=~"rerank|transcription|ocr|vision"}) == 0 and on(role) (

            label_replace(sum by (target) (increase(opaa_outbound_requests_seconds_count{namespace="opaa", service="opaa-backend", target=~"rerank|transcription|ocr|vision"}[30m])), "role", "$1", "target", "(.+)")
            > 0
          )
        for: 30m
        labels:
          severity: warning
          component: model
        annotations:
          summary: Modellrolle {{ $labels.role }} nicht erreichbar
          description: Der Dienst der Rolle {{ $labels.role }} ist seit 30 Minuten für keinen Pod von opaa-backend erreichbar.
          runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaModelRoleDown"
      # Expired key or certificate: the share of refused calls per target and kind. Identity
      # provider and directory have their own alert; the routing component follows the target.
      - alert: OpaaOutboundAuthFailing
        expr: >-
          (

            sum by (target, kind) (increase(opaa_outbound_requests_seconds_count{namespace="opaa", service="opaa-backend", target=~"rerank|transcription|ocr|vision|sandbox|model_check", outcome=~"auth_error|tls_error"}[10m]))
            / sum by (target, kind) (increase(opaa_outbound_requests_seconds_count{namespace="opaa", service="opaa-backend", target=~"rerank|transcription|ocr|vision|sandbox|model_check"}[10m]))
            > 0.5
          ) and sum by (target, kind) (increase(opaa_outbound_requests_seconds_count{namespace="opaa", service="opaa-backend", target=~"rerank|transcription|ocr|vision|sandbox|model_check"}[10m])) >= 5
        for: 5m
        labels:
          severity: warning
          component: model
        annotations:
          summary: Ausgehende Aufrufe scheitern an Anmeldung oder Zertifikat
          description: Mehr als 50 % der Aufrufe von opaa-backend an {{ $labels.target }} ({{ $labels.kind }}) scheitern seit zehn Minuten an Anmeldung oder TLS.
          runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaOutboundAuthFailing"
      - alert: OpaaOutboundAuthFailing
        expr: >-
          (

            sum by (target, kind) (increase(opaa_outbound_requests_seconds_count{namespace="opaa", service="opaa-backend", target=~"connector|original_store", outcome=~"auth_error|tls_error"}[10m]))
            / sum by (target, kind) (increase(opaa_outbound_requests_seconds_count{namespace="opaa", service="opaa-backend", target=~"connector|original_store"}[10m]))
            > 0.5
          ) and sum by (target, kind) (increase(opaa_outbound_requests_seconds_count{namespace="opaa", service="opaa-backend", target=~"connector|original_store"}[10m])) >= 5
        for: 5m
        labels:
          severity: warning
          component: indexing
        annotations:
          summary: Ausgehende Aufrufe scheitern an Anmeldung oder Zertifikat
          description: Mehr als 50 % der Aufrufe von opaa-backend an {{ $labels.target }} ({{ $labels.kind }}) scheitern seit zehn Minuten an Anmeldung oder TLS.
          runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaOutboundAuthFailing"
      - alert: OpaaOutboundAuthFailing
        expr: >-
          (

            sum by (target, kind) (increase(opaa_outbound_requests_seconds_count{namespace="opaa", service="opaa-backend", target=~"clamav", outcome=~"auth_error|tls_error"}[10m]))
            / sum by (target, kind) (increase(opaa_outbound_requests_seconds_count{namespace="opaa", service="opaa-backend", target=~"clamav"}[10m]))
            > 0.5
          ) and sum by (target, kind) (increase(opaa_outbound_requests_seconds_count{namespace="opaa", service="opaa-backend", target=~"clamav"}[10m])) >= 5
        for: 5m
        labels:
          severity: warning
          component: security
        annotations:
          summary: Ausgehende Aufrufe scheitern an Anmeldung oder Zertifikat
          description: Mehr als 50 % der Aufrufe von opaa-backend an {{ $labels.target }} ({{ $labels.kind }}) scheitern seit zehn Minuten an Anmeldung oder TLS.
          runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaOutboundAuthFailing"
      # Only calls a person waits for: in the background the indexing throttles itself at the
      # provider's limit on purpose.
      - alert: OpaaOutboundThrottled
        expr: >-
          (

            sum by (target) (increase(opaa_outbound_requests_seconds_count{namespace="opaa", service="opaa-backend", path_class="interactive", outcome="throttled"}[30m]))
            / sum by (target) (increase(opaa_outbound_requests_seconds_count{namespace="opaa", service="opaa-backend", path_class="interactive"}[30m]))
            > 0.2
          ) and sum by (target) (increase(opaa_outbound_requests_seconds_count{namespace="opaa", service="opaa-backend", path_class="interactive"}[30m])) >= 20
        for: 5m
        labels:
          severity: warning
          component: model
        annotations:
          summary: Anbieter drosselt Aufrufe, auf die jemand wartet
          description: Mehr als 20 % der interaktiven Aufrufe von opaa-backend an {{ $labels.target }} wurden in 30 Minuten gedrosselt.
          runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaOutboundThrottled"
  - name: opaa-indexing
    rules:
      # Per pod, since a run belongs to the pod that runs it: active through the whole window -
      # already at its start, so a young series after a pod start does not count as a full
      # window - and no document processed in it on that pod.
      - alert: OpaaIndexingStalled
        expr: >-
          max by (pod) (min_over_time(executor_active_threads{namespace="opaa", service="opaa-backend", name="indexingTaskExecutor"}[60m])) > 0 and on(pod) max by (pod) (executor_active_threads{namespace="opaa", service="opaa-backend", name="indexingTaskExecutor"} offset 60m) > 0 and on(pod) sum by (pod) (increase(opaa_indexing_documents_total{namespace="opaa", service="opaa-backend"}[60m])) == 0
        for: 5m
        labels:
          severity: warning
          component: indexing
        annotations:
          summary: Indexierung ohne Fortschritt
          description: Ein Indexierungslauf im Pod {{ $labels.pod }} von opaa-backend ist aktiv, hat aber seit 60 Minuten kein Dokument verarbeitet.
          runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaIndexingStalled"
      # Every pod reports the same count from the database, so the maximum per connector type.
      - alert: OpaaLibrariesOverdue
        expr: >-
          max by (connector) (opaa_indexing_libraries_overdue{namespace="opaa", service="opaa-backend"}) > 0
        for: 1h
        labels:
          severity: warning
          component: indexing
        annotations:
          summary: Bibliotheken verpassen ihren Zeitplan
          description: '{{ printf "%.0f" $value }} Bibliotheken des Typs {{ $labels.connector }} haben seit mehr als zwei ihrer Intervalle keinen erfolgreichen Lauf.'
          runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaLibrariesOverdue"
      # Runs, not documents: a broken file is normal, a failing run points at source or access.
      - alert: OpaaIndexingRunsFailing
        expr: >-
          (

            sum by (connector) (increase(opaa_indexing_runs_total{namespace="opaa", service="opaa-backend", result="failed"}[6h]))
            / sum by (connector) (increase(opaa_indexing_runs_total{namespace="opaa", service="opaa-backend"}[6h]))
            > 0.25
          ) and sum by (connector) (increase(opaa_indexing_runs_total{namespace="opaa", service="opaa-backend"}[6h])) >= 4
        for: 15m
        labels:
          severity: warning
          component: indexing
        annotations:
          summary: Viele Indexierungsläufe scheitern
          description: Mehr als 25 % der Läufe des Typs {{ $labels.connector }} sind in sechs Stunden gescheitert.
          runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaIndexingRunsFailing"
  - name: opaa-directory
    rules:
      # The last applied run stands still while a plan awaits confirmation; that case has its own
      # alert and suppresses this one.
      - alert: OpaaDirectorySyncStale
        expr: >-
          (time() - max by (provider) (opaa_directory_sync_last_success_seconds{namespace="opaa", service="opaa-backend", provider!="none"})) > 93600 unless on(provider) (max by (provider) (opaa_directory_sync_plan_pending_age_seconds{namespace="opaa", service="opaa-backend"}) > 0)
        for: 15m
        labels:
          severity: warning
          component: directory
        annotations:
          summary: Verzeichnisabgleich veraltet
          description: Der Verzeichnisabgleich mit {{ $labels.provider }} ist seit mehr als 26 Stunden nicht angewendet worden; Ausgeschiedene behalten so lange ihre Gruppen.
          runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaDirectorySyncStale"
      - alert: OpaaDirectorySyncPlanPending
        expr: >-
          max by (provider) (opaa_directory_sync_plan_pending_age_seconds{namespace="opaa", service="opaa-backend"}) > 86400
        for: 5m
        labels:
          severity: warning
          component: directory
        annotations:
          summary: Abgleichplan wartet auf Bestätigung
          description: Ein Plan des Verzeichnisabgleichs mit {{ $labels.provider }} wartet seit mehr als 24 Stunden auf die Entscheidung der Systemverwaltung.
          runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaDirectorySyncPlanPending"
  - name: opaa-background
    rules:
      # Under the lock every run happens on one pod, so the latest success over the pods. The audit
      # runs have their own alerts. A run that never succeeds counts from the start of the pod.
      - alert: OpaaScheduledJobOverdue
        expr: >-
          (time() - max by (job) (opaa_scheduled_last_success{namespace="opaa", service="opaa-backend", job!~"audit-chain|audit-retention"})) > on(job) (3 * max by (job) (opaa_scheduled_expected_interval_seconds{namespace="opaa", service="opaa-backend"})) and (time() - max by (job) (opaa_scheduled_last_success{namespace="opaa", service="opaa-backend", job!~"audit-chain|audit-retention"})) > 900
        for: 10m
        labels:
          severity: warning
          component: background
        annotations:
          summary: Geplanter Lauf überfällig
          description: Der Lauf {{ $labels.job }} von opaa-backend ist seit mehr als 3 Intervallen auf keinem Pod gelungen.
          runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaScheduledJobOverdue"
      # A threshold per queue: what is late for a mail is normal for the OCR backlog. The age of
      # the indexing queue includes the longest running run.
      - alert: OpaaQueueBacklog
        expr: >-
          max by (queue) (opaa_queue_oldest_age_seconds{namespace="opaa", service="opaa-backend", queue="indexing"}) > 7200
        for: 5m
        labels:
          severity: warning
          component: indexing
          queue: indexing
        annotations:
          summary: Warteschlange indexing staut sich
          description: Der älteste Eintrag der Warteschlange indexing von opaa-backend wartet seit mehr als 120 Minuten.
          runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaQueueBacklog"
      - alert: OpaaQueueBacklog
        expr: >-
          max by (queue) (opaa_queue_oldest_age_seconds{namespace="opaa", service="opaa-backend", queue="mail_outbox"}) > 1800
        for: 5m
        labels:
          severity: warning
          component: background
          queue: mail_outbox
        annotations:
          summary: Warteschlange mail_outbox staut sich
          description: Der älteste Eintrag der Warteschlange mail_outbox von opaa-backend wartet seit mehr als 30 Minuten.
          runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaQueueBacklog"
      - alert: OpaaQueueBacklog
        expr: >-
          max by (queue) (opaa_queue_oldest_age_seconds{namespace="opaa", service="opaa-backend", queue="ocr_backlog"}) > 21600
        for: 5m
        labels:
          severity: warning
          component: indexing
          queue: ocr_backlog
        annotations:
          summary: Warteschlange ocr_backlog staut sich
          description: Der älteste Eintrag der Warteschlange ocr_backlog von opaa-backend wartet seit mehr als 360 Minuten.
          runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaQueueBacklog"
      - alert: OpaaQueueBacklog
        expr: >-
          max by (queue) (opaa_queue_oldest_age_seconds{namespace="opaa", service="opaa-backend", queue="source_events"}) > 3600
        for: 5m
        labels:
          severity: warning
          component: indexing
          queue: source_events
        annotations:
          summary: Warteschlange source_events staut sich
          description: Der älteste Eintrag der Warteschlange source_events von opaa-backend wartet seit mehr als 60 Minuten.
          runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaQueueBacklog"
      # An invalid address is no incident: only a high share of finally discarded mails alerts. A
      # stuck outbox is OpaaQueueBacklog for mail_outbox.
      - alert: OpaaMailDeliveryFailing
        expr: >-
          (

            sum(increase(opaa_mail_sent_total{namespace="opaa", service="opaa-backend", result="failed"}[30m]))
            / sum(increase(opaa_mail_sent_total{namespace="opaa", service="opaa-backend"}[30m]))
            > 0.5
          ) and on() sum(increase(opaa_mail_sent_total{namespace="opaa", service="opaa-backend"}[30m])) >= 5
        for: 5m
        labels:
          severity: warning
          component: background
        annotations:
          summary: Mails werden nicht zugestellt
          description: Mehr als 50 % der Zustellversuche von opaa-backend sind in 30 Minuten endgültig gescheitert.
          runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaMailDeliveryFailing"
  - name: opaa-audit
    rules:
      # The run on the 1st of every month brings the value back to a few hours; above 35 days a
      # run was missed. Every pod reports the same database value, so the maximum is enough. NaN
      # on every pod (x != x) or no series at all means the state cannot be read, and alerts too;
      # silent while the backend is stopped on purpose (replicas 0).
      - alert: OpaaAuditRetentionOverdue
        expr: >-
          max(opaa_audit_retention_last_run_age_seconds{namespace="opaa", service="opaa-backend"}) > 35 * 86400 or max(opaa_audit_retention_last_run_age_seconds{namespace="opaa", service="opaa-backend"}) != max(opaa_audit_retention_last_run_age_seconds{namespace="opaa", service="opaa-backend"}) or (max(absent(opaa_audit_retention_last_run_age_seconds{namespace="opaa", service="opaa-backend"})) unless on() (kube_deployment_spec_replicas{namespace="opaa", deployment="opaa-backend"} == 0))
        for: 1h
        labels:
          severity: warning
          component: audit
        annotations:
          summary: Löschlauf des Revisionsprotokolls ausgeblieben
          description: Die automatische Löschung des Revisionsprotokolls von opaa-backend ist seit mehr als 35 Tagen nicht gelaufen, oder das Backend kann ihren Stand nicht lesen.
          runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaAuditRetentionOverdue"
      # The backend registers the counter at 0 for every event type on start, so its first drop
      # is an increase too; summed over the pods per event type.
      - alert: OpaaAuditPayloadDropped
        expr: >-
          sum by (event_type) (increase(opaa_audit_payload_dropped_total{namespace="opaa", service="opaa-backend"}[1h])) > 0
        labels:
          severity: warning
          component: audit
        annotations:
          summary: Revisionsprotokoll ohne nicht gelistete Angaben geschrieben
          description: Das Backend opaa-backend hat in der letzten Stunde Einträge der Art {{ $labels.event_type }} ohne Angaben geschrieben, die der Ereigniskatalog nicht nennt.
          runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaAuditPayloadDropped"
      # The chain run every ten minutes keeps the value below an hour; six hours means the run
      # stopped or an open transaction holds it back. Same database value on every pod, so the
      # maximum is enough. NaN on every pod (x != x) or no series at all means the state cannot
      # be read, and alerts too; silent while the backend is stopped on purpose (replicas 0).
      - alert: OpaaAuditChainStalled
        expr: >-
          max(opaa_audit_chain_lag_seconds{namespace="opaa", service="opaa-backend"}) > 6 * 3600 or max(opaa_audit_chain_lag_seconds{namespace="opaa", service="opaa-backend"}) != max(opaa_audit_chain_lag_seconds{namespace="opaa", service="opaa-backend"}) or (max(absent(opaa_audit_chain_lag_seconds{namespace="opaa", service="opaa-backend"})) unless on() (kube_deployment_spec_replicas{namespace="opaa", deployment="opaa-backend"} == 0))
        for: 1h
        labels:
          severity: warning
          component: audit
        annotations:
          summary: Prüfsummenkette des Revisionsprotokolls steht
          description: Der älteste Eintrag des Revisionsprotokolls von opaa-backend ohne Kontrollpunkt der Prüfsummenkette ist seit einer Stunde älter als sechs Stunden, oder das Backend kann den Stand der Kette nicht lesen.
          runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaAuditChainStalled"
      # After a month ends, the run seals it within minutes; a month without a seal for hours
      # means the chain does not reach its end, or the seal row of a month was removed while its
      # AUDIT_LOG_MONTH_SEALED entry remains - which the run never seals again. Same database
      # value on every pod; NaN is OpaaAuditChainStalled's case.
      - alert: OpaaAuditChainUnsealed
        expr: >-
          max(opaa_audit_chain_unsealed_months{namespace="opaa", service="opaa-backend"}) > 0
        for: 6h
        labels:
          severity: warning
          component: audit
        annotations:
          summary: Protokollmonat ohne Siegel
          description: Ein abgeschlossener Monat des Revisionsprotokolls von opaa-backend trägt seit sechs Stunden kein Siegel.
          runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaAuditChainUnsealed"
      # After the last prepared month every write to the audit log fails.
      - alert: OpaaAuditLogHorizon
        expr: >-
          max(opaa_audit_log_horizon_seconds{namespace="opaa", service="opaa-backend"}) < 1209600
        for: 1h
        labels:
          severity: warning
          component: audit
        annotations:
          summary: Revisionsprotokoll bald ohne angelegten Monat
          description: Der letzte angelegte Monat des Revisionsprotokolls von opaa-backend endet in weniger als 14 Tagen.
          runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaAuditLogHorizon"
      - alert: OpaaAuditLogHorizon
        expr: >-
          max(opaa_audit_log_horizon_seconds{namespace="opaa", service="opaa-backend"}) < 172800
        for: 10m
        labels:
          severity: critical
          component: audit
        annotations:
          summary: Revisionsprotokoll kann bald nicht mehr schreiben
          description: Der letzte angelegte Monat des Revisionsprotokolls von opaa-backend endet in weniger als 48 Stunden; danach scheitert jeder protokollierte Vorgang.
          runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaAuditLogHorizon"
  - name: opaa-security
    rules:
      - alert: OpaaMalwareScanFailing
        expr: >-
          (

            sum(increase(opaa_malware_scans_seconds_count{namespace="opaa", service="opaa-backend", result="failed"}[15m]))
            / sum(increase(opaa_malware_scans_seconds_count{namespace="opaa", service="opaa-backend"}[15m]))
            > 0.5
          ) and on() sum(increase(opaa_malware_scans_seconds_count{namespace="opaa", service="opaa-backend"}[15m])) >= 3
        for: 5m
        labels:
          severity: warning
          component: security
        annotations:
          summary: Virenprüfung scheitert
          description: Mehr als 50 % der Virenprüfungen von opaa-backend sind in 15 Minuten gescheitert; betroffene Dateien werden nicht aufgenommen.
          runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaMalwareScanFailing"
      # The finding itself reaches the security monitoring through the audit log; this only shows it.
      - alert: OpaaMalwareDetected
        expr: >-
          sum(increase(opaa_malware_scans_seconds_count{namespace="opaa", service="opaa-backend", result="infected"}[1h])) > 0
        labels:
          severity: info
          component: security
        annotations:
          summary: Virenfund
          description: Die Virenprüfung von opaa-backend hat in der letzten Stunde eine Datei abgewiesen.
          runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaMalwareDetected"
      - alert: OpaaMalwareSignaturesOutdated
        expr: >-
          max(opaa_malware_signatures_age_seconds{namespace="opaa", service="opaa-backend"}) > 259200
        for: 1h
        labels:
          severity: warning
          component: security
        annotations:
          summary: Virensignaturen veraltet
          description: Die Signaturen des Virenscanners von opaa-backend sind älter als 3 Tage.
          runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaMalwareSignaturesOutdated"
      - alert: OpaaGlobalRateLimitHit
        expr: >-
          sum by (limit) (increase(opaa_rate_limit_rejected_total{namespace="opaa", service="opaa-backend", scope="global"}[15m])) > 0
        labels:
          severity: warning
          component: security
        annotations:
          summary: Globale Grenze {{ $labels.limit }} erreicht
          description: Das Backend opaa-backend hat in 15 Minuten Anfragen an der installationsweiten Grenze {{ $labels.limit }} abgewiesen.
          runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaGlobalRateLimitHit"
      # Relative to the same quarter hour on the seven days before, so that the Monday after a
      # password round does not alert; without history the minimum alone decides.
      - alert: OpaaLoginFailureSpike
        expr: >-
          sum(increase(opaa_auth_logins_total{namespace="opaa", service="opaa-backend", method="local", result=~"bad_credentials|locked"}[15m])) > 50 and on() sum(increase(opaa_auth_logins_total{namespace="opaa", service="opaa-backend", method="local", result=~"bad_credentials|locked"}[15m])) > on() (

            5 * quantile(0.5,
              label_replace(sum(increase(opaa_auth_logins_total{namespace="opaa", service="opaa-backend", method="local", result=~"bad_credentials|locked"}[15m] offset 1d)), "day", "1", "", "")
              or label_replace(sum(increase(opaa_auth_logins_total{namespace="opaa", service="opaa-backend", method="local", result=~"bad_credentials|locked"}[15m] offset 2d)), "day", "2", "", "")
              or label_replace(sum(increase(opaa_auth_logins_total{namespace="opaa", service="opaa-backend", method="local", result=~"bad_credentials|locked"}[15m] offset 3d)), "day", "3", "", "")
              or label_replace(sum(increase(opaa_auth_logins_total{namespace="opaa", service="opaa-backend", method="local", result=~"bad_credentials|locked"}[15m] offset 4d)), "day", "4", "", "")
              or label_replace(sum(increase(opaa_auth_logins_total{namespace="opaa", service="opaa-backend", method="local", result=~"bad_credentials|locked"}[15m] offset 5d)), "day", "5", "", "")
              or label_replace(sum(increase(opaa_auth_logins_total{namespace="opaa", service="opaa-backend", method="local", result=~"bad_credentials|locked"}[15m] offset 6d)), "day", "6", "", "")
              or label_replace(sum(increase(opaa_auth_logins_total{namespace="opaa", service="opaa-backend", method="local", result=~"bad_credentials|locked"}[15m] offset 7d)), "day", "7", "", "")
            )
            or on() vector(0)
          )
        labels:
          severity: warning
          component: security
        annotations:
          summary: Ungewöhnlich viele abgewiesene Anmeldungen
          description: Das Backend opaa-backend hat in 15 Minuten {{ printf "%.0f" $value }} Anmeldungen lokaler Konten abgewiesen, ein Vielfaches des Üblichen zu dieser Zeit.
          runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaLoginFailureSpike"
      # The configuration limits the number of guarded targets; a full table hints at abuse.
      - alert: OpaaTargetValidationTableFull
        expr: >-
          sum(increase(opaa_target_validation_refused_checks_total{namespace="opaa", service="opaa-backend"}[15m])) > 0
        labels:
          severity: warning
          component: security
        annotations:
          summary: Zielprüfung lehnt neue Ziele ab
          description: Die Tabelle der bewachten Ziele von opaa-backend ist voll; neue Ziele lassen sich bis zum Neustart nicht speichern.
          runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaTargetValidationTableFull"
      - alert: OpaaSiemExportLagging
        expr: >-
          max(opaa_siem_export_lag_seconds{namespace="opaa", service="opaa-backend"}) > 3600
        for: 30m
        labels:
          severity: warning
          component: security
        annotations:
          summary: Ausleitung an das Sicherheitsmonitoring im Rückstand
          description: Der älteste nicht ausgeleitete Eintrag von opaa-backend ist seit 30 Minuten älter als 60 Minuten.
          runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaSiemExportLagging"
      # A pending installation answers its token on a running system: a window for a takeover.
      - alert: OpaaInstallationPending
        expr: >-
          max(opaa_installation_pending{namespace="opaa", service="opaa-backend"}) == 1
        for: 1h
        labels:
          severity: warning
          component: security
        annotations:
          summary: Installation nicht abgeschlossen
          description: Die Installation von opaa-backend steht seit einer Stunde offen; wer das Installations-Token kennt, kann sie übernehmen.
          runbook_url: "https://opaa.io/handbuch/betrieb/alarme.html#OpaaInstallationPending"
