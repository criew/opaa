# Location /grafana/ of the Compose monitoring, mounted into the frontend image's
# /etc/nginx/opaa-locations.d/ by docker-compose.monitoring.yml. Grafana serves from this sub path
# itself (GF_SERVER_SERVE_FROM_SUB_PATH) and sends its own Content-Security-Policy; the add_header
# lines here replace the frontend's headers, whose policy would block Grafana's scripts.
location ^~ /grafana/ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # Docker's DNS server, asked at request time: nginx starts even while Grafana is not up yet.
    resolver 127.0.0.11 valid=10s;
    set $opaa_grafana_upstream http://grafana:3000;
    proxy_pass $opaa_grafana_upstream;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    # Grafana Live keeps a WebSocket open.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
}
