# Creates the bucket, because OPAA never creates one. Idempotent: 409 means the bucket exists.
# curl signs the request itself (--aws-sigv4), so no S3 client image is needed.
apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-create-bucket
  namespace: opaa-trial-services
  labels:
    app.kubernetes.io/name: rustfs-create-bucket
    app.kubernetes.io/part-of: opaa-trial
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rustfs-create-bucket
        app.kubernetes.io/part-of: opaa-trial
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: create-bucket
          image: curlimages/curl:8.22.0
          env:
            - name: BUCKET
              valueFrom:
                configMapKeyRef:
                  name: trial-settings
                  key: S3_BUCKET
            - name: ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-credentials
                  key: accessKey
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-credentials
                  key: secretKey
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              until curl -fs -o /dev/null http://rustfs:9000/health; do sleep 2; done
              status=$(curl -sS -o /dev/null -w '%{http_code}' -X PUT \
                --aws-sigv4 "aws:amz:us-east-1:s3" --user "$ACCESS_KEY:$SECRET_KEY" \
                "http://rustfs:9000/$BUCKET")
              case "$status" in
                200|409) echo "Bucket $BUCKET ready (HTTP $status)" ;;
                *) echo "Creating bucket $BUCKET failed with HTTP $status" >&2; exit 1 ;;
              esac
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
