# Mailpit accepts every mail and delivers none; its web interface shows what OPAA sent.
# trial.sh enters it as OPAA's mail server (SMTP mailpit.opaa-trial-services:1025, no encryption).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: opaa-trial-services
  labels:
    app.kubernetes.io/name: mailpit
    app.kubernetes.io/part-of: opaa-trial
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mailpit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mailpit
        app.kubernetes.io/part-of: opaa-trial
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.31.4
          env:
            - name: MP_MAX_MESSAGES
              value: "500"
            - name: MP_SMTP_AUTH_ACCEPT_ANY
              value: "1"
            - name: MP_SMTP_AUTH_ALLOW_INSECURE
              value: "1"
          ports:
            - name: smtp
              containerPort: 1025
            - name: http
              containerPort: 8025
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # Mailpit keeps its message store in a temporary file.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: opaa-trial-services
  labels:
    app.kubernetes.io/name: mailpit
    app.kubernetes.io/part-of: opaa-trial
spec:
  selector:
    app.kubernetes.io/name: mailpit
  ports:
    - name: smtp
      port: 1025
      targetPort: smtp
    - name: http
      port: 8025
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mailpit
  namespace: opaa-trial-services
  labels:
    app.kubernetes.io/name: mailpit
    app.kubernetes.io/part-of: opaa-trial
spec:
  ingressClassName: traefik
  rules:
    - host: mailpit.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mailpit
                port:
                  name: http
