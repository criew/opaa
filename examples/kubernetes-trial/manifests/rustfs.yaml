# RustFS as the object store for the originals of uploaded documents, as in the Compose stack and
# the backend's S3 tests. The root keys come from the secret "rustfs-credentials" that trial.sh
# generates; OPAA uses the same keys (secret "opaa-secrets" in namespace opaa-trial).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs-data
  namespace: opaa-trial-services
  labels:
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/part-of: opaa-trial
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: opaa-trial-services
  labels:
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/part-of: opaa-trial
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: rustfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rustfs
        app.kubernetes.io/part-of: opaa-trial
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.1
          env:
            - name: RUSTFS_VOLUMES
              value: /data
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-credentials
                  key: accessKey
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-credentials
                  key: secretKey
          ports:
            - name: s3
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /health
              port: s3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rustfs-data
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: opaa-trial-services
  labels:
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/part-of: opaa-trial
spec:
  selector:
    app.kubernetes.io/name: rustfs
  ports:
    - name: s3
      port: 9000
      targetPort: s3
---
# Creates the bucket, because OPAA never creates one. Idempotent: 409 means the bucket exists.
# curl signs the request itself (--aws-sigv4), so no S3 client image is needed.
apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-create-bucket
  namespace: opaa-trial-services
  labels:
    app.kubernetes.io/name: rustfs-create-bucket
    app.kubernetes.io/part-of: opaa-trial
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rustfs-create-bucket
        app.kubernetes.io/part-of: opaa-trial
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: create-bucket
          image: curlimages/curl:8.22.0
          env:
            - name: BUCKET
              valueFrom:
                configMapKeyRef:
                  name: trial-settings
                  key: S3_BUCKET
            - name: ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-credentials
                  key: accessKey
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-credentials
                  key: secretKey
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              until curl -fs -o /dev/null http://rustfs:9000/health; do sleep 2; done
              status=$(curl -sS -o /dev/null -w '%{http_code}' -X PUT \
                --aws-sigv4 "aws:amz:us-east-1:s3" --user "$ACCESS_KEY:$SECRET_KEY" \
                "http://rustfs:9000/$BUCKET")
              case "$status" in
                200|409) echo "Bucket $BUCKET ready (HTTP $status)" ;;
                *) echo "Creating bucket $BUCKET failed with HTTP $status" >&2; exit 1 ;;
              esac
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
