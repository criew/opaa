# Overlay applied only by scripts/run-e2e.mjs (`-f docker-compose.yml -f
# e2e/docker-compose.e2e.yml`), never by a developer's own `docker compose
# up`.

# The fake embedding vector's length of ai-stub (EMBEDDING_DIMENSIONS); the backend learns it from
# the probe embedding of its installation, so no second value can drift apart from it.
x-embedding-dimensions: &embedding-dimensions "1536"

services:
  backend:
    # Backs document-attachment-grouping.spec.ts - a FILESYSTEM library over this mount
    # creates attachment rows (parent_document_id) for the mounted mail. Chosen when the UPLOAD
    # path still discarded discovered attachments; #1227 has since closed that gap, but the
    # connector variant stays as the deterministic fixture-driven path. /data is already on the
    # dev profile's filesystem allowlist (application.yml).
    volumes:
      - ./demo/seed/e2e-data/filesystem-library:/data/e2e-mail-bibliothek:ro
    depends_on:
      ai-stub:
        # Not service_started: Spring AI's PgVectorStore can probe the embedding provider's
        # dimension via a real POST /v1/embeddings call while the backend is still starting
        # up. Waiting for the stub's own /health first, not just its container
        # existing, is what actually guarantees it can already answer that call.
        condition: service_healthy
      rss-feed:
        condition: service_healthy
      clamd-stub:
        condition: service_healthy
    environment:
      # test(e2e) #471: the default 1s politeness delay between RSS detail-page/attachment
      # requests (opaa.indexing.rss.request-delay-ms) is meant for a real, foreign feed operator -
      # against the suite's own rss-feed fixture service it only adds dead time to every run.
      OPAA_INDEXING_RSS_REQUEST_DELAY_MS: "0"
      # The Dropbox connector talks to dropbox-stub instead of Dropbox. Only the consent page is
      # opened by the browser, so it names the host port; every other address is the service name.
      OPAA_INDEXING_DROPBOX_API_BASE: http://dropbox-stub:8090
      OPAA_INDEXING_DROPBOX_CONTENT_BASE: http://dropbox-stub:8090
      OPAA_INDEXING_DROPBOX_AUTHORIZATION_ENDPOINT: http://localhost:${OPAA_DROPBOX_STUB_PORT:-18091}/oauth2/authorize
      OPAA_INDEXING_DROPBOX_TOKEN_ENDPOINT: http://dropbox-stub:8090/oauth2/token
      OPAA_INDEXING_DROPBOX_REVOCATION_ENDPOINT: http://dropbox-stub:8090/2/auth/token/revoke
      # Base of every absolute link the backend builds, among them the redirect address of a
      # consent: the provider sends the browser back to the frontend of this stack.
      OPAA_PUBLIC_BASE_URL: http://localhost:${OPAA_FRONTEND_PORT}
      # test(e2e) #471 is the first scenario to trigger POST .../indexing more than once (its own
      # unchanged-feed rerun, to prove a second run creates no new documents) - the default
      # io.opaa.ratelimit.RateLimitConfiguration limit of 1 request per library per 60s
      # (opaa.rate-limit.indexing.max-requests) would otherwise turn the second trigger into a 429
      # within the same test. Raised, not disabled: the endpoint's own rate limiting stays
      # exercised by whatever a future scenario adds for it, this only widens the window enough for
      # a same-run rerun.
      OPAA_RATE_LIMIT_INDEXING_MAX_REQUESTS: "20"
      # RateLimitFilter checks this GLOBAL sliding-window counter
      # (default 5 requests/60s, application.yml) *before* the per-library one above, across every
      # library and every caller. CI's own retry (playwright.config.ts: retries: 1 on CI) re-runs a
      # whole failed test.describe.serial group from its first test, so a transient failure alone
      # already means 2x this spec's own POST .../indexing calls in the same 60s window - on top of
      # whatever other spec ran in the same suite invocation. Left at the default, that retry could
      # never turn green (the 6th+ POST getting a 429 whose GET .../indexing/status the store then
      # never reaches COMPLETED for, timing out the test instead of failing it cleanly). Raised for
      # the same reason as the per-library limit above, not disabled.
      OPAA_RATE_LIMIT_INDEXING_GLOBAL_MAX_REQUESTS: "20"
      # test(e2e) #1489: the Gesprächsnotiz scenarios drive four chats of three turns each back to
      # back, and the display threshold of three completed rounds makes that count a property of
      # the feature, not a choice - twelve questions inside a few seconds, well past the default
      # of 10 (opaa.rate-limit.query.max-requests), before a single retry is even counted.
      # io.opaa.ratelimit.RateLimitFilter counts a question twice: per client address and per
      # signed-in account (opaa.rate-limit.query.max-requests-per-account, default 10). The suite
      # asks from one address and almost always as dev-admin, so both counters see every question
      # of every spec and get the same budget. Raised, not disabled: the limiter stays in the
      # request path, and the global counter (100/60s) is untouched, so a runaway loop still hits
      # a wall.
      OPAA_RATE_LIMIT_QUERY_MAX_REQUESTS: "40"
      OPAA_RATE_LIMIT_QUERY_MAX_REQUESTS_PER_ACCOUNT: "40"
      # The SSRF target-address check defaults to active (opaa.indexing.target-validation),
      # which would otherwise reject every HTTP_DIRECTORY/RSS_FEED fetch this suite makes - both
      # "rss-feed" and "ai-stub" resolve to a container-internal address on the Compose network's
      # own bridge, itself a private range (172.16.0.0/12 or similar, assigned by Docker). These are
      # legitimate, operator-chosen fixture hosts for this suite ("nextcloud" is the real connector target of the private-library scenarios), not an attacker-reachable target -
      # exactly the case opaa.indexing.target-validation.allowlist exists for, mirroring how a real
      # deployment names its own trusted internal sources.
      OPAA_INDEXING_TARGET_VALIDATION_ALLOWLIST: rss-feed,ai-stub,nextcloud,dropbox-stub
      # The models of this suite (chat model administration, connection test) are ai-stub as well;
      # the address check of models has its own list, the entry above releases no model.
      OPAA_MODEL_TARGET_VALIDATION_ALLOWLIST: ai-stub:8089
      # The E2E stack uses its own host ports (see run-e2e.mjs) so it can
      # run alongside a developer's own docker-compose.yml stack; the
      # allowed CORS origin must match the frontend's actual port.
      OPAA_CORS_ALLOWED_ORIGINS: http://localhost:${OPAA_FRONTEND_PORT}
      # A third dev user, "dev-outsider", used by test(e2e) #424 as the person with no grant on
      # anything (the negative case: a share must not leak to someone it was never extended to).
      # It is added here, not in application.yml's opaa.auth.dev.users default, because it is
      # meaningful only for this suite - a plain `SPRING_PROFILES_ACTIVE=local,dev` backend has no
      # reason to carry an extra account nobody asked for. Spring Boot does not guarantee that a
      # List<T> bound from @ConfigurationProperties merges across property sources by index (unlike
      # Map<K,V>, where per-key merging is well defined) - only that the highest-priority source
      # that defines any index for it wins outright. So index 0 and 1 are redefined here alongside
      # the new indices 2 and 3 below, matching application.yml's current values exactly, instead
      # of gambling on a merge with it - this stays correct even if that default ever changes
      # shape.
      OPAA_AUTH_DEV_USERS_0_SUBJECT: dev-admin
      OPAA_AUTH_DEV_USERS_0_EMAIL: admin@opaa.local
      OPAA_AUTH_DEV_USERS_0_DISPLAY_NAME: Dev Admin
      OPAA_AUTH_DEV_USERS_1_SUBJECT: dev-user
      OPAA_AUTH_DEV_USERS_1_EMAIL: dev-user@opaa.local
      OPAA_AUTH_DEV_USERS_1_DISPLAY_NAME: Dev User
      OPAA_AUTH_DEV_USERS_2_SUBJECT: dev-outsider
      OPAA_AUTH_DEV_USERS_2_EMAIL: outsider@opaa.local
      OPAA_AUTH_DEV_USERS_2_DISPLAY_NAME: Dev Outsider
      # A fourth dev user, "dev-format-pipelines": format-pipelines-upload.spec.ts uploads
      # several documents purely to prove indexing succeeds and never asks a question, so it runs
      # under this dedicated account instead of any of the three above - a second, retrieval-
      # window-independent line of defense that keeps a pure-upload scenario's documents
      # out of a citation-checking scenario's readable corpus entirely, on top of e2e.env's
      # OPAA_QUERY_TOP_K/OPAA_QUERY_FETCH_K already being sized to hold every account's own,
      # never-cleaned-up corpus with headroom (see e2e/ai-stub/server.mjs's own comment on the
      # deterministic embedding this guards against).
      OPAA_AUTH_DEV_USERS_3_SUBJECT: dev-format-pipelines
      OPAA_AUTH_DEV_USERS_3_EMAIL: format-pipelines@opaa.local
      OPAA_AUTH_DEV_USERS_3_DISPLAY_NAME: Dev Format Pipelines

  # Stands in for a real chat/embedding provider (see e2e.env's OPAA_OPENAI_BASE_URL and
  # e2e/ai-stub/server.mjs) - not part of docker-compose.yml because no non-E2E use of the stack
  # should ever be able to point at it by accident. No Dockerfile: the script is mounted straight
  # into the stock node image, so there is nothing extra to build or cache.
  ai-stub:
    # Deliberately the same floating `node:22-alpine` tag already used for frontend/Dockerfile
    # (and the equally floating `eclipse-temurin:21-jdk`/`nginxinc/nginx-unprivileged:alpine`/`pgvector/pgvector:pg18`
    # elsewhere in the repo). That is a nightly-schedule risk (a new base
    # image landing between runs), which is real but not specific to this service: pinning only
    # ai-stub, and to what would then be the only digest-pinned image in the whole stack, would
    # be an inconsistency of its own without actually closing that gap anywhere else.
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./e2e/ai-stub:/app:ro
    command: ["node", "server.mjs"]
    environment:
      PORT: "8089"
      EMBEDDING_DIMENSIONS: *embedding-dimensions
    # GET /last-chat-model (ai-stub/server.mjs) has to be
    # reachable from the Playwright/Node test process directly, not just from the backend
    # container over the Compose network - that is the only way a scenario can assert *which*
    # managed chat model actually answered. Every other service in this stack that Playwright
    # itself talks to directly (postgres, backend, frontend) already publishes a host port the
    # same way (see run-e2e.mjs); this mirrors that, on its own 127.0.0.1-only port so it never
    # collides with a developer's own stack.
    ports:
      - "127.0.0.1:${OPAA_AI_STUB_PORT:-18089}:8089"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8089/health"]
      interval: 2s
      timeout: 2s
      retries: 10

  # Serves the fixtures for test(e2e) #471 (RSS feed + detail pages + attachment) as plain static
  # files, reachable by the backend under the stack-internal hostname "rss-feed" - the same
  # "static content in the compose stack" pattern #229 established for the demo corpus, scoped to
  # this suite instead of docker-compose.yml's own "demo" profile. Unlike #229's corpus service,
  # RssFeedIndexingExecutor fetches the feed URL and each entry's own link directly - it never
  # parses a directory listing - so a plain httpd with no FancyIndexing config is enough; no
  # Dockerfile, no build, matching the read-only, already-official-image style ai-stub uses above.
  # This same docroot also backs the HTTP_DIRECTORY connection-test happy path
  # (knowledge-library-nacharbeiten.spec.ts) via .../webverzeichnis/, a hand-crafted
  # directory-listing page - see that file's own docroot for why a real autoindex response from
  # this image's stock config would not do. The docroot lives under
  # demo/seed/e2e-data/rss-feed/htdocs/, not e2e/fixtures/ - this content is what specs point
  # library-creation UI flows at, the same "one place owns this suite's frozen data"
  # move that also relocated e2e/fixtures/test-documents/ (see demo/seed/profiles.py).
  rss-feed:
    image: httpd:2.4-alpine
    volumes:
      - ./demo/seed/e2e-data/rss-feed/htdocs:/usr/local/apache2/htdocs:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/feed-ok.xml"]
      interval: 2s
      timeout: 2s
      retries: 10

  # A real Nextcloud for connected-accounts-private-libraries.spec.ts: the one connector
  # that takes a personal app password, and the test connectors from src/test do not exist in the
  # stack's backend image. SQLite and the image tag mirror NextcloudFixture (backend/src/test/java/
  # io/opaa/integration/nextcloud), the Testcontainers fixture of the backend suite - this service
  # is that fixture's counterpart for the composed stack. The scenarios create their accounts and
  # files themselves through the provisioning API and WebDAV; the hook only switches off the
  # throttling a deliberately refused password would otherwise trigger. The backend reaches it as
  # "nextcloud" (allowlisted above); Playwright reaches it on the published host port.
  nextcloud:
    image: nextcloud:35.0.2-apache
    environment:
      SQLITE_DATABASE: nextcloud
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: E2e-Nextcloud-Admin-2026!
      NEXTCLOUD_TRUSTED_DOMAINS: localhost 127.0.0.1 nextcloud
    volumes:
      - ./e2e/nextcloud/post-installation:/docker-entrypoint-hooks.d/post-installation:ro
    ports:
      - "127.0.0.1:${OPAA_NEXTCLOUD_PORT:-18090}:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/status.php | grep -q '\"installed\":true'"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  # Stands in for Dropbox (OAuth consent, token endpoint, the API v2 routes of the connector) for
  # the source-connect scenario; see e2e/dropbox-stub/server.mjs. Like ai-stub it is a script
  # mounted into the stock node image. The browser reaches the consent page on the host port.
  dropbox-stub:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./e2e/dropbox-stub:/app:ro
    command: ["node", "server.mjs"]
    environment:
      PORT: "8090"
    ports:
      - "127.0.0.1:${OPAA_DROPBOX_STUB_PORT:-18091}:8090"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8090/health"]
      interval: 2s
      timeout: 2s
      retries: 10

  # Stands in for a clamd daemon (e2e.env's OPAA_MALWARE_SCAN_*), see e2e/clamd-stub/server.mjs:
  # answers FOUND for the EICAR test string and OK for anything else. A real ClamAV would first load
  # its signature database over the network, which costs minutes and memory on every run.
  clamd-stub:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./e2e/clamd-stub:/app:ro
    command: ["node", "server.mjs"]
    environment:
      PORT: "3310"
      HEALTH_PORT: "3311"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3311/health"]
      interval: 2s
      timeout: 2s
      retries: 10
