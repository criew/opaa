openapi: 3.0.3
info:
  title: OPAA API
  description: Open Project AI Assistant REST API
  version: 0.1.0
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html

paths:
  /api/health:
    get:
      operationId: getHealth
      tags: [system]
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/query:
    post:
      operationId: submitQuery
      tags: [query]
      summary: >
        Ask a question against indexed documents. If chatId resolves to an owned, persisted chat
        whose space is archived (#543), the turn is rejected with 409 and not persisted - an
        archived space accepts no new turns in an existing chat either.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
      responses:
        "200":
          description: Query answered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/config:
    get:
      operationId: getAuthConfig
      tags: [auth]
      summary: Get authentication configuration
      responses:
        "200":
          description: Authentication configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthConfigResponse"

  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current user info
      responses:
        "200":
          description: Current user information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfoResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/me/groups:
    get:
      operationId: listMyGroups
      tags: [auth]
      summary: >
        List the groups the caller is a direct member of - deliberately not admin-restricted,
        unlike GET /api/v1/admin/groups. Any authenticated user needs their own group membership
        to choose a group owner when creating a knowledge library (see the library ownership
        picker in the frontend); listGroups requires SYSTEM_ADMIN and returns every group in the
        organization regardless of membership, so it cannot serve that purpose. Reuses
        GroupListResponse rather than a slimmer schema: every field on it (including externalId,
        the directory objectGUID, and memberCount) describes a group the caller already belongs
        to and can already see the name and kind of, so nothing here exposes information the
        caller could not already infer; a second schema would only duplicate the first for no
        access-control benefit.
      responses:
        "200":
          description: Groups the caller is a member of
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/users:
    get:
      operationId: listUsersForSelection
      tags: [auth]
      summary: >
        List users in the caller's own organization for member/grant selection - deliberately not
        admin-restricted, unlike GET /api/v1/admin/users (#777). The member/grant pickers on
        SpaceManagementPage, SpaceCreatePage, LibraryCreatePage and LibraryGrantsDialog need to
        search for a user to add, but GET /api/v1/admin/users requires SYSTEM_ADMIN (#199) - a
        403 that the frontend silently swallowed into an empty, dead-looking search field for
        every non-admin, making "Mitglied hinzufügen" unusable for anyone but a system admin.
        Same precedent as GET /api/v1/me/groups (any authenticated user needs their own group
        memberships) and AssetGrantService#toResponses's server-side name resolution (#423): the
        threshold this endpoint needs is "authenticated member of the organization", not
        SYSTEM_ADMIN. Returns UserSummaryResponse (id/email/displayName only, no systemRole) -
        narrower than UserInfoResponse, matching KnowledgeLibraryService#resolveOwnerNames's
        reasoning that an organization-wide audience should see less than the SYSTEM_ADMIN-only
        admin list does.

        Requires `query` (min. 2 characters, matched case-insensitively against displayName and
        email) and caps the result at 20 rows (#778 review) - the endpoint used to return every
        user of the organization unconditionally on each picker mount, unbounded by input or size,
        which is both a data-minimisation concern and unnecessary load on a large organization. A
        missing or too-short query returns an empty list rather than falling back to the old
        unbounded list.
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
          description: >
            Case-insensitive substring match against displayName or email. Fewer than 2 characters
            (after trimming) yields an empty result instead of the full organization list.
      responses:
        "200":
          description: Users in the caller's organization matching the query, capped at 20 rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSummaryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/admin/users:
    get:
      operationId: listUsers
      tags: [admin]
      summary: List all users (system admin only)
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserInfoResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/users/{id}/role:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      operationId: changeUserRole
      tags: [admin]
      summary: Change a user's system role (system admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleChangeRequest"
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfoResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/groups:
    get:
      operationId: listGroups
      tags: [admin]
      summary: List groups in the caller's organization (system admin only)
      responses:
        "200":
          description: List of groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupListResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      operationId: createGroup
      tags: [admin]
      summary: Create an ad-hoc group (system admin only)
      description: >
        Always creates a group of kind AD_HOC. Groups of kind ORG_UNIT are created only by
        directory synchronisation (see #237) and cannot be created through this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupRequest"
      responses:
        "201":
          description: Group created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/groups/{groupId}:
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: getGroup
      tags: [admin]
      summary: Get group details (system admin only)
      responses:
        "200":
          description: Group details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: updateGroup
      tags: [admin]
      summary: Rename an ad-hoc group or change its description (system admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupUpdateRequest"
      responses:
        "200":
          description: Group updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: deleteGroup
      tags: [admin]
      summary: Delete an ad-hoc group (system admin only)
      responses:
        "204":
          description: Group deleted
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/groups/{groupId}/members:
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: listGroupMembers
      tags: [admin]
      summary: List group members (system admin only)
      responses:
        "200":
          description: List of members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupMemberResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      operationId: addGroupMember
      tags: [admin]
      summary: Add a member to an ad-hoc group (system admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupAddMemberRequest"
      responses:
        "201":
          description: Member added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupMemberResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/admin/groups/{groupId}/members/{userId}:
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    delete:
      operationId: removeGroupMember
      tags: [admin]
      summary: Remove a member from an ad-hoc group (system admin only)
      responses:
        "204":
          description: Member removed
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/models:
    get:
      operationId: listLlmModels
      tags: [admin]
      summary: List managed chat models (system admin only)
      description: >
        Stufe 1 (#757, docs/features/llm-integration.md#stufe-1-verwaltete-chat-modelle-in-umsetzung).
        Never carries an apiKey value - only apiKeySet, whether one is stored.
      responses:
        "200":
          description: List of managed chat models
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LlmModelResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      operationId: createLlmModel
      tags: [admin]
      summary: Create a managed chat model (system admin only)
      description: >
        Created inactive; activateLlmModel is the only way a model becomes the systemwide active
        one, so creating and activating are always two distinguishable audit events even in the
        same request sequence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LlmModelRequest"
      responses:
        "201":
          description: Chat model created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmModelResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/models/{modelId}:
    parameters:
      - name: modelId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    put:
      operationId: updateLlmModel
      tags: [admin]
      summary: Update a managed chat model's editable fields (system admin only)
      description: >
        A full replacement of every editable field except active, which only activateLlmModel
        changes. apiKey follows the three-way convention BrandingUpdateRequest already uses for
        its own optional fields: omitted (null) leaves the stored key unchanged, an empty string
        clears it, and any other value replaces it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LlmModelRequest"
      responses:
        "200":
          description: Chat model updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmModelResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: deleteLlmModel
      tags: [admin]
      summary: Delete a managed chat model (system admin only)
      description: >
        Rejected with 409 while the model is the systemwide active one - a chat cannot be left
        without any model to answer with. Deactivate it via another model's activateLlmModel
        first.
      responses:
        "204":
          description: Chat model deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/admin/models/{modelId}/activate:
    post:
      operationId: activateLlmModel
      tags: [admin]
      summary: Make a chat model the systemwide active one (system admin only)
      description: >
        Deactivates whichever model was active before, in the same transaction; wirkt beim
        nächsten Vorgang, ohne Neustart. A concurrent activation of a different model is rejected
        with 409 rather than surfacing as a server error.
      parameters:
        - name: modelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Chat model activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmModelResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/admin/models/test:
    post:
      operationId: testLlmModel
      tags: [admin]
      summary: Probe a chat model connection, saved or not yet saved (system admin only)
      description: >
        A short probe call against the given baseUrl/modelIdentifier with a tight timeout, so a
        misconfigured address is caught here rather than by the next person asking a question. Also
        works for a draft that has not been saved yet, so the entry is checkable before it is
        stored. When modelId is given and apiKey is omitted, the stored, decrypted key of that
        model is used for the probe instead - the key itself is never accepted back from a client
        that never had it to begin with.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LlmModelTestRequest"
      responses:
        "200":
          description: >
            Test result - a 200 either way; the boolean success field carries the outcome, not the
            HTTP status, the same convention SourceConnectionTestResponse already uses.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmModelTestResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/models/embedding-info:
    get:
      operationId: getEmbeddingInfo
      tags: [admin]
      summary: Get the current embedding model configuration (system admin only)
      description: >
        Read-only (#759). Unlike chat models, the embedding model is not managed through this API -
        a change requires a full re-index because existing vectors become incomparable
        (docs/features/llm-integration.md#sofortige-wirkung), so it stays a configuration value,
        not a writable admin resource.
      responses:
        "200":
          description: Current embedding configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbeddingInfoResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/indexing/low-chunk-documents:
    get:
      operationId: listLowChunkDocuments
      tags: [admin, indexing]
      summary: >
        The one-time inventory check for scan-PDF fallout (system admin only, #1055/#1090,
        ingestion-pipelines.md Teil 3 Punkt 1 "Scan-Erkennung und Bestandsprüfung")
      description: >
        Every INDEXED document of the caller's own organization whose chunkCount is at or below
        chunkCountThreshold - the bestand a scan PDF could have silently landed in before ingest-time
        detection existed, and the operational metric that stays permanently queryable rather than a
        one-off cleanup that goes stale the moment the next such file is indexed. Scoped to the
        caller's own organization the same way every other admin listing in this API is - never a
        cross-organization view. Consumed by the "Suche & Indexierung" administration page (#1053).
      parameters:
        - name: chunkCountThreshold
          in: query
          required: false
          description: >
            Flags a document whose chunkCount is at or below this value. Default 0 - the unambiguous
            anomaly this issue's own bug produces. Raising it also catches "auffällig wenige" chunks,
            a judgement call with no measured threshold (see ingestion-pipelines.md's "gesetzt, nicht
            gemessen" rule for chunk sizes) - left to the caller rather than guessed here.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: page
          in: query
          required: false
          description: Rejected with 400 if negative.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: Rejected with 400 outside 1..100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Page of flagged documents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LowChunkDocumentPageResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/indexing/pipeline-versions:
    get:
      operationId: getPipelineVersionStatus
      tags: [admin, indexing]
      summary: >
        Which ingestion pipeline versions the chunk bestand was produced with (system admin only,
        #1056, ingestion-pipelines.md Querschnittsregel (d))
      description: >
        The registered pipelines with their current versions, plus the fill state per library of the
        caller's own organization: how many chunks were produced by the current version of the
        pipeline named on them, and how many are below it and therefore candidates for a selective
        re-index. Without this, a bestand containing chunks from two verfahren is not feststellbar at
        all - one cannot tell from a chunk which rules cut it.
      responses:
        "200":
          description: Pipeline versions and per-library fill state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineVersionStatusResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/indexing/pipeline-reindex:
    post:
      operationId: reindexPipelineBatch
      tags: [admin, indexing]
      summary: >
        Re-index one batch of chunks below a given pipeline version (system admin only, #1056)
      description: >
        Processes at most batchSize documents of the caller's own organization that still hold
        chunks from pipelineId below belowVersion, and reports what it did. Deliberately batched and
        repeatable rather than one long-running request: the remaining work is re-derived from the
        chunk metadata on every call, so an interrupted run continues where it stood instead of
        starting over. Repeat until done is true. Whether and when a bestand is nachgezogen at all is
        an explicit operator decision - nothing triggers this automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PipelineReindexRequest"
      responses:
        "200":
          description: What this batch did
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineReindexResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/indexing/metadata-backfill:
    post:
      operationId: backfillMetadataBatch
      tags: [admin, indexing]
      summary: >
        Re-extract the core metadata fields of one batch of a library's Altbestand from the
        original files (system admin only, #1067, metadata-schema.md "Deterministischer
        Bestandslauf")
      description: >
        Processes at most batchSize INDEXED documents of libraryId (which must belong to the
        caller's own organization, otherwise 404) whose metadata_extraction_version is missing or
        below the current CoreMetadataExtractor version: the original file is re-read for its
        declared properties, the core fields are stored at the document and the filterable keys are
        rewritten on its existing chunks - no re-chunking, no re-embedding, no model call. The
        search stays available throughout; a document carries either its old or its new fields,
        never a mixture. Repeat until done is true; the remaining work is re-derived from the
        documents table on every call, so pausing is simply not calling again, and the next call
        resumes at the next unprocessed document. A manually set value is never overwritten. A
        system process without a person's rights context (Epic #1065, Beschluss 1). Nothing
        triggers this automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetadataBackfillRequest"
      responses:
        "200":
          description: What this batch did
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataBackfillResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/search/status:
    get:
      operationId: getSearchStatus
      tags: [admin, search]
      summary: >
        The active retrieval configuration as a read-only status display (system admin only, #1053,
        hybrid-retrieval.md "Was die Seite anzeigt")
      description: >
        Model roles, search paths and per-library index state of the caller's own organization. A
        status display, never an editor: this API has no counterpart that writes any of it. Access
        keys never appear in this response, not even shortened - the same write-only convention
        LlmModelResponse already establishes.
      responses:
        "200":
          description: The active configuration and index state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchStatusResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/search/diagnosis-context:
    get:
      operationId: getSearchDiagnosisContext
      tags: [admin, search]
      summary: The rights contexts the diagnosis can be run in (system admin only, #1053, #1150)
      description: >
        The permission profiles - a group together with the library set it may read, the default
        context of hybrid-retrieval.md's Berechtigungs-Leitplanken (d) - plus whether the calling
        administrator may choose the person context at all. The person context needs the separately
        granted "Sicht als" befugnis (#1052); holding SYSTEM_ADMIN confers nothing here, so the
        answer is a property of the caller and not of their role. No person is listed: the target of
        a person context is named by id, never picked from a directory this page would have to
        expose.
      responses:
        "200":
          description: The profiles of the caller's own organization and their own person-context permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchDiagnosisContextResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/search/diagnosis:
    post:
      operationId: runSearchDiagnosis
      tags: [admin, search]
      summary: >
        Run a test question through the retrieval pipeline and return its explanation protocol
        (system admin only, #1053, hybrid-retrieval.md "Das Diagnosewerkzeug")
      description: >
        Answers "why does this document not appear?" from the pipeline's own Erklärprotokoll
        (#1046) - not from a reconstruction: every stage in the response is one the pipeline
        actually ran, in the order it ran them. Three invariants hold, all of them Baubedingung
        rather than Ausbaustufe (hybrid-retrieval.md, Berechtigungs-Leitplanken): the run never
        reads an existing chat, it answers the Jetzt-Zustand only and is no
        Zugriffshistorien-Nachweis, and it applies a permission filter like every other search - it
        sets that filter differently, it never omits it. No answer is generated; the run stops
        after retrieval.


        The person context (contextType USER, #1150) runs through ForeignDiagnosticContextService
        and through nothing else: befugnis, mandatory justification, subtraction of
        diagnosegesperrte libraries and the protocol entry happen in that one call. Without the
        befugnis the answer is 403, whatever the caller's role. The result of such a run is
        returned once and stored nowhere (Leitplanke (j)).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchDiagnosisRequest"
      responses:
        "200":
          description: The stage-by-stage protocol of this run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchDiagnosisResponse"
        "400":
