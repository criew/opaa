        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: updateLibrary
      tags: [library]
      summary: Update library name, description, visibility and listed flag (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryUpdateRequest"
      responses:
        "200":
          description: Library updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: deleteLibrary
      tags: [library]
      summary: >
        Delete a library (owner only). A non-empty UPLOAD
        library is rejected with 409 (documents must be removed individually first). A non-empty
        connector library (FILESYSTEM/HTTP_DIRECTORY/RSS_FEED) is deleted together with its
        documents and vector store chunks - deleting individual connector documents would be
        undone by the next indexing run (ADR-0018, Entscheidung 5). The delete is also rejected
        with 409 while an indexing run for the library is RUNNING.
      responses:
        "204":
          description: Library deleted
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/libraries/{libraryId}/documents:
    parameters:
      - name: libraryId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: listLibraryDocuments
      tags: [library]
      summary: >
        List documents contained in a library, paged and optionally filtered by a case-insensitive
        substring of the file name (#517). Available for every sourceType, not just UPLOAD - a
        connector library's indexed bestand is just as visible here. Ordered by fileName ascending,
        id ascending as a tiebreaker - a deterministic total order, not just "ascending fileName":
        without it, LIMIT/OFFSET across two separate requests (e.g. two pages fetched moments
        apart, or the same page re-polled while indexing concurrently updates a row) has no
        guaranteed stable result in PostgreSQL and could return a document twice or skip it.

        **Folder-aware since #821 (Epic #520 Phase 2, ADR-0020).** Without q, the response is
        scoped to exactly one folder level: folderId (or its absence, meaning the library's root)
        selects which documents items contains, plus that folder's direct subfolders (folders) and
        its breadcrumb chain (breadcrumb, empty at the root). With q, the search is deliberately
        bibliotheksweit regardless of folderId for scoping/filtering (ADR-0020, Entscheidung 4 - no
        folder-scoped retrieval/search yet): folders and breadcrumb are both empty, and every hit's
        own folderId/folderPath (LibraryDocumentResponse) show where it lives in the structure. A
        folderId is nevertheless always validated when given, with or without q - see that
        parameter's own description.

        **Backward compatibility:** a caller that omits folderId - every client before #821 - lists
        the library's root (documents with no folder plus the library's root-level subfolders), not
        the library's full bestand across all folders the way this endpoint used to behave before
        folders existed at all. This is a deliberate, accepted behaviour change: folders can only
        exist through the CRUD API #820 added, so no pre-#821 library has any folder yet, and this
        endpoint's root-only response is therefore identical to its pre-#821 one until someone
        creates a folder and uploads into it - at which point browsing into that folder is exactly
        what folderId is for (frontend navigation follows in #822).

        **Attachment-aware since #1184 (ADR-0022, Entscheidung 5).** Documents carrying a
        parentDocumentId (attachments of a mail, an RSS entry, ...) are never paged, sorted or
        counted independently: page/size/totalElements and the fileName order all operate on
        top-level documents only, and each returned top-level document brings its complete
        (transitive) attachment subtree along on the same page, in file_path order. A q search
        additionally matches attachment file names: a hit on an attachment returns its top-level
        parent (with all its attachments), so the group stays visible.
      parameters:
        - name: page
          in: query
          required: false
          description: Rejected with 400 if negative.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: Rejected with 400 outside 1..100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: q
          in: query
          required: false
          description: >
            Case-insensitive substring match against the document's file name, searched across the
            whole library regardless of folderId (#821). Also matches attachment file names: a hit
            on an attachment surfaces its top-level parent document together with all of that
            parent's attachments (#1184).
          schema:
            type: string
        - name: folderId
          in: query
          required: false
          description: >
            The folder to list (#821). Omitted or null means the library's root. When q is also
            set, folderId is ignored for scoping/filtering - search is always bibliotheksweit - but
            is still validated: it must reference an existing folder in this library whether or not
            q is set, or the request is rejected with 404 - the same "unknown vs. foreign folder"
            treatment GET /api/v1/libraries/{libraryId}/folders/{folderId} already applies.
          schema:
            type: string
            format: uuid
        - name: missingMetadataField
          in: query
          required: false
          description: >
            The Pflege-Anker's list (#1069): a core field key (title, document_type, document_date)
            narrowing the response to exactly the indexed documents that have no value for it - the
            documents GET /api/v1/libraries/{libraryId}/metadata/maintenance counts. A field marked
            "kein Wert ermittelbar" is not listed, which is what lets the list be emptied. Like q,
            the filter is bibliotheksweit (folders and breadcrumb are empty, folderId does not
            scope it) and combines with q. Unlike every other listing, it pages over document rows
            rather than top-level documents: an attachment without a value is an entry of its own
            and no document with a value is ever returned, so totalElements equals the anchor's
            number and a Sammelzuweisung over the whole page cannot overwrite a maintained value.
            An unknown field key is rejected with 400.
          schema:
            type: string
            example: document_date
      responses:
        "200":
          description: Page of documents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryDocumentPageResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      operationId: uploadLibraryDocument
      tags: [library]
      summary: >
        Upload a document into a library (EDITOR role or above required). Only accepted for
        libraries with sourceType UPLOAD - a connector library (FILESYSTEM/HTTP_DIRECTORY/
        RSS_FEED) rejects the upload with 409 (ADR-0018, #479). The file is validated, stored and
        the document row created with status PENDING before this call returns (#434) - parsing
        (Tika) and embedding run afterwards, asynchronously, through the same executor
        infrastructure the directory/URL indexing paths use. Poll GET on this library's document
        list to observe the transition to INDEXED or FAILED (errorMessage set on failure).
        Malware scanning is explicitly out of scope - see #420.

        **folderId (#821, Epic #520 Phase 2, ADR-0020):** optional; omitted or null uploads into
        the library's root, mirroring GET on this same path. When set, it must reference an
        existing folder in this library, or the request is rejected with 404 - the same
        unknown/foreign-folder treatment the folder CRUD endpoints already apply.

        **folderPath (#823, Epic #520 Phase 4):** optional, relative to folderId (e.g.
        "Protokolle/2026"). Intermediate folders are created idempotently - an existing folder of
        the same name at the same level is reused, never duplicated - letting a whole
        drag-and-dropped or webkitdirectory-selected folder tree be uploaded one file at a time
        while ending up under a single, shared folder chain. Each path segment is validated like a
        folder name (trimmed, length limit, no path separator, no ".."); an invalid segment or a
        depth overrun is rejected with 400 before any byte of this file is stored. Only accepted
        for UPLOAD libraries, like folderId itself.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                folderId:
                  type: string
                  format: uuid
                  nullable: true
                  description: >
                    The folder to upload into (#821). Omitted or null means the library's root.
                folderPath:
                  type: string
                  nullable: true
                  description: >
                    A path relative to folderId whose intermediate folders are created idempotently
                    (#823). Omitted or blank means no additional path - upload directly into
                    folderId (or the library's root).
      responses:
        "201":
          description: >
            Document row created with status PENDING - parsing and embedding are still running
            asynchronously.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryDocumentResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  /api/v1/libraries/{libraryId}/documents/{documentId}:
    parameters:
      - name: libraryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    delete:
      operationId: deleteLibraryDocument
      tags: [library]
      summary: >
        Remove a document from a library (EDITOR role or above required): the document row, its
        chunks in the vector store, and the stored file.
      responses:
        "204":
          description: Document deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/libraries/{libraryId}/metadata/maintenance:
    parameters:
      - name: libraryId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: getLibraryMetadataMaintenance
      tags: [library]
      summary: >
        The Pflege-Anker of a library (#1069, metadata-schema.md "Der Pflege-Anker"): per core
        field, how many of the library's indexed documents have no value - absolute and as a share
        of the bestand. Only the empty state counts; a field marked "kein Wert ermittelbar" is
        done, which is what lets the number reach zero. The figures are counted on every request in
        the rights context of the asking person and never precomputed or cached
        (metadata-schema.md, Rechte-Invariante) - reading needs VIEWER on the library, correcting a
        value keeps the EDITOR right of #1068. GET
        /api/v1/libraries/{libraryId}/documents?missingMetadataField=... lists exactly the counted
        documents. A library of another organization or one the caller holds no right on is absent
        (404).
      responses:
        "200":
          description: The anchor per core field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryMetadataMaintenanceResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/libraries/{libraryId}/documents/{documentId}/metadata:
    parameters:
      - name: libraryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: getDocumentMetadata
      tags: [library]
      summary: >
        The core metadata fields of one document with the provenance of every value
        (docs/features/metadata-schema.md, "Jeder Wert trägt seine Herkunft"; #1068). Every core
        field is listed, an empty one with value null. Readable by everyone who may see the
        library's document list (VIEWER or above); a document of another library or a library of
        another organization is absent (404).
      responses:
        "200":
          description: The document's core fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentMetadataResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/libraries/{libraryId}/documents/{documentId}/metadata/{fieldKey}:
    parameters:
      - name: libraryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: fieldKey
        in: path
        required: true
        description: One of the core field keys title, document_type or document_date.
        schema:
          type: string
          example: document_type

    put:
      operationId: setDocumentMetadataValue
      tags: [library]
      summary: >
        Set or change one core field of a document by hand (#1068, metadata-schema.md "Manuelle
        Korrektur ist Teil des ersten Schnitts"). The stored value carries origin MANUAL, the
        calling person as actor and the time of the call; no automatic extraction ever overwrites
        it afterwards. The filterable keys on the document's chunks are rewritten in the same
        transaction, without re-embedding. Requires the right to edit the library's documents
        (EDITOR or above) - no management right at the library. Every call that changes something
        writes one audit event (DOCUMENT_METADATA_CHANGED) with the old and the new value; an
        identical manual value already in place changes nothing and writes no event. Validation:
        a Dokumentart outside the vocabulary, a title that is blank, a date without precision or a
        value of the wrong kind for the field are rejected with 400. The third state "kein Wert
        ermittelbar" (#1069) is set through this same operation, with state NOT_DETERMINABLE and no
        value.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetadataValueRequest"
      responses:
        "200":
          description: The field after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentMetadataFieldResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: deleteDocumentMetadataValue
      tags: [library]
      summary: >
        Remove the stored value of one core field (#1068). Removes the row whatever its origin, so
        the field is empty again and the next automatic extraction may fill it: the document's
        extraction version is cleared in the same transaction, which hands it back to the
        Bestandslauf (POST /api/v1/admin/indexing/metadata-backfill) - a lasting "there is no
        value" is the third state (PUT with state NOT_DETERMINABLE), not a deletion. Deleting a
        NOT_DETERMINABLE mark works the same way and puts the document back into the Pflege-Anker. Same right as setting a value (EDITOR
        or above); writes one audit event carrying the removed value. Deleting an already empty
        field is a no-op that writes no event.
      responses:
        "204":
          description: Value removed (or already absent)
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/libraries/{libraryId}/documents/metadata/bulk:
    parameters:
      - name: libraryId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      operationId: bulkSetDocumentMetadata
      tags: [library]
      summary: >
        Set one field to one value on a chosen set of this library's documents (#1068,
        metadata-schema.md "Sammelzuweisung auf einer Auswahl"). Same right and same validation as
        the single-document PUT; every document gets its own MANUAL value, its own chunk rewrite
        and its own audit event with old and new value - the events of one call share a
        correlationRef, returned in the response. An id that is not a document of this library
        (deleted meanwhile, or belonging to another library) is rejected and listed in
        rejectedDocumentIds - never silently skipped - while the remaining documents are still
        processed; the whole call is one transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkMetadataValueRequest"
      responses:
        "200":
          description: Counters of the bulk assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkMetadataValueResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/metadata/document-types:
    get:
      operationId: listDocumentTypes
      tags: [library]
      summary: >
        The controlled Dokumentart vocabulary (ADR-0024, Entscheidung 3) in display order - the
        choice list a client offers when a person sets the field. Schema, not an aggregate over
        documents: the list exists independently of any document and is visible to every
        authenticated user (metadata-schema.md, Rechte-Invariante: "Die konfigurierte Werteliste
        ... ist von dieser Regel ausgenommen").
      responses:
        "200":
          description: The vocabulary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentTypeVocabularyResponse"

  /api/v1/libraries/{libraryId}/folders:
    parameters:
      - name: libraryId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      operationId: createLibraryFolder
      tags: [library]
      summary: >
        Create a folder in a library (EDITOR role or above required), optionally nested under an
        existing folder (#820, ADR-0020: library_folders is a real entity so an empty folder can
        exist before any document is uploaded into it). Only accepted for libraries with sourceType
        UPLOAD - a connector library (FILESYSTEM/HTTP_DIRECTORY/RSS_FEED) rejects folder creation
        with 409, mirroring the same restriction POST .../documents already applies (ADR-0018,
        #479); FILESYSTEM's own read-only folder mapping is a later, separate task (#824). A name
        that already exists on the same level (same parentFolderId, including two root-level
        folders) is rejected with 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryFolderRequest"
      responses:
        "201":
          description: Folder created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryFolderResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/libraries/{libraryId}/folders/{folderId}:
    parameters:
      - name: libraryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: folderId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: getLibraryFolder
      tags: [library]
      summary: >
        Fetch a single folder (VIEWER role or above required), including the total number of
        documents it and its subfolders contain (#820) - the count a confirmation dialog shows
        before a recursive delete (ADR-0020, Entscheidung 5).
      responses:
        "200":
          description: The folder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryFolderResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      operationId: renameLibraryFolder
      tags: [library]
      summary: >
        Rename a folder (EDITOR role or above required, #820). Only the name changes; documents in
        the folder and its subfolders are unaffected, their display path is derived from the
        current folder chain. A name that already exists on the same level is rejected with 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryFolderRenameRequest"
      responses:
        "200":
          description: Folder renamed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryFolderResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

    delete:
      operationId: deleteLibraryFolder
      tags: [library]
      summary: >
        Delete a folder (EDITOR role or above required, #820), recursively removing its subfolders
        and every document they contain. Document cleanup (chunks, stored file) runs through the
        same application service DELETE /api/v1/libraries/{libraryId}/documents/{documentId}
        already uses, never a database cascade (ADR-0020, Entscheidung 5) - the frontend shows the
        affected document count from GET on this folder first and requires explicit confirmation
        before calling this endpoint.
      responses:
        "204":
          description: Folder (and its contained subfolders/documents) deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/documents/{documentId}/content:
    parameters:
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: getDocumentContent
      tags: [library]
      summary: >
        Stream the original file behind an indexed document (#736), so a search result or library
        listing can link straight to the source it was built from. Called as an authenticated API
        request (Bearer token, like every other endpoint here per ADR-0005) rather than a direct
        browser navigation - a plain <a href> deep link has no way to attach that token, so a caller
        wanting an inline preview fetches this endpoint and renders the response itself (e.g. as a
        Blob URL); see #738/#739 for that client-side piece. The library owning the document is
        resolved from Document.libraryId; VIEWER role or above on that library is required, the same
        floor GET /api/v1/libraries/{libraryId} itself uses. sourceType UPLOAD/FILESYSTEM stream a
        local file directly; HTTP_DIRECTORY/RSS_FEED are proxied server-side from the document's own
        stored source URL instead (#747) - this closes the gap where that source is only reachable
        from OPAA's own network (an internal fileserver/intranet site, the common case in a Behörde),
        never from the caller's browser. The proxy re-validates the target address against the same
        allowlist (#267) applied at indexing time, follows a redirect only within the same origin,
        validates the configured proxy host the same way, applies the library's own stored
        proxy/credentials to the outbound request without ever exposing them in the response, and
        streams the response directly to the caller (no temp file) bounded by its own, smaller size
        limit and request timeout than a background indexing run uses. Answered with
        Content-Disposition: inline and the file's original name/content type (the document's own
        stored content type first, the proxied response's own declared type - normalized, no
        parameters - only as a fallback), so a client can render it inline instead of forcing a
        download. A document from another organization, without a
        library grant, of an unsupported sourceType, whose local file has since been moved or deleted
        on disk, or whose remote source is unreachable/rejected are all answered with the same 404 -
        no response here reveals whether a given documentId exists, nor whether "not found" means
        "no such document" or "source currently unreachable". There is no 403: VIEWER is the lowest
        AssetRole, so any grant at all already satisfies this floor - a caller either clears it or
        has no grant, which is the 404 case above. 429 is answered when this endpoint is under
        load: either by its own rate limit, or - for an attachment document, whose bytes are
        re-extracted from its parent original on every read (ADR-0022, #1243) - when too many such
        re-extractions are already running. Both carry a German message and may be retried.
      responses:
        "200":
          description: The original file's bytes
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/libraries/{libraryId}/grants:
    parameters:
      - name: libraryId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: listAssetGrants
      tags: [library]
      summary: >
        List the grants on a library (MANAGER role or above required). See
        docs/features/spaces-and-assets.md#asset-rollen.
      responses:
        "200":
          description: List of grants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssetGrantResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      operationId: upsertAssetGrant
      tags: [library]
      summary: >
        Grant (or update the role of) a user or group on a library (MANAGER role or above
        required). Idempotent per subject: submitting again for the same subject replaces its role
        and expiry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetGrantRequest"
      responses:
        "200":
          description: Grant created or updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetGrantResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/libraries/{libraryId}/grants/{grantId}:
    parameters:
      - name: libraryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: grantId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    delete:
      operationId: revokeAssetGrant
      tags: [library]
      summary: Revoke a grant (MANAGER role or above required). Takes effect on the next query.
      responses:
        "204":
          description: Grant revoked
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/libraries/{libraryId}/indexing:
    parameters:
      - name: libraryId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      operationId: triggerLibraryIndexing
      tags: [library, indexing]
      summary: Trigger an indexing run for a library, using its own stored quellkonfiguration
      description: >
        ADR-0018: a library carries at most one quellentyp and quellkonfiguration, so the
        trigger no longer takes any request body - it reads sourceType/sourcePath/sourceUrl/
        sourceProxy/sourceCredentials/sourceInsecureSsl from the library itself and resolves
        the matching executor through the registry (ADR-0017, decision 3). EDITOR role or
        above on the library is required (the former SYSTEM_ADMIN requirement is gone -
        ADR-0018, Entscheidung 2). A library whose sourceType is UPLOAD has no run at all
        and is rejected with 409, as is a second trigger while a run for this same library is
        still in progress - concurrency is per library, not global (#478). A full
        indexingTaskExecutor queue is rejected with 503 (#501) - the just-inserted job row is
        failed immediately rather than left RUNNING with nothing left to ever complete it.
      responses:
        "202":
          description: Indexing triggered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexingStatusResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/libraries/{libraryId}/indexing/status:
    parameters:
      - name: libraryId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: getLibraryIndexingStatus
      tags: [library, indexing]
      summary: Get the current or most recently completed indexing status for a library
      responses:
        "200":
          description: Current indexing status for this library, or IDLE if it never ran
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexingStatusResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/libraries/{libraryId}/indexing/runs:
    parameters:
      - name: libraryId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: listLibraryIndexingRuns
      tags: [library, indexing]
      summary: >
        The last 10 indexing runs for a library, each with its own protocol of skipped/rejected
        items and errors (#513).
      description: >
        Requires MANAGER role or above on the library (PR #604 review, finding 1) - stricter than
        GET .../indexing/status's plain read grant, since an event's reference routinely carries
        the library's own sourcePath/sourceUrl, the same internal-path leak #507 exists to close
        for the source configuration display itself. Runs are ordered newest first; older runs
        (beyond the last 10 for this library) are pruned together with their events, mirroring
        indexing_jobs' own existing retention (IndexingJobService). Every run's event list is
        capped (IndexingRunEventRecorder) - eventsTruncatedCount on a run names how many further
        events that run recorded beyond the cap, without listing them.
      responses:
        "200":
          description: The last 10 runs for this library, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexingRunListResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/libraries/{libraryId}/spaces:
    parameters:
      - name: libraryId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: listLibrarySpaceAssociations
      tags: [library, space]
      summary: >
        Every space this library is associated with (MANAGER role or above on the library
        required) - the owner-facing "bereitgestellt in" view (#203). Unlike GET
        /v1/spaces/{spaceId}/libraries, this is never filtered - the owner sees every association,
        regardless of whether they themselves are a member of the space.
      description: >
        docs/features/spaces-and-assets.md#assets-in-einen-space-assoziieren: "Der Eigentümer des
        Assets sieht alle Assoziationen und kann jede davon jederzeit einseitig lösen."
        narrowerReaderCircle on each entry is the same "not every member can already read this"
        signal that triggers the owner notification when the association was created (#203) -
        recomputed live here, not stored, since space membership and library grants both change
        independently afterwards.
      responses:
        "200":
          description: Every association of this library, across all spaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LibrarySpaceAssociationResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/spaces/{spaceId}/libraries:
    parameters:
      - name: spaceId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: listSpaceLibraryAssociations
      tags: [space, library]
      summary: >
        The libraries associated with this space. For a plain MEMBER, filtered to what they may
        themselves read (#203 acceptance criterion "two members with different grants see
        different asset lists"). For a CURATOR, ADMIN or the space owner, unfiltered - every
        association is listed so they can also detach one they cannot themselves read (review
        finding on #706: a manager must be able to see and undo an over-broad association even
        without a personal grant on the library). Requires space membership.
      description: >
        docs/features/spaces-and-assets.md#assets-in-einen-space-assoziieren. An association
        grants no access by itself - for a plain MEMBER, a library is listed only if they already
        have at least VIEWER on it through their own grants, a group grant, or organization-wide
        visibility. An entry the caller cannot read carries readableByCaller=false and no
        libraryName.
      responses:
        "200":
          description: Associated libraries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceLibraryAssociationListResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      operationId: associateSpaceLibrary
      tags: [space, library]
      summary: >
        Associates a library with this space (CURATOR role or above on the space required). The
        caller must themselves have at least VIEWER on the library - a CURATOR may only associate
        an asset they can already access themselves
        (docs/features/spaces-and-assets.md#assets-in-einen-space-assoziieren). Idempotent: an
        already-associated library returns its existing association unchanged.
      description: >
        If the space has any member without read access to the library, the library owner is
        actively notified (#203, "Benachrichtigung statt Zustimmung") - no consent required, the
        association takes effect immediately regardless.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpaceLibraryAssociationRequest"
      responses:
        "201":
          description: Association created (or already existed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceLibraryAssociationResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/spaces/{spaceId}/libraries/{libraryId}:
    parameters:
      - name: spaceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: libraryId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    delete:
      operationId: detachSpaceLibrary
      tags: [space, library]
      summary: >
        Removes the association (not the library itself). Allowed for a CURATOR or above on the
        space, or - unilaterally, regardless of their own space membership - for a MANAGER or
        above on the library itself
        (docs/features/spaces-and-assets.md#assets-in-einen-space-assoziieren: "Der Eigentümer des
        Assets ... kann jede davon jederzeit einseitig lösen").
      responses:
        "204":
          description: Association removed (or did not exist)
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/notifications:
    get:
      operationId: listNotifications
      tags: [notification]
      summary: The calling user's own notifications (#203), newest first, capped at limit.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Maximum number of notifications to return, newest first.
      responses:
        "200":
          description: The caller's notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationResponse"

  /api/v1/notifications/{notificationId}/read:
    parameters:
      - name: notificationId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      operationId: markNotificationRead
      tags: [notification]
      summary: Marks one of the caller's own notifications as read. Idempotent.
      responses:
        "204":
          description: Marked read (or already was)
        "404":
          $ref: "#/components/responses/NotFound"

  # #393: exactly four revision access paths, each with a mandatory time range and a bounded
  # result set - see docs/features/security-and-compliance.md#zugriffswege-was-es-gibt-und-was-es-nicht-gibt.
  # There is deliberately no `actor`/`actorRef` query parameter on any of them and no `sort`
  # parameter at all: actorRef is output-only, never an entry point (AUDITOR role only).
  /api/v1/audit/events/by-object:
    get:
      operationId: listAuditEventsByObject
      tags: [audit]
      summary: >
        Revision access path "nach Objekt" (AUDITOR role required): every event recorded against
        one object, within a mandatory time range. objectType=USER_ACCOUNT is rejected with 400
        (#393 code review, finding 2): a USER_ACCOUNT object's object_id is that person's
        pseudonym - the same pseudonym actorRef carries on that same person's own actions
        elsewhere in the log - so accepting it here would reconstruct exactly the excluded view
        "alle Ereignisse, bei denen Person X betroffen war" (read a pseudonym off actorRef via
        by-time-range, then feed it back in as objectId). The legitimate need behind a
        USER_ACCOUNT-scoped question is served by by-time-range/by-event-type (no person focus)
        or, for a genuinely person-scoped question, by the freigegebene anlassbezogene Klärung
        or the Rechtehistorie (#238) - never by this path.
      parameters:
        - name: objectType
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/AuditObjectType"
        - name: objectId
          in: query
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/AuditFrom"
        - $ref: "#/components/parameters/AuditTo"
        - $ref: "#/components/parameters/AuditPage"
        - $ref: "#/components/parameters/AuditSize"
        - $ref: "#/components/parameters/AuditReason"
      responses:
        "200":
          description: Bounded page of matching audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/audit/events/by-time-range:
    get:
      operationId: listAuditEventsByTimeRange
      tags: [audit]
      summary: >
        Revision access path "nach Zeitraum" (AUDITOR role required): every event recorded within
        a mandatory time range, regardless of object.
      parameters:
        - $ref: "#/components/parameters/AuditFrom"
        - $ref: "#/components/parameters/AuditTo"
        - $ref: "#/components/parameters/AuditPage"
        - $ref: "#/components/parameters/AuditSize"
        - $ref: "#/components/parameters/AuditReason"
      responses:
        "200":
          description: Bounded page of matching audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/audit/events/by-event-type:
    get:
      operationId: listAuditEventsByEventType
      tags: [audit]
      summary: >
        Revision access path "nach Ereignisart" (AUDITOR role required): every event of one type,
        within a mandatory time range.
      parameters:
        - name: eventType
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/AuditEventType"
        - $ref: "#/components/parameters/AuditFrom"
        - $ref: "#/components/parameters/AuditTo"
        - $ref: "#/components/parameters/AuditPage"
        - $ref: "#/components/parameters/AuditSize"
        - $ref: "#/components/parameters/AuditReason"
      responses:
        "200":
          description: Bounded page of matching audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/audit/events/by-correlation:
    get:
      operationId: listAuditEventsByCorrelation
      tags: [audit]
      summary: >
        Revision access path "nach Vorgang" (AUDITOR role required): every event sharing one
        correlation_ref (e.g. one directory sync run), within a mandatory time range.
      parameters:
        - name: correlationRef
          in: query
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/AuditFrom"
        - $ref: "#/components/parameters/AuditTo"
        - $ref: "#/components/parameters/AuditPage"
        - $ref: "#/components/parameters/AuditSize"
        - $ref: "#/components/parameters/AuditReason"
      responses:
        "200":
          description: Bounded page of matching audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/audit/incident-scopes:
    post:
      operationId: requestAuditIncidentScope
      tags: [audit]
      summary: >
        Requests the one exception to "kein Personenfilter" - the anlassbezogene Klärung
        (AUDITOR role required): names person, time range and purpose in advance. Created PENDING;
        unusable for querying until a second, different AUDITOR approves it via the approve
        endpoint (Vier-Augen-Prinzip).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditIncidentScopeRequest"
      responses:
        "201":
          description: Incident scope requested, awaiting approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditIncidentScopeResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/audit/incident-scopes/{scopeId}/approve:
    parameters:
      - name: scopeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: approveAuditIncidentScope
      tags: [audit]
      summary: >
        Approves a requested incident scope (AUDITOR role required). Rejected if the approver is
        the same person as the requester (Selbstfreigabe) or the scope was already approved.
      responses:
        "200":
          description: Incident scope approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditIncidentScopeResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/audit/incident-scopes/{scopeId}/events:
    parameters:
      - name: scopeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listAuditEventsByIncidentScope
      tags: [audit]
      summary: >
        The one personenbezogene query path (AUDITOR role required): every event whose actor is
        the scope's named person, technically bounded to the approved scope's person and time
        range. Not callable before approval; a requested from/to outside the approved scope's time
        range is rejected rather than silently clamped.
      parameters:
        - $ref: "#/components/parameters/AuditFrom"
        - $ref: "#/components/parameters/AuditTo"
        - $ref: "#/components/parameters/AuditPage"
        - $ref: "#/components/parameters/AuditSize"
        - $ref: "#/components/parameters/AuditReason"
      responses:
        "200":
          description: Bounded page of matching audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/diagnostic-impersonation-grants:
    get:
      operationId: listDiagnosticImpersonationGrants
      tags: [admin]
      summary: >
        Lists the granted "Sicht als" befugnisse of the caller's organization (system admin only).
        Granting the befugnis and holding it are separate acts - a system admin sees this list but
        derives no befugnis of their own from it.
      responses:
        "200":
          description: Granted befugnisse, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticImpersonationGrantListResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: grantDiagnosticImpersonation
      tags: [admin]
      summary: >
        Grants the "Sicht als" befugnis (system admin only). Scope (an ORG_UNIT group) and validity
        window are mandatory and the window may not exceed twelve months - an unbounded, scopeless
        permanent right is not representable, at the database level as well.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiagnosticImpersonationGrantRequest"
      responses:
        "201":
          description: Befugnis granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticImpersonationGrantResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/diagnostic-impersonation-grants/{grantId}:
    parameters:
      - name: grantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: revokeDiagnosticImpersonation
      tags: [admin]
      summary: Revokes a "Sicht als" befugnis before its own expiry (system admin only).
      responses:
        "200":
          description: Befugnis revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticImpersonationGrantResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/diagnostic-context/retention:
    get:
      operationId: getDiagnosticContextRetention
      tags: [admin]
      summary: >
        Reads the retention period of the diagnostic context protocol (system admin only). Twelve
        months by default, configurable between 1 and 24; there is no field to switch the deletion
        off, here or anywhere else.
      responses:
        "200":
          description: Current retention configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticContextRetentionResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: updateDiagnosticContextRetention
      tags: [admin]
      summary: Changes the retention period of the diagnostic context protocol (system admin only).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiagnosticContextRetentionRequest"
      responses:
        "200":
          description: Retention configuration updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticContextRetentionResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/libraries/{libraryId}/diagnostics-lock:
    parameters:
      - name: libraryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: setLibraryDiagnosticsLock
      tags: [libraries]
      summary: >
        Sets or lifts a library's Diagnosesperre. It takes an OWNER grant on that library which the
        caller did not issue to themselves - being a system admin confers nothing here, and neither
        does an OWNER grant an admin issued to themselves through the administrative floor of the
        grant endpoint, whether newly created or raised from a pre-existing foreign grant; all of
        these are rejected with 403. Every library is locked by default, including all pre-existing
        ones.

        What remains possible, stated plainly and without the claim that it takes a second person:
        an admin can grant OWNER to a different, named account, whose use of this endpoint is
        audited in turn - and, where the library is owned by a group that is not an ORG_UNIT, an
        admin can add themselves to that owning group via POST /api/v1/groups/{groupId}/members,
        which makes them the library's named responsible body and lets them lift the lock alone.
        Group administration has no self-exclusion, and that stays so by decision rather than by
        omission (docs/features/hybrid-retrieval.md, Berechtigungs-Leitplanken (e)): both steps are
        audited. The library's named owner user, in contrast, is immutable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryDiagnosticsLockRequest"
      responses:
        "200":
          description: Diagnosesperre updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryDiagnosticsLockResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/me/diagnostic-context-events:
    get:
      operationId: listOwnDiagnosticContextEvents
      tags: [me]
      summary: >
        Einsichtsrecht: when and by whom the caller's own rights context was assumed for a search
        diagnosis. No role, no reason and no approval - the filter is the caller's own identity,
        resolved server-side, and no parameter names a person.
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 50
      responses:
        "200":
          description: The caller's own entries, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnDiagnosticContextEventPage"

  /api/v1/audit/diagnostic-context-events:
    get:
      operationId: listDiagnosticContextEvents
      tags: [audit]
      summary: >
        The Gesamtprotokoll of diagnoses run in a foreign rights context (AUDITOR role required -
        Datenschutzbeauftragte und Personalvertretung; Fachvorgesetzte hold USER or SYSTEM_ADMIN and
        reach nothing here). Requires a reason and a time range of at most 31 days, because the
        evaluation is einzelfall- und anlassbezogen. There is deliberately no parameter naming a
        target person and no aggregate response field: "Diagnosen je Nutzer" is not restricted here,
        it is not expressible.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: reason
          in: query
          required: true
          description: >
            Mandatory Anlass; a missing one is rejected, and the rejected attempt is itself recorded
            in audit_log.
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 50
      responses:
        "200":
          description: Bounded page of protocol entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticContextEventPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/audit/diagnostic-context-events/{eventId}:
    parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getDiagnosticContextEvent
      tags: [audit]
      summary: >
        One already-known protocol entry, named by its own event id - the einzelfall- und
        anlassbezogene Auswertung of Leitplanke (g), and the only place the rights snapshot of an
        entry is published. Same bar as the Gesamtprotokoll: AUDITOR role and a mandatory reason,
        and every call - accepted or rejected, including one naming an unreadable id - is itself
        recorded in audit_log with that reason. This path names no person either: an event id has
        to be known from the list before it can be asked for. What it does not do is make a
        per-person evaluation impossible - an auditor can fetch a page's entries one by one and
        group them by their rights snapshot; it makes every one of those fetches carry its own
        Anlass and its own audit_log entry.
      parameters:
        - name: reason
          in: query
          required: true
          description: >
            Mandatory Anlass for this single entry; a missing one is rejected, and the rejected
            attempt is itself recorded in audit_log.
          schema:
            type: string
      responses:
        "200":
          description: The single protocol entry, including its rights snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticContextEventDetailResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/branding:
    get:
      operationId: getBranding
      tags: [branding]
      summary: >
        The branding configuration in effect (#582): product name, claim, accent colour, default
        colour scheme and - if one is configured - the path the logo is served from. Readable
        without authentication (#583): the sign-in page renders before there is a session and still
        has to carry the operator's own name and logo. What that exposes is bounded to exactly
        these fields - which Behörde runs the deployment, which anyone reaching its sign-in page
        can already tell. Never fails for want of configuration - a deployment that has never configured anything gets the OPAA
        defaults, each field resolved individually, so an operator who only sets a logo keeps the
        standard product name.
      responses:
        "200":
          description: Effective branding configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingResponse"

  /api/v1/branding/logo:
    get:
      operationId: getBrandingLogo
      tags: [branding]
      summary: >
        The configured logo's bytes, served with the content type the server itself detected at
        upload time - never one the uploader declared (#582: "Content-Type beim Ausliefern
        erzwingen"). Readable without authentication, for the same reason and with the same bounds
        as GET /api/v1/branding above. Answered with 404 while no logo is configured; clients read
        BrandingResponse.logoUrl rather than calling this unconditionally. The response carries
        X-Content-Type-Options and a restrictive Content-Security-Policy so a browser can never
        be talked into treating the bytes as anything but an image.
      responses:
        "200":
          description: Logo bytes
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/system/branding:
    put:
      operationId: updateBranding
      tags: [branding]
      summary: >
        Replace the branding configuration (SYSTEM_ADMIN only, #582). A full replacement, as PUT
        implies: an omitted or null field is not "leave as is" but "back to the OPAA default", so
        an operator can undo a customisation without a dedicated reset endpoint. The logo is not
        part of this request - it has its own endpoints below, because a binary upload and a JSON
        settings edit have nothing to gain from being welded into one multipart request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandingUpdateRequest"
      responses:
        "200":
          description: Branding updated; the effective configuration afterwards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/system/branding/logo:
    put:
      operationId: updateBrandingLogo
      tags: [branding]
      summary: >
        Upload the operator's logo (SYSTEM_ADMIN only, #582). Accepts PNG and JPEG only -
        SVG is rejected outright rather than sanitised, because an SVG is a document that can
        carry script and a sanitiser that is wrong once is worse than a format restriction that
        is inconvenient always (#582 explicitly allows either). The declared content type is not
        trusted: the actual bytes are inspected, and a mismatch is rejected.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Logo stored; the effective configuration afterwards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
    delete:
      operationId: deleteBrandingLogo
      tags: [branding]
      summary: >
        Remove the configured logo (SYSTEM_ADMIN only, #582) - the app falls back to the OPAA
        standard logo. Idempotent: removing a logo that is not there succeeds.
      responses:
        "200":
          description: Logo removed; the effective configuration afterwards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: UP

    AuthConfigResponse:
      type: object
      properties:
        mode:
          type: string
          description: Active authentication mode; "oidc" in production, "dev" for local development and tests
          example: oidc
        authority:
          type: string
          nullable: true
        clientId:
          type: string
          nullable: true

    UserInfoResponse:
      type: object
      required: [id, email, displayName, systemRole]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          nullable: true
        displayName:
          type: string
          nullable: true
        systemRole:
          type: string
          example: USER

    UserSummaryResponse:
      type: object
      description: >
        Deliberately narrower than UserInfoResponse (no systemRole) - GET /v1/users (#777) reaches
        every authenticated user in the organization, not just SYSTEM_ADMIN, so it exposes only
        what a member/grant picker needs to let a caller find someone by name or email.
      required: [id, email, displayName]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          nullable: true
        displayName:
          type: string
          nullable: true

    RoleChangeRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/SystemRole"

    SystemRole:
      type: string
      description: >
        AUDITOR (#393) grants read access to the revision access paths in io.opaa.audit and
        nothing else - it carries none of SYSTEM_ADMIN's administrative privileges.
      enum: [USER, SYSTEM_ADMIN, AUDITOR]
      example: USER

    IndexingStatusResponse:
      type: object
      required:
        [
          status,
          documentCount,
          totalDocuments,
          documentsSkipped,
          documentsFailed,
          documentsIndexedTotal,
          timestamp,
        ]
      properties:
        status:
          $ref: "#/components/schemas/IndexingStatus"
        documentCount:
          type: integer
          description: >
            The number of source items this run has processed. On an RSS_FEED run this counts feed
            entries, not indexed documents - an entry's detail page can carry additional attachment
            documents (#468) that are not counted here. See documentsIndexedTotal for the true
            document count.
          example: 42
        totalDocuments:
          type: integer
          example: 42
        documentsSkipped:
          type: integer
          example: 0
        documentsFailed:
          type: integer
          description: >
            The number of source items this run failed to process (#518 review, finding 3) -
            previously only visible inside the free-text message field, not as its own value the
            UI could name explicitly.
          example: 0
        documentsIndexedTotal:
          type: integer
          description: >
            The true count of documents this run has indexed (#518) - includes every attachment
            document indexed for an RSS_FEED entry (#468), including one backfilled for an
            otherwise-unchanged entry. Equals documentCount for FILESYSTEM/HTTP_DIRECTORY runs,
            where one processed file is exactly one document.
          example: 42
        message:
          type: string
          nullable: true
          description: >
            For status FAILED, the detail is only included if the caller holds at least MANAGER
            on the library (#507/#659) - the underlying exception message routinely repeats the
            library's own sourcePath/sourceUrl (an absolute server path or a host:port), the same
            internal-infrastructure leak #507 already closes for the source configuration display
            itself. A caller below MANAGER gets a generic German message instead.
          example: Indexing completed successfully
        libraryId:
          type: string
          format: uuid
          nullable: true
          description: >
            The knowledge library this run targets (#419). Null for a run started before
            migration 019 added the column, or once the run's target library has since been
            deleted (indexing_jobs.library_id is ON DELETE SET NULL - a run's history is not the
            same thing as its right to still write there, see IndexingJob#getLibraryId's Javadoc).
        timestamp:
          type: string
          format: date-time

    IndexingStatus:
      type: string
      enum: [IDLE, RUNNING, COMPLETED, FAILED]
      example: COMPLETED

    IndexingTriggerSource:
      type: string
      description: >
        Who started a run (#485): a person via "Jetzt indizieren", or the library's own schedule.
      enum: [MANUAL, SCHEDULED]
      example: MANUAL

    IndexingRunEventCategory:
      type: string
      description: >
        Why a single item was skipped/rejected or failed during a run, or - for FORMAT_MISMATCH,
        SCHEDULE_SKIPPED and REMOVED - a note that is not about the item's own outcome at all
        (#513, #404, #485, #886). Deliberately coarse (eight buckets, not one per exception type)
        so the category stays a stable, translatable label rather than growing a new value with
        every executor change:
          * REJECTED - the source itself declined to hand the item over (HTTP 403/429, a redirect
            to a foreign host that looks like a bot-protection challenge, an unsupported link
            scheme) - not a failure of OPAA's own processing.
          * UNREACHABLE - the item's network location could not be reached at all (connection
            failure, timeout, non-2xx status unrelated to a rejection above).
          * UNSUPPORTED_FORMAT - the item's file format or content type is not one
            SupportedDocumentFormats indexes.
          * ALLOWLIST - the run's own source configuration (e.g. a FILESYSTEM library's
            sourcePath) falls outside an operator-configured allowlist (#484).
          * ERROR - processing started but failed unexpectedly (parsing, chunking, embedding).
          * FORMAT_MISMATCH - the item's file extension did not match its detected content, but it
            was indexed anyway (#404) - a note about an accepted item, not a reason it was not
            counted among documentsSkipped/documentsFailed.
          * SCHEDULE_SKIPPED - a scheduled run (#485) found the library still indexing from a
            previous run and did not start a second one; recorded against the still-running job's
            own protocol, not a new run of its own.
          * REMOVED - a previously indexed document no longer exists at its source and was deleted
            at the end of a successful, complete run (#886, ADR-0017 Entscheidung 5) - like
            FORMAT_MISMATCH/SCHEDULE_SKIPPED, this does not count among documentsSkipped/
            documentsFailed either.
      enum:
        [
          REJECTED,
          UNREACHABLE,
          UNSUPPORTED_FORMAT,
          ALLOWLIST,
          ERROR,
          FORMAT_MISMATCH,
          SCHEDULE_SKIPPED,
          REMOVED,
        ]
      example: REJECTED

    IndexingRunEvent:
      type: object
      required: [category, message]
      properties:
        category:
          $ref: "#/components/schemas/IndexingRunEventCategory"
        message:
          type: string
          description: >
            A German, human-readable reason (#513) - never a raw challenge/redirect URL or
            exception stack trace, only what an operator needs to understand why the item was
            skipped.
          example: "Vom Quellserver abgewiesen (Weiterleitung auf einen fremden Host)"
        reference:
          type: string
          nullable: true
          description: >
            The affected document name, file path or source URL - never the raw challenge/
            redirect target a bot-protection page issued (#513 acceptance criteria).
          example: https://example.org/aktuelles/pressemitteilung-42
      example:
        category: REJECTED
        message: "Vom Quellserver abgewiesen (Weiterleitung auf einen fremden Host)"
        reference: https://example.org/aktuelles/pressemitteilung-42

    IndexingRunResponse:
      type: object
      required:
        [
          id,
          status,
          documentCount,
          totalDocuments,
          documentsSkipped,
          documentsFailed,
          documentsIndexedTotal,
          startedAt,
          events,
          eventsTruncatedCount,
          triggeredBy,
        ]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/IndexingStatus"
        triggeredBy:
          $ref: "#/components/schemas/IndexingTriggerSource"
        documentCount:
          type: integer
          example: 42
        totalDocuments:
          type: integer
          example: 42
        documentsSkipped:
          type: integer
          example: 0
        documentsFailed:
          type: integer
          example: 0
        documentsIndexedTotal:
          type: integer
          example: 42
        message:
          type: string
          nullable: true
          example: Indexing completed successfully
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        events:
          type: array
          description: >
            This run's protocol (#513), capped at 500 entries (IndexingRunEventRecorder) - see
            eventsTruncatedCount for how many further events beyond the cap this run recorded.
          items:
            $ref: "#/components/schemas/IndexingRunEvent"
        eventsTruncatedCount:
          type: integer
          description: >
            How many further events this run recorded beyond the 500-entry cap on the events
            list above (#513) - 0 when every event fit. The UI renders this as "… und N weitere".
          example: 0

    IndexingRunListResponse:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          description: The last 10 runs for this library, newest first (#513).
          items:
            $ref: "#/components/schemas/IndexingRunResponse"

    QueryRequest:
      type: object
      required: [question]
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: ".*\\S.*"
          example: What is the project architecture?
        chatId:
          type: string
          format: uuid
          nullable: true
          description: >
            The persisted chat (#525) this question and its answer belong to - the question,
            answer and sources are appended to it as ChatMessages, and the search scope for this
            query is taken from the chat's useKnowledge/referencedLibraryIds settings rather than
            useKnowledge/libraryIds below. Must be a chat the caller authored (see POST
            /api/v1/spaces/{spaceId}/chats) or the request runs ephemerally instead of being
            rejected, exactly as if chatId had been omitted (see useKnowledge below) - not
            persisted, and remembered only for the lifetime of the in-memory conversation cache
            keyed by the returned chatId.
        useKnowledge:
          type: boolean
          nullable: true
          default: true
          description: >
            Ignored when chatId names a chat the caller authored - that chat's own useKnowledge
            setting applies instead (#525). Otherwise (#526): whether the query searches the
            knowledge base at all. When true (the default), the search scope is every knowledge
            library the caller may read; libraryIds is ignored in this mode. When false, the
            search scope is libraryIds narrowed to the libraries the caller may read - never
            widened beyond it - and an empty (or entirely unreadable) libraryIds performs no
            retrieval at all, see QueryMetadata.answeredWithoutKnowledge.
        libraryIds:
          type: array
          items:
            type: string
            format: uuid
          description: >
            Ignored when chatId names a chat the caller authored - that chat's own sticky
            @-references apply instead (#525). Otherwise (#526): knowledge libraries explicitly
            referenced for the query. Only consulted when useKnowledge is false.

    QueryResponse:
      type: object
      required: [answer, sources, metadata, chatId]
      properties:
        answer:
          type: string
          example: The project uses a modular monolith architecture...
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceReference"
        metadata:
          $ref: "#/components/schemas/QueryMetadata"
        chatId:
          type: string
          format: uuid
          description: >
            The chat this turn was appended to, or - for an ephemeral query that supplied no
            chatId - a freshly generated id identifying only the in-memory conversation cache
            entry, not a persisted chat.
        chatTitle:
          type: string
          nullable: true
          description: >
            The persisted chat's current title immediately after this turn (#557), or null for an
            ephemeral query. On the very first turn this is still the mechanical prefix-of-the-
            question fallback, never the LLM-derived title: title generation runs asynchronously
            after the answer is returned, precisely so it can never delay this response - the
            frontend picks up the LLM-derived title (if generation succeeds) on a later reload of
            the chat, e.g. GET /chats/{chatId}.
          example: Rückstellung für Altlastensanierung

    SourceReference:
      type: object
      required: [fileName, relevanceScore, matchCount, cited]
      properties:
        fileName:
          type: string
          example: architecture-overview.md
        relevanceScore:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: >-
            Reciprocal of this source's 1-based position in this answer's sources array (1.0 for
            the first entry, 0.5 for the second) - not a similarity score, and counted per source,
            not per retrieved chunk, so a source contributing several chunks still occupies exactly
            one position. A raw score is not comparable across sources since a lexical-only chunk
            carries a ts_rank and a vector chunk a cosine similarity; the rank is. 0 for a synthetic
            entry no retrieved chunk backs.
          example: 1.0
        matchCount:
          type: integer
          example: 3
        indexedAt:
          type: string
          format: date-time
          nullable: true
        documentId:
          type: string
          format: uuid
          nullable: true
          description: >
            The document id chunks were retrieved from (#739) - lets a client open the original via
            GET /api/v1/documents/{documentId}/content for every sourceType (#747: that endpoint now
            proxies HTTP_DIRECTORY/RSS_FEED server-side from sourceUrl below instead of answering
            404). Null for a synthetic entry (#386) whose citation named a document id that matched
            no retrieved chunk at all - there is nothing real to link to.
          example: 3f9a6b2e-1c4d-4e8a-9f0b-2d6c8e1a5b7d
        sourceType:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/DocumentSourceType"
          description: >
            The retrieved document's own source type (#739). Every sourceType opens through GET
            /api/v1/documents/{documentId}/content (#747); sourceUrl below is secondary information
            for HTTP_DIRECTORY/RSS_FEED, not itself a deep link a client should navigate to directly
            (the source may only be reachable from OPAA's own network). Null exactly when documentId
            is null.
          example: FILESYSTEM
        sourceUrl:
          type: string
          nullable: true
          description: >
            The document's own remote location for sourceType HTTP_DIRECTORY/RSS_FEED (#739),
            mirroring LibraryDocumentResponse.sourceUrl - shown as secondary information alongside
            the documentId deep link (#747), e.g. as a tooltip, since the source itself may not be
            reachable from the caller's own network. Null for UPLOAD/FILESYSTEM (use documentId
            instead) and for a synthetic entry.
          example: https://example.gov/verzeichnis/dienstanweisung-2024.pdf
        sourceEntryUrl:
          type: string
          nullable: true
          description: >
            For a citation of an attachment discovered on an RSS entry's detail page (#468), the
            URL of the entry it was found on - lets the citation trace the attachment back to the
            feed entry it belongs to. Null for every other document, and for a citation merged from
            chunks whose underlying documents disagree on this value.
          example: https://example.com/feed/entry-123
        cited:
          type: boolean
          example: true
        citationValid:
          type: boolean
          nullable: true
          default: true
          description: >
            Deterministic citation validation (#386): whether the citation(s) pointing at this
            source actually match the chunks retrieved for this answer - document id, section
            (chunk index) and file name must all agree with the retrieved set. False means at
            least one citation naming this source was invalid: it named a document id not among
            the retrieved chunks, a section number that document does not have among them, or a
            file name that does not match the id it claimed. An invalid citation is never silently
            dropped from the answer text nor silently accepted as genuine - it stays in the answer
            and its source entry is flagged here instead, including a synthetic entry (zero
            relevance, zero match count) for a citation whose document id matches no retrieved
            chunk at all. Absent/true for a source no citation flagged as invalid, and for a
            source that was never cited in the first place.
          example: true

        chunkLocations:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/ChunkLocation"
          description: >
            Where each retrieved chunk of this document sits in the original (#667) - the Fundort
            mockup 1a prints next to a footnote ("Abschn. 4.2 ‚Fristsetzung'", "S. 2–4"). One entry
            per retrieved chunk, keyed by the chunk index the citation marker carries
            (【source: <documentId>#<chunkIndex> | …】), so a client resolves footnote number → chunk
            index → location without a second request. The location itself is null where the
            indexing pipeline could not determine one (plain text without headings, a format without
            page breaks). Absent for a synthetic entry (#386).

        mailFrom:
          type: string
          nullable: true
          description: >-
            The message's Absender (#1164), read back from the mail_from chunk metadata
            ChunkMailMetadata declares (Teil 3, Punkt 5 of docs/features/ingestion-pipelines.md).
            Null for a source that is not an EML/MSG message's own body chunk.
          example: mueller@stadt.de
        mailTo:
          type: string
          nullable: true
          description: >-
            The message's Empfänger (#1164), read back from the mail_to chunk metadata. Null for a
            source that is not an EML/MSG message's own body chunk.
          example: poststelle@stadt.de
        mailSubject:
          type: string
          nullable: true
          description: >-
            The message's Betreff (#1164), read back from the mail_subject chunk metadata. Null for
            a source that is not an EML/MSG message's own body chunk.
          example: Bebauungsplan Nord
        mailDate:
          type: string
          nullable: true
          description: >-
            The message's Datum (#1164), read back from the mail_date chunk metadata as the indexing
            pipeline wrote it (an ISO-8601 instant, truncated to whole seconds so it stays
            lexicographically sortable). Null for a source that is not an EML/MSG message's own body
            chunk.
          example: "2026-03-14T09:15:00Z"
        metadata:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/SourceMetadataEntry"
          description: >-
            The cited document's schema metadata as a generic field-value list (#1066; Maintainer-
            Beschluss vom 04.09.2026 am Epic #1065): the core fields first (Titel, Dokumentart,
            Datum/Stand), later a library's own fields appended (#1071). Read from the document
            itself - not from the chunk - so every chunk of a document reports the same values. A
            field without a value is simply absent, and a client renders the list without knowing
            any field. Null for a synthetic entry (#386) and for a document without any value.

    ChunkLocation:
      type: object
      required: [chunkIndex]
      properties:
        chunkIndex:
          type: integer
          description: The chunk_index the citation marker names.
          example: 3
        location:
          type: string
          nullable: true
          description: >
            Human-readable location of the chunk in its document (#667), German, as the indexing
            pipeline derived it from the document's own structure: the page range for formats with
            page breaks (PDF, Office documents), the heading path for Markdown-style headings, both
            when both are known. Null when nothing could be derived.
          example: S. 2–4 · Abschn. 4.2 ‚Fristsetzung'

    QueryMetadata:
      type: object
      required: [model, tokenCount, durationMs]
      properties:
        model:
          type: string
          example: gpt-4o
        tokenCount:
          type: integer
          example: 847
        durationMs:
          type: integer
          format: int64
          example: 1523
        answeredWithoutKnowledge:
          type: boolean
          nullable: true
          default: false
          description: >
            True when useKnowledge was false and libraryIds resolved to no readable library, so no
            vector search ran and the answer was generated without any document context (#526). The
            frontend uses this to show the corresponding hint instead of inferring it from an empty
            sources list, which alone cannot distinguish "no knowledge searched" from "searched but
            found nothing".
        noKnowledgeAvailableInSpace:
          type: boolean
          nullable: true
          default: false
          description: >
            True for the distinct #203 fail-open case: the chat's space has @Alles-Wissen active
            and carries at least one library association, but none of the associated libraries are
            readable by the caller - the search scope resolves to empty even though the space is
            curated, not because the caller chose to search nothing
            (docs/features/spaces-and-assets.md#suchbereich-je-chatart, "In diesem Space ist für
            dich derzeit kein Wissen verfügbar"). Mutually exclusive with
            answeredWithoutKnowledge, which covers the unrelated case of useKnowledge being
            deliberately false. Never true for an ephemeral query without a persisted chat, and
            never true for a space without any association (that case falls back to every readable
            library instead, per the permanent transition rule).

        searchedLibraries:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/SearchedLibrary"
          description: >
            The libraries the vector search actually ran against for this turn (#667) - the
            effective search scope after permissions and the chat's own settings were applied,
            sorted by name. Lets a client print mockup 1a's "Durchsucht wurden: …" line under an
            answer that could not be substantiated, naming exactly what was looked at. Empty when no
            search ran (answeredWithoutKnowledge / noKnowledgeAvailableInSpace).

    SearchedLibrary:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Dienstanweisungen

    ErrorResponse:
      type: object
      required: [error, status, timestamp]
      properties:
        error:
          type: string
        status:
          type: integer
        timestamp:
          type: string
          format: date-time

    SpaceRole:
      type: string
      enum: [MEMBER, CURATOR, ADMIN]
      example: CURATOR

    SpaceVisibility:
      type: string
      enum: [PRIVATE, DISCOVERABLE, OPEN]
      example: PRIVATE

    SpaceRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: Engineering
        description:
          type: string
          maxLength: 2000
          nullable: true
          example: Engineering project space
        visibility:
          $ref: "#/components/schemas/SpaceVisibility"
        ownerId:
          type: string
          format: uuid
          nullable: true
          description: Defaults to the creator; a system admin may set it explicitly
        initialMembers:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/SpaceMemberRequest"
        libraryIds:
          type: array
          nullable: true
          maxItems: 100
          description: >
            Libraries to associate with the space on creation (#203/#686) - each must be at least
            readable (VIEWER or above) by the creator, exactly the same rule the dedicated POST
            /v1/spaces/{spaceId}/libraries endpoint enforces afterwards. Optional: a space created
            without this is not narrower for search, it simply has no associations yet (the
            permanent transition rule in docs/features/spaces-and-assets.md#suchbereich-je-chatart
            - "ein Space ohne Assoziationen verengt nie"). Associated atomically with the space
            itself (SpaceService#createSpace) - if any id cannot be associated (not found, or not
            readable by the creator), the whole space creation is rolled back rather than left
            half-created.
          items:
            type: string
            format: uuid

    SpaceUpdateRequest:
      type: object
      required: [name]
      description: >
        Body for updating an existing space. Deliberately narrower than SpaceRequest: ownerId
        cannot be changed here (ownership changes go through the dedicated transfer-ownership
        endpoint), and initialMembers has no meaning for an update.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: Engineering
        description:
          type: string
          maxLength: 2000
          nullable: true
          example: Engineering project space
        visibility:
          $ref: "#/components/schemas/SpaceVisibility"

    SpaceMemberRequest:
      type: object
      required: [userId, role]
      properties:
        userId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/SpaceRole"

    SpaceListResponse:
      type: object
      required: [id, name, isDefault, archived, memberCount, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Engineering
        description:
          type: string
          nullable: true
        isDefault:
          type: boolean
          description: True for the space created automatically on first login.
          example: false
        archived:
          type: boolean
          description: >
            #543: an archived space accepts no new content (chats, messages, renames, members) and
            is left out of this list for members who have no chat of their own in it and are
            neither the owner nor a system admin - see
            docs/features/spaces-and-assets.md#einen-space-stilllegen-archivieren-statt-löschen.
          example: false
        visibility:
          $ref: "#/components/schemas/SpaceVisibility"
        memberCount:
          type: integer
          example: 5
        libraryCount:
          type: integer
          description: >
            #682: number of knowledge libraries assigned to the space - the "Quellen" figure of
            the overview card. Follows the same rule as the space's association list: CURATOR,
            ADMIN, the owner and system admins count every association, a plain MEMBER only the
            libraries they may read. Optional so older clients keep working.
          example: 3
        chatCount:
          type: integer
          description: >
            #682: number of chats the caller owns in this space. Chats are private to their
            author (#525), so this is the caller's view, not a space-wide total. Optional so
            older clients keep working.
          example: 12
        userRole:
          $ref: "#/components/schemas/SpaceRole"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SpaceMemberResponse:
      type: object
      required: [userId, role, createdAt]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
          nullable: true
        role:
          $ref: "#/components/schemas/SpaceRole"
        createdAt:
          type: string
          format: date-time

    SpaceResponse:
      type: object
      required:
        [id, name, isDefault, archived, ownerId, memberCount, roleCounts, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Engineering
        description:
          type: string
          nullable: true
        isDefault:
          type: boolean
          description: >
            True for the space created automatically on first login. Exactly one per user and not
            deletable; an ordinary space in every other respect.
          example: false
        archived:
          type: boolean
          description: >
            #543: an archived space accepts no new content (chats, messages, renames, members).
            See docs/features/spaces-and-assets.md#einen-space-stilllegen-archivieren-statt-
            löschen.
          example: false
        visibility:
          $ref: "#/components/schemas/SpaceVisibility"
        ownerId:
          type: string
          format: uuid
        memberCount:
          type: integer
          example: 5
        userRole:
          $ref: "#/components/schemas/SpaceRole"
        roleCounts:
          type: object
          additionalProperties:
            type: integer
            format: int64
          example:
            MEMBER: 2
            CURATOR: 1
            ADMIN: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SpaceAddMemberRequest:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/SpaceRole"

    SpaceRoleUpdateRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/SpaceRole"

    SpaceTransferOwnershipRequest:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
          format: uuid

    SpaceLibraryAssociationRequest:
      type: object
      required: [libraryId]
      properties:
        libraryId:
          type: string
          format: uuid

    SpaceLibraryAssociationResponse:
      type: object
      required: [libraryId, createdByUserId, createdAt, readableByCaller]
      description: >
        One space's view of one associated library - see
        docs/features/spaces-and-assets.md#assets-in-einen-space-assoziieren. For a plain MEMBER,
        only returned for a library they may themselves read (#203 acceptance criterion "two
        members with different grants see different asset lists"). For a CURATOR, ADMIN or the
        space owner, every association is returned, including one they cannot themselves read -
        readableByCaller distinguishes the two and libraryName is only present when it is true, so
        an unreadable entry never leaks the library's name to a manager without a grant on it.
      properties:
        libraryId:
          type: string
          format: uuid
        libraryName:
          type: string
          nullable: true
          example: Rechtsquellen Soziales
          description: Present only when readableByCaller is true.
        readableByCaller:
          type: boolean
          description: >
            Whether the calling user may themselves read this library. Always true in a plain
            MEMBER's filtered list; may be false in a CURATOR/ADMIN/owner's unfiltered list.
        createdByUserId:
          type: string
          format: uuid
        createdByDisplayName:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    SpaceLibraryAssociationListResponse:
      type: object
      required: [hasAssociations, items]
      description: >
        The wrapper around GET /v1/spaces/{spaceId}/libraries's list, carrying one count-free state
        field alongside it (#203 review finding on #706). hasAssociations distinguishes two
        outwardly identical empty-items cases that need different frontend messages: a space with
        no association at all (search falls back to every readable library, per the permanent
        transition rule) versus a space that is curated but happens to have nothing the caller may
        read (docs/features/spaces-and-assets.md#suchbereich-je-chatart, "In diesem Space ist für
        dich derzeit kein Wissen verfügbar" - a valid state, not an error, and deliberately without
        a count of the unreadable libraries).
      properties:
        hasAssociations:
          type: boolean
          description: >
            Whether the space has at least one association at all, regardless of whether the
            caller may read it - computed unfiltered, independently of items.
        items:
          type: array
          items:
            $ref: "#/components/schemas/SpaceLibraryAssociationResponse"

    LibrarySpaceAssociationResponse:
      type: object
      required: [spaceId, spaceName, createdByUserId, createdAt, narrowerReaderCircle]
      description: >
        One library's view of one space it is associated with - the owner-facing "bereitgestellt
        in" list (GET /v1/libraries/{libraryId}/spaces), never filtered by the caller's own space
        membership.
      properties:
        spaceId:
          type: string
          format: uuid
        spaceName:
          type: string
          example: Team Leistungsgewährung
        createdByUserId:
          type: string
          format: uuid
        createdByDisplayName:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        narrowerReaderCircle:
          type: boolean
          description: >
            True if at least one member of this space cannot themselves read the library - the
            same condition that triggered the owner notification when the association was
            created. Recomputed at read time, not stored, since both space membership and library
            grants change independently afterwards.

    NotificationType:
      type: string
      description: >
        The closed vocabulary of a notification's type - see
        io.opaa.api.types.NotificationType, kept in lockstep with the database check
        constraint chk_notifications_type (migration 052).
      enum: [LIBRARY_ASSOCIATED_TO_MIXED_SPACE]
      example: LIBRARY_ASSOCIATED_TO_MIXED_SPACE

    NotificationResponse:
      type: object
      required: [id, type, title, createdAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/NotificationType"
        objectType:
          allOf:
            - $ref: "#/components/schemas/AuditObjectType"
          nullable: true
        objectId:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
          example: Ihre Bibliothek wurde in einem Space bereitgestellt
        body:
          type: string
          nullable: true
        readAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    ChatStatus:
      type: string
      description: >
        Single-value for now (#525) - the SHARED/WITHDRAWN axis from the specification's sharing
        model belongs to #205 and is deliberately not built here; the column exists so it can be
        added without a further migration.
      enum: [PRIVATE]
      example: PRIVATE

    ChatRole:
      type: string
      enum: [USER, ASSISTANT]
      example: USER

    ChatSummary:
      type: object
      description: A chat as listed in its space - without its messages, see ChatDetail for those.
      required: [id, spaceId, authorId, useKnowledge, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        spaceId:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        title:
          type: string
          nullable: true
          description: Falls back to a title derived from the first question if never set explicitly.
          example: Rückstellung für Altlastensanierung
        useKnowledge:
          type: boolean
          default: true
        referencedLibraryIds:
          type: array
          items:
            type: string
            format: uuid
          description: >
            Sticky @-references (epic #523). Used as the search scope when useKnowledge is false;
            ignored when it is true.
        status:
          $ref: "#/components/schemas/ChatStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ChatDetail:
      type: object
      description: A chat with its full message history, in chronological order.
      required: [id, spaceId, authorId, useKnowledge, status, messages, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        spaceId:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        title:
          type: string
          nullable: true
          example: Rückstellung für Altlastensanierung
        useKnowledge:
          type: boolean
          default: true
        referencedLibraryIds:
          type: array
          items:
            type: string
            format: uuid
        status:
          $ref: "#/components/schemas/ChatStatus"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessageResponse"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ChatMessageResponse:
      type: object
      required: [id, chatId, role, content, createdAt]
      properties:
        id:
          type: string
          format: uuid
        chatId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/ChatRole"
        content:
          type: string
        sources:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/SourceReference"
          description: Present on ASSISTANT messages that used document context; absent otherwise.
        createdAt:
          type: string
          format: date-time

    ChatCreateRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
          nullable: true
        useKnowledge:
          type: boolean
          default: true
        referencedLibraryIds:
          type: array
          nullable: true
          items:
            type: string
            format: uuid

    ChatUpdateRequest:
      type: object
      description: >
        Every field is optional and only overwrites the chat when present - omitting a field
        leaves it unchanged, matching PATCH semantics rather than PUT's full replacement.
      properties:
        title:
          type: string
          maxLength: 255
          nullable: true
        useKnowledge:
          type: boolean
          nullable: true
        referencedLibraryIds:
          type: array
          nullable: true
          items:
            type: string
            format: uuid

    GroupKind:
      type: string
      description: >
        ORG_UNIT groups are synchronised from the directory (see #237), carry a parent unit and
        can have curators. AD_HOC groups are created in the system, have no curator and no
        distribution level of their own.
      enum: [ORG_UNIT, AD_HOC]
      example: AD_HOC

    GroupRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: Projektbeteiligte Phoenix
        description:
          type: string
          maxLength: 2000
          nullable: true
          example: Ad-hoc-Gruppe für das Projekt Phoenix

    GroupUpdateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: Projektbeteiligte Phoenix
        description:
          type: string
          maxLength: 2000
          nullable: true
          example: Ad-hoc-Gruppe für das Projekt Phoenix

    GroupMemberResponse:
      type: object
      required: [userId, createdAt]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    GroupListResponse:
      type: object
      required: [id, name, kind, memberCount, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Projektbeteiligte Phoenix
        description:
          type: string
          nullable: true
        kind:
          $ref: "#/components/schemas/GroupKind"
        externalId:
          type: string
          nullable: true
          description: Stable directory identifier (objectGUID or SCIM externalId); null for AD_HOC groups
        parentGroupId:
          type: string
          format: uuid
          nullable: true
          description: Parent organizational unit; only set for ORG_UNIT groups
        memberCount:
          type: integer
          example: 4
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    GroupResponse:
      type: object
      required: [id, name, kind, memberCount, members, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Projektbeteiligte Phoenix
        description:
          type: string
          nullable: true
        kind:
          $ref: "#/components/schemas/GroupKind"
        externalId:
          type: string
          nullable: true
          description: Stable directory identifier (objectGUID or SCIM externalId); null for AD_HOC groups
        parentGroupId:
          type: string
          format: uuid
          nullable: true
          description: Parent organizational unit; only set for ORG_UNIT groups
        memberCount:
          type: integer
          example: 4
        members:
          type: array
          items:
            $ref: "#/components/schemas/GroupMemberResponse"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    GroupAddMemberRequest:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
          format: uuid

    LibraryOwnerType:
      type: string
      description: Who owns a library - a single person or a group.
      enum: [USER, GROUP]
      example: USER

    LibraryVisibility:
      type: string
      description: >
        PRIVATE reaches only the owner (and, for a group owner, its members). SHARED follows the
        owning group's membership. ORGANIZATION is readable by every user in the same
        organization. See docs/features/spaces-and-assets.md#freigabestufen-und-auffindbarkeit.
      enum: [PRIVATE, SHARED, ORGANIZATION]
      example: PRIVATE

    LibraryRequest:
      type: object
      required: [name, sourceType]
      description: >
        sourceType is required (ADR-0018): a library's quellentyp is chosen at creation and is
        never changed afterwards (see LibraryUpdateRequest). Which of sourcePath/sourceUrl/
        sourceProxy/sourceCredentials/sourceInsecureSsl may be set depends on sourceType - UPLOAD
        accepts none of them, FILESYSTEM accepts sourcePath only, HTTP_DIRECTORY and RSS_FEED
        both accept sourceUrl (sourceProxy/sourceCredentials/sourceInsecureSsl optional). A
        combination that contradicts sourceType is rejected with 400.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: Rechtsquellen Soziales
        description:
          type: string
          maxLength: 2000
          nullable: true
          example: SGB II, SGB XII, VwVfG, Dienstanweisungen
        ownerType:
          $ref: "#/components/schemas/LibraryOwnerType"
          description: Defaults to USER (the creator) when omitted
        ownerId:
          type: string
          format: uuid
          nullable: true
          description: >
            Required when ownerType is GROUP (the caller must be a member of that group).
            Ignored for ownerType USER, which always owns as the creator.
        visibility:
          $ref: "#/components/schemas/LibraryVisibility"
        listed:
          type: boolean
          nullable: true
          description: Defaults to false
        sourceType:
          $ref: "#/components/schemas/DocumentSourceType"
        sourcePath:
          type: string
          maxLength: 2000
          nullable: true
          description: >
            Filesystem directory to crawl - only for sourceType FILESYSTEM. Must be an absolute
            path, and must resolve underneath one of the operator-configured allowlist base
            directories (opaa.indexing.filesystem.allowlist, #484/ADR-0018 Entscheidung 6) -
            otherwise rejected with 400. An empty allowlist disables sourceType FILESYSTEM
            entirely.
          example: /data/documents/rechtsquellen
        sourceUrl:
          type: string
          format: uri
          nullable: true
          description: >
            URL of an Apache mod_autoindex directory listing (HTTP_DIRECTORY) or an RSS-2.0 feed
            (RSS_FEED) to crawl. http/https only.
          example: https://files.example.com/documents/
        sourceProxy:
          type: string
          maxLength: 255
          nullable: true
          description: >
            Proxy server in host:port format - only for sourceType HTTP_DIRECTORY or RSS_FEED.
          example: proxy.example.com:8080
        sourceCredentials:
          type: string
          maxLength: 500
          nullable: true
          description: >
            Basic auth credentials in user:password format - only for sourceType
            HTTP_DIRECTORY or RSS_FEED. Write-only: never returned by any API response
            (ADR-0018).
          example: admin:secret
        sourceInsecureSsl:
          type: boolean
          nullable: true
          description: >
            Skip SSL certificate verification - only for sourceType HTTP_DIRECTORY or RSS_FEED.
          default: false

    SourceConnectionTestRequest:
      type: object
      required: [sourceType]
      description: >
        Carries the same typed configuration fields as LibraryRequest (#514) - deliberately a
        separate schema rather than reusing LibraryRequest itself, since name/ownerType/
        visibility/... have no meaning before a library exists and would only invite a client
        to pass a half-filled LibraryRequest by mistake. Which fields are accepted depends on
        sourceType exactly like LibraryRequest; UPLOAD accepts none and is rejected outright
        (there is nothing to test).
      properties:
        sourceType:
          $ref: "#/components/schemas/DocumentSourceType"
        sourcePath:
          type: string
          maxLength: 2000
          nullable: true
          description: >
            Only for sourceType FILESYSTEM. Must be an absolute path, and must resolve
            underneath one of the operator-configured allowlist base directories
            (opaa.indexing.filesystem.allowlist, #484/ADR-0018 Entscheidung 6) - otherwise
            rejected with 400, without touching the filesystem at all. An empty allowlist
            disables sourceType FILESYSTEM entirely, identical to LibraryRequest.sourcePath.
          example: /data/documents/rechtsquellen
        sourceUrl:
          type: string
          format: uri
          nullable: true
          description: Only for sourceType HTTP_DIRECTORY or RSS_FEED. http/https only.
          example: https://files.example.com/documents/
        sourceProxy:
          type: string
          maxLength: 255
          nullable: true
          description: Proxy server in host:port format - only for sourceType HTTP_DIRECTORY or RSS_FEED.
          example: proxy.example.com:8080
        sourceCredentials:
          type: string
          maxLength: 500
          nullable: true
          description: >
            Basic auth credentials in user:password format - only for sourceType
            HTTP_DIRECTORY or RSS_FEED. Used for this one request only, never persisted or
            echoed back.
          example: admin:secret
        sourceInsecureSsl:
          type: boolean
          nullable: true
          description: Skip SSL certificate verification - only for sourceType HTTP_DIRECTORY or RSS_FEED.
          default: false
        libraryId:
          type: string
          format: uuid
          nullable: true
          description: >
            Optional (#544). Identifies the library whose already-stored source credentials this
            test may fall back to when sourceCredentials is omitted here - the same
            same-origin-only fallback KnowledgeLibraryService#validateSourceConfigurationForUpdate
            already applies when saving an edited quellkonfiguration, so a caller pointed at a
            different host cannot silently reuse a credential it never entered. Requires at least
            AssetRole.MANAGER on that library (404 if it does not exist or belongs to another
            organization, 403 if it exists but the caller's role is below MANAGER - the same
            not-found/forbidden split every other library endpoint uses). The library's own
            sourceType must match this request's sourceType, otherwise 400. Absent, this behaves
            exactly like before #544 - a standalone test with no stored library to fall back to.

    SourceConnectionTestResponse:
      type: object
      required: [reachable, message]
      description: >
        Structured result of a source connection test (#514). message is always German and
        always safe to show to the caller verbatim - both on success ("Verzeichnis erreichbar,
        42 Dokumente gefunden") and on failure ("Der RSS-Feed konnte nicht gelesen werden: kein
        gültiges XML."); no exception text or stack trace ever reaches it.
      properties:
        reachable:
          type: boolean
          description: Whether the configured source could be reached and read.
        documentCount:
          type: integer
          format: int64
          nullable: true
          description: >
            Number of supported documents found (FILESYSTEM: recursively, matching the run's
            own SupportedDocumentFormats filter; HTTP_DIRECTORY: only the top-level listing,
            filtered the same way, not a recursive crawl of the whole tree; RSS_FEED: entries,
            capped at opaa.indexing.rss.max-entries like the run itself) - null when reachable
            is false, since nothing could be counted.
        message:
          type: string
          description: German, user-facing summary of the result.
          example: Verzeichnis erreichbar, 42 Dokumente gefunden

    ScheduleFrequency:
      type: string
      description: >
        The four fixed intervalstufen a library's indexing schedule may take (#485, Zuschnitt
        21.08.2026) - deliberately not free-form cron: HOURLY runs on the hour, DAILY and WEEKLY
        take an explicit hour/minute (WEEKLY additionally a weekday), DISABLED carries no time at
        all. Stored internally as a cron expression (LibraryScheduleCodec) so a future expert
        cron field would only be a UI change, but the API itself only ever accepts one of these
        four shapes.
      enum: [DISABLED, HOURLY, DAILY, WEEKLY]
      example: DAILY

    ScheduleWeekday:
      type: string
      description: Names match java.time.DayOfWeek exactly (#485).
      enum:
        [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
      example: MONDAY

    LibraryScheduleRequest:
      type: object
      required: [frequency]
      description: >
        Sets or clears a connector library's indexing schedule (#485). Which of hour/minute/
        weekday are required depends on frequency: DISABLED and HOURLY accept none of them
        (HOURLY always runs at minute 0 of every hour), DAILY requires hour and minute, WEEKLY
        additionally requires weekday. A combination that contradicts frequency is rejected with
        400, the same shape LibraryRequest's sourceType-dependent fields already use. Rejected
        with 400 for a sourceType UPLOAD library (#485 Zuschnitt: nur Konnektorbibliotheken).
      properties:
        frequency:
          $ref: "#/components/schemas/ScheduleFrequency"
        hour:
          type: integer
          minimum: 0
          maximum: 23
          nullable: true
          description: Required for DAILY and WEEKLY, server local time (see LibrarySchedule).
          example: 3
        minute:
          type: integer
          minimum: 0
          maximum: 59
          nullable: true
          description: Required for DAILY and WEEKLY.
          example: 30
        weekday:
          $ref: "#/components/schemas/ScheduleWeekday"

    LibrarySchedule:
      type: object
      required: [frequency]
      description: >
        A library's current indexing schedule (#485), returned by LibraryResponse. Same shape as
        LibraryScheduleRequest plus nextRunAt, the one field only the server can compute -
        deliberately a flat schema rather than composing over LibraryScheduleRequest via allOf, so
        the generated Java model stays a single plain class.
      properties:
        frequency:
          $ref: "#/components/schemas/ScheduleFrequency"
        hour:
          type: integer
          minimum: 0
          maximum: 23
          nullable: true
          example: 3
        minute:
          type: integer
          minimum: 0
          maximum: 59
          nullable: true
          example: 30
        weekday:
          $ref: "#/components/schemas/ScheduleWeekday"
        nextRunAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: >
            The next time this schedule fires, computed from the stored cron expression at
            server local time (opaa.scheduling.zone is not configurable yet - see the #485 PR
            description for why server time was chosen). Null when frequency is DISABLED.

    LibraryUpdateRequest:
      type: object
      required: [name]
      description: >
        Body for updating an existing library. Deliberately narrower than LibraryRequest: owner
        and ownerType cannot be changed here - transferring ownership is out of scope for #201.
        sourceType itself cannot be changed here (ADR-0018): the quellentyp is chosen once, at
        creation, and is permanent. sourceType is accepted as an optional field purely so a
        client that (mistakenly) resends the current value from LibraryResponse is not rejected
        for that alone; any value that differs from the library's stored sourceType is rejected
        with 400. The typed configuration fields (sourcePath/sourceUrl/sourceProxy/
        sourceCredentials/sourceInsecureSsl) can be updated - e.g. rotating credentials or moving
        a crawl target does not require deleting and recreating the library - and are validated
        against the library's existing (unchangeable) sourceType exactly like LibraryRequest. The
        configuration is only replaced (as a whole) when the request carries at least one of
        these fields; a request that omits all of them (e.g. renaming the library) leaves the
        stored configuration untouched rather than clearing it. schedule (#485) follows the same
        replace-as-a-whole rule: only present when the caller intends to change it, otherwise the
        stored schedule stays untouched. Changing it requires the same AssetRole.MANAGER this
        whole endpoint already enforces - there is no separate schedule endpoint.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: Rechtsquellen Soziales
        description:
          type: string
          maxLength: 2000
          nullable: true
          example: SGB II, SGB XII, VwVfG, Dienstanweisungen
        visibility:
          $ref: "#/components/schemas/LibraryVisibility"
        listed:
          type: boolean
          nullable: true
          description: Defaults to false
        sourceType:
          $ref: "#/components/schemas/DocumentSourceType"
        sourcePath:
          type: string
          maxLength: 2000
          nullable: true
          description: >
            Filesystem directory to crawl - only for sourceType FILESYSTEM. Must be an absolute
            path, and must resolve underneath one of the operator-configured allowlist base
            directories (opaa.indexing.filesystem.allowlist, #484/ADR-0018 Entscheidung 6) -
            otherwise rejected with 400. An empty allowlist disables sourceType FILESYSTEM
            entirely.
          example: /data/documents/rechtsquellen
        sourceUrl:
          type: string
          format: uri
          nullable: true
          description: >
            URL of an Apache mod_autoindex directory listing (HTTP_DIRECTORY) or an RSS-2.0 feed
            (RSS_FEED) to crawl. http/https only.
          example: https://files.example.com/documents/
        sourceProxy:
          type: string
          maxLength: 255
          nullable: true
          description: >
            Proxy server in host:port format - only for sourceType HTTP_DIRECTORY or RSS_FEED.
          example: proxy.example.com:8080
        sourceCredentials:
          type: string
          maxLength: 500
          nullable: true
          description: >
            Basic auth credentials in user:password format - only for sourceType
            HTTP_DIRECTORY or RSS_FEED. Write-only: never returned by any API response
            (ADR-0018). Omitting this field while replacing the rest of the configuration (e.g.
            only sourceUrl changes) leaves the currently stored credentials untouched - there is
            no way to read them back to resend, and no way to explicitly clear them via this
            request.
          example: admin:secret
        sourceInsecureSsl:
          type: boolean
          nullable: true
          description: >
            Skip SSL certificate verification - only for sourceType HTTP_DIRECTORY or RSS_FEED.
          default: false
        schedule:
          $ref: "#/components/schemas/LibraryScheduleRequest"

    LibraryListResponse:
      type: object
      required:
        [
          id,
          name,
          ownerType,
          visibility,
          listed,
          myRole,
          sourceType,
          documentCount,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Rechtsquellen Soziales
        description:
          type: string
          nullable: true
        ownerType:
          $ref: "#/components/schemas/LibraryOwnerType"
        ownerName:
          type: string
          nullable: true
          description: >
            Display name of the group or user owner, so the overview can show it instead of
            a generic "Gruppen-Bibliothek" label. Null if the owner could not be resolved
            (e.g. the group or user was deleted).
          example: Referat 50
        visibility:
          $ref: "#/components/schemas/LibraryVisibility"
        listed:
          type: boolean
        myRole:
          description: >
            The effective role you hold on this library, per the formula in
            docs/features/spaces-and-assets.md#rechte-an-einem-asset-erhalten. Always at least
            VIEWER, since anything less would exclude the library from this list altogether.
            Never bypassed to OWNER for a system admin, unlike myRole on the single-library
            response (GET/PUT /api/v1/libraries/{libraryId}): a library reachable only by
            administering everything must not be mistaken for one you actually own or manage -
            the frontend already knows the caller's admin status and can render that distinction
            itself.
          allOf:
            - $ref: "#/components/schemas/AssetRole"
        sourceType:
          description: >
            The library's quellentyp (ADR-0018), added here so the overview and the library
            detail page (#481) can both show the type without a per-library detail round trip -
            previously only the single-library response (LibraryResponse) carried this field.
          allOf:
            - $ref: "#/components/schemas/DocumentSourceType"
        documentCount:
          type: integer
          format: int64
        lastIndexedAt:
          type: string
          format: date-time
          description: >
            #684: completion time of the library's most recent successful indexing run
            (JobStatus COMPLETED) - the "Stand" column of the overview table. Absent when the
            library has never completed a run; failed or still-running runs never move it. The
            wording base ("indiziert" vs. "abgerufen") follows the library's sourceType already
            present on this response, so no separate field carries it. Optional so older
            clients keep working.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    LibraryResponse:
      type: object
      required:
        - id
        - name
        - ownerType
        - ownerId
        - visibility
        - listed
        - myRole
        - sourceType
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Rechtsquellen Soziales
        description:
          type: string
          nullable: true
        ownerType:
          $ref: "#/components/schemas/LibraryOwnerType"
        ownerId:
          type: string
          format: uuid
          description: The owning user or group, whichever ownerType names.
        visibility:
          $ref: "#/components/schemas/LibraryVisibility"
        listed:
          type: boolean
        myRole:
          description: >
            The effective role you hold on this library. For a system admin, this is always
            OWNER - the same administrative bypass canRead/canManage use - regardless
            of any actual grant. Unlike myRole on the list response (GET /api/v1/libraries),
            which never bypasses for a system admin.
          allOf:
            - $ref: "#/components/schemas/AssetRole"
        documentCount:
          type: integer
          format: int64
        sourceType:
          $ref: "#/components/schemas/DocumentSourceType"
        sourcePath:
          type: string
          nullable: true
          description: >
            Set only for sourceType FILESYSTEM, and only if myRole is at least MANAGER (#507) -
            an internal server path is configuration detail for whoever may change it, not for a
            mere VIEWER of an organization-wide library. Absent (not merely null) for a lower
            role, mirroring the MANAGER bar PUT /api/v1/libraries/{libraryId} already enforces
            for changing it.
        sourceUrl:
          type: string
          format: uri
          nullable: true
          description: >
            Set only for sourceType HTTP_DIRECTORY or RSS_FEED, and only if myRole is at least
            MANAGER (#507) - see sourcePath above for why.
        sourceProxy:
          type: string
          nullable: true
          description: >
            Set only for sourceType HTTP_DIRECTORY or RSS_FEED, only if configured, and only if
            myRole is at least MANAGER (#507) - see sourcePath above for why.
        sourceInsecureSsl:
          type: boolean
          nullable: true
          description: >
            Set only for sourceType HTTP_DIRECTORY or RSS_FEED, and only if myRole is at least
            MANAGER (#507) - see sourcePath above for why. sourceCredentials is deliberately
            absent from this response regardless of role (ADR-0018) - it is a write-only field of
            LibraryRequest and appears in no API response.
        sourceCredentialsSet:
          type: boolean
          nullable: true
          description: >
            Whether a credential is currently stored for this library - never the credential
            itself (ADR-0018). Only meaningful for sourceType HTTP_DIRECTORY or RSS_FEED; always
            false otherwise. Lets a client (e.g. the source configuration edit dialog) phrase an
            accurate "leave blank to keep the current credential" hint only when one actually
            exists, instead of implying one is configured when none is. Set only if myRole is at
            least MANAGER (#507) - see sourcePath above for why.
        schedule:
          description: >
            The library's indexing schedule (#485) - present only for a connector library
            (sourceType other than UPLOAD) and only if myRole is at least MANAGER, the same
            threshold sourcePath/sourceUrl above already use, since nextRunAt/frequency are
            configuration detail exactly like the rest of the source setup.
          allOf:
            - $ref: "#/components/schemas/LibrarySchedule"
        lastScheduledRunsFailed:
          type: boolean
          nullable: true
          description: >
            True when this library's two most recently completed scheduled runs both ended
            FAILED (#485 Zuschnitt: "wiederholtes Scheitern wird ... sichtbar gemacht", without
            automatically disabling the schedule - stille Ausfälle sollen aber nicht unbemerkt
            bleiben). A single failed scheduled run, or any manually triggered run, does not set
            this. Present only under the same conditions as schedule above.
        storageQuotaBytes:
          type: integer
          format: int64
          nullable: true
          description: >
            The configured per-library storage quota in bytes (#119, Standardkontingent je
            Bibliothek) - the same value for every library today, since the quota is currently an
            operator-wide setting rather than one configurable per library. Set only if myRole is
            at least MANAGER (#507) - see sourcePath above for why: usage/quota is administration
            detail, not something a mere VIEWER needs to manage the bestand.
        storageUsedBytes:
          type: integer
          format: int64
          nullable: true
          description: >
            The total bytes this library's documents currently occupy, summed across every
            document regardless of who uploaded or indexed it - never broken down per user (#216,
            "kein personenbezogener Auswertungspfad"). Set only if myRole is at least MANAGER
            (#507) - see sourcePath above for why.
        diagnosticsLocked:
          type: boolean
          description: >
            Whether this library is diagnosegesperrt (Leitplanke (e) of
            docs/features/hybrid-retrieval.md) - the read path for the state that
            PUT /api/v1/libraries/{libraryId}/diagnostics-lock sets, which until now was visible
            only in that endpoint's own response, immediately after setting it. Every library
            starts locked, including every pre-existing one, so a client renders this value rather
            than assuming an unlocked default. Visible to everyone who may read the library: it
            says that a locked area exists, never anything from inside it.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DocumentStatus:
      type: string
      enum: [PENDING, INDEXED, FAILED]
      example: INDEXED

    DocumentSourceType:
      type: string
      enum: [FILESYSTEM, HTTP_DIRECTORY, UPLOAD, RSS_FEED]
      example: FILESYSTEM

    MetadataOrigin:
      type: string
      description: >-
        Where a document metadata value came from (docs/features/metadata-schema.md, "Jeder Wert
        trägt seine Herkunft"): DETERMINISTIC from a parser/regex rule, DERIVED from a model call,
        MANUAL set by a person. A client marks DERIVED values as such wherever the value orders an
        answer's evidence.
      enum: [DETERMINISTIC, DERIVED, MANUAL]
      example: DETERMINISTIC

    DatePrecision:
      type: string
      description: >-
        How much of a document date is actually known - a full day, only the month, or only the
        year ("Fassung 2024"). The date itself is padded to the first day of the unknown part, so a
        client renders YEAR as "2024", never as "01.01.2024".
      enum: [DAY, MONTH, YEAR]
      example: DAY

    SourceMetadataEntry:
      type: object
      required: [fieldKey, label, value, displayValue, origin]
      description: >-
        One metadata value of a cited document (docs/features/metadata-schema.md, Wirkstelle 3),
        self-describing so a client renders it without field knowledge: the German label, the
        display text, the machine-readable value and the value's origin.
      properties:
        fieldKey:
          type: string
          description: >-
            The stable field key - title, document_type or document_date for the core fields; a
            library field's own key later (#1071).
          example: document_type
        label:
          type: string
          description: The German field label ("Titel", "Dokumentart", "Datum/Stand").
          example: Dokumentart
        value:
          type: string
          description: >-
            The machine-readable value - the vocabulary code for a controlled field, the ISO-8601
            calendar date (padded to the first day of what datePrecision leaves unknown) for a
            date, the text itself otherwise.
          example: DIENSTANWEISUNG
        displayValue:
          type: string
          description: >-
            What a client shows - the German vocabulary label, or a date at its own precision
            ("12.03.2026", "03/2026", "2024" - never a padded "01.01.2024").
          example: Dienstanweisung
        origin:
          $ref: "#/components/schemas/MetadataOrigin"
        datePrecision:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/DatePrecision"
          description: Set for a date value only.

    LibraryDocumentResponse:
      type: object
      required: [id, fileName, status, sourceType, chunkCount]
      properties:
        id:
          type: string
          format: uuid
        fileName:
          type: string
          example: dienstanweisung-2024.pdf
        contentType:
          type: string
          nullable: true
        fileSize:
          type: integer
          format: int64
          nullable: true
        status:
          $ref: "#/components/schemas/DocumentStatus"
        sourceType:
          $ref: "#/components/schemas/DocumentSourceType"
        chunkCount:
          type: integer
        indexedAt:
          type: string
          format: date-time
          nullable: true
        uploadedByUserId:
          type: string
          format: uuid
          nullable: true
          description: The user who uploaded this document, null for non-UPLOAD source types
        sourceEntryUrl:
          type: string
          nullable: true
          description: >
            For an attachment discovered on an RSS entry's detail page (#468), the URL of the entry
            it was found on - lets a citation trace an attachment back to the feed entry it belongs
            to. Null for every other document.
          example: https://example.gov/aktuelles/dienstanweisung-2024
        sourceUrl:
          type: string
          nullable: true
          description: >
            The document's own remote location for HTTP_DIRECTORY and RSS_FEED (#738). GET
            /api/v1/documents/{documentId}/content is the actual deep link for every sourceType,
            including these two (#747: that endpoint now proxies the original server-side from this
            same URL instead of answering 404) - this field is shown as secondary information
            alongside that link (e.g. a tooltip), since the source itself may only be reachable from
            OPAA's own network, not the caller's browser. Null for UPLOAD/FILESYSTEM, whose local
            file path on the server must not be exposed here. A client prefers sourceEntryUrl over
            this field when both are set (an RSS attachment's own file location is less useful than
            the entry page it was found on).

            Deliberately visible to every VIEWER, unlike LibraryResponse's own sourceUrl (masked
            below MANAGER, #507): this field names one document's remote origin, the document deep
            link that is the entire point of #738/#740, not the library's crawl configuration (host,
            proxy, credentials) that #507 protects. Maintainer decision on PR #743 (Epic #740).
          example: https://example.gov/verzeichnis/dienstanweisung-2024.pdf
        errorMessage:
          type: string
          nullable: true
          description: >
            A German, user-facing reason set only while status is FAILED (#434) - why parsing or
            embedding could not complete. Always null for PENDING and INDEXED.
        folderId:
          type: string
          format: uuid
          nullable: true
          description: >
            The folder this document sits in (#821, ADR-0020). Null means the library's root.
        folderPath:
          type: string
          nullable: true
          description: >
            The document's folder chain as a display path, e.g. "Protokolle/2026" (#821) - derived
            from library_folders, never stored. Null for a root-level document (folderId null).
        parentDocumentId:
          type: string
          format: uuid
          nullable: true
          description: >
            Set when this document is an attachment of another document in the same library
            (ADR-0022, Entscheidung 4) - e.g. a PDF attached to an indexed mail, or a file linked
            from an RSS entry's detail page. Null for every top-level document. In GET
            .../documents responses an attachment row always follows its (transitive) top-level
            parent within the same page, so a client can group attachments under their parent
            without a second request (#1184).

    LibraryFolderListItem:
      type: object
      required: [id, name, documentCount]
      description: >
        A direct subfolder shown alongside a folder-scoped GET .../documents response (#821) - a
        lighter projection than LibraryFolderResponse, without parentFolderId/createdAt, which that
        listing has no use for.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Protokolle
        documentCount:
          type: integer
          format: int64
          description: >
            Every document inside this subfolder and every one of its own descendant subfolders,
            recursively - the same semantics as LibraryFolderResponse.documentCount (#821 review:
            a subfolder row here shows the same number a subsequent delete confirmation for it
            would). Computed with one bundled query for every subfolder shown, not one per
            subfolder's own subtree walk.

    LibraryFolderBreadcrumbItem:
      type: object
      required: [id, name]
      description: One link in the breadcrumb chain from a library's root to the requested folder.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Protokolle

    LibraryDocumentPageResponse:
      type: object
      required: [items, page, size, totalElements, folders, breadcrumb]
      properties:
        items:
          type: array
          description: >
            Top-level documents in the requested order, each immediately followed by its attachment
            rows - every (transitive) attachment of a top-level document, in file_path order, each
            carrying parentDocumentId (#1184, ADR-0022 Entscheidung 5). Paging, sorting and
            totalElements operate on the top-level documents only; attachments always appear on
            their parent's page.
          items:
            $ref: "#/components/schemas/LibraryDocumentResponse"
        page:
          type: integer
          description: Zero-based index of the returned page.
        size:
          type: integer
          description: The requested page size (not necessarily items.length for the last page).
        totalElements:
          type: integer
          format: int64
          description: >
            Total number of top-level documents matching the (optional) q filter, across all pages
            (#1184): attachments never count towards totalElements or the page size - they ride
            along with their parent (see items), so a page may contain more than size rows.
        folderId:
          type: string
          format: uuid
          nullable: true
          description: >
            The requested folderId, echoed back (#821). Null both for the library's root and for a
            q search (search is always bibliotheksweit, regardless of folderId).
        folders:
          type: array
          description: >
            The requested folder's direct subfolders (#821). Always empty when q is set - search
            results are a flat, bibliotheksweit list, not folder-scoped.
          items:
            $ref: "#/components/schemas/LibraryFolderListItem"
        breadcrumb:
          type: array
          description: >
            The requested folder's ancestor chain, root-first, ending with the requested folder
            itself (#821). Empty at the library's root and always empty when q is set.
          items:
            $ref: "#/components/schemas/LibraryFolderBreadcrumbItem"

    MetadataValueRequest:
      type: object
      description: >-
        The value a person sets for one core field (#1068): exactly one of textValue (title),
        vocabularyCode (document_type) or dateValue plus datePrecision (document_date), matching the
        field addressed - or, with state NOT_DETERMINABLE and no value at all, the third state
        "kein Wert ermittelbar" (#1069).
      properties:
        state:
          type: string
          enum: [SET, NOT_DETERMINABLE]
          description: >-
            SET - also the meaning of an absent state - stores the value given below. NOT_DETERMINABLE records that a person
            established there is no value to find: valid for every core field, rejected with 400
            together with any value, stored with origin MANUAL and the calling person as actor, and
            never written or cleared by an automatic extraction. For filters and the Beleg it
            behaves like an empty field; the Pflege-Anker does not count it.
        textValue:
          type: string
          nullable: true
          maxLength: 1000
          description: The title text; blank is rejected.
          example: Dienstanweisung zur IT-Nutzung
        vocabularyCode:
          type: string
          nullable: true
          description: A code of the Dokumentart vocabulary; anything else is rejected with 400.
          example: DIENSTANWEISUNG
        dateValue:
          type: string
          nullable: true
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
          description: >-
            The ISO-8601 calendar date; an impossible date is rejected with 400. Padded
            server-side to the first day of what datePrecision leaves unknown.
          example: "2026-03-12"
        datePrecision:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/DatePrecision"
          description: Required together with dateValue.

    MetadataFieldState:
      type: string
      description: >-
        The three states a core field of a document can be in (#1069, metadata-schema.md "Kein Wert
        ermittelbar ist ein dritter Zustand"): EMPTY (not yet established - the open rest the
        Pflege-Anker counts), SET (a value is present) and NOT_DETERMINABLE (a person established
        there is none). NOT_DETERMINABLE behaves like EMPTY for filters and the Beleg-Anzeige, but
        is done, not open.
      enum: [EMPTY, SET, NOT_DETERMINABLE]

    DocumentMetadataFieldResponse:
      type: object
      required: [fieldKey, label, state]
      description: >-
        One core field of a document with everything metadata-schema.md demands a value to carry
        ("Jeder Wert trägt seine Herkunft"). An empty field has value, displayValue and origin
        null; so does a NOT_DETERMINABLE one, which state tells apart from it.
      properties:
        fieldKey:
          type: string
          example: document_type
        state:
          $ref: "#/components/schemas/MetadataFieldState"
        label:
          type: string
          description: The German field label.
          example: Dokumentart
        value:
          type: string
          nullable: true
          description: >-
            The machine-readable value - vocabulary code, ISO-8601 date or the text itself; null
            when the field is empty.
        displayValue:
          type: string
          nullable: true
          description: >-
            What a client shows - the German vocabulary label, or the date at its own precision.
        origin:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/MetadataOrigin"
        datePrecision:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/DatePrecision"
        confidence:
          type: number
          format: double
          nullable: true
          description: Only for a DERIVED value.
        modelId:
          type: string
          nullable: true
          description: Only for a DERIVED value.
        extractionVersion:
          type: integer
          nullable: true
          description: Set for every non-manual value.
        actorUserId:
          type: string
          format: uuid
          nullable: true
          description: The person who set a MANUAL value.
        actorDisplayName:
          type: string
          nullable: true
          description: >-
            The display name of that person, null when the account no longer exists.
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: When the current value was written.

    DocumentMetadataResponse:
      type: object
      required: [documentId, fields]
      properties:
        documentId:
          type: string
          format: uuid
        fields:
          type: array
          description: Every core field in schema order (Titel, Dokumentart, Datum/Stand).
          items:
            $ref: "#/components/schemas/DocumentMetadataFieldResponse"

    BulkMetadataValueRequest:
      type: object
      required: [fieldKey, value, documentIds]
      properties:
        fieldKey:
          type: string
          description: The core field to set on every listed document.
          example: document_type
        value:
          $ref: "#/components/schemas/MetadataValueRequest"
        documentIds:
          type: array
          minItems: 1
          maxItems: 1000
          description: >-
            The chosen documents - ids taken from this library's own document list. Duplicates are
            processed once.
          items:
            type: string
            format: uuid

    BulkMetadataValueResponse:
      type: object
      required: [updatedCount, unchangedCount, rejectedDocumentIds, correlationRef]
      properties:
        updatedCount:
          type: integer
          description: Documents whose value was set or changed - one audit event each.
        unchangedCount:
          type: integer
          description: >-
            Documents that already carried exactly this manual value; nothing written, no event.
        rejectedDocumentIds:
          type: array
          description: >-
            Ids that are not documents of this library; none of them was touched.
          items:
            type: string
            format: uuid
        correlationRef:
          type: string
          description: >-
            The correlationRef every audit event of this call carries, so the whole bulk
            assignment can be read back from the audit log as one operation.

    MetadataFieldMaintenanceResponse:
      type: object
      description: >-
        The Pflege-Anker of one core field in one library (#1069, metadata-schema.md "Der
        Pflege-Anker"): how many of the library's indexed documents still have no value for it -
        absolute and as a share, both side by side, because "120 ohne Wert" means something
        different at 130 than at 12.000 documents. documentsWithoutValue counts only the empty
        state: a field marked "kein Wert ermittelbar" is done, which is what lets the number reach
        zero.
      required:
        [
          fieldKey,
          label,
          totalDocuments,
          documentsWithoutValue,
          missingShare,
          filledDocuments,
          notDeterminableDocuments,
        ]
      properties:
        fieldKey:
          type: string
          example: document_date
        label:
          type: string
          description: The German field label.
          example: Datum/Stand
        totalDocuments:
          type: integer
          format: int64
          description: The library's indexed documents - the base of missingShare.
        documentsWithoutValue:
          type: integer
          format: int64
          description: Documents with neither a value nor a "kein Wert ermittelbar" mark.
        missingShare:
          type: number
          format: double
          description: documentsWithoutValue / totalDocuments, in 0..1; 0 for an empty library.
        filledDocuments:
          type: integer
          format: int64
        notDeterminableDocuments:
          type: integer
          format: int64
          description: Documents a person marked as having no value to find.

    LibraryMetadataMaintenanceResponse:
      type: object
      description: >-
        The Pflege-Anker of one library (#1069), one entry per core field in schema order. Built at
        query time in the rights context of the asking person and never precomputed or cached
        (metadata-schema.md, Rechte-Invariante).
      required: [libraryId, totalDocuments, fields]
      properties:
        libraryId:
          type: string
          format: uuid
        totalDocuments:
          type: integer
          format: int64
        fields:
          type: array
          items:
            $ref: "#/components/schemas/MetadataFieldMaintenanceResponse"

    DocumentTypeVocabularyEntryResponse:
      type: object
      required: [code, label]
      properties:
        code:
          type: string
          example: DIENSTANWEISUNG
        label:
          type: string
          example: Dienstanweisung

    DocumentTypeVocabularyResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DocumentTypeVocabularyEntryResponse"

    LowChunkDocumentResponse:
      type: object
      required: [documentId, libraryId, libraryName, fileName, chunkCount]
      properties:
        documentId:
          type: string
          format: uuid
        libraryId:
          type: string
          format: uuid
        libraryName:
          type: string
          description: >
            The library's current name, or "Unbekannte Bibliothek" if the library no longer resolves
            (deleted between the query and the response being built) - the document is still
            reported rather than silently dropped.
        fileName:
          type: string
        fileSize:
          type: integer
          format: int64
          nullable: true
        chunkCount:
          type: integer

    LowChunkDocumentPageResponse:
      type: object
      required: [items, page, size, totalElements]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LowChunkDocumentResponse"
        page:
          type: integer
          description: Zero-based index of the returned page.
        size:
          type: integer
          description: The requested page size (not necessarily items.length for the last page).
        totalElements:
          type: integer
          format: int64
          description: Total number of flagged documents across all pages.

    DocumentPipelineResponse:
      type: object
      required: [id, currentVersion, handledFormats]
      properties:
        id:
          type: string
          description: >
            The pipeline's stable identity, persisted on every chunk it produced (#1056,
            ingestion-pipelines.md Querschnittsregel (d)) - the value to pass as
            PipelineReindexRequest.pipelineId.
          example: tika-fallback
        currentVersion:
          type: integer
          description: >
            The version of the cut and structure metadata this pipeline currently produces. Raised
            when either changes, never for a fix without an effect on the produced chunks.
        handledFormats:
          type: array
          description: >
            The file formats this pipeline claims, decided from the detected content and not from
            the file extension (#404). Empty for the fallback pipeline, which handles everything no
            other pipeline claimed.
          items:
            type: string
            example: .pdf

    LibraryPipelineVersionResponse:
      type: object
      required: [libraryId, totalChunks, currentVersionChunks, staleChunks, complete]
      properties:
        libraryId:
          type: string
          format: uuid
        totalChunks:
          type: integer
          format: int64
        currentVersionChunks:
          type: integer
          format: int64
          description: Chunks produced by the current version of the pipeline named on them.
        staleChunks:
          type: integer
          format: int64
          description: >
            Chunks below the current version of the pipeline named on them, including the bestand
            written before the pipeline abstraction existed. Counted directly, not derived as
            totalChunks - currentVersionChunks: a chunk naming a pipeline this deployment no longer
            has is neither current nor re-indexable and inflates neither count.
        complete:
          type: boolean
          description: staleChunks == 0 - nothing in this library waits for a version re-index.

    PipelineVersionStatusResponse:
      type: object
      required: [pipelines, libraries]
      properties:
        pipelines:
          type: array
          items:
            $ref: "#/components/schemas/DocumentPipelineResponse"
        libraries:
          type: array
          description: >
            Every library of the caller's own organization holding at least one chunk, sorted by id.
          items:
            $ref: "#/components/schemas/LibraryPipelineVersionResponse"

    PipelineReindexRequest:
      type: object
      required: [pipelineId, belowVersion]
      properties:
        pipelineId:
          type: string
          description: The DocumentPipelineResponse.id whose chunks are to be re-indexed.
          example: tika-fallback
        belowVersion:
          type: integer
          minimum: 1
          description: >
            Only chunks below this version are re-indexed. Chunks written before the pipeline
            abstraction existed count as version 0 and are therefore always included. Rejected with
            400 above the pipeline's own currentVersion: a re-index cannot produce a version the
            pipeline does not have, so every rewritten chunk would still be below the bound and the
            same documents would be selected again on every following batch. A chunk still naming
            the fallback pipeline whose format pipelineId now claims (#1105) is also always
            included regardless of belowVersion - it is unreachable by any other call, not merely
            below a version bound.
        batchSize:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
          description: >
            The maximum number of documents one call processes. The call is meant to be repeated
            until done is true - deliberately not one request that re-indexes a whole bestand, so an
            interrupted run loses at most one batch.

    PipelineReindexResponse:
      type: object
      required:
        [
          reindexedDocuments,
          markedForNextRun,
          skippedDocuments,
          removedOrphanChunkSets,
          done,
        ]
      properties:
        reindexedDocuments:
          type: integer
          description: >
            Documents whose source file was readable within the directories this deployment is
            configured to read, and which were parsed, chunked and stored again on the spot, keeping
            their own document id.
        markedForNextRun:
          type: integer
          description: >
            Documents whose source is remote and can only be re-read by their own connector run;
            marked so that run redoes them instead of skipping them as unchanged. Their chunks stay
            stale until that run happens, which the status figures keep showing.
        skippedDocuments:
          type: integer
          description: >
            Documents this call could not advance: their file lies outside what this deployment may
            read (an allowlist narrowed since indexing, a path no longer resolving underneath its
            library's configured directory), the pipeline produced no chunks for them this time, or
            the document was re-indexed but its chunks still name the fallback pipeline, which is
            counted here instead of as reindexedDocuments to avoid re-selecting it forever. For the
            first two causes, nothing about the document is changed - a working document keeps its
            existing chunks rather than being emptied. The third cause has already read the file,
            replaced its chunks and paid for new embeddings; a persistent case of it is re-parsed
            and re-embedded on every call that requests that pipeline. Regardless of cause, their
            chunks stay visible as outstanding in the status figures.
        removedOrphanChunkSets:
          type: integer
          description: Chunk sets whose document row no longer exists; deleted rather than re-read.
        done:
          type: boolean
          description: >
            True when this call advanced nothing - the signal to stop repeating it. Deliberately
            ignores skippedDocuments: a call that only skipped is exactly the "nothing further is
            possible right now" state, and repeating it would retry the same unreachable documents
            forever.

    MetadataBackfillRequest:
      type: object
      required: [libraryId]
      properties:
        libraryId:
          type: string
          format: uuid
          description: >
            The library whose Altbestand is to be nachgerüstet. Per library on purpose: starting the
            run is the explicit, library-wise release the specification demands, never a side
            effect of anything else.
        batchSize:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
          description: >
            The maximum number of documents one call processes. Repeat until done is true; an
            interrupted run loses at most one batch, and every finished document keeps its result.

    MetadataBackfillResponse:
      type: object
      required: [processedDocuments, markedForNextRun, skippedDocuments, done]
      properties:
        processedDocuments:
          type: integer
          description: >
            Documents whose original file (or, for an RSS entry, its stored headline and publication
            date) was re-read on the spot: core fields stored at the document, filterable keys
            rewritten on its chunks, extraction version recorded - one transaction per document.
        markedForNextRun:
          type: integer
          description: >
            Documents whose source is remote and can only be re-read by their own connector run;
            marked so that run re-reads them, which re-extracts the core fields on every inflow. They
            stay pending in the status figures until that run happens.
        skippedDocuments:
          type: integer
          description: >
            Documents this call could not advance: the file lies outside what this deployment may
            read, has vanished, or its re-extraction failed this time. Nothing about such a document
            changes - it keeps its old fields and chunks, stays pending, and is tried again on the
            next call. Also reported per library as lastSkippedDocuments in the status display.
        done:
          type: boolean
          description: >
            True when this call advanced nothing - the signal to stop repeating it. Ignores
            skippedDocuments for the same reason PipelineReindexResponse.done does.

    CoreMetadataFieldFillResponse:
      type: object
      description: >
        The Füllgrad of one core field in one library (#1067): how many of the library's indexed
        documents carry a value for it. Computed at query time in the administrative context - the
        organization is the rights context here - never precomputed.
      required:
        [
          fieldKey,
          label,
          filledDocuments,
          filledShare,
          notDeterminableDocuments,
          documentsWithoutValue,
          missingShare,
        ]
      properties:
        fieldKey:
          type: string
          example: document_type
        label:
          type: string
          description: The German field label, as the Beleg-Anzeige shows it.
          example: Dokumentart
        filledDocuments:
          type: integer
          format: int64
        filledShare:
          type: number
          format: double
          description: filledDocuments / totalDocuments, in 0..1; 0 for a library without documents.
        notDeterminableDocuments:
          type: integer
          format: int64
          description: >-
            Documents a person marked as "kein Wert ermittelbar" for this field (#1069). Neither
            filled nor open - the reason documentsWithoutValue below is not totalDocuments minus
            filledDocuments.
        documentsWithoutValue:
          type: integer
          format: int64
          description: >-
            The Pflege-Anker of this library and field (#1069): documents with neither a value nor
            a "kein Wert ermittelbar" mark. The same figure GET
            /api/v1/libraries/{libraryId}/metadata/maintenance shows in the library's own settings,
            counted here over the organization instead (the administrative exception of the
            Rechte-Invariante, Beschluss 1 am Epic #1065).
          example: 12
        missingShare:
          type: number
          format: double
          description: documentsWithoutValue / totalDocuments, in 0..1.

    MetadataBackfillStatusResponse:
      type: object
      description: >
        The core-metadata extraction state of one library (#1067, metadata-schema.md "Nachlauf im
        Betrieb"): how much of its indexed bestand carries the current extraction version, how much
        is still pending, and the Füllgrad per core field. Pending documents are a defined,
        permitted operating state - the search keeps running over them with their old fields.
      required:
        [
          extractionVersion,
          totalDocuments,
          currentDocuments,
          pendingDocuments,
          awaitingConnectorRunDocuments,
          lastSkippedDocuments,
          complete,
          fields,
        ]
      properties:
        extractionVersion:
          type: integer
          description: The current CoreMetadataExtractor version every document is measured against.
        totalDocuments:
          type: integer
          format: int64
          description: Indexed documents of the library - the base of every share below.
        currentDocuments:
          type: integer
          format: int64
          description: Indexed documents already at the current extraction version.
        pendingDocuments:
          type: integer
          format: int64
          description: >
            Indexed documents never extracted or extracted with an older version. A superset of
            what a metadata-backfill call selects: it includes the documents in
            awaitingConnectorRunDocuments, which no further call advances.
        awaitingConnectorRunDocuments:
          type: integer
          format: int64
          description: >
            The subset of pendingDocuments whose bytes live on a remote (HTTP directory, remote
            attachment) and whose change markers are cleared - marked for their next connector run,
            which re-reads and re-extracts them. A backfill call reports done while these remain;
            they are the reason pendingDocuments can stay above 0 after a completed run.
        lastSkippedDocuments:
          type: integer
          format: int64
          description: >
            Documents the most recent metadata-backfill call for this library could not advance.
            A process-lifetime figure (ADR-0021, single instance): it resets on restart and is 0
            before the first call.
        complete:
          type: boolean
          description: True when pendingDocuments is 0.
        fields:
          type: array
          description: One entry per core field, in schema order (Titel, Dokumentart, Datum/Stand).
          items:
            $ref: "#/components/schemas/CoreMetadataFieldFillResponse"

    LibraryFolderRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: >
            Trimmed before validation; must not be empty and must not contain "/" (#820) - a
            display path is derived from the folder chain, not stored as a string, so a slash in a
            single folder's own name would be indistinguishable from a path separator.
          example: Protokolle
        parentFolderId:
          type: string
          format: uuid
          nullable: true
          description: >
            The containing folder, or omitted/null to create a root-level folder (ADR-0020: null
            parent_folder_id means the library's root). Must reference an existing folder in the
            same library.

    LibraryFolderRenameRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Same validation as LibraryFolderRequest.name.
          example: Protokolle 2026

    LibraryFolderResponse:
      type: object
      required: [id, libraryId, name, documentCount, createdAt]
      properties:
        id:
          type: string
          format: uuid
        libraryId:
          type: string
          format: uuid
        parentFolderId:
          type: string
          format: uuid
          nullable: true
          description: Null for a root-level folder.
        name:
          type: string
          example: Protokolle
        documentCount:
          type: integer
          format: int64
          description: >
            Total number of documents directly in this folder and every one of its subfolders,
            recursively (#820) - the count a confirmation dialog shows before DELETE removes them
            all (ADR-0020, Entscheidung 5).
        createdAt:
          type: string
          format: date-time

    AssetRole:
      type: string
      description: >
        The graded asset role a grant carries - a ranking deliberately separate from SpaceRole; no
        role name occurs in both. VIEWER uses the asset and sees its configuration, EDITOR
        additionally changes it, MANAGER additionally shares/grants and sets visibility, OWNER
        additionally deletes and transfers ownership. See
        docs/features/spaces-and-assets.md#asset-rollen. Exception for a knowledge library: its
        source connection detail (LibraryResponse's sourcePath/sourceUrl/sourceProxy/
        sourceInsecureSsl/sourceCredentialsSet) is internal server infrastructure, not merely
        "configuration" - it stays hidden from a VIEWER and even an EDITOR, matching the MANAGER
        bar PUT /api/v1/libraries/{libraryId} already enforces for changing it (#507).
      enum: [VIEWER, EDITOR, MANAGER, OWNER]
      example: VIEWER

    PermissionSubjectType:
      type: string
      description: Whether a grant targets a single user or a group.
      enum: [USER, GROUP]
      example: USER

    AssetGrantRequest:
      type: object
      required: [subjectType, subjectId, role]
      properties:
        subjectType:
          $ref: "#/components/schemas/PermissionSubjectType"
        subjectId:
          type: string
          format: uuid
          description: The user or group id, depending on subjectType.
        role:
          $ref: "#/components/schemas/AssetRole"
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Null means the grant never expires. Present from the start even though
            recertification only arrives with #241.

    AssetGrantResponse:
      type: object
      required: [id, subjectType, subjectId, role, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        subjectType:
          $ref: "#/components/schemas/PermissionSubjectType"
        subjectId:
          type: string
          format: uuid
        subjectDisplayName:
          type: string
          nullable: true
          description: >
            The subject's display name (user, falling back to email if the user's display name
            itself is unset) or name (group), resolved server-side so a caller without
            SYSTEM_ADMIN - which GET /v1/admin/users and /v1/admin/groups both require - can still
            see who a grant targets instead of a raw UUID. Null only if the subject row itself no
            longer exists (a deleted user, or a group id from before dissolution tracking) - a
            user's display name being unset does not produce null here, since email is always
            present.
        role:
          $ref: "#/components/schemas/AssetRole"
        expiresAt:
          type: string
          format: date-time
          nullable: true
        grantedByUserId:
          type: string
          format: uuid
          nullable: true
          description: >
            Wer die aktuell eingetragene Rolle verschafft hat - bei einer Rollenaenderung die
            aendernde Person, nicht die, die den Eintrag urspruenglich angelegt hat. Null nur
            bei historischen Eintraegen aus der Zeit vor diesem Feld.
        grantedByDisplayName:
          type: string
          nullable: true
          description: >
            The granter's display name (falling back to email, same as subjectDisplayName),
            resolved server-side for the same reason as subjectDisplayName. Null whenever
            grantedByUserId is null, or if that user row no longer exists.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DirectorySyncOutcome:
      type: string
      description: >
        What a directory synchronisation run did. APPLIED and DRY_RUN both mean the run computed
        a valid diff; the ABORTED_* and UNREACHABLE values mean nothing was written on purpose -
        see #237.
      enum: [APPLIED, DRY_RUN, ABORTED_THRESHOLD, ABORTED_EMPTY_RESULT, UNREACHABLE]
      example: APPLIED

    DirectorySyncGroupChange:
      type: object
      required: [externalId, name]
      properties:
        externalId:
          type: string
          example: directory-guid-1
        name:
          type: string
          example: Referat 50
        previousName:
          type: string
          nullable: true
          description: Only set for a renamed group

    DirectorySyncUserRef:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
          nullable: true

    DirectorySyncMembershipChange:
      type: object
      required: [externalId, name, added, removed]
      description: >
        Which users would gain or lose membership of one group - the level of detail an admin
        needs to decide before a run that would revoke access is applied (see #237's acceptance
        criteria: the dry-run report must show what would change, not only how much).
      properties:
        externalId:
          type: string
          example: directory-guid-1
        name:
          type: string
          example: Referat 50
        added:
          type: array
          items:
            $ref: "#/components/schemas/DirectorySyncUserRef"
        removed:
          type: array
          items:
            $ref: "#/components/schemas/DirectorySyncUserRef"

    DirectorySyncReportResponse:
      type: object
      required:
        - outcome
        - generatedAt
        - groupsCreated
        - groupsRenamed
        - groupsDissolved
        - membershipChanges
        - membershipsAdded
        - membershipsRemoved
        - changedFraction
        - thresholdFraction
        - message
      properties:
        outcome:
          $ref: "#/components/schemas/DirectorySyncOutcome"
        generatedAt:
          type: string
          format: date-time
        groupsCreated:
          type: array
          items:
            $ref: "#/components/schemas/DirectorySyncGroupChange"
        groupsRenamed:
          type: array
          items:
            $ref: "#/components/schemas/DirectorySyncGroupChange"
        groupsDissolved:
          type: array
          items:
            $ref: "#/components/schemas/DirectorySyncGroupChange"
        membershipChanges:
          type: array
          items:
            $ref: "#/components/schemas/DirectorySyncMembershipChange"
        membershipsAdded:
          type: integer
          example: 4
        membershipsRemoved:
          type: integer
          example: 1
        unresolvedMemberCount:
          type: integer
          description: Directory members whose subject matched no known user; skipped, not an error
          example: 0
        changedFraction:
          type: number
          format: double
          description: >
            The worse of two independent risk measures, each compared against the configured
            threshold on its own: the fraction of memberships at risk (removals plus the
            memberships of groups that would be dissolved, relative to the memberships of every
            group that was active before this run or is reactivated by it - a group that stayed
            dissolved and unreported is excluded from this side), and the fraction of active
            groups that would be dissolved this run (relative to all groups active before this
            run - matched-but-unchanged groups are included in this denominator, since they are
            part of what "active" means here). The second measure exists because an
            introduction-phase directory often has ORG_UNIT groups with no members yet, which the
            first measure cannot see a mass dissolution of; it only applies once the active-group
            count or the dissolution count is large enough for a fraction to be meaningful, so a
            single legitimate dissolution in a small organisation is never blocked by it.
          example: 0.05
        thresholdFraction:
          type: number
          format: double
          example: 0.3
        message:
          type: string
          example: Synchronisation angewendet.

    DirectorySyncStatusResponse:
      type: object
      properties:
        lastRunAt:
          type: string
          format: date-time
          nullable: true
        lastOutcome:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/DirectorySyncOutcome"
        lastMessage:
          type: string
          nullable: true
        lastAppliedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the last run that actually applied changes (outcome APPLIED)
        lastChangedFraction:
          type: number
          format: double
          nullable: true

    # #393 - audit revision access path. See
    # docs/features/security-and-compliance.md#zugriffswege-was-es-gibt-und-was-es-nicht-gibt.
    AuditActorKind:
      type: string
      description: Mirrors io.opaa.api.types.ActorKind. Output-only field, never a filter/sort key.
      enum: [USER, SERVICE_ACCOUNT, SYSTEM_PROCESS]
      example: USER

    AuditSubjectKind:
      type: string
      description: Mirrors io.opaa.api.types.AuditSubjectKind.
      enum: [USER, GROUP]
      example: GROUP

    AuditOutcome:
      type: string
      description: Mirrors io.opaa.api.types.AuditOutcome.
      enum: [SUCCESS, DENIED, FAILURE]
      example: SUCCESS

    AuditObjectType:
      type: string
      description: Mirrors io.opaa.api.types.AuditObjectType. The only entry point besides time range,
        event type and correlation ref - never a person.
      enum:
        [
          KNOWLEDGE_LIBRARY,
          SPACE,
          GROUP,
          ASSET_GRANT,
          USER_ACCOUNT,
          API_TOKEN,
          SYSTEM_SETTING,
          AUDIT_LOG,
          DIRECTORY_SYNC_RUN,
        ]
      example: KNOWLEDGE_LIBRARY

    AuditEventType:
      type: string
      description: Mirrors io.opaa.api.types.AuditEventType - the closed first-stage event list.
      enum:
        [
          ASSET_GRANT_GRANTED,
          ASSET_GRANT_CHANGED,
          ASSET_GRANT_REVOKED,
          ASSET_GRANT_EXPIRED,
          ASSET_VISIBILITY_CHANGED,
          ASSET_GRANT_SUSPENDED,
          SPACE_CREATED,
          SPACE_CHANGED,
          SPACE_DELETED,
          SPACE_ARCHIVED,
          LIBRARY_CREATED,
          LIBRARY_CHANGED,
          LIBRARY_DELETED,
          LIBRARY_SOURCE_UPDATED,
          GROUP_CREATED,
          GROUP_CHANGED,
          GROUP_DELETED,
          SPACE_MEMBER_ADDED,
          SPACE_MEMBER_ROLE_CHANGED,
          SPACE_MEMBER_REMOVED,
          GROUP_MEMBER_ADDED,
          GROUP_MEMBER_REMOVED,
          LIBRARY_SHARED_TO_SPACE,
          LIBRARY_DETACHED_FROM_SPACE,
          ASSET_OWNER_CHANGED,
          ASSET_OWNERSHIP_CLAIMED,
          ASSET_SUCCESSION_OPENED,
          SYSTEM_ADMIN_ROLE_GRANTED,
          SYSTEM_ADMIN_ROLE_REVOKED,
          AUDITOR_ROLE_GRANTED,
          AUDITOR_ROLE_REVOKED,
          ACCOUNT_DEACTIVATED,
          ACCOUNT_REAUTHENTICATION_FORCED,
          API_TOKEN_ISSUED,
          API_TOKEN_REVOKED,
          DIRECTORY_SYNC_CHANGE_APPLIED,
          DIRECTORY_SYNC_RUN_COMPLETED,
          GOVERNANCE_SETTINGS_CHANGED,
          AUDIT_LOG_CONFIGURATION_CHANGED,
          MODEL_POLICY_CHANGED,
          CONNECTOR_LIBRARY_SHARE_LIMIT_CHANGED,
          INDEXING_PIPELINE_REINDEX_TRIGGERED,
          INDEXING_METADATA_BACKFILL_TRIGGERED,
          DOCUMENT_METADATA_CHANGED,
          BRANDING_SETTINGS_CHANGED,
          LLM_MODEL_CREATED,
          LLM_MODEL_CHANGED,
          LLM_MODEL_DELETED,
          LLM_MODEL_ACTIVATED,
          LLM_MODEL_DEACTIVATED,
          DIAGNOSTIC_IMPERSONATION_GRANTED,
          DIAGNOSTIC_IMPERSONATION_REVOKED,
          DIAGNOSTIC_CONTEXT_RETENTION_CHANGED,
          LIBRARY_DIAGNOSTICS_LOCK_CHANGED,
          AUDIT_LOG_ACCESSED,
        ]
      example: ASSET_GRANT_REVOKED

    AuditEventResponse:
      type: object
      description: >
        One entry as read back through a revision access path. actorRef/subjectRef are
        pseudonymised, output-only fields - never accepted as a request parameter anywhere in
        this API.
      required:
        [
          eventId,
          recordedAt,
          organizationId,
          actorKind,
          actorRef,
          eventType,
          objectType,
          objectId,
          outcome,
        ]
      properties:
        eventId:
          type: string
          format: uuid
        recordedAt:
          type: string
          format: date-time
        organizationId:
          type: string
          format: uuid
        actorKind:
          $ref: "#/components/schemas/AuditActorKind"
        actorRef:
          type: string
        eventType:
          $ref: "#/components/schemas/AuditEventType"
        objectType:
          $ref: "#/components/schemas/AuditObjectType"
        objectId:
          type: string
        objectLabel:
          type: string
          nullable: true
        subjectKind:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AuditSubjectKind"
        subjectRef:
          type: string
          nullable: true
        before:
          type: string
          nullable: true
        after:
          type: string
          nullable: true
        outcome:
          $ref: "#/components/schemas/AuditOutcome"
        reason:
          type: string
          nullable: true
        correlationRef:
          type: string
          nullable: true

    AuditEventPage:
      type: object
      description: >
        A bounded page, never a full extract - "begrenzte Ergebnismenge" is enforced server-side
        regardless of the requested size.
      required: [events, page, size, hasMore]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/AuditEventResponse"
        page:
          type: integer
        size:
          type: integer
        hasMore:
          type: boolean
          description: True if further, older-page results exist beyond this bounded page.

    DiagnosticTargetKind:
      type: string
      description: >
        Mirrors io.opaa.api.types.DiagnosticTargetKind - whose rights context a diagnosis ran in.
        PERMISSION_PROFILE is the default; USER is the exception requiring a separate befugnis and a
        free-text justification.
      enum: [PERMISSION_PROFILE, USER]
      example: PERMISSION_PROFILE

    DiagnosticImpersonationGrantRequest:
      type: object
      required: [holderUserId, scopeGroupId, validFrom, validUntil]
      properties:
        holderUserId:
          type: string
          format: uuid
        scopeGroupId:
          type: string
          format: uuid
          description: The Organisationseinheit the befugnis applies to - a group of kind ORG_UNIT.
        validFrom:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
          description: At most twelve months after validFrom; there is no "unbefristet" value.

    DiagnosticImpersonationGrantResponse:
      type: object
      required:
        [id, holderUserId, scopeGroupId, validFrom, validUntil, grantedByUserId, grantedAt, active]
      properties:
        id:
          type: string
          format: uuid
        holderUserId:
          type: string
          format: uuid
        scopeGroupId:
          type: string
          format: uuid
        validFrom:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
        grantedByUserId:
          type: string
          format: uuid
        grantedAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          nullable: true
        active:
          type: boolean
          description: Unrevoked and inside its validity window at the time of this response.

    DiagnosticImpersonationGrantListResponse:
      type: object
      required: [grants]
      properties:
        grants:
          type: array
          items:
            $ref: "#/components/schemas/DiagnosticImpersonationGrantResponse"

    DiagnosticContextRetentionRequest:
      type: object
      required: [retentionMonths]
      properties:
        retentionMonths:
          type: integer
          minimum: 1
          maximum: 24

    DiagnosticContextRetentionResponse:
      type: object
      required: [retentionMonths, updatedAt]
      properties:
        retentionMonths:
          type: integer
        lastCutoff:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time

    LibraryDiagnosticsLockRequest:
      type: object
      required: [locked]
      properties:
        locked:
          type: boolean

    LibraryDiagnosticsLockResponse:
      type: object
      required: [libraryId, locked]
      properties:
        libraryId:
          type: string
          format: uuid
        locked:
          type: boolean

    OwnDiagnosticContextEventResponse:
      type: object
      description: >
        One entry as the affected person sees it - when, by whom, and with which justification.
        Deliberately carries neither the test question nor the hits.
      required: [recordedAt]
      properties:
        recordedAt:
          type: string
          format: date-time
        actorDisplayName:
          type: string
          nullable: true
        justification:
          type: string
          nullable: true

    OwnDiagnosticContextEventPage:
      type: object
      required: [events, page, size, hasMore]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/OwnDiagnosticContextEventResponse"
        page:
          type: integer
        size:
          type: integer
        hasMore:
          type: boolean

    DiagnosticContextEventResponse:
      type: object
      description: >
        One protocol entry as the Gesamtprotokoll shows it. actorRef stays a pseudonym, resolvable
        only through the separately held mapping table; the entry carries the identifiers of the
        displayed hits, never the hits themselves. Which kind of target an entry has is visible in
        targetKind.

        Two fields the stored entry carries are deliberately withheld here, because each of them is
        a stable, per-person key that a client could GROUP BY and thereby rebuild "Diagnosen je
        Nutzer" - exactly what Leitplanke (g) rules out: targetRef for a USER target (a stable
        per-person pseudonym; it is present only for a PERMISSION_PROFILE target, where it is the
        profile's label and belongs to nobody), and permissionSnapshot (the rights fingerprint of
        one person, identical across every entry about them until their rights change). Both stay
        in the stored entry, where Leitplanke (f) requires them, and the rights snapshot is
        readable one entry at a time through
        GET /api/v1/audit/diagnostic-context-events/{eventId}, which is the anlassbezogene
        Auswertung Leitplanke (g) allows.

        What this does not claim: that correlating individual rows is impossible. recordedAt,
        actorRef and hitRefs remain, and two entries produced by the same test question against the
        same rights carry the same hitRefs. The response withholds the keys that make grouping by
        person a one-step operation as long as the test questions vary - with a single, standardised
        test question, hitRefs itself groups in one step. It does not turn the protocol into
        unlinkable rows.
      required:
        [eventId, recordedAt, actorRef, targetKind, testQuestion, hitCount, hitRefs]
      properties:
        eventId:
          type: string
          format: uuid
        recordedAt:
          type: string
          format: date-time
        actorRef:
          type: string
        targetKind:
          $ref: "#/components/schemas/DiagnosticTargetKind"
        targetRef:
          type: string
          nullable: true
        testQuestion:
          type: string
        hitCount:
          type: integer
          description: >
            The number of hits the diagnosis actually displayed. hitRefs may name fewer of them: an
            oversized identifier list is truncated and then ends in a marker naming how many
            identifiers were left out, so the two fields never diverge silently.
        hitRefs:
          type: string
        justification:
          type: string
          nullable: true

    DiagnosticContextEventPage:
      type: object
      description: >
        A bounded page and nothing else - no totals per target person, no counts, no grouping. The
        absence is the Zweckbindung of Leitplanke (g), not an omission.
      required: [events, page, size, hasMore]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/DiagnosticContextEventResponse"
        page:
          type: integer
        size:
          type: integer
        hasMore:
          type: boolean

    DiagnosticContextEventDetailResponse:
      type: object
      description: >
        One protocol entry as the single-entry view shows it: every field of the list response plus
        permissionSnapshot, the rights snapshot Leitplanke (f) requires in the stored entry. It is
        published here and only here: in a list it is a stable per-person key a client can GROUP BY
        in one step, whereas one entry fetched under its own reason and its own audit_log record is
        the einzelfall- und anlassbezogene Auswertung Leitplanke (g) provides for. That is a
        difference in cost and traceability, not in possibility - N fetches rebuild the grouping,
        and each of them is separately justified and recorded. targetRef follows the same rule as
        in the list: a profile's identifier is shown, a person's pseudonym is not.
      required:
        [
          eventId,
          recordedAt,
          actorRef,
          targetKind,
          testQuestion,
          hitCount,
          hitRefs,
          permissionSnapshot,
        ]
      properties:
        eventId:
          type: string
          format: uuid
        recordedAt:
          type: string
          format: date-time
        actorRef:
          type: string
        targetKind:
          $ref: "#/components/schemas/DiagnosticTargetKind"
        targetRef:
          type: string
          nullable: true
        testQuestion:
          type: string
        hitCount:
          type: integer
        hitRefs:
          type: string
        permissionSnapshot:
          type: string
        justification:
          type: string
          nullable: true

    AuditIncidentScopePurpose:
      type: string
      description: >
        Mirrors io.opaa.api.types.AuditIncidentScopePurpose - a closed list that deliberately excludes
        arbeitsrechtliche, disziplinarische und leistungsbezogene purposes by omission (Zweckausschluss).
      enum:
        [
          SECURITY_INCIDENT,
          UNAUTHORIZED_ACCESS_SUSPICION,
          DATA_BREACH_INVESTIGATION,
          EXTERNAL_AUDIT_OR_INSPECTION,
        ]
      example: SECURITY_INCIDENT

    AuditIncidentScopeStatus:
      type: string
      description: Mirrors io.opaa.api.types.AuditIncidentScopeStatus.
      enum: [PENDING, APPROVED]
      example: PENDING

    AuditIncidentScopeRequest:
      type: object
      required: [subjectUserId, scopeStart, scopeEnd, purpose, reason]
      properties:
        subjectUserId:
          type: string
          format: uuid
          description: The one person this exception's technical scope names in advance.
        scopeStart:
          type: string
          format: date-time
        scopeEnd:
          type: string
          format: date-time
        purpose:
          $ref: "#/components/schemas/AuditIncidentScopePurpose"
        reason:
          type: string
          minLength: 10
          maxLength: 1000
          description: The documented Anlass required alongside the closed purpose category.

    AuditIncidentScopeResponse:
      type: object
      required:
        [
          id,
          organizationId,
          subjectUserId,
          scopeStart,
          scopeEnd,
          purpose,
          reason,
          requestedByUserId,
          requestedAt,
          status,
        ]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        subjectUserId:
          type: string
          format: uuid
        scopeStart:
          type: string
          format: date-time
        scopeEnd:
          type: string
          format: date-time
        purpose:
          $ref: "#/components/schemas/AuditIncidentScopePurpose"
        reason:
          type: string
        requestedByUserId:
          type: string
          format: uuid
        requestedAt:
          type: string
          format: date-time
        approvedByUserId:
          type: string
          format: uuid
          nullable: true
        approvedAt:
          type: string
          format: date-time
          nullable: true
        usableUntil:
          type: string
          format: date-time
          nullable: true
          description: >
            Set once, at approval - an approved grant is only usable for querying until this
            point, not indefinitely.
        status:
          $ref: "#/components/schemas/AuditIncidentScopeStatus"

    ColorScheme:
      type: string
      description: >
        The colour scheme a deployment starts users off in (#582). SYSTEM follows the operating
        system's own preference and is the OPAA default; LIGHT and DARK are an operator's
        deliberate override. Not a per-user setting - this is the deployment's starting point,
        which a user's own choice may still override in the browser.
      enum: [LIGHT, DARK, SYSTEM]
      example: SYSTEM

    BrandingResponse:
      type: object
      description: >
        The branding in effect - never a partially filled object. Every field carries either the
        operator's configured value or the OPAA default, resolved per field, so a client can
        render from this response alone without knowing what a default even is. logoUrl is the
        one exception: it is absent while no logo is configured, and the client falls back to the
        bundled OPAA logo.
      required: [productName, claim, primaryColor, defaultColorScheme]
      properties:
        productName:
          type: string
          example: OPAA
        claim:
          type: string
          example: Fragen. Belegen. Entscheiden.
        primaryColor:
          type: string
          description: Accent colour as a six-digit hex triplet with a leading '#'.
          pattern: "^#[0-9A-Fa-f]{6}$"
          example: "#1292EE"
        defaultColorScheme:
          $ref: "#/components/schemas/ColorScheme"
        logoUrl:
          type: string
          description: >
            Path the configured logo is served from, carrying a content-derived version parameter
            so a changed logo is fetched immediately while an unchanged one stays cacheable.
            Absent while no logo is configured.
          example: /api/v1/branding/logo?v=3f8a1c2d
        logoContentType:
          type: string
          description: >
            The server-detected media type of the configured logo - informational, for a
            management form that wants to show it. Absent while no logo is configured.
          example: image/png
        logoUpdatedAt:
          type: string
          format: date-time
          description: When the configured logo was last replaced. Absent while none is configured.

    BrandingUpdateRequest:
      type: object
      description: >
        A full replacement of the non-binary branding fields. Every field is optional, and an
        omitted or null one means "the OPAA default applies again" rather than "keep the current
        value" - see the endpoint's own summary.
      properties:
        productName:
          type: string
          description: >
            Empty or omitted means the OPAA default applies again - which is why there is no
            minLength here: a cleared form field is how an operator undoes a customisation.
          maxLength: 60
          example: Landesamt-Assistent
        claim:
          type: string
          description: Empty or omitted means the OPAA default applies again.
          maxLength: 120
          example: Fragen. Belegen. Entscheiden.
        primaryColor:
          type: string
          description: >
            Six-digit hex triplet with a leading '#'. The empty string is accepted alongside it and
            means the OPAA default applies again; anything else is rejected with 400.
          pattern: "^$|^#[0-9A-Fa-f]{6}$"
          example: "#1292EE"
        defaultColorScheme:
          $ref: "#/components/schemas/ColorScheme"

    LlmModelResponse:
      type: object
      description: >
        A managed chat model (Stufe 1, #757). Never carries the API key itself, even redacted -
        only apiKeySet, whether one is stored (docs/features/llm-integration.md#stufe-1-verwaltete-chat-modelle-in-umsetzung).
      required:
        [
          id,
          displayName,
          baseUrl,
          modelIdentifier,
          temperature,
          maxTokens,
          apiKeySet,
          active,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          example: Ollama lokal
        baseUrl:
          type: string
          example: http://ollama:11434/v1
        modelIdentifier:
          type: string
          example: phi3:mini
        temperature:
          type: number
          format: double
          example: 0.7
        maxTokens:
          type: integer
          example: 2000
        apiKeySet:
          type: boolean
          description: Whether an access key is stored - never the key itself.
        active:
          type: boolean
          description: Whether this is the one systemwide active chat model.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    LlmModelRequest:
      type: object
      description: >
        Used for both create and update. On update, apiKey follows the same three-way convention
        BrandingUpdateRequest already uses: omitted (null) leaves the stored key unchanged, an
        empty string clears it, any other value replaces it. On create, an omitted or empty apiKey
        simply means no key is stored - the key is optional (docs/features/llm-integration.md#ein-anbindungsweg-nicht-zwei),
        since a locally operated endpoint regularly requires no authentication at all.
      required: [displayName, baseUrl, modelIdentifier, temperature, maxTokens]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 120
          example: Ollama lokal
        baseUrl:
          type: string
          minLength: 1
          maxLength: 500
          description: >
            The OpenAI-compatible endpoint, including any provider-specific path suffix. Must not
            contain userinfo (https://user:secret@host/v1) - such an address is rejected with 400,
            because a stored base URL is returned by this API and written to the audit log. The
            access key belongs in apiKey.
          example: http://ollama:11434/v1
        modelIdentifier:
          type: string
          minLength: 1
          maxLength: 200
          example: phi3:mini
        temperature:
          type: number
          format: double
          minimum: 0
          maximum: 2
          example: 0.7
        maxTokens:
          type: integer
          minimum: 1
          example: 2000
        apiKey:
          type: string
          nullable: true
          description: >
            Write-only. Omitted (null) on update leaves the stored key unchanged; an empty string
            clears it; any other value replaces it. On create, omitted or empty means no key.

    LlmModelTestRequest:
      type: object
      description: >
        Tests a connection without requiring the entry to be saved first. When modelId is set and
        apiKey is omitted or empty, the stored, decrypted key of that model is used for the probe
        instead of requiring the caller to re-enter a key they can never read back - but only when
        baseUrl is same-origin with modelId's own stored baseUrl; otherwise the request is rejected
        with 400 rather than sending the stored key to a different address.
      required: [baseUrl, modelIdentifier]
      properties:
        baseUrl:
          type: string
          minLength: 1
          description: >
            Must not contain userinfo (https://user:secret@host/v1) - such an address is rejected
            with 400 before any probe, because the probe URI is logged on failure.
          example: http://ollama:11434/v1
        modelIdentifier:
          type: string
          minLength: 1
          example: phi3:mini
        apiKey:
          type: string
          nullable: true
          description: Plaintext key for this test only, never stored.
        modelId:
          type: string
          format: uuid
          nullable: true
          description: >
            When set and apiKey is omitted or empty, reuses that model's stored, decrypted key for
            the probe, provided baseUrl is same-origin with the model's own stored baseUrl - 404 if
            modelId does not exist, 400 if baseUrl is a different origin.

    LlmModelTestResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
        message:
          type: string
          description: German, user-facing outcome - a distinguishable message for unreachable, unauthenticated and unknown-model failures.
          example: Verbindung erfolgreich, Modell hat geantwortet.

    EmbeddingInfoResponse:
      type: object
      description: >
        The embedding model actually configured (#759), read-only - see
        docs/features/llm-integration.md#sofortige-wirkung for why it is not editable here.
      required: [provider, model, dimensions]
      properties:
        provider:
          type: string
          description: Configured embedding provider ("openai" or "ollama").
          example: ollama
        model:
          type: string
          example: nomic-embed-text
        dimensions:
          type: integer
          description: Vector dimensionality of the configured pgvector store.
          example: 1536

    SearchModelRole:
      type: string
      description: >
        The three model roles of the Modell-Schichtenmodell (hybrid-retrieval.md, Arbeitspaket 4):
        reranking sits on the same level as chat and embedding, not inside the search as a built-in
        procedure.
      enum: [CHAT, EMBEDDING, RERANK]
      example: RERANK

    SearchModelRoleState:
      type: string
      description: >
        DISABLED is an explicit statement, not an absence: only a role whose switch is deliberately
        off reports it. UNCONFIGURED and UNREACHABLE are the two Störungszustände - a role that is
        switched on but unbelegt, and one that is belegt but not reachable.
      enum: [ACTIVE, DISABLED, UNCONFIGURED, UNREACHABLE]
      example: DISABLED

    SearchModelRoleStatusResponse:
      type: object
      required: [role, state, faulted, detail]
      properties:
        role:
          $ref: "#/components/schemas/SearchModelRole"
        state:
          $ref: "#/components/schemas/SearchModelRoleState"
        endpoint:
          type: string
          nullable: true
          description: >
            The role's base address, or null when no endpoint is configured. The access key is
            never part of this response, not even shortened.
          example: http://localhost:11434/v1
        modelIdentifier:
          type: string
          nullable: true
          example: qwen3:8b
        faulted:
          type: boolean
          description: >
            Whether this role's state is a Störungsmeldung rather than a Fußnote - true for exactly
            UNCONFIGURED and UNREACHABLE. Carried explicitly so a client cannot decide it from a
            state enum that may gain further values.
        detail:
          type: string
          description: The user-facing German explanation of this state.

    SearchPath:
      type: string
      enum: [VECTOR, FULL_TEXT]
      example: FULL_TEXT

    SearchPathState:
      type: string
      description: >
        INCOMPLETE is the state hybrid-retrieval.md demands be visible rather than only noticeable
        in bad answers: the path runs, but not over the whole bestand yet.
      enum: [ACTIVE, DISABLED, INCOMPLETE]
      example: INCOMPLETE

    SearchPathStatusResponse:
      type: object
      required: [path, state, detail]
      properties:
        path:
          $ref: "#/components/schemas/SearchPath"
        state:
          $ref: "#/components/schemas/SearchPathState"
        detail:
          type: string
          description: The user-facing German explanation of this state.

    LibraryIndexState:
      type: string
      description: >
        EMPTY - the library holds no chunk at all. READY - every chunk this index needs is there.
        INCOMPLETE - chunks are missing from this index, so the library is never shown as
        flawlessly READY while it is quietly missing content the search cannot find. Nothing
        repairs such a gap in the background (#1270): the remedy is a reindex.
      enum: [EMPTY, READY, INCOMPLETE]
      example: INCOMPLETE

    LibrarySearchStatusResponse:
      type: object
      required:
        [
          libraryId,
          libraryName,
          documentCount,
          indexedDocumentCount,
          pendingDocumentCount,
          failedDocumentCount,
          lowChunkDocumentCount,
          chunkCount,
          vectorChunkCount,
          vectorIndexState,
          fullTextIndexState,
          fullTextIndexedChunks,
          fullTextMissingChunks,
          metadataBackfill,
        ]
      properties:
        libraryId:
          type: string
          format: uuid
        libraryName:
          type: string
          example: Satzungen & Gebührenordnungen
        documentCount:
          type: integer
          format: int64
        indexedDocumentCount:
          type: integer
          format: int64
        pendingDocumentCount:
          type: integer
          format: int64
          description: The Rückstand - documents still waiting to be indexed.
        failedDocumentCount:
          type: integer
          format: int64
        lowChunkDocumentCount:
          type: integer
          format: int64
          description: >
            Documents geführt as INDEXED with null or auffällig wenige chunks (#1055/#1090) - a
            permanent operational metric, not a one-off cleanup number.
        chunkCount:
          type: integer
          format: int64
          description: Chunks the documents of this library are recorded as having produced.
        vectorChunkCount:
          type: integer
          format: int64
          description: >
            Chunks of this library that actually sit in the vector store - the reference count the
            full-text index is measured against. A visible gap to chunkCount means the two stores
            disagree, which is itself the finding.
        lastIndexedAt:
          type: string
          format: date-time
          nullable: true
          description: The latest indexing time across this library's documents; null if none ran.
        vectorIndexState:
          $ref: "#/components/schemas/LibraryIndexState"
        fullTextIndexState:
          $ref: "#/components/schemas/LibraryIndexState"
        fullTextIndexedChunks:
          type: integer
          format: int64
        fullTextMissingChunks:
          type: integer
          format: int64
          description: >
            Counted by anti-join, never derived as total minus indexed - see
            FullTextIndexFillState's own documentation for why the two counts cannot be subtracted.
            The same data source the "Volltextpfad inaktiv oder unvollständig" alarm reads.
        metadataBackfill:
          $ref: "#/components/schemas/MetadataBackfillStatusResponse"

    SearchStatusResponse:
      type: object
      required: [modelRoles, searchPaths, libraries]
      properties:
        modelRoles:
          type: array
          items:
            $ref: "#/components/schemas/SearchModelRoleStatusResponse"
        searchPaths:
          type: array
          items:
            $ref: "#/components/schemas/SearchPathStatusResponse"
        libraries:
          type: array
          description: Every library of the caller's own organization, by name.
          items:
            $ref: "#/components/schemas/LibrarySearchStatusResponse"

    SearchPermissionProfileResponse:
      type: object
      required: [id, name, libraryCount]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Sachbearbeitung Bürgerbüro
        libraryCount:
          type: integer
          description: How many libraries this profile may read.

    SearchDiagnosisContextType:
      type: string
      description: >
        SELF runs in the calling administrator's own rights context; PERMISSION_PROFILE runs in a
        group's; USER runs in one named person's (#1150). USER is the exception of
        Berechtigungs-Leitplanke (d): it needs the "Sicht als" befugnis and a free-text
        justification, it is never the preselected context, and it runs only through
        ForeignDiagnosticContextService - the one path that also subtracts diagnosegesperrte
        libraries and writes the protocol entry.
      enum: [SELF, PERMISSION_PROFILE, USER]
      example: PERMISSION_PROFILE

    SearchDiagnosisContextResponse:
      type: object
      required: [permissionProfiles, personContextAvailable, personContextHint]
      properties:
        permissionProfiles:
          type: array
          description: >
            The profiles of the caller's own organization, by name. Empty where the organization
            has no groups - a permission profile is a group, and none are derived from grant
            patterns.
          items:
            $ref: "#/components/schemas/SearchPermissionProfileResponse"
        personContextAvailable:
          type: boolean
          description: >
            Whether the caller currently holds a valid, unrevoked "Sicht als" befugnis. False makes
            the person context unselectable in the user interface; the endpoint enforces the same
            rule again and answers 403 regardless of what a client sends.
        personContextHint:
          type: string
          description: The German explanation of that permission, shown next to the disabled choice.

    SearchDiagnosisRequest:
      type: object
      required: [question, contextType]
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 1000
          description: >
            A freshly entered test question. There is no way to run this against an existing chat:
            chats are space-eigener, zunächst privater Inhalt, and this page never reads them.
          example: Was gilt bei Gebührenbefreiung wegen Bedürftigkeit?
        contextType:
          $ref: "#/components/schemas/SearchDiagnosisContextType"
        permissionProfileId:
          type: string
          format: uuid
          nullable: true
          description: >
            Required for PERMISSION_PROFILE, rejected with 400 for SELF and USER. An unknown id
            yields 404.
        targetUserId:
          type: string
          format: uuid
          nullable: true
          description: >
            The person whose rights context to assume. Required for USER, rejected with 400
            otherwise, and rejected with 400 when it names the caller themselves - a run in one's
            own rights context is not a "Sicht als".
        justification:
          type: string
          maxLength: 1000
          nullable: true
          description: >
            The free-text justification Berechtigungs-Leitplanke (d) requires for a person context.
            Mandatory for USER - a person context without one is not executed - and carried into the
            protocol entry. Ignored for the other context types, which write no entry.
        trackedDocumentId:
          type: string
          format: uuid
          nullable: true
          description: >
            A document to follow through the whole run. Without it the response still lists every
            document a search stage found; with it, the response additionally states plainly
            whether that document was outside the search scope, never retrieved, displaced at a
            named stage, or in the final selection - the distinction between an indexing problem
            and a ranking problem.

    RetrievalStage:
      type: string
      description: The named stages of the retrieval pipeline (hybrid-retrieval.md, Arbeitspaket 1).
      enum:
        [
          SEARCH_SCOPE,
          SUB_QUERY_DECOMPOSITION,
          VECTOR_SEARCH,
          FULL_TEXT_SEARCH,
          MMR_SELECTION,
          RANK_FUSION,
          RERANK,
          DOCUMENT_COMPLETION,
        ]
      example: RANK_FUSION

    RetrievalStageStatus:
      type: string
      description: >
        Whether a registered stage ran. A stage that did not run still appears in the protocol - a
        stage silently missing is the failure the protocol exists to prevent. UNAVAILABLE means the
        stage was switched on but could not do its work - its model role is unbound or its endpoint
        did not answer; the run continued without it.
      enum: [EXECUTED, DISABLED, NOT_REACHED, UNAVAILABLE]
      example: EXECUTED

    RetrievalCandidateOutcome:
      type: string
      enum: [ADDED, KEPT, DROPPED]
      example: DROPPED

    RetrievalVerdictReason:
      type: string
      description: >
        The fixed vocabulary a stage attaches to its verdict - a closed set rather than free text,
        so a consumer can group and translate it instead of parsing sentences.
      enum:
        [
          RETRIEVED_BY_SEARCH,
          WITHIN_BUDGET,
          OUTSIDE_LIST_BUDGET,
          OUTSIDE_FUSION_BUDGET,
          OUTSIDE_RERANK_BUDGET,
          COMPLETED_AS_SIBLING,
          EVICTED_BY_DOCUMENT_COMPLETION_TIER_1,
          EVICTED_BY_DOCUMENT_COMPLETION_TIER_2,
        ]
      example: OUTSIDE_FUSION_BUDGET

    RetrievalVerdictResponse:
      type: object
      required: [chunkId, documentKey, outcome, reason]
      properties:
        chunkId:
          type: string
        documentKey:
          type: string
          description: >
            The chunk's document grouping key - the level the question "why is document Z not in
            the answer?" is actually asked at.
        documentTitle:
          type: string
          nullable: true
          description: File name of the document, or null if it is no longer resolvable.
        libraryName:
          type: string
          nullable: true
        outcome:
          $ref: "#/components/schemas/RetrievalCandidateOutcome"
        reason:
          $ref: "#/components/schemas/RetrievalVerdictReason"
        listLabel:
          type: string
          nullable: true
          description: Which candidate list this verdict refers to; null once the lists are fused.
        rank:
          type: integer
          nullable: true
          description: >
            The candidate's 1-based position in the ordering this stage decided against. Ranks stay
            comparable across search methods, unlike value.
        value:
          type: number
          format: double
          nullable: true
          description: >
            The stage-internal number the decision was made on. Deliberately not comparable across
            stages, nor across search methods within one.

    RetrievalStageResponse:
      type: object
      required: [stage, status, incomingCount, outgoingCount, notes, verdicts]
      properties:
        stage:
          $ref: "#/components/schemas/RetrievalStage"
        status:
          $ref: "#/components/schemas/RetrievalStageStatus"
        incomingCount:
          type: integer
        outgoingCount:
          type: integer
          description: >
            Both counts are list entries, not distinct chunks: the same chunk found by two
            sub-queries is two entries before fusion and one after.
        notes:
          type: array
          items:
            type: string
        verdicts:
          type: array
          items:
            $ref: "#/components/schemas/RetrievalVerdictResponse"

    DiagnosisSelectionEntryResponse:
      type: object
      required: [rank, chunkId, documentKey]
      properties:
        rank:
          type: integer
          description: 1-based position in the final selection.
        chunkId:
          type: string
        documentKey:
          type: string
        documentTitle:
          type: string
          nullable: true
        libraryName:
          type: string
          nullable: true

    TrackedDocumentOutcome:
      type: string
      description: >
        OUTSIDE_SEARCH_SCOPE - the context may not read this document's library, so no search could
        have reached it. IN_LOCKED_AREA - its library is diagnosegesperrt and was left out of the
        run, which says nothing about the target person's rights (#1150). NOT_RETRIEVED - inside the
        scope, but no search stage found any of its chunks: an indexing or chunking problem.
        DISPLACED - found and dropped at a named stage: a ranking problem. IN_FINAL_SELECTION - it
        is in the Endauswahl.
      enum:
        [OUTSIDE_SEARCH_SCOPE, IN_LOCKED_AREA, NOT_RETRIEVED, DISPLACED, IN_FINAL_SELECTION]
      example: DISPLACED

    TrackedDocumentResponse:
      type: object
      required: [documentId, outcome, retrievedChunkCount, selectedChunkCount]
      properties:
        documentId:
          type: string
          format: uuid
        fileName:
          type: string
          nullable: true
          description: >
            Null for a document outside the searched scope of a person context: naming it would
            describe a library that run did not search, and for IN_LOCKED_AREA it would be exactly
            the Dokumenttitel Berechtigungs-Leitplanke (e) rules out.
        libraryId:
          type: string
          format: uuid
          nullable: true
        libraryName:
          type: string
          nullable: true
          description: Null under the same rule as fileName.
        outcome:
          $ref: "#/components/schemas/TrackedDocumentOutcome"
        displacedAtStage:
          allOf:
            - $ref: "#/components/schemas/RetrievalStage"
          nullable: true
          description: Set only for DISPLACED - the first stage that dropped one of its chunks.
        displacedReason:
          allOf:
            - $ref: "#/components/schemas/RetrievalVerdictReason"
          nullable: true
        retrievedChunkCount:
          type: integer
          description: How many of this document's chunks any search stage returned.
        selectedChunkCount:
          type: integer
          description: How many of them are in the final selection.

    SearchDiagnosisResponse:
      type: object
      required:
        [
          question,
          contextType,
          contextLabel,
          executedAt,
          searchScope,
          searchQueries,
          stages,
          finalSelection,
          lockedLibraryCount,
        ]
      properties:
        question:
          type: string
        contextType:
          $ref: "#/components/schemas/SearchDiagnosisContextType"
        contextLabel:
          type: string
          description: The German label of the rights context this run used.
        executedAt:
          type: string
          format: date-time
          description: >
            When this run happened. The diagnosis answers the Jetzt-Zustand only; it is no
            Zugriffshistorien-Nachweis, and this value dates the answer rather than allowing one.
        searchScope:
          type: array
          description: >
            The libraries the run was allowed to search - the permission filter every stage
            applied, never widened by any of them.
          items:
            $ref: "#/components/schemas/SearchedLibrary"
        searchQueries:
          type: array
          items:
            type: string
        stages:
          type: array
          description: One entry per registered stage, in execution order, whether it ran or not.
          items:
            $ref: "#/components/schemas/RetrievalStageResponse"
        finalSelection:
          type: array
          items:
            $ref: "#/components/schemas/DiagnosisSelectionEntryResponse"
        lockedLibraryCount:
          type: integer
          description: >
            How many libraries of the target rights context were left out as diagnosegesperrt
            (Berechtigungs-Leitplanke (e)). Their existence is named, nothing from inside them is:
            no name, no hit, no count of documents. Always 0 outside the person context, where the
            lock does not apply.
        trackedDocument:
          allOf:
            - $ref: "#/components/schemas/TrackedDocumentResponse"
          nullable: true
          description: Present only when the request named a trackedDocumentId.

    ChunkInspectionResponse:
      type: object
      required: [chunkId, documentId, libraryId, content, metadata]
      properties:
        chunkId:
          type: string
        documentId:
          type: string
          format: uuid
        documentTitle:
          type: string
          nullable: true
          description: File name of the document.
        libraryId:
          type: string
          format: uuid
          nullable: true
        libraryName:
          type: string
          nullable: true
        chunkIndex:
          type: integer
          nullable: true
          description: >
            The chunk's 0-based position within its document as the pipeline recorded it; null for
            a chunk stored without a chunk_index metadatum.
        content:
          type: string
          description: The stored chunk text, including any context prefix the pipeline prepended.
        metadata:
          type: object
          additionalProperties: true
          description: >
            Every metadata key the vector store holds for this chunk (document_id, chunk_index,
            library_id, file_name, pipeline keys such as location). Never the embedding.

    DocumentChunksResponse:
      type: object
      required: [documentId, libraryId, chunkCount, chunks]
      properties:
        documentId:
          type: string
          format: uuid
        documentTitle:
          type: string
          nullable: true
        libraryId:
          type: string
          format: uuid
          nullable: true
        libraryName:
          type: string
          nullable: true
        chunkCount:
          type: integer
          description: >
            The chunk count the document entity recorded when it was last indexed - compare with
            the length of chunks to spot a stale or partially written index.
        chunks:
          type: array
          description: The stored chunks ordered by chunkIndex.
          items:
            $ref: "#/components/schemas/ChunkInspectionResponse"

  parameters:
    AuditFrom:
      name: from
      in: query
      required: true
      description: >
        Start of the mandatory, bounded time range (inclusive). The range (to - from) must not
        exceed 92 days (#393 code review, finding 3) - wide enough for the specification's own
        "alle Rechteänderungen zwischen dem 1. und dem 31. März"-style queries, not wide enough to
        serve as a disguised full-history extract. A wider request is rejected with 400, not
        clamped; a multi-year review chains several bounded calls, each auditable on its own.
      schema:
        type: string
        format: date-time
    AuditTo:
      name: to
      in: query
      required: true
      description: End of the mandatory, bounded time range (inclusive) - see AuditFrom.
      schema:
        type: string
        format: date-time
    AuditPage:
      name: page
      in: query
      required: false
      description: >
        A value beyond page index 49 (50 pages total) is rejected with 400, not clamped (#393
        code review, finding 3; #393 re-review, nit 3) - AuditSize alone only bounds a single
        page; without this, paging through page=0..n against a wide time range would turn
        "bounded per page" back into an effectively unbounded full extract in slices.
      schema:
        type: integer
        minimum: 0
        default: 0
    AuditSize:
      name: size
      in: query
      required: false
      description: Capped server-side at 200 regardless of the requested value - see AuditPage.
      schema:
        type: integer
        minimum: 1
        default: 50
    AuditReason:
      name: reason
      in: query
      required: true
      description: >
        The mandatory Anlass for this access to audit_log itself (#394,
        docs/features/security-and-compliance.md#zugriffswege-was-es-gibt-und-was-es-nicht-gibt):
        "der Anlass ist bei diesen Einträgen ein Pflichtfeld; eine Abfrage ohne Anlass wird
        abgewiesen". A missing or blank reason is rejected with 400 - and, per the same
        specification, the rejected attempt itself is recorded with its own audit_log entry, not
        merely refused. Required here at the contract level even though the server binding accepts
        a missing value: the rejection has to reach the application to be logged, rather than being
        short-circuited by a generic "missing parameter" error.
      schema:
        type: string
        maxLength: 1000

  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: Payload too large
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Service temporarily unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
