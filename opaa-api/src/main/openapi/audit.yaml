# Topic "audit": its tags, paths and the components only this topic uses.
# Merged with all other fragments at build time, see root.yaml.
tags:
  - name: audit
    description: Audit trail, point-in-time access and incident scopes.
paths:
  # #393: exactly four revision access paths, each with a mandatory time range and a bounded
  # result set - see docs/features/security-and-compliance.md#zugriffswege-was-es-gibt-und-was-es-nicht-gibt.
  # There is deliberately no `actor`/`actorRef` query parameter on any of them and no `sort`
  # parameter at all: actorRef is output-only, never an entry point (AUDITOR role only).
  /api/v1/audit/events/by-object:
    get:
      operationId: listAuditEventsByObject
      tags: [audit]
      summary: >
        Revision access path "nach Objekt" (AUDITOR role required): every event recorded against
        one object, within a mandatory time range. objectType=USER_ACCOUNT is rejected with 400
        (#393 code review, finding 2): a USER_ACCOUNT object's object_id is that person's
        pseudonym - the same pseudonym actorRef carries on that same person's own actions
        elsewhere in the log - so accepting it here would reconstruct exactly the excluded view
        "alle Ereignisse, bei denen Person X betroffen war" (read a pseudonym off actorRef via
        by-time-range, then feed it back in as objectId). The legitimate need behind a
        USER_ACCOUNT-scoped question is served by by-time-range/by-event-type (no person focus)
        or, for a genuinely person-scoped question, by the freigegebene anlassbezogene Klärung
        or the Rechtehistorie (#238) - never by this path.
      parameters:
        - name: objectType
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/AuditObjectType"
        - name: objectId
          in: query
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/AuditFrom"
        - $ref: "#/components/parameters/AuditTo"
        - $ref: "#/components/parameters/AuditPage"
        - $ref: "#/components/parameters/AuditSize"
        - $ref: "#/components/parameters/AuditReason"
      responses:
        "200":
          description: Bounded page of matching audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/audit/events/by-time-range:
    get:
      operationId: listAuditEventsByTimeRange
      tags: [audit]
      summary: >
        Revision access path "nach Zeitraum" (AUDITOR role required): every event recorded within
        a mandatory time range, regardless of object.
      parameters:
        - $ref: "#/components/parameters/AuditFrom"
        - $ref: "#/components/parameters/AuditTo"
        - $ref: "#/components/parameters/AuditPage"
        - $ref: "#/components/parameters/AuditSize"
        - $ref: "#/components/parameters/AuditReason"
      responses:
        "200":
          description: Bounded page of matching audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/audit/events/by-event-type:
    get:
      operationId: listAuditEventsByEventType
      tags: [audit]
      summary: >
        Revision access path "nach Ereignisart" (AUDITOR role required): every event of one type,
        within a mandatory time range.
      parameters:
        - name: eventType
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/AuditEventType"
        - $ref: "#/components/parameters/AuditFrom"
        - $ref: "#/components/parameters/AuditTo"
        - $ref: "#/components/parameters/AuditPage"
        - $ref: "#/components/parameters/AuditSize"
        - $ref: "#/components/parameters/AuditReason"
      responses:
        "200":
          description: Bounded page of matching audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/audit/events/by-correlation:
    get:
      operationId: listAuditEventsByCorrelation
      tags: [audit]
      summary: >
        Revision access path "nach Vorgang" (AUDITOR role required): every event sharing one
        correlation_ref (e.g. one directory sync run), within a mandatory time range.
      parameters:
        - name: correlationRef
          in: query
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/AuditFrom"
        - $ref: "#/components/parameters/AuditTo"
        - $ref: "#/components/parameters/AuditPage"
        - $ref: "#/components/parameters/AuditSize"
        - $ref: "#/components/parameters/AuditReason"
      responses:
        "200":
          description: Bounded page of matching audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/audit/access-as-of:
    get:
      operationId: listAccessAsOf
      tags: [audit]
      summary: >
        Stichtagsauskunft "wer durfte dieses Objekt lesen" (AUDITOR role required, #1822,
        ADR-0036 Entscheidung 8)
      description: >
        The reading path of the Rechtehistorie, and the counterpart of the Suchdiagnose: the
        diagnosis answers the present, this one the past, and neither replaces the other
        (hybrid-retrieval.md, Berechtigungs-Leitplanke (b)).

        Exactly one named object per query, by construction: objectType plus objectId, never a
        space-wide, unit-wide or filtered query. Without that rule an AUDITOR would assemble the
        rights profile of every person of one unit from thirty object queries, without a Vollmacht.
        The person entry ("what could person X read") is not part of this endpoint and stays closed
        until #391/#395.

        The time range is mandatory and bounded exactly as every other audit access path is (92
        days, page index 49, page size 200); a wider request is rejected, never trimmed. The bounds
        limit the work, not only the output: a window in which one source contributes more than
        2000 intervals, or whose composed answer would exceed 5000 access periods, is refused with
        400 and the advice to narrow the window - a trimmed answer would look complete.

        The answer carries retentionCutoff/beyondRetention and sourcesNotCovered, so neither the
        retention gap nor the sources without a history (system role, ownership, capability,
        account state) read as "nobody had access". Every call writes a PERMISSION_HISTORY_ACCESSED
        entry, the rejected attempt included.
      parameters:
        - name: objectType
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/AccessAsOfObjectType"
        - name: objectId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/AuditFrom"
        - $ref: "#/components/parameters/AuditTo"
        - $ref: "#/components/parameters/AuditPage"
        - $ref: "#/components/parameters/AuditSize"
        - $ref: "#/components/parameters/AuditReason"
      responses:
        "200":
          description: Bounded page of access intervals inside the requested window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessAsOfPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/audit/connection-log:
    get:
      operationId: listConnectionLog
      tags: [audit]
      summary: >
        The connection log (AUDITOR role required, ADR-0041 Entscheidung 7): who connected,
        reconnected or disconnected which profile, and when a connection expired, was cut off by the
        emergency shutdown or deleted.
      description: >
        Bounded exactly like every other audit access path: a mandatory reason and time range of
        at most 92 days, a capped page size and page depth. The system administration does not read
        it. Optional filters narrow by event type and profile; there is deliberately no filter by
        person. An entry carries no token, no account name at the provider and no library. Every
        call writes a CONNECTION_LOG_ACCESSED entry into the audit log, the rejected attempt
        included.
      parameters:
        - $ref: "#/components/parameters/AuditFrom"
        - $ref: "#/components/parameters/AuditTo"
        - $ref: "#/components/parameters/AuditPage"
        - $ref: "#/components/parameters/AuditSize"
        - $ref: "#/components/parameters/AuditReason"
        - name: eventType
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ConnectionLogEventType"
        - name: profileId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Bounded page of connection log entries, oldest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionLogPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/audit/connection-log/profiles:
    get:
      operationId: listConnectionLogProfiles
      tags: [audit]
      summary: The profiles the connection log has entries for (AUDITOR role required)
      description: >
        Every profile with at least one entry in the connection log of the caller's
        organization, by its last name the log recorded, and whether it has been deleted since -
        the choices of the profile filter of listConnectionLog, read from the log itself so the
        revision needs no read access to the administration. Names no person, so the call is not
        recorded in the audit log.
      responses:
        "200":
          description: The logged profiles, by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConnectionLogProfile"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/connection-log/retention:
    get:
      operationId: getConnectionLogRetention
      tags: [audit]
      summary: >
        Reads the retention period of the connection log (system admin only). Twelve months by
        default, configurable between 6 and 24; there is no field to switch the deletion off.
      responses:
        "200":
          description: Current retention configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionLogRetentionResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: updateConnectionLogRetention
      tags: [audit]
      summary: >
        Changes the retention period of the connection log (system admin only). The change is a
        governance event (CONNECTION_LOG_RETENTION_CHANGED) with the old and the new value. A
        shortening takes effect with the next daily pass, in full; a lengthening takes effect at
        once and takes nothing back.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionLogRetentionRequest"
      responses:
        "200":
          description: Retention configuration updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionLogRetentionResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/audit/incident-scopes:
    post:
      operationId: requestAuditIncidentScope
      tags: [audit]
      summary: >
        Requests the one exception to "kein Personenfilter" - the anlassbezogene Klärung
        (AUDITOR role required): names person, time range and purpose in advance. Created PENDING;
        unusable for querying until a second, different AUDITOR approves it via the approve
        endpoint (Vier-Augen-Prinzip).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditIncidentScopeRequest"
      responses:
        "201":
          description: Incident scope requested, awaiting approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditIncidentScopeResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/audit/incident-scopes/{scopeId}/approve:
    parameters:
      - name: scopeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: approveAuditIncidentScope
      tags: [audit]
      summary: >
        Approves a requested incident scope (AUDITOR role required). Rejected if the approver is
        the same person as the requester (Selbstfreigabe) or the scope was already approved.
      responses:
        "200":
          description: Incident scope approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditIncidentScopeResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/audit/incident-scopes/{scopeId}/events:
    parameters:
      - name: scopeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listAuditEventsByIncidentScope
      tags: [audit]
      summary: >
        The one personenbezogene query path (AUDITOR role required): every event whose actor is
        the scope's named person, technically bounded to the approved scope's person and time
        range. Not callable before approval; a requested from/to outside the approved scope's time
        range is rejected rather than silently clamped.
      parameters:
        - $ref: "#/components/parameters/AuditFrom"
        - $ref: "#/components/parameters/AuditTo"
        - $ref: "#/components/parameters/AuditPage"
        - $ref: "#/components/parameters/AuditSize"
        - $ref: "#/components/parameters/AuditReason"
      responses:
        "200":
          description: Bounded page of matching audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/permission-history/retention:
    get:
      operationId: getPermissionHistoryRetention
      tags: [audit]
      summary: >
        Reads the maximum retention period of the rights history (system admin only). 36 months by
        default, configurable between 12 and 120 - the same bounds as the protocol's own retention.
        There is no field to switch the deletion off, here or anywhere else.
      responses:
        "200":
          description: Current retention configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionHistoryRetentionResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: updatePermissionHistoryRetention
      tags: [audit]
      summary: >
        Changes the maximum retention period of the rights history (system admin only). The change
        is a governance event. A shortening takes effect with the next monthly pass, in full; a
        lengthening takes effect at once and takes nothing back - what is already deleted does not
        come back.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermissionHistoryRetentionRequest"
      responses:
        "200":
          description: Retention configuration updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionHistoryRetentionResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  schemas:
    # #393 - audit revision access path. See
    # docs/features/security-and-compliance.md#zugriffswege-was-es-gibt-und-was-es-nicht-gibt.
    AuditActorKind:
      type: string
      description: Mirrors io.opaa.api.types.ActorKind. Output-only field, never a filter/sort key.
      enum: [USER, SERVICE_ACCOUNT, SYSTEM_PROCESS]
      example: USER

    AuditSubjectKind:
      type: string
      description: Mirrors io.opaa.api.types.AuditSubjectKind.
      enum: [USER, GROUP]
      example: GROUP

    AuditOutcome:
      type: string
      description: Mirrors io.opaa.api.types.AuditOutcome.
      enum: [SUCCESS, DENIED, FAILURE]
      example: SUCCESS

    AuditObjectType:
      type: string
      description: Mirrors io.opaa.api.types.AuditObjectType. The only entry point besides time range,
        event type and correlation ref - never a person.
      enum:
        [
          KNOWLEDGE_LIBRARY,
          SPACE,
          GROUP,
          ASSET_GRANT,
          USER_ACCOUNT,
          API_TOKEN,
          SYSTEM_SETTING,
          AUDIT_LOG,
          DIRECTORY_SYNC_RUN,
          PROMPT_LIBRARY,
          PROMPT,
        ]
      example: KNOWLEDGE_LIBRARY

    AuditEventType:
      type: string
      description: Mirrors io.opaa.api.types.AuditEventType - the closed first-stage event list.
      enum:
        [
          ASSET_GRANT_GRANTED,
          ASSET_GRANT_CHANGED,
          ASSET_GRANT_REVOKED,
          ASSET_GRANT_EXPIRED,
          ASSET_VISIBILITY_CHANGED,
          ASSET_EXTERNAL_ACCESS_CHANGED,
          ASSET_EXTERNAL_ACCESS_EXPIRED,
          SPACE_CREATED,
          SPACE_CHANGED,
          SPACE_DELETED,
          SPACE_ARCHIVED,
          LIBRARY_CREATED,
          LIBRARY_CHANGED,
          LIBRARY_DELETED,
          PRIVATE_LIBRARY_ERASED,
          PROMPT_LIBRARY_CREATED,
          PROMPT_LIBRARY_CHANGED,
          PROMPT_LIBRARY_DELETED,
          PROMPT_CREATED,
          PROMPT_CHANGED,
          PROMPT_DELETED,
          LIBRARY_SOURCE_UPDATED,
          GROUP_CREATED,
          GROUP_CHANGED,
          GROUP_DELETED,
          SPACE_MEMBER_ADDED,
          SPACE_MEMBER_ROLE_CHANGED,
          SPACE_MEMBER_REMOVED,
          GROUP_MEMBER_ADDED,
          GROUP_MEMBER_REMOVED,
          GROUP_STEWARD_APPOINTED,
          GROUP_STEWARD_DISMISSED,
          GROUP_RELEASE_CHANGED,
          GROUP_PROTECTION_CHANGED,
          GROUP_MEMBERS_READ,
          ASSET_SHARED_TO_SPACE,
          ASSET_DETACHED_FROM_SPACE,
          LIBRARY_SHARED_TO_SPACE,
          LIBRARY_DETACHED_FROM_SPACE,
          ASSET_OWNER_CHANGED,
          ASSET_OWNERSHIP_CLAIMED,
          ASSET_SUCCESSION_OPENED,
          SYSTEM_ADMIN_ROLE_GRANTED,
          SYSTEM_ADMIN_ROLE_REVOKED,
          AUDITOR_ROLE_GRANTED,
          AUDITOR_ROLE_REVOKED,
          SYSTEM_ADMIN_ROLE_REVOCATION_REFUSED,
          ACCOUNT_DEACTIVATED,
          ACCOUNT_REAUTHENTICATION_FORCED,
          API_TOKEN_ISSUED,
          API_TOKEN_REVOKED,
          API_TOKEN_EXPIRED,
          DIRECTORY_SYNC_CHANGE_APPLIED,
          DIRECTORY_SYNC_RUN_COMPLETED,
          DIRECTORY_SYNC_PLAN_DISCARDED,
          DIRECTORY_SYNC_REPORT_READ,
          DIRECTORY_ACCOUNT_LOCKED,
          DIRECTORY_ACCOUNT_UNLOCKED,
          GOVERNANCE_SETTINGS_CHANGED,
          AUDIT_LOG_CONFIGURATION_CHANGED,
          PERMISSION_HISTORY_RETENTION_CHANGED,
          MODEL_POLICY_CHANGED,
          CONNECTOR_LIBRARY_SHARE_LIMIT_CHANGED,
          CAPABILITY_GRANTED,
          CAPABILITY_REVOKED,
          PERMISSION_TRANSFER_PREVIEWED,
          PERMISSION_TRANSFER_EXECUTED,
          INDEXING_PIPELINE_REINDEX_TRIGGERED,
          INDEXING_METADATA_BACKFILL_TRIGGERED,
          INDEXING_CONTEXT_PREFIX_RERUN_TRIGGERED,
          UPLOAD_ORPHAN_ORIGINALS_DELETED,
          DOCUMENT_METADATA_CHANGED,
          BRANDING_SETTINGS_CHANGED,
          OIDC_PROVIDER_CREATED,
          OIDC_PROVIDER_CHANGED,
          OIDC_PROVIDER_DELETED,
          OIDC_PROVIDER_ENABLED,
          OIDC_PROVIDER_DISABLED,
          LLM_MODEL_CREATED,
          LLM_MODEL_CHANGED,
          LLM_MODEL_DELETED,
          LLM_MODEL_ACTIVATED,
          LLM_MODEL_DEACTIVATED,
          DIAGNOSTIC_IMPERSONATION_GRANTED,
          DIAGNOSTIC_IMPERSONATION_REVOKED,
          DIAGNOSTIC_CONTEXT_RETENTION_CHANGED,
          LIBRARY_DIAGNOSTICS_LOCK_CHANGED,
          SEARCH_DIAGNOSIS_PROFILE_RUN,
          AUDIT_LOG_ACCESSED,
          PERMISSION_HISTORY_ACCESSED,
          CONNECTION_LOG_ACCESSED,
          CONNECTION_LOG_RETENTION_CHANGED,
          LOCAL_SESSION_REVOKED,
          LOCAL_PASSWORD_CHANGED,
          LOCAL_ADMIN_SEEDED,
          LOCAL_ADMIN_RESET,
          LOCAL_BOOTSTRAP_ACCOUNT_LOGIN,
          LOCAL_ACCOUNTS_ENABLED,
          LOCAL_ACCOUNTS_DISABLED,
          LOCAL_ACCOUNT_LOCKED_AFTER_FAILED_LOGINS,
          MAIL_SETTINGS_CHANGED,
          MAIL_TEMPLATE_CHANGED,
          MAIL_TEMPLATE_RESET,
          MAIL_TEST_SENT,
          LOCAL_USER_CREATED,
          LOCAL_USER_INVITED,
          LOCAL_USER_CHANGED,
          LOCAL_USER_LOCKED,
          LOCAL_USER_UNLOCKED,
          LOCAL_USER_PASSWORD_RESET_REQUESTED,
          LOCAL_USER_PASSWORD_GENERATED,
          LOCAL_USER_DELETED,
          LOCAL_ACCOUNTS_SETTINGS_CHANGED,
          LOCAL_PASSWORD_SET,
          LOCAL_USER_REGISTERED,
          LOCAL_USER_HANDOVER_REQUESTED,
          LOCAL_USER_HANDED_OVER,
          EXTERNAL_ACCESS_SETTINGS_CHANGED,
          CONNECTION_PROFILE_CREATED,
          CONNECTION_PROFILE_CHANGED,
          CONNECTION_PROFILE_DELETED,
          CONNECTION_PROFILE_DISCONNECTED,
          CONNECTOR_LOCKED,
          CONNECTOR_UNLOCKED,
          CONNECTOR_PROFILE_REQUIRED,
          CONNECTOR_PROFILE_OPTIONAL,
          CONNECTION_PROFILE_REQUEST_RESOLVED,
          CONNECTION_PROFILE_SIGN_IN_TESTED,
        ]
      example: ASSET_GRANT_REVOKED

    AuditEventResponse:
      type: object
      description: >
        One entry as read back through a revision access path. actorRef/subjectRef are
        pseudonymised, output-only fields - never accepted as a request parameter anywhere in
        this API.
      required:
        [
          eventId,
          recordedAt,
          organizationId,
          actorKind,
          actorRef,
          eventType,
          objectType,
          objectId,
          outcome,
        ]
      properties:
        eventId:
          type: string
          format: uuid
        recordedAt:
          type: string
          format: date-time
        organizationId:
          type: string
          format: uuid
        actorKind:
          $ref: "#/components/schemas/AuditActorKind"
        actorRef:
          type: string
        eventType:
          $ref: "#/components/schemas/AuditEventType"
        objectType:
          $ref: "#/components/schemas/AuditObjectType"
        objectId:
          type: string
        objectLabel:
          type: string
          nullable: true
        subjectKind:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AuditSubjectKind"
        subjectRef:
          type: string
          nullable: true
        before:
          type: string
          nullable: true
        after:
          type: string
          nullable: true
        outcome:
          $ref: "#/components/schemas/AuditOutcome"
        reason:
          type: string
          nullable: true
        correlationRef:
          type: string
          nullable: true

    AccessAsOfObjectType:
      type: string
      description: >
        The kinds of object the Stichtagsauskunft answers about. A library answers "who could read
        it", a space "who was a member". Exactly one named object per query (ADR-0036,
        Entscheidung 8; Personalrat Z3).
      enum: [KNOWLEDGE_LIBRARY, SPACE]
      example: KNOWLEDGE_LIBRARY

    AccessAsOfSource:
      type: string
      description: >
        A rights source of the Stichtagsauskunft that carries no history yet (ADR-0036,
        Entscheidung 8 lists eight sources; four are historised today). SYSTEM_ROLE matters most:
        a system administrator reaches every library of their organization through effectiveRole,
        and no interval records that - an empty answer is therefore never a proof that nobody had
        access.
      enum: [SYSTEM_ROLE, OWNERSHIP, CAPABILITY, ACCOUNT_STATE]
      example: SYSTEM_ROLE

    AccessAsOfEntry:
      type: object
      required: [basis, validFrom]
      description: >
        One interval inside the requested window during which one subject reached the object, cut
        to the window. A person is named by id and display name; the answer is about an object, not
        about a person, which is what keeps it free of a Vollmacht.
      properties:
        basis:
          $ref: "#/components/schemas/AccessBasis"
        userId:
          type: string
          format: uuid
          nullable: true
          description: Null for ORGANIZATION_WIDE, which reaches every account without naming one.
        userName:
          type: string
          nullable: true
        groupId:
          type: string
          format: uuid
          nullable: true
          description: The group the way ran through; set for GROUP_GRANT and GROUP_MEMBERSHIP.
        groupName:
          type: string
          nullable: true
          description: >
            The group's name as it is today, or null once the group is gone - the history keeps the
            id, not a name snapshot (ADR-0036, Entscheidung 2: the snapshot follows the maximum
            retention period, which is why an answer about a deleted group stays anonymous here).
        assetRole:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AssetRole"
        spaceRole:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/SpaceRole"
        validFrom:
          type: string
          format: date-time
        validTo:
          type: string
          format: date-time
          nullable: true
          description: Null means the access was still in force at the end of the window.

    AccessAsOfPage:
      type: object
      required:
        [objectType, objectId, from, to, beyondRetention, sourcesNotCovered, entries, page, size, totalElements, totalPages]
      properties:
        objectType:
          $ref: "#/components/schemas/AccessAsOfObjectType"
        objectId:
          type: string
          format: uuid
        objectName:
          type: string
          nullable: true
          description: >
            The object's name today, null once it is deleted. The answer is still given for a
            deleted object: the history outlives it (ADR-0016). A private library is named
            "Private Bibliothek" and identified by objectId alone, as in every protocol entry.
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        retentionCutoff:
          type: string
          format: date-time
          nullable: true
          description: >
            Closed intervals that ended before this instant are deleted (#1833). Everything the
            answer says about a time before it is therefore incomplete by construction. Null until
            the first deletion pass has run at all, which is why beyondRetention and not this field
            carries the statement.
        beyondRetention:
          type: boolean
          description: >
            True when "from" lies before retentionCutoff. The answer is then not a negative
            statement: "no access" and "no longer on record" are indistinguishable there, and the
            reader is told so rather than left to assume the first.
        sourcesNotCovered:
          type: array
          description: >
            The rights sources this answer cannot cover because they carry no history yet. A client
            has to show them: without SYSTEM_ROLE named, "no entry" reads as "nobody had access",
            although a system administrator could read every library of the organization all along.
          items:
            $ref: "#/components/schemas/AccessAsOfSource"
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AccessAsOfEntry"
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    AuditEventPage:
      type: object
      description: >
        A bounded page, never a full extract - "begrenzte Ergebnismenge" is enforced server-side
        regardless of the requested size.
      required: [events, page, size, hasMore]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/AuditEventResponse"
        page:
          type: integer
        size:
          type: integer
        hasMore:
          type: boolean
          description: True if further, older-page results exist beyond this bounded page.

    ConnectionLogEventType:
      type: string
      description: Mirrors io.opaa.api.types.ConnectionLogEventType.
      enum: [CONNECTED, RECONNECTED, DISCONNECTED, EXPIRED, EMERGENCY_DISCONNECTED, DELETED]
      example: CONNECTED

    ConnectionEndCause:
      type: string
      description: >
        Mirrors io.opaa.api.types.ConnectionEndCause - why a connection ended. Set on every event
        but CONNECTED and RECONNECTED, never on those two.
      enum:
        [
          SELF,
          EMERGENCY,
          ADDRESS_CHANGED,
          REGISTRATION_CHANGED,
          ACCOUNT_DEACTIVATED,
          PROFILE_DELETED,
          PROVIDER_REJECTED,
          SECRET_EXPIRED,
          LIBRARY_DELETED,
          PROFILE_CHANGED,
        ]
      example: SELF

    ConnectionLogOwnerKind:
      type: string
      description: >
        Mirrors io.opaa.api.types.ConnectionLogOwnerKind - whose connection the entry is about.
        PERSON names the person as personRef and never a library or account; LIBRARY names the
        library and, if any, the service account's address; PROFILE names neither.
      enum: [PERSON, LIBRARY, PROFILE]
      example: PERSON

    ConnectionLogEntryResponse:
      type: object
      description: >
        One entry of the connection log. actorRef and personRef are pseudonyms in the same scheme
        as the audit log's actorRef. An event no person caused (expiry, deactivation) carries the
        literal "SYSTEM" as actorRef, which is never a pseudonym.
        profileName is the name the profile carried at the time, so an entry outlives its profile.
      required:
        [eventId, recordedAt, organizationId, eventType, actorRef, ownerKind, profileId, profileName]
      properties:
        eventId:
          type: string
          format: uuid
        recordedAt:
          type: string
          format: date-time
        organizationId:
          type: string
          format: uuid
        eventType:
          $ref: "#/components/schemas/ConnectionLogEventType"
        actorRef:
          type: string
          description: A pseudonym, or the literal "SYSTEM" for an event no person caused.
        ownerKind:
          $ref: "#/components/schemas/ConnectionLogOwnerKind"
        personRef:
          type: string
          nullable: true
          description: The person's pseudonym; set exactly for ownerKind PERSON.
        libraryId:
          type: string
          format: uuid
          nullable: true
          description: The library; set exactly for ownerKind LIBRARY. It may no longer exist.
        accountLabel:
          type: string
          nullable: true
          description: >
            The service account's address at the provider, only for ownerKind LIBRARY; at most
            500 characters.
        profileId:
          type: string
          format: uuid
        profileName:
          type: string
        cause:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ConnectionEndCause"

    ConnectionLogProfile:
      type: object
      required: [profileId, name, deleted]
      properties:
        profileId:
          type: string
          format: uuid
        name:
          type: string
          description: The profile's name in its newest log entry.
          example: Zugang Nextcloud intern
        deleted:
          type: boolean
          description: Whether the profile no longer exists.

    ConnectionLogPage:
      type: object
      description: A bounded page, never a full extract.
      required: [entries, page, size, hasMore]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/ConnectionLogEntryResponse"
        page:
          type: integer
        size:
          type: integer
        hasMore:
          type: boolean

    ConnectionLogRetentionRequest:
      type: object
      required: [retentionMonths]
      properties:
        retentionMonths:
          type: integer
          minimum: 6
          maximum: 24

    ConnectionLogRetentionResponse:
      type: object
      required: [retentionMonths, updatedAt]
      properties:
        retentionMonths:
          type: integer
        lastCutoff:
          type: string
          format: date-time
          nullable: true
          description: How far the deletion has got; only ever moves forward.
        updatedAt:
          type: string
          format: date-time

    PermissionHistoryRetentionRequest:
      type: object
      required: [retentionMonths]
      properties:
        retentionMonths:
          type: integer
          minimum: 12
          maximum: 120

    PermissionHistoryRetentionResponse:
      type: object
      required: [retentionMonths, updatedAt]
      properties:
        retentionMonths:
          type: integer
        lastCutoff:
          type: string
          format: date-time
          nullable: true
          description: >
            How far the deletion has actually got: the latest cutoff any pass has deleted by. Only
            ever moves forward, so after a lengthening of the period it stays ahead of that
            period's own cutoff - what is deleted does not come back. Also the boundary of what a
            Stichtag reconstruction can still answer.
        updatedAt:
          type: string
          format: date-time

    AuditIncidentScopePurpose:
      type: string
      description: >
        Mirrors io.opaa.api.types.AuditIncidentScopePurpose - a closed list that deliberately excludes
        arbeitsrechtliche, disziplinarische und leistungsbezogene purposes by omission (Zweckausschluss).
      enum:
        [
          SECURITY_INCIDENT,
          UNAUTHORIZED_ACCESS_SUSPICION,
          DATA_BREACH_INVESTIGATION,
          EXTERNAL_AUDIT_OR_INSPECTION,
        ]
      example: SECURITY_INCIDENT

    AuditIncidentScopeStatus:
      type: string
      description: Mirrors io.opaa.api.types.AuditIncidentScopeStatus.
      enum: [PENDING, APPROVED]
      example: PENDING

    AuditIncidentScopeRequest:
      type: object
      required: [subjectUserId, scopeStart, scopeEnd, purpose, reason]
      properties:
        subjectUserId:
          type: string
          format: uuid
          description: The one person this exception's technical scope names in advance.
        scopeStart:
          type: string
          format: date-time
        scopeEnd:
          type: string
          format: date-time
        purpose:
          $ref: "#/components/schemas/AuditIncidentScopePurpose"
        reason:
          type: string
          minLength: 10
          maxLength: 1000
          description: The documented Anlass required alongside the closed purpose category.

    AuditIncidentScopeResponse:
      type: object
      required:
        [
          id,
          organizationId,
          subjectUserId,
          scopeStart,
          scopeEnd,
          purpose,
          reason,
          requestedByUserId,
          requestedAt,
          status,
        ]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        subjectUserId:
          type: string
          format: uuid
        scopeStart:
          type: string
          format: date-time
        scopeEnd:
          type: string
          format: date-time
        purpose:
          $ref: "#/components/schemas/AuditIncidentScopePurpose"
        reason:
          type: string
        requestedByUserId:
          type: string
          format: uuid
        requestedAt:
          type: string
          format: date-time
        approvedByUserId:
          type: string
          format: uuid
          nullable: true
        approvedAt:
          type: string
          format: date-time
          nullable: true
        usableUntil:
          type: string
          format: date-time
          nullable: true
          description: >
            Set once, at approval - an approved grant is only usable for querying until this
            point, not indefinitely.
        status:
          $ref: "#/components/schemas/AuditIncidentScopeStatus"
