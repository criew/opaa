# Topic "users": its tags, paths and the components only this topic uses.
# Merged with all other fragments at build time, see root.yaml.
tags:
  - name: user
    description: User directory and system roles.
paths:
  /api/v1/users:
    get:
      operationId: listUsersForSelection
      tags: [user]
      summary: >
        List users in the caller's own organization for member/grant selection - deliberately not
        admin-restricted, unlike GET /api/v1/admin/users (#777). The member/grant pickers
        (UserPicker, SubjectPicker, SpaceCreatePage) need to search for a user to add, but GET /api/v1/admin/users requires SYSTEM_ADMIN (#199) - a
        403 that the frontend silently swallowed into an empty, dead-looking search field for
        every non-admin, making "Mitglied hinzufügen" unusable for anyone but a system admin.
        Same precedent as GET /api/v1/me/groups (any authenticated user needs their own group
        memberships) and AssetGrantService#toResponses's server-side name resolution (#423): the
        threshold this endpoint needs is "authenticated member of the organization", not
        SYSTEM_ADMIN. Returns UserSummaryResponse (id/email/displayName only, no systemRole) -
        narrower than UserInfoResponse, matching KnowledgeLibraryService#resolveOwnerNames's
        reasoning that an organization-wide audience should see less than the SYSTEM_ADMIN-only
        admin list does.

        Requires `query` (min. 2 characters, matched case-insensitively against displayName and
        email) and caps the result at 20 rows (#778 review) - the endpoint used to return every
        user of the organization unconditionally on each picker mount, unbounded by input or size,
        which is both a data-minimisation concern and unnecessary load on a large organization. A
        missing or too-short query returns an empty list rather than falling back to the old
        unbounded list.
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
          description: >
            Case-insensitive substring match against displayName or email. Fewer than 2 characters
            (after trimming) yields an empty result instead of the full organization list.
      responses:
        "200":
          description: Users in the caller's organization matching the query, capped at 20 rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSummaryResponse"

  /api/v1/admin/users:
    get:
      operationId: listUsers
      tags: [user]
      summary: List all users (system admin only)
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserInfoResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/users/{id}/role:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      operationId: changeUserRole
      tags: [user]
      summary: Change a user's system role (system admin only)
      description: >
        Three conflicts of its own are refused with 409. A role other than SYSTEM_ADMIN for the
        bootstrap account carries the code BOOTSTRAP_ACCOUNT (ADR-0033, Entscheidungen 3 and 5);
        returning it to SYSTEM_ADMIN stays allowed. The withdrawal of
        the SYSTEM_ADMIN role while no other login-capable system administrator of the
        organization remains carries the code LAST_LOGIN_CAPABLE_ADMIN (ADR-0033, Entscheidung 4); the check runs under the
        organization's advisory lock, so it also holds when a manual and a token-driven
        withdrawal run at the same time. A role that an enabled OIDC provider with a roles claim
        manages itself cannot be changed here (ADR-0025, Entscheidung 4) - that refusal names the
        provider in its message and carries no code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleChangeRequest"
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfoResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/admin/accounts:
    get:
      operationId: listAccounts
      tags: [user]
      summary: List every account of the caller's organization - local and identity-provider accounts (system admin only)
      description: >
        The account list of the administration (#1601): every account of the organization, local
        ones with their state, expiry, reason and activity class (the same LocalUserResponse the
        local account management returns), accounts of an identity provider with the provider they
        belong to and whether that provider manages their role. The guardrails of ADR-0033,
        Entscheidung 11, hold for this list as well: activity is a class and only ever given for
        local accounts, the list cannot be sorted by it, there is no export, and a page holds at
        most 50 rows. status, withoutExpiry and inactive narrow the list to local accounts.
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
            maxLength: 320
          description: Case-insensitive substring of the e-mail address or the display name.
        - name: providerType
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ProviderType"
          description: LOCAL for local accounts only, OIDC for identity-provider accounts only.
        - name: providerId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Only the accounts of this identity provider.
        - name: role
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SystemRole"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/LocalAccountState"
          description: Local accounts in this state; implies providerType=LOCAL.
        - name: withoutExpiry
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: >
            Only local accounts without an expiry date, the bootstrap account excepted - the same
            set the local list and the summary report; implies providerType=LOCAL.
        - name: inactive
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: >
            Only local accounts with activity class NEVER or INACTIVE_90_DAYS, the bootstrap
            account excepted - the same set the local list shows; implies providerType=LOCAL.
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [displayName, email, origin, role, status, expiresAt, createdAt]
            default: displayName
          description: >
            The allow-listed sort fields; the activity class is deliberately not one of them
            (ADR-0033, Entscheidung 11). Three of them order a category rather than a text, and do
            so by a fixed rank: "origin" puts local accounts first, then the providers by name,
            then the accounts whose issuer has no provider row; "role" sorts by privilege (USER,
            AUDITOR, SYSTEM_ADMIN - the order the German labels read in); "status" by what needs
            attention first (LOCKED, EXPIRED, INVITED, ACTIVE), with the provider accounts last
            because they carry no state of OPAA's making. Accounts without an expiry date sort
            last under expiresAt.
        - name: direction
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: asc
          description: Anything else is refused with 400.
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 25
          description: Rows per page, at most 50 (ADR-0033, Entscheidung 11) - a larger value is refused with 400.
      responses:
        "200":
          description: One page of accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountPageResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  schemas:
    AccountProviderResponse:
      type: object
      description: The identity provider an account belongs to, as the account list names it.
      required: [id, displayName, enabled]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        enabled:
          type: boolean
          description: A disabled provider issues no more tokens; its accounts remain and their roles are managed here again.

    AccountResponse:
      type: object
      description: >
        One row of the account list of the administration (#1601): every account of the
        organization, whatever its origin. A local account carries its LocalUserResponse in
        "local"; an identity-provider account carries its provider in "provider" - absent when
        the provider row has been deleted since (the account remains, ADR-0025). Never an
        activity timestamp; activity is a class and only ever part of "local".
      required: [id, email, displayName, systemRole, providerType, issuer, roleManagedByProvider, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          nullable: true
        displayName:
          type: string
          nullable: true
        systemRole:
          $ref: "#/components/schemas/SystemRole"
        providerType:
          $ref: "#/components/schemas/ProviderType"
        issuer:
          type: string
          description: The issuer of the account's identity - urn:opaa:local for a local account, the issuer URI of its identity provider otherwise.
        roleManagedByProvider:
          type: boolean
          description: >
            True when an enabled identity provider with a roles claim manages this account's
            role - the condition under which POST /api/v1/admin/users/{id}/role answers 409.
        createdAt:
          type: string
          format: date-time
        directoryLocked:
          type: boolean
          description: >
            True when the directory synchronisation locked this account because the directory
            reports it as disabled or no longer reports it at all (#1818). The account keeps its
            memberships and its content; the lock is taken back by the next run once the
            directory reports the account as enabled again - never here, since OPAA never writes
            to the directory.
        provider:
          $ref: "#/components/schemas/AccountProviderResponse"
        local:
          $ref: "#/components/schemas/LocalUserResponse"

    AccountPageResponse:
      type: object
      required: [items, total, page, size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AccountResponse"
        total:
          type: integer
          format: int64
          description: Matching accounts over all pages.
        page:
          type: integer
        size:
          type: integer

    UserSummaryResponse:
      type: object
      description: >
        Deliberately narrower than UserInfoResponse (no systemRole) - GET /v1/users (#777) reaches
        every authenticated user in the organization, not just SYSTEM_ADMIN, so it exposes only
        what a member/grant picker needs to let a caller find someone by name or email.
      required: [id, email, displayName]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          nullable: true
        displayName:
          type: string
          nullable: true

    RoleChangeRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/SystemRole"
