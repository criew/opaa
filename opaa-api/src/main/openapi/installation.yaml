# Topic "installation": its tags, paths and the components only this topic uses.
# Merged with all other fragments at build time, see root.yaml.
tags:
  - name: installation
    description: >
      Installation of a fresh instance (ADR-0060): the steps of the setup, their checks, the answer
      file and the completion. Reachable only while the installation is pending; afterwards every
      operation answers 404 on every instance.
paths:
  /api/v1/installation:
    get:
      operationId: getInstallation
      tags: [installation]
      security: []
      summary: >
        State of the installation: which steps are saved and checked, which are mandatory, and
        whether it can be completed. Requires the installation token as "Authorization: Bearer
        <token>" (OPAA_INSTALLATION_TOKEN or the token the first start printed once). Secrets are
        never returned, only whether they are set.
      responses:
        "200":
          description: State of the installation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallationStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The client address lies outside OPAA_INSTALLATION_ALLOWED_CIDRS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/installation/steps/{step}:
    parameters:
      - $ref: "#/components/parameters/InstallationStepPath"
    put:
      operationId: saveInstallationStep
      tags: [installation]
      security: []
      summary: >
        Saves the values of one step; the part of the body named after the step is required, the
        other parts are ignored. Network, budget and token are checked before the body is read;
        a body above 64 KiB is unreadable (400). Saving discards an earlier check of the step. A password is stored
        only as a hash, a model key only encrypted. Same token and network rules as
        getInstallation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstallationStepRequest"
      responses:
        "200":
          description: Step saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallationStepState"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The client address lies outside OPAA_INSTALLATION_ALLOWED_CIDRS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    delete:
      operationId: skipInstallationStep
      tags: [installation]
      security: []
      summary: >
        Skips an optional step: discards its saved values and their check, so the completion goes
        on without it. A step that was never saved stays as it is. A mandatory step cannot be
        skipped (409). Same token and network rules as getInstallation.
      responses:
        "200":
          description: Step skipped; it is no longer saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallationStepState"
        "400":
          description: Unknown step
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The client address lies outside OPAA_INSTALLATION_ALLOWED_CIDRS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The step is mandatory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/installation/steps/{step}/check:
    parameters:
      - $ref: "#/components/parameters/InstallationStepPath"
    post:
      operationId: checkInstallationStep
      tags: [installation]
      security: []
      summary: >
        Runs the check of a saved step: the rules of the first account, the connection test of the
        identity provider (discovery and JWK set) or of the chat model, or the probe embedding of
        the embedding model, which also determines its vector size. The outcome is stored with the
        step and returned; a failed check is no error of the call. Same token and network rules
        as getInstallation.
      responses:
        "200":
          description: Check run; its outcome is part of the step state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallationStepState"
        "400":
          description: Unknown step
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The client address lies outside OPAA_INSTALLATION_ALLOWED_CIDRS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The step has not been saved yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/installation/steps/{step}/discover:
    parameters:
      - $ref: "#/components/parameters/InstallationStepPath"
    post:
      operationId: discoverInstallationModels
      tags: [installation]
      security: []
      summary: >
        Lists the models an endpoint offers, for the steps CHAT_MODEL and EMBEDDING_MODEL (400 for
        any other step), so the assistant can offer them for selection. Same discovery as
        discoverLlmModels: the address check of models, no redirects, a short timeout and a bounded
        response size, details from Ollama on the same origin; a refused address answers with
        failure INVALID_ADDRESS. Nothing is saved, and the step's check stays as it is. apiKey
        omitted uses the key saved with the step, but only for the same endpoint (scheme, host,
        port, path), otherwise 400; an empty apiKey sends none. Per instance and for all clients
        together, at most 30 discoveries in 10 minutes, then 429 with code MODEL_DISCOVERY_LIMIT
        (the per-address budget of the installation API answers 429 without code). Same token
        and network rules as getInstallation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstallationModelDiscoveryRequest"
      responses:
        "200":
          description: >
            Discovery result - a 200 either way; success and failure carry the outcome, as in
            discoverLlmModels.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmModelDiscoveryResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The client address lies outside OPAA_INSTALLATION_ALLOWED_CIDRS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/installation/answer-file:
    post:
      operationId: applyInstallationAnswerFile
      tags: [installation]
      security: []
      summary: >
        Installs without a browser: saves every step of the answers, checks each of them and
        completes the installation, all or nothing - the same checks as the file read at start-up
        from OPAA_INSTALLATION_ANSWER_FILE, which names its secrets as files instead. chatModel and
        embeddingModel are optional; leaving one out skips its step and discards values saved for
        it before. Same token and network rules as getInstallation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstallationAnswers"
      responses:
        "200":
          description: Installation completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallationStatusResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The client address lies outside OPAA_INSTALLATION_ALLOWED_CIDRS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A check of the answer file failed; the message names the step and the reason
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/installation/complete:
    post:
      operationId: completeInstallation
      tags: [installation]
      security: []
      summary: >
        Completes the installation exactly once, under a database lock, even with several
        instances: creates the first system administration account, the sign-in method, the chat
        model and the embedding model with the vector table of its probed size from the checked
        steps, discards the token and the saved steps and switches every instance to normal
        operation. A skipped optional step leaves its model out: without the embedding model there
        is no vector table until the model administration sets the first one. Same token and
        network rules as getInstallation.
      responses:
        "200":
          description: Installation completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallationStatusResponse"
        "400":
          description: A value of a saved step no longer passes its rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The client address lies outside OPAA_INSTALLATION_ALLOWED_CIDRS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            A mandatory step is not saved or not successfully checked, or an optional step is saved
            but not successfully checked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"

components:
  parameters:
    InstallationStepPath:
      name: step
      in: path
      required: true
      description: The step, in the spelling of InstallationStep.
      schema:
        $ref: "#/components/schemas/InstallationStep"

  schemas:
    InstallationStep:
      type: string
      description: >
        A step of the installation. FIRST_ADMIN is the first system administration account (the
        local emergency account of ADR-0033), SIGN_IN the sign-in method, both mandatory;
        CHAT_MODEL the chat model and EMBEDDING_MODEL the embedding model (ADR-0060, Entscheidung
        10), both optional.
      enum: [FIRST_ADMIN, SIGN_IN, CHAT_MODEL, EMBEDDING_MODEL]

    InstallationSignInMode:
      type: string
      description: >
        LOCAL_ONLY signs in with local accounts only; LOCAL_AND_OIDC adds an OIDC identity provider
        as the default provider.
      enum: [LOCAL_ONLY, LOCAL_AND_OIDC]

    InstallationStatusResponse:
      type: object
      required: [pending, completable, steps]
      properties:
        pending:
          type: boolean
          description: Always true while this API answers; the completion answers with false.
        completable:
          type: boolean
          description: >
            Whether every mandatory step and every saved optional step is successfully checked.
        steps:
          type: array
          items:
            $ref: "#/components/schemas/InstallationStepState"

    InstallationStepState:
      type: object
      required: [step, mandatory, saved, checked]
      properties:
        step:
          $ref: "#/components/schemas/InstallationStep"
        mandatory:
          type: boolean
          description: >
            False for an optional step, which can be skipped; once saved it must be checked like a
            mandatory one.
        saved:
          type: boolean
        checked:
          type: boolean
          description: Whether the last check of the saved values succeeded.
        checkMessage:
          type: string
          nullable: true
          description: The German outcome of the last check, absent before the first one.
        firstAdmin:
          $ref: "#/components/schemas/InstallationFirstAdminView"
        signIn:
          $ref: "#/components/schemas/InstallationSignIn"
        chatModel:
          $ref: "#/components/schemas/InstallationChatModelView"
        embeddingModel:
          $ref: "#/components/schemas/InstallationEmbeddingModelView"

    InstallationStepRequest:
      type: object
      description: The part named after the step of the path is required, the others are ignored.
      properties:
        firstAdmin:
          $ref: "#/components/schemas/InstallationFirstAdmin"
        signIn:
          $ref: "#/components/schemas/InstallationSignIn"
        chatModel:
          $ref: "#/components/schemas/InstallationChatModel"
        embeddingModel:
          $ref: "#/components/schemas/InstallationEmbeddingModel"

    InstallationFirstAdmin:
      type: object
      required: [email, displayName, password]
      properties:
        email:
          type: string
          maxLength: 320
          example: it-betrieb@stadt.example
        displayName:
          type: string
          maxLength: 200
          example: Systemverwaltung
        password:
          type: string
          maxLength: 200
          description: Checked against the password policy, stored only as a hash.

    InstallationFirstAdminView:
      type: object
      required: [email, displayName, passwordSet]
      properties:
        email:
          type: string
        displayName:
          type: string
        passwordSet:
          type: boolean

    InstallationSignIn:
      type: object
      required: [mode]
      properties:
        mode:
          $ref: "#/components/schemas/InstallationSignInMode"
        oidc:
          $ref: "#/components/schemas/InstallationOidcProvider"

    InstallationOidcProvider:
      type: object
      required: [issuerUri, clientId]
      properties:
        issuerUri:
          type: string
          maxLength: 500
          example: https://login.stadt.example/realms/opaa
        clientId:
          type: string
          maxLength: 200
          example: opaa-frontend
        jwkSetUri:
          type: string
          nullable: true
          maxLength: 500
        displayName:
          type: string
          nullable: true
          maxLength: 120
          description: Name on the sign-in page; Verzeichnisdienst when absent.

    InstallationChatModel:
      type: object
      required: [baseUrl, model]
      properties:
        baseUrl:
          type: string
          maxLength: 500
          example: http://ollama:11434/v1
        model:
          type: string
          maxLength: 200
          example: qwen2.5:7b
        apiKey:
          type: string
          nullable: true
          maxLength: 2000
          description: Stored encrypted; omitted keeps a key saved before, empty removes it.
        temperature:
          type: number
          nullable: true
        maxTokens:
          type: integer
          nullable: true
          description: 8000 when absent.

    InstallationChatModelView:
      type: object
      required: [baseUrl, model, apiKeySet, maxTokens]
      properties:
        baseUrl:
          type: string
        model:
          type: string
        apiKeySet:
          type: boolean
        temperature:
          type: number
          nullable: true
        maxTokens:
          type: integer

    InstallationEmbeddingModel:
      type: object
      required: [baseUrl, model]
      properties:
        baseUrl:
          type: string
          maxLength: 500
          example: http://ollama:11434/v1
        model:
          type: string
          maxLength: 200
          example: bge-m3
        apiKey:
          type: string
          nullable: true
          maxLength: 2000
          description: Stored encrypted; omitted keeps a key saved before, empty removes it.
        maxInputTokens:
          type: integer
          nullable: true
          minimum: 1
          description: Input limit of the endpoint in tokens, as it is served; 2048 when absent.

    InstallationEmbeddingModelView:
      type: object
      required: [baseUrl, model, apiKeySet, maxInputTokens]
      properties:
        baseUrl:
          type: string
        model:
          type: string
        apiKeySet:
          type: boolean
        maxInputTokens:
          type: integer
        dimensions:
          type: integer
          nullable: true
          description: >
            Vector size the last successful probe embedding returned; the completion creates the
            vector table with it. Absent until the check succeeded.

    InstallationModelDiscoveryRequest:
      type: object
      description: The endpoint of a model step whose models are to be listed; nothing is saved.
      required: [baseUrl]
      properties:
        baseUrl:
          type: string
          minLength: 1
          maxLength: 500
          description: >
            The OpenAI-compatible endpoint, e.g. http://ollama:11434/v1. Must not contain userinfo;
            such an address is rejected with 400.
          example: http://ollama:11434/v1
        apiKey:
          type: string
          nullable: true
          maxLength: 2000
          description: >
            Plaintext key for this request only, never stored. Omitted uses the key saved with the
            step, only for its endpoint; empty sends none.

    InstallationAnswers:
      type: object
      description: >
        All values of the answer file in one request (docs/features/installation-and-settings.md).
        Over this API the secrets travel in the body, as in the single steps; a reference to a file
        on the backend (passwordFile, apiKeyFile) is accepted only in the file read at start-up, so
        that the API cannot read files of the backend. Parts of later steps (outboundProxy, mail,
        branding) are not evaluated by this version. chatModel and embeddingModel are optional;
        without one its step is skipped.
      required: [firstAdmin, signIn]
      properties:
        firstAdmin:
          $ref: "#/components/schemas/InstallationFirstAdmin"
        signIn:
          $ref: "#/components/schemas/InstallationSignIn"
        chatModel:
          $ref: "#/components/schemas/InstallationChatModel"
        embeddingModel:
          $ref: "#/components/schemas/InstallationEmbeddingModel"
