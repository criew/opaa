# Topic "installation": its tags, paths and the components only this topic uses.
# Merged with all other fragments at build time, see root.yaml.
tags:
  - name: installation
    description: >
      Installation of a fresh instance (ADR-0060): the steps of the setup, their checks, the answer
      file and the completion. Reachable only while the installation is pending; afterwards every
      operation answers 404 on every instance.
paths:
  /api/v1/installation:
    get:
      operationId: getInstallation
      tags: [installation]
      security: []
      summary: >
        State of the installation: which steps are saved and checked, which are mandatory, and
        whether it can be completed. Requires the installation token as "Authorization: Bearer
        <token>" (OPAA_INSTALLATION_TOKEN or the token the first start printed once). Secrets are
        never returned, only whether they are set.
      responses:
        "200":
          description: State of the installation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallationStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The client address lies outside OPAA_INSTALLATION_ALLOWED_CIDRS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/installation/steps/{step}:
    parameters:
      - $ref: "#/components/parameters/InstallationStepPath"
    put:
      operationId: saveInstallationStep
      tags: [installation]
      security: []
      summary: >
        Saves the values of one step; the part of the body named after the step is required, the
        other parts are ignored. Network, budget and token are checked before the body is read;
        a body above 64 KiB is unreadable (400). Saving discards an earlier check of the step. A password is stored
        only as a hash, a model key only encrypted. Same token and network rules as
        getInstallation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstallationStepRequest"
      responses:
        "200":
          description: Step saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallationStepState"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The client address lies outside OPAA_INSTALLATION_ALLOWED_CIDRS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/installation/steps/{step}/check:
    parameters:
      - $ref: "#/components/parameters/InstallationStepPath"
    post:
      operationId: checkInstallationStep
      tags: [installation]
      security: []
      summary: >
        Runs the check of a saved step: the rules of the first account, the connection test of the
        identity provider (discovery and JWK set) or of the chat model, the probe embedding of the
        embedding model, which also determines its vector size, for RERANK_MODEL the probe of the
        rerank model administration (one rerank request with a test document), or for MAIL a connection to the
        mail server with sign-in when a user name is set, without sending anything. A failed MAIL
        check names one of four fixed reasons (not reachable, TLS failed, sign-in refused, no mail
        server), the cause goes to the log only. BRANDING is checked against the rules of the
        branding administration again, without any connection. For MAIL only, testRecipient additionally sends
        the test message to that address. Per instance and for all clients together at most 30
        MAIL checks in 10 minutes (429 with code MAIL_CHECK_LIMIT) and at most 10 test messages in
        10 minutes (429 with code MAIL_TEST_LIMIT). Every wait on the mail server is bounded by
        OPAA_MAIL_CONNECT_TIMEOUT, OPAA_MAIL_READ_TIMEOUT and OPAA_MAIL_WRITE_TIMEOUT. The outcome
        is stored with the step and returned; a failed check is no error of the call. Same token
        and network rules as getInstallation.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstallationStepCheckRequest"
      responses:
        "200":
          description: Check run; its outcome is part of the step state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallationStepState"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The client address lies outside OPAA_INSTALLATION_ALLOWED_CIDRS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The step has not been saved yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/installation/steps/{step}/skip:
    parameters:
      - $ref: "#/components/parameters/InstallationStepPath"
    post:
      operationId: skipInstallationStep
      tags: [installation]
      security: []
      summary: >
        Skips an optional step (400 for a mandatory one): discards its saved values and their
        check, so the completion leaves what the step would set as it is - for CHAT_MODEL and
        EMBEDDING_MODEL, no model is set up, for RERANK_MODEL, reranking stays off, for MAIL,
        sending stays off, for BRANDING, the OPAA
        default stays. A skipped step does not
        hold up the completion; a saved optional step does until its check succeeded or it is
        skipped. Recorded in the audit log, also when nothing was saved. Same token and network
        rules as getInstallation.
      responses:
        "200":
          description: Step skipped; its state is unsaved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallationStepState"
        "400":
          description: Unknown or mandatory step
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The client address lies outside OPAA_INSTALLATION_ALLOWED_CIDRS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/installation/steps/{step}/discover:
    parameters:
      - $ref: "#/components/parameters/InstallationStepPath"
    post:
      operationId: discoverInstallationModels
      tags: [installation]
      security: []
      summary: >
        Lists the models an endpoint offers, for the steps CHAT_MODEL, EMBEDDING_MODEL and
        RERANK_MODEL (400 for any other step), so the assistant can offer them for selection. Same discovery as
        discoverLlmModels: the address check of models, no redirects, a short timeout and a bounded
        response size, details from Ollama on the same origin; a refused address answers with
        failure INVALID_ADDRESS. Nothing is saved, and the step's check stays as it is. apiKey
        omitted uses the key saved with the step, but only for the same endpoint (scheme, host,
        port, path), otherwise 400; an empty apiKey sends none. Per instance and for all clients
        together, at most 30 discoveries in 10 minutes, then 429 with code MODEL_DISCOVERY_LIMIT
        (the per-address budget of the installation API answers 429 without code). Same token
        and network rules as getInstallation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstallationModelDiscoveryRequest"
      responses:
        "200":
          description: >
            Discovery result - a 200 either way; success and failure carry the outcome, as in
            discoverLlmModels.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmModelDiscoveryResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The client address lies outside OPAA_INSTALLATION_ALLOWED_CIDRS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/installation/answer-file:
    post:
      operationId: applyInstallationAnswerFile
      tags: [installation]
      security: []
      summary: >
        Installs without a browser: saves every step of the answers, checks each of them and
        completes the installation, all or nothing - the same checks as the file read at start-up
        from OPAA_INSTALLATION_ANSWER_FILE, which names its secrets as files instead. chatModel,
        embeddingModel, rerankModel, mail and branding are optional; an optional part left out counts as
        skipped and discards what the assistant saved for it. The check of mail sends no test message and
        counts against the budget of MAIL checks (429 with code MAIL_CHECK_LIMIT). Same token and
        network rules as getInstallation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstallationAnswers"
      responses:
        "200":
          description: Installation completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallationStatusResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The client address lies outside OPAA_INSTALLATION_ALLOWED_CIDRS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A check of the answer file failed; the message names the step and the reason
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/installation/complete:
    post:
      operationId: completeInstallation
      tags: [installation]
      security: []
      summary: >
        Completes the installation exactly once, under a database lock, even with several
        instances: creates the first system administration account, the sign-in method, the chat
        model and the embedding model with the vector table of its probed size from the checked
        steps, takes a checked RERANK_MODEL step over into the rerank model administration and
        switches reranking on, takes a checked MAIL step over into the mail settings and switches sending on,
        takes a checked BRANDING step over into the branding settings with the rules of the
        branding administration, discards the token and the saved steps and switches every instance to normal operation. A
        skipped optional step leaves what it would set out: without the embedding model there is
        no vector table until the model administration sets the first one, without the rerank model
        reranking stays off. Same token and network
        rules as getInstallation.
      responses:
        "200":
          description: Installation completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallationStatusResponse"
        "400":
          description: A value of a saved step no longer passes its rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The client address lies outside OPAA_INSTALLATION_ALLOWED_CIDRS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            A mandatory step is not saved or not successfully checked, or an optional step is
            saved but not successfully checked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"

components:
  parameters:
    InstallationStepPath:
      name: step
      in: path
      required: true
      description: The step, in the spelling of InstallationStep.
      schema:
        $ref: "#/components/schemas/InstallationStep"

  schemas:
    InstallationStep:
      type: string
      description: >
        A step of the installation. FIRST_ADMIN is the first system administration account (the
        local emergency account of ADR-0033) and SIGN_IN the sign-in method are mandatory;
        CHAT_MODEL the chat model, EMBEDDING_MODEL the embedding model, RERANK_MODEL the rerank
        model (ADR-0060, Entscheidung 10), MAIL, the mail server for sending (ADR-0033,
        Entscheidung 10), and BRANDING, the texts, accent colour and colour scheme of the branding
        without its images, are optional.
      enum: [FIRST_ADMIN, SIGN_IN, CHAT_MODEL, EMBEDDING_MODEL, RERANK_MODEL, MAIL, BRANDING]

    InstallationSignInMode:
      type: string
      description: >
        LOCAL_ONLY signs in with local accounts only; LOCAL_AND_OIDC adds an OIDC identity provider
        as the default provider.
      enum: [LOCAL_ONLY, LOCAL_AND_OIDC]

    InstallationStatusResponse:
      type: object
      required: [pending, completable, publicBaseUrlConfigured, steps]
      properties:
        pending:
          type: boolean
          description: Always true while this API answers; the completion answers with false.
        completable:
          type: boolean
          description: >
            Whether every mandatory step is saved and successfully checked, and every saved
            optional step as well.
        publicBaseUrlConfigured:
          type: boolean
          description: >
            Whether OPAA_PUBLIC_BASE_URL is set; without it no mail carries a usable link, as on
            the mail settings of the administration.
        steps:
          type: array
          items:
            $ref: "#/components/schemas/InstallationStepState"

    InstallationStepState:
      type: object
      required: [step, mandatory, saved, checked]
      properties:
        step:
          $ref: "#/components/schemas/InstallationStep"
        mandatory:
          type: boolean
          description: >
            False for an optional step, which can be skipped; once saved it must be checked like a
            mandatory one.
        saved:
          type: boolean
        checked:
          type: boolean
          description: Whether the last check of the saved values succeeded.
        checkMessage:
          type: string
          nullable: true
          description: The German outcome of the last check, absent before the first one.
        firstAdmin:
          $ref: "#/components/schemas/InstallationFirstAdminView"
        signIn:
          $ref: "#/components/schemas/InstallationSignIn"
        chatModel:
          $ref: "#/components/schemas/InstallationChatModelView"
        embeddingModel:
          $ref: "#/components/schemas/InstallationEmbeddingModelView"
        rerankModel:
          $ref: "#/components/schemas/InstallationRerankModelView"
        mail:
          $ref: "#/components/schemas/InstallationMailView"
        branding:
          $ref: "#/components/schemas/InstallationBranding"

    InstallationStepRequest:
      type: object
      description: The part named after the step of the path is required, the others are ignored.
      properties:
        firstAdmin:
          $ref: "#/components/schemas/InstallationFirstAdmin"
        signIn:
          $ref: "#/components/schemas/InstallationSignIn"
        chatModel:
          $ref: "#/components/schemas/InstallationChatModel"
        embeddingModel:
          $ref: "#/components/schemas/InstallationEmbeddingModel"
        rerankModel:
          $ref: "#/components/schemas/InstallationRerankModel"
        mail:
          $ref: "#/components/schemas/InstallationMail"
        branding:
          $ref: "#/components/schemas/InstallationBranding"

    InstallationStepCheckRequest:
      type: object
      description: Options of a check; only MAIL knows one (400 for any other step).
      properties:
        testRecipient:
          type: string
          nullable: true
          maxLength: 320
          description: >
            Sends the test message to this address after the connection succeeded. Never stored
            and never part of the audit log. Absent or empty sends nothing.
          example: it-betrieb@stadt.example

    InstallationFirstAdmin:
      type: object
      required: [email, displayName, password]
      properties:
        email:
          type: string
          maxLength: 320
          example: it-betrieb@stadt.example
        displayName:
          type: string
          maxLength: 200
          example: Systemverwaltung
        password:
          type: string
          maxLength: 200
          description: Checked against the password policy, stored only as a hash.

    InstallationFirstAdminView:
      type: object
      required: [email, displayName, passwordSet]
      properties:
        email:
          type: string
        displayName:
          type: string
        passwordSet:
          type: boolean

    InstallationSignIn:
      type: object
      required: [mode]
      properties:
        mode:
          $ref: "#/components/schemas/InstallationSignInMode"
        oidc:
          $ref: "#/components/schemas/InstallationOidcProvider"

    InstallationOidcProvider:
      type: object
      required: [issuerUri, clientId]
      properties:
        issuerUri:
          type: string
          maxLength: 500
          example: https://login.stadt.example/realms/opaa
        clientId:
          type: string
          maxLength: 200
          example: opaa-frontend
        jwkSetUri:
          type: string
          nullable: true
          maxLength: 500
        displayName:
          type: string
          nullable: true
          maxLength: 120
          description: Name on the sign-in page; Verzeichnisdienst when absent.

    InstallationChatModel:
      type: object
      required: [baseUrl, model]
      properties:
        baseUrl:
          type: string
          maxLength: 500
          example: http://ollama:11434/v1
        model:
          type: string
          maxLength: 200
          example: qwen2.5:7b
        apiKey:
          type: string
          nullable: true
          maxLength: 2000
          description: Stored encrypted; omitted keeps a key saved before, empty removes it.
        temperature:
          type: number
          nullable: true
        maxTokens:
          type: integer
          nullable: true
          description: 8000 when absent.

    InstallationChatModelView:
      type: object
      required: [baseUrl, model, apiKeySet, maxTokens]
      properties:
        baseUrl:
          type: string
        model:
          type: string
        apiKeySet:
          type: boolean
        temperature:
          type: number
          nullable: true
        maxTokens:
          type: integer

    InstallationEmbeddingModel:
      type: object
      required: [baseUrl, model]
      properties:
        baseUrl:
          type: string
          maxLength: 500
          example: http://ollama:11434/v1
        model:
          type: string
          maxLength: 200
          example: bge-m3
        apiKey:
          type: string
          nullable: true
          maxLength: 2000
          description: Stored encrypted; omitted keeps a key saved before, empty removes it.
        maxInputTokens:
          type: integer
          nullable: true
          minimum: 1
          description: Input limit of the endpoint in tokens, as it is served; 2048 when absent.

    InstallationEmbeddingModelView:
      type: object
      required: [baseUrl, model, apiKeySet, maxInputTokens]
      properties:
        baseUrl:
          type: string
        model:
          type: string
        apiKeySet:
          type: boolean
        maxInputTokens:
          type: integer
        dimensions:
          type: integer
          nullable: true
          description: >
            Vector size the last successful probe embedding returned; the completion creates the
            vector table with it. Absent until the check succeeded.

    InstallationRerankModel:
      type: object
      description: >
        The rerank model with the rules of updateRerankModelSettings; the completion switches
        reranking on with it. Unlike there, the address must always pass the address check of
        models.
      required: [baseUrl, model]
      properties:
        baseUrl:
          type: string
          maxLength: 500
          description: Without the path /rerank and without userinfo.
          example: http://reranker:80
        model:
          type: string
          maxLength: 200
          example: BAAI/bge-reranker-v2-m3
        apiKey:
          type: string
          nullable: true
          maxLength: 2000
          description: Stored encrypted; omitted keeps a key saved before, empty removes it.

    InstallationRerankModelView:
      type: object
      required: [baseUrl, model, apiKeySet]
      properties:
        baseUrl:
          type: string
        model:
          type: string
        apiKeySet:
          type: boolean

    InstallationModelDiscoveryRequest:
      type: object
      description: The endpoint of a model step whose models are to be listed; nothing is saved.
      required: [baseUrl]
      properties:
        baseUrl:
          type: string
          minLength: 1
          maxLength: 500
          description: >
            The OpenAI-compatible endpoint, e.g. http://ollama:11434/v1. Must not contain userinfo;
            such an address is rejected with 400.
          example: http://ollama:11434/v1
        apiKey:
          type: string
          nullable: true
          maxLength: 2000
          description: >
            Plaintext key for this request only, never stored. Omitted uses the key saved with the
            step, only for its endpoint; empty sends none.

    InstallationAnswers:
      type: object
      description: >
        All values of the answer file in one request (docs/features/installation-and-settings.md).
        Over this API the secrets travel in the body, as in the single steps; a reference to a file
        on the backend (passwordFile, apiKeyFile) is accepted only in the file read at start-up, so
        that the API cannot read files of the backend. chatModel, embeddingModel, rerankModel, mail
        and branding are optional; without one its step is skipped, without rerankModel reranking
        stays off, without mail sending stays off,
        without branding the OPAA default stays. Parts of later steps (outboundProxy) are not
        evaluated by this version.
      required: [firstAdmin, signIn]
      properties:
        firstAdmin:
          $ref: "#/components/schemas/InstallationFirstAdmin"
        signIn:
          $ref: "#/components/schemas/InstallationSignIn"
        chatModel:
          $ref: "#/components/schemas/InstallationChatModel"
        embeddingModel:
          $ref: "#/components/schemas/InstallationEmbeddingModel"
        rerankModel:
          $ref: "#/components/schemas/InstallationRerankModel"
        mail:
          $ref: "#/components/schemas/InstallationMail"
        branding:
          $ref: "#/components/schemas/InstallationBranding"

    InstallationMail:
      type: object
      description: >
        The mail server OPAA sends through (ADR-0033, Entscheidung 10), with the rules of the mail
        settings of the administration. Unlike there, the host must pass the target address check
        of the installation: an internal mail server needs its host or host:port on
        OPAA_INSTALLATION_MAIL_TARGET_ALLOWLIST, and a port other than 25, 465, 587 and 2525 an
        entry naming exactly that host:port. The host takes no whitespace or control character,
        the sender address one mailbox only, and the password not the mask "***".
      required: [host, port, fromAddress]
      properties:
        host:
          type: string
          maxLength: 255
          example: smtp.stadt.example
        port:
          type: integer
          minimum: 1
          maximum: 65535
          example: 587
        encryption:
          $ref: "#/components/schemas/MailEncryption"
        username:
          type: string
          nullable: true
          maxLength: 255
          description: Empty connects without signing in.
        password:
          type: string
          nullable: true
          maxLength: 255
          description: >
            Stored encrypted; omitted keeps a password saved before, but only for the same host,
            port, user name and encryption; empty removes it.
        fromAddress:
          type: string
          maxLength: 320
          example: opaa@stadt.example
        fromName:
          type: string
          nullable: true
          maxLength: 120
          example: OPAA

    InstallationMailView:
      type: object
      required: [host, port, encryption, passwordSet, fromAddress]
      properties:
        host:
          type: string
        port:
          type: integer
        encryption:
          $ref: "#/components/schemas/MailEncryption"
        username:
          type: string
          nullable: true
        passwordSet:
          type: boolean
        fromAddress:
          type: string
        fromName:
          type: string
          nullable: true

    InstallationBranding:
      type: object
      description: >
        The texts, accent colour and colour scheme of the branding, with the rules of
        updateBranding: every field is optional, and an omitted, null or empty one means the OPAA
        default applies; the AI notice can be replaced but never switched off. The same object is
        returned as the saved values, null for the default. The images are uploaded in the
        branding administration after the installation; this step takes none.
      properties:
        productName:
          type: string
          nullable: true
          maxLength: 60
          example: Landesamt-Assistent
        claim:
          type: string
          nullable: true
          maxLength: 120
          example: Fragen. Belegen. Entscheiden.
        aiNotice:
          type: string
          nullable: true
          maxLength: 500
          description: >
            Empty, absent or without a visible character means the standard text; longer than 500
            characters or containing a control character or line break is a field error.
        primaryColor:
          type: string
          nullable: true
          description: >
            Six-digit hex triplet with a leading '#'; empty or absent means the OPAA default,
            anything else is a field error.
          pattern: "^$|^#[0-9A-Fa-f]{6}$"
          example: "#1292EE"
        defaultColorScheme:
          $ref: "#/components/schemas/ColorScheme"
