# Topic "compliance": its tags, paths and the components only this topic uses.
# Merged with all other fragments at build time, see root.yaml.
tags:
  - name: compliance
    description: >-
      Data collection disclosure of the installation: the compliance fact manifest of the running
      version joined with the effective values of the installation (ADR-0052, ADR-0053), and the
      self-disclosure of the signed-in person (docs/features/security-and-compliance.md,
      "Selbstauskunft"), and the retention periods of chats and of the anlassbezogene Klärung the
      system administration holds in the database (ADR-0060, Entscheidung 1).
paths:
  /api/v1/me/self-disclosure:
    get:
      operationId: getSelfDisclosureStatus
      tags: [compliance]
      summary: >-
        Status of the caller's own self-disclosure: available or switched off, exports and starts
        left today, from when the next is possible, the result of the last attempt and whether a
        new one is possible. Days are calendar days in the time zone of the installation, by the
        database clock.
      responses:
        "200":
          description: The status of the caller's self-disclosure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelfDisclosureStatus"
        "403":
          description: >-
            Called with the access token of an external AI tool (code
            SELF_DISCLOSURE_SIGN_IN_REQUIRED); the self-disclosure needs a sign-in at the interface.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/me/self-disclosure/tickets:
    post:
      operationId: createSelfDisclosureTicket
      tags: [compliance]
      summary: >-
        Issues the one-time ticket for the caller's next export, only after a recent sign-in. The
        ticket is valid for 60 seconds and once, does not extend the window of the sign-in, and a
        newer one replaces an older one; only its hash is stored. The person is always the caller,
        there is no parameter naming anyone else.
      responses:
        "201":
          description: The ticket for the download
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelfDisclosureTicket"
        "403":
          description: >-
            No recent sign-in (code RECENT_LOGIN_REQUIRED), the self-disclosure is switched off in
            this installation (code SELF_DISCLOSURE_DISABLED, German message naming the right of
            access under Art. 15 GDPR), or the call carries the access token of an external AI tool
            (code SELF_DISCLOSURE_SIGN_IN_REQUIRED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: >-
            An export of the caller is running (code SELF_DISCLOSURE_RUNNING), the daily limit of
            completed exports is reached (SELF_DISCLOSURE_DAILY_LIMIT) or the starts of the day are
            exhausted (SELF_DISCLOSURE_STARTS_EXHAUSTED). Retry-After names the seconds until the
            reservation lapses or the next day begins.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/me/self-disclosure/download:
    post:
      operationId: downloadSelfDisclosure
      tags: [compliance]
      security: []
      summary: >-
        Streams the self-disclosure of the ticket's holder as a ZIP, for a native form submission of
        the browser: the ticket travels in the form body, never in the URL, and is the only
        credential. Order of the entries: one <category>.json per category with records, then
        manifest.json, last index.html. No signature and no checksum file. Only a completely
        delivered export (central directory written and flushed) counts towards the daily limit;
        an aborted one consumes nothing, and the connection breaks instead of ending cleanly, so
        the client does not take a truncated archive for a complete one. The 503 answers when this
        instance streams as many exports as it may (opaa.self-disclosure.max-concurrent-exports),
        with Retry-After 60; the ticket stays valid, nothing is reserved or consumed.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/SelfDisclosureDownloadForm"
      responses:
        "200":
          description: >-
            The ZIP, streamed; file name opaa-selbstauskunft-<YYYY-MM-DD>.zip with the date in the
            time zone of the installation.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "403":
          description: The self-disclosure was switched off meanwhile (code SELF_DISCLOSURE_DISABLED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: >-
            Unknown, expired or already used ticket (code SELF_DISCLOSURE_TICKET_INVALID).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: >-
            An export of the holder is running or the day is exhausted, with the same codes and
            Retry-After as at the ticket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/admin/self-disclosure/settings:
    get:
      operationId: getSelfDisclosureSettings
      tags: [compliance]
      summary: The emergency switch and the daily limit of the self-disclosure (system admin only).
      responses:
        "200":
          description: The settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelfDisclosureSettings"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: updateSelfDisclosureSettings
      tags: [compliance]
      summary: >-
        Changes the emergency switch or the daily limit (system admin only); acts on every instance
        without a restart, a running export runs to its end. Every change is the audit event
        SELF_DISCLOSURE_SETTINGS_CHANGED with before and after of the changed keys.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelfDisclosureSettingsUpdate"
      responses:
        "200":
          description: The settings after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelfDisclosureSettings"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/retention/chat-auto-cleanup:
    get:
      operationId: getChatAutoCleanupRetention
      tags: [compliance]
      summary: >-
        The periods of the automatic chat cleanup a space can switch on (system admin only): the
        values in force, the factory defaults and whether the administration set its own.
      responses:
        "200":
          description: The periods in force
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatAutoCleanupRetention"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: updateChatAutoCleanupRetention
      tags: [compliance]
      summary: >-
        Sets both periods of the automatic chat cleanup, or with both absent returns them to the
        factory defaults (system admin only); one period alone is refused. Acts on every instance
        from the next nightly run, which pauses while a retired variable still sets another value. A change is the audit event CHAT_AUTO_CLEANUP_PERIODS_CHANGED
        with before and after; a call that changes nothing writes neither.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatAutoCleanupRetentionUpdate"
      responses:
        "200":
          description: The periods after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatAutoCleanupRetention"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/retention/locked-account-chats:
    get:
      operationId: getLockedAccountChatRetention
      tags: [compliance]
      summary: >-
        Whether and after how many days the chats of a local account locked by the administration
        are deleted (system admin only), with the factory defaults and whether the administration
        set its own.
      responses:
        "200":
          description: The setting in force
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockedAccountChatRetention"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: updateLockedAccountChatRetention
      tags: [compliance]
      summary: >-
        Sets switch and period of the deletion of the chats of locked local accounts, or with both
        absent returns them to the factory defaults (system admin only); one of them alone is
        refused. Switching off forgets the moment periods count from, so switching on again starts
        every period anew. A change is the audit event LOCKED_ACCOUNT_CHAT_CLEANUP_SETTINGS_CHANGED
        with before and after; a call that changes nothing writes neither.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LockedAccountChatRetentionUpdate"
      responses:
        "200":
          description: The setting after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockedAccountChatRetention"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/retention/incident-scopes:
    get:
      operationId: getIncidentScopeRetention
      tags: [compliance]
      summary: >-
        How many calendar years after the end of its usability a grant of the anlassbezogene
        Klärung is kept (system admin only), with the factory default and whether the
        administration set its own.
      responses:
        "200":
          description: The period in force
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentScopeRetention"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: updateIncidentScopeRetention
      tags: [compliance]
      summary: >-
        Sets the period between 1 and 10 calendar years, or with the value absent returns it to the
        factory default of one year (system admin only). Acts on every instance from the next daily
        run. A change is the audit event INCIDENT_SCOPE_RETENTION_CHANGED with before and after; a
        call that changes nothing writes neither.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentScopeRetentionUpdate"
      responses:
        "200":
          description: The period after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentScopeRetention"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/compliance/data-collection-disclosure:
    get:
      operationId: getDataCollectionDisclosure
      tags: [compliance]
      summary: >-
        Auskunft über die Datenerhebung with configuration export, machine-readable (system admin
        only). Holds no secrets, no personal data and no content. Every call, a refused one
        included, writes an audit event DATA_COLLECTION_DISCLOSURE_EXPORTED.
      description: >-
        The fact manifest of the running version in the form of `manifest` in faktenblaetter.json,
        so the delta tooling reads both the same way, plus the effective values of the
        installation, the same whichever instance answers: every setting of the manifest with its
        effective value, whether all running instances hold it alike, and the time of its last change,
        whether each outbound data flow currently happens, the connector types in use and the
        configured model providers. A configuration value is exported only when the manifest names
        its key as a setting; addresses lose user information, query and fragment. The protocol part
        counts the anlassbezogenen Klärungen of the reporting period by purpose, without persons.
      parameters:
        - $ref: "#/components/parameters/DisclosurePeriodFrom"
        - $ref: "#/components/parameters/DisclosurePeriodTo"
      responses:
        "200":
          description: The disclosure of this instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataCollectionDisclosure"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/compliance/data-collection-disclosure/markdown:
    get:
      operationId: getDataCollectionDisclosureMarkdown
      tags: [compliance]
      summary: >-
        The same disclosure as readable Markdown for the data protection officer and the staff
        council (system admin only); also written to the audit log on every call.
      parameters:
        - $ref: "#/components/parameters/DisclosurePeriodFrom"
        - $ref: "#/components/parameters/DisclosurePeriodTo"
      responses:
        "200":
          description: The disclosure of this instance as Markdown
          content:
            text/markdown:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  parameters:
    DisclosurePeriodFrom:
      name: from
      in: query
      required: false
      description: >-
        First day of the reporting period, always the first day of a month: the cases are counted
        per calendar month. Without it, 1 January of the previous calendar year. Answered with 400:
        a day that is not the first of a month, a year before 1970, a period whose start lies after
        its end, and a period that holds no completed month.
      schema:
        type: string
        format: date
    DisclosurePeriodTo:
      name: to
      in: query
      required: false
      description: >-
        Last day of the reporting period, always the last day of a month. Without it, 31 December
        of the current calendar year. Only completed months are reported: an end in the running
        month or later is moved to the last day of the previous month, and the response names the
        end it used. Answered with 400: a day that is not the last of a month, and a year after
        9999.
      schema:
        type: string
        format: date

  schemas:
    DataCollectionDisclosure:
      type: object
      required:
        [opaaVersion, commit, generatedAt, notice, manifest, instance, protocol]
      properties:
        opaaVersion:
          type: string
          description: Version of the running backend, 0.0.0-dev outside a release.
        commit:
          type: string
          description: Commit the running image was built from, "unbekannt" when not known.
        generatedAt:
          type: string
          format: date-time
        notice:
          type: string
        manifest:
          type: object
          additionalProperties: true
          description: >-
            The compliance fact manifest of the running version, the same object as `manifest` in
            faktenblaetter.json. Its schema is the record io.opaa.compliance.ComplianceManifest
            (ADR-0052, Entscheidung 2), not repeated here.
        instance:
          $ref: "#/components/schemas/DisclosureInstanceState"
        protocol:
          $ref: "#/components/schemas/DisclosureProtocol"

    DisclosureInstanceState:
      type: object
      required: [settings, dataFlows, connectorTypes, modelProviders, instances]
      properties:
        settings:
          type: array
          items:
            $ref: "#/components/schemas/DisclosureSetting"
        dataFlows:
          type: array
          items:
            $ref: "#/components/schemas/DisclosureDataFlow"
        connectorTypes:
          type: array
          items:
            $ref: "#/components/schemas/DisclosureConnectorType"
        modelProviders:
          type: array
          items:
            $ref: "#/components/schemas/DisclosureModelProvider"
        instances:
          type: array
          description: >-
            The running instances of the installation according to the instance register, the
            answering one included (ADR-0053).
          items:
            $ref: "#/components/schemas/DisclosureRunningInstance"

    DisclosureRunningInstance:
      type: object
      required: [version, startedAt]
      properties:
        version:
          type: string
        startedAt:
          type: string
          format: date-time
          description: When the instance joined the installation, by the database clock.

    DisclosureSetting:
      type: object
      description: One setting of the manifest with its effective value in the installation.
      required: [key, area, source, defaultValue, deviates, effect, sameOnAllInstances]
      properties:
        key:
          type: string
        area:
          type: string
        source:
          type: string
          description: PROPERTY, DATABASE or CONSTANT, as in the manifest.
        defaultValue:
          type: string
        effectiveValue:
          type: string
          nullable: true
          description: >-
            Absent when the value could not be determined or differs between the running
            instances.
        sameOnAllInstances:
          type: boolean
          description: >-
            Whether every running instance holds the same value; false only for a PROPERTY setting
            whose value differs between running instances, which then has no effectiveValue.
        deviates:
          type: boolean
          description: Whether the effective value differs from the delivered default.
        changedAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            Last change of the settings row holding a DATABASE setting; absent for other sources.
        range:
          type: string
          nullable: true
        effect:
          type: string

    DisclosureDataFlow:
      type: object
      required: [id, group, target]
      properties:
        id:
          type: string
        group:
          type: string
        target:
          type: string
        active:
          type: boolean
          nullable: true
          description: >-
            Whether the flow is switched on in this instance; absent where it happens only on an
            action of a person and no switch decides it.

    DisclosureConnectorType:
      type: object
      required: [type, libraries, connectionProfiles]
      properties:
        type:
          type: string
        libraries:
          type: integer
          format: int64
        connectionProfiles:
          type: integer
          format: int64

    DisclosureModelProvider:
      type: object
      required: [role, active]
      properties:
        role:
          type: string
          description: CHAT, EMBEDDING, RERANK or TRANSCRIPTION.
        name:
          type: string
          nullable: true
        baseUrl:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        active:
          type: boolean

    DisclosureProtocol:
      type: object
      description: >-
        The description of the audit log for the staff council: its fields with granularity,
        purpose and retention, the query paths there are and the ones there are not.
      required: [fields, queryPaths, absentQueryPaths, networkAddress, incidentScopeCases]
      properties:
        fields:
          type: array
          items:
            $ref: "#/components/schemas/DisclosureProtocolField"
        queryPaths:
          type: array
          items:
            $ref: "#/components/schemas/DisclosureQueryPath"
        absentQueryPaths:
          type: array
          items:
            type: string
        networkAddress:
          type: string
        incidentScopeCases:
          $ref: "#/components/schemas/DisclosureIncidentScopeCases"

    DisclosureIncidentScopeCases:
      type: object
      description: >-
        How often the anlassbezogene Klärung was requested, approved and ended in the reporting
        period, by purpose: no person, no reason, no grant id and no date finer than the month.
        Only completed months count, so repeated calls cannot show a case while its month runs.
        heldChatDeletions counts how often the administration held the deletion of the chats of a
        locked account in the period, without person or account.
      required: [from, to, smallCountThreshold, purposes, heldChatDeletions, notes]
      properties:
        from:
          type: string
          format: date
          description: First day of the reporting period.
        to:
          type: string
          format: date
          description: >-
            Last day of the reporting period as reported: the requested end, or the last day of the
            last completed month if the request reached further.
        smallCountThreshold:
          type: integer
          description: >-
            A count from 1 up to below this value is not given exactly but as belowThreshold.
        purposes:
          type: array
          description: Every purpose of the closed list, in its order, with zero counts as well.
          items:
            $ref: "#/components/schemas/DisclosureIncidentScopePurposeCases"
        heldChatDeletions:
          $ref: "#/components/schemas/DisclosureCaseCount"
        notes:
          type: array
          description: What the counts mean and where they end, as readable sentences.
          items:
            type: string

    DisclosureIncidentScopePurposeCases:
      type: object
      required: [purpose, label, requested, approved, expired]
      properties:
        purpose:
          $ref: "#/components/schemas/AuditIncidentScopePurpose"
        label:
          type: string
          description: The purpose in words.
        requested:
          $ref: "#/components/schemas/DisclosureCaseCount"
        approved:
          $ref: "#/components/schemas/DisclosureCaseCount"
        expired:
          $ref: "#/components/schemas/DisclosureCaseCount"

    DisclosureCaseCount:
      type: object
      description: >-
        One count of the reporting period. Zero and counts from the threshold on are exact; a count
        below it has no count, only belowThreshold.
      required: [belowThreshold]
      properties:
        count:
          type: integer
          nullable: true
        belowThreshold:
          type: boolean

    DisclosureProtocolField:
      type: object
      required: [name, granularity, purpose, retention]
      properties:
        name:
          type: string
        granularity:
          type: string
        purpose:
          type: string
        retention:
          type: string

    DisclosureQueryPath:
      type: object
      required: [name, description]
      properties:
        name:
          type: string
        description:
          type: string

    SelfDisclosureStatus:
      type: object
      required:
        [
          enabled,
          dailyLimit,
          completedToday,
          startsToday,
          remainingExports,
          remainingStarts,
          running,
          retryPossible,
        ]
      properties:
        enabled:
          type: boolean
          description: Whether the self-disclosure is switched on in this installation.
        dailyLimit:
          type: integer
          description: Completed exports per person and calendar day.
        completedToday:
          type: integer
        startsToday:
          type: integer
        remainingExports:
          type: integer
        remainingStarts:
          type: integer
          description: Starts left today; at most the daily limit plus four per day.
        running:
          type: boolean
          description: Whether an export of the caller is streaming right now.
        blocked:
          type: string
          nullable: true
          enum: [DISABLED, RUNNING_EXPORT, DAILY_LIMIT, STARTS_EXHAUSTED]
          description: Why no export can start now; absent when one can.
        nextPossibleAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            When an export is possible again: the lapse of the running export's reservation or the
            start of the next day. Absent when an export is possible now or switched off.
        lastCompletedAt:
          type: string
          format: date-time
          nullable: true
          description: The last completely delivered export.
        lastResult:
          type: string
          nullable: true
          enum: [COMPLETED, ABORTED]
          description: The result of the last ended attempt; a reservation that lapsed counts as ABORTED.
        retryPossible:
          type: boolean
          description: Whether the last attempt aborted and a new one can start now.

    SelfDisclosureTicket:
      type: object
      required: [ticket, expiresInSeconds]
      properties:
        ticket:
          type: string
          description: The one-time ticket for POST /api/v1/me/self-disclosure/download.
        expiresInSeconds:
          type: integer

    SelfDisclosureDownloadForm:
      type: object
      required: [ticket]
      properties:
        ticket:
          type: string

    SelfDisclosureSettings:
      type: object
      required: [enabled, dailyLimit, updatedAt]
      properties:
        enabled:
          type: boolean
        dailyLimit:
          type: integer
          minimum: 1
          maximum: 10
        updatedAt:
          type: string
          format: date-time

    SelfDisclosureSettingsUpdate:
      type: object
      description: The keys to change; an absent key stays as it is.
      properties:
        enabled:
          type: boolean
          nullable: true
        dailyLimit:
          type: integer
          nullable: true
          minimum: 1
          maximum: 10

    ChatAutoCleanupRetention:
      type: object
      required:
        - archiveAfterDays
        - deleteAfterDays
        - defaultArchiveAfterDays
        - defaultDeleteAfterDays
        - overridden
        - pausedBy
      properties:
        archiveAfterDays:
          type: integer
          description: Days without activity after which a chat that is not pinned is archived.
        deleteAfterDays:
          type: integer
          description: Days in the chat archive after which a chat is deleted.
        defaultArchiveAfterDays:
          type: integer
        defaultDeleteAfterDays:
          type: integer
        overridden:
          type: boolean
          description: Whether the administration set its own periods instead of the factory defaults.
        pausedBy:
          type: array
          description: >-
            The retired variables a live instance still sets to a period longer than the one in
            force (or switched off, or unreadable) while the administration set no value of its
            own; while there is one, the deletion run pauses.
          items:
            $ref: "#/components/schemas/RetentionPause"

    ChatAutoCleanupRetentionUpdate:
      type: object
      description: Both periods, or neither to return to the factory defaults.
      properties:
        archiveAfterDays:
          type: integer
          nullable: true
          minimum: 90
          maximum: 3650
        deleteAfterDays:
          type: integer
          nullable: true
          minimum: 30
          maximum: 3650

    LockedAccountChatRetention:
      type: object
      required: [enabled, deleteAfterDays, defaultEnabled, defaultDeleteAfterDays, overridden, pausedBy]
      properties:
        enabled:
          type: boolean
          description: Whether the nightly run deletes the chats of accounts locked by the administration.
        deleteAfterDays:
          type: integer
          description: Days between the lock by the administration and the deletion.
        defaultEnabled:
          type: boolean
        defaultDeleteAfterDays:
          type: integer
        overridden:
          type: boolean
          description: Whether the administration set its own values instead of the factory defaults.
        pausedBy:
          type: array
          description: >-
            The retired variables a live instance still sets to a period longer than the one in
            force (or switched off, or unreadable) while the administration set no value of its
            own; while there is one, the deletion run pauses.
          items:
            $ref: "#/components/schemas/RetentionPause"

    LockedAccountChatRetentionUpdate:
      type: object
      description: Switch and period, or neither to return to the factory defaults.
      properties:
        enabled:
          type: boolean
          nullable: true
        deleteAfterDays:
          type: integer
          nullable: true
          minimum: 90
          maximum: 3650

    IncidentScopeRetention:
      type: object
      required: [retentionYears, defaultRetentionYears, overridden, pausedBy]
      properties:
        retentionYears:
          type: integer
          description: >-
            Calendar years after the end of a grant's usability until it is deleted at the end of
            that year.
        defaultRetentionYears:
          type: integer
        overridden:
          type: boolean
          description: Whether the administration set its own period instead of the factory default.
        pausedBy:
          type: array
          description: >-
            The retired variables a live instance still sets to a period longer than the one in
            force (or switched off, or unreadable) while the administration set no value of its
            own; while there is one, the deletion run pauses.
          items:
            $ref: "#/components/schemas/RetentionPause"

    IncidentScopeRetentionUpdate:
      type: object
      description: The period, or none to return to the factory default.
      properties:
        retentionYears:
          type: integer
          nullable: true
          minimum: 1
          maximum: 10

    RetentionPause:
      type: object
      required: [variable, retiredValue, effectiveValue]
      description: >-
        A retired environment variable that still sets a retention period on a live instance, with
        its value and the value in force (ADR-0060, Entscheidung 1: never taken over).
      properties:
        variable:
          type: string
          example: OPAA_CHAT_AUTO_CLEANUP_DELETE_AFTER_DAYS
        retiredValue:
          type: string
          example: "730"
        effectiveValue:
          type: string
          example: "365"
