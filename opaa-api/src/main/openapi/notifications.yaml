# Topic "notifications": its tags, paths and the components only this topic uses.
# Merged with all other fragments at build time, see root.yaml.
tags:
  - name: notification
    description: Notifications of the caller.
paths:
  /api/v1/notifications:
    get:
      operationId: listNotifications
      tags: [notification]
      summary: The calling user's own notifications, newest first, capped at limit.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Maximum number of notifications to return, newest first.
      responses:
        "200":
          description: The caller's notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationResponse"
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/v1/notifications/{notificationId}/read:
    parameters:
      - name: notificationId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      operationId: markNotificationRead
      tags: [notification]
      summary: Marks one of the caller's own notifications as read. Idempotent.
      responses:
        "204":
          description: Marked read (or already was)
        "404":
          $ref: "#/components/responses/NotFound"

components:
  schemas:
    NotificationType:
      type: string
      description: >
        The closed vocabulary of a notification's type - see io.opaa.api.types.NotificationType,
        which is the sole write guard since the database check constraint that used to enforce the
        same set was dropped.
      enum:
        [
          ASSET_ASSOCIATED_TO_MIXED_SPACE,
          EXTERNAL_ACCESS_MASS_RETRIEVAL,
          GROUP_MEMBER_ADDED,
          GROUP_MEMBER_REMOVED,
          CONNECTION_EXPIRED,
          CONNECTION_ENDED,
          PRIVATE_LIBRARY_RELEASED,
          SOURCE_FULL_SYNC_FORCED,
          CONNECTION_EXPIRING,
          CONNECTION_PROFILE_SECRET_EXPIRING,
          SOURCE_CONNECTION_EXPIRING,
          SOURCE_CONNECTION_EXPIRED,
          SOURCE_CONNECTION_ENDED,
          SELF_DISCLOSURE_STARTED,
          AUDITOR_ROLE_REQUESTED,
          AUDITOR_ROLE_GRANTED,
          AUDITOR_ROLE_REVOKED,
          MAIL_CONFIGURATION_CHANGED,
        ]
      example: ASSET_ASSOCIATED_TO_MIXED_SPACE

    NotificationResponse:
      type: object
      required: [id, type, title, createdAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/NotificationType"
        objectType:
          allOf:
            - $ref: "#/components/schemas/AuditObjectType"
          nullable: true
        objectId:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
          example: Ihre Bibliothek wurde in einem Space bereitgestellt
        body:
          type: string
          nullable: true
        readAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
