# Topic "transcriptions": its tags, paths and the components only this topic uses.
# Merged with all other fragments at build time, see root.yaml.
tags:
  - name: transcription
    description: Dictating a chat question - speech to text through the transcription model role.
paths:
  /api/v1/transcriptions/availability:
    get:
      operationId: getTranscriptionAvailability
      tags: [transcription]
      summary: >
        Whether the caller can dictate right now. Answered from configuration and the last
        known state of the transcription role, never by a fresh call to the endpoint. Not reachable
        while the feature speech-input is switched off.
      responses:
        "200":
          description: The dictation the installation offers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptionAvailabilityResponse"

  /api/v1/transcriptions:
    post:
      operationId: createTranscription
      tags: [transcription]
      summary: >
        Turns one recorded audio clip into text. The request body is the recording itself,
        sent with its audio content type (e.g. audio/webm;codecs=opus or audio/mp4) - deliberately
        not multipart, so the clip is read straight into memory and never buffered to disk. It is
        passed on to the transcription endpoint (OpenAI-compatible POST
        {baseUrl}/audio/transcriptions) and answered as text; neither the audio nor the text is
        stored or logged. The installation's and the caller's vocabulary lists go along as prompt,
        the caller's last; without a list no prompt is sent. Depends on the transcription endpoint: 503 while the role is not usable,
        502 when the endpoint fails or answers unreadably. Not reachable while the feature
        speech-input is switched off.
      requestBody:
        required: true
        content:
          audio/*:
            schema:
              type: string
              format: binary
              description: >
                The recording as the browser made it. Accepted are WebM, Ogg, MP4, MPEG and WAV;
                the endpoint converts it, the backend does not.
      responses:
        "200":
          description: The recognised text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptionResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/me/transcription-vocabulary:
    get:
      operationId: getMyTranscriptionVocabulary
      tags: [transcription]
      summary: >
        The caller's own vocabulary list for dictation. Visible only to the caller, never
        evaluated, deleted with the account. Not reachable while the feature speech-input is
        switched off.
      responses:
        "200":
          description: The caller's list, empty when none is stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptionVocabulary"
    put:
      operationId: updateMyTranscriptionVocabulary
      tags: [transcription]
      summary: >
        Replaces the caller's own vocabulary list; an empty list removes it. Sent with every
        dictation of the caller as prompt, after the installation's list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranscriptionVocabulary"
      responses:
        "200":
          description: The list as stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptionVocabulary"
        "400":
          $ref: "#/components/responses/ValidationError"

components:
  schemas:
    TranscriptionVocabulary:
      type: object
      required: [vocabulary]
      properties:
        vocabulary:
          type: string
          maxLength: 500
          description: >
            Terms, names and abbreviations, comma-separated or as an example sentence; stripped
            when stored, empty for none.
          example: Az. 12-345/26, Referat Z 4, Grundsteuermessbescheid
    TranscriptionAvailabilityResponse:
      type: object
      required: [available, realtimeAvailable]
      properties:
        available:
          type: boolean
          description: >
            Whether dictation by recording and sending one clip works right now - the role is
            switched on, configured and its endpoint answered the last probe.
        realtimeAvailable:
          type: boolean
          description: >
            Whether text can appear while speaking: a live upstream is stored, the role is usable,
            the last probe of the live upstream succeeded and the installation has a free live
            session. The browser then opens the WebSocket GET /api/v1/transcriptions/stream
            (subprotocol opaa-transcription.v1; the bearer token travels as a second subprotocol
            opaa-bearer.<token>, since a browser cannot set headers on a WebSocket). The server sends
            {"type":"ready","sampleRate":24000|16000} first; the client sends binary frames of PCM16
            mono little-endian audio in that rate and finally {"type":"commit"}; the server answers
            {"type":"delta","text"} while speaking, {"type":"done","text"} at the end and
            {"type":"error","reason"} on any failure, after which the client sends its recording
            through createTranscription instead.
    TranscriptionResponse:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: The recognised text, trimmed; empty when nothing was understood.
          example: Welche Fristen gelten für den Bauantrag?
