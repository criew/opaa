# Topic "branding": its tags, paths and the components only this topic uses.
# Merged with all other fragments at build time, see root.yaml.
tags:
  - name: branding
    description: Branding of the user interface.
paths:
  /api/v1/branding:
    get:
      operationId: getBranding
      tags: [branding]
      summary: >
        The branding configuration in effect (#582): product name, claim, accent colour, default
        colour scheme and - if one is configured - the path the logo is served from. Readable
        without authentication (#583): the sign-in page renders before there is a session and still
        has to carry the operator's own name and logo. What that exposes is bounded to exactly
        these fields - which Behörde runs the deployment, which anyone reaching its sign-in page
        can already tell. Never fails for want of configuration - a deployment that has never configured anything gets the OPAA
        defaults, each field resolved individually, so an operator who only sets a logo keeps the
        standard product name.
      responses:
        "200":
          description: Effective branding configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingResponse"

  /api/v1/branding/logo:
    get:
      operationId: getBrandingLogo
      tags: [branding]
      summary: >
        The configured logo's bytes, served with the content type the server itself detected at
        upload time - never one the uploader declared (#582: "Content-Type beim Ausliefern
        erzwingen"). Readable without authentication, for the same reason and with the same bounds
        as GET /api/v1/branding above. Answered with 404 while no logo is configured; clients read
        BrandingResponse.logoUrl rather than calling this unconditionally. The response carries
        X-Content-Type-Options and a restrictive Content-Security-Policy so a browser can never
        be talked into treating the bytes as anything but an image.
      responses:
        "200":
          description: Logo bytes
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/branding/login-logo:
    get:
      operationId: getBrandingLoginLogo
      tags: [branding]
      summary: >
        The sign-in page's own logo (#1910), served under exactly the same rules as GET
        /api/v1/branding/logo - detected content type, nosniff, restrictive Content-Security-Policy,
        readable without authentication. A separate image rather than a size variant of the app
        logo: the sign-in page renders it several times larger than the sidebar chrome does, and an
        emblem that works at 28 px is rarely the one a house wants at 96 px. Answered with 404 while
        none is configured; clients read BrandingResponse.loginLogoUrl and fall back to logoUrl.
      responses:
        "200":
          description: Login logo bytes
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/branding/login-background:
    get:
      operationId: getBrandingLoginBackground
      tags: [branding]
      summary: >
        The sign-in page's optional background image (#1910), served under the same rules as the
        two logos above and readable without authentication for the same reason. Answered with 404
        while none is configured; without one the sign-in page keeps its plain navy panel.
      responses:
        "200":
          description: Login background bytes
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/system/branding:
    put:
      operationId: updateBranding
      tags: [branding]
      summary: >
        Replace the branding configuration (SYSTEM_ADMIN only, #582). A full replacement, as PUT
        implies: an omitted or null field is not "leave as is" but "back to the OPAA default", so
        an operator can undo a customisation without a dedicated reset endpoint. The logo is not
        part of this request - it has its own endpoints below, because a binary upload and a JSON
        settings edit have nothing to gain from being welded into one multipart request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandingUpdateRequest"
      responses:
        "200":
          description: Branding updated; the effective configuration afterwards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/system/branding/logo:
    put:
      operationId: updateBrandingLogo
      tags: [branding]
      summary: >
        Upload the operator's logo (SYSTEM_ADMIN only, #582). Accepts PNG and JPEG only -
        SVG is rejected outright rather than sanitised, because an SVG is a document that can
        carry script and a sanitiser that is wrong once is worse than a format restriction that
        is inconvenient always (#582 explicitly allows either). The declared content type is not
        trusted: the actual bytes are inspected, and a mismatch is rejected.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Logo stored; the effective configuration afterwards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
    delete:
      operationId: deleteBrandingLogo
      tags: [branding]
      summary: >
        Remove the configured logo (SYSTEM_ADMIN only, #582) - the app falls back to the OPAA
        standard logo. Idempotent: removing a logo that is not there succeeds.
      responses:
        "200":
          description: Logo removed; the effective configuration afterwards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/system/branding/login-logo:
    put:
      operationId: updateBrandingLoginLogo
      tags: [branding]
      summary: >
        Upload the sign-in page's own logo (SYSTEM_ADMIN only, #1910). Same rules as the app logo -
        PNG and JPEG only, SVG rejected rather than sanitised, declared content type not trusted,
        at most 512 KiB and 2000 px per edge.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Login logo stored; the effective configuration afterwards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
    delete:
      operationId: deleteBrandingLoginLogo
      tags: [branding]
      summary: >
        Remove the sign-in page's own logo (SYSTEM_ADMIN only, #1910) - the page falls back to the
        app logo, and to the OPAA standard mark where none is configured either. Idempotent.
      responses:
        "200":
          description: Login logo removed; the effective configuration afterwards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/system/branding/login-background:
    put:
      operationId: updateBrandingLoginBackground
      tags: [branding]
      summary: >
        Upload the sign-in page's background image (SYSTEM_ADMIN only, #1910). PNG and JPEG only,
        for the same reasons as the logos, but with its own ceilings: at most 2 MiB and 4000 px per
        edge, because this one is a photograph covering half a screen rather than a piece of chrome.
        The page lays a fixed scrim over whatever is uploaded, so the text on it keeps its contrast
        regardless of the image (docs/design/accessibility.md).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Background stored; the effective configuration afterwards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
    delete:
      operationId: deleteBrandingLoginBackground
      tags: [branding]
      summary: >
        Remove the sign-in page's background image (SYSTEM_ADMIN only, #1910) - the page returns to
        its plain navy panel. Idempotent.
      responses:
        "200":
          description: Background removed; the effective configuration afterwards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  schemas:
    ColorScheme:
      type: string
      description: >
        The colour scheme a deployment starts users off in (#582). SYSTEM follows the operating
        system's own preference and is the OPAA default; LIGHT and DARK are an operator's
        deliberate override. Not a per-user setting - this is the deployment's starting point,
        which a user's own choice may still override in the browser.
      enum: [LIGHT, DARK, SYSTEM]
      example: SYSTEM

    BrandingResponse:
      type: object
      description: >
        The branding in effect - never a partially filled object. Every field carries either the
        operator's configured value or the OPAA default, resolved per field, so a client can
        render from this response alone without knowing what a default even is. logoUrl is the
        one exception: it is absent while no logo is configured, and the client falls back to the
        bundled OPAA logo.
      required: [productName, claim, primaryColor, defaultColorScheme]
      properties:
        productName:
          type: string
          example: OPAA
        claim:
          type: string
          example: Fragen. Belegen. Entscheiden.
        primaryColor:
          type: string
          description: Accent colour as a six-digit hex triplet with a leading '#'.
          pattern: "^#[0-9A-Fa-f]{6}$"
          example: "#1292EE"
        defaultColorScheme:
          $ref: "#/components/schemas/ColorScheme"
        logoUrl:
          type: string
          description: >
            Path the configured logo is served from, carrying a content-derived version parameter
            so a changed logo is fetched immediately while an unchanged one stays cacheable.
            Absent while no logo is configured.
          example: /api/v1/branding/logo?v=3f8a1c2d
        logoContentType:
          type: string
          description: >
            The server-detected media type of the configured logo - informational, for a
            management form that wants to show it. Absent while no logo is configured.
          example: image/png
        logoUpdatedAt:
          type: string
          format: date-time
          description: When the configured logo was last replaced. Absent while none is configured.
        loginLogoUrl:
          type: string
          description: >
            Path the sign-in page's own logo is served from, with the same content-derived version
            parameter logoUrl carries (#1910). Absent while none is configured, and the sign-in
            page then falls back to logoUrl.
          example: /api/v1/branding/login-logo?v=3f8a1c2d
        loginLogoContentType:
          type: string
          description: Server-detected media type of the sign-in logo. Absent while none is configured.
          example: image/png
        loginLogoUpdatedAt:
          type: string
          format: date-time
          description: When the sign-in logo was last replaced. Absent while none is configured.
        loginBackgroundUrl:
          type: string
          description: >
            Path the sign-in page's background image is served from, versioned like the logos
            (#1910). Absent while none is configured; the page then keeps its plain panel.
          example: /api/v1/branding/login-background?v=9b2e7c10
        loginBackgroundContentType:
          type: string
          description: Server-detected media type of the background image. Absent while none is configured.
          example: image/jpeg
        loginBackgroundUpdatedAt:
          type: string
          format: date-time
          description: When the background image was last replaced. Absent while none is configured.

    BrandingUpdateRequest:
      type: object
      description: >
        A full replacement of the non-binary branding fields. Every field is optional, and an
        omitted or null one means "the OPAA default applies again" rather than "keep the current
        value" - see the endpoint's own summary.
      properties:
        productName:
          type: string
          description: >
            Empty or omitted means the OPAA default applies again - which is why there is no
            minLength here: a cleared form field is how an operator undoes a customisation.
          maxLength: 60
          example: Landesamt-Assistent
        claim:
          type: string
          description: Empty or omitted means the OPAA default applies again.
          maxLength: 120
          example: Fragen. Belegen. Entscheiden.
        primaryColor:
          type: string
          description: >
            Six-digit hex triplet with a leading '#'. The empty string is accepted alongside it and
            means the OPAA default applies again; anything else is rejected with 400.
          pattern: "^$|^#[0-9A-Fa-f]{6}$"
          example: "#1292EE"
        defaultColorScheme:
          $ref: "#/components/schemas/ColorScheme"
