# Topic "models": its tags, paths and the components only this topic uses.
# Merged with all other fragments at build time, see root.yaml.
tags:
  - name: model
    description: LLM and embedding model configuration.
paths:
  /api/v1/admin/models:
    get:
      operationId: listLlmModels
      tags: [model]
      summary: List managed chat models (system admin only)
      description: >
        Stufe 1 (#757, docs/features/llm-integration.md#stufe-1-verwaltete-chat-modelle-in-umsetzung).
        Never carries an apiKey value - only apiKeySet, whether one is stored.
      responses:
        "200":
          description: List of managed chat models
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LlmModelResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      operationId: createLlmModel
      tags: [model]
      summary: Create a managed chat model (system admin only)
      description: >
        Created inactive; activateLlmModel is the only way a model becomes the systemwide active
        one, so creating and activating are always two distinguishable audit events even in the
        same request sequence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LlmModelRequest"
      responses:
        "201":
          description: Chat model created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmModelResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/models/{modelId}:
    parameters:
      - name: modelId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    put:
      operationId: updateLlmModel
      tags: [model]
      summary: Update a managed chat model's editable fields (system admin only)
      description: >
        A full replacement of every editable field except active, which only activateLlmModel
        changes. apiKey follows the three-way convention BrandingUpdateRequest already uses for
        its own optional fields: omitted (null) leaves the stored key unchanged, an empty string
        clears it, and any other value replaces it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LlmModelRequest"
      responses:
        "200":
          description: Chat model updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmModelResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: deleteLlmModel
      tags: [model]
      summary: Delete a managed chat model (system admin only)
      description: >
        Rejected with 409 while the model is the systemwide active one - a chat cannot be left
        without any model to answer with. Deactivate it via another model's activateLlmModel
        first.
      responses:
        "204":
          description: Chat model deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/admin/models/{modelId}/activate:
    post:
      operationId: activateLlmModel
      tags: [model]
      summary: Make a chat model the systemwide active one (system admin only)
      description: >
        Deactivates whichever model was active before, in the same transaction; wirkt beim
        nächsten Vorgang, ohne Neustart. A concurrent activation of a different model is rejected
        with 409 rather than surfacing as a server error.
      parameters:
        - name: modelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Chat model activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmModelResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/admin/models/test:
    post:
      operationId: testLlmModel
      tags: [model]
      summary: Probe a chat model connection, saved or not yet saved (system admin only)
      description: >
        A short probe call against the given baseUrl/modelIdentifier with a tight timeout, so a
        misconfigured address is caught here rather than by the next person asking a question. Also
        works for a draft that has not been saved yet, so the entry is checkable before it is
        stored. When modelId is given and apiKey is omitted, the stored, decrypted key of that
        model is used for the probe instead - the key itself is never accepted back from a client
        that never had it to begin with.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LlmModelTestRequest"
      responses:
        "200":
          description: >
            Test result - a 200 either way; the boolean success field carries the outcome, not the
            HTTP status, the same convention SourceConnectionTestResponse already uses.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmModelTestResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/models/embedding-info:
    get:
      operationId: getEmbeddingInfo
      tags: [model]
      summary: Get the current embedding model configuration (system admin only)
      description: >
        Read-only (#759). Unlike chat models, the embedding model is not managed through this API -
        a change requires a full re-index because existing vectors become incomparable
        (docs/features/llm-integration.md#sofortige-wirkung), so it stays a configuration value,
        not a writable admin resource.
      responses:
        "200":
          description: Current embedding configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbeddingInfoResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  schemas:
    LlmModelResponse:
      type: object
      description: >
        A managed chat model (Stufe 1, #757). Never carries the API key itself, even redacted -
        only apiKeySet, whether one is stored (docs/features/llm-integration.md#stufe-1-verwaltete-chat-modelle-in-umsetzung).
      required:
        [
          id,
          displayName,
          baseUrl,
          modelIdentifier,
          temperature,
          maxTokens,
          apiKeySet,
          active,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          example: Ollama lokal
        baseUrl:
          type: string
          example: http://ollama:11434/v1
        modelIdentifier:
          type: string
          example: phi3:mini
        temperature:
          type: number
          format: double
          example: 0.7
        maxTokens:
          type: integer
          example: 2000
        apiKeySet:
          type: boolean
          description: Whether an access key is stored - never the key itself.
        active:
          type: boolean
          description: Whether this is the one systemwide active chat model.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    LlmModelRequest:
      type: object
      description: >
        Used for both create and update. On update, apiKey follows the same three-way convention
        BrandingUpdateRequest already uses: omitted (null) leaves the stored key unchanged, an
        empty string clears it, any other value replaces it. On create, an omitted or empty apiKey
        simply means no key is stored - the key is optional (docs/features/llm-integration.md#ein-anbindungsweg-nicht-zwei),
        since a locally operated endpoint regularly requires no authentication at all.
      required: [displayName, baseUrl, modelIdentifier, temperature, maxTokens]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 120
          example: Ollama lokal
        baseUrl:
          type: string
          minLength: 1
          maxLength: 500
          description: >
            The OpenAI-compatible endpoint, including any provider-specific path suffix. Must not
            contain userinfo (https://user:secret@host/v1) - such an address is rejected with 400,
            because a stored base URL is returned by this API and written to the audit log. The
            access key belongs in apiKey.
          example: http://ollama:11434/v1
        modelIdentifier:
          type: string
          minLength: 1
          maxLength: 200
          example: phi3:mini
        temperature:
          type: number
          format: double
          minimum: 0
          maximum: 2
          example: 0.7
        maxTokens:
          type: integer
          minimum: 1
          example: 2000
        apiKey:
          type: string
          nullable: true
          description: >
            Write-only. Omitted (null) on update leaves the stored key unchanged; an empty string
            clears it; any other value replaces it. On create, omitted or empty means no key.

    LlmModelTestRequest:
      type: object
      description: >
        Tests a connection without requiring the entry to be saved first. When modelId is set and
        apiKey is omitted or empty, the stored, decrypted key of that model is used for the probe
        instead of requiring the caller to re-enter a key they can never read back - but only when
        baseUrl is same-origin with modelId's own stored baseUrl; otherwise the request is rejected
        with 400 rather than sending the stored key to a different address.
      required: [baseUrl, modelIdentifier]
      properties:
        baseUrl:
          type: string
          minLength: 1
          description: >
            Must not contain userinfo (https://user:secret@host/v1) - such an address is rejected
            with 400 before any probe, because the probe URI is logged on failure.
          example: http://ollama:11434/v1
        modelIdentifier:
          type: string
          minLength: 1
          example: phi3:mini
        apiKey:
          type: string
          nullable: true
          description: Plaintext key for this test only, never stored.
        modelId:
          type: string
          format: uuid
          nullable: true
          description: >
            When set and apiKey is omitted or empty, reuses that model's stored, decrypted key for
            the probe, provided baseUrl is same-origin with the model's own stored baseUrl - 404 if
            modelId does not exist, 400 if baseUrl is a different origin.

    LlmModelTestResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
        message:
          type: string
          description: German, user-facing outcome - a distinguishable message for unreachable, unauthenticated and unknown-model failures.
          example: Verbindung erfolgreich, Modell hat geantwortet.

    EmbeddingInfoResponse:
      type: object
      description: >
        The embedding model actually configured (#759), read-only - see
        docs/features/llm-integration.md#sofortige-wirkung for why it is not editable here.
      required: [provider, model, dimensions]
      properties:
        provider:
          type: string
          description: Configured embedding provider ("openai" or "ollama").
          example: ollama
        model:
          type: string
          example: nomic-embed-text
        dimensions:
          type: integer
          description: Vector dimensionality of the configured pgvector store.
          example: 1536
