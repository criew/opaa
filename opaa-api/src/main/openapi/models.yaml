# Topic "models": its tags, paths and the components only this topic uses.
# Merged with all other fragments at build time, see root.yaml.
tags:
  - name: model
    description: Chat, embedding, rerank and transcription model configuration.
paths:
  /api/v1/admin/models:
    get:
      operationId: listLlmModels
      tags: [model]
      summary: List managed chat models (system admin only)
      description: >
        Stufe 1 (docs/features/llm-integration.md#stufe-1-verwaltete-chat-modelle-in-umsetzung).
        Never carries an apiKey value - only apiKeySet, whether one is stored.
      responses:
        "200":
          description: List of managed chat models
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LlmModelResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      operationId: createLlmModel
      tags: [model]
      summary: Create a managed chat model (system admin only)
      description: >
        Created inactive; activateLlmModel is the only way a model becomes the systemwide active
        one, so creating and activating are always two distinguishable audit events even in the
        same request sequence. The address is checked against the address check of models (400):
        an address in an internal range passes only with its host on the allowlist of models
        (OPAA_MODEL_TARGET_VALIDATION_ALLOWLIST), never on the one of the sources.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LlmModelRequest"
      responses:
        "201":
          description: Chat model created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmModelResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/models/{modelId}:
    parameters:
      - name: modelId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    put:
      operationId: updateLlmModel
      tags: [model]
      summary: Update a managed chat model's editable fields (system admin only)
      description: >
        A full replacement of every editable field except active, which only activateLlmModel
        changes. apiKey follows the three-way convention BrandingUpdateRequest already uses for
        its own optional fields: omitted (null) leaves the stored key unchanged, an empty string
        clears it, and any other value replaces it. A baseUrl other than the stored endpoint passes
        the address check of models first (400), as for createLlmModel; the stored one is kept
        unchecked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LlmModelRequest"
      responses:
        "200":
          description: Chat model updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmModelResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: deleteLlmModel
      tags: [model]
      summary: Delete a managed chat model (system admin only)
      description: >
        Rejected with 409 while the model is the systemwide active one - a chat cannot be left
        without any model to answer with. Deactivate it via another model's activateLlmModel
        first.
      responses:
        "204":
          description: Chat model deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/admin/models/{modelId}/activate:
    post:
      operationId: activateLlmModel
      tags: [model]
      summary: Make a chat model the systemwide active one (system admin only)
      description: >
        Deactivates whichever model was active before, in the same transaction; wirkt beim
        nächsten Vorgang, ohne Neustart. A concurrent activation of a different model is rejected
        with 409 rather than surfacing as a server error.
      parameters:
        - name: modelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Chat model activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmModelResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/admin/models/test:
    post:
      operationId: testLlmModel
      tags: [model]
      summary: Probe a chat model connection, saved or not yet saved (system admin only)
      description: >
        A short probe call against the given baseUrl/modelIdentifier with a tight timeout, so a
        misconfigured address is caught here rather than by the next person asking a question. Also
        works for a draft that has not been saved yet, so the entry is checkable before it is
        stored. When modelId is given and apiKey is omitted, the stored, decrypted key of that
        model is used for the probe instead - the key itself is never accepted back from a client
        that never had it to begin with. A baseUrl other than the stored endpoint of storedModelId
        (or modelId) fails the address check of models before anything is sent, as for
        createLlmModel.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LlmModelTestRequest"
      responses:
        "200":
          description: >
            Test result - a 200 either way; the boolean success field carries the outcome, not the
            HTTP status, the same convention SourceConnectionTestResponse already uses.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmModelTestResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/models/discover:
    post:
      operationId: discoverLlmModels
      tags: [model]
      summary: List the models an endpoint offers, saved or not yet saved (system admin only)
      description: >
        Asks the OpenAI-compatible endpoint at baseUrl for its models (GET {baseUrl}/models) with a
        short timeout and a bounded response size, so the form can offer them for selection instead
        of requiring the exact identifier to be typed. When the endpoint is recognized as Ollama,
        each model is enriched with details from /api/tags and /api/show on the same origin (size,
        family, parameter count, context length, capabilities). The stored-key rule is the same as
        for testLlmModel: with modelId and without apiKey, the stored key of that model is used,
        but only when baseUrl is same-origin with the model's own stored baseUrl - otherwise 400
        before the key is decrypted. The address check of models is the one of testLlmModel; a
        refused address answers with failure INVALID_ADDRESS.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LlmModelDiscoveryRequest"
      responses:
        "200":
          description: >
            Discovery result - a 200 either way; success and failure carry the outcome, not the
            HTTP status, the same convention testLlmModel uses.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmModelDiscoveryResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/models/embedding-info:
    get:
      operationId: getEmbeddingInfo
      tags: [model]
      summary: Get the installed embedding model (system admin only)
      description: >
        The embedding model row of the installation, without its key. A change goes through the
        guided model change with a re-embedding, or the endpoint change of the same model
        (ADR-0061, docs/features/embedding-model-change.md).
      responses:
        "200":
          description: Current embedding configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbeddingInfoResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/models/embedding/probe:
    post:
      operationId: probeEmbeddingModelChange
      tags: [model]
      summary: Probe a draft of the embedding model and preview its change (system admin only)
      description: >
        Embeds fixed probe texts with the draft and compares the vectors with the reference anchor
        of the installed model. kind ENDPOINT_CHANGE means the same model at another endpoint,
        changeable without a re-embedding; MODEL_CHANGE comes with a preview - chunks, estimated
        tokens, duration from a throughput probe with artificial texts, and storage. No content of
        a library reaches the draft's endpoint, nothing is stored and nothing is audited. apiKey
        omitted uses the stored key, only for the stored endpoint (otherwise 400); an empty string
        sends none. An address other than the stored endpoint passes the address check of models
        (400 with code BLOCKED). Probes and confirmations share an installation-wide limit (429).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmbeddingModelDraft"
      responses:
        "200":
          description: The probe; succeeded false names the failure in message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbeddingModelProbeResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/admin/models/embedding/change:
    post:
      operationId: startEmbeddingModelChange
      tags: [model]
      summary: Confirm a change of the embedding model and start the re-embedding (system admin only)
      description: >
        Probes the draft again and refuses another size than expectedDimensions (409), then sets the
        model and its key under a new generation, keeps the previous model and starts the
        re-embedding in one transaction. The vector search is suspended from now until the switch;
        after the switch the previous vectors are gone. Refused while another change waits for its
        switch, while the instances run different versions, or when the vector table stays locked
        (409, can be repeated). A running refill ends. Recorded in the audit log as
        EMBEDDING_MODEL_CHANGED.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmbeddingModelChangeRequest"
      responses:
        "200":
          description: The change was confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbeddingReindexStatusResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      operationId: discardEmbeddingModelChange
      tags: [model]
      summary: Discard a confirmed change before its switch (system admin only)
      description: >
        The previous model applies again, the target column goes, a running re-embedding ends and
        the vector search resumes at once. Chunks written since the confirmation without a vector
        of the previous model are refilled by a run of this instance. Refused while the switch is
        under way, when nothing waits to be discarded, while the instances run different versions,
        or when the vector table stays locked (409). Recorded as EMBEDDING_MODEL_CHANGE_DISCARDED.
      responses:
        "200":
          description: The change was discarded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbeddingReindexStatusResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/admin/models/embedding/endpoint:
    put:
      operationId: changeEmbeddingModelEndpoint
      tags: [model]
      summary: Move the embedding model to another endpoint without a re-embedding (system admin only)
      description: >
        Only for the same model name and size whose probe vectors are at least 0.99 similar to the
        reference anchor; during a change for the target model while its run is stopped. Without a
        stored anchor the stored endpoint is probed for one. Refused while a run works, for another
        model, or while the instances run different versions (409). The key rule and the address
        check are those of the probe. Has its own installation-wide limit (429). Recorded as
        EMBEDDING_MODEL_ENDPOINT_CHANGED.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmbeddingModelDraft"
      responses:
        "200":
          description: The endpoint was changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbeddingReindexStatusResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/admin/models/rerank:
    get:
      operationId: getRerankModelSettings
      tags: [model]
      summary: Get the rerank model role (system admin only)
      description: >
        The rerank model of the installation (ADR-0060, Entscheidung 10): switch, address and model
        from the database, the factory default (off, unbound) while nothing is stored. Never
        carries the key, only apiKeySet. state is the role's last known condition, answered without
        contacting the endpoint.
      responses:
        "200":
          description: The rerank model role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RerankModelSettingsResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: updateRerankModelSettings
      tags: [model]
      summary: Change the rerank model role (system admin only)
      description: >
        Takes effect on every instance without a restart; a change is an audit event with the
        values before and after, the key only as set, changed or removed. apiKey omitted keeps the
        stored key, but only while the base address stays the same endpoint; an empty string
        removes it. A switched-on role needs address and model. An address other than the stored
        endpoint is checked against the address check of models, whose allowlist is
        OPAA_MODEL_TARGET_VALIDATION_ALLOWLIST, not the one of the sources (400 with code BLOCKED);
        the stored endpoint is kept unchecked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RerankModelSettingsRequest"
      responses:
        "200":
          description: The rerank model role after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RerankModelSettingsResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/models/rerank/test:
    post:
      operationId: testRerankModel
      tags: [model]
      summary: Probe a rerank endpoint, saved or not yet saved (system admin only)
      description: >
        One rerank request with a single test document. apiKey omitted uses the stored key, only
        for the stored endpoint (otherwise 400); an empty string sends none. An address other than
        the stored endpoint is checked against the address check of models right before the request
        (400 with code BLOCKED); redirects are not followed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelRoleTestRequest"
      responses:
        "200":
          description: Test result - a 200 either way; success carries the outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmModelTestResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/models/transcription:
    get:
      operationId: getTranscriptionModelSettings
      tags: [model]
      summary: Get the transcription model role (system admin only)
      description: >
        The transcription model of the installation (ADR-0060, Entscheidung 10), like
        getRerankModelSettings, with the language passed to the model. speechInputAvailable tells
        whether the operation allows dictation at all (OPAA_FEATURES_SPEECH_INPUT_ENABLED).
      responses:
        "200":
          description: The transcription model role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptionModelSettingsResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: updateTranscriptionModelSettings
      tags: [model]
      summary: Change the transcription model role (system admin only)
      description: >
        As updateRerankModelSettings. Switching the role on is refused (400) while the operation
        has switched off speech input; address, model and key may still be stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranscriptionModelSettingsRequest"
      responses:
        "200":
          description: The transcription model role after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptionModelSettingsResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/models/transcription/test:
    post:
      operationId: testTranscriptionModel
      tags: [model]
      summary: Probe a transcription endpoint, saved or not yet saved (system admin only)
      description: >
        GET {baseUrl}/models, which sends no audio and costs nothing. Key rule and address check as
        for testRerankModel.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelRoleTestRequest"
      responses:
        "200":
          description: Test result - a 200 either way; success carries the outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmModelTestResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  schemas:
    LlmModelResponse:
      type: object
      description: >
        A managed chat model (Stufe 1). Never carries the API key itself, even redacted -
        only apiKeySet, whether one is stored (docs/features/llm-integration.md#stufe-1-verwaltete-chat-modelle-in-umsetzung).
      required:
        [
          id,
          displayName,
          baseUrl,
          modelIdentifier,
          temperature,
          maxTokens,
          apiKeySet,
          active,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          example: Ollama lokal
        baseUrl:
          type: string
          example: http://ollama:11434/v1
        modelIdentifier:
          type: string
          example: phi3:mini
        temperature:
          type: number
          format: double
          nullable: true
          description: Null when no temperature is set - the parameter is then not sent at all.
          example: 0.7
        maxTokens:
          type: integer
          example: 8000
        apiKeySet:
          type: boolean
          description: Whether an access key is stored - never the key itself.
        active:
          type: boolean
          description: Whether this is the one systemwide active chat model.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    LlmModelRequest:
      type: object
      description: >
        Used for both create and update. On update, apiKey follows the same three-way convention
        BrandingUpdateRequest already uses: omitted (null) leaves the stored key unchanged, an
        empty string clears it, any other value replaces it. On create, an omitted or empty apiKey
        simply means no key is stored - the key is optional (docs/features/llm-integration.md#ein-anbindungsweg-nicht-zwei),
        since a locally operated endpoint regularly requires no authentication at all.
      required: [displayName, baseUrl, modelIdentifier, maxTokens]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 120
          example: Ollama lokal
        baseUrl:
          type: string
          minLength: 1
          maxLength: 500
          description: >
            The OpenAI-compatible endpoint, including any provider-specific path suffix. Must not
            contain userinfo (https://user:secret@host/v1) - such an address is rejected with 400,
            because a stored base URL is returned by this API and written to the audit log. The
            access key belongs in apiKey.
          example: http://ollama:11434/v1
        modelIdentifier:
          type: string
          minLength: 1
          maxLength: 200
          example: phi3:mini
        temperature:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 2
          description: >
            Optional. Omitted or null stores no temperature, and the chat request then carries no
            temperature parameter - some models reject any value but their own.
          example: 0.7
        maxTokens:
          type: integer
          minimum: 1
          example: 8000
        apiKey:
          type: string
          nullable: true
          description: >
            Write-only. Omitted (null) on update leaves the stored key unchanged; an empty string
            clears it; any other value replaces it. On create, omitted or empty means no key.

    LlmModelTestRequest:
      type: object
      description: >
        Tests a connection without requiring the entry to be saved first. When modelId is set and
        apiKey is omitted or empty, the stored, decrypted key of that model is used for the probe
        instead of requiring the caller to re-enter a key they can never read back - but only when
        baseUrl is same-origin with modelId's own stored baseUrl; otherwise the request is rejected
        with 400 rather than sending the stored key to a different address.
      required: [baseUrl, modelIdentifier]
      properties:
        baseUrl:
          type: string
          minLength: 1
          description: >
            Must not contain userinfo (https://user:secret@host/v1) - such an address is rejected
            with 400 before any probe, because the probe URI is logged on failure.
          example: http://ollama:11434/v1
        modelIdentifier:
          type: string
          minLength: 1
          example: phi3:mini
        apiKey:
          type: string
          nullable: true
          description: Plaintext key for this test only, never stored.
        modelId:
          type: string
          format: uuid
          nullable: true
          description: >
            When set and apiKey is omitted or empty, reuses that model's stored, decrypted key for
            the probe, provided baseUrl is same-origin with the model's own stored baseUrl - 404 if
            modelId does not exist, 400 if baseUrl is a different origin. Without storedModelId it
            also names the stored endpoint that passes the address check of models unchecked.
        storedModelId:
          type: string
          format: uuid
          nullable: true
          description: >
            The model being edited: its stored endpoint passes the address check of models
            unchecked, so a model stored before the allowlist named its host stays testable. Never
            supplies a key, so it holds while the removal of the stored key is requested.
        temperature:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 2
          description: >
            The draft's temperature, sent with the probe exactly as the chat would send it; omitted
            or null sends none. A provider rejecting it is reported with its own reason.

    LlmModelTestResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
        message:
          type: string
          description: German, user-facing outcome - a distinguishable message for unreachable, unauthenticated and unknown-model failures.
          example: Verbindung erfolgreich, Modell hat geantwortet.

    LlmModelDiscoveryRequest:
      type: object
      description: >
        Lists an endpoint's models without requiring the entry to be saved first. apiKey, modelId
        and storedModelId follow exactly the rules of LlmModelTestRequest.
      required: [baseUrl]
      properties:
        baseUrl:
          type: string
          minLength: 1
          maxLength: 500
          description: >
            The OpenAI-compatible endpoint, e.g. http://ollama:11434/v1. Must not contain userinfo
            (https://user:secret@host/v1) - such an address is rejected with 400.
          example: http://ollama:11434/v1
        apiKey:
          type: string
          nullable: true
          description: Plaintext key for this request only, never stored.
        modelId:
          type: string
          format: uuid
          nullable: true
          description: >
            When set and apiKey is omitted or empty, reuses that model's stored, decrypted key,
            provided baseUrl is same-origin with the model's own stored baseUrl - 404 if modelId
            does not exist, 400 if baseUrl is a different origin. Without storedModelId it also
            names the stored endpoint that passes the address check of models unchecked.
        storedModelId:
          type: string
          format: uuid
          nullable: true
          description: As in LlmModelTestRequest; never supplies a key.

    LlmModelDiscoveryFailure:
      type: string
      description: >
        Why no model list could be read: INVALID_ADDRESS (not an http(s) URL, or refused by the
        address check of models), UNREACHABLE (DNS,
        refused, timeout, TLS), UNAUTHENTICATED (HTTP 401 or 403), NO_MODEL_LIST (the endpoint
        answers but offers no readable model list, e.g. HTTP 404) and UNEXPECTED_RESPONSE (any other
        status, or a list beyond the size limit).
      enum: [INVALID_ADDRESS, UNREACHABLE, UNAUTHENTICATED, NO_MODEL_LIST, UNEXPECTED_RESPONSE]

    LlmModelDiscoveryResponse:
      type: object
      required: [success, message, ollama, models]
      properties:
        success:
          type: boolean
          description: Whether the endpoint returned a model list - possibly an empty one.
        failure:
          allOf:
            - $ref: "#/components/schemas/LlmModelDiscoveryFailure"
          nullable: true
          description: Set exactly when success is false.
        message:
          type: string
          description: German, user-facing outcome, distinguishable per failure.
          example: 3 Modelle gefunden.
        ollama:
          type: boolean
          description: Whether the endpoint was recognized as Ollama and its details were read.
        models:
          type: array
          description: >
            The offered models, chat-suitable ones first, each group sorted by identifier. Empty on
            failure.
          items:
            $ref: "#/components/schemas/DiscoveredLlmModel"

    DiscoveredLlmModel:
      type: object
      required: [identifier, capabilities, chatSuitable]
      properties:
        identifier:
          type: string
          description: The exact model identifier to send as "model", e.g. qwen3:8b.
          example: qwen3:8b
        family:
          type: string
          nullable: true
          description: Model family as reported by Ollama, e.g. qwen3.
          example: qwen3
        parameterSize:
          type: string
          nullable: true
          description: Parameter count as reported by Ollama, e.g. 8.2B.
          example: 8.2B
        quantization:
          type: string
          nullable: true
          description: Quantization level as reported by Ollama, e.g. Q4_K_M.
          example: Q4_K_M
        sizeBytes:
          type: integer
          format: int64
          nullable: true
          description: Size of the model on disk in bytes (Ollama only).
          example: 5225388164
        contextLength:
          type: integer
          nullable: true
          description: >
            Context window in tokens, when the endpoint reports one (Ollama via /api/show, other
            servers via a context_length or max_model_len field of /models).
          example: 40960
        capabilities:
          type: array
          description: >
            Capabilities as reported by the endpoint (Ollama: completion, embedding, tools,
            vision, thinking, ...); empty when the endpoint reports none.
          items:
            type: string
        chatSuitable:
          type: boolean
          description: >
            Whether the model can serve as a chat model. False for models that only embed (Ollama
            capabilities, or an identifier that plainly names an embedding, speech or image model);
            true when nothing speaks against it.

    RerankModelSettingsResponse:
      type: object
      required: [enabled, apiKeySet, state, retiredVariables]
      properties:
        enabled:
          type: boolean
          description: The role's switch; false is the factory default.
        baseUrl:
          type: string
          nullable: true
          example: http://reranker:80
        model:
          type: string
          nullable: true
          example: BAAI/bge-reranker-v2-m3
        apiKeySet:
          type: boolean
          description: Whether a key is stored - never the key itself.
        state:
          $ref: "#/components/schemas/SearchModelRoleState"
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: The last change; null while the factory default applies.
        retiredVariables:
          type: array
          description: >
            Former configuration variables of this role the answering instance still has set; they
            are no longer read. Names only, never values.
          items:
            type: string

    RerankModelSettingsRequest:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
        baseUrl:
          type: string
          nullable: true
          maxLength: 500
          description: >
            Without the path /rerank and without userinfo. Required while enabled; empty unbinds.
          example: http://reranker:80
        model:
          type: string
          nullable: true
          maxLength: 200
          description: Required while enabled.
          example: BAAI/bge-reranker-v2-m3
        apiKey:
          type: string
          nullable: true
          maxLength: 2000
          description: >
            Write-only. Omitted (null) keeps the stored key for an unchanged endpoint; an empty
            string removes it; any other value replaces it.

    TranscriptionModelSettingsResponse:
      type: object
      required: [enabled, apiKeySet, language, state, speechInputAvailable, retiredVariables]
      properties:
        enabled:
          type: boolean
          description: The role's switch; false is the factory default.
        baseUrl:
          type: string
          nullable: true
          example: http://speaches:8000/v1
        model:
          type: string
          nullable: true
          example: Systran/faster-whisper-large-v3
        apiKeySet:
          type: boolean
          description: Whether a key is stored - never the key itself.
        language:
          type: string
          description: >
            ISO-639-1 code passed to the model; empty lets the model detect the language. de is
            the factory default.
          example: de
        state:
          $ref: "#/components/schemas/SearchModelRoleState"
        speechInputAvailable:
          type: boolean
          description: >
            Whether the operation allows speech input (OPAA_FEATURES_SPEECH_INPUT_ENABLED); while
            false the role stays off whatever is stored.
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: The last change; null while the factory default applies.
        retiredVariables:
          type: array
          description: >
            Former configuration variables of this role the answering instance still has set; they
            are no longer read. Names only, never values.
          items:
            type: string

    TranscriptionModelSettingsRequest:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
        baseUrl:
          type: string
          nullable: true
          maxLength: 500
          description: >
            Without the path /audio/transcriptions and without userinfo. Required while enabled.
          example: http://speaches:8000/v1
        model:
          type: string
          nullable: true
          maxLength: 200
          description: Required while enabled.
          example: Systran/faster-whisper-large-v3
        apiKey:
          type: string
          nullable: true
          maxLength: 2000
          description: >
            Write-only. Omitted (null) keeps the stored key for an unchanged endpoint; an empty
            string removes it; any other value replaces it.
        language:
          type: string
          nullable: true
          maxLength: 8
          description: >
            Two-letter ISO-639-1 code; an empty string lets the model detect the language, omitted
            (null) keeps the stored language.
          example: de

    ModelRoleTestRequest:
      type: object
      description: >
        A draft of a rerank or transcription endpoint. apiKey omitted uses the stored key of the
        role, but only for its stored endpoint; an empty string sends no key.
      required: [baseUrl, model]
      properties:
        baseUrl:
          type: string
          minLength: 1
          maxLength: 500
          example: http://reranker:80
        model:
          type: string
          minLength: 1
          maxLength: 200
          example: BAAI/bge-reranker-v2-m3
        apiKey:
          type: string
          nullable: true
          maxLength: 2000
          description: Plaintext key for this test only, never stored.

    EmbeddingInfoResponse:
      type: object
      description: >
        The installed embedding model, never with its key - see
        docs/features/embedding-model-change.md for how it changes.
      required: [provider, model, dimensions]
      properties:
        provider:
          type: string
          description: Configured embedding provider ("openai" or "ollama").
          example: ollama
        model:
          type: string
          example: nomic-embed-text
        dimensions:
          type: integer
          description: Vector dimensionality of the configured pgvector store.
          example: 1536
        baseUrl:
          type: string
          nullable: true
          description: The endpoint; null when it carries credentials.
        maxInputTokens:
          type: integer
          nullable: true
          description: The input limit of the endpoint, in tokens.
        apiKeySet:
          type: boolean
          nullable: true
          description: Whether a key is stored.
        generation:
          type: integer
          format: int64
          nullable: true
          description: >
            The generation of the model; a model change gives a new one, an endpoint change keeps it.
        anchorRecorded:
          type: boolean
          nullable: true
          description: >
            Whether the reference anchor an endpoint change is compared with is stored. Without it
            the stored endpoint is probed for one.
        index:
          $ref: "#/components/schemas/EmbeddingReindexStatusResponse"

    EmbeddingModelDraft:
      type: object
      required: [baseUrl, model]
      properties:
        baseUrl:
          type: string
          maxLength: 500
        model:
          type: string
          maxLength: 200
        apiKey:
          type: string
          nullable: true
          maxLength: 2000
          description: >
            Omitted keeps the stored key, only for the stored endpoint; an empty string means no key.
            Never returned.
        maxInputTokens:
          type: integer
          nullable: true
          minimum: 1
          maximum: 1000000
          description: The input limit of the endpoint in tokens; omitted for 2048.

    EmbeddingModelChangeRequest:
      allOf:
        - $ref: "#/components/schemas/EmbeddingModelDraft"
        - type: object
          required: [expectedDimensions]
          properties:
            expectedDimensions:
              type: integer
              minimum: 1
              description: The vector size the probe and the preview named.

    EmbeddingModelChangeKind:
      type: string
      description: >
        MODEL_CHANGE - another model, size or version; changing it re-embeds every chunk.
        ENDPOINT_CHANGE - the installed model at another endpoint; it changes without a re-embedding.
      enum: [MODEL_CHANGE, ENDPOINT_CHANGE]

    EmbeddingModelProbeResponse:
      type: object
      required: [succeeded]
      properties:
        succeeded:
          type: boolean
        message:
          type: string
          nullable: true
          description: German result of the probe.
        dimensions:
          type: integer
          nullable: true
        kind:
          $ref: "#/components/schemas/EmbeddingModelChangeKind"
        similarity:
          type: number
          format: double
          nullable: true
          description: >
            The smallest cosine similarity of the probe vectors to the reference anchor; null for
            another model or size, or when no anchor could be had.
        preview:
          $ref: "#/components/schemas/EmbeddingModelChangePreview"

    EmbeddingModelChangePreview:
      type: object
      required:
        [
          totalChunks,
          privateLibrariesCounted,
          estimatedTokens,
          estimatedSeconds,
          rateMeasured,
          storageLowerBytes,
          storageUpperBytes,
          currentTableBytes,
        ]
      properties:
        totalChunks:
          type: integer
          format: int64
        privateLibrariesCounted:
          type: boolean
          description: >
            Whether the numbers include private libraries; only from the minimum group size.
        estimatedTokens:
          type: integer
          format: int64
          description: The text length of the chunks divided by four characters per token.
        estimatedSeconds:
          type: integer
          format: int64
        rateMeasured:
          type: boolean
          description: >
            Whether the duration comes from the throughput probe of the new endpoint; otherwise from
            the configured estimate.
        storageLowerBytes:
          type: integer
          format: int64
          description: The new vectors and their index.
        storageUpperBytes:
          type: integer
          format: int64
          description: >
            The lower bound plus today's vector table with its indexes, since the re-embedding
            writes every row anew.
        currentTableBytes:
          type: integer
          format: int64
