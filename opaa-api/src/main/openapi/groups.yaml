# Topic "groups": its tags, paths and the components only this topic uses.
# Merged with all other fragments at build time, see root.yaml.
tags:
  - name: group
    description: Groups, their members and stewards.
paths:
  /api/v1/me/groups:
    get:
      operationId: listMyGroups
      tags: [group]
      summary: >
        List the groups the caller is a direct member of - deliberately not admin-restricted,
        unlike GET /api/v1/admin/groups. Any authenticated user needs their own group membership
        to choose a group owner when creating a knowledge library (see the library ownership
        picker in the frontend); listGroups requires SYSTEM_ADMIN and returns every group in the
        organization regardless of membership, so it cannot serve that purpose. Reuses
        GroupListResponse rather than a slimmer schema: every field on it (including externalId,
        the directory objectGUID, and memberCount) describes a group the caller already belongs
        to and can already see the name and kind of, so nothing here exposes information the
        caller could not already infer; a second schema would only duplicate the first for no
        access-control benefit.
      responses:
        "200":
          description: Groups the caller is a member of
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupListResponse"

  /api/v1/me/stewarded-groups:
    get:
      operationId: listMyStewardedGroups
      tags: [group]
      summary: >
        The internal groups the caller is responsible for - what "Meine Gruppen" shows, together
        with the way out: responsibility is handed over as a deliberate step, by appointing the
        successor and then dismissing oneself (ADR-0036, Entscheidung 4). Deliberately separate
        from GET /api/v1/me/groups: a steward is no member, and that endpoint answers the question
        "which groups may I own a library through".
      responses:
        "200":
          description: Groups the caller is a steward of
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupListResponse"

  /api/v1/groups:
    post:
      operationId: createGroup
      tags: [group]
      summary: Create an internal group; the caller becomes its first steward
      description: >
        Always creates a group of kind AD_HOC - ORG_UNIT and IDENTITY_PROVIDER groups come from a
        provider and are never created here. Needs the capability CREATE_INTERNAL_GROUP, which
        every SYSTEM_ADMIN holds implicitly. The caller is appointed the group's first steward in
        the same transaction, so no internal group is created without one (ADR-0036, Entscheidung
        4). A new group is not released for use: it becomes selectable for other people granting
        rights only once a steward releases it (ADR-0036, Entscheidung 9).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupRequest"
      responses:
        "201":
          description: Group created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          description: The caller lacks the capability CREATE_INTERNAL_GROUP (code CAPABILITY_REQUIRED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/groups/{groupId}:
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: getGroup
      tags: [group]
      summary: Group details, for its stewards and for a system administrator
      description: >
        A caller who is neither a steward of this group nor a SYSTEM_ADMIN gets the same answer as
        for a group that does not exist (404) - the treatment the organization boundary has always
        had (ADR-0036, Entscheidung 4).
      responses:
        "200":
          description: Group details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupResponse"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: updateGroup
      tags: [group]
      summary: Change an internal group's name or description
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupUpdateRequest"
      responses:
        "200":
          description: Group updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupResponse"
        "400":
          description: >
            The payload is unusable, or the group comes from a provider and is maintained there
            rather than here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: deleteGroup
      tags: [group]
      summary: Delete an internal group
      responses:
        "204":
          description: Group deleted
        "400":
          description: The group comes from a provider and is maintained there rather than here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            The group still holds a grant, owns an asset or holds a capability; what still refers
            to it has to be moved first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/groups/{groupId}/members:
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: listGroupMembers
      tags: [group]
      summary: List an internal group's members
      responses:
        "200":
          description: List of members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupMemberResponse"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      operationId: addGroupMember
      tags: [group]
      summary: Add a member to an internal group
      description: >
        Only accounts of the same organization. The person taken in is notified in the
        application, without mail (ADR-0036, Entscheidung 4).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupAddMemberRequest"
      responses:
        "201":
          description: Member added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupMemberResponse"
        "400":
          description: The group comes from a provider and is maintained there rather than here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/groups/{groupId}/members/{userId}:
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    delete:
      operationId: removeGroupMember
      tags: [group]
      summary: Remove a member from an internal group
      responses:
        "204":
          description: Member removed
        "400":
          description: The group comes from a provider and is maintained there rather than here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/groups/{groupId}/stewards:
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: listGroupStewards
      tags: [group]
      summary: List the people responsible for an internal group
      responses:
        "200":
          description: The group's stewards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupStewardResponse"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      operationId: appointGroupSteward
      tags: [group]
      summary: Appoint a further steward of an internal group
      description: >
        Only natural persons of the same organization - a group as a steward would be nesting
        through the back door (ADR-0036, Entscheidung 4). A steward is not a member.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupAppointStewardRequest"
      responses:
        "201":
          description: Steward appointed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupStewardResponse"
        "400":
          description: The group comes from a provider and has no stewards; its source maintains it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The account is already a steward of this group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/groups/{groupId}/stewards/{userId}:
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    delete:
      operationId: dismissGroupSteward
      tags: [group]
      summary: Dismiss a steward of an internal group
      description: >
        A steward never leaves the group without one: handing responsibility over means appointing
        the successor first (ADR-0036, Entscheidung 4). A SYSTEM_ADMIN may dismiss the last one -
        an account leaving the house has to be releasable - and the group then has no steward until
        one is appointed again.
      responses:
        "204":
          description: Steward dismissed
        "400":
          description: The group comes from a provider and has no stewards; its source maintains it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: This is the group's last steward.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/groups/selectable:
    get:
      operationId: searchSelectableGroups
      tags: [group]
      summary: >
        Search the groups the caller may name as a grant subject or a space member - the
        Subjekt-Auswahl of ADR-0036, Entscheidung 9 (#1820)
      description: >
        Answers the "Rechtevergebende in der Subjekt-Auswahl" row of ADR-0036, Entscheidung 9:
        every provider group of the caller's organization, and an internal group only once its
        stewards have released it for use - unless the caller is a member, a steward or a
        SYSTEM_ADMIN. Name and origin are named, the member count is the number of active
        accounts, and the member list never is.

        A protected group is not findable by search: it matches only when the query is its
        complete name (ADR-0036, Entscheidung 9), and it then carries no member count at all.
        An ineffective group - dissolved, provider switched off, or a token group its provider no
        longer maintains - is returned with selectable = false and the flag naming the reason, so
        the selection can show it as not choosable instead of silently dropping it.

        Requires query (min. 2 characters, matched case-insensitively against the name and the
        source path) and caps the result at 20 rows, the same shape as GET /api/v1/users. The
        rule this endpoint applies is the visibility rule of the service, not of the list: the
        same rule answers 404 on every path that accepts a group id, including the one where the
        id is typed by hand.
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
          description: >
            Case-insensitive substring match against name and sourcePath. Fewer than 2 characters
            (after trimming) yields an empty result.
      responses:
        "200":
          description: Selectable groups matching the query, capped at 20 rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SelectableGroupResponse"

  /api/v1/groups/selectable/{groupId}:
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: resolveSelectableGroup
      tags: [group]
      summary: >
        One group by its id, under the same rule the Subjekt-Auswahl applies (#1820)
      description: >
        The way in for a caller who knows the designation of a group but not its name - typing the
        id by hand. It resolves the group before anything is granted, so origin and provider reach
        the interface on this path too: without them the selection's symbol and the question back
        for a group of an external provider would be missing on exactly the path that shows the
        least (ADR-0036, Entscheidung 2).

        Answers with the same visibility rule as the search: a group this caller may not name is
        "not found", never "forbidden". A protected group is returned without its name - the caller
        did not name it here, and a name handed back for an id would undo the namelessness of
        ADR-0036, Entscheidung 9.
      responses:
        "200":
          description: The group, as the selection shows it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelectableGroupResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/groups/{groupId}/release:
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    put:
      operationId: setGroupRelease
      tags: [group]
      summary: Release an internal group for use, or take the release back
      description: >
        An internal group is selectable for other people granting rights only once its stewards
        have released it; the default is not released (ADR-0036, Entscheidung 9). Taking the
        release back removes the group from every selection - grants it already holds stay
        untouched.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupReleaseRequest"
      responses:
        "200":
          description: Release changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupResponse"
        "400":
          description: The group comes from a provider; only internal groups are released here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/groups/{groupId}/protection:
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    put:
      operationId: setGroupProtection
      tags: [group]
      summary: Mark a group as protected, or take the mark back
      description: >
        For the groups of the staff council, the representation of severely disabled employees,
        the equality office and for personnel matters. The system administration alone sets and
        releases the mark, for internal and provider groups alike (ADR-0036, Entscheidung 9, as
        amended); stewards of an internal group do not. Recorded as an audit event
        (GROUP_PROTECTION_CHANGED).

        This is the one write path a provider group has: everything else about it is maintained
        where it comes from.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupProtectionRequest"
      responses:
        "200":
          description: Protection changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupResponse"
        "403":
          description: >
            The caller is no system administrator but already knows the group - a steward or a
            member of it (code PROTECTION_ADMIN_ONLY). Everybody else gets 404.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/groups:
    get:
      operationId: listGroups
      tags: [group]
      summary: List every group in the caller's organization (system admin only)
      description: >
        The one group path left under /admin (#1814, ADR-0036 Entscheidung 4): reading every
        group of the organization regardless of who maintains it is an administrative act. Every
        operation on a single group moved to /api/v1/groups, where the right is decided per group
        rather than by role.
      responses:
        "200":
          description: List of groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupListResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/groups/page:
    get:
      operationId: listGroupPage
      tags: [group]
      summary: One page of the groups of the caller's organization (system admin only)
      description: >
        The group list of the administration, searched, filtered, sorted and paged on the
        server like /admin/accounts. Stewards and provider are resolved for the
        returned page only. The unpaged listGroups stays for callers that need every group.
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
          description: Case-insensitive substring of name, description or source path.
        - name: origin
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/GroupOrigin"
        - name: providerId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Only the groups of this identity provider; implies origin PROVIDER.
        - name: kind
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/GroupKind"
        - name: state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/GroupState"
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [name, kind, origin, memberCount, state, createdAt]
            default: name
          description: >
            origin puts internal groups first, then the providers by name; state puts what needs a
            decision first (dissolved, provider disabled, unmaintained, not released, active).
            Anything else is refused with 400.
        - name: direction
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: asc
          description: Anything else is refused with 400.
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 25
      responses:
        "200":
          description: One page of groups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupPageResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/groups/effects:
    get:
      operationId: listGroupEffects
      tags: [group]
      summary: Where the groups of the organization still take effect (system admin only)
      description: >
        "Wo wirkt diese Gruppe" per group (ADR-0036, Entscheidung 2): the grants it holds, the
        spaces it is a member of, the assets it owns, the capabilities it was given and the
        diagnostic authorisations scoped to it. Counted, not listed - the figures say how much
        work an ablösung is, and each object is reached through its own page, which is where a
        single effect is removed.

        Filtered to one provider it is the work list a refused provider deletion points to: every
        group of that provider with its effects, the entry point for transferring them or removing
        them. Reading counts is no membership lookup and therefore no audit event.
      parameters:
        - name: providerId
          in: query
          required: false
          description: >
            Only the groups of this identity provider. Omitted, every group of the organization
            answers, including the internal ones.
          schema:
            type: string
            format: uuid
        - name: groupId
          in: query
          required: false
          description: >
            Only these groups - what a list asks for the rows it actually shows, instead of for
            every group of the organization. Repeatable; combined with providerId both narrowings
            apply.
          schema:
            type: array
            items:
              type: string
              format: uuid
      responses:
        "200":
          description: One entry per group, groups without any effect included
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupEffectsResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  schemas:
    GroupKind:
      type: string
      description: >
        ORG_UNIT groups are synchronised from the directory (see #237), carry a parent unit and
        can have curators. AD_HOC groups are created in the system, have no curator and no
        distribution level of their own. IDENTITY_PROVIDER groups mirror the groups claim of an
        identity provider's tokens (ADR-0025): refreshed on every sign-in, read-only here.
      enum: [ORG_UNIT, AD_HOC, IDENTITY_PROVIDER]
      example: AD_HOC

    GroupOrigin:
      type: string
      description: >
        Where a group comes from (ADR-0036, Entscheidung 2). INTERNAL groups are created in this
        system and have no provider; PROVIDER groups originate from an identity provider - its
        directory or its tokens' groups claim - and name it in the provider field. Derived from
        groups.provider_id, not stored twice.
      enum: [INTERNAL, PROVIDER]
      example: INTERNAL

    GroupState:
      type: string
      description: >
        Whether a group is in effect, in the order that decides when several apply
        (ADR-0036 Entscheidungen 2 and 3). DISSOLVED - the source no longer reports it;
        PROVIDER_DISABLED - its identity provider is disabled; UNMAINTAINED - a token group of a
        provider that now delivers its groups through the directory sync; NOT_RELEASED - an
        internal group not yet released for use; ACTIVE otherwise. Existing grants stay in every
        state; only an ACTIVE group is a new grant target.
      enum: [ACTIVE, NOT_RELEASED, UNMAINTAINED, PROVIDER_DISABLED, DISSOLVED]
      example: ACTIVE

    GroupPageResponse:
      type: object
      required: [items, total, page, size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GroupListResponse"
        total:
          type: integer
          format: int64
          description: Matching groups over all pages.
        page:
          type: integer
        size:
          type: integer

    GroupProviderResponse:
      type: object
      description: The identity provider a PROVIDER group originates from (ADR-0036/2).
      required: [id, displayName, external, enabled, groupMechanism]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          example: Beschäftigte (Keycloak)
        external:
          type: boolean
          description: >
            Whether the provider belongs to another organisation. Groups of an external provider
            are shown differently in every selection, and granting a right to one asks back.
        enabled:
          type: boolean
          description: >
            While false the group is no effective group: no new grant target and no new space
            member, shown as not selectable with that reason. Existing grants stay untouched.
            A disabled provider is also synchronised no further - its directory run pauses.
        groupMechanism:
          $ref: "#/components/schemas/GroupMechanism"
        directorySyncIntervalMinutes:
          type: integer
          nullable: true
          description: >
            How often the directory run is due, in minutes; null unless groupMechanism is
            DIRECTORY. Part of the delay a member can see for themselves (ADR-0036/3).
          example: 360
        lastDirectorySyncAt:
          type: string
          format: date-time
          nullable: true
          description: >
            When this provider was last read from its directory - regardless of whether that run
            applied anything. Null unless groupMechanism is DIRECTORY and a run has happened.

    GroupRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: Projektbeteiligte Phoenix
        description:
          type: string
          maxLength: 2000
          nullable: true
          example: Ad-hoc-Gruppe für das Projekt Phoenix
        releasedForUse:
          type: boolean
          default: false
          description: Release the new group for use right away (ADR-0036, Entscheidung 9).
        protectedGroup:
          type: boolean
          default: false
          description: >
            Protect the new group right away. Only a SYSTEM_ADMIN may (403 PROTECTION_ADMIN_ONLY,
            nothing is created).
        stewardIds:
          type: array
          maxItems: 50
          description: >
            The stewards of the new group. Empty or absent: the caller. A caller without the
            SYSTEM_ADMIN role is always among them - whoever creates a group stays responsible
            for it; the system administration may name others instead of itself.
          items:
            type: string
            format: uuid

    GroupUpdateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: Projektbeteiligte Phoenix
        description:
          type: string
          maxLength: 2000
          nullable: true
          example: Ad-hoc-Gruppe für das Projekt Phoenix

    GroupMemberResponse:
      type: object
      required: [userId, createdAt]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    GroupMemberDisclosureResponse:
      type: object
      description: >
        The members of a group as the person who granted it a right on an object sees them (#1880,
        ADR-0036 Entscheidung 9) - only active accounts, capped and paged, with the cap as the
        query's own LIMIT. The five limits of the rule, enforced in the service and nowhere else:

        (a) only while the group holds a right at the object named in the path - an expired grant
        and an ended space membership hold nothing; (b) only for a group released for use, which a
        provider group always is; (c) the delivered default is "not released"; (d) never for a
        protected group - no name, no count, no members, and responsible instead, whom to ask;
        (e) never below the enforced minimum group size - no members and no figure either, only
        smallGroup (Auflage A2).

        A retrieval carried by the system role is an audit event (GROUP_MEMBERS_READ) on both
        paths, because a system administrator passes the threshold of every library and every
        space; a grant giver without that role writes nothing - the grant already names who gave
        it and when.
      required: [groupId, protectedGroup, smallGroup, members, responsible]
      properties:
        groupId:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
          description: >
            Null for a protected group: naming it here would undo the namelessness of ADR-0036,
            Entscheidung 9, which the grant list and the space member list already keep.
        protectedGroup:
          type: boolean
          description: >
            True for a group of the staff council and the comparable bodies. The member list is
            then empty on purpose - responsible names whom to ask.
        smallGroup:
          type: boolean
          description: >
            True below the enforced minimum group size - the list and both figures are then
            withheld, and this is what the interface says instead ("kleine Gruppe").
        activeMemberCount:
          type: integer
          nullable: true
          description: >
            How many active accounts the group reaches in total - the figure the page is a window
            into. Null for a protected group, where the size is itself the disclosure, and null
            for a small group.
        members:
          type: array
          description: >
            The requested page of active accounts, ordered by name so paging is stable. Empty
            wherever the rule withholds the list.
          items:
            $ref: "#/components/schemas/DisclosedGroupMemberResponse"
        responsible:
          type: array
          description: >
            Whom to ask about a protected group instead of reading its member list (ADR-0036,
            Entscheidung 9): its stewards where it is internal. Empty for a protected provider
            group - the system administration answers for it - and for every unprotected group,
            where the member list is the answer and naming people would be a disclosure nobody
            asked for.
          items:
            type: string

    DisclosedGroupMemberResponse:
      type: object
      description: >
        One member of a group, as much as the person granting the group a right needs to know:
        who. No account state, no addresses, no membership dates (#1880).
      required: [userId]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
          nullable: true
          description: >
            The account's display name, its mail address where it carries none. Null only where
            neither is resolvable.

    GroupStewardResponse:
      type: object
      description: >
        A person responsible for an internal group (ADR-0036, Entscheidung 4) - always a natural
        person, never a group, and not a member by virtue of being a steward.
      required: [userId, appointedAt]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
          nullable: true
        appointedAt:
          type: string
          format: date-time

    GroupAppointStewardRequest:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
          format: uuid

    GroupReleaseRequest:
      type: object
      required: [releasedForUse]
      properties:
        releasedForUse:
          type: boolean
          description: >
            Whether other people granting rights may choose this group as a subject at all
            (ADR-0036, Entscheidung 9).

    GroupProtectionRequest:
      type: object
      required: [protectedGroup]
      properties:
        protectedGroup:
          type: boolean
          description: >
            Whether this group carries the protection of the staff council and the comparable
            bodies (ADR-0036, Entscheidung 9). Named protectedGroup rather than protected because
            the latter is a Java keyword and the generated DTO would have to escape it.

    GroupListResponse:
      type: object
      required: [id, name, kind, origin, state, memberCount, createdAt, updatedAt, releasedForUse, protectedGroup, dissolved, stewards]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Projektbeteiligte Phoenix
        description:
          type: string
          nullable: true
        kind:
          $ref: "#/components/schemas/GroupKind"
        externalId:
          type: string
          nullable: true
          description: Stable directory identifier (objectGUID or SCIM externalId); null for AD_HOC groups
        origin:
          $ref: "#/components/schemas/GroupOrigin"
        state:
          $ref: "#/components/schemas/GroupState"
        provider:
          allOf:
            - $ref: "#/components/schemas/GroupProviderResponse"
          nullable: true
          description: Absent (null) exactly when origin is INTERNAL.
        sourcePath:
          type: string
          nullable: true
          description: >
            The path the source reports ("/Haus/Abteilung 5/Referat 50"); what tells the same-named
            subgroups of one directory apart. Null when the source names none.
        parentGroupId:
          type: string
          format: uuid
          nullable: true
          description: Parent organizational unit; only set for ORG_UNIT groups
        memberCount:
          type: integer
          example: 4
        dissolved:
          type: boolean
          description: >
            Whether the source no longer reports this group - a merge or a reorganisation, not a
            deletion. Its membership stays frozen and its grants keep working, but it is no
            effective group any more: no new grant target and no new space member, shown as not
            selectable with that reason (ADR-0036, Entscheidung 2). Always false for an internal
            group, which has no directory counterpart to disappear from.
          example: false
        releasedForUse:
          type: boolean
          description: >
            Whether this internal group has been released for use by its stewards and is
            therefore selectable as a grant subject by others (ADR-0036, Entscheidung 9). Always
            true for a group with a provider - a provider group needs no release.
        protectedGroup:
          type: boolean
          description: >
            Whether this group carries the protection of the staff council and the comparable
            bodies: not findable by search, shown namelessly in other people's lists, and its
            grant-giver sees the stewards instead of the members (ADR-0036, Entscheidung 9).
        stewards:
          type: array
          description: >
            The people responsible for this group - empty for a provider group, and empty for an
            internal group whose succession is open (#1819).
          items:
            $ref: "#/components/schemas/GroupStewardResponse"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SelectableGroupResponse:
      type: object
      required:
        [id, origin, protectedGroup, selectable, dissolved, providerDisabled, unmaintained, smallGroup, emptyGroup]
      description: >
        One group as the Subjekt-Auswahl shows it (#1820, ADR-0036 Entscheidung 9): name, origin
        and the number of active accounts - never the members themselves. Everything a selection
        decides on is a field of its own, so the interface names the reason instead of guessing
        it from a missing row.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
          description: >
            Null for a protected group that was resolved by its id: the caller did not name it
            there, and a name handed back for an id would undo the namelessness of ADR-0036,
            Entscheidung 9. Present everywhere else, the search included - a protected group only
            appears there when its complete name was typed.
          example: Referat 50
        origin:
          $ref: "#/components/schemas/GroupOrigin"
        provider:
          allOf:
            - $ref: "#/components/schemas/GroupProviderResponse"
          nullable: true
          description: Absent (null) exactly when origin is INTERNAL.
        sourcePath:
          type: string
          nullable: true
          description: >
            The path the source reports ("/Haus/Abteilung 5/Referat 50") - what tells two
            same-named groups of one directory apart.
        responsible:
          type: array
          description: >
            Whom to ask about a protected group instead of reading its member list (ADR-0036,
            Entscheidung 9): its stewards where it is internal. Empty for a protected provider
            group - the system administration answers for it - and for every unprotected group,
            where the member list is the answer.
          items:
            type: string
        activeMemberCount:
          type: integer
          nullable: true
          description: >
            How many active accounts this group reaches. Null whenever smallGroup is true, and
            null for a protected group: there the size is the actual disclosure (ADR-0036,
            Entscheidung 9).
        smallGroup:
          type: boolean
          description: >
            True below the enforced minimum group size - the selection then says "kleine Gruppe"
            instead of a number, and no figure it could be reconstructed from is sent.
        emptyGroup:
          type: boolean
          description: >
            True when the group currently reaches no account at all. Such a group stays selectable
            on purpose (ADR-0036, Entscheidung 6) - this is the warning that goes with it.
        protectedGroup:
          type: boolean
          description: >
            True for a group of the staff council and the comparable bodies. It is never found by
            a substring; only the complete name matches it.
        selectable:
          type: boolean
          description: >
            False for a group that is no effective group - it may not become a new grant target or
            a new space member, while the grants it already holds stay untouched. The three flags
            below name which of the reasons applies.
        dissolved:
          type: boolean
        providerDisabled:
          type: boolean
          description: The group comes from an identity provider that is switched off.
        unmaintained:
          type: boolean
          description: >
            A token group whose provider has since switched to the directory run: its membership
            is frozen, so it must not become a new grant target (ADR-0036, Entscheidung 3).

    GroupResponse:
      type: object
      required: [id, name, kind, origin, memberCount, members, createdAt, updatedAt, releasedForUse, protectedGroup, dissolved, stewards]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Projektbeteiligte Phoenix
        description:
          type: string
          nullable: true
        kind:
          $ref: "#/components/schemas/GroupKind"
        externalId:
          type: string
          nullable: true
          description: Stable directory identifier (objectGUID or SCIM externalId); null for AD_HOC groups
        origin:
          $ref: "#/components/schemas/GroupOrigin"
        provider:
          allOf:
            - $ref: "#/components/schemas/GroupProviderResponse"
          nullable: true
          description: Absent (null) exactly when origin is INTERNAL.
        sourcePath:
          type: string
          nullable: true
          description: >
            The path the source reports ("/Haus/Abteilung 5/Referat 50"); what tells the same-named
            subgroups of one directory apart. Null when the source names none.
        parentGroupId:
          type: string
          format: uuid
          nullable: true
          description: Parent organizational unit; only set for ORG_UNIT groups
        memberCount:
          type: integer
          example: 4
        members:
          type: array
          nullable: true
          description: >
            Null when the caller reads the group as the system administration without being one of
            its stewards. For them the member list is an audit event of its own and only
            GET /api/v1/groups/{groupId}/members hands it out; memberCount is set either way.
          items:
            $ref: "#/components/schemas/GroupMemberResponse"
        dissolved:
          type: boolean
          description: >
            Whether the source no longer reports this group - a merge or a reorganisation, not a
            deletion. Its membership stays frozen and its grants keep working, but it is no
            effective group any more (ADR-0036, Entscheidung 2).
          example: false
        releasedForUse:
          type: boolean
          description: >
            Whether this internal group has been released for use by its stewards and is
            therefore selectable as a grant subject by others (ADR-0036, Entscheidung 9). Always
            true for a group with a provider - a provider group needs no release.
        protectedGroup:
          type: boolean
          description: >
            Whether this group carries the protection of the staff council and the comparable
            bodies: not findable by search, shown namelessly in other people's lists, and its
            grant-giver sees the stewards instead of the members (ADR-0036, Entscheidung 9).
        stewards:
          type: array
          description: >
            The people responsible for this group - empty for a provider group, and empty for an
            internal group whose succession is open (#1819).
          items:
            $ref: "#/components/schemas/GroupStewardResponse"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    GroupEffectsResponse:
      type: object
      description: >
        How far one group still reaches (ADR-0036, Entscheidung 2). Counts only: a figure says how
        much work lies ahead without turning the overview into a membership or content listing.
      required:
        [
          groupId,
          name,
          origin,
          dissolved,
          protectedGroup,
          assetGrants,
          grantedAssets,
          spaceMemberships,
          spaces,
          ownedAssets,
          capabilities,
          scopedAuthorizations,
          summary,
        ]
      properties:
        groupId:
          type: string
          format: uuid
        name:
          type: string
          example: Referat 50
        origin:
          $ref: "#/components/schemas/GroupOrigin"
        providerId:
          type: string
          format: uuid
          nullable: true
          description: Absent (null) exactly when origin is INTERNAL.
        sourcePath:
          type: string
          nullable: true
        dissolved:
          type: boolean
        protectedGroup:
          type: boolean
        assetGrants:
          type: integer
          example: 12
        grantedAssets:
          type: integer
          description: Across how many distinct assets those grants run.
          example: 7
        spaceMemberships:
          type: integer
          example: 2
        spaces:
          type: integer
          example: 2
        ownedAssets:
          type: integer
          example: 3
        capabilities:
          type: integer
          description: How many installation-wide creation rights ("Anlegerechte") this group holds.
          example: 1
        scopedAuthorizations:
          type: integer
          description: >
            How many still-conferring diagnostic authorisations (ADR-0016) name this group as
            their scope.
          example: 0
        summary:
          type: string
          description: >
            The German sentence the work list shows - empty exactly when this group has no effect
            at all, which is what makes it deletable with its provider.
          example: 12 Berechtigungen an 7 Objekten, 2 Space-Mitgliedschaften in 2 Spaces

    GroupAddMemberRequest:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
          format: uuid

    GroupMechanism:
      type: string
      description: >
        Which mechanism maintains a provider's groups - exactly one per provider (ADR-0036,
        Entscheidung 2 and 3). TOKEN reads them from the groups claim on every sign-in, DIRECTORY
        pulls them on a schedule, NONE means the provider contributes no groups at all. Visible
        to every signed-in user through GET /api/v1/me/groups, together with interval and last
        run: the delay is no protectable information and saves the call to the IT department.
      enum: [TOKEN, DIRECTORY, NONE]
      example: DIRECTORY
