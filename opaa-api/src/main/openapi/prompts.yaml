# Topic "prompts": its tags, paths and the components only this topic uses.
# Merged with all other fragments at build time, see root.yaml.
tags:
  - name: prompt
    description: Prompt libraries and prompts.
paths:
  /api/v1/prompt-libraries:
    get:
      operationId: listPromptLibraries
      tags: [prompt]
      summary: >
        List the prompt libraries the caller may read - direct grant, grant to one of their
        groups, or organization-wide release (docs/features/spaces-and-assets.md#prompt-bibliothek).
        Exactly the libraries whose prompts the caller may read; a system administrator sees here
        only what the formula grants them.
      responses:
        "200":
          description: The readable prompt libraries, by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PromptLibraryResponse"

    post:
      operationId: createPromptLibrary
      tags: [prompt]
      summary: >
        Create a prompt library, owned by the caller or by one of the caller's groups. Needs the
        capability CREATE_PROMPT_LIBRARY. Rights are then given through
        /api/v1/assets/PROMPT_LIBRARY/{assetId}/grants.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromptLibraryRequest"
      responses:
        "201":
          description: Prompt library created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptLibraryResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          description: >
            The caller lacks the capability CREATE_PROMPT_LIBRARY (code CAPABILITY_REQUIRED), or
            the named owner group is one the caller is not a member of.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/prompt-libraries/{promptLibraryId}:
    parameters:
      - $ref: "#/components/parameters/PromptLibraryIdPath"

    get:
      operationId: getPromptLibrary
      tags: [prompt]
      summary: Get a prompt library (VIEWER or above; a system administrator counts as OWNER)
      responses:
        "200":
          description: The prompt library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptLibraryResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: updatePromptLibrary
      tags: [prompt]
      summary: Replace name and description (MANAGER or above).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromptLibraryUpdateRequest"
      responses:
        "200":
          description: Prompt library updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptLibraryResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: deletePromptLibrary
      tags: [prompt]
      summary: >
        Delete a prompt library (OWNER only) together with its prompts, grants and space
        associations.
      responses:
        "204":
          description: Prompt library deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/prompt-libraries/{promptLibraryId}/prompts:
    parameters:
      - $ref: "#/components/parameters/PromptLibraryIdPath"

    get:
      operationId: listPrompts
      tags: [prompt]
      summary: >
        List the prompts of a library by sortOrder, then name. Reading prompts needs a right of
        the formula (VIEWER or above); administering the library is not reading it, so a system
        administrator without such a right gets 403.
      responses:
        "200":
          description: The library's prompts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PromptResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      operationId: createPrompt
      tags: [prompt]
      summary: Add a prompt to the library (EDITOR or above, by the formula)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromptRequest"
      responses:
        "201":
          description: Prompt created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Another prompt of this library already has the name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/prompt-libraries/{promptLibraryId}/prompts/{promptId}:
    parameters:
      - $ref: "#/components/parameters/PromptLibraryIdPath"
      - name: promptId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: getPrompt
      tags: [prompt]
      summary: Get one prompt (VIEWER or above, by the formula)
      responses:
        "200":
          description: The prompt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: updatePrompt
      tags: [prompt]
      summary: Replace a prompt (EDITOR or above, by the formula)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromptRequest"
      responses:
        "200":
          description: Prompt updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Another prompt of this library already has the name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deletePrompt
      tags: [prompt]
      summary: Delete a prompt (EDITOR or above, by the formula)
      responses:
        "204":
          description: Prompt deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/prompts/available:
    get:
      operationId: listAvailablePrompts
      tags: [prompt]
      summary: >
        The prompts the caller can insert in the chat: every prompt of every prompt library
        the caller may read by the formula, within the caller's organization. With spaceId, the
        libraries associated with that space come first and are marked associatedWithSpace; then
        by library name, within a library by sortOrder and name. Deliberately lightweight - the
        text and the variables come from GET .../prompts/{promptId} once one is chosen. There is no
        parameter by person and no usage figure: inserting a prompt is not evaluated.
      parameters:
        - name: spaceId
          in: query
          required: false
          description: The space of the chat; the caller must be a member of it.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The prompts the caller may insert
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AvailablePrompt"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  schemas:
    PromptVariableType:
      type: string
      description: >
        How a prompt variable is filled in before the prompt is inserted: a single line, several
        lines, one of the declared options, or a calendar date (ISO 8601, yyyy-MM-dd).
      enum: [TEXT, TEXTAREA, SELECT, DATE]
      example: TEXT

    PromptVariable:
      type: object
      required: [name, label, type, required]
      description: >
        One variable of a prompt (docs/features/spaces-and-assets.md#prompt-bibliothek). The prompt
        text uses it as {{name}}; whoever inserts the prompt fills it in first. Blanks inside the
        braces ({{ name }}) are accepted and removed on saving - a stored text, and every
        PromptResponse, carries {{name}} only. The server refuses a text that uses an undefined
        variable and a definition the text does not use. The system variables {{CURRENT_DATE}} and
        {{USER_NAME}} are recognised in any case, stored upper-case, resolved on insertion and
        cannot be defined.
      properties:
        name:
          type: string
          pattern: "^[A-Za-z][A-Za-z0-9_]*$"
          maxLength: 64
          example: aktenzeichen
        label:
          type: string
          minLength: 1
          maxLength: 255
          example: Aktenzeichen
        type:
          $ref: "#/components/schemas/PromptVariableType"
        required:
          type: boolean
        defaultValue:
          type: string
          nullable: true
          maxLength: 2000
          description: >
            Prefilled value. For SELECT one of options, for DATE an ISO date (yyyy-MM-dd).
        options:
          type: array
          nullable: true
          maxItems: 50
          description: The choices of a SELECT variable - required there, refused for every other type.
          items:
            type: string
            minLength: 1
            maxLength: 255

    AvailablePrompt:
      type: object
      required: [id, libraryId, libraryName, name, title, hasVariables, associatedWithSpace]
      description: One entry of the slash-command selection in the chat.
      properties:
        id:
          type: string
          format: uuid
        libraryId:
          type: string
          format: uuid
        libraryName:
          type: string
        name:
          type: string
          description: The slash command without the slash.
          example: zusammenfassung
        title:
          type: string
          example: Zusammenfassung
        description:
          type: string
          nullable: true
        hasVariables:
          type: boolean
          description: Whether inserting the prompt asks for values first.
        associatedWithSpace:
          type: boolean
          description: Whether the prompt's library is associated with the space named by spaceId.

    PromptRequest:
      type: object
      required: [name, title, text]
      properties:
        name:
          type: string
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
          maxLength: 64
          description: >
            Unique within the library and the basis of the slash command (/name): lower-case
            letters, digits and single hyphens.
          example: anhoerung
        title:
          type: string
          minLength: 1
          maxLength: 255
          example: Anhörungsschreiben
        description:
          type: string
          nullable: true
          maxLength: 2000
        text:
          type: string
          minLength: 1
          maxLength: 8000
          example: "Entwirf ein Anhörungsschreiben zum Aktenzeichen {{aktenzeichen}}, Stand {{CURRENT_DATE}}."
        variables:
          type: array
          maxItems: 20
          description: Every variable the text uses, except the system variables. Absent means none.
          items:
            $ref: "#/components/schemas/PromptVariable"
        sortOrder:
          type: integer
          format: int32
          nullable: true
          description: Position in the library's list, ascending; absent means 0.

    PromptResponse:
      type: object
      required: [id, promptLibraryId, name, title, text, variables, sortOrder, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        promptLibraryId:
          type: string
          format: uuid
        name:
          type: string
          example: anhoerung
        title:
          type: string
        description:
          type: string
          nullable: true
        text:
          type: string
        variables:
          type: array
          items:
            $ref: "#/components/schemas/PromptVariable"
        sortOrder:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PromptLibraryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: Formulierungshilfen Referat 50
        description:
          type: string
          nullable: true
          maxLength: 2000
        ownerType:
          $ref: "#/components/schemas/AssetOwnerType"
          description: Defaults to USER (the creator) when omitted
        ownerId:
          type: string
          format: uuid
          nullable: true
          description: >
            Required when ownerType is GROUP (the caller must be a member of that group). Ignored
            for ownerType USER, which always owns as the creator.

    PromptLibraryUpdateRequest:
      type: object
      required: [name]
      description: Replaces name and description as a whole.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
          maxLength: 2000

    PromptLibraryResponse:
      type: object
      required:
        [id, name, ownerType, ownerId, reach, myRole, promptCount, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        ownerType:
          $ref: "#/components/schemas/AssetOwnerType"
        ownerId:
          type: string
          format: uuid
          description: The owning user or group, whichever ownerType names.
        ownerName:
          type: string
          nullable: true
          description: >
            Display name of the owning person or group; null when it cannot be resolved or the
            group is protected and the caller may not see its name (ADR-0036, Entscheidung 9).
        reach:
          $ref: "#/components/schemas/AssetReachResponse"
        myRole:
          description: >
            The role the caller holds. In the list, the role of the formula (at least VIEWER);
            for a single library a system administrator counts as OWNER, as for every asset.
          allOf:
            - $ref: "#/components/schemas/AssetRole"
        promptCount:
          type: integer
          format: int64
        succession:
          description: >
            Set while the library has no capable owner (ADR-0036, Entscheidung 6) - state and
            addressee only.
          nullable: true
          allOf:
            - $ref: "#/components/schemas/SuccessionStateResponse"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
