# Topic "upload-store": its tags, paths and the components only this topic uses.
# Merged with all other fragments at build time, see root.yaml.
tags:
  - name: upload-store
    description: Maintenance of the upload store.
paths:
  /api/v1/admin/upload-store/orphan-originals/report:
    post:
      operationId: reportOrphanedOriginals
      tags: [upload-store]
      summary: >
        List the stored originals of one library that no document row points to (system admin
        only, #1478, ADR-0030 "Konsequenzen")
      description: >
        Walks the storage of uploaded originals - the library's own subdirectory on the filesystem,
        its own key level in the bucket; never anything nested below either, which this storage
        never writes and which therefore belongs to somebody else - and names every stored original
        whose locator no row of
        libraryId (which must belong to the caller's own organization, otherwise 404) carries as
        file_path, regardless of the row's status: a PENDING or FAILED row keeps its original. An
        original younger than the grace period (opaa.upload.orphan-grace-minutes, raised but never
        lowered by minimumAgeMinutes) is never reported: an upload whose row is being written right
        now is not an orphan. Reports only; nothing is changed, and no audit event is written. At
        most 500 orphans are listed per call - orphanCount carries the full number and truncated
        tells whether a further pass after deleting these is needed. A storage that cannot be
        reached answers 503.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrphanedOriginalReportRequest"
      responses:
        "200":
          description: The orphaned originals found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrphanedOriginalReportResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/admin/upload-store/orphan-originals/delete:
    post:
      operationId: deleteOrphanedOriginals
      tags: [upload-store]
      summary: >
        Remove explicitly named orphaned originals of one library from the storage (system admin
        only, #1478)
      description: >
        The second step after the report: removes exactly the originals named by locators - never
        anything the report found in the meantime. Rows and storage are read once per call, right
        before the removals, and every named locator is checked against that reading: one a row of
        libraryId points to, one younger than the configured grace period, and one the library's
        storage area does not hold are skipped with their reason instead of deleted. At most 500
        locators per call. A removal the storage does not confirm - it refused, or it became
        unreachable mid-call - is reported as DELETE_FAILED and does not end the call: the response
        and the audit entry still name everything that actually went. Every call, executed or
        rejected, is recorded once in the audit log (UPLOAD_ORPHAN_ORIGINALS_DELETED) with the
        locators it removed. A storage that cannot be read at all answers 503 and records the
        failure.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrphanedOriginalDeletionRequest"
      responses:
        "200":
          description: What was removed and what was skipped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrphanedOriginalDeletionResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/admin/upload-store/orphan-libraries/report:
    post:
      operationId: reportOrphanedLibraries
      tags: [upload-store]
      summary: >
        List the storage areas of the caller's own organization that no library row belongs to any
        more (system admin only, #1518, ADR-0030 "Konsequenzen")
      description: >
        The counterpart of orphan-originals/report for the case that run cannot reach: a library
        deleted after the removal of one of its originals had failed leaves bytes behind that no
        library-bound call can name any more. Walks the level directly below the caller's own
        organization - its own subdirectory on the filesystem, its own key level in the bucket -
        and reports every storage area there that no library row exists for. The organization comes
        from the caller and is matched by segment, never lexically: an organization whose id starts
        with another's is a different storage area, and no call ever leaves the caller's own.
        A storage area a library row exists for is left out even when that row belongs to another
        organization, and so is one holding no original at all - an emptied directory is nothing
        this run could remove. Every stored original of a reported area is orphaned by definition,
        and the grace period (opaa.upload.orphan-grace-minutes, raised but never lowered by
        minimumAgeMinutes) is the only thing that keeps one out. It is measured from when the
        original was written, not from when the library was deleted: an original older than the
        period is offered the moment its library's row is gone, so deleting a library opens no
        window in which its originals could still be recovered.
        Reports only; nothing is changed, and no audit event is written. At most 500 areas and 500
        orphans across all of them are listed - truncated tells whether a further pass is needed. A
        storage that cannot be reached answers 503.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrphanedLibraryReportRequest"
      responses:
        "200":
          description: The orphaned storage areas found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrphanedLibraryReportResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/admin/upload-store/orphan-libraries/delete:
    post:
      operationId: deleteOrphanedLibraryOriginals
      tags: [upload-store]
      summary: >
        Remove explicitly named originals from the storage area of a deleted library (system admin
        only, #1518)
      description: >
        The second step after orphan-libraries/report, and the same rules as
        orphan-originals/delete: exactly the originals named by locators go, at most 500 per call,
        each checked once more against a fresh reading of the storage right before it is removed -
        one younger than the configured grace period and one the area does not hold are skipped
        with their reason. A locator outside the caller's own organization or outside libraryId is
        NOT_IN_STORE, because the storage resolves it against exactly that area. libraryId must
        name a library that no longer exists anywhere; one that does is rejected with 400, because
        its originals belong to orphan-originals/delete, which holds them against their rows. A
        removal the storage does not confirm is reported as DELETE_FAILED and does not end the
        call. Every call, executed or rejected, is recorded once in the audit log
        (UPLOAD_ORPHAN_ORIGINALS_DELETED) with the locators it removed. A storage that cannot be
        read at all answers 503 and records the failure.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrphanedLibraryDeletionRequest"
      responses:
        "200":
          description: What was removed and what was skipped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrphanedOriginalDeletionResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

components:
  schemas:
    OrphanedOriginalReportRequest:
      type: object
      required: [libraryId]
      properties:
        libraryId:
          type: string
          format: uuid
          description: The library whose storage area is compared against its document rows.
        minimumAgeMinutes:
          type: integer
          minimum: 1
          description: >
            Only originals at least this old are reported. Omitted, the configured grace period
            (opaa.upload.orphan-grace-minutes) applies; a value below it is rejected - the grace
            period can be raised per call, never lowered.

    OrphanedOriginalReportResponse:
      type: object
      required:
        [
          orphans,
          orphanCount,
          scannedCount,
          referencedCount,
          withinGracePeriodCount,
          minimumAgeMinutes,
          truncated,
        ]
      properties:
        orphans:
          type: array
          description: >
            The orphaned originals, at most 500 - in the storage's own order, not sorted by age.
          items:
            $ref: "#/components/schemas/OrphanedOriginalResponse"
        orphanCount:
          type: integer
          description: How many orphaned originals were found in total, listed or not.
        scannedCount:
          type: integer
          description: How many stored originals of the library were looked at.
        referencedCount:
          type: integer
          description: >
            How many of them a document row of the library points to. The sanity check of the
            whole report: a library with stored originals whose referencedCount is 0 has lost the
            connection between rows and storage - typically a storage that was switched over
            without rewriting file_path - and nothing here should be deleted until that is
            understood.
        withinGracePeriodCount:
          type: integer
          description: >
            Stored originals no row points to that are still younger than the grace period - not
            reported, not deletable, expected to gain their row or age into the next report.
        minimumAgeMinutes:
          type: integer
          description: The age threshold this report applied.
        truncated:
          type: boolean
          description: >
            True when more orphans exist than orphans lists. Delete the listed ones and run the
            report again - the listed ones are not all there are.

    OrphanedOriginalResponse:
      type: object
      required: [locator, lastModified, size]
      properties:
        locator:
          type: string
          description: >
            The locator the storage knows the original by - the value a documents.file_path row
            would carry for it - and the value to hand to the delete step.
        lastModified:
          type: string
          format: date-time
        size:
          type: integer
          format: int64
          description: Size in bytes.

    OrphanedOriginalDeletionRequest:
      type: object
      required: [libraryId, locators]
      properties:
        libraryId:
          type: string
          format: uuid
        locators:
          type: array
          minItems: 1
          maxItems: 500
          description: The locators to remove, as the report listed them.
          items:
            type: string

    OrphanedOriginalDeletionResponse:
      type: object
      required: [deleted, skipped]
      properties:
        deleted:
          type: array
          description: The locators whose original was removed.
          items:
            type: string
        skipped:
          type: array
          description: The locators left alone, each with the reason.
          items:
            $ref: "#/components/schemas/SkippedOrphanedOriginalResponse"

    SkippedOrphanedOriginalResponse:
      type: object
      required: [locator, reason]
      properties:
        locator:
          type: string
        reason:
          $ref: "#/components/schemas/OrphanedOriginalSkipReason"

    OrphanedOriginalSkipReason:
      type: string
      description: >
        Why a named locator was not removed: REFERENCED - a document row of the library points to
        it; WITHIN_GRACE_PERIOD - the original is younger than the grace period; NOT_IN_STORE - the
        library's storage area holds no original under this locator (already gone, another
        library's, or not a locator of this storage at all); DELETE_FAILED - the storage did not
        confirm the removal, so the original may still be there.
      enum: [REFERENCED, WITHIN_GRACE_PERIOD, NOT_IN_STORE, DELETE_FAILED]

    OrphanedLibraryReportRequest:
      type: object
      properties:
        minimumAgeMinutes:
          type: integer
          minimum: 1
          description: >
            Only originals at least this old are reported. Omitted, the configured grace period
            (opaa.upload.orphan-grace-minutes) applies; a value below it is rejected - the grace
            period can be raised per call, never lowered.

    OrphanedLibraryReportResponse:
      type: object
      required:
        [
          libraries,
          libraryCount,
          scannedLibraryCount,
          knownLibraryCount,
          minimumAgeMinutes,
          truncated,
        ]
      properties:
        libraries:
          type: array
          description: >
            The orphaned storage areas, at most 500 - in the storage's own order.
          items:
            $ref: "#/components/schemas/OrphanedLibraryResponse"
        libraryCount:
          type: integer
          description: >
            How many orphaned storage areas holding at least one original exist in total, listed
            or not.
        scannedLibraryCount:
          type: integer
          description: >
            How many storage areas the organization has at all. What this exceeds libraryCount and
            knownLibraryCount by are orphaned areas holding no original - leftover directories the
            filesystem keeps and this run does not remove.
            The areas of private libraries are left out of both, so the figures tell nothing about
            a person and cannot be set off against the private libraries of the index status.
        knownLibraryCount:
          type: integer
          description: >
            How many of them a library row exists for. The sanity check of the whole report, the
            same one OrphanedOriginalReportResponse.referencedCount is: an organization with
            storage areas and none of them known has lost the connection between rows and storage
            - typically a storage switched over without rewriting file_path - and nothing here
            should be deleted until that is understood.
        minimumAgeMinutes:
          type: integer
          description: The age threshold this report applied.
        truncated:
          type: boolean
          description: >
            True when this pass left something unlisted - more orphaned storage areas than
            libraries names, or a listed one whose orphans are cut short. Delete what is listed and
            run the report again.

    OrphanedLibraryResponse:
      type: object
      required:
        [
          libraryId,
          orphans,
          orphanCount,
          scannedCount,
          withinGracePeriodCount,
          totalSize,
          truncated,
        ]
      properties:
        libraryId:
          type: string
          format: uuid
          description: >
            The library this storage area was written for - the value to hand to the delete step.
            No row carries it any more; it is read from the storage itself.
        orphans:
          type: array
          description: The orphans of this area that this report lists.
          items:
            $ref: "#/components/schemas/OrphanedOriginalResponse"
        orphanCount:
          type: integer
          description: How many orphans this area holds in total, listed or not.
        scannedCount:
          type: integer
          description: How many stored originals of this area were looked at.
        withinGracePeriodCount:
          type: integer
          description: >
            How many of them were written less than a grace period ago - not reported, not
            deletable, expected to age into the next report. The age of the original decides, not
            the moment its library was deleted.
        totalSize:
          type: integer
          format: int64
          description: The bytes of this area's orphans, listed or not - what removing them frees.
        truncated:
          type: boolean
          description: True when this area holds more orphans than orphans lists.

    OrphanedLibraryDeletionRequest:
      type: object
      required: [libraryId, locators]
      properties:
        libraryId:
          type: string
          format: uuid
          description: >
            The storage area to remove from, as the report named it. Must be the area of a library
            that no longer exists.
        locators:
          type: array
          minItems: 1
          maxItems: 500
          description: The locators to remove, as the report listed them.
          items:
            type: string
