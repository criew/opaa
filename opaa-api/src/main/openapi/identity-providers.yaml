# Topic "identity-providers": its tags, paths and the components only this topic uses.
# Merged with all other fragments at build time, see root.yaml.
tags:
  - name: identity-provider
    description: OIDC identity providers.
paths:
  /api/v1/admin/oidc-providers:
    get:
      operationId: listOidcProviders
      tags: [identity-provider]
      summary: List the identity providers (system admin only)
      description: >
        ADR-0025 (#1329): every provider a deployment accepts sign-ins from, in sign-in page order.
        The provider itself is a public client and has no secret; the directory access some of them
        carry (directoryConnector, #1817) does, and that one is never part of a response - only
        which service account and which address. registryState says whether the backend could build
        the provider's token decoder (READY), could not (UNAVAILABLE - discovery unreachable,
        address blocked; registryMessage says why) or did not try because the provider is disabled
        (DISABLED). A stored directory secret this deployment's key cannot decrypt does not fail
        this read: it is reported as absent, so the list stays usable and the access can be
        replaced or removed.
      responses:
        "200":
          description: List of identity providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OidcProviderResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      operationId: createOidcProvider
      tags: [identity-provider]
      summary: Create an identity provider (system admin only)
      description: >
        Created enabled. The very first provider becomes the default provider automatically. The
        issuer must be unique (409 otherwise); issuer and JWK set address must pass the sign-in's
        address policy (400 with the allowlist variable named otherwise). Effective without a
        backend restart.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OidcProviderRequest"
      responses:
        "201":
          description: Identity provider created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcProviderResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/admin/oidc-providers/order:
    put:
      operationId: reorderOidcProviders
      tags: [identity-provider]
      summary: Set the sign-in page order of the identity providers (system admin only)
      description: providerIds must name every provider exactly once (400 otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OidcProviderOrderRequest"
      responses:
        "200":
          description: Providers in their new order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OidcProviderResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/oidc-providers/test:
    post:
      operationId: testOidcProvider
      tags: [identity-provider]
      summary: Probe an identity provider before saving it (system admin only)
      description: >
        Fetches the discovery document under the issuer, checks that it names the same issuer,
        then fetches the JWK set (jwkSetUri if given, else the discovered one) and counts its
        keys. Every address passes the sign-in's address policy first; nothing is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OidcProviderTestRequest"
      responses:
        "200":
          description: Outcome of the probe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcProviderTestResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/oidc-providers/{providerId}:
    parameters:
      - name: providerId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: getOidcProvider
      tags: [identity-provider]
      summary: Read one identity provider (system admin only)
      responses:
        "200":
          description: Identity provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcProviderResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: updateOidcProvider
      tags: [identity-provider]
      summary: Update an identity provider's editable fields (system admin only)
      description: >
        A full replacement of every editable field; enabled, isDefault and sortOrder change only
        through their own operations. Changing jwkSetUri changes which keys attest the tokens of
        this issuer - the trust anchor of every account of the provider. For the LOCAL row only
        displayName is editable: its issuer is fixed to urn:opaa:local (409 for any other value),
        no address check, discovery or connection test applies to it, and clientId and jwkSetUri
        are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OidcProviderRequest"
      responses:
        "200":
          description: Identity provider updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcProviderResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

    delete:
      operationId: deleteOidcProvider
      tags: [identity-provider]
      summary: Delete an identity provider (system admin only)
      description: >
        Accounts provisioned through the provider remain; only their sign-in stops. Rejected with
        409 for the default provider while another OIDC provider exists - make another provider
        the default first. The LOCAL row of the local account management is never deletable (409);
        its switch is enable/disable. Deleting an enabled OIDC provider is allowed only while a
        login-capable system administrator remains without it - a local ACTIVE SYSTEM_ADMIN
        account with a password or an administrator of another enabled provider (409 with code
        LAST_LOGIN_CAPABLE_ADMIN otherwise: "zuerst ein lokales Systemverwalterkonto mit Passwort
        einrichten"). Deleting the last enabled OIDC provider additionally needs
        acknowledgeLastProvider=true (409 with code LAST_PROVIDER_ACKNOWLEDGEMENT_REQUIRED
        otherwise); afterwards only local accounts can sign in (ADR-0033, Entscheidung 4).
        The provider's groups are deleted with it, but only while none of them still carries a
        right: a group that holds a grant or owns an asset answers 409 with code
        PROVIDER_GROUPS_IN_EFFECT and a message quoting the counts (ADR-0036, Entscheidung 2).
        Until the transfer operation exists there is no way past that other than removing those
        rights; disabling the provider stays possible at any time.
        Its accounts count as deactivated afterwards: the secrets of their connected accounts are
        deleted at once and irreversibly, and the deletion period of their private libraries
        begins (ADR-0041, Entscheidung 4). Wherever a connection profile admits persons this
        needs confirmConnections, whatever the numbers of getOidcProviderImpact say.
      parameters:
        - name: acknowledgeLastProvider
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: >
            The caller has seen that this is the last enabled OIDC provider and that afterwards
            only local accounts can sign in. Required (true) exactly in that case; ignored
            otherwise.
        - name: confirmConnections
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: >
            The caller has seen what this does to persons' connections (getOidcProviderImpact).
            Required (true) wherever a connection profile admits persons (409 with code
            PROVIDER_CONNECTIONS_CONFIRMATION_REQUIRED otherwise); ignored otherwise.
      responses:
        "204":
          description: Identity provider deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/admin/oidc-providers/{providerId}/impact:
    get:
      operationId: getOidcProviderImpact
      tags: [identity-provider]
      summary: What disabling or deleting the provider does to persons' connections (system admin only)
      description: >
        Disabled, the connections of its persons rest; deleted, their secrets are deleted at once
        and irreversibly and the deletion period of their private libraries begins. Counted are
        the accounts that are not deactivated already - for the LOCAL row the regular ones.
      parameters:
        - name: providerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The connected accounts and private libraries concerned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcProviderImpactResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/oidc-providers/{providerId}/enable:
    post:
      operationId: enableOidcProvider
      tags: [identity-provider]
      summary: Enable an identity provider (system admin only)
      description: >
        For the LOCAL row this switches the local account management on (audited as
        LOCAL_ACCOUNTS_ENABLED, ADR-0033 Entscheidung 4).
      parameters:
        - name: providerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Identity provider enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcProviderResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/oidc-providers/{providerId}/disable:
    post:
      operationId: disableOidcProvider
      tags: [identity-provider]
      summary: Disable an identity provider (system admin only)
      description: >
        Its tokens are refused from the commit on; sessions of its users end with the next
        request. Rejected with 409 for the default provider while another enabled OIDC provider
        exists - make another provider the default first. Disabling an enabled OIDC provider is
        allowed only while a login-capable system administrator remains without it (409 with code
        LAST_LOGIN_CAPABLE_ADMIN otherwise); disabling the last enabled OIDC provider additionally
        needs acknowledgeLastProvider=true (409 with code LAST_PROVIDER_ACKNOWLEDGEMENT_REQUIRED
        otherwise). For the
        LOCAL row this is the switch of the local account management (ADR-0033, Entscheidung 4):
        switching off ends the sessions of every regular local account (audited as
        LOCAL_ACCOUNTS_DISABLED plus one LOCAL_SESSION_REVOKED per account); local SYSTEM_ADMIN
        accounts keep signing in.
        The connections of the persons it reaches rest: nothing is deleted, and once it is
        enabled again they go on without connecting anew (ADR-0041, Entscheidung 4). Wherever a
        connection profile admits persons this needs confirmConnections.
      parameters:
        - name: providerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: acknowledgeLastProvider
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: >
            The caller has seen that this is the last enabled OIDC provider and that afterwards
            only local accounts can sign in. Required (true) exactly in that case; ignored
            otherwise.
        - name: confirmConnections
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: >
            The caller has seen what this does to persons' connections (getOidcProviderImpact).
            Required (true) wherever a connection profile admits persons (409 with code
            PROVIDER_CONNECTIONS_CONFIRMATION_REQUIRED otherwise); ignored otherwise.
      responses:
        "200":
          description: Identity provider disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcProviderResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/admin/oidc-providers/{providerId}/external:
    post:
      operationId: setOidcProviderExternal
      tags: [identity-provider]
      summary: Mark an identity provider as belonging to another organisation (system admin only)
      description: >
        Sets or clears the external mark (ADR-0036, Entscheidung 2). Every provider but the default
        one starts external; the mark decides how this provider's groups are shown in a selection
        and whether granting a right to one of them asks back. Rejected with 409 for the LOCAL row
        of the local account management, which is this installation's own user administration and
        never external.
      parameters:
        - name: providerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OidcProviderExternalRequest"
      responses:
        "200":
          description: Identity provider updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcProviderResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/admin/oidc-providers/{providerId}/default:
    post:
      operationId: makeOidcProviderDefault
      tags: [identity-provider]
      summary: Make an identity provider the default provider (system admin only)
      description: >
        Moves the default flag from the previous default. The default provider is the directory
        provider - the one the directory synchronisation is bound to (ADR-0025; since ADR-0033 it
        no longer mints the initial administrator). Rejected with 409 for a disabled provider and
        for the LOCAL row, which is never the default.
      parameters:
        - name: providerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Identity provider is now the default
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcProviderResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

components:
  schemas:
    OidcClaimMappingDto:
      type: object
      description: >
        Which token claims a provider's users are read from (ADR-0025, Entscheidung 4). Omitted
        or blank fields take the Keycloak defaults (email, name); rolesClaim/groupsClaim absent
        means the provider derives no roles / no groups from its tokens.
      properties:
        emailClaim:
          type: string
          maxLength: 100
          example: email
        displayNameClaim:
          type: string
          maxLength: 100
          example: name
        rolesClaim:
          type: string
          nullable: true
          maxLength: 200
          description: Dot-separated path to the roles claim, e.g. realm_access.roles.
          example: realm_access.roles
        systemAdminRole:
          type: string
          nullable: true
          maxLength: 255
          description: The token role value that grants SYSTEM_ADMIN.
        auditorRole:
          type: string
          nullable: true
          maxLength: 255
          description: The token role value that grants AUDITOR.
        groupsClaim:
          type: string
          nullable: true
          maxLength: 200
          description: Dot-separated path to the groups claim, e.g. groups.

    ProviderType:
      type: string
      description: >
        Mirrors io.opaa.api.types.ProviderType (ADR-0033): OIDC for an identity provider the SPA
        runs a code flow against, LOCAL for the single row of the local account management.
      enum: [OIDC, LOCAL]

    OidcProviderRegistryState:
      type: string
      description: >
        Whether the backend holds a working token decoder for the provider: READY, UNAVAILABLE
        (could not be built - see registryMessage; retried automatically) or DISABLED (not
        attempted, the provider is disabled).
      enum: [READY, UNAVAILABLE, DISABLED]
      example: READY

    OidcProviderExternalRequest:
      type: object
      required: [external]
      properties:
        external:
          type: boolean
          description: >
            True marks the provider as another organisation's, false as this installation's own.

    OidcProviderResponse:
      type: object
      description: >
        An identity provider (ADR-0025, #1329) or, for the one row with providerType LOCAL, the
        local account management (ADR-0033). A public client - there is no secret.
      required:
        [
          id,
          displayName,
          enabled,
          isDefault,
          isExternal,
          providerType,
          sortOrder,
          issuerUri,
          clientId,
          claimMapping,
          directorySyncEnabled,
          registryState,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          example: Beschäftigte (Keycloak)
        enabled:
          type: boolean
          description: >
            For the LOCAL row this is the switch of the local account management (ADR-0033).
        isDefault:
          type: boolean
          description: >
            The directory provider (ADR-0025); only an OIDC row is ever the default, the LOCAL row
            never (ADR-0033).
        isExternal:
          type: boolean
          description: >
            Whether this provider belongs to another organisation (ADR-0036, Entscheidung 2).
            Every provider but the default one starts external; the LOCAL row never is. Groups of
            an external provider are shown differently in every selection, and granting a right to
            one asks back.
        providerType:
          $ref: "#/components/schemas/ProviderType"
        sortOrder:
          type: integer
        issuerUri:
          type: string
          description: >
            The token issuer and, for the SPA, the authority of the code flow; fixed to
            urn:opaa:local for the LOCAL row.
          example: https://idp.behoerde.example/realms/mitarbeitende
        clientId:
          type: string
          nullable: true
          description: Absent (null) for the LOCAL row - there is no code flow against the backend.
          example: opaa-frontend
        jwkSetUri:
          type: string
          nullable: true
          description: >
            Backend-side override of the JWK set address found through discovery - the trust
            anchor of every account of this issuer; null when discovery is used.
        claimMapping:
          $ref: "#/components/schemas/OidcClaimMappingDto"
        directorySyncEnabled:
          type: boolean
          description: >
            Whether this provider's groups come from a scheduled directory run instead of its
            tokens' groups claim (ADR-0036, Entscheidung 2: one group mechanism per provider).
            Never true for the LOCAL row.
        directorySyncIntervalMinutes:
          type: integer
          nullable: true
          description: How often the directory run is due; null while it is switched off.
          example: 360
        directoryConnector:
          allOf:
            - $ref: "#/components/schemas/DirectoryConnectorResponse"
          nullable: true
          description: >
            The stored directory access of this provider (#1817), or null while none is stored -
            in which case every run reports the directory as unreachable and revokes nothing.
        registryState:
          $ref: "#/components/schemas/OidcProviderRegistryState"
        registryMessage:
          type: string
          nullable: true
          description: Why the decoder could not be built, German, when registryState is UNAVAILABLE.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OidcProviderRequest:
      type: object
      description: Used for both create and update; a full replacement of every editable field.
      required: [displayName, issuerUri, clientId]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        issuerUri:
          type: string
          minLength: 1
          maxLength: 500
          description: Absolute http(s) URI; a trailing slash is stripped. Must pass the address policy.
        clientId:
          type: string
          minLength: 1
          maxLength: 255
        jwkSetUri:
          type: string
          nullable: true
          maxLength: 500
          description: Optional override of the discovered JWK set address. Must pass the address policy.
        claimMapping:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/OidcClaimMappingDto"

    OidcProviderOrderRequest:
      type: object
      required: [providerIds]
      properties:
        providerIds:
          type: array
          description: Every provider id exactly once, in sign-in page order.
          items:
            type: string
            format: uuid

    OidcProviderTestRequest:
      type: object
      required: [issuerUri]
      properties:
        issuerUri:
          type: string
          minLength: 1
          maxLength: 500
        jwkSetUri:
          type: string
          nullable: true
          maxLength: 500

    OidcProviderTestResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
        message:
          type: string
          description: German, user-facing outcome.
          example: "Anbieter erreichbar: Discovery-Dokument gefunden, JWK-Set mit 2 Schlüsseln."

    OidcProviderImpactResponse:
      type: object
      required: [confirmationRequired]
      description: >
        Numbers per provider split the totals the connection profiles tell, so they are never
        exact: atLeast only while every provider with accounts and the persons outside any
        provider each reach the minimum group size, else absent for every provider. Whatever the
        profiles tell, a provider without a number may then hold any number below that size, zero
        included. Left open: watching the answers over time - a new account can tip every
        provider's answer and so tell an earlier state.
      properties:
        confirmationRequired:
          type: boolean
          description: >
            Whether disabling and deleting need confirmConnections: true wherever a connection
            profile admits persons or a number is told, so it tells nothing about a single person.
        connections:
          description: The connected accounts of its persons.
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PersonCount"
        privateLibraries:
          description: The private libraries of its persons.
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PersonCount"
