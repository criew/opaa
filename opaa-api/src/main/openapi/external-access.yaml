# Topic "external-access": its tags, paths and the components only this topic uses.
# Merged with all other fragments at build time, see root.yaml.
tags:
  - name: external-access
    description: External access tokens and the external access settings.
paths:
  /api/v1/system/external-access:
    get:
      operationId: getExternalAccessSettings
      tags: [external-access]
      summary: The channel settings of the external access (system admin only)
      responses:
        "200":
          description: The settings, the delivered default instructions text and who changed them last
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalAccessSettingsResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

    put:
      operationId: updateExternalAccessSettings
      tags: [external-access]
      summary: Replace the channel settings of the external access (system admin only)
      description: >
        ADR-0035 and docs/features/external-access.md, "Der Schalter der Installation". enabled is
        the installation-wide switch of the whole external access channel, default off and at the
        same time its emergency stop; the paths that evaluate it do so per call, so switching off
        takes effect immediately and destroys no token. Bounds: tokenMaxLifetimeDays 1-365,
        tokenRateLimitPerHour 1-10000, massRetrievalAlertThreshold 1-1000000, at most 50
        allowedCidrs, each a syntactically valid IPv4/IPv6 CIDR, serverInstructions at most 4000
        characters. Every bound is checked in the domain service, never by bean validation on the
        request, so a violation answers 400 with German fieldErrors naming the field instead of an
        English Jakarta message without them. An empty allowedCidrs list means "no address may use
        the channel", never "every address". Every change
        except serverInstructions is audited as EXTERNAL_ACCESS_SETTINGS_CHANGED with before/after
        of the changed keys - the instructions text changes no reach, only the wording of a request
        to a foreign model, and is deliberately outside the closed event list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExternalAccessSettingsUpdateRequest"
      responses:
        "200":
          description: The stored settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalAccessSettingsResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/libraries/{libraryId}/external-access:
    parameters:
      - name: libraryId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    put:
      operationId: setLibraryExternalAccess
      tags: [external-access]
      summary: >
        Sets or takes back a library's Fremdzugangsfreigabe (MANAGER role or above required - the
        same bar that decides who may hand out read access, plus SYSTEM_ADMIN). A release is
        mandatorily time-limited to at most one year; it stops taking effect on its own, and the
        renewal is a deliberate act. Whether the channel itself is open is a separate, installation-
        wide decision (#1717) this endpoint neither reads nor needs.
        See docs/features/external-access.md#die-freigabe-der-bibliothek.
        While the library's succession is open (ADR-0036, Entscheidung 6) a new release and an
        extended one are refused with 409 and the code SUCCESSION_OPEN; taking a release back and
        shortening a running one stay possible.
        A private library is never released: 403 with the code OWNER_ONLY_ASSET for its owner, 404
        for anybody else, the system administration included.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryExternalAccessRequest"
      responses:
        "200":
          description: Release set or taken back
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryExternalAccessResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/admin/external-access/libraries:
    get:
      operationId: listExternalAccessLibraries
      tags: [external-access]
      summary: >
        Every library currently released for Fremdzugänge, with who set the release, when, and
        when it ends (SYSTEM_ADMIN only). Sorted by expiry, soonest first - the list exists to
        make the Bestand of releases reviewable, not to look up a single library.
      responses:
        "200":
          description: The currently released libraries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExternalAccessLibraryResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/external-access/settings:
    get:
      operationId: getOwnExternalAccessChannelInfo
      tags: [external-access]
      summary: >
        The two channel values a person needs to manage their own tokens: whether the channel is
        open at all and how long a token may live. Deliberately a self view next to the tokens and
        not a widening of the SYSTEM_ADMIN settings - the quota, the networks of the channel, the
        instructions text and who changed them last stay with the administration.
      responses:
        "200":
          description: The two values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalAccessChannelInfoResponse"

  /api/v1/external-access/tokens:
    get:
      operationId: listOwnExternalAccessTokens
      tags: [external-access]
      summary: >
        The caller's own personal access tokens (ADR-0035, Entscheidung 2). "Zuletzt benutzt" is a
        date without a time and exists only in this self view - the administration's list never
        carries it. There is no usage count anywhere.
      responses:
        "200":
          description: The caller's tokens, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnExternalAccessTokenListResponse"
    post:
      operationId: createExternalAccessToken
      tags: [external-access]
      summary: >
        Issues a personal access token for a named tool. The plain value is in this response and in
        no other, ever - the server keeps only its HMAC lookup hash and the prefix. Name, at least
        one library and an expiry are mandatory; the expiry must not exceed the installation-wide
        ceiling, and every named library must be readable by the caller and released for external
        access. The selection is immutable afterwards - a change is a new token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExternalAccessTokenRequest"
      responses:
        "201":
          description: The token, with its plain value shown exactly once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedExternalAccessTokenResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/external-access/eligible-libraries:
    get:
      operationId: listEligibleExternalAccessLibraries
      tags: [external-access]
      summary: >
        The libraries the caller may put into a new access token - exactly the set POST
        /api/v1/external-access/tokens accepts, so anything offered here is issuable and anything
        outside it is answered 400. That is: readable by this person AND released for external
        access with a release that is still in force. Empty while the installation switch is off,
        because no issuance would be accepted then either.
      responses:
        "200":
          description: The selectable libraries, by name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EligibleExternalAccessLibraryListResponse"

  /api/v1/external-access/tokens/{tokenId}:
    delete:
      operationId: revokeOwnExternalAccessToken
      tags: [external-access]
      summary: >
        Revokes one of the caller's own tokens; it stops working with the next call. "Zuletzt
        benutzt" is cleared with the revocation - it answered "may I revoke this?" and has no
        purpose afterwards. A token of someone else answers 404, the same way an unknown one does.
      parameters:
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Revoked
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/external-access/tokens:
    get:
      operationId: listAllExternalAccessTokens
      tags: [external-access]
      summary: >
        The Bestandsliste of every access token for SYSTEM_ADMIN - owner, name, expiry, libraries
        and state. It carries no token value, no usage count and deliberately no usage date, and it
        offers no filter, no sorting and no output by person; the only filters are over state and
        expiry (security-and-compliance.md, "Mitbestimmungsfaehigkeit" no. 2). The order is fixed:
        soonest expiry first.
      parameters:
        - name: status
          in: query
          required: false
          description: Restrict to one state; omitted means every token.
          schema:
            $ref: "#/components/schemas/ExternalAccessTokenStatus"
        - name: expiringWithinDays
          in: query
          required: false
          description: Only tokens still valid and expiring within this many days.
          schema:
            type: integer
            minimum: 1
            maximum: 365
      responses:
        "200":
          description: Every token of the installation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminExternalAccessTokenListResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/external-access/tokens/{tokenId}/block:
    post:
      operationId: blockExternalAccessToken
      tags: [external-access]
      summary: Blocks one token; it stops working with the next call.
      parameters:
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Blocked
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/external-access/tokens/block-by-owner:
    post:
      operationId: blockExternalAccessTokensOfOwner
      tags: [external-access]
      summary: >
        Blocks every still-active token of one person at once - the lever for an incident or an
        account lifecycle. Deliberately a write, not a filter over the list: the list stays without
        an output by person.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockExternalAccessTokensRequest"
      responses:
        "200":
          description: How many tokens were blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockedExternalAccessTokensResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  schemas:
    ExternalAccessSettingsResponse:
      type: object
      description: >
        The channel settings of the external access (docs/features/external-access.md). updatedAt
        and updatedBy are shown prominently in the administration on purpose: a restore from a
        backup rolls switch, shares and tokens back together with the trail that would prove it,
        and a visible change date makes such a rollback noticeable.
      required:
        [enabled, tokenMaxLifetimeDays, tokenRateLimitPerHour, allowedCidrs,
        massRetrievalAlertThreshold, serverInstructions, defaultServerInstructions, updatedAt]
      properties:
        enabled:
          type: boolean
          description: The installation-wide switch of the channel; default off, at the same time the emergency stop.
        tokenMaxLifetimeDays:
          type: integer
        tokenRateLimitPerHour:
          type: integer
        allowedCidrs:
          type: array
          items:
            type: string
          description: The networks the whole channel may be reached from; empty means nobody.
        massRetrievalAlertThreshold:
          type: integer
          description: Retrievals per hour across the whole channel above which the mass-retrieval alert fires.
        serverInstructions:
          type: string
          description: The text delivered as the instructions field of the MCP initialisation.
        defaultServerInstructions:
          type: string
          description: The delivered default text, so the administration can reset to it without knowing it.
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
          nullable: true
          description: Display name of the person who changed the settings last; absent for a change by the installation itself.

    ExternalAccessSettingsUpdateRequest:
      type: object
      required:
        [enabled, tokenMaxLifetimeDays, tokenRateLimitPerHour, allowedCidrs,
        massRetrievalAlertThreshold, serverInstructions]
      properties:
        enabled:
          type: boolean
        tokenMaxLifetimeDays:
          type: integer
        tokenRateLimitPerHour:
          type: integer
        allowedCidrs:
          type: array
          items:
            type: string
        massRetrievalAlertThreshold:
          type: integer
        serverInstructions:
          type: string

    ExternalAccessState:
      type: string
      description: >
        Whether a library may be used through a Fremdzugang, and where it may not, why not.
        NEVER_SET is the shipped default. ACTIVE means released until expiresAt. WITHDRAWN means
        taken back by hand, EXPIRED means the Befristung ran out and the scheduled run took the
        release out of effect. SUSPENDED is reserved for a subsequently lowered connector share
        ceiling (#797) and is set by nothing today. See
        docs/features/external-access.md#die-freigabe-der-bibliothek.
      enum: [NEVER_SET, ACTIVE, WITHDRAWN, EXPIRED, SUSPENDED]

    LibraryExternalAccessRequest:
      type: object
      required:
        - enabled
      properties:
        enabled:
          type: boolean
          description: >
            True releases the library for Fremdzugänge and requires expiresAt; false takes an
            existing release back and must not carry an expiresAt.
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Mandatory when enabled is true: the instant the release stops taking effect. Must lie
            in the future and at most one year out (opaa.external-access.max-release-days) - a
            release without an end is a ratchet, which is exactly what the Befristung prevents.

    LibraryExternalAccessResponse:
      type: object
      required:
        - libraryId
        - state
        - tokenCount
        - maxReleaseDays
      properties:
        libraryId:
          type: string
          format: uuid
        state:
          $ref: "#/components/schemas/ExternalAccessState"
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: >
            When the release ends, or - for WITHDRAWN/EXPIRED - when it would have ended. Null
            while the state is NEVER_SET.
        setAt:
          type: string
          format: date-time
          nullable: true
          description: When the release was last set or taken back; null while NEVER_SET.
        setByDisplayName:
          type: string
          nullable: true
          description: >
            Who last set or took back the release, resolved for display only; null when the
            account no longer exists. The audit log carries the same fact pseudonymised.
        tokenCount:
          type: integer
          format: int64
          description: >
            How many Zugangstokens currently contain this library - a number, never names,
            persons or usage. Always 0 until the tokens themselves exist (#1718); the field is
            here from the start so the release view does not change shape when they arrive.
        maxReleaseDays:
          type: integer
          description: >
            The systemwide upper bound of a release in days (opaa.external-access.max-release-days,
            365 by default) - so a client can offer the latest admissible date instead of
            hard-coding one.

    ExternalAccessLibraryResponse:
      type: object
      required:
        - libraryId
        - libraryName
        - externalAccess
      properties:
        libraryId:
          type: string
          format: uuid
        libraryName:
          type: string
        externalAccess:
          $ref: "#/components/schemas/LibraryExternalAccessResponse"

    ExternalAccessTokenStatus:
      type: string
      description: >
        Mirrors io.opaa.api.types.ExternalAccessTokenStatus (ADR-0035, Entscheidung 2): the state
        of a personal access token, derived from its row - ACTIVE, EXPIRED, REVOKED (by the person)
        or BLOCKED (by the Systemverwaltung).
      enum: [ACTIVE, EXPIRED, REVOKED, BLOCKED]
      example: ACTIVE

    ExternalAccessChannelInfoResponse:
      type: object
      required: [enabled, tokenMaxLifetimeDays]
      description: >
        What a person needs to manage their own tokens - nothing else of the channel settings.
      properties:
        enabled:
          type: boolean
          description: >
            Whether the channel is open right now. While it is closed, no token can be issued -
            the issuance refuses it, and the set of selectable libraries is empty. Existing tokens
            remain and can be revoked; they simply do not act.
        tokenMaxLifetimeDays:
          type: integer
          description: The ceiling an expiry may not exceed, in days from now.

    EligibleExternalAccessLibraryResponse:
      type: object
      required: [id, name, releaseExpiresAt, favorite]
      description: >
        One library a new access token may name. Carries the end of its release, so a person can
        see that a token outliving it would lose the library before its own expiry, and the
        favorite mark the selection filters by - with the same meaning as in the catalog.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        releaseExpiresAt:
          type: string
          format: date-time
        favorite:
          type: boolean
          description: >
            Whether the caller marked this library as a favorite. Only ever the caller's own mark -
            no entry says anything about anybody else's.

    EligibleExternalAccessLibraryListResponse:
      type: object
      required: [libraries]
      properties:
        libraries:
          type: array
          items:
            $ref: "#/components/schemas/EligibleExternalAccessLibraryResponse"

    ExternalAccessTokenLibraryResponse:
      type: object
      required: [id, name, suspended]
      description: One library of a token's selection, as it was selected - not as it acts today.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        suspended:
          type: boolean
          description: >
            True once the entry was extinguished because the library's release was withdrawn or ran
            out. It is shown, never silently dropped, and it does not come back to life if the
            library is released again - that needs a new token (ADR-0035, Entscheidung 4).

    CreateExternalAccessTokenRequest:
      type: object
      required: [name, libraryIds, expiresAt]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: What the token is for, in the person's own words - shown to them and to the
            Systemverwaltung, and deliberately never written to the audit trail.
          example: Claude Code auf dem Dienstrechner
        libraryIds:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
            format: uuid
        expiresAt:
          type: string
          format: date-time
          description: Mandatory, in the future, and at most the installation-wide ceiling away.

    CreatedExternalAccessTokenResponse:
      type: object
      required: [id, name, prefix, token, createdAt, expiresAt, status, libraries]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
          description: The recognisable head of the value, kept for display; never logged.
        token:
          type: string
          description: The plain value, in this response and in no other - it is not recoverable.
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/ExternalAccessTokenStatus"
        libraries:
          type: array
          items:
            $ref: "#/components/schemas/ExternalAccessTokenLibraryResponse"

    OwnExternalAccessTokenResponse:
      type: object
      required: [id, name, prefix, createdAt, expiresAt, status, libraries]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        lastUsedOn:
          type: string
          example: "2026-09-18"
          description: >
            The day of the last use, written at most once a day and cleared on revocation and on
            expiry. Absent means "not used yet" or "no longer relevant" - the two are deliberately
            indistinguishable. Exists only here, never in the administration's list.
        status:
          $ref: "#/components/schemas/ExternalAccessTokenStatus"
        libraries:
          type: array
          items:
            $ref: "#/components/schemas/ExternalAccessTokenLibraryResponse"

    OwnExternalAccessTokenListResponse:
      type: object
      required: [tokens]
      properties:
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/OwnExternalAccessTokenResponse"

    AdminExternalAccessTokenResponse:
      type: object
      required: [id, ownerUserId, ownerDisplayName, name, createdAt, expiresAt, status, libraries]
      description: >
        Deliberately without a usage date and without a usage count - see the operation's summary.
      properties:
        id:
          type: string
          format: uuid
        ownerUserId:
          type: string
          format: uuid
          description: The owner, so a Sperre je Person can be issued from this row.
        ownerDisplayName:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/ExternalAccessTokenStatus"
        libraries:
          type: array
          items:
            $ref: "#/components/schemas/ExternalAccessTokenLibraryResponse"

    AdminExternalAccessTokenListResponse:
      type: object
      required: [tokens]
      properties:
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/AdminExternalAccessTokenResponse"

    BlockExternalAccessTokensRequest:
      type: object
      required: [ownerUserId]
      properties:
        ownerUserId:
          type: string
          format: uuid

    BlockedExternalAccessTokensResponse:
      type: object
      required: [blocked]
      properties:
        blocked:
          type: integer
          description: How many still-active tokens were blocked by this call.
