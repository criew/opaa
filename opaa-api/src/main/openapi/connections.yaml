# Topic "connections": connection profiles ("Zugänge", ADR-0041) and their selection.
# Merged with all other fragments at build time, see root.yaml.
tags:
  - name: connection-profile
    description: Connection profiles ("Zugänge") the system administration sets per connector.
  - name: connected-account
    description: >
      A person's own connected accounts ("Verbundene Konten"): their own app password or token on
      a profile with the ownership PERSON. Only the person sees them; the administration sees
      numbers only.
  - name: outbound-proxy
    description: >
      The house-wide outbound proxy every HTTP(S) connection of the backend goes through, and its
      exclusion list.
  - name: connection-lifecycle
    description: >
      The installation-wide thresholds and periods of the connections: when a person's connections
      rest, when the private libraries of a deactivated person are erased and from how many expired
      accounts a profile warns.
paths:
  /api/v1/me/connected-accounts:
    get:
      operationId: listMyConnectedAccounts
      tags: [connected-account]
      summary: The caller's connected accounts and the profiles they may connect
      description: >
        Every existing connection of the caller, also on a profile no longer released to them
        (then with a notice naming who is in charge); the profiles with the ownership PERSON
        released to the caller and not locked, to connect anew; and who to ask when a profile is
        missing. Never carries a secret.
      responses:
        "200":
          description: The caller's connected accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectedAccountsOverview"

  /api/v1/me/connected-accounts/{profileId}:
    parameters:
      - name: profileId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: connectMyAccount
      tags: [connected-account]
      summary: Connect or reconnect the caller's account on a profile
      description: >
        Signs in at the profile's server with the given secret before storing it, encrypted (needs
        OPAA_CREDENTIALS_ENCRYPTION_KEY, else 503). A first connection needs the profile released
        to the caller; reconnecting an existing one does not, but neither goes on a locked profile.
        username belongs to the secret form USERNAME_AND_PASSWORD only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectedAccountConnectRequest"
      responses:
        "200":
          description: The connection as it stands now
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectedAccount"
        "400":
          description: >
            The request does not fit the profile's secret form, or the provider rejected the
            sign-in or could not be reached (the message says which).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: >
            A first connection on a profile not released to the caller (code
            CAPABILITY_REQUIRED), or the profile or its connector is locked (code
            CONNECTOR_LOCKED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            The profile was changed or removed while the caller signed in (code
            CONNECTED_ACCOUNT_PROFILE_CHANGED); nothing is stored, connect again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      operationId: disconnectMyAccount
      tags: [connected-account]
      summary: Disconnect the caller's account on a profile
      description: >
        Always possible, also without release and on a locked profile; the secret is deleted at
        once. A private library on the connection rests until the account is connected again.
      responses:
        "204":
          description: Disconnected
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/connections/authorizations:
    post:
      operationId: startConnectionAuthorization
      tags: [connected-account]
      summary: Start an OAuth consent at the provider of a profile
      description: >
        Returns the address the browser is sent to in the same tab: the authorization request of
        the profile's provider with a fresh state and a PKCE challenge (S256), returning to
        {OPAA_PUBLIC_BASE_URL}/connections/callback. State and verifier stay with the server, bound
        to the caller, the profile as it stands now and - for LIBRARY_RECONNECT - the library, for
        10 minutes and one completion. ACCOUNT needs what connecting an account needs;
        LIBRARY_NEW ("Quelle verbinden" before the library exists) the profile's release, as
        creating the library would; LIBRARY_RECONNECT MANAGER on the shared library connected
        through the profile and no lock, no release. Both library purposes need a profile and
        connector that let a library own an OAuth connection and serviceAccountConfirmed; without
        it no authorization request is made. A person starts at most 10 consents in 10 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionAuthorizationStartRequest"
      responses:
        "200":
          description: The authorization request to send the browser to
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionAuthorizationStartResponse"
        "400":
          description: >
            The profile does not sign in by OAuth or does not admit the purpose's owner, the
            library is private or not on the profile, libraryId is missing for LIBRARY_RECONNECT,
            the responsible does not manage the library, or a library purpose comes without
            serviceAccountConfirmed (code SERVICE_ACCOUNT_CONFIRMATION_REQUIRED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: >
            A first connection or a new library on a profile not released to the caller (code
            CAPABILITY_REQUIRED), the profile or its connector is locked (code CONNECTOR_LOCKED),
            or the caller does not manage the library.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            No public address is configured (OPAA_PUBLIC_BASE_URL), so the provider has nowhere to
            return to (code PUBLIC_BASE_URL_MISSING).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/connections/authorizations/complete:
    post:
      operationId: completeConnectionAuthorization
      tags: [connected-account]
      summary: Complete an OAuth consent with what the provider sent back
      description: >
        Called by the page /connections/callback with state and code, or state and error, as the
        provider returned them, and iss where it named one (RFC 9207). The state must be the caller's own, unused and not expired; it is
        used up by this call whatever its outcome. Whoever may connect is checked again as at the
        start. The server exchanges the code with the profile's client secret and the PKCE
        verifier, asks the connector for the account's address where it names one, and stores the
        tokens encrypted: for ACCOUNT as the caller's connected account, for LIBRARY_RECONNECT as
        the library's own connection, for LIBRARY_NEW as a pending connection only the caller can
        use for 60 minutes - for the folder selection and to create the library with
        (LibraryRequest.pendingConnectionId). Where the caller goes next it derives from the
        purpose. No answer carries a token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionAuthorizationCompleteRequest"
      responses:
        "200":
          description: The connection as it stands now
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionAuthorizationCompleteResponse"
        "400":
          description: >
            The provider refused or cancelled the consent, or the exchange of the code failed (the
            message says which); the response came from another authorization server than the
            consent started with, or did not name it where it must (code
            CONNECTION_AUTHORIZATION_ISSUER_MISMATCH) - nothing reached the provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: >
            The profile or its connector was locked, its release withdrawn, or the caller no longer
            manages the library, meanwhile (codes CONNECTOR_LOCKED, CAPABILITY_REQUIRED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The state is unknown, another person's, used up or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            The profile changed since the consent started (code
            CONNECTION_AUTHORIZATION_PROFILE_CHANGED); the library left the profile; or the
            provider named another account than the library was connected as and the start did
            not confirm the change (code ACCOUNT_CHANGED) - the fresh grant is revoked, start anew
            with confirmAccountChange.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/admin/source-connections/dormant:
    get:
      operationId: listDormantSourceConnections
      tags: [connection-profile]
      summary: The shared libraries whose own source connection rests (system admin only)
      description: >
        Every shared library of the caller's organization connected through a profile that signs
        in by OAuth ("Quelle verbinden"), or whose such connection lost its profile, while its
        source is not reached: expired, disconnected, locked or without profile. Private libraries
        never appear. No entry carries a token.
      responses:
        "200":
          description: The resting source connections, by library name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DormantSourceConnection"

  /api/v1/admin/connection-profiles:
    get:
      operationId: listConnectionProfiles
      tags: [connection-profile]
      summary: List every connection profile (system admin only)
      description: >
        Never carries a client secret - only clientSecretSet, whether one is stored.
      responses:
        "200":
          description: Every connection profile, by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConnectionProfileResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      operationId: createConnectionProfile
      tags: [connection-profile]
      summary: Create a connection profile (system admin only)
      description: >
        The connector of sourceType must admit profiles and offer authMethod with the requested
        ownership (see SourceTypeDescriptor.signIns). clientId, tenant and clientSecretExpiresOn belong only to a
        sign-in method with an app registration, scopes only to OAUTH and CLIENT_CREDENTIALS.
        A clientSecret given here is stored encrypted and needs the credentials encryption key
        (OPAA_CREDENTIALS_ENCRYPTION_KEY); without it the answer is 503.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionProfileCreateRequest"
      responses:
        "201":
          description: Connection profile created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionProfileResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Another profile already carries this name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/admin/connection-profiles/oauth-redirect:
    get:
      operationId: getConnectionRedirect
      tags: [connection-profile]
      summary: The redirect URI an OAuth app registration names (system admin only)
      description: >
        Exactly the address OPAA sends every provider back to after a consent,
        {OPAA_PUBLIC_BASE_URL}/connections/callback; absent while no public address is configured,
        and then no consent can start.
      responses:
        "200":
          description: The redirect URI, or none
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionRedirectResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/connection-profiles/{profileId}:
    parameters:
      - name: profileId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: getConnectionProfile
      tags: [connection-profile]
      summary: One connection profile (system admin only)
      responses:
        "200":
          description: The connection profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionProfileResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: updateConnectionProfile
      tags: [connection-profile]
      summary: Replace the editable fields of a connection profile (system admin only)
      description: >
        clientSecret follows the three-way convention of updateLlmModel: omitted keeps the stored
        secret, an empty string clears it, any other value replaces it - without touching any
        connection. A stored client secret never follows a tokenEndpoint or revocationEndpoint
        the profile names to another address: such a change without clientSecret is 400 with
        code CONNECTION_PROFILE_CLIENT_SECRET_REQUIRED, checked before anything else and before
        any confirmation; an empty clientSecret makes the profile a public client. A new
        authorizationEndpoint alone keeps the secret, which is never
        sent there.
        A new serverUrl, clientId, tenant, scope list, endpoint or authMethod discards every
        secret held under the profile; a library address under the old server address moves
        under the new one. While the change discards a stored secret of a library, ends
        connected accounts of persons or the whole sync state of libraries (a changed default
        only the profile sets), it needs confirmDiscard
        (otherwise 409 with code CONNECTION_PROFILE_CONFIRMATION_REQUIRED, whose error is the
        confirmation previewConnectionProfileChange names beforehand; it names the old and the
        new address of every endpoint the profile names that changes). The part of a library's
        sync state a new configuration makes invalid - also of a new TLS switch - its
        connector discards without that confirmation. The connector of a profile never changes.
        Every library whose effective configuration the change alters (address, TLS
        switch, defaults) passes its connector's check first; when the connector refuses one,
        nothing is changed - neither the profile nor any library - and the answer is 400 with
        code CONNECTION_PROFILE_CHANGE_REJECTED, whose message names only how many libraries
        and of which category; the reasons come only from previewConnectionProfileChange. A
        private library vetoes nothing: the connector's refusal of one, like a new ownership
        without persons, releases it from the profile, and it rests with ACCESS_REMOVED until
        its owner moves it. A change still needing confirmDiscard is refused with 409 before any
        connector is asked.
        An accepted change leaves the same audit entries and discards the
        same run state as a direct change of each library.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionProfileUpdateRequest"
      responses:
        "200":
          description: Connection profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionProfileResponse"
        "400":
          description: >
            Invalid values, a library the connector refuses the change for (code
            CONNECTION_PROFILE_CHANGE_REJECTED), an endpoint the profile names that is not https,
            or a new tokenEndpoint or revocationEndpoint without a new client secret while
            one is stored (code
            CONNECTION_PROFILE_CLIENT_SECRET_REQUIRED, the error naming the old and the new
            endpoint).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            The name is taken, or the change would discard secrets of existing connections or
            the run state of their libraries and confirmDiscard is not set (code
            CONNECTION_PROFILE_CONFIRMATION_REQUIRED), or it would discard the run state of a
            library while it runs (code CONNECTION_PROFILE_RUN_IN_PROGRESS).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

    delete:
      operationId: deleteConnectionProfile
      tags: [connection-profile]
      summary: Delete a connection profile (system admin only)
      description: >
        Every connection of the profile loses its secret. Its libraries stay with their content
        and the note "Zugang entfernt" and run no more until they are connected through another
        profile of the same connector or deleted.
      responses:
        "204":
          description: Connection profile deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/connection-profiles/{profileId}/impact:
    parameters:
      - name: profileId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: getConnectionProfileImpact
      tags: [connection-profile]
      summary: What a change, a shutdown or a deletion of the profile would cut off (system admin only)
      description: Without a proposed change no connector is asked, so rejections stay empty.
      responses:
        "200":
          description: The connections and libraries on the profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionProfileImpactResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      operationId: previewConnectionProfileChange
      tags: [connection-profile]
      summary: What a proposed change of the profile would affect and which connector refuses it (system admin only)
      description: >
        Takes the body of updateConnectionProfile and changes nothing. Besides the counts of
        getConnectionProfileImpact it names every library whose connector refuses the
        configuration the change would give it - the refusals that make
        updateConnectionProfile answer 400 CONNECTION_PROFILE_CHANGE_REJECTED - and what saving
        discards, from the same plan the save carries out: secretsDiscarded,
        configurationsChanged, connectedAccountsEnded, fullSyncLibraries and the confirmation it
        asks for. clientSecret is ignored but for a service account key naming another account;
        confirmDiscard is ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionProfileUpdateRequest"
      responses:
        "200":
          description: The connections and libraries on the profile and the refusals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionProfileImpactResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Another profile already carries the proposed name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/connection-profiles/{profileId}/disconnect-all:
    post:
      operationId: disconnectAllConnectionProfileConnections
      tags: [connection-profile]
      summary: Emergency shutdown "Alle Verbindungen trennen" (system admin only)
      description: >
        Discards every secret held under the profile at once and keeps the profile. Its libraries
        stop running until their secret is entered again. For CLIENT_CREDENTIALS and
        SERVICE_ACCOUNT_KEY that is the profile's own client secret or key, deleted for good and
        noted in the audit entry; it is not revoked at the provider.
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The connections that were cut off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionProfileImpactResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/connection-profiles/{profileId}/test-sign-in:
    post:
      operationId: testConnectionProfileSignIn
      tags: [connection-profile]
      summary: Sign in with the profile's own registration once (system admin only)
      description: >
        For CLIENT_CREDENTIALS and SERVICE_ACCOUNT_KEY: obtains an access token at the token
        endpoint the connector declares, past any token held. Success lifts signInRejected; a
        rejection of the registration sets it. Either outcome is an audit entry
        (CONNECTION_PROFILE_SIGN_IN_TESTED). The message never carries secret, key or token.
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The outcome of the sign-in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionProfileSignInTestResponse"
        "400":
          description: The profile does not sign in itself.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/connection-profiles/{profileId}/lock:
    put:
      operationId: lockConnectionProfile
      tags: [connection-profile]
      summary: Lock or unlock a connection profile (system admin only)
      description: >
        A locked profile admits no new library and no new connection, and the runs of its
        libraries stop; a run already going ends regularly. The content stays searchable and
        carries the note "Gesperrt". Unlocking lets the libraries run again without being set up
        anew. A governance event either way (CONNECTOR_LOCKED, CONNECTOR_UNLOCKED).
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectorLockRequest"
      responses:
        "200":
          description: The profile with its new lock state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionProfileResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/outbound-proxy:
    get:
      operationId: getOutboundProxy
      tags: [outbound-proxy]
      summary: Read the outbound proxy (system admin only)
      description: >
        The house-wide outbound proxy and its exclusion list. Without a proxy every connection goes
        direct; the JVM proxy properties and HTTP(S)_PROXY are never consulted. Loopback targets
        and every scheme other than http/https (SMB, SMTP, the database) are always direct.
      responses:
        "200":
          description: The stored settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboundProxyResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

    put:
      operationId: updateOutboundProxy
      tags: [outbound-proxy]
      summary: Replace the outbound proxy (system admin only)
      description: >
        proxyUrl is http://host:port or host:port - no https, no SOCKS, no user information, no
        path; null or blank removes the proxy. noProxy lists host names (matching the host and
        every subdomain; a leading "." or "*." is dropped), IP literals and CIDR ranges (matching
        IP literals only, never resolved through DNS); "*", ports and whitespace are refused. Case
        and a trailing dot do not matter. Bounds: proxyUrl at most 300 characters, at most 100
        noProxy entries of at most 253 characters each. Every bound is checked in the domain
        service, so a violation answers 400 with German fieldErrors naming proxyUrl or noProxy.
        The exclusion list is not the target allowlist (OPAA_INDEXING_TARGET_VALIDATION_ALLOWLIST):
        an excluded target is still checked. Audited as OUTBOUND_PROXY_CHANGED with before and
        after; the new route applies to connections opened after the change committed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutboundProxyRequest"
      responses:
        "200":
          description: The stored settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboundProxyResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/connection-lifecycle-settings:
    get:
      operationId: getConnectionLifecycleSettings
      tags: [connection-lifecycle]
      summary: Read the thresholds and periods of the connections (system admin only)
      description: >
        Every setting with the value in force, its factory default, its bounds and whether the
        administration set its own value. Every run and every request reads the value from the
        database, so a change holds on every instance from the next decision on.
      responses:
        "200":
          description: The settings in force
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionLifecycleSettingsResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/connection-lifecycle-settings/{setting}:
    parameters:
      - name: setting
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ConnectionLifecycleSettingKey"
    put:
      operationId: updateConnectionLifecycleSetting
      tags: [connection-lifecycle]
      summary: Set one threshold or period of the connections (system admin only)
      description: >
        value null returns to the factory default. Bounds: INACTIVITY_THRESHOLD_DAYS 30 to 365,
        PRIVATE_LIBRARY_DELETION_DAYS 1 to 90, EXPIRED_CONNECTION_WARNING_THRESHOLD 1 to 1000; a
        value outside answers 400. Audited as CONNECTION_LIFECYCLE_SETTING_CHANGED with before and
        after; a value equal to the one in force writes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionLifecycleSettingRequest"
      responses:
        "200":
          description: The setting in force after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionLifecycleSettingResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/mcp-servers:
    get:
      operationId: listMcpServers
      tags: [connection-profile]
      summary: List every MCP server profile (system admin only)
      description: >
        Profiles of the kind MCP server (ADR-0041, Entscheidung 5): no connector, an address of a
        Streamable HTTP endpoint, OAuth with a resource indicator per server. The kind stays hidden
        in the user interface until the MCP client exists; the connection-profile operations do not
        show these profiles. Never carries a client secret or a token.
      responses:
        "200":
          description: Every MCP server profile, by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/McpServerResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      operationId: createMcpServer
      tags: [connection-profile]
      summary: Create an MCP server profile (system admin only)
      description: >
        OPAA discovers the authorization server first: the Protected Resource Metadata (RFC 9728)
        of serverUrl, then the authorization server's metadata (RFC 8414, else OpenID discovery).
        The resource there must be serverUrl, the issuer the address the metadata was read from,
        PKCE must offer S256, every endpoint must be https; anything else is 400. The discovered
        endpoints are stored and never discovered again at run time. Without scopes the scopes the
        server names as supported are taken. A clientSecret is stored encrypted and needs the
        credentials encryption key (OPAA_CREDENTIALS_ENCRYPTION_KEY); without it the answer is 503.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpServerRequest"
      responses:
        "201":
          description: MCP server profile created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpServerResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Another profile already carries this name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/admin/mcp-servers/{profileId}:
    parameters:
      - name: profileId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: getMcpServer
      tags: [connection-profile]
      summary: One MCP server profile (system admin only)
      responses:
        "200":
          description: The MCP server profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpServerResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: updateMcpServer
      tags: [connection-profile]
      summary: Change an MCP server profile (system admin only)
      description: >
        Replaces every field; the authorization server is discovered anew as on creation. A
        clientSecret omitted keeps the stored one, an empty one clears it. A new serverUrl,
        clientId, scope list, issuer or endpoint discards every token of the profile - revoked
        with the registration before the change - and ends the persons' connections; that is
        refused with 409 CONNECTION_PROFILE_CONFIRMATION_REQUIRED unless confirmDiscard is true.
        The question names persons without a number, and the old and the new authorization server
        where it changes. A stored client secret never follows a new serverUrl, issuer or token
        endpoint: such a change without clientSecret is 400 MCP_SERVER_CLIENT_SECRET_REQUIRED;
        an empty clientSecret makes the profile a public client.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpServerRequest"
      responses:
        "200":
          description: The changed MCP server profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpServerResponse"
        "400":
          description: >
            Invalid values, a discovery refused, or a change to another server or authorization
            server without a new client secret (code MCP_SERVER_CLIENT_SECRET_REQUIRED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            Another profile already carries this name, or the change discards tokens and was not
            confirmed (code CONNECTION_PROFILE_CONFIRMATION_REQUIRED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

    delete:
      operationId: deleteMcpServer
      tags: [connection-profile]
      summary: Delete an MCP server profile (system admin only)
      description: >
        Every token on the profile is discarded and revoked, every connection ends and is logged.
      responses:
        "204":
          description: MCP server profile deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/mcp-servers/{profileId}/disconnect-all:
    post:
      operationId: disconnectAllMcpServerConnections
      tags: [connection-profile]
      summary: Emergency shutdown of an MCP server profile (system admin only)
      description: >
        Discards and revokes every token of the profile at once and keeps the profile; every
        connection ends and is logged.
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The persons' connections that were ended, masked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpServerShutdownResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/mcp-servers/{profileId}/lock:
    put:
      operationId: lockMcpServer
      tags: [connection-profile]
      summary: Lock or unlock an MCP server profile (system admin only)
      description: >
        A locked MCP server admits no new connection and hands out no token; the connections stay.
        A governance event either way (CONNECTOR_LOCKED, CONNECTOR_UNLOCKED).
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectorLockRequest"
      responses:
        "200":
          description: The MCP server profile with its new lock state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpServerResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/connector-types:
    get:
      operationId: listConnectorTypeStates
      tags: [connection-profile]
      summary: The lock state of every connector type (system admin only)
      description: >
        One entry per registered connector except the upload, which reaches no source.
      responses:
        "200":
          description: Every connector type, by type key
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConnectorTypeStateResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/connector-types/{sourceType}/lock:
    put:
      operationId: lockConnectorType
      tags: [connection-profile]
      summary: Lock or unlock a connector type (system admin only)
      description: >
        Like lockConnectionProfile, for every library of the type - with or without a profile.
      parameters:
        - name: sourceType
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/SourceTypeKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectorLockRequest"
      responses:
        "200":
          description: The connector type with its new lock state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorTypeStateResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/connector-types/{sourceType}/profile-requirement:
    parameters:
      - name: sourceType
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/SourceTypeKey"

    get:
      operationId: getConnectorProfileRequirement
      tags: [connection-profile]
      summary: The profile requirement of a connector type and what switching it on affects (system admin only)
      description: >
        Whether the type may be made usable only through connection profiles ("Nur über
        Zugänge") and why not, the libraries of the type with their own address, and what the
        requirement does not cover for this type.
      responses:
        "200":
          description: The profile requirement of the type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorProfileRequirementResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

    put:
      operationId: setConnectorProfileRequirement
      tags: [connection-profile]
      summary: Switch the profile requirement of a connector type on or off (system admin only)
      description: >
        Switched on, no library of the type is created, tested or listed with its own address,
        none is released from its profile, and a library with its own address keeps that
        address. ownAddressStock decides for every such library whether it runs on (RUNS) or is
        locked until it is connected through a profile (LOCKED); sending it again while the
        requirement holds changes that choice. Switched off, every such lock is lifted. Only a
        type that declares profiles as optional may be switched (otherwise 400), and only on
        while at least one unlocked profile of the type admits libraries (otherwise 409 with
        code PROFILE_REQUIREMENT_NEEDS_PROFILE). A governance event either way
        (CONNECTOR_PROFILE_REQUIRED, CONNECTOR_PROFILE_OPTIONAL).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectorProfileRequirementRequest"
      responses:
        "200":
          description: The connector type with its new profile requirement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorTypeStateResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: >
            No unlocked profile of the type admits libraries (code
            PROFILE_REQUIREMENT_NEEDS_PROFILE).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/connection-profiles:
    get:
      operationId: listConnectionProfileOptions
      tags: [connection-profile]
      summary: The profiles a library of one source type may be connected through
      description: >
        Every profile whose ownership admits libraries and that the caller may create a library
        through now, by name, without anything of the app registration. A profile not released to
        the caller or locked, or of a locked connector type, is not listed; the system
        administration sees every profile in listConnectionProfiles. A profile with the ownership
        PERSON is listed only where the caller
        has a connected account of her own on it - for her private library; without libraryId,
        and with the libraryId of her private library. Each names its ownership and whether the
        caller has an account on it. Without libraryId it needs the capability CREATE_CONNECTOR_LIBRARY in
        at least one scope. With libraryId it needs AssetRole.MANAGER on that library instead
        (403 without it, 404 for a library the caller cannot see), and sourceType must be the
        library's (400): its managers choose the profile to connect it through among the profiles
        released to them.
      parameters:
        - name: sourceType
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/SourceTypeKey"
        - name: libraryId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The selectable profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConnectionProfileOption"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  schemas:
    ConnectionProfileSupport:
      type: string
      description: >
        How a connector stands to connection profiles ("Profilangabe"): FORBIDDEN (no remote
        target), OPTIONAL (profile or own address), REQUIRED (only with a profile).
      enum: [FORBIDDEN, OPTIONAL, REQUIRED]

    ConnectionAuthMethod:
      type: string
      description: >
        How a connection signs in: NONE (anonymous), PERSONAL_SECRET (app password, token or user
        name and password), OAUTH, CLIENT_CREDENTIALS, SERVICE_ACCOUNT_KEY.
      enum: [NONE, PERSONAL_SECRET, OAUTH, CLIENT_CREDENTIALS, SERVICE_ACCOUNT_KEY]

    ConnectionOwnership:
      type: string
      description: Which connections a profile admits ("Besitzart").
      enum: [LIBRARY, PERSON, BOTH]

    SourceTypeSignIn:
      type: object
      required: [method, ownerships]
      description: >
        One sign-in method a connector offers. A profile choosing it may take the ownership
        LIBRARY or PERSON when listed here, BOTH when both are.
      properties:
        method:
          $ref: "#/components/schemas/ConnectionAuthMethod"
        ownerships:
          type: array
          description: LIBRARY, PERSON or both; never BOTH itself.
          items:
            $ref: "#/components/schemas/ConnectionOwnership"
        secretForm:
          description: Set exactly for the method PERSONAL_SECRET.
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PersonalSecretForm"
        profileEndpoints:
          description: >
            For OAUTH and CLIENT_CREDENTIALS, which endpoints of the authorization server the
            connector leaves to the profile (then required there); absent where it fixes them all.
          nullable: true
          allOf:
            - $ref: "#/components/schemas/SignInProfileEndpoints"
        defaultScopes:
          type: string
          nullable: true
          description: >
            For OAUTH and CLIENT_CREDENTIALS, the scopes asked for where the profile names none.
          example: Files.Read offline_access

    SignInProfileEndpoints:
      type: object
      required: [authorization, token, revocation]
      description: Which endpoints a profile names itself (authorizationEndpoint and so on).
      properties:
        authorization:
          type: boolean
        token:
          type: boolean
        revocation:
          type: boolean

    PersonalSecretForm:
      type: string
      description: >
        The form in which a connector takes a personal secret: TOKEN (one token or app
        password) or USERNAME_AND_PASSWORD.
      enum: [TOKEN, USERNAME_AND_PASSWORD]

    ProfileDefaultKind:
      type: string
      description: >
        The kind of value a profile default takes: TEXT (a line of text), BOOLEAN (true or
        false), CHOICE (one of choices).
      enum: [TEXT, BOOLEAN, CHOICE]

    ProfileDefaultKey:
      type: object
      required: [key, label, kind, choices]
      description: One connector settings key a connection profile may set.
      properties:
        key:
          type: string
          description: The key in connectorSettings, a key of the connector's own settings.
          example: edition
        label:
          type: string
          description: German label of the field.
          example: Edition
        kind:
          $ref: "#/components/schemas/ProfileDefaultKind"
        choices:
          type: array
          description: The values a CHOICE takes, in display order; empty for any other kind.
          items:
            type: string
        profileOnly:
          type: boolean
          description: >
            Whether only the profile sets this key: a library on a profile never carries it, also
            where the profile leaves it empty (then a value of the library is a 400). Google
            Drive's imitated account (subject) is one.

    ServerAddressRule:
      type: object
      required: [schemes]
      description: >
        What a profile's serverUrl may be: an address with one of schemes, or exactly fixed.
        With fixed set, schemes is empty and the form asks for no address.
      properties:
        schemes:
          type: array
          items:
            type: string
          example: [https, http]
        fixed:
          type: string
          nullable: true
          description: The one address every profile of the type carries.

    ConnectionProfileCreateRequest:
      type: object
      required: [sourceType, name, serverUrl, authMethod, ownership]
      properties:
        sourceType:
          $ref: "#/components/schemas/SourceTypeKey"
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: Zugang Nextcloud intern
        serverUrl:
          type: string
          maxLength: 2000
          description: >
            The only target of the profile's secrets - with a scheme the connector admits
            (SourceTypeDescriptor.serverAddress), without user info, query or fragment. Stored
            without a trailing slash. For a type with a fixed address, empty or that address.
          example: https://cloud.example.org
        authMethod:
          $ref: "#/components/schemas/ConnectionAuthMethod"
        ownership:
          $ref: "#/components/schemas/ConnectionOwnership"
        clientId:
          type: string
          maxLength: 255
          nullable: true
          description: >
            Not taken for SERVICE_ACCOUNT_KEY: there the client id is the client_email of the key.
        clientSecret:
          type: string
          maxLength: 4096
          nullable: true
          description: >
            Write-only; never returned (see clientSecretSet). For SERVICE_ACCOUNT_KEY the JSON key
            file of the service account; only client_email, private_key_id and private_key are
            kept, and a key naming another client_email is a change of the registration.
        clientSecretExpiresOn:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
          nullable: true
          description: An ISO date (YYYY-MM-DD); OPAA warns 14 days before it.
          example: "2027-03-31"
        tenant:
          type: string
          maxLength: 255
          nullable: true
        scopes:
          type: string
          maxLength: 2000
          nullable: true
          example: Files.Read offline_access
        authorizationEndpoint:
          type: string
          maxLength: 2000
          nullable: true
          description: >
            Only where the connector's OAuth sign-in leaves its endpoints to the profile
            (SourceTypeSignIn); then required, an absolute https address (400 for http, as for
            every endpoint the profile names: the person signs in there). A change is a change of
            the registration.
        tokenEndpoint:
          type: string
          maxLength: 2000
          nullable: true
          description: >
            As authorizationEndpoint, for the token endpoint, which receives refresh tokens and
            the client secret.
        revocationEndpoint:
          type: string
          maxLength: 2000
          nullable: true
          description: >
            As authorizationEndpoint, for the token revocation (RFC 7009), which receives tokens
            and the client secret.
        connectorSettings:
          type: object
          additionalProperties: true
          nullable: true
          description: >
            Connector defaults: only keys the connector names in
            SourceTypeDescriptor.profileDefaults, each of its kind; another key is a 400. They
            override a library's settings key by key. Never a secret.

    ConnectionProfileUpdateRequest:
      type: object
      required: [name, serverUrl, authMethod, ownership]
      description: The connector of a profile never changes, so sourceType is not part of it.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: Zugang Nextcloud intern
        serverUrl:
          type: string
          maxLength: 2000
          description: >
            The only target of the profile's secrets - with a scheme the connector admits
            (SourceTypeDescriptor.serverAddress), without user info, query or fragment. Stored
            without a trailing slash. For a type with a fixed address, empty or that address.
          example: https://cloud.example.org
        authMethod:
          $ref: "#/components/schemas/ConnectionAuthMethod"
        ownership:
          $ref: "#/components/schemas/ConnectionOwnership"
        clientId:
          type: string
          maxLength: 255
          nullable: true
          description: >
            Not taken for SERVICE_ACCOUNT_KEY: there the client id is the client_email of the key.
        clientSecret:
          type: string
          maxLength: 4096
          nullable: true
          description: >
            Write-only; never returned (see clientSecretSet). For SERVICE_ACCOUNT_KEY the JSON key
            file of the service account; only client_email, private_key_id and private_key are
            kept, and a key naming another client_email is a change of the registration. Required
            when the change moves tokenEndpoint or revocationEndpoint while a secret is stored (an
            empty one for a public client).
        clientSecretExpiresOn:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
          nullable: true
          description: An ISO date (YYYY-MM-DD); OPAA warns 14 days before it.
          example: "2027-03-31"
        tenant:
          type: string
          maxLength: 255
          nullable: true
        scopes:
          type: string
          maxLength: 2000
          nullable: true
          example: Files.Read offline_access
        authorizationEndpoint:
          type: string
          maxLength: 2000
          nullable: true
          description: >
            Only where the connector's OAuth sign-in leaves its endpoints to the profile
            (SourceTypeSignIn); then required, an absolute https address (400 for http, as for
            every endpoint the profile names: the person signs in there). A change is a change of
            the registration.
        tokenEndpoint:
          type: string
          maxLength: 2000
          nullable: true
          description: >
            As authorizationEndpoint, for the token endpoint, which receives refresh tokens and
            the client secret; a stored secret does not follow a change.
        revocationEndpoint:
          type: string
          maxLength: 2000
          nullable: true
          description: >
            As authorizationEndpoint, for the token revocation (RFC 7009), which receives tokens
            and the client secret; a stored secret does not follow a change.
        connectorSettings:
          type: object
          additionalProperties: true
          nullable: true
          description: >
            Connector defaults: only keys the connector names in
            SourceTypeDescriptor.profileDefaults, each of its kind; another key is a 400. They
            override a library's settings key by key. Never a secret.
        confirmDiscard:
          type: boolean
          description: >
            Confirms that a change of serverUrl, clientId, tenant, scopes, an endpoint or
            authMethod discards
            the secrets of the existing connections, and that a changed default only the profile
            sets (ProfileDefaultKey.profileOnly) discards the run state of every library on it.

    ConnectionProfileResponse:
      type: object
      required:
        [
          id,
          name,
          sourceType,
          serverUrl,
          authMethod,
          ownership,
          clientSecretSet,
          clientSecretExpiresSoon,
          signInRejected,
          connectionCount,
          connectedAccountCount,
          expiredConnectionWarning,
          locked,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        sourceType:
          $ref: "#/components/schemas/SourceTypeKey"
        serverUrl:
          type: string
        authMethod:
          $ref: "#/components/schemas/ConnectionAuthMethod"
        ownership:
          $ref: "#/components/schemas/ConnectionOwnership"
        clientId:
          type: string
          nullable: true
        clientSecretSet:
          type: boolean
          description: Whether a client secret is stored; its value is never returned.
        clientSecretExpiresOn:
          type: string
          nullable: true
          description: An ISO date (YYYY-MM-DD).
        clientSecretExpiresSoon:
          type: boolean
          description: Whether the client secret expires within 14 days or has expired.
        signInRejected:
          type: boolean
          description: >
            Whether the provider rejected the profile's own sign-in (CLIENT_CREDENTIALS,
            SERVICE_ACCOUNT_KEY): every library on it is blocked as EXPIRED, and no run asks the
            provider again until a new clientSecret or testConnectionProfileSignIn lifts it.
        tenant:
          type: string
          nullable: true
        scopes:
          type: string
          nullable: true
        authorizationEndpoint:
          type: string
          nullable: true
        tokenEndpoint:
          type: string
          nullable: true
        revocationEndpoint:
          type: string
          nullable: true
        connectorSettings:
          type: object
          additionalProperties: true
          nullable: true
        connectionCount:
          type: integer
          format: int64
          description: >
            The connections of libraries on this profile; private libraries are not counted -
            they would tell that a person is connected.
        connectedAccountCount:
          description: The persons' connections on this profile, connected or expired.
          allOf:
            - $ref: "#/components/schemas/PersonCount"
        expiredConnectionCount:
          description: >
            The expired among them; exact only where they and the connected each reach the minimum
            group size, none counting as few. Otherwise "fewer than" below that size and absent
            from it on - and absent for every split on a total below twice the size minus one -
            so on one total no connected and a few connected answer alike, and so do no expired
            and a few expired.
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PersonCount"
        expiredConnectionWarning:
          type: boolean
          description: >
            Whether the expired connections may reach the installation's warning threshold:
            true as soon as expiredConnectionCount and connectedAccountCount as returned admit it,
            so it tells nothing they do not. Certain only where expiredConnectionCount is exact;
            otherwise the threshold is possibly reached (more false alarms, no disclosure).
            Always false on a profile whose ownership admits no persons.
        locked:
          type: boolean
          description: Whether the profile is locked (see lockConnectionProfile).
        lockedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ConnectionRedirectResponse:
      type: object
      properties:
        redirectUri:
          type: string
          nullable: true
          description: Absent while OPAA_PUBLIC_BASE_URL is not set.
          example: https://opaa.example.org/connections/callback

    ConnectionProfileSignInTestResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
        message:
          type: string
          description: German outcome, naming the cause of a failure.
          example: Anmeldung erfolgreich.

    ConnectionProfileImpactResponse:
      type: object
      required:
        [connections, libraries, connectedAccounts, lastForProfileRequirement, rejectedLibraries, rejections]
      properties:
        connections:
          type: integer
          format: int64
          description: The connections of libraries on the profile, private libraries not counted.
        libraries:
          type: integer
          format: int64
          description: The libraries behind them, private libraries not counted.
        connectedAccounts:
          $ref: "#/components/schemas/PersonCount"
        fullSyncLibraries:
          type: integer
          format: int64
          description: >
            How many shared libraries the proposed change makes read their source anew, because a
            default only the profile sets changes; 0 without a proposal. Private libraries are
            reset alike but not counted.
        connectionsDiscarded:
          type: integer
          format: int64
          description: >
            How many connections of shared libraries lose every secret and token held under the
            profile when the proposed change is saved - a new address or registration revokes them
            with the old registration - and must be signed in anew; 0 for any other change and
            without a proposal. Private libraries are not counted.
        secretsDiscarded:
          type: integer
          format: int64
          description: >
            How many shared libraries lose the secret stored for them when the proposed change is
            saved - a new address or registration, or a default that binds the secret anew - and
            need it entered anew; 0 without a proposal. Libraries without a stored secret and
            private libraries are not counted; the persons' secrets end with their connected
            accounts (connectedAccountsEnded).
        configurationsChanged:
          type: integer
          format: int64
          description: >
            How many shared libraries the proposed change gives another effective configuration
            (address, certificate check, defaults); each one's connector discards the part
            of its sync state the new configuration makes invalid. That alone asks no
            confirmation; the whole sync state goes only with fullSyncLibraries. 0 without a
            proposal; private libraries are not counted.
        connectedAccountsEnded:
          description: >
            The connected accounts of persons the proposed change ends - all of the profile's,
            masked like connectedAccounts and never a different number - or absent where it ends
            none: a new address or registration, a default that binds the secret anew, or an
            ownership no longer admitting persons. Absent without a proposal.
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PersonCount"
        confirmation:
          type: string
          nullable: true
          description: >
            The question saving the proposed change asks before it discards anything, word for
            word the error of the 409 CONNECTION_PROFILE_CONFIRMATION_REQUIRED of updateConnectionProfile;
            absent where saving asks none. It names persons without a number, and the old and the
            new address of every endpoint the profile names that changes.
        rejectedLibraries:
          type: integer
          format: int64
          description: >
            How many shared libraries the connector refuses the proposed change for; 0 without a
            proposal (getConnectionProfileImpact). Private libraries are counted in
            rejectedPrivateLibraries only.
        rejectedPrivateLibraries:
          description: >
            How many private libraries the proposed change releases from the profile - those the
            connector refuses it for, or every one where the new ownership admits no persons -
            masked by
            their owners like every number about persons: below the minimum group size of owners
            - zero included - only "fewer than". As a part of the private libraries of each
            organization it touches (a profile has none of its own) it is exact only where, in
            every one of them, its owners and the owners of the other private libraries each reach
            that size, none counting as few; otherwise, from that size on, it is absent. A refusal of a
            private library is no veto - the change goes through, and the library rests with the
            reason ACCESS_REMOVED until its owner moves it to another profile. Absent as well
            without a proposal and on a profile not admitting persons.
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PersonCount"
        rejections:
          type: array
          description: >
            Why, one entry per refused shared library; empty without a proposal. A private
            library appears with neither its id nor the connector's reason.
          items:
            $ref: "#/components/schemas/ConnectionProfileChangeRejection"
        lastForProfileRequirement:
          type: boolean
          description: >
            Whether the profile is the last unlocked one admitting libraries of a connector type
            that is usable only through profiles: without it, no new library of the type can be
            created until another profile exists. Deleting or locking it stays possible.

    McpServerRequest:
      type: object
      required: [name, serverUrl, clientId, responsibleGroupId]
      properties:
        name:
          type: string
          maxLength: 255
          example: MCP-Server Fachverfahren
        serverUrl:
          type: string
          maxLength: 2000
          description: >
            The Streamable HTTP endpoint of the MCP server, https only; stored in canonical form
            and the resource every token of the profile is issued for (RFC 8707).
          example: https://mcp.example.org/mcp
        clientId:
          type: string
          maxLength: 255
          description: The client id OPAA is registered with at the server's authorization server.
        clientSecret:
          type: string
          maxLength: 4096
          nullable: true
          description: >
            Write-only; omitted for a public client, and on a change omitted to keep the stored
            one, empty to clear it.
        scopes:
          type: string
          maxLength: 2000
          nullable: true
          description: Space-separated; omitted for the scopes the server names as supported.
        responsibleGroupId:
          type: string
          format: uuid
          description: The group of the organization that answers for the MCP server.
        confirmDiscard:
          type: boolean
          nullable: true
          description: On a change, confirms that it discards every token of the profile.

    McpServerResponse:
      type: object
      required:
        [id, name, serverUrl, authMethod, clientId, clientSecretSet, issuer, authorizationEndpoint,
         tokenEndpoint, locked, connectedAccounts, createdAt, updatedAt]
      description: An MCP server profile; never a client secret or a token.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        serverUrl:
          type: string
          description: The canonical address, the resource indicator of its tokens.
        authMethod:
          $ref: "#/components/schemas/ConnectionAuthMethod"
        clientId:
          type: string
        clientSecretSet:
          type: boolean
        scopes:
          type: string
          nullable: true
        responsibleGroupId:
          type: string
          format: uuid
          nullable: true
          description: Absent once the group was deleted.
        issuer:
          type: string
          description: The authorization server as discovered on the last save.
        authorizationEndpoint:
          type: string
        tokenEndpoint:
          type: string
        revocationEndpoint:
          type: string
          nullable: true
        locked:
          type: boolean
        lockedAt:
          type: string
          format: date-time
          nullable: true
        connectedAccounts:
          description: The persons' connections to the server, masked.
          allOf:
            - $ref: "#/components/schemas/PersonCount"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    McpServerShutdownResponse:
      type: object
      required: [connectedAccounts]
      properties:
        connectedAccounts:
          description: The persons' connections that were ended, masked.
          allOf:
            - $ref: "#/components/schemas/PersonCount"

    PersonCount:
      type: object
      description: >
        A number of persons' connections as the administration sees it: exact from the minimum
        group size on, below it - zero included - only "fewer than" (fewerThan); a part is exact
        only where the total is and neither it nor its complement lies below that size. Every answer of the
        administration counts the same way, so no difference of two answers points at a person.
        Exactly one of the two is set.
      properties:
        count:
          type: integer
          format: int64
          nullable: true
        fewerThan:
          type: integer
          format: int32
          nullable: true
          example: 5

    ConnectionAuthorizationPurpose:
      type: string
      description: >
        What an OAuth consent is for: ACCOUNT (the caller's own connected account), LIBRARY_NEW
        (the source of a library not created yet, "Quelle verbinden" in the wizard) and
        LIBRARY_RECONNECT (the source of an existing library, "Neu verbinden").
      enum: [LIBRARY_NEW, LIBRARY_RECONNECT, ACCOUNT]

    ConnectionAuthorizationStartRequest:
      type: object
      required: [profileId, purpose]
      properties:
        profileId:
          type: string
          format: uuid
        purpose:
          $ref: "#/components/schemas/ConnectionAuthorizationPurpose"
        libraryId:
          type: string
          format: uuid
          nullable: true
          description: The library to connect anew; required for LIBRARY_RECONNECT, read only there.
        serviceAccountConfirmed:
          type: boolean
          nullable: true
          description: >
            "Ich verbinde ein Dienstkonto, kein persönliches Konto" - required to be true for
            LIBRARY_NEW and LIBRARY_RECONNECT.
        responsible:
          nullable: true
          description: >
            Only for LIBRARY_RECONNECT: who answers for the connection from now on, a person or
            group managing the library; absent keeps the one named so far. A new library names it
            with LibraryRequest.sourceConnectionResponsible.
          allOf:
            - $ref: "#/components/schemas/SourceConnectionResponsibleRef"
        confirmAccountChange:
          type: boolean
          nullable: true
          description: >
            Only for LIBRARY_RECONNECT: the caller accepts that the provider names another account
            than the library was connected as; its run state is then discarded.

    SourceConnectionResponsibleType:
      type: string
      description: Whether a person (USER) or a group (GROUP) answers for a library's connection.
      enum: [USER, GROUP]

    SourceConnectionResponsibleRef:
      type: object
      required: [type, id]
      description: >
        Who answers for a library's own source connection: warned before it ends, told when it
        ended, and able to connect it anew - a person or group managing the library.
      properties:
        type:
          $ref: "#/components/schemas/SourceConnectionResponsibleType"
        id:
          type: string
          format: uuid

    SourceConnectionResponsible:
      type: object
      required: [type, id]
      properties:
        type:
          $ref: "#/components/schemas/SourceConnectionResponsibleType"
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
          description: Display name of the person or group; null where it cannot be named.

    PendingSourceConnection:
      type: object
      required: [id, expiresAt]
      description: >
        A source connection given before its library exists: only the caller can use it, for
        the folder selection and to create the library with, until expiresAt.
      properties:
        id:
          type: string
          format: uuid
        accountLabel:
          type: string
          nullable: true
          description: The account at the provider, where the connector names it.
        expiresAt:
          type: string
          format: date-time

    DormantSourceConnection:
      type: object
      required: [libraryId, libraryName, reason]
      properties:
        libraryId:
          type: string
          format: uuid
        libraryName:
          type: string
        profileId:
          type: string
          format: uuid
          nullable: true
          description: Null once the profile was deleted.
        profileName:
          type: string
          nullable: true
        accountLabel:
          type: string
          nullable: true
        reason:
          $ref: "#/components/schemas/SourceBlockReason"
        endedCause:
          nullable: true
          description: Why the connection ended, where it ended; null for a lock alone.
          allOf:
            - $ref: "#/components/schemas/ConnectionEndCause"
        endedAt:
          type: string
          format: date-time
          nullable: true
        responsible:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/SourceConnectionResponsible"

    ConnectionAuthorizationStartResponse:
      type: object
      required: [authorizationUrl, expiresAt]
      properties:
        authorizationUrl:
          type: string
          description: The provider's authorization request; the browser goes there in the same tab.
        expiresAt:
          type: string
          format: date-time
          description: Until when the consent can be completed.

    ConnectionAuthorizationCompleteRequest:
      type: object
      required: [state]
      description: What the provider sent back to /connections/callback, passed on unchanged.
      properties:
        state:
          type: string
          minLength: 1
          maxLength: 512
        code:
          type: string
          maxLength: 4096
          nullable: true
        error:
          type: string
          maxLength: 256
          nullable: true
          description: The provider's error code (RFC 6749, 4.1.2.1) where it refused or cancelled.
        iss:
          type: string
          maxLength: 2000
          nullable: true
          description: >
            The issuer the provider named in its response (RFC 9207), null where it named none -
            also for an error. It must equal the issuer the consent started with character for
            character, and it is required where that authorization server announced it
            (authorization_response_iss_parameter_supported).

    ConnectionAuthorizationCompleteResponse:
      type: object
      required: [purpose, profileId, returnTo]
      properties:
        purpose:
          $ref: "#/components/schemas/ConnectionAuthorizationPurpose"
        profileId:
          type: string
          format: uuid
        returnTo:
          type: string
          description: The page of the application the caller goes on to, derived from purpose.
          example: /settings/accounts
        account:
          description: >
            For the purpose ACCOUNT, the connection as it stands now; absent for an MCP server,
            whose connections are not shown yet.
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ConnectedAccount"
        libraryId:
          type: string
          format: uuid
          nullable: true
          description: For the purpose LIBRARY_RECONNECT, the library connected anew.
        pendingConnection:
          nullable: true
          description: For the purpose LIBRARY_NEW, the connection the new library takes over.
          allOf:
            - $ref: "#/components/schemas/PendingSourceConnection"

    ConnectedAccountState:
      type: string
      description: >
        CONNECTED (the secret is stored), EXPIRED (the provider rejected it or it ran out; connect
        anew), DISCONNECTED (disconnected, kept only while a private library is on it).
      enum: [CONNECTED, EXPIRED, DISCONNECTED]

    ConnectedAccountLibrary:
      type: object
      required: [id, name]
      description: A private library of the caller that runs on the connection.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    ConnectedAccount:
      type: object
      required: [profileId, profileName, sourceType, authMethod, state, released, reconnectable, connectedAt, usedBy]
      properties:
        profileId:
          type: string
          format: uuid
        profileName:
          type: string
          example: Zugang Nextcloud intern
        sourceType:
          $ref: "#/components/schemas/SourceTypeKey"
        authMethod:
          $ref: "#/components/schemas/ConnectionAuthMethod"
        secretForm:
          description: The form a reconnection takes; absent for a sign-in without one (OAuth).
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PersonalSecretForm"
        state:
          $ref: "#/components/schemas/ConnectedAccountState"
        accountLabel:
          type: string
          nullable: true
          description: >
            The caller's own account name at the provider, as entered; shown to the caller only,
            never to the administration.
          example: avogt
        released:
          type: boolean
          description: >
            Whether the profile is still released to the caller. A connection that is not runs
            on and can be disconnected and reconnected; only a new one needs the release.
        reconnectable:
          type: boolean
          description: Whether a reconnection goes now - not while the profile is locked.
        notice:
          type: string
          nullable: true
          description: >
            German note on the state or the release, naming what happens to the content; absent
            when there is nothing to say.
        responsible:
          type: string
          nullable: true
          description: Who can change what the notice says, in German.
          example: Systemverwaltung
        connectedAt:
          type: string
          format: date-time
        reconnectedAt:
          type: string
          format: date-time
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: >
            When the provider ends the consent of a connected OAuth account, where it names an end;
            absent otherwise. The person is notified 14 days before.
        usedBy:
          type: array
          items:
            $ref: "#/components/schemas/ConnectedAccountLibrary"

    ConnectableProfile:
      type: object
      required: [profileId, name, sourceType, authMethod]
      description: A profile the caller may connect an account on now.
      properties:
        profileId:
          type: string
          format: uuid
        name:
          type: string
        sourceType:
          $ref: "#/components/schemas/SourceTypeKey"
        authMethod:
          $ref: "#/components/schemas/ConnectionAuthMethod"
        secretForm:
          description: >
            The form of the personal secret to enter; absent for OAuth, which connects through the
            provider's consent (startConnectionAuthorization).
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PersonalSecretForm"

    MissingAccess:
      type: object
      required: [responsible, text]
      description: The answer to "Warum fehlt mein Zugang?".
      properties:
        responsible:
          type: string
          example: Systemverwaltung
        text:
          type: string

    ConnectedAccountsOverview:
      type: object
      required: [accounts, connectable, missingAccess]
      properties:
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/ConnectedAccount"
        connectable:
          type: array
          description: Profiles the caller has no connection on yet and may connect now.
          items:
            $ref: "#/components/schemas/ConnectableProfile"
        missingAccess:
          $ref: "#/components/schemas/MissingAccess"

    ConnectedAccountConnectRequest:
      type: object
      required: [secret]
      properties:
        username:
          type: string
          maxLength: 255
          nullable: true
          description: >
            The account name at the provider - required for the secret form
            USERNAME_AND_PASSWORD, refused for TOKEN. It is stored encrypted and shown to the
            caller only.
        secret:
          type: string
          minLength: 1
          maxLength: 4096
          description: Write-only app password or token; never returned.

    ConnectionProfileChangeRejection:
      type: object
      required: [libraryId, category, message]
      description: The connector of one library refuses the configuration a change would give it.
      properties:
        libraryId:
          type: string
          format: uuid
        category:
          $ref: "#/components/schemas/SourceChangeRejectionCategory"
        message:
          type: string
          description: The connector's reason, in German.

    SourceChangeRejectionCategory:
      type: string
      description: >
        Why the connector refuses a library's effective configuration, as it reports it:
        CONNECTION (the target is out of reach or refuses the sign-in) or SETTINGS (a setting is
        inadmissible, such as a profile default; every other refusal).
      enum: [CONNECTION, SETTINGS]

    ConnectionProfileOption:
      type: object
      description: >
        A profile the caller may create a library through now - released to them and neither the
        profile nor its connector locked. On a profile with the ownership PERSON only a private
        library.
      required: [id, name, sourceType, serverUrl, authMethod, ownership, ownAccount]
      properties:
        ownership:
          $ref: "#/components/schemas/ConnectionOwnership"
        ownAccount:
          type: boolean
          description: >
            Whether the caller has a connected account of her own on the profile, so a private
            library can run on it. Never anything about another person.
        id:
          type: string
          format: uuid
        name:
          type: string
        sourceType:
          $ref: "#/components/schemas/SourceTypeKey"
        serverUrl:
          type: string
        authMethod:
          $ref: "#/components/schemas/ConnectionAuthMethod"
        connectorDefaults:
          type: object
          additionalProperties: true
          nullable: true
          description: >
            The connector settings the profile sets for every library on it (see
            SourceTypeDescriptor.profileDefaults); absent for none. Never a secret.

    ConnectorLockRequest:
      type: object
      required: [locked]
      properties:
        locked:
          type: boolean

    OutboundProxyRequest:
      type: object
      required: [noProxy]
      properties:
        proxyUrl:
          type: string
          nullable: true
          description: http://host:port or host:port; null or blank for no proxy.
        noProxy:
          type: array
          description: The exclusion list, one entry per host name, IP literal or CIDR range.
          items:
            type: string

    OutboundProxyResponse:
      type: object
      required: [noProxy]
      properties:
        proxyUrl:
          type: string
          nullable: true
          description: The proxy as http://host:port; null when every connection goes direct.
        noProxy:
          type: array
          description: The normalized exclusion list.
          items:
            type: string
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: When the settings were last changed; null while never set.

    ConnectionLifecycleSettingKey:
      type: string
      description: >
        INACTIVITY_THRESHOLD_DAYS - days without a sign-in after which a person's connections rest;
        PRIVATE_LIBRARY_DELETION_DAYS - days the private libraries of a deactivated person are kept;
        EXPIRED_CONNECTION_WARNING_THRESHOLD - expired connected accounts on one profile from which
        the overview of the administration warns.
      enum: [INACTIVITY_THRESHOLD_DAYS, PRIVATE_LIBRARY_DELETION_DAYS, EXPIRED_CONNECTION_WARNING_THRESHOLD]

    ConnectionLifecycleSettingRequest:
      type: object
      properties:
        value:
          type: integer
          format: int32
          nullable: true
          description: The new value; null (or absent) returns to the factory default.

    ConnectionLifecycleSettingResponse:
      type: object
      required: [setting, value, defaultValue, minValue, maxValue, overridden, pausedBy]
      properties:
        setting:
          $ref: "#/components/schemas/ConnectionLifecycleSettingKey"
        value:
          type: integer
          format: int32
          description: The value in force.
        defaultValue:
          type: integer
          format: int32
          description: The factory default that applies while the administration has set no value.
        minValue:
          type: integer
          format: int32
        maxValue:
          type: integer
          format: int32
        overridden:
          type: boolean
          description: Whether the administration set its own value.
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: When the administration last set its own value; null while the default applies.
        pausedBy:
          type: array
          description: >-
            Only for PRIVATE_LIBRARY_DELETION_DAYS: the retired variables a live instance still sets
            to a longer period while the administration stored none (ADR-0060, Entscheidung 13);
            while there is one, the erasure after the deletion period pauses. Empty otherwise.
          items:
            $ref: "#/components/schemas/RetentionPause"

    ConnectionLifecycleSettingsResponse:
      type: object
      required: [settings, minimumGroupSize]
      properties:
        settings:
          type: array
          description: One entry per setting, in a fixed order.
          items:
            $ref: "#/components/schemas/ConnectionLifecycleSettingResponse"
        minimumGroupSize:
          type: integer
          format: int32
          description: >
            The minimum group size of the operation; a warning threshold below it shows the warning
            on every profile for persons.

    ConnectorTypeStateResponse:
      type: object
      required: [sourceType, displayName, locked, profileSupport, profileRequired]
      properties:
        sourceType:
          $ref: "#/components/schemas/SourceTypeKey"
        displayName:
          type: string
          example: Confluence
        locked:
          type: boolean
          description: Whether the connector type is locked (see lockConnectorType).
        lockedAt:
          type: string
          format: date-time
          nullable: true
        profileSupport:
          description: >
            How the connector itself stands to connection profiles; only OPTIONAL can be switched
            (see setConnectorProfileRequirement).
          allOf:
            - $ref: "#/components/schemas/ConnectionProfileSupport"
        profileRequired:
          type: boolean
          description: >
            Whether the type is usable only through connection profiles now - declared so by the
            connector, or switched on by the system administration.
        profileRequiredAt:
          type: string
          format: date-time
          nullable: true
          description: Since when the system administration switched the requirement on.
        ownAddressStock:
          nullable: true
          description: >
            What happens to the libraries with their own address while the requirement is
            switched on; absent otherwise.
          allOf:
            - $ref: "#/components/schemas/OwnAddressStock"

    OwnAddressStock:
      type: string
      description: >
        What happens to the libraries of a type with their own address once it is usable only
        through connection profiles: RUNS (they run on; their address can be changed only by
        connecting them through a profile), LOCKED (they keep their content but run no more until
        they are connected through a profile).
      enum: [RUNS, LOCKED]

    ConnectorProfileRequirementRequest:
      type: object
      required: [required]
      properties:
        required:
          type: boolean
        ownAddressStock:
          nullable: true
          description: Required when switching on; must be absent when switching off.
          allOf:
            - $ref: "#/components/schemas/OwnAddressStock"

    ConnectorProfileRequirementResponse:
      type: object
      required: [state, switchable, ownAddressLibraries]
      properties:
        state:
          $ref: "#/components/schemas/ConnectorTypeStateResponse"
        switchable:
          type: boolean
          description: >
            Whether the requirement can be switched on now (or is on and can be switched off).
        notSwitchableReason:
          type: string
          nullable: true
          description: Why it cannot, in German; absent when switchable.
        ownAddressLibraries:
          type: array
          description: >
            Every library of the type in the caller's organization with its own address - not
            connected through a profile, also after its profile was deleted - by name; the ones
            the choice of ownAddressStock affects.
          items:
            $ref: "#/components/schemas/OwnAddressLibrary"
        coverageNotice:
          type: string
          nullable: true
          description: >
            What the requirement does not cover for this type, in German - for an RSS feed, that
            it fixes only the feed address while detail pages on other origins are fetched
            without credentials. Absent when the requirement covers every target.

    OwnAddressLibrary:
      type: object
      required: [id, name, ownerType]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        ownerType:
          $ref: "#/components/schemas/AssetOwnerType"
        ownerName:
          type: string
          nullable: true
          description: >
            Display name of the owning group or person, as in the library list; null where the
            owner cannot be named.

    ConnectionProfileRef:
      type: object
      required: [id, name]
      description: >
        The profile a library is connected through. From AssetRole.MANAGER on the library it also
        names what the profile sets for it, so its managers can edit the source without the
        release to create one; never anything of the app registration and never a secret.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        serverUrl:
          type: string
          nullable: true
          description: The profile's server address; from MANAGER on.
        authMethod:
          nullable: true
          description: The profile's sign-in method; from MANAGER on.
          allOf:
            - $ref: "#/components/schemas/ConnectionAuthMethod"
        connectorDefaults:
          type: object
          additionalProperties: true
          nullable: true
          description: >
            The connector settings the profile sets for every library on it; from MANAGER on,
            absent for none.

    LibraryConnectionProfileRequest:
      type: object
      required: [profileId]
      properties:
        profileId:
          type: string
          format: uuid
        sourceUrl:
          type: string
          format: uri
          nullable: true
          description: >
            The library's new address; it must lie under the profile's server address (400).
            Absent, an address under the previous profile moves under the new one and any other
            stays. Repairs a library whose own address lies under no profile.
