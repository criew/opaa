# Topic "connections": connection profiles ("Zugänge", #2160, ADR-0041) and their selection.
# Merged with all other fragments at build time, see root.yaml.
tags:
  - name: connection-profile
    description: Connection profiles ("Zugänge") the system administration sets per connector.
  - name: connected-account
    description: >
      A person's own connected accounts ("Verbundene Konten"): their own app password or token on
      a profile with the ownership PERSON. Only the person sees them; the administration sees
      numbers only.
paths:
  /api/v1/me/connected-accounts:
    get:
      operationId: listMyConnectedAccounts
      tags: [connected-account]
      summary: The caller's connected accounts and the profiles they may connect
      description: >
        Every existing connection of the caller, also on a profile no longer released to them
        (then with a notice naming who is in charge); the profiles with the ownership PERSON
        released to the caller and not locked, to connect anew; and who to ask when a profile is
        missing. Never carries a secret.
      responses:
        "200":
          description: The caller's connected accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectedAccountsOverview"

  /api/v1/me/connected-accounts/{profileId}:
    parameters:
      - name: profileId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: connectMyAccount
      tags: [connected-account]
      summary: Connect or reconnect the caller's account on a profile
      description: >
        Signs in at the profile's server with the given secret before storing it, encrypted (needs
        OPAA_CREDENTIALS_ENCRYPTION_KEY, else 503). A first connection needs the profile released
        to the caller; reconnecting an existing one does not, but neither goes on a locked profile.
        username belongs to the secret form USERNAME_AND_PASSWORD only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectedAccountConnectRequest"
      responses:
        "200":
          description: The connection as it stands now
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectedAccount"
        "400":
          description: >
            The request does not fit the profile's secret form, or the provider rejected the
            sign-in or could not be reached (the message says which).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: >
            A first connection on a profile not released to the caller (code
            CAPABILITY_REQUIRED), or the profile or its connector is locked (code
            CONNECTOR_LOCKED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      operationId: disconnectMyAccount
      tags: [connected-account]
      summary: Disconnect the caller's account on a profile
      description: >
        Always possible, also without release and on a locked profile; the secret is deleted at
        once. A private library on the connection rests until the account is connected again.
      responses:
        "204":
          description: Disconnected
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/connection-profiles:
    get:
      operationId: listConnectionProfiles
      tags: [connection-profile]
      summary: List every connection profile (system admin only)
      description: >
        Never carries a client secret - only clientSecretSet, whether one is stored.
      responses:
        "200":
          description: Every connection profile, by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConnectionProfileResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      operationId: createConnectionProfile
      tags: [connection-profile]
      summary: Create a connection profile (system admin only)
      description: >
        The connector of sourceType must admit profiles and offer authMethod with the requested
        ownership (see SourceTypeDescriptor.signIns). clientId, tenant and clientSecretExpiresOn belong only to a
        sign-in method with an app registration, scopes only to OAUTH and CLIENT_CREDENTIALS.
        A clientSecret given here is stored encrypted and needs the credentials encryption key
        (OPAA_CREDENTIALS_ENCRYPTION_KEY); without it the answer is 503.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionProfileCreateRequest"
      responses:
        "201":
          description: Connection profile created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionProfileResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Another profile already carries this name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/admin/connection-profiles/{profileId}:
    parameters:
      - name: profileId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: getConnectionProfile
      tags: [connection-profile]
      summary: One connection profile (system admin only)
      responses:
        "200":
          description: The connection profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionProfileResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: updateConnectionProfile
      tags: [connection-profile]
      summary: Replace the editable fields of a connection profile (system admin only)
      description: >
        clientSecret follows the three-way convention of updateLlmModel: omitted keeps the stored
        secret, an empty string clears it, any other value replaces it - without touching any
        connection. A new serverUrl, clientId, tenant, scope list or authMethod discards every
        secret held under the profile; a library address under the old server address moves
        under the new one. While connections exist this needs confirmDiscard (otherwise 409 with
        code CONNECTION_PROFILE_CONFIRMATION_REQUIRED); getConnectionProfileImpact names the
        number beforehand. The connector of a profile never changes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionProfileUpdateRequest"
      responses:
        "200":
          description: Connection profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionProfileResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            The name is taken, or the change would discard secrets of existing connections and
            confirmDiscard is not set (code CONNECTION_PROFILE_CONFIRMATION_REQUIRED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

    delete:
      operationId: deleteConnectionProfile
      tags: [connection-profile]
      summary: Delete a connection profile (system admin only)
      description: >
        Every connection of the profile loses its secret. Its libraries stay with their content
        and the note "Zugang entfernt" and run no more until they are connected through another
        profile of the same connector or deleted.
      responses:
        "204":
          description: Connection profile deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/connection-profiles/{profileId}/impact:
    get:
      operationId: getConnectionProfileImpact
      tags: [connection-profile]
      summary: What a change, a shutdown or a deletion of the profile would cut off (system admin only)
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The connections and libraries on the profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionProfileImpactResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/connection-profiles/{profileId}/disconnect-all:
    post:
      operationId: disconnectAllConnectionProfileConnections
      tags: [connection-profile]
      summary: Emergency shutdown "Alle Verbindungen trennen" (system admin only)
      description: >
        Discards every secret held under the profile at once and keeps the profile. Its libraries
        stop running until their secret is entered again.
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The connections that were cut off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionProfileImpactResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/connection-profiles/{profileId}/lock:
    put:
      operationId: lockConnectionProfile
      tags: [connection-profile]
      summary: Lock or unlock a connection profile (system admin only)
      description: >
        A locked profile admits no new library and no new connection, and the runs of its
        libraries stop; a run already going ends regularly. The content stays searchable and
        carries the note "Gesperrt". Unlocking lets the libraries run again without being set up
        anew. A governance event either way (CONNECTOR_LOCKED, CONNECTOR_UNLOCKED).
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectorLockRequest"
      responses:
        "200":
          description: The profile with its new lock state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionProfileResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/connector-types:
    get:
      operationId: listConnectorTypeStates
      tags: [connection-profile]
      summary: The lock state of every connector type (system admin only)
      description: >
        One entry per registered connector except the upload, which reaches no source.
      responses:
        "200":
          description: Every connector type, by type key
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConnectorTypeStateResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/connector-types/{sourceType}/lock:
    put:
      operationId: lockConnectorType
      tags: [connection-profile]
      summary: Lock or unlock a connector type (system admin only)
      description: >
        Like lockConnectionProfile, for every library of the type - with or without a profile.
      parameters:
        - name: sourceType
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/SourceTypeKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectorLockRequest"
      responses:
        "200":
          description: The connector type with its new lock state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorTypeStateResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/connector-types/{sourceType}/profile-requirement:
    parameters:
      - name: sourceType
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/SourceTypeKey"

    get:
      operationId: getConnectorProfileRequirement
      tags: [connection-profile]
      summary: The profile requirement of a connector type and what switching it on affects (system admin only)
      description: >
        Whether the type may be made usable only through connection profiles ("Nur über
        Zugänge") and why not, the libraries of the type with their own address, and what the
        requirement does not cover for this type.
      responses:
        "200":
          description: The profile requirement of the type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorProfileRequirementResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

    put:
      operationId: setConnectorProfileRequirement
      tags: [connection-profile]
      summary: Switch the profile requirement of a connector type on or off (system admin only)
      description: >
        Switched on, no library of the type is created, tested or listed with its own address,
        none is released from its profile, and a library with its own address keeps that
        address. ownAddressStock decides for every such library whether it runs on (RUNS) or is
        locked until it is connected through a profile (LOCKED); sending it again while the
        requirement holds changes that choice. Switched off, every such lock is lifted. Only a
        type that declares profiles as optional may be switched (otherwise 400), and only on
        while at least one unlocked profile of the type admits libraries (otherwise 409 with
        code PROFILE_REQUIREMENT_NEEDS_PROFILE). A governance event either way
        (CONNECTOR_PROFILE_REQUIRED, CONNECTOR_PROFILE_OPTIONAL).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectorProfileRequirementRequest"
      responses:
        "200":
          description: The connector type with its new profile requirement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorTypeStateResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: >
            No unlocked profile of the type admits libraries (code
            PROFILE_REQUIREMENT_NEEDS_PROFILE).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/connection-profiles:
    get:
      operationId: listConnectionProfileOptions
      tags: [connection-profile]
      summary: The profiles a library of one source type may be connected through
      description: >
        Every profile whose ownership admits libraries, by name, without anything of the app
        registration - each with whether the caller may create a library through it and, where
        not, a notice naming who can change that, so a profile the caller may not use is shown
        rather than hidden. Needs the capability CREATE_CONNECTOR_LIBRARY in at least one scope.
      parameters:
        - name: sourceType
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/SourceTypeKey"
      responses:
        "200":
          description: The selectable profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConnectionProfileOption"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  schemas:
    ConnectionProfileSupport:
      type: string
      description: >
        How a connector stands to connection profiles ("Profilangabe"): FORBIDDEN (no remote
        target), OPTIONAL (profile or own address), REQUIRED (only with a profile).
      enum: [FORBIDDEN, OPTIONAL, REQUIRED]

    ConnectionAuthMethod:
      type: string
      description: >
        How a connection signs in: NONE (anonymous), PERSONAL_SECRET (app password, token or user
        name and password), OAUTH, CLIENT_CREDENTIALS, SERVICE_ACCOUNT_KEY.
      enum: [NONE, PERSONAL_SECRET, OAUTH, CLIENT_CREDENTIALS, SERVICE_ACCOUNT_KEY]

    ConnectionOwnership:
      type: string
      description: Which connections a profile admits ("Besitzart").
      enum: [LIBRARY, PERSON, BOTH]

    SourceTypeSignIn:
      type: object
      required: [method, ownerships]
      description: >
        One sign-in method a connector offers. A profile choosing it may take the ownership
        LIBRARY or PERSON when listed here, BOTH when both are.
      properties:
        method:
          $ref: "#/components/schemas/ConnectionAuthMethod"
        ownerships:
          type: array
          description: LIBRARY, PERSON or both; never BOTH itself.
          items:
            $ref: "#/components/schemas/ConnectionOwnership"
        secretForm:
          description: Set exactly for the method PERSONAL_SECRET.
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PersonalSecretForm"

    PersonalSecretForm:
      type: string
      description: >
        The form in which a connector takes a personal secret: TOKEN (one token or app
        password) or USERNAME_AND_PASSWORD.
      enum: [TOKEN, USERNAME_AND_PASSWORD]

    ProfileDefaultKind:
      type: string
      description: >
        The kind of value a profile default takes: TEXT (a line of text), BOOLEAN (true or
        false), CHOICE (one of choices).
      enum: [TEXT, BOOLEAN, CHOICE]

    ProfileDefaultKey:
      type: object
      required: [key, label, kind, choices]
      description: One connector settings key a connection profile may set.
      properties:
        key:
          type: string
          description: The key in connectorSettings, a key of the connector's own settings.
          example: edition
        label:
          type: string
          description: German label of the field.
          example: Edition
        kind:
          $ref: "#/components/schemas/ProfileDefaultKind"
        choices:
          type: array
          description: The values a CHOICE takes, in display order; empty for any other kind.
          items:
            type: string

    ServerAddressRule:
      type: object
      required: [schemes]
      description: >
        What a profile's serverUrl may be: an address with one of schemes, or exactly fixed.
        With fixed set, schemes is empty and the form asks for no address.
      properties:
        schemes:
          type: array
          items:
            type: string
          example: [https, http]
        fixed:
          type: string
          nullable: true
          description: The one address every profile of the type carries.

    ConnectionProfileCreateRequest:
      type: object
      required: [sourceType, name, serverUrl, authMethod, ownership]
      properties:
        sourceType:
          $ref: "#/components/schemas/SourceTypeKey"
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: Zugang Nextcloud intern
        serverUrl:
          type: string
          maxLength: 2000
          description: >
            The only target of the profile's secrets - with a scheme the connector admits
            (SourceTypeDescriptor.serverAddress), without user info, query or fragment. Stored
            without a trailing slash. For a type with a fixed address, empty or that address.
          example: https://cloud.example.org
        authMethod:
          $ref: "#/components/schemas/ConnectionAuthMethod"
        ownership:
          $ref: "#/components/schemas/ConnectionOwnership"
        clientId:
          type: string
          maxLength: 255
          nullable: true
        clientSecret:
          type: string
          maxLength: 2000
          nullable: true
          description: Write-only; never returned (see clientSecretSet).
        clientSecretExpiresOn:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
          nullable: true
          description: An ISO date (YYYY-MM-DD); OPAA warns 14 days before it.
          example: "2027-03-31"
        tenant:
          type: string
          maxLength: 255
          nullable: true
        scopes:
          type: string
          maxLength: 2000
          nullable: true
          example: Files.Read offline_access
        connectorSettings:
          type: object
          additionalProperties: true
          nullable: true
          description: >
            Connector defaults: only keys the connector names in
            SourceTypeDescriptor.profileDefaults, each of its kind; another key is a 400. They
            override a library's settings key by key. Never a secret.
        sourceProxy:
          type: string
          maxLength: 255
          nullable: true
          description: >
            Proxy server in host:port format every library on the profile is reached through;
            absent for none. A library on the profile cannot set its own.
          example: proxy.example.org:8080
        sourceInsecureSsl:
          type: boolean
          nullable: true
          default: false
          description: >
            Skip the certificate check for every library on the profile. A library on the profile
            cannot set its own.

    ConnectionProfileUpdateRequest:
      type: object
      required: [name, serverUrl, authMethod, ownership]
      description: The connector of a profile never changes, so sourceType is not part of it.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: Zugang Nextcloud intern
        serverUrl:
          type: string
          maxLength: 2000
          description: >
            The only target of the profile's secrets - with a scheme the connector admits
            (SourceTypeDescriptor.serverAddress), without user info, query or fragment. Stored
            without a trailing slash. For a type with a fixed address, empty or that address.
          example: https://cloud.example.org
        authMethod:
          $ref: "#/components/schemas/ConnectionAuthMethod"
        ownership:
          $ref: "#/components/schemas/ConnectionOwnership"
        clientId:
          type: string
          maxLength: 255
          nullable: true
        clientSecret:
          type: string
          maxLength: 2000
          nullable: true
          description: Write-only; never returned (see clientSecretSet).
        clientSecretExpiresOn:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
          nullable: true
          description: An ISO date (YYYY-MM-DD); OPAA warns 14 days before it.
          example: "2027-03-31"
        tenant:
          type: string
          maxLength: 255
          nullable: true
        scopes:
          type: string
          maxLength: 2000
          nullable: true
          example: Files.Read offline_access
        connectorSettings:
          type: object
          additionalProperties: true
          nullable: true
          description: >
            Connector defaults: only keys the connector names in
            SourceTypeDescriptor.profileDefaults, each of its kind; another key is a 400. They
            override a library's settings key by key. Never a secret.
        sourceProxy:
          type: string
          maxLength: 255
          nullable: true
          description: >
            Proxy server in host:port format every library on the profile is reached through;
            absent for none. A library on the profile cannot set its own.
          example: proxy.example.org:8080
        sourceInsecureSsl:
          type: boolean
          nullable: true
          default: false
          description: >
            Skip the certificate check for every library on the profile. A library on the profile
            cannot set its own.
        confirmDiscard:
          type: boolean
          description: >
            Confirms that a change of serverUrl, clientId, tenant, scopes or authMethod discards
            the secrets of the existing connections.

    ConnectionProfileResponse:
      type: object
      required:
        [
          id,
          name,
          sourceType,
          serverUrl,
          authMethod,
          ownership,
          clientSecretSet,
          clientSecretExpiresSoon,
          sourceInsecureSsl,
          connectionCount,
          connectedAccountCount,
          expiredConnectionCount,
          locked,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        sourceType:
          $ref: "#/components/schemas/SourceTypeKey"
        serverUrl:
          type: string
        authMethod:
          $ref: "#/components/schemas/ConnectionAuthMethod"
        ownership:
          $ref: "#/components/schemas/ConnectionOwnership"
        clientId:
          type: string
          nullable: true
        clientSecretSet:
          type: boolean
          description: Whether a client secret is stored; its value is never returned.
        clientSecretExpiresOn:
          type: string
          nullable: true
          description: An ISO date (YYYY-MM-DD).
        clientSecretExpiresSoon:
          type: boolean
          description: Whether the client secret expires within 14 days or has expired.
        tenant:
          type: string
          nullable: true
        scopes:
          type: string
          nullable: true
        connectorSettings:
          type: object
          additionalProperties: true
          nullable: true
        sourceProxy:
          type: string
          nullable: true
        sourceInsecureSsl:
          type: boolean
        connectionCount:
          type: integer
          format: int64
          description: The connections of libraries on this profile.
        connectedAccountCount:
          $ref: "#/components/schemas/PersonCount"
        expiredConnectionCount:
          $ref: "#/components/schemas/PersonCount"
        locked:
          type: boolean
          description: Whether the profile is locked (see lockConnectionProfile).
        lockedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ConnectionProfileImpactResponse:
      type: object
      required: [connections, libraries, connectedAccounts, lastForProfileRequirement]
      properties:
        connections:
          type: integer
          format: int64
        libraries:
          type: integer
          format: int64
        connectedAccounts:
          $ref: "#/components/schemas/PersonCount"
        lastForProfileRequirement:
          type: boolean
          description: >
            Whether the profile is the last unlocked one admitting libraries of a connector type
            that is usable only through profiles: without it, no new library of the type can be
            created until another profile exists. Deleting or locking it stays possible.

    PersonCount:
      type: object
      description: >
        A number of persons' connections as the administration sees it: exact from the minimum
        group size on and at zero, below it only "fewer than" (fewerThan), so a count never points
        at a person. Exactly one of the two is set.
      properties:
        count:
          type: integer
          format: int64
          nullable: true
        fewerThan:
          type: integer
          format: int32
          nullable: true
          example: 5

    ConnectedAccountState:
      type: string
      description: >
        CONNECTED (the secret is stored), EXPIRED (the provider rejected it or it ran out; connect
        anew), DISCONNECTED (disconnected, kept only while a private library is on it).
      enum: [CONNECTED, EXPIRED, DISCONNECTED]

    ConnectedAccountLibrary:
      type: object
      required: [id, name]
      description: A private library of the caller that runs on the connection.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    ConnectedAccount:
      type: object
      required: [profileId, profileName, authMethod, state, released, reconnectable, connectedAt, usedBy]
      properties:
        profileId:
          type: string
          format: uuid
        profileName:
          type: string
          example: Zugang Nextcloud intern
        authMethod:
          $ref: "#/components/schemas/ConnectionAuthMethod"
        secretForm:
          description: The form a reconnection takes; absent for a sign-in without one (OAuth).
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PersonalSecretForm"
        state:
          $ref: "#/components/schemas/ConnectedAccountState"
        accountLabel:
          type: string
          nullable: true
          description: >
            The caller's own account name at the provider, as entered; shown to the caller only,
            never to the administration.
          example: avogt
        released:
          type: boolean
          description: >
            Whether the profile is still released to the caller. A connection that is not runs
            on and can be disconnected and reconnected; only a new one needs the release.
        reconnectable:
          type: boolean
          description: Whether a reconnection goes now - not while the profile is locked.
        notice:
          type: string
          nullable: true
          description: >
            German note on the state or the release, naming what happens to the content; absent
            when there is nothing to say.
        responsible:
          type: string
          nullable: true
          description: Who can change what the notice says, in German.
          example: Systemverwaltung
        connectedAt:
          type: string
          format: date-time
        reconnectedAt:
          type: string
          format: date-time
          nullable: true
        usedBy:
          type: array
          items:
            $ref: "#/components/schemas/ConnectedAccountLibrary"

    ConnectableProfile:
      type: object
      required: [profileId, name, authMethod]
      description: A profile the caller may connect an account on now.
      properties:
        profileId:
          type: string
          format: uuid
        name:
          type: string
        authMethod:
          $ref: "#/components/schemas/ConnectionAuthMethod"
        secretForm:
          description: >
            The form of the personal secret to enter; absent for a sign-in without one (OAuth),
            which this version cannot connect yet.
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PersonalSecretForm"

    MissingAccess:
      type: object
      required: [responsible, text]
      description: The answer to "Warum fehlt mein Zugang?".
      properties:
        responsible:
          type: string
          example: Systemverwaltung
        text:
          type: string

    ConnectedAccountsOverview:
      type: object
      required: [accounts, connectable, missingAccess]
      properties:
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/ConnectedAccount"
        connectable:
          type: array
          description: Profiles the caller has no connection on yet and may connect now.
          items:
            $ref: "#/components/schemas/ConnectableProfile"
        missingAccess:
          $ref: "#/components/schemas/MissingAccess"

    ConnectedAccountConnectRequest:
      type: object
      required: [secret]
      properties:
        username:
          type: string
          maxLength: 255
          nullable: true
          description: >
            The account name at the provider - required for the secret form
            USERNAME_AND_PASSWORD, refused for TOKEN. It is stored encrypted and shown to the
            caller only.
        secret:
          type: string
          minLength: 1
          maxLength: 4096
          description: Write-only app password or token; never returned.

    ConnectionProfileOption:
      type: object
      required: [id, name, sourceType, serverUrl, authMethod, sourceInsecureSsl, creatable]
      properties:
        creatable:
          type: boolean
          description: >
            Whether the caller may create a library through this profile now - released to them
            and neither the profile nor its connector locked.
        creationNotice:
          type: string
          nullable: true
          description: >
            Why the caller may not, naming who can change it; absent when creatable.
        id:
          type: string
          format: uuid
        name:
          type: string
        sourceType:
          $ref: "#/components/schemas/SourceTypeKey"
        serverUrl:
          type: string
        authMethod:
          $ref: "#/components/schemas/ConnectionAuthMethod"
        connectorDefaults:
          type: object
          additionalProperties: true
          nullable: true
          description: >
            The connector settings the profile sets for every library on it (see
            SourceTypeDescriptor.profileDefaults); absent for none. Never a secret.
        sourceProxy:
          type: string
          nullable: true
          description: The proxy every library on the profile is reached through; absent for none.
        sourceInsecureSsl:
          type: boolean
          description: Whether the certificate check is skipped for every library on the profile.

    ConnectorLockRequest:
      type: object
      required: [locked]
      properties:
        locked:
          type: boolean

    ConnectorTypeStateResponse:
      type: object
      required: [sourceType, displayName, locked, profileSupport, profileRequired]
      properties:
        sourceType:
          $ref: "#/components/schemas/SourceTypeKey"
        displayName:
          type: string
          example: Confluence
        locked:
          type: boolean
          description: Whether the connector type is locked (see lockConnectorType).
        lockedAt:
          type: string
          format: date-time
          nullable: true
        profileSupport:
          description: >
            How the connector itself stands to connection profiles; only OPTIONAL can be switched
            (see setConnectorProfileRequirement).
          allOf:
            - $ref: "#/components/schemas/ConnectionProfileSupport"
        profileRequired:
          type: boolean
          description: >
            Whether the type is usable only through connection profiles now - declared so by the
            connector, or switched on by the system administration.
        profileRequiredAt:
          type: string
          format: date-time
          nullable: true
          description: Since when the system administration switched the requirement on.
        ownAddressStock:
          nullable: true
          description: >
            What happens to the libraries with their own address while the requirement is
            switched on; absent otherwise.
          allOf:
            - $ref: "#/components/schemas/OwnAddressStock"

    OwnAddressStock:
      type: string
      description: >
        What happens to the libraries of a type with their own address once it is usable only
        through connection profiles: RUNS (they run on; their address can be changed only by
        connecting them through a profile), LOCKED (they keep their content but run no more until
        they are connected through a profile).
      enum: [RUNS, LOCKED]

    ConnectorProfileRequirementRequest:
      type: object
      required: [required]
      properties:
        required:
          type: boolean
        ownAddressStock:
          nullable: true
          description: Required when switching on; must be absent when switching off.
          allOf:
            - $ref: "#/components/schemas/OwnAddressStock"

    ConnectorProfileRequirementResponse:
      type: object
      required: [state, switchable, ownAddressLibraries]
      properties:
        state:
          $ref: "#/components/schemas/ConnectorTypeStateResponse"
        switchable:
          type: boolean
          description: >
            Whether the requirement can be switched on now (or is on and can be switched off).
        notSwitchableReason:
          type: string
          nullable: true
          description: Why it cannot, in German; absent when switchable.
        ownAddressLibraries:
          type: array
          description: >
            Every library of the type in the caller's organization with its own address - not
            connected through a profile, also after its profile was deleted - by name; the ones
            the choice of ownAddressStock affects.
          items:
            $ref: "#/components/schemas/OwnAddressLibrary"
        coverageNotice:
          type: string
          nullable: true
          description: >
            What the requirement does not cover for this type, in German - for an RSS feed, that
            it fixes only the feed address while detail pages on other origins are fetched
            without credentials. Absent when the requirement covers every target.

    OwnAddressLibrary:
      type: object
      required: [id, name, ownerType]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        ownerType:
          $ref: "#/components/schemas/AssetOwnerType"
        ownerName:
          type: string
          nullable: true
          description: >
            Display name of the owning group or person, as in the library list; null where the
            owner cannot be named.

    ConnectionProfileRef:
      type: object
      required: [id, name]
      description: The profile a library is connected through.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    LibraryConnectionProfileRequest:
      type: object
      required: [profileId]
      properties:
        profileId:
          type: string
          format: uuid
