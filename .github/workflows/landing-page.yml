name: Landing Page

# Veröffentlicht den Inhalt von page/ als Startseite von https://opaa.io.
#
# Ziel ist der Branch gh-pages, den der Webserver per Pull spiegelt (siehe
# page/README.md).

on:
  push:
    branches: [main]
    paths:
      - "page/**"
      - ".github/workflows/landing-page.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Läufe committen nacheinander auf gh-pages; ein paralleler Lauf würde beim
  # Push gegen den anderen laufen.
  group: gh-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Landing Page auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            page
          sparse-checkout-cone-mode: false
          path: source
          persist-credentials: false

      - name: Veröffentlichte Seite auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: site
          # The last step pushes the page to gh-pages from this checkout.
          persist-credentials: true
        continue-on-error: true

      - name: Seitenverzeichnis vorbereiten
        run: mkdir -p site

      - name: Landing Page übernehmen
        run: |
          # --delete räumt alles weg, was nicht aus page/ stammt, bis auf .git
          # und fortschritt/: Dort liegen manuell direkt auf gh-pages gepushte
          # Meilenstein-Artefakte (Demo-Video, Berichts-PDFs), zu groß fürs
          # Quell-Repository.
          rsync -a --delete \
            --exclude '.git/' \
            --exclude 'fortschritt/' \
            source/page/ site/

      - name: Seite veröffentlichen
        working-directory: site
        env:
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -d .git ]; then
            git init -q
            git remote add origin "https://x-access-token:$PUSH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$(git symbolic-ref --short HEAD 2>/dev/null)" != "gh-pages" ]; then
            git symbolic-ref HEAD refs/heads/gh-pages
          fi
          git add -A
          if git diff --staged --quiet; then
            echo "Keine Änderungen zu veröffentlichen."
            exit 0
          fi
          git commit -m "docs(page): Landing Page aktualisieren"
          git push origin gh-pages
