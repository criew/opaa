name: Landing Page

# Veröffentlicht den Inhalt von page/ als Startseite von https://opaa.io und das
# Handbuch unter https://opaa.io/handbuch/: der Stand von main unter handbuch/,
# jedes Release unter handbuch/<Tag>/ (Pfadfilter gelten nicht für Tags).
#
# Ziel ist der Branch gh-pages, den der Webserver per Pull spiegelt (siehe
# page/README.md).

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - "page/**"
      - "docs/handbuch/**"
      - "mkdocs.yml"
      - ".github/requirements-docs.txt"
      - ".github/workflows/landing-page.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Läufe von main warten aufeinander. Ein Tag-Lauf hat seine eigene Gruppe:
  # GitHub hält je Gruppe nur einen wartenden Lauf, ein späterer main-Lauf
  # würde einen wartenden Tag-Lauf sonst verdrängen. Gegen den gleichzeitigen
  # Push schreibt jeder Lauf nur sein Verzeichnis und wiederholt den Push.
  group: gh-pages-${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
  cancel-in-progress: false

jobs:
  # Builds the handbook without write access; only the publish job holds a token that can push.
  handbook:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.target.outputs.dir }}
    steps:
      - name: Ziel des Handbuchs bestimmen
        id: target
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            # The tag form of deploy/helm/ci/release-version.sh.
            if ! printf '%s' "$REF_NAME" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'; then
              echo "Tag '$REF_NAME' ist keine Release-Version vX.Y.Z[-<pre>]." >&2
              exit 1
            fi
            echo "dir=handbuch/$REF_NAME" >> "$GITHUB_OUTPUT"
          elif [ "$REF_NAME" = "main" ]; then
            echo "dir=handbuch" >> "$GITHUB_OUTPUT"
          else
            echo "Veröffentlicht wird nur von main oder einem Release-Tag, nicht von '$REF_NAME'." >&2
            exit 1
          fi

      - name: Handbuch auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            docs/handbuch
            mkdocs.yml
            .github/requirements-docs.txt
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # The site packages install from wheels only, so pip runs no build step whose build
      # requirements would escape --require-hashes; Python 3.14, because the pinned PyYAML has no
      # cp315 wheel (a Renovate rule in renovate.json5 keeps this below 3.15). Same setup as the
      # site build in ci.yml.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: docs-python
        with:
          python-version: '3.14'
          update-environment: false

      - name: Handbuch-Website bauen
        env:
          DOCS_PYTHON: ${{ steps.docs-python.outputs.python-path }}
        run: |
          "$DOCS_PYTHON" -m venv "$RUNNER_TEMP/mkdocs"
          "$RUNNER_TEMP/mkdocs/bin/pip" install --require-hashes --no-deps --only-binary=:all: -r .github/requirements-docs.txt
          NO_MKDOCS_2_WARNING=1 "$RUNNER_TEMP/mkdocs/bin/mkdocs" build --strict

      - name: Handbuch-Website ablegen
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: handbuch-site
          path: build/handbuch-site/
          retention-days: 1

  publish:
    needs: handbook
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Landing Page auschecken
        if: github.ref_type != 'tag'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            page
          sparse-checkout-cone-mode: false
          path: source
          persist-credentials: false

      - name: Veröffentlichte Seite auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: site
          # The last step pushes the page to gh-pages from this checkout.
          persist-credentials: true
        continue-on-error: true

      - name: Seitenverzeichnis vorbereiten
        run: mkdir -p site

      - name: Handbuch-Website holen
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: handbuch-site
          path: handbook

      - name: Landing Page übernehmen
        if: github.ref_type != 'tag'
        run: |
          # --delete räumt alles weg, was nicht aus page/ stammt, bis auf .git,
          # handbuch/ (nächster Schritt) und fortschritt/: Dort liegen manuell
          # direkt auf gh-pages gepushte Meilenstein-Artefakte (Demo-Video,
          # Berichts-PDFs), zu groß fürs Quell-Repository.
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '/handbuch/' \
            --exclude 'fortschritt/' \
            source/page/ site/

      - name: Handbuch übernehmen
        env:
          TARGET: ${{ needs.handbook.outputs.target }}
        run: |
          # Der Stand von main lässt die Release-Fassungen unter handbuch/v*/
          # stehen; eine Release-Fassung schreibt nur der Lauf ihres Tags.
          mkdir -p "site/$TARGET"
          rsync -a --delete --exclude '/v[0-9]*/' handbook/ "site/$TARGET/"

      - name: Seite veröffentlichen
        working-directory: site
        env:
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -d .git ]; then
            git init -q
            git remote add origin "https://x-access-token:$PUSH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$(git symbolic-ref --short HEAD 2>/dev/null)" != "gh-pages" ]; then
            git symbolic-ref HEAD refs/heads/gh-pages
          fi
          git add -A
          if git diff --staged --quiet; then
            echo "Keine Änderungen zu veröffentlichen."
            exit 0
          fi
          git commit -m "docs(page): Landing Page und Handbuch aktualisieren"
          for attempt in 1 2 3; do
            if git push origin gh-pages; then exit 0; fi
            sleep $((attempt * 5))
            # The checkout is shallow; 50 commits reach back past the base of this run.
            git fetch -q --depth 50 origin gh-pages
            git rebase -q FETCH_HEAD
          done
          exit 1
