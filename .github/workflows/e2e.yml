name: E2E

on:
  pull_request:
    branches: [main]
    # Building the full stack is the expensive part of this workflow (see
    # "Build backend/frontend images" below); skip it for changes that can't
    # affect the running app, matching the AGENTS.md pre-push rule of
    # skipping checks for pure documentation changes.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  push:
    branches: [main]
  schedule:
    # Post-merge QA loop (see docs/AGENT-ORGANIZATION.md): catches
    # regressions from base image updates etc. even without a new PR.
    - cron: '17 3 * * *'

# A new push to a PR branch makes the previous run's result irrelevant —
# cancel it instead of blocking a runner (issue #644). Non-PR events (main
# pushes, the nightly schedule) get the SHA in the group so GitHub never
# discards a pending main/schedule run when the next merge lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COMPOSE_PROJECT_NAME: opaa-e2e

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Suite budget from #231 is 10 minutes for the *test run*; the image
    # build below is intentionally outside that budget (see e2e/README.md)
    # and sped up with a GitHub Actions layer cache, but still needs its own
    # margin. Re-evaluate this number as the suite grows.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Pre-build the images with a GitHub Actions layer cache and load them
      # into the local Docker daemon, tagged exactly as Compose would name
      # them for project "opaa-e2e" (<project>-<service>:latest). run-e2e.mjs
      # then runs with E2E_SKIP_BUILD=true and reuses these images instead of
      # rebuilding, which is what keeps the actual `docker compose up`
      # (and thus the suite run) fast and within the #231 time budget.
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          # Repo-root context (issue #896): backend's Gradle build depends on the sibling
          # opaa-api/ module via settings.gradle.kts, so a context scoped to backend/ alone would
          # not see it.
          context: .
          file: backend/Dockerfile
          tags: opaa-e2e-backend:latest
          load: true
          cache-from: type=gha,scope=e2e-backend
          cache-to: type=gha,mode=max,scope=e2e-backend

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          tags: opaa-e2e-frontend:latest
          load: true
          cache-from: type=gha,scope=e2e-frontend
          cache-to: type=gha,mode=max,scope=e2e-frontend

      # Installs the pnpm version pinned in the "packageManager" field of
      # e2e/package.json.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: e2e/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml

      # test(e2e) #233: scripts/run-e2e.mjs seeds the e2e data profile via demo/seed/seed.py
      # between "stack ready" and "run Playwright" - needs python3 + pip on the runner (ubuntu-latest
      # ships both, but not pinned without this step; matches ci.yml's own setup-python use).
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install E2E dependencies
        working-directory: e2e
        run: pnpm install --frozen-lockfile

      - name: Type-check E2E suite
        working-directory: e2e
        run: pnpm run typecheck

      # The browser download and especially the apt-get run behind
      # --with-deps have repeatedly hung on slow runner mirrors and eaten
      # the whole job budget (#508). The cache makes the install a no-op on
      # most runs; the step timeout makes a hanging mirror fail fast with a
      # clear cause instead of surfacing as a cancelled job.
      - name: Resolve Playwright version
        id: playwright-version
        working-directory: e2e
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        working-directory: e2e
        timeout-minutes: 6
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi

      - name: Run E2E suite
        working-directory: e2e
        run: pnpm test
        env:
          E2E_SKIP_BUILD: 'true'

      # if: !cancelled() (not failure()) on purpose: when the job hits
      # timeout-minutes, GitHub marks it cancelled, not failed, and
      # if: failure() would silently skip artifact upload in exactly the
      # case investigators need it most.
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload traces & screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload container logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: docker-compose-logs
          path: e2e/docker-compose.log
          if-no-files-found: ignore
          retention-days: 14
