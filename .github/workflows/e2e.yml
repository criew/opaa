name: E2E

# Deliberately not on pull_request (#1226): the suite is a post-merge safety net, not a PR gate.
# It runs on every push to main, nightly, and on demand; a failure opens or updates an alarm
# issue (see the last steps) that is then fixed like any other bug.
on:
  push:
    branches: [main]
  schedule:
    # Post-merge QA loop (see docs/AGENT-ORGANIZATION.md): catches
    # regressions from base image updates etc. even without a new PR.
    - cron: '17 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

# The SHA in the group means GitHub never discards a pending main/schedule
# run when the next merge lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

env:
  COMPOSE_PROJECT_NAME: opaa-e2e

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Suite budget from #231 is 10 minutes for the *test run*; the image
    # build below is intentionally outside that budget (see e2e/README.md)
    # and sped up with a GitHub Actions layer cache, but still needs its own
    # margin. Re-evaluate this number as the suite grows.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Pre-build the images with a GitHub Actions layer cache and load them
      # into the local Docker daemon, tagged exactly as Compose would name
      # them for project "opaa-e2e" (<project>-<service>:latest). run-e2e.mjs
      # then runs with E2E_SKIP_BUILD=true and reuses these images instead of
      # rebuilding, which is what keeps the actual `docker compose up`
      # (and thus the suite run) fast and within the #231 time budget.
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          # Repo-root context (issue #896): backend's Gradle build depends on the sibling
          # opaa-api/ module via settings.gradle.kts, so a context scoped to backend/ alone would
          # not see it.
          context: .
          file: backend/Dockerfile
          tags: opaa-e2e-backend:latest
          load: true
          cache-from: type=gha,scope=e2e-backend
          cache-to: type=gha,mode=max,scope=e2e-backend

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          tags: opaa-e2e-frontend:latest
          load: true
          cache-from: type=gha,scope=e2e-frontend
          cache-to: type=gha,mode=max,scope=e2e-frontend

      # Installs the pnpm version pinned in the "packageManager" field of
      # e2e/package.json.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: e2e/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml

      # test(e2e) #233: scripts/run-e2e.mjs seeds the e2e data profile via demo/seed/seed.py
      # between "stack ready" and "run Playwright" - needs python3 + pip on the runner (ubuntu-latest
      # ships both, but not pinned without this step; matches ci.yml's own setup-python use).
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install E2E dependencies
        working-directory: e2e
        run: pnpm install --frozen-lockfile

      - name: Type-check E2E suite
        working-directory: e2e
        run: pnpm run typecheck

      # The browser download and especially the apt-get run behind
      # --with-deps have repeatedly hung on slow runner mirrors and eaten
      # the whole job budget (#508). The cache makes the install a no-op on
      # most runs; the step timeout makes a hanging mirror fail fast with a
      # clear cause instead of surfacing as a cancelled job.
      - name: Resolve Playwright version
        id: playwright-version
        working-directory: e2e
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        working-directory: e2e
        timeout-minutes: 6
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi

      - name: Run E2E suite
        working-directory: e2e
        run: pnpm test
        env:
          E2E_SKIP_BUILD: 'true'

      # if: !cancelled() (not failure()) on purpose: when the job hits
      # timeout-minutes, GitHub marks it cancelled, not failed, and
      # if: failure() would silently skip artifact upload in exactly the
      # case investigators need it most.
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload traces & screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload container logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: docker-compose-logs
          path: e2e/docker-compose.log
          if-no-files-found: ignore
          retention-days: 14

      # Without a PR there is nothing that makes a red run visible, so a failure (or a timeout,
      # which GitHub reports as cancelled) opens an alarm issue listing the failed scenarios, or
      # comments on the one already open - same pattern as retrieval-regression.yml. The body of
      # an existing issue is never overwritten, so an analysis someone added there survives.
      - name: Fehlschlag als Issue melden
        if: failure() || cancelled()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- e2e-alert -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Failed and timed-out scenarios by name from Playwright's JSON report; a run that
            // never reached the suite (image build, stack start, timeout) has no report.
            const failed = [];
            const walk = (suite, path) => {
              const here = suite.title ? [...path, suite.title] : path;
              for (const spec of suite.specs ?? []) {
                const results = spec.tests.flatMap(t => t.results ?? []);
                const last = results[results.length - 1];
                if (spec.ok === false || (last && last.status !== 'passed' && last.status !== 'skipped')) {
                  const error = last && last.error && last.error.message
                    ? last.error.message.split('\n')[0].replace(/\u001b\[[0-9;]*m/g, '')
                    : '';
                  failed.push(`- \`${[...here, spec.title].join(' › ')}\`${error ? ` — ${error}` : ''}`);
                }
              }
              for (const child of suite.suites ?? []) walk(child, here);
            };
            const reportPath = 'e2e/test-results/results.json';
            let details;
            if (fs.existsSync(reportPath)) {
              const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
              for (const suite of report.suites ?? []) walk(suite, []);
              details = failed.length
                ? `Fehlgeschlagene Szenarien:\n\n${failed.join('\n')}`
                : 'Der Playwright-Bericht weist keinen fehlgeschlagenen Testfall aus — der Fehler ' +
                  'liegt vor oder nach der Suite (siehe Workflow-Logs).';
            } else {
              details = 'Kein Playwright-Bericht vorhanden — der Lauf hat die Suite nicht erreicht ' +
                '(Image-Build, Stack-Start oder Zeitlimit; siehe Workflow-Logs).';
            }
            const artifacts = 'Artefakte des Laufs: `playwright-report`, `playwright-traces`, `docker-compose-logs`.';
            const commentBody = `Erneut fehlgeschlagen: ${runUrl}\n\n${details}\n\n${artifacts}`;
            const issueBody = `${marker}\n\n**Die E2E-Suite auf \`main\` ist fehlgeschlagen.**\n\n` +
              `Workflow-Lauf: ${runUrl} (Auslöser: ${context.eventName})\n\n${details}\n\n${artifacts}\n\n` +
              'Die Suite läuft nicht mehr bei Pull Requests (#1226); dieses Issue ist der Weg, auf ' +
              'dem ein Fehlschlag repariert wird. Es wird automatisch geschlossen, sobald ein Lauf ' +
              'wieder grün ist.';

            const { data: issuesAndPrs } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'e2e',
              per_page: 100,
            });
            const existing = issuesAndPrs.find(i => !i.pull_request && i.body && i.body.includes(marker));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: commentBody,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'E2E-Suite auf main fehlgeschlagen (automatischer Lauf)',
                body: issueBody,
                labels: ['e2e', 'bug'],
              });
            }

      - name: Alarm-Issue bei erneutem Bestehen schließen
        if: success()
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- e2e-alert -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issuesAndPrs } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'e2e',
              per_page: 100,
            });
            const existing = issuesAndPrs.find(i => !i.pull_request && i.body && i.body.includes(marker));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Die E2E-Suite ist wieder grün: ${runUrl}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
              });
            }
