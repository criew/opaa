name: Dependency Graph einreichen

# Submits the graphs that dependency-graph.yml generated for a PR head (Gradle and pnpm
# lockfiles), so the dependency review in ci.yml compares base and head with transitive
# dependencies. Runs from main's workflow file with a write token and never checks out or
# executes PR code; the artifacts are untrusted input from the PR (fork PRs included).
# Each snapshot gets the sha and ref of a PR whose current head is the run's head commit, so a
# crafted artifact can at most misdescribe that PR's own graph, never main's.
on:
  workflow_run:
    workflows: [Dependency Graph]
    types: [completed]

permissions:
  contents: read

jobs:
  submit:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dependency-graph_*
          path: ${{ runner.temp }}/graphs
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Snapshots einreichen
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/graphs"
          pr=$(cat dependency-graph_pnpm-lockfiles/pr-number)
          if ! [[ "$pr" =~ ^[1-9][0-9]{0,9}$ ]]; then
            echo "::error::Ungültige PR-Nummer im Artefakt"
            exit 1
          fi
          pr_head=$(gh api "repos/$REPO/pulls/$pr" --jq '.head.sha')
          if [ "$pr_head" != "$HEAD_SHA" ]; then
            echo "PR #$pr steht nicht mehr auf $HEAD_SHA (jetzt $pr_head), nichts eingereicht."
            exit 0
          fi
          shopt -s globstar nullglob
          files=(./**/*.json)
          if [ "${#files[@]}" -ne 2 ]; then
            echo "::error::Erwartet zwei Snapshots (Gradle, pnpm), gefunden ${#files[@]}"
            exit 1
          fi
          for file in "${files[@]}"; do
            jq --arg sha "$HEAD_SHA" --arg ref "refs/pull/$pr/merge" --arg run "$RUN_ID" \
              '.sha = $sha | .ref = $ref | .job.id = $run' "$file" >"$file.submit"
            gh api -X POST "repos/$REPO/dependency-graph/snapshots" --input "$file.submit" \
              --jq '"\(.message) (\(.result))"'
          done
