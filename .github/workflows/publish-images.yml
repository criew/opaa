name: Publish Images

on:
  push:
    branches: [main]
    # A release (docs/releases.md): vX.Y.Z publishes the images as X.Y.Z and X.Y, the Helm chart as
    # X.Y.Z and opens the GitHub release. The format and the origin of the tag are checked in the
    # job, not here, so a malformed tag fails visibly instead of being ignored.
    tags: ['v*']
  # Weekly rebuild without a code change: the runtime stage pulls the OS security updates of the
  # build day (issue #1450), so a published image is otherwise only as current as the last push to
  # main. Scheduled well ahead of cve-scan.yml's 03:30 run so the nightly Trivy scan sees the fresh
  # image, and off the top of the hour (GitHub throttles schedules on :00).
  schedule:
    - cron: '50 1 * * 1'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # Runs once, before any image is built: the release guard and the tags, labels and annotations of
  # both images. Checked here instead of in each build job, so the guard runs exactly once and
  # nothing is pushed - not even an untagged digest - before it has passed.
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The registry lookups below run with the same token rights as the pushes they protect.
      packages: write
    outputs:
      image-prefix: ${{ steps.prefix.outputs.image-prefix }}
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      annotations: ${{ steps.meta.outputs.annotations }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The release guard below needs main's history to tell whether the tag lies on it.
          fetch-depth: ${{ startsWith(github.ref, 'refs/tags/') && '0' || '1' }}

      # Lower case like the names metadata-action derives: a push by digest takes the name verbatim,
      # and an OCI repository name has no upper case.
      - name: Image-Präfix bestimmen
        id: prefix
        env:
          PREFIX: ${{ env.REGISTRY }}/${{ github.repository_owner }}/opaa
        run: echo "image-prefix=$(tr '[:upper:]' '[:lower:]' <<<"$PREFIX")" >>"$GITHUB_OUTPUT"

      # A version tag is immutable: an image or chart already published as X.Y.Z is never rebuilt
      # over, whether by a re-pushed tag or a dispatch on the tag ref. The chart is checked here as
      # well, so a taken chart version or a refused lookup (e.g. 403) stops the release before any
      # image is pushed. oci-published.sh counts only HTTP 404 as free; any other answer fails the
      # run rather than risking an overwrite.
      - name: Release-Tag prüfen
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
          PREFIX: ${{ steps.prefix.outputs.image-prefix }}
          CHART: ${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/opaa
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        # The chart reference stays as given, so an owner with upper case fails the lookup before
        # any image is pushed.
        run: |
          if ! deploy/helm/ci/release-version.sh "$TAG" >/dev/null; then
            echo "::error::Tag $TAG ist keine Version vX.Y.Z bzw. vX.Y.Z-<vorab> (docs/releases.md)"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG zeigt auf einen Commit, der nicht auf main liegt (docs/releases.md)"
            exit 1
          fi
          for ref in "$PREFIX-backend" "$PREFIX-frontend" "$CHART"; do
            if ! published=$(deploy/helm/ci/oci-published.sh "$ref" "${TAG#v}"); then
              echo "::error::Abfrage von $ref:${TAG#v} fehlgeschlagen, siehe Meldung oben (docs/releases.md)"
              exit 1
            elif [[ "$published" == true ]]; then
              echo "::error::$ref:${TAG#v} ist bereits veröffentlicht; Versions-Tags werden nie überschrieben"
              exit 1
            fi
          done

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          # The annotations go onto the manifest index publish creates; the labels go into the image
          # of every platform.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: |
            ${{ steps.prefix.outputs.image-prefix }}-backend
            ${{ steps.prefix.outputs.image-prefix }}-frontend
          # A scheduled rebuild republishes the tags of a commit that already has an image; both
          # tags move to the new digest together, so sha-<commit> is always the newest build of that
          # commit and never diverges from :main. A release build leaves sha-<commit> alone for the
          # same reason. The digest stays the stable identity of a build.
          # On a release tag: X.Y.Z (immutable, see the guard above) and X.Y (moves with each patch
          # release); a pre-release only gets its full version. No "latest": whoever does not pin a
          # version follows main.
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,format=long,enable=${{ github.ref_type != 'tag' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=false

      # metadata-action drops a version it does not accept as SemVer with a warning only (e.g.
      # v1.0.0-rc.01); the release job would then announce an image that was never pushed.
      - name: Versions-Tag prüfen
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
          TAGS: ${{ steps.meta.outputs.tags }}
          PREFIX: ${{ steps.prefix.outputs.image-prefix }}
        run: |
          for image in "$PREFIX-backend" "$PREFIX-frontend"; do
            if ! grep -qxF "$image:${TAG#v}" <<<"$TAGS"; then
              echo "::error::Aus $TAG entsteht kein Image-Tag ${TAG#v}; keine gültige SemVer-Version (docs/releases.md)"
              exit 1
            fi
          done

  # One job per image and architecture, each on a runner of that architecture: Gradle and jlink under
  # QEMU emulation take several times as long (docs/releases.md). A job pushes its image by digest
  # only, without a tag; publish joins the digests of an image into one manifest index.
  build:
    name: build (${{ matrix.image.name }}, ${{ matrix.platform.arch }})
    needs: prepare
    runs-on: ${{ matrix.platform.runner }}
    # Only runs building the very same commit may cancel each other - a scheduled and a push run of
    # the same tip, where the slower one would otherwise push last and leave :main on the older
    # build. github.sha keeps a run for an earlier commit alive, so every pushed commit gets its
    # sha-<commit> image; image and architecture keep the build jobs from cancelling each other.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}-build-${{ matrix.image.name }}-${{ matrix.platform.arch }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image:
          # Repo-root context for both (issue #896): backend's Gradle build depends on the sibling
          # opaa-api/ module via settings.gradle.kts, so a context scoped to backend/ alone would
          # not see it.
          - name: backend
            dockerfile: backend/Dockerfile
          - name: frontend
            dockerfile: frontend/Dockerfile
        # The platforms of the published images; publish refuses an index without exactly these
        # (EXPECTED_PLATFORMS there).
        platform:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE: ${{ needs.prepare.outputs.image-prefix }}-${{ matrix.image.name }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/${{ matrix.platform.arch }}
          labels: ${{ needs.prepare.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # SBOM and provenance attestations are attached per platform and carried over into the
          # index by publish; retrieval is documented in docs/sbom.md.
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          # The frontend's runtime stage applies the OS security updates of the build day (issue
          # #1450); a cache hit on that layer would republish the state of an arbitrarily old
          # build, so this one stage is always rebuilt while every earlier stage keeps its cache.
          # The backend's runtime stage has no package manager left to update since #1459 - it is
          # kept out of the cache for the same effect one level down: the distroless base is
          # re-resolved and re-fetched instead of an old layer being reused.
          no-cache-filters: runtime

      - name: Digest ablegen
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.platform.arch }}
        run: |
          if ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Kein Digest für $IMAGE (linux/$ARCH): '$DIGEST'"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
          echo "$IMAGE@$DIGEST"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          # Long enough for "Re-run failed jobs" of publish days later; the digests stay in GHCR.
          retention-days: 7
          # "Re-run failed jobs" reuses the run and would otherwise collide with the artifact name
          # already uploaded by the first attempt.
          overwrite: true

  # Joins the platform digests of one image into a manifest index and gives the index the tags -
  # the first moment a tag of this run appears. Each platform's SBOM and provenance attestation
  # moves into the index along with its image.
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}-publish-${{ matrix.name }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    strategy:
      # A failed index of one image must not cancel the other's half-way through its tags.
      fail-fast: false
      matrix:
        name: [backend, frontend]
    env:
      IMAGE: ${{ needs.prepare.outputs.image-prefix }}-${{ matrix.name }}
      # Sorted, space-separated; must match the platform list of the build matrix.
      EXPECTED_PLATFORMS: linux/amd64 linux/arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: digests-${{ matrix.name }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The guard in prepare ran before the builds; asked again right before the tag is set, a
      # version published meanwhile - or by an earlier attempt of this job - is not overwritten.
      - name: Versions-Tag noch frei
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! published=$(deploy/helm/ci/oci-published.sh "$IMAGE" "${TAG#v}"); then
            echo "::error::Abfrage von $IMAGE:${TAG#v} fehlgeschlagen, siehe Meldung oben (docs/releases.md)"
            exit 1
          elif [[ "$published" == true ]]; then
            echo "::error::$IMAGE:${TAG#v} ist bereits veröffentlicht; Versions-Tags werden nie überschrieben"
            exit 1
          fi

      - name: Manifest-Index anlegen
        env:
          TAGS: ${{ needs.prepare.outputs.tags }}
          ANNOTATIONS: ${{ needs.prepare.outputs.annotations }}
        run: |
          tags=()
          args=()
          while IFS= read -r tag; do
            if [[ "$tag" == "$IMAGE:"* ]]; then
              tags+=("$tag")
              args+=(--tag "$tag")
            fi
          done <<<"$TAGS"
          if ((${#tags[@]} == 0)); then
            echo "::error::Kein Tag für $IMAGE in der Ausgabe von metadata-action"
            exit 1
          fi
          while IFS= read -r annotation; do
            if [[ -n "$annotation" ]]; then
              args+=(--annotation "$annotation")
            fi
          done <<<"$ANNOTATIONS"
          sources=()
          for file in "$RUNNER_TEMP"/digests/*; do
            sources+=("$IMAGE@sha256:$(basename "$file")")
          done
          # Checked on the dry run, so no tag ever points at an index that lacks a platform.
          platforms=$(docker buildx imagetools create --dry-run "${args[@]}" "${sources[@]}" |
            jq -r '[.manifests[].platform | select(.os != "unknown") | "\(.os)/\(.architecture)"] | sort | join(" ")')
          if [[ "$platforms" != "$EXPECTED_PLATFORMS" ]]; then
            echo "::error::Index für $IMAGE enthält '$platforms' statt '$EXPECTED_PLATFORMS'"
            exit 1
          fi
          docker buildx imagetools create "${args[@]}" "${sources[@]}"
          # Report only: once the tags are set, a red job would invite a re-run that the version
          # check above then refuses.
          docker buildx imagetools inspect "${tags[0]}" ||
            echo "::warning::Index ${tags[0]} ist gesetzt, ließ sich aber nicht anzeigen"

  # The chart follows the images, so it never points at an image that failed to publish. Chart
  # version, appVersion and the default image tags are the release version (ADR-0042,
  # Entscheidung 7). On the first attempt an existing chart version fails the job like the guard in
  # publish. A re-run of this job that finds the version published skips the push and carries on
  # with the digest from the registry, so attestation and release can still follow - provided the
  # published chart has the content of this commit's package; otherwise the job fails.
  chart:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    env:
      TAG: ${{ github.ref_name }}
      CHART_REPOSITORY: ghcr.io/${{ github.repository_owner }}/charts
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          # renovate: datasource=github-releases depName=helm/helm
          version: v4.3.0

      - name: Bei GHCR anmelden
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: helm registry login ghcr.io --username "$REGISTRY_USER" --password-stdin <<<"$REGISTRY_PASSWORD"

      - name: Chart-Version prüfen
        id: check
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ref="$CHART_REPOSITORY/opaa:${TAG#v}"
          if ! published=$(deploy/helm/ci/oci-published.sh "$CHART_REPOSITORY/opaa" "${TAG#v}"); then
            echo "::error::Abfrage von $ref fehlgeschlagen, siehe Meldung oben (docs/releases.md)"
            exit 1
          fi
          if [[ "$published" == true ]] && ((RUN_ATTEMPT == 1)); then
            echo "::error::$ref ist bereits veröffentlicht; Versions-Tags werden nie überschrieben"
            exit 1
          fi
          echo "published=$published" >>"$GITHUB_OUTPUT"

      - name: Chart packen
        id: package
        env:
          IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/opaa
        run: |
          package=$(deploy/helm/ci/package-chart.sh "$TAG" "$RUNNER_TEMP/chart")
          echo "path=$package" >>"$GITHUB_OUTPUT"

      - name: Chart veröffentlichen
        if: steps.check.outputs.published == 'false'
        env:
          PACKAGE: ${{ steps.package.outputs.path }}
        run: helm push "$PACKAGE" "oci://$CHART_REPOSITORY"

      # Read back from the registry rather than taken from the push, so a re-run that skipped the
      # push attests exactly the chart that is published - and only if that chart has the content
      # this commit packages. A chart of another commit under the same version is never attested.
      - name: Digest des Charts bestimmen
        id: digest
        env:
          PACKAGE: ${{ steps.package.outputs.path }}
          PUBLISHED: ${{ steps.check.outputs.published }}
        run: |
          ref="$CHART_REPOSITORY/opaa:${TAG#v}"
          mkdir -p "$RUNNER_TEMP/pulled"
          if ! out=$(helm pull "oci://$CHART_REPOSITORY/opaa" --version "${TAG#v}" --destination "$RUNNER_TEMP/pulled" 2>&1); then
            echo "::error::$ref ließ sich nicht abrufen: $out"
            exit 1
          fi
          digest=$(sed -n 's/^Digest: *//p' <<<"$out")
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Kein Digest für $ref: $out"
            exit 1
          fi
          rc=0
          deploy/helm/ci/chart-matches.sh "$PACKAGE" "$RUNNER_TEMP/pulled/$(basename "$PACKAGE")" || rc=$?
          if ((rc == 1)); then
            echo "::error::$ref weicht inhaltlich vom Chart dieses Commits ab und wird nicht attestiert; die Version ist vergeben (docs/releases.md)"
            exit 1
          elif ((rc != 0)); then
            echo "::error::$ref ließ sich nicht mit dem Chart dieses Commits vergleichen, siehe Meldung oben; nichts attestiert, der Job ist wiederholbar"
            exit 1
          fi
          if [[ "$PUBLISHED" == true ]]; then
            echo "::notice::$ref stimmt inhaltlich mit dem Chart dieses Commits überein; der Push entfällt"
          fi
          echo "$ref@$digest"
          echo "digest=$digest" >>"$GITHUB_OUTPUT"

  # Signed SLSA provenance for the chart, stored with GitHub and next to the chart in GHCR. Kept out
  # of the chart job so that a failed attestation can be re-run without touching the pushed chart.
  chart-attestation:
    needs: chart
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      packages: write
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/opaa
          subject-digest: ${{ needs.chart.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  # The GitHub release follows images and chart, so its notes never announce an artifact that failed
  # to publish. Notes are generated from the merged PRs, grouped by .github/release.yml.
  release:
    needs: [publish, chart, chart-attestation]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: GitHub-Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          version="${TAG#v}"
          notes=$(cat <<EOF
          **Images** (\`linux/amd64\`, \`linux/arm64\`)
          - \`ghcr.io/${OWNER}/opaa-backend:${version}\`
          - \`ghcr.io/${OWNER}/opaa-frontend:${version}\`

          **Helm-Chart**
          - \`oci://ghcr.io/${OWNER}/charts/opaa\`, Version \`${version}\`

          \`\`\`bash
          helm install opaa oci://ghcr.io/${OWNER}/charts/opaa --version ${version} \\
            -n opaa --create-namespace -f meine-werte.yaml
          \`\`\`

          Vor dem Update die Vorbereitungsschritte für Bestandsinstallationen im Handbuch prüfen (docs/handbuch/deployment.md).
          EOF
          )
          flags=(--verify-tag --title "OPAA ${TAG}")
          # Without an earlier release the generated notes would span the whole history, beyond
          # what a release body may hold; the first release therefore carries the fixed text alone.
          if [ "$(gh release list --limit 1 --json tagName --jq length)" = "0" ]; then
            flags+=(--notes "$(printf '%s\n\n%s' 'Erstes Release von OPAA.' "$notes")")
          else
            flags+=(--generate-notes --notes "$notes")
          fi
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "$TAG" "${flags[@]}"
