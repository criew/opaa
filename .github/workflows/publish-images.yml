name: Publish Images

on:
  push:
    branches: [main]
    # A release (docs/releases.md): vX.Y.Z publishes the images as X.Y.Z and X.Y, the Helm chart as
    # X.Y.Z and opens the GitHub release. The format and the origin of the tag are checked in the
    # job, not here, so a malformed tag fails visibly instead of being ignored.
    tags: ['v*']
  # Weekly rebuild without a code change: the runtime stage pulls the OS security updates of the
  # build day, so a published image is otherwise only as current as the last push to main.
  # Scheduled well ahead of cve-scan.yml's 03:30 run so the nightly Trivy scan sees the fresh
  # image, and off the top of the hour (GitHub throttles schedules on :00).
  schedule:
    - cron: '50 1 * * 1'
  workflow_dispatch:

# No job inherits a right: each one names what it needs in its own permissions: block.
permissions: {}

env:
  REGISTRY: ghcr.io

jobs:
  # Runs once, before any image is built: the release guard and the tags, labels and annotations of
  # both images. Checked here instead of in each build job, so the guard runs exactly once and
  # nothing is pushed - not even an untagged digest - before it has passed.
  prepare:
    runs-on: ubuntu-latest
    # The jobs besides build only look up, tag, push a chart or attest, each in seconds to minutes;
    # their limits leave ample room and only stop a hung step.
    timeout-minutes: 10
    permissions:
      contents: read
      # The registry lookups below run with the same token rights as the pushes they protect.
      packages: write
    outputs:
      image-prefix: ${{ steps.prefix.outputs.image-prefix }}
      # X.Y.Z[-<pre>] on a release tag, empty otherwise.
      version: ${{ steps.release.outputs.version }}
      # The version backend and frontend report: the release version on a tag, otherwise
      # 0.0.0-dev+<commit>, so a main image names the state it was built from.
      build-version: ${{ steps.release.outputs.version || steps.dev-version.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      annotations: ${{ steps.meta.outputs.annotations }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release guard below needs the history of main and of every release/X.Y branch.
          fetch-depth: ${{ startsWith(github.ref, 'refs/tags/') && '0' || '1' }}
          persist-credentials: false

      # A maintenance branch publishes only through a tag on it (docs/releases.md, "Backport"); a
      # dispatch there would otherwise push sha-<commit> images of the line.
      - name: Lauf auf Wartungsbranch ablehnen
        if: startsWith(github.ref, 'refs/heads/release/')
        env:
          REF: ${{ github.ref_name }}
        run: |
          echo "::error::$REF ist ein Wartungsbranch; er veröffentlicht nur über ein Tag vX.Y.Z (docs/releases.md)"
          exit 1

      # Lower case like the names metadata-action derives: a push by digest takes the name verbatim,
      # and an OCI repository name has no upper case.
      - name: Image-Präfix bestimmen
        id: prefix
        env:
          PREFIX: ${{ env.REGISTRY }}/${{ github.repository_owner }}/opaa
        run: echo "image-prefix=$(tr '[:upper:]' '[:lower:]' <<<"$PREFIX")" >>"$GITHUB_OUTPUT"

      # A version tag is immutable: an image or chart already published as X.Y.Z is never rebuilt
      # over, whether by a re-pushed tag or a dispatch on the tag ref. The chart is checked here as
      # well, so a taken chart version or a refused lookup (e.g. 403) stops the release before any
      # image is pushed. oci-published.sh counts only HTTP 404 as free; any other answer fails the
      # run rather than risking an overwrite.
      - name: Release-Tag prüfen
        id: release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
          PREFIX: ${{ steps.prefix.outputs.image-prefix }}
          CHART: ${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/opaa
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        # The chart reference stays as given, so an owner with upper case fails the lookup before
        # any image is pushed.
        run: |
          if ! version=$(deploy/helm/ci/release-version.sh "$TAG"); then
            echo "::error::Tag $TAG ist keine Version vX.Y.Z bzw. vX.Y.Z-<vorab> (docs/releases.md)"
            exit 1
          fi
          # main or release/X.Y of exactly the tag's line; the script names the error.
          branch=$(.github/scripts/release_origin.sh "$TAG" "$GITHUB_SHA")
          echo "$TAG liegt auf $branch"
          # The release job builds the same notes only after the images are out; fail before.
          if ! deploy/helm/ci/release-notes.sh "$GITHUB_REPOSITORY" "$TAG" >/dev/null; then
            echo "::error::Release-Notizen für $TAG lassen sich nicht erzeugen, siehe Meldung oben (docs/releases.md)"
            exit 1
          fi
          for ref in "$PREFIX-backend" "$PREFIX-frontend" "$CHART"; do
            if ! published=$(deploy/helm/ci/oci-published.sh "$ref" "${TAG#v}"); then
              echo "::error::Abfrage von $ref:${TAG#v} fehlgeschlagen, siehe Meldung oben (docs/releases.md)"
              exit 1
            elif [[ "$published" == true ]]; then
              echo "::error::$ref:${TAG#v} ist bereits veröffentlicht; Versions-Tags werden nie überschrieben"
              exit 1
            fi
          done
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Entwicklungsversion bestimmen
        id: dev-version
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: echo "version=0.0.0-dev+${GITHUB_SHA::7}" >>"$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # The annotations go onto the manifest index publish creates; the labels go into the image
          # of every platform.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: |
            ${{ steps.prefix.outputs.image-prefix }}-backend
            ${{ steps.prefix.outputs.image-prefix }}-frontend
          # A scheduled rebuild republishes the tags of a commit that already has an image; both
          # tags move to the new digest together, so sha-<commit> is always the newest build of that
          # commit and never diverges from :main. A release build leaves sha-<commit> alone for the
          # same reason. The digest stays the stable identity of a build.
          # On a release tag: X.Y.Z (immutable, see the guard above) and X.Y, derived from the tag
          # itself and so moving only within its line, on main and on release/X.Y alike; a
          # pre-release only gets its full version. No "latest": whoever does not pin a version
          # follows main.
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,format=long,enable=${{ github.ref_type != 'tag' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=false

      # metadata-action drops a version it does not accept as SemVer with a warning only (e.g.
      # v1.0.0-rc.01); the release job would then announce an image that was never pushed.
      - name: Versions-Tag prüfen
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
          TAGS: ${{ steps.meta.outputs.tags }}
          PREFIX: ${{ steps.prefix.outputs.image-prefix }}
        run: |
          for image in "$PREFIX-backend" "$PREFIX-frontend"; do
            if ! grep -qxF "$image:${TAG#v}" <<<"$TAGS"; then
              echo "::error::Aus $TAG entsteht kein Image-Tag ${TAG#v}; keine gültige SemVer-Version (docs/releases.md)"
              exit 1
            fi
          done

  # One job per image and architecture, each on a runner of that architecture: Gradle and jlink under
  # QEMU emulation take several times as long (docs/releases.md). A job pushes its image by digest
  # only, without a tag; publish joins the digests of an image into one manifest index.
  build:
    name: build (${{ matrix.image.name }}, ${{ matrix.platform.arch }})
    needs: prepare
    runs-on: ${{ matrix.platform.runner }}
    # A leg takes 1-4 minutes, a cold one (release tag, or the cache evicted after 7 days without
    # access) up to about six. A hung leg is cancelled instead of holding the run for hours;
    # "Re-run failed jobs" resumes the run.
    timeout-minutes: 30
    # Only runs building the very same commit may cancel each other - a scheduled and a push run of
    # the same tip, where the slower one would otherwise push last and leave :main on the older
    # build. github.sha keeps a run for an earlier commit alive, so every pushed commit gets its
    # sha-<commit> image; image and architecture keep the build jobs from cancelling each other.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}-build-${{ matrix.image.name }}-${{ matrix.platform.arch }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image:
          # Repo-root context for both: backend's Gradle build depends on the sibling opaa-api/
          # module via settings.gradle.kts, so a context scoped to backend/ alone would not see
          # it.
          - name: backend
            dockerfile: backend/Dockerfile
          - name: frontend
            dockerfile: frontend/Dockerfile
        # The platforms of the published images; publish refuses an index without exactly these
        # (EXPECTED_PLATFORMS there).
        platform:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE: ${{ needs.prepare.outputs.image-prefix }}-${{ matrix.image.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/${{ matrix.platform.arch }}
          labels: ${{ needs.prepare.outputs.labels }}
          # Backend and frontend report the version of the release tag, outside a release
          # 0.0.0-dev+<commit>. The Dockerfiles declare the argument after their dependency layers,
          # so a new commit rebuilds only the build step, which its changed sources rebuild anyway;
          # the weekly rebuild of an unchanged commit keeps the same value and cache key. The full
          # commit is read only by the backend's last stage (data collection disclosure), so no
          # build layer depends on it.
          build-args: |
            OPAA_VERSION=${{ needs.prepare.outputs.build-version }}
            OPAA_COMMIT=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # SBOM and provenance attestations are attached per platform and carried over into the
          # index by publish; retrieval is documented in docs/sbom.md.
          sbom: true
          provenance: mode=max
          # A release tag builds without the gha cache: every job that runs on main may write there,
          # whatever scope it names, and a tag run restores from main's cache (docs/renovate.md).
          cache-from: ${{ github.ref_type != 'tag' && format('type=gha,scope={0}-{1}', matrix.image.name, matrix.platform.arch) || '' }}
          cache-to: ${{ github.ref_type != 'tag' && format('type=gha,mode=max,scope={0}-{1}', matrix.image.name, matrix.platform.arch) || '' }}
          # The frontend's runtime stage applies the OS security updates of the build day; a
          # cache hit on that layer would republish the state of an arbitrarily old build, so
          # this one stage is always rebuilt while every earlier stage keeps its cache. The
          # backend's runtime stage has no package manager left to update - it is
          # kept out of the cache for the same effect one level down: the distroless base is
          # re-resolved and re-fetched instead of an old layer being reused.
          no-cache-filters: runtime

      - name: Digest ablegen
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.platform.arch }}
        run: |
          if ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Kein Digest für $IMAGE (linux/$ARCH): '$DIGEST'"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
          echo "$IMAGE@$DIGEST"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          # Long enough for "Re-run failed jobs" of publish days later; the digests stay in GHCR.
          retention-days: 7
          # "Re-run failed jobs" reuses the run and would otherwise collide with the artifact name
          # already uploaded by the first attempt.
          overwrite: true

  # The axe results for the accessibility report of the update package (docs/releases.md,
  # "Prüfbericht Barrierefreiheit"): the axe scenarios of the E2E suite against a stack built from
  # the tagged commit. A finding is recorded in the report and never fails the release; only a run
  # that measured nothing does. No cache, like every build of a release.
  accessibility:
    needs: prepare
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    uses: ./.github/workflows/accessibility-report.yml

  # The update package for authorities (docs/releases.md, "Update-Paket"): runs the completeness
  # guard of the compliance manifest, then update_package.py builds fact sheets, delta to the
  # previous final release, license overview, the CycloneDX SBOMs of backend and frontend, the
  # templates for authorities and the handbook, each also as HTML, into one archive; the SBOMs also
  # lie beside it for the release.
  # publish waits for this job, so an incomplete manifest stops a release before any tag is set. Like the
  # image builds of a release it takes nothing from a cache: no Gradle, pnpm or gha cache.
  update-package:
    needs: [prepare, accessibility]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Gradle and pnpm start cold; the guard and the package take about five to ten minutes.
    timeout-minutes: 30
    permissions:
      contents: read
      # gh pr list reads the pull requests labelled data-impact for the delta.
      pull-requests: read
    env:
      # No Gradle daemon outlives a step, the call from update_package.py included.
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The previous release and the delta need every tag and the history between them.
          fetch-depth: 0
          persist-credentials: false

      # Before any Gradle or pnpm step, so no build code runs while the token is in use. A list
      # that reaches the limit may be cut off; the run fails rather than drop a labelled PR.
      - name: Gekennzeichnete Pull Requests abfragen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LIMIT: 1000
        run: |
          gh pr list --state merged --label data-impact --limit "$LIMIT" --json number,title,url >"$RUNNER_TEMP/data-impact-prs.json"
          count=$(jq length "$RUNNER_TEMP/data-impact-prs.json")
          if ((count >= LIMIT)); then
            echo "::error::$count PRs mit data-impact erreichen das Limit $LIMIT; die Liste kann abgeschnitten sein, Limit im Workflow erhöhen"
            exit 1
          fi
          echo "$count PRs mit data-impact"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.4+101.0.LTS'

      # Installs the pnpm version pinned in the "packageManager" field of frontend/package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15'

      # markdown-it-py renders the HTML version of the package: wheels only, every package with
      # its dependencies pinned by hash, nothing resolved at install time.
      - name: Python-Pakete des Update-Pakets installieren
        run: |
          pip install --require-hashes --only-binary=:all: --no-deps -r .github/requirements-release.txt

      # The same guard as in every backend test run: manifest against schema, audit events, roles,
      # prompts, data flows and configuration keys, and the placeholder targets of docs/behoerden/.
      - name: Vollständigkeitswächter des Fakten-Manifests
        working-directory: backend
        run: >-
          ./gradlew :test
          --tests 'io.opaa.compliance.ComplianceManifestTest'
          --tests 'io.opaa.compliance.ConfigurationSettingsTest'
          --tests 'io.opaa.compliance.FactSheetReferenceTest'
          --tests 'io.opaa.architecture.ModularArchitectureTest'

      # The frontend license overview reads the installed production dependencies.
      - name: Frontend-Abhängigkeiten installieren
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # cdxgen for the frontend SBOM, every package fixed by its lockfile; no install scripts and
      # no optional platform binaries, which the pnpm scan does not use. Same install as sbom.yml.
      - name: cdxgen installieren
        working-directory: .github/tools/cdxgen
        run: pnpm install --frozen-lockfile --ignore-scripts --no-optional

      # Mermaid and playwright-core for the diagrams of the HTML version, drawn in the runner's
      # Google Chrome; same install as cdxgen.
      - name: Mermaid installieren
        working-directory: .github/tools/mermaid
        run: pnpm install --frozen-lockfile --ignore-scripts --no-optional

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: accessibility-results
          path: ${{ runner.temp }}/accessibility-results

      - name: Update-Paket erzeugen
        env:
          TAG: ${{ github.ref_name }}
        run: >-
          python3 .github/scripts/update_package.py build
          --tag "$TAG"
          --out "$RUNNER_TEMP/update-package"
          --labelled-prs "$RUNNER_TEMP/data-impact-prs.json"
          --repository "$GITHUB_REPOSITORY"
          --accessibility "$RUNNER_TEMP/accessibility-results"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-package
          path: ${{ runner.temp }}/update-package/*
          if-no-files-found: error
          retention-days: 7
          # "Re-run failed jobs" builds the same files again under the same name, except delta-lts/
          # when a patch of the previous LTS line was tagged in between: its base is chosen per run.
          overwrite: true

  # Signed SLSA provenance for the archive and the SBOMs beside it, stored with GitHub, so
  # `gh attestation verify` ties each asset of the release to this workflow and commit. Kept apart
  # from update-package, so no step that runs Gradle or pnpm ever holds the OIDC token.
  update-package-attestation:
    needs: update-package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: update-package
          path: ${{ runner.temp }}/update-package

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/update-package/*.tar.gz
            ${{ runner.temp }}/update-package/*.cdx.json

  # Joins the platform digests of one image into a manifest index and gives the index the tags -
  # the first moment a tag of this run appears. Each platform's SBOM and provenance attestation
  # moves into the index along with its image.
  publish:
    needs: [prepare, build, update-package]
    # update-package runs on release tags only; elsewhere its skip must not skip publish. On a tag
    # only a built package sets tags: a failed one, and a skipped one because the accessibility run
    # failed before it, keeps every tag unset.
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.update-package.result == 'success' || (needs.update-package.result == 'skipped' && !startsWith(github.ref, 'refs/tags/'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}-publish-${{ matrix.name }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    strategy:
      # A failed index of one image must not cancel the other's half-way through its tags.
      fail-fast: false
      matrix:
        name: [backend, frontend]
    env:
      IMAGE: ${{ needs.prepare.outputs.image-prefix }}-${{ matrix.name }}
      # Sorted, space-separated; must match the platform list of the build matrix.
      EXPECTED_PLATFORMS: linux/amd64 linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-${{ matrix.name }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The guard in prepare ran before the builds; asked again right before the tag is set, a
      # version published meanwhile - or by an earlier attempt of this job - is not overwritten.
      - name: Versions-Tag noch frei
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! published=$(deploy/helm/ci/oci-published.sh "$IMAGE" "${TAG#v}"); then
            echo "::error::Abfrage von $IMAGE:${TAG#v} fehlgeschlagen, siehe Meldung oben (docs/releases.md)"
            exit 1
          elif [[ "$published" == true ]]; then
            echo "::error::$IMAGE:${TAG#v} ist bereits veröffentlicht; Versions-Tags werden nie überschrieben"
            exit 1
          fi

      - name: Manifest-Index anlegen
        env:
          TAGS: ${{ needs.prepare.outputs.tags }}
          ANNOTATIONS: ${{ needs.prepare.outputs.annotations }}
        # :main is set only while this run's commit is still the tip of main, so an older run that
        # finishes late, a re-run or a rebuild overtaken by a push never moves it backwards. Asked
        # right before the tags are set; docs/releases.md describes the remaining window.
        # The filter's messages are replayed on stdout, where the runner reads workflow commands.
        run: |
          rc=0
          TAGS=$(.github/scripts/drop_stale_main_tag.sh "$IMAGE" "$GITHUB_SHA" <<<"$TAGS" 2>"$RUNNER_TEMP/main-tag.log") || rc=$?
          cat "$RUNNER_TEMP/main-tag.log"
          if ((rc != 0)); then
            exit 1
          fi
          tags=()
          args=()
          while IFS= read -r tag; do
            if [[ "$tag" == "$IMAGE:"* ]]; then
              tags+=("$tag")
              args+=(--tag "$tag")
            fi
          done <<<"$TAGS"
          if ((${#tags[@]} == 0)); then
            echo "::error::Kein Tag für $IMAGE in der Ausgabe von metadata-action"
            exit 1
          fi
          while IFS= read -r annotation; do
            if [[ -n "$annotation" ]]; then
              args+=(--annotation "$annotation")
            fi
          done <<<"$ANNOTATIONS"
          sources=()
          for file in "$RUNNER_TEMP"/digests/*; do
            sources+=("$IMAGE@sha256:$(basename "$file")")
          done
          # Checked on the dry run, so no tag ever points at an index that lacks a platform.
          platforms=$(docker buildx imagetools create --dry-run "${args[@]}" "${sources[@]}" |
            jq -r '[.manifests[].platform | select(.os != "unknown") | "\(.os)/\(.architecture)"] | sort | join(" ")')
          if [[ "$platforms" != "$EXPECTED_PLATFORMS" ]]; then
            echo "::error::Index für $IMAGE enthält '$platforms' statt '$EXPECTED_PLATFORMS'"
            exit 1
          fi
          docker buildx imagetools create "${args[@]}" "${sources[@]}"
          # Report only: once the tags are set, a red job would invite a re-run that the version
          # check above then refuses.
          docker buildx imagetools inspect "${tags[0]}" ||
            echo "::warning::Index ${tags[0]} ist gesetzt, ließ sich aber nicht anzeigen"

  # The index digest of each published image, read back by a tag this run set: X.Y.Z on a release
  # tag, which is never overwritten, otherwise sha-<commit>. Attestation and chart take the digests
  # from here, so each of them can be re-run on its own. An explicit result check, since on main
  # the skipped update-package would otherwise skip this job.
  image-digests:
    needs: [prepare, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      backend: ${{ steps.digests.outputs.backend }}
      frontend: ${{ steps.digests.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Index-Digests bestimmen
        id: digests
        env:
          PREFIX: ${{ needs.prepare.outputs.image-prefix }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${VERSION:-sha-$GITHUB_SHA}"
          for name in backend frontend; do
            if ! digest=$(deploy/helm/ci/oci-published.sh --digest "$PREFIX-$name" "$tag"); then
              echo "::error::Digest von $PREFIX-$name:$tag ließ sich nicht bestimmen, siehe Meldung oben"
              exit 1
            fi
            echo "$PREFIX-$name:$tag@$digest"
            echo "$name=$digest" >>"$GITHUB_OUTPUT"
          done

  # Signed SLSA provenance for the manifest index of each image, stored with GitHub and next to the
  # image in GHCR, so `gh attestation verify oci://...` ties the image to this workflow and ref. The
  # index digest also covers the BuildKit SBOM and provenance the index references, and with them
  # the resolved base images. No checkout: no repository code runs next to the OIDC token.
  image-attestation:
    needs: [prepare, image-digests]
    if: ${{ !cancelled() && needs.image-digests.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
      packages: write
    strategy:
      # A failed attestation of one image must not cancel the other's.
      fail-fast: false
      matrix:
        name: [backend, frontend]
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.prepare.outputs.image-prefix }}-${{ matrix.name }}
          subject-digest: ${{ needs.image-digests.outputs[matrix.name] }}
          push-to-registry: true
          create-storage-record: false

  # The chart follows the images, so it never points at an image that failed to publish. Chart
  # version and appVersion are the release version, and the default values pin both images to the
  # index digests published by this run (ADR-0042, Entscheidung 7). On the first attempt an existing chart version fails the job like the guard in
  # publish. A re-run of this job that finds the version published skips the push and carries on
  # with the digest from the registry, so attestation and release can still follow - provided the
  # published chart has the content of this commit's package; otherwise the job fails.
  chart:
    needs: [publish, image-digests]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    env:
      TAG: ${{ github.ref_name }}
      CHART_REPOSITORY: ghcr.io/${{ github.repository_owner }}/charts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # renovate: datasource=github-releases depName=helm/helm
          version: v4.3.1

      - name: Bei GHCR anmelden
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: helm registry login ghcr.io --username "$REGISTRY_USER" --password-stdin <<<"$REGISTRY_PASSWORD"

      - name: Chart-Version prüfen
        id: check
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ref="$CHART_REPOSITORY/opaa:${TAG#v}"
          if ! published=$(deploy/helm/ci/oci-published.sh "$CHART_REPOSITORY/opaa" "${TAG#v}"); then
            echo "::error::Abfrage von $ref fehlgeschlagen, siehe Meldung oben (docs/releases.md)"
            exit 1
          fi
          if [[ "$published" == true ]] && ((RUN_ATTEMPT == 1)); then
            echo "::error::$ref ist bereits veröffentlicht; Versions-Tags werden nie überschrieben"
            exit 1
          fi
          echo "published=$published" >>"$GITHUB_OUTPUT"

      - name: Chart packen
        id: package
        env:
          IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/opaa
          BACKEND_DIGEST: ${{ needs.image-digests.outputs.backend }}
          FRONTEND_DIGEST: ${{ needs.image-digests.outputs.frontend }}
        run: |
          package=$(deploy/helm/ci/package-chart.sh "$TAG" "$RUNNER_TEMP/chart" "$BACKEND_DIGEST" "$FRONTEND_DIGEST")
          echo "path=$package" >>"$GITHUB_OUTPUT"

      - name: Chart veröffentlichen
        if: steps.check.outputs.published == 'false'
        env:
          PACKAGE: ${{ steps.package.outputs.path }}
        run: helm push "$PACKAGE" "oci://$CHART_REPOSITORY"

      # Read back from the registry rather than taken from the push, so a re-run that skipped the
      # push attests exactly the chart that is published - and only if that chart has the content
      # this commit packages. A chart of another commit under the same version is never attested.
      - name: Digest des Charts bestimmen
        id: digest
        env:
          PACKAGE: ${{ steps.package.outputs.path }}
          PUBLISHED: ${{ steps.check.outputs.published }}
        run: |
          ref="$CHART_REPOSITORY/opaa:${TAG#v}"
          mkdir -p "$RUNNER_TEMP/pulled"
          if ! out=$(helm pull "oci://$CHART_REPOSITORY/opaa" --version "${TAG#v}" --destination "$RUNNER_TEMP/pulled" 2>&1); then
            echo "::error::$ref ließ sich nicht abrufen: $out"
            exit 1
          fi
          digest=$(sed -n 's/^Digest: *//p' <<<"$out")
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Kein Digest für $ref: $out"
            exit 1
          fi
          rc=0
          deploy/helm/ci/chart-matches.sh "$PACKAGE" "$RUNNER_TEMP/pulled/$(basename "$PACKAGE")" || rc=$?
          if ((rc == 1)); then
            echo "::error::$ref weicht inhaltlich vom Chart dieses Commits ab und wird nicht attestiert; die Version ist vergeben (docs/releases.md)"
            exit 1
          elif ((rc != 0)); then
            echo "::error::$ref ließ sich nicht mit dem Chart dieses Commits vergleichen, siehe Meldung oben; nichts attestiert, der Job ist wiederholbar"
            exit 1
          fi
          if [[ "$PUBLISHED" == true ]]; then
            echo "::notice::$ref stimmt inhaltlich mit dem Chart dieses Commits überein; der Push entfällt"
          fi
          echo "$ref@$digest"
          echo "digest=$digest" >>"$GITHUB_OUTPUT"

  # Signed SLSA provenance for the chart, stored with GitHub and next to the chart in GHCR. Kept out
  # of the chart job so that a failed attestation can be re-run without touching the pushed chart.
  chart-attestation:
    needs: chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
      packages: write
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/opaa
          subject-digest: ${{ needs.chart.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  # The offline bundle (docs/releases.md, "Offline-Bündel"): the published images of both
  # architectures as OCI archives, chart, update package, SBOMs, their attestations and SHA256SUMS,
  # attested as a whole. Pulled back from GHCR, so it holds exactly what was published.
  offline-bundle:
    needs: [prepare, chart-attestation, update-package-attestation]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/offline-bundle.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      update-package-from-run: true

  # The GitHub release follows images and their attestations, chart, update package and offline
  # bundle, so its notes never announce an artifact that failed to publish or cannot be verified. Notes are generated from the merged PRs, grouped by
  # .github/release.yml; the fixed part with images, chart, installation and update package comes
  # from deploy/helm/ci/release-notes.sh. The attested archive with its .sha256 file, the attested
  # SBOMs and the offline bundle with its .sha256 file and Sigstore bundle become assets.
  release:
    needs: [publish, image-attestation, chart, chart-attestation, update-package-attestation, offline-bundle]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The offline bundle is several hundred megabytes to upload.
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # release_line_info.sh compares the tag with every release tag and the history below it.
          fetch-depth: 0
          # gh reads GH_TOKEN from the step's env; the checkout keeps no token behind.
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: update-package
          path: ${{ runner.temp }}/update-package/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: offline-bundle
          path: ${{ runner.temp }}/offline-bundle/

      - name: GitHub-Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        # "Latest" only for the highest final release, so a patch release of an older line never
        # takes it - and with it the nightly CVE scan target - from the newest line. The generated
        # notes start at the previous final release the commit contains, within a line its
        # previous patch release.
        run: |
          notes=$(deploy/helm/ci/release-notes.sh "$GH_REPO" "$TAG")
          info=$(.github/scripts/release_line_info.sh "$TAG" "$GITHUB_SHA")
          latest=$(sed -n 's/^latest=//p' <<<"$info")
          previous=$(sed -n 's/^previous=//p' <<<"$info")
          flags=(--verify-tag --title "OPAA ${TAG}")
          # Without an earlier release the generated notes would span the whole history, beyond
          # what a release body may hold; the first release therefore carries the fixed text alone.
          if [ "$(gh release list --limit 1 --json tagName --jq length)" = "0" ]; then
            flags+=(--notes "$(printf '%s\n\n%s' 'Erstes Release von OPAA.' "$notes")")
          else
            flags+=(--generate-notes --notes "$notes")
            if [[ -n "$previous" ]]; then flags+=(--notes-start-tag "$previous"); fi
          fi
          if [[ "$TAG" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          else
            flags+=("--latest=$latest")
          fi
          echo "Latest: $latest, Notizen ab: ${previous:-automatisch}"
          gh release create "$TAG" "${flags[@]}" "$RUNNER_TEMP"/update-package/* "$RUNNER_TEMP"/offline-bundle/*
