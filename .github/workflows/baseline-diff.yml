name: Baseline-Diff

# Läuft für JEDEN Pull Request, der eval/baseline/** ändert — unabhängig vom Label 'evaluation'
# (ADR-0013, Entscheidung 6; PR #301 review, zweite Runde). Der eigentliche Retrieval-Regressionsjob
# (.github/workflows/retrieval-regression.yml) läuft nur bei diesem Label, weil er Docker braucht und
# ~17 Minuten dauert; ohne diesen separaten, Docker-freien Workflow würde ein PR, der die Baseline
# unbemerkt absenkt, aber nie das Label bekommt, überhaupt keinen Hinweis erzeugen. Dieser Workflow
# ist stdlib-only Python und braucht keine Minute — kein Grund, ihn ans Label zu koppeln.
on:
  pull_request:
    branches: [main]
    paths:
      - 'eval/baseline/**'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: baseline-diff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Für `git show origin/main:...` unten wird main's Version der Baseline-Datei gebraucht,
          # die ein flacher Checkout (Default fetch-depth: 1, nur der PR-Kopf) nicht auflösen kann.
          fetch-depth: 0

      - name: Baseline-Dateien von main laden
        run: |
          git fetch origin main --depth=1
          mkdir -p build/main-baseline
          # Vereinigung der Dateinamen aus PR-Branch und main, nicht nur der PR-Branch-Seite: sonst
          # bliebe eine auf dem PR-Branch gelöschte oder umbenannte Baseline-Datei unentdeckt, weil
          # niemand mehr nach ihr auf main sucht.
          {
            for f in eval/baseline/*.json; do
              basename "$f"
            done
            git ls-tree --name-only origin/main -- eval/baseline \
              | while read -r path; do
                  case "$path" in
                    *.json) basename "$path" ;;
                  esac
                done
          } | sort -u > build/baseline-files.txt
          # Existiert eine Datei auf main noch nicht (z. B. der allererste PR, der sie einführt),
          # ist das kein Fehler — es gibt dann schlicht nichts, wovon abgesenkt werden könnte.
          while read -r name; do
            git show "origin/main:eval/baseline/$name" > "build/main-baseline/$name" \
              || echo '{"groups":{}}' > "build/main-baseline/$name"
          done < build/baseline-files.txt

      - name: Baseline-Absenkung gegenüber main prüfen
        run: |
          python3 eval/baseline/diff_baseline.py \
            --main-dir build/main-baseline \
            --pr-dir eval/baseline \
            --output build/baseline-diff-vs-main.md \
            --main-ref main \
            --pr-ref "${{ github.head_ref }}"

      - name: Diff-Tabelle der Job-Zusammenfassung hinzufügen
        run: cat build/baseline-diff-vs-main.md >> "$GITHUB_STEP_SUMMARY"

      # continue-on-error (wie in retrieval-regression.yml, PR #301 review): ein Fork-PR hat nur ein
      # schreibgeschütztes Standard-GITHUB_TOKEN, der Kommentar-Versuch scheitert dann mit 403 — das
      # darf den Job nicht als fehlgeschlagen markieren, die Diff-Prüfung selbst ist rein informativ.
      - name: Diff-Tabelle als PR-Kommentar posten
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('build/baseline-diff-vs-main.md', 'utf8');
            // Marker identifiziert den eigenen Kommentar über mehrere Läufe desselben PRs hinweg —
            // ein erneuter Push aktualisiert diesen einen Kommentar statt einen weiteren anzuhängen.
            const marker = '<!-- baseline-diff-comment -->';
            const taggedBody = `${marker}\n${body}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: taggedBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: taggedBody,
              });
            }
