name: OCR-Image

# Builds the OCR image opaa-ocr (ocr/Dockerfile) on a runner of each architecture without pushing
# it, runs the smoke test without network (.github/scripts/ocr_smoke_test.sh), writes the image's
# CycloneDX SBOM and checks the licenses of its Python packages and models
# (.github/scripts/ocr_licenses.sh). publish-images.yml publishes the image; this workflow is the
# proof before the merge, on every pull request and main push that touches the image, and on demand.
on:
  pull_request:
    branches: [main, 'release/**']
    paths:
      - 'ocr/**'
      - '.github/scripts/ocr_*'
      - '.github/scripts/check_licenses.py'
      - '.github/licenses/**'
      - '.github/workflows/ocr-image.yml'
  push:
    branches: [main]
    paths:
      - 'ocr/**'
      - '.github/scripts/ocr_*'
      - '.github/scripts/check_licenses.py'
      - '.github/licenses/**'
      - '.github/workflows/ocr-image.yml'
  workflow_dispatch:

permissions:
  contents: read

# Same rationale as ci.yml: a new push to a PR makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ocr-image:
    name: ocr-image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # Pulling the base image (about 2 GB per architecture) and the cold start dominate; no build
    # cache, so every run downloads the models once more and checks them against ocr/models.sha256.
    timeout-minutes: 45
    strategy:
      # A failure on one architecture must not hide the result of the other.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE: opaa-ci/ocr:${{ matrix.arch }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The image takes about 4.5 GB unpacked and Trivy reads it once more; the preinstalled SDKs
      # this job does not use make room for both.
      - name: Speicherplatz freigeben
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      # The docker driver builds straight into the engine's image store, without a second copy
      # for --load.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker

      - name: OCR-Image bauen
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ocr/Dockerfile
          platforms: linux/${{ matrix.arch }}
          tags: ${{ env.IMAGE }}
          load: true

      - name: Rauchtest ohne Netz
        env:
          EXPECT_ARCH: ${{ matrix.arch }}
          RESULT_DIR: ${{ runner.temp }}/ocr-smoke
        run: .github/scripts/ocr_smoke_test.sh "$IMAGE"

      # The image is flattened FROM scratch and restates the environment of its base image; reported
      # also when the smoke test failed, since a missing variable is a likely cause.
      - name: Umgebung des Basis-Images prüfen
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 .github/scripts/ocr_env_check.py "$IMAGE" "linux/$ARCH"

      # models.sha256 comes from a build; every pinned file must also match the Hugging Face API at
      # the commit of ocr/models.revisions or the hashes the OCR packages of the image declare.
      - name: Modell-Prüfsummen gegen Herkunft abgleichen
        run: python3 .github/scripts/ocr_models_verify.py "$IMAGE" ocr/models.sha256 ocr/models.revisions

      - name: Antwort des Rauchtests ablegen
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ocr-smoke-${{ matrix.arch }}
          path: ${{ runner.temp }}/ocr-smoke/
          if-no-files-found: ignore
          retention-days: 14

      # CycloneDX of the image as Trivy reads it: OS packages of the base image and the Python
      # packages of docling-serve's environment, each with the license of its metadata.
      # Trivy does not create the directory of its output file.
      - name: Ablage anlegen
        run: mkdir -p "$RUNNER_TEMP/sbom" "$RUNNER_TEMP/licenses"

      - name: SBOM erzeugen
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: cyclonedx
          output: ${{ runner.temp }}/sbom/opaa-ocr-${{ matrix.arch }}.cdx.json

      - name: Lizenzen prüfen
        env:
          SBOM: ${{ runner.temp }}/sbom/opaa-ocr-${{ matrix.arch }}.cdx.json
          REPORT: ${{ runner.temp }}/licenses/licenses-ocr-${{ matrix.arch }}.md
        run: .github/scripts/ocr_licenses.sh "$SBOM" "$REPORT"

      - name: SBOM und Lizenzübersicht ablegen
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-ocr-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/sbom/
            ${{ runner.temp }}/licenses/
          if-no-files-found: ignore
          retention-days: 90
