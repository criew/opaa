name: Betrieb ohne Internet

# The offline target of the E2E suite (e2e/scripts/offline.mjs): the Compose stack on a network
# without a route out, with the models as a local service, from sign-in to an answer with its
# source. The images are built and pulled first; the stack then starts with --pull never. Not on
# every pull request and no required check: nightly, on demand, and on a pull request labelled
# "offline-suite" - the pattern of the other container suites.
on:
  schedule:
    # After the two-instance suite (6:50 UTC), so that the container suites do not share a runner.
    - cron: '25 7 * * *'
  workflow_dispatch: {}
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}-${{ github.event.label.name || 'none' }}
  cancel-in-progress: true

env:
  COMPOSE_PROJECT_NAME: opaa-offline

jobs:
  offline:
    name: Ablauf ohne Internetzugang
    if: github.event_name != 'pull_request' || github.event.label.name == 'offline-suite'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Kurzform des Commits
        id: head
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Tagged <project>-<service>:latest, which Compose uses with E2E_SKIP_BUILD=true.
      - name: Backend-Image bauen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          tags: opaa-offline-backend:latest
          # The version the result names next to the date.
          build-args: OPAA_VERSION=0.0.0-dev+${{ steps.head.outputs.short }}
          load: true
          cache-from: type=gha,scope=offline-backend
          cache-to: type=gha,mode=max,scope=offline-backend

      - name: Frontend-Image bauen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: frontend/Dockerfile
          tags: opaa-offline-frontend:latest
          load: true
          cache-from: type=gha,scope=offline-frontend
          cache-to: type=gha,mode=max,scope=offline-frontend

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: e2e/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml

      - name: E2E-Abhängigkeiten installieren und typprüfen
        working-directory: e2e
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck

      - name: Playwright-Browser installieren
        working-directory: e2e
        timeout-minutes: 6
        run: pnpm exec playwright install --with-deps chromium

      - name: Ablauf ohne Internetzugang ausführen
        working-directory: e2e
        env:
          E2E_SKIP_BUILD: 'true'
        run: pnpm run test:offline

      - name: Ergebnis mit Version und Datum
        if: ${{ !cancelled() }}
        env:
          OUTCOME_FILE: e2e/test-results/offline-result.json
        run: |
          {
            echo '## Betrieb ohne Internet'
            echo
            if [ -f "$OUTCOME_FILE" ]; then
              echo '```json'
              cat "$OUTCOME_FILE"
              echo '```'
            else
              echo 'Kein Ergebnis: Der Ablauf hat den letzten Schritt nicht erreicht.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # if: !cancelled(): a job that runs into timeout-minutes counts as cancelled, not failed.
      - name: Bericht und Protokolle hochladen
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/docker-compose.offline.log
          if-no-files-found: ignore
          retention-days: 30
