name: Daily Report

on:
  schedule:
    # 00:30 UTC entspricht 02:30 MESZ beziehungsweise 01:30 MEZ. Der Vortag ist
    # nach mitteleuropäischer Zeit damit abgeschlossen, siehe TIMEZONE im Skript.
    # Die Uhrzeit ist ein Wunsch, keine Zusage: GitHub führt geplante Läufe bei
    # Last auch mehrere Stunden später aus.
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Berichtstag als JJJJ-MM-TT (leer = Vortag)"
        required: false
        type: string

# Only the job "publish" pushes and gets contents: write. The job "report" installs packages,
# calls an external model and renders the pages with a read-only token; it hands the finished
# site to "publish" as an artifact.
permissions:
  contents: read

concurrency:
  # Teilt die Gruppe mit der Landing Page: Beide committen auf gh-pages, ein
  # paralleler Lauf würde beim Push gegeneinander laufen.
  group: gh-pages
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    outputs:
      # Empty when gh-pages does not exist yet or its checkout failed.
      pages-commit: ${{ steps.pages.outputs.commit }}
    steps:
      - name: Skript auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/scripts
            .github/requirements-report.txt
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Veröffentlichte Seite auschecken
        id: pages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: site
          persist-credentials: false
        continue-on-error: true

      - name: Seitenverzeichnis vorbereiten
        run: mkdir -p site/report

      - name: Altes Seitenlayout überführen
        run: bash .github/scripts/migrate_pages_layout.sh site

      - name: Zeitzonendaten bereitstellen
        run: >-
          python -m pip install --quiet --require-hashes --only-binary=:all: --no-deps
          -r .github/requirements-report.txt

      - name: Report erzeugen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Bewusst ein eigenes Secret und nicht der Anwendungsschlüssel
          # OPAA_OPENAI_API_KEY: dieser steuert in ci.yml, ob die
          # OpenAI-Integrationstests laufen. Beides zu koppeln würde das
          # Aktivieren der Zusammenfassung zu einer Änderung an der CI machen.
          OPAA_REPORT_API_KEY: ${{ secrets.OPAA_REPORT_API_KEY }}
          OPAA_REPORT_PROVIDER: ${{ vars.OPAA_REPORT_PROVIDER }}
          OPAA_REPORT_MODEL: ${{ vars.OPAA_REPORT_MODEL }}
          OPAA_REPORT_BASE_URL: ${{ vars.OPAA_REPORT_BASE_URL }}
          # Ziel des Links auf die laufende Instanz. Nicht gesetzt bedeutet die
          # Vorgabe aus dem Skript, siehe DEFAULT_TEST_URL.
          OPAA_REPORT_TEST_URL: ${{ vars.OPAA_REPORT_TEST_URL }}
          REPORT_DATE: ${{ inputs.date }}
          # Base URL of the published report; a fork sets its own.
          OPAA_REPORT_SITE_URL: ${{ vars.OPAA_REPORT_SITE_URL }}
        run: |
          python .github/scripts/daily_report.py \
            --repo "$GITHUB_REPOSITORY" \
            --date "$REPORT_DATE" \
            --output site/report \
            --site-url "${OPAA_REPORT_SITE_URL:-https://opaa.io/report}"

      # The whole site without its git metadata; "publish" mirrors it onto gh-pages.
      - name: Seite übergeben
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: |
            site
            !site/.git
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: report
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Prüfskript auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts/check_pages_base.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Veröffentlichte Seite auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: site
          # The last step pushes the report to gh-pages from this checkout.
          persist-credentials: true
        continue-on-error: true

      - name: Erzeugte Seite holen
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: generated

      # The generated tree is the complete new state of the branch only if both jobs checked out
      # the same gh-pages commit; otherwise rsync --delete would drop what "report" did not see.
      - name: Gleiche Basis wie der Report sicherstellen
        env:
          REPORT_PAGES_COMMIT: ${{ needs.report.outputs.pages-commit }}
        run: bash .github/scripts/check_pages_base.sh site "$REPORT_PAGES_COMMIT"

      - name: Seite übernehmen
        run: |
          mkdir -p site
          rsync -a --delete --exclude=.git generated/ site/

      - name: Seite veröffentlichen
        working-directory: site
        env:
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -d .git ]; then
            git init -q
            git remote add origin "https://x-access-token:$PUSH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Existiert gh-pages noch nicht, scheitert der vorangehende Checkout am
          # fehlenden Ref, legt das Repository aber bereits an. HEAD zeigt dann
          # auf dessen Standardbranch, weshalb der Zielbranch hier in jedem Fall
          # gesetzt wird. symbolic-ref funktioniert auch ohne ersten Commit.
          if [ "$(git symbolic-ref --short HEAD 2>/dev/null)" != "gh-pages" ]; then
            git symbolic-ref HEAD refs/heads/gh-pages
          fi
          git add -A
          if git diff --staged --quiet; then
            echo "Keine Änderungen zu veröffentlichen."
            exit 0
          fi
          git commit -m "docs(report): Tagesreport aktualisieren"
          git push origin gh-pages
