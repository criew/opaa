name: Parser-Fuzzing

# Time-boxed fuzzing of every admitted document format on the production path
# (io.opaa.fuzz.ParserFuzzTest, docs/entwicklung/build-und-ci.md, "Parser-Fuzzing").
# Never on a pull request: the campaign takes ten minutes; the PR build only replays the
# committed corpus once (FuzzCorpusTest in the core shard).
on:
  schedule:
    # 1:35 UTC, away from the other nightly jobs (0:30, 2:11, 3:17 and later).
    - cron: '35 1 * * *'
  workflow_dispatch:
    inputs:
      duration:
        description: 'Dauer der Kampagne (ISO-8601, z. B. PT10M)'
        required: false
        default: 'PT10M'
      seed:
        description: 'Kampagnen-Seed zum Wiederholen eines Laufs (leer: Run-ID)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: parser-fuzzing
  cancel-in-progress: false

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Only the alarm steps below write: they open, comment on and close the alarm issue.
    permissions:
      contents: read
      issues: write
    env:
      # A scheduled run uses its run id as campaign seed, so every night mutates differently and
      # a finding names the seed that reproduces it.
      FUZZ_SEED: ${{ inputs.seed || github.run_id }}
    defaults:
      run:
        working-directory: backend/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.4+101.0.LTS'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Parser fuzzen
        env:
          FUZZ_DURATION: ${{ inputs.duration || 'PT10M' }}
        run: ./gradlew parserFuzzTest "-PfuzzDuration=$FUZZ_DURATION" "-PfuzzSeed=$FUZZ_SEED"

      - name: Befunde und Zusammenfassung hochladen
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parser-fuzzing-findings
          path: |
            backend/build/fuzz-findings/
            backend/build/reports/tests/parserFuzzTest/
          if-no-files-found: ignore
          retention-days: 30

      # No PR makes a red nightly run visible, so a failed or timed-out scheduled run opens an alarm
      # issue, or comments on the open one, with seed, run and the findings of summary.txt - the
      # pattern of e2e.yml. A manual run never raises or closes the alarm: its duration and seed
      # are someone's experiment. The issue body is never overwritten.
      - name: Fehlschlag als Issue melden
        if: (failure() || cancelled()) && github.event_name == 'schedule'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- parser-fuzzing-alert -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const seed = process.env.FUZZ_SEED;
            const summaryPath = 'backend/build/fuzz-findings/summary.txt';
            const summary = fs.existsSync(summaryPath)
              ? '```\n' + fs.readFileSync(summaryPath, 'utf8').trim() + '\n```'
              : 'Keine Zusammenfassung vorhanden — der Lauf hat die Kampagne nicht beendet ' +
                '(Build, Speicher oder Zeitlimit; siehe Workflow-Logs und `current-input` im Artefakt).';
            const reproduce = 'Wiederholen: `./gradlew parserFuzzTest -PfuzzSeed=' + seed +
              '` oder eine Befund-Datei aus dem Artefakt mit `-PfuzzReplay=<Datei>` ' +
              '(docs/entwicklung/build-und-ci.md, Abschnitt „Parser-Fuzzing“).';
            const artifact = 'Artefakt des Laufs: `parser-fuzzing-findings`.';
            const commentBody = `Erneut fehlgeschlagen: ${runUrl} (Seed ${seed})\n\n${summary}\n\n${artifact}`;
            const issueBody = `${marker}\n\n**Das nächtliche Parser-Fuzzing hat Befunde.**\n\n` +
              `Workflow-Lauf: ${runUrl}\nKampagnen-Seed: ${seed}\n\n${summary}\n\n${artifact}\n\n` +
              `${reproduce}\n\nDas Issue wird automatisch geschlossen, sobald ein nächtlicher Lauf ` +
              'wieder ohne Befund endet.';

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci',
              per_page: 100,
            });
            const existing = issues.find(i => !i.pull_request && i.body && i.body.includes(marker));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: commentBody,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'ci(format): Parser-Fuzzing mit Befunden (nächtlicher Lauf)',
                body: issueBody,
                labels: ['ci', 'bug', 'security'],
              });
            }

      - name: Alarm-Issue bei Lauf ohne Befund schließen
        if: success() && github.event_name == 'schedule'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = '<!-- parser-fuzzing-alert -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci',
              per_page: 100,
            });
            const existing = issues.find(i => !i.pull_request && i.body && i.body.includes(marker));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Das Parser-Fuzzing endet wieder ohne Befund: ${runUrl} (Seed ${process.env.FUZZ_SEED})`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
              });
            }
