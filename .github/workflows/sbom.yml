name: SBOM

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Self-validates this workflow file itself inside a PR that touches it.
  pull_request:
    paths:
      - ".github/workflows/sbom.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      # Aggregates backend + opaa-api into one runtime-scope CycloneDX SBOM
      # (config: backend/build.gradle.kts). Retrieval: docs/sbom.md.
      - name: Generate backend SBOM
        run: ./gradlew cyclonedxBom

      - uses: actions/upload-artifact@v7
        with:
          name: sbom-backend
          path: backend/build/reports/cyclonedx/
          retention-days: 90

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version pinned in the "packageManager" field of
      # frontend/package.json.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # cdxgen reads the pnpm lockfile directly; version pinned rather than
      # "latest" for reproducible output. --no-babel skips its optional JS/TS
      # source-code usage analysis, which needs babel packages this repo does
      # not depend on. Retrieval: docs/sbom.md.
      - name: Generate frontend SBOM
        run: pnpm dlx @cyclonedx/cdxgen@11.11.0 -t pnpm --no-babel -o bom.json .

      - uses: actions/upload-artifact@v7
        with:
          name: sbom-frontend
          path: frontend/bom.json
          retention-days: 90
