name: SBOM

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Self-validates this workflow file itself inside a PR that touches it.
  pull_request:
    paths:
      - ".github/workflows/sbom.yml"

# Runs pnpm dlx (third-party code) and gradle plugin code; no write access needed.
permissions:
  contents: read

# Same rationale as ci.yml: a new push makes the previous run's result irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Job IDs are the branch protection's required-check names (GitHub Actions app-bound, not
  # workflow-scoped) - "backend"/"frontend" would collide with ci.yml's same-named jobs, letting a
  # green SBOM job mask a red or skipped CI job of the same name.
  sbom-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25.0.4+101.0.LTS"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Aggregates backend + opaa-api into one runtime-scope CycloneDX SBOM
      # (config: backend/build.gradle.kts). Retrieval: docs/sbom.md.
      - name: Generate backend SBOM
        run: ./gradlew cyclonedxBom

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-backend
          path: backend/build/reports/cyclonedx/
          retention-days: 90

  sbom-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the pnpm version pinned in the "packageManager" field of
      # frontend/package.json.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # cdxgen reads the pnpm lockfile directly. --no-babel skips its optional
      # source-code usage analysis. --required-only limits the SBOM to what
      # ships at runtime (excludes devDependencies), matching the backend's
      # runtime-only scope - see docs/sbom.md.
      # renovate: datasource=npm depName=@cyclonedx/cdxgen
      - name: Generate frontend SBOM
        run: pnpm dlx @cyclonedx/cdxgen@12.8.5 -t pnpm --no-babel --required-only --project-name opaa-frontend -o bom.json .

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-frontend
          path: frontend/bom.json
          retention-days: 90
