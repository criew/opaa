name: Antwortqualität

# Kontextebene der Domäne Antwortqualität (eval/corpus/answer-quality/SOURCE.md): ohne Chat-Modell
# (skipAnswers), ohne Zerlegung, nur das Embedding-Modell. Eigener Workflow, damit er bei einer
# Änderung seiner eigenen Pfade läuft, ohne die Retrieval-Matrix (retrieval-regression.yml) zu starten.
# Er misst und berichtet, ohne Baseline und ohne Schwelle; er schlägt nur bei einer verletzten
# Voraussetzung fehl (Manifest, Indizierung).
on:
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch: {}
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'eval/corpus/answer-quality/**'
      - 'eval/golden/answer-quality.json'
      - 'backend/src/evalTest/java/io/opaa/eval/AnswerQuality*'
      - '.github/workflows/answer-quality.yml'

permissions:
  contents: read

concurrency:
  group: answer-quality-${{ github.event_name }}-${{ github.event.pull_request.number || 'none' }}
  cancel-in-progress: true

jobs:
  answer-quality:
    name: answer-quality (Kontextebene)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.4+101.0.LTS'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Kontextebene der Antwortqualität messen
        working-directory: backend
        run: ./gradlew evaluateAnswerQuality -Dopaa.eval.answerQuality.skipAnswers=true --max-workers=1

      - name: Report der Job-Zusammenfassung hinzufügen
        if: always()
        run: |
          if [ -f backend/build/eval-reports/answer-quality.md ]; then
            cat backend/build/eval-reports/answer-quality.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Antwortqualität (Kontextebene)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Kein Bericht — dieser Schritt wurde nicht erreicht (siehe Workflow-Logs)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Report als Artefakt hochladen
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: answer-quality-context
          path: |
            backend/build/eval-reports/answer-quality.json
            backend/build/eval-reports/answer-quality.md
          if-no-files-found: warn
          retention-days: 90

      # Ein Kommentar je PR, am Marker wiedergefunden und bei jedem Lauf aktualisiert.
      - name: Bericht als PR-Kommentar posten oder aktualisieren
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- answer-quality-context -->';
            const path = 'backend/build/eval-reports/answer-quality.md';
            const report = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8')
              : '## Antwortqualität (Kontextebene)\n\nKein Bericht erzeugt — dieser Schritt wurde ' +
                'nicht erreicht (siehe Workflow-Logs).';
            const body = `${marker}\n${report}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
