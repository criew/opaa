name: CI

on:
  # The maintenance branches release/X.Y of the supported lines (docs/releases.md, "Backport") get
  # the same required checks and post-merge run as main; the path filter below reads the files of
  # the pull request, whatever its base.
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']
  # Fires only if a merge queue is ever enabled for main (issue #644 kept it
  # as preparation): the queue creates a merge_group ref with the PR merged
  # onto the current queue state and waits for the required checks on it.
  # Without an active queue this trigger never fires.
  merge_group:

# Read-only token for every job; a job that needs more names it in its own permissions: block.
permissions:
  contents: read

# A new push to a PR branch makes the previous run's result irrelevant —
# cancel it instead of blocking a runner. Non-PR events get the SHA in the
# group: without it, GitHub would silently discard a *pending* main run when
# the next merge lands, and the post-merge run on main is the safety net now
# that the branch protection no longer requires PRs to be up to date.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Path filter for PR runs: backend jobs only run when backend files
  # changed, the frontend job only for frontend changes. The jobs below are
  # required status checks, so they must exist in every run — skipped
  # required jobs count as passed for branch protection and the merge queue.
  # That cuts both ways: if this job itself failed, its dependents would all
  # be skipped and read as passed — which is why `changes` is a required
  # status check too, so a filter failure blocks the merge instead.
  # Filtering only applies to pull_request events; pushes to main or release/** and merge
  # queue runs always execute everything.
  changes:
    runs-on: ubuntu-latest
    permissions:
      # contents: read is required for the checkout below - a job-level permissions
      # block replaces the defaults instead of extending them.
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      backendCore: ${{ steps.filter.outputs.backendCore }}
      bundleParity: ${{ steps.filter.outputs.bundleParity }}
      frontend: ${{ steps.filter.outputs.frontend }}
      helm: ${{ steps.filter.outputs.helm }}
      images: ${{ steps.filter.outputs.images }}
      scripts: ${{ steps.filter.outputs.scripts }}
      seed: ${{ steps.filter.outputs.seed }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          # Required for the '!eval/README.md'/'!eval/generator/**' excludes on the
          # backend filter below to take effect: the default 'some' quantifier treats
          # each pattern independently, so a negated pattern alone already matches any
          # file that isn't the excluded path — it never actually excludes anything.
          # 'some-with-excludes' evaluates excludes against files that already matched
          # a positive pattern instead. No other filter here uses negation, so this is
          # a no-op for frontend, scripts, backendCore and bundleParity.
          predicate-quantifier: 'some-with-excludes'
          filters: |
            # backendCore gates the paid OpenAI integration tests (job
            # backend-integration): nothing under io.opaa.integration.* reads
            # eval/, so a corpus-only PR must not trigger real API calls.
            backendCore:
              - 'backend/**'
              - 'opaa-api/**'
              - '.github/workflows/ci.yml'
            # backend additionally covers eval/** because the Docker-free
            # invariant tests that guard the corpora and golden datasets
            # (chunk-size dry runs, golden case curation, manifest checks) run
            # as part of the backend job's check task - a corpus-only PR would
            # otherwise skip them. eval/README.md and eval/generator/** are
            # excluded: no evalUnitTest-included test reads either at runtime,
            # both are only referenced from Javadoc/error messages in the
            # excluded *RetrievalEvaluationHarnessTest classes. .github/fact-sheet-anchors.txt belongs
            # here because FactSheetReferenceTest checks it against the manifest.
            backend:
              - 'backend/**'
              - 'opaa-api/**'
              - 'eval/**'
              - '!eval/README.md'
              - '!eval/generator/**'
              - '.github/fact-sheet-anchors.txt'
              - '.github/licenses/**'
              - '.github/scripts/check_licenses.py'
              - '.github/workflows/ci.yml'
            # helm runs backend-test, not backend-build: ConfigurationSettingsTest (shard core) reads
            # the chart and checks it against the compliance manifest, nothing else in the backend
            # build reads deploy/helm. A chart-only PR therefore runs the test shards alone.
            helm:
              - 'deploy/helm/opaa/**'
            # The frontend build regenerates its API types from the OpenAPI
            # fragments under opaa-api/ on every pnpm run build/test (ADR-0006),
            # so a spec-only change must also run the frontend job. Both jobs run the license check,
            # so a change to its policy files or script runs both.
            frontend:
              - 'frontend/**'
              - 'opaa-api/src/main/openapi/**'
              - '.github/licenses/**'
              - '.github/scripts/check_licenses.py'
              - '.github/workflows/ci.yml'
            bundleParity:
              - 'opaa-api/src/main/openapi/**'
              - 'opaa-api/src/bundler/**'
              - 'opaa-api/build.gradle.kts'
              - 'frontend/scripts/bundle-openapi.mjs'
              - 'frontend/scripts/check-openapi-bundle-parity.mjs'
              - 'frontend/package.json'
              - 'frontend/pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
            # Everything the Dockerfiles copy except the source trees, plus the build context filter
            # and the publish workflow: what decides whether the images build and start on arm64.
            # Source changes are covered by the run on main.
            images:
              - '.dockerignore'
              - 'backend/Dockerfile'
              - 'backend/docker/**'
              - 'backend/build.gradle.kts'
              - 'backend/settings.gradle.kts'
              - 'backend/gradle.properties'
              - 'backend/gradlew'
              - 'backend/gradle/**'
              - 'opaa-api/build.gradle.kts'
              - 'frontend/Dockerfile'
              - 'frontend/nginx*.conf'
              - 'frontend/docker-entrypoint.d/**'
              - 'frontend/package.json'
              - 'frontend/pnpm-lock.yaml'
              - 'frontend/pnpm-workspace.yaml'
              - '.github/scripts/image_smoke_test.sh'
              - '.github/scripts/frontend_hardening_test.sh'
              - '.github/workflows/publish-images.yml'
              - '.github/workflows/ci.yml'
            # renovate.json5 belongs here because test_check_action_pins.py checks that its pinDigests
            # rule covers every workflow, like the action pin guard. publish-images.yml belongs here
            # because test_publish_images_cache.py checks that release builds skip the gha cache,
            # renovate.yml because test_renovate_image_pin.py checks its image pin against the regex
            # manager. data-impact-paths.txt belongs here because test_check_data_impact.py checks
            # that each of its patterns still matches a tracked file, .github/licenses/** because
            # test_check_licenses.py loads the policy files. requirements-ci.txt pins the pytest this
            # job and seed-script install, so a Renovate bump of it runs both; requirements-release.txt
            # the packages of update_package.py, which this job tests. support-lines.json belongs
            # here because test_support_lines.py validates it, docs/releases.md because it checks
            # the roadmap there against the list, cve-scan.yml because it checks its scan targets
            # and alarm. accessibility-report.yml, e2e/fixtures/a11y.ts, e2e/scripts/run-e2e.mjs and
            # both seed requirement files belong here because test_accessibility_report.py checks
            # the release wiring, the record the fixture writes and the hash-pinned seed install. The
            # Compose templates belong here because test_check_compose_defaults.py edits copies of them.
            # zap-baseline.yml and .github/zap/** belong here because test_zap_rules.py checks the
            # suppressions, the ZAP image pin and its wiring.
            scripts:
              - '.github/scripts/**'
              - '.github/requirements-ci.txt'
              - '.github/requirements-release.txt'
              - '.github/data-impact-paths.txt'
              - '.github/licenses/**'
              - '.github/support-lines.json'
              - 'docs/releases.md'
              - '.github/workflows/ci.yml'
              - '.github/workflows/cve-scan.yml'
              - '.github/workflows/accessibility-report.yml'
              - 'e2e/fixtures/a11y.ts'
              - 'e2e/scripts/run-e2e.mjs'
              - 'demo/seed/requirements.txt'
              - '.github/requirements-seed.txt'
              - '.github/workflows/publish-images.yml'
              - '.github/workflows/renovate.yml'
              - 'renovate.json5'
              # test_opencode_mirror.py checks the mirror workflow and the openCode metadata.
              - '.github/workflows/opencode-mirror.yml'
              - 'publiccode.yml'
              - '.github/workflows/zap-baseline.yml'
              - '.github/zap/**'
              - 'docker-compose*.yml'
              - '**/docker-compose*.yml'
              - '.env.docker.example'
              - '.env.example'
            # Step-level filter of the action pin guard below, not a job output.
            workflows:
              - '.github/workflows/**'
              - '.github/scripts/check_action_pins.sh'
              - '.github/scripts/check_workflow_hardening.sh'
            # Step-level filter of the ADR style guard below, not a job output.
            adrs:
              - 'docs/decisions/**'
              - '.github/scripts/check_adr_style.sh'
            # Step-level filter of the diagram check below, not a job output.
            diagrams:
              - 'docs/behoerden/**'
              - 'docs/handbuch/**'
              - '.github/tools/mermaid/**'
              - '.github/scripts/package_html.py'
              - '.github/scripts/update_package.py'
              - '.github/workflows/ci.yml'
            # Step-level filter of the comment rule guard below, not a job output.
            comments:
              - 'backend/src/main/**'
              - 'backend/src/configMetadata/**'
              - 'backend/src/test/**'
              - 'backend/src/evalTest/**'
              - 'opaa-api/src/main/**'
              - 'frontend/src/**'
              - 'frontend/vite.config.ts'
              - 'frontend/eslint.config.*'
              - 'frontend/eslint/**'
              - '.github/workflows/**'
              - 'e2e/**'
              - 'eval/**/*.py'
              - 'docker-compose*.yml'
              - '.env*.example'
              - '**/Dockerfile'
              - 'backend/gradle/**'
              - 'backend/*.gradle.kts'
              - 'opaa-api/*.gradle.kts'
              - 'renovate.json5'
              - 'frontend/nginx*.conf'
              - 'demo/**/*.py'
              - 'demo/**/*.conf'
              - '**/*.sh'
            # Step-level filter of the Compose template check below, not a job output.
            compose:
              - 'docker-compose*.yml'
              - '**/docker-compose*.yml'
              - '.env.docker.example'
              - '.env.example'
              - '.github/scripts/check_compose_defaults.sh'
            # Step-level filter of the Gradle verification guard below, not a job output.
            gradleVerification:
              - 'backend/gradle/verification-metadata.xml'
              - '.github/scripts/check_gradle_verification_metadata.py'
            # Step-level filter of the ratchets below, not a job output.
            ratchets:
              - 'backend/src/main/**'
              - '.github/scripts/**'
            # keycloak/** belongs to the seed filter because demo/seed/test_seed.py
            # asserts the realm export keeps the audience mapper the seed's token
            # path depends on - otherwise only the nightly demo smoke run would
            # notice its removal. demo/corpus/** belongs to it because
            # demo/seed/test_chats.py asserts every document the demo chats cite
            # still exists in the corpus.
            seed:
              - 'demo/seed/**'
              - 'demo/corpus/**'
              - '.github/requirements-ci.txt'
              - 'keycloak/**'
              - '.github/workflows/ci.yml'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Guards the Corepack integrity hash that frontend/Dockerfile relies on
      # ("corepack enable", then "pnpm install --frozen-lockfile"): corepack verifies
      # the pnpm binary against it. Note pnpm/action-setup strips the hash and only
      # reads the version, so no CI job would ever notice its loss. Lives in this job
      # because `changes` is the only required status check that runs unfiltered on
      # every PR and every push to main - a guard in a filtered job would be skipped
      # for exactly the PRs that touch only e2e/package.json, and a non-required job
      # would go red without stopping a Renovate auto-merge.
      - name: Corepack-Hash im packageManager-Feld prüfen
        run: .github/scripts/check_package_manager_hash.sh

      # Every workflow references actions by commit SHA only (docs/renovate.md). Same job as above:
      # a required check, so a tag that slips back in blocks the merge.
      - name: SHA-Pins der Actions in allen Workflows prüfen
        if: github.event_name != 'pull_request' || steps.filter.outputs.workflows == 'true'
        run: .github/scripts/check_action_pins.sh

      # No run: or script: block interpolates github.head_ref, github.ref, github.ref_name,
      # github.workflow_ref, github.event in any form, the github context as a whole, or the
      # inputs, secrets, vars and env contexts,
      # every workflow sets top-level permissions: and every checkout states persist-credentials
      # (AGENTS.md, "GitHub-Actions-Workflows").
      - name: Kontextwerte, Token-Rechte und Checkout-Credentials der Workflows prüfen
        if: github.event_name != 'pull_request' || steps.filter.outputs.workflows == 'true'
        run: .github/scripts/check_workflow_hardening.sh

      # Every ADR follows docs/decisions/README.md (current state instead of appended notes, status line
      # with date).
      - name: ADR-Stil in docs/decisions prüfen
        if: github.event_name != 'pull_request' || steps.filter.outputs.adrs == 'true'
        run: .github/scripts/check_adr_style.sh

      # Every editorial document under docs/behoerden carries header block, disclaimer, only
      # fact sheet placeholders naming a target of .github/fact-sheet-anchors.txt and only
      # relative links that resolve (docs/behoerden/AGENTS.md); new files are found by directory walk.
      # Runs on every event: link targets lie all over the repository, a path filter would miss them.
      - name: Kopfvermerk der Behördenunterlagen prüfen
        run: .github/scripts/check_behoerden_headers.sh

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15'

      - name: Python-Pakete des Update-Pakets installieren
        run: |
          pip install --require-hashes --only-binary=:all: --no-deps -r .github/requirements-release.txt

      # The links of docs/behoerden and docs/handbuch as the update package and its HTML version
      # hold them; a link the release run would refuse fails here instead of stopping a release.
      # Unfiltered for the same reason as the check above.
      - name: Verweise von Vorlagen und Handbuch im Update-Paket prüfen
        run: python .github/scripts/update_package.py links

      # Every Mermaid diagram of docs/behoerden and docs/handbuch renders to SVG as in the release
      # run (Mermaid from .github/tools/mermaid, the runner's Google Chrome); a diagram that does
      # not render fails here instead of stopping a release.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: github.event_name != 'pull_request' || steps.filter.outputs.diagrams == 'true'
        with:
          package_json_file: .github/tools/mermaid/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.event_name != 'pull_request' || steps.filter.outputs.diagrams == 'true'
        with:
          node-version: 24
          package-manager-cache: false

      - name: Mermaid installieren
        if: github.event_name != 'pull_request' || steps.filter.outputs.diagrams == 'true'
        working-directory: .github/tools/mermaid
        run: pnpm install --frozen-lockfile --ignore-scripts --no-optional

      - name: Mermaid-Diagramme von Vorlagen und Handbuch rendern
        if: github.event_name != 'pull_request' || steps.filter.outputs.diagrams == 'true'
        run: python .github/scripts/update_package.py diagrams

      # Comments in every tree listed in the script header carry no review protocol, no history
      # anchored at an issue and no bare origin marker (AGENTS.md, "Code-Kommentare").
      - name: Kommentarregel prüfen
        if: github.event_name != 'pull_request' || steps.filter.outputs.comments == 'true'
        run: .github/scripts/check_code_comments.sh

      # The Compose templates publish ports on loopback only, switch on no anonymous system
      # administration and carry no fixed secret outside the script's reasoned exceptions.
      - name: Sichere Vorgaben der Compose-Vorlagen prüfen
        if: github.event_name != 'pull_request' || steps.filter.outputs.compose == 'true'
        run: .github/scripts/check_compose_defaults.sh

      # Counted stock that must not grow: Instant.now() in Spring beans, @Value outside *Properties
      # classes (ADR-0051, Entscheidung 6). The limits sit in the scripts and only ever go down.
      - name: Ratschen für Instant.now() und @Value prüfen
        if: github.event_name != 'pull_request' || steps.filter.outputs.ratchets == 'true'
        run: |
          .github/scripts/check_instant_now.sh
          .github/scripts/check_value_annotations.sh

      # Known coordinates keep their checksums in backend/gradle/verification-metadata.xml; only
      # new versions may add entries (docs/renovate.md, "Gradle-Prüfsummen"). Enforced for Renovate
      # branches, which merge without review; elsewhere a change is a warning for the reviewer.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request' && steps.filter.outputs.gradleVerification == 'true'
        with:
          ref: ${{ github.base_ref }}
          path: base-ref
          sparse-checkout: backend/gradle
          persist-credentials: false

      - name: Bestehende Prüfsummen der Gradle-Verifikation prüfen
        if: github.event_name == 'pull_request' && steps.filter.outputs.gradleVerification == 'true'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          base=base-ref/backend/gradle/verification-metadata.xml
          if [ ! -f "$base" ]; then
            echo "Basis-Branch hat noch keine Verifikationsdatei, nichts zu vergleichen."
            exit 0
          fi
          enforce=
          case "$HEAD_REF" in renovate/*) enforce=--enforce ;; esac
          python3 .github/scripts/check_gradle_verification_metadata.py \
            "$base" backend/gradle/verification-metadata.xml $enforce

  # Fails a pull request whose dependency changes bring a known vulnerability of severity critical
  # in runtime scope (docs/cve-scanning.md, "PR-Gate für Abhängigkeiten"). It compares the
  # dependency graph of base and head through the GitHub API, so it needs no checkout. Only on
  # pull_request: a push or merge_group run has no base to compare with.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # Waits for the head snapshots of the Gradle graph and the pnpm lockfiles, which
      # dependency-graph.yml generates and dependency-graph-submit.yml submits for every PR.
      # The compare API keeps answering "no snapshots" for a query it already answered that way,
      # keyed by its parameters; the action's own retry repeats one query and never sees the
      # snapshots. Every poll here uses a fresh per_page, the action's per_page=5 query runs last.
      - name: Auf die Snapshots des Head-Commits warten
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for per_page in $(seq 100 -1 41); do
            warnings=$(gh api -i "repos/$REPO/dependency-graph/compare/$BASE_SHA...$HEAD_SHA?per_page=$per_page" \
              | tr -d '\r' | sed -n 's/^x-github-dependency-graph-snapshot-warnings: *//Ip' | base64 -d)
            if ! grep -q 'No snapshots were found for the head SHA' <<<"$warnings"; then
              echo "Snapshots für $HEAD_SHA liegen vor."
              exit 0
            fi
            sleep 30
          done
          echo "::warning::Keine Snapshots für $HEAD_SHA nach 30 Minuten, das Gate prüft nur den Graphen, den GitHub selbst kennt."

      - name: Neue critical-Schwachstellen im Scope runtime ablehnen
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: critical
          fail-on-scopes: runtime

      # The gate above filters by severity and scope before it reports; this run only lists every
      # vulnerable change of both scopes in the job log and never fails.
      - name: Alle Schwachstellen der Abhängigkeitsänderungen auflisten
        if: success() || failure()
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          fail-on-scopes: runtime, development
          warn-only: true

  # The backend suite runs as three parallel package shards (see `testShards` in
  # backend/build.gradle.kts) plus one build job for everything `build` does besides the root
  # project's `test` task (spotless, compile, bootJar, SBOM, evalUnitTest, the :opaa-api tests).
  # The `backend` job below only aggregates their results so the required status check keeps
  # its name and the branch protection needs no change.
  backend-build:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.4+101.0.LTS'

      # Verwaltet den Gradle-Cache selbst: PR-Laeufe restaurieren read-only,
      # nur Laeufe auf main schreiben - behebt das Einfrieren des alten
      # actions/cache-Musters, das bei exaktem Key-Treffer nie neu
      # speicherte. Configuration-Cache-Daten werden bewusst nicht
      # persistiert (braeuchte cache-encryption-key + build-root-directory).
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build (ohne Testsuite)
        run: ./gradlew build -x :test

      # Checks the runtime SBOM the build just wrote against .github/licenses/ (docs/sbom.md,
      # "Lizenzprüfung"). Runs inside a required check, so a dependency update that brings an
      # unapproved license blocks a Renovate auto-merge.
      - name: Lizenzen der Abhängigkeiten prüfen
        working-directory: .
        run: >-
          python3 .github/scripts/check_licenses.py
          --allowed .github/licenses/allowed.txt
          --exceptions .github/licenses/exceptions.txt
          --cyclonedx backend/build/reports/cyclonedx/application.cdx.json
          --ignore 'pkg:maven/io.opaa/*'
          --title Backend
          --report backend/build/reports/licenses/licenses-backend.md

      - name: Lizenzübersicht ablegen
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: license-report-backend
          path: backend/build/reports/licenses/
          if-no-files-found: ignore
          retention-days: 90

      # Fact sheets for authorities from the compliance manifest (docs/behoerden/AGENTS.md,
      # "Faktenblätter"). Not checked in: the artifact of the latest run on main is the published
      # state of main.
      - name: Faktenblätter erzeugen
        run: ./gradlew complianceDocs

      - name: Faktenblätter ablegen
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compliance-faktenblaetter
          path: backend/build/compliance/faktenblaetter/
          if-no-files-found: error
          retention-days: 90

      # `javadoc` is not part of `build`'s dependency graph. This step catches unresolvable
      # {@link}/@see references.
      - name: Javadoc (unauflösbare Referenzen)
        run: ./gradlew javadoc

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-build-reports
          path: |
            backend/build/reports/tests/
            opaa-api/build/reports/tests/
          retention-days: 14

  backend-test:
    name: backend-test (${{ matrix.shard }})
    needs: changes
    if: >-
      github.event_name != 'pull_request'
      || needs.changes.outputs.backend == 'true'
      || needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [api, indexing, core]
    defaults:
      run:
        working-directory: backend/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.4+101.0.LTS'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Test (Shard ${{ matrix.shard }})
        run: ./gradlew :test -PtestShard=${{ matrix.shard }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-reports-${{ matrix.shard }}
          path: backend/build/reports/tests/
          retention-days: 14

  # Both bundlers must turn the spec fragments into the same spec: the Gradle one feeds the
  # generated DTOs and the backend tests, the Node one the frontend types. Runs whenever either
  # bundler or the fragments change, independent of which side's job would otherwise run.
  openapi-bundle-parity:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.bundleParity == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.4+101.0.LTS'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Gradle-Bündel erzeugen
        working-directory: backend/
        run: ./gradlew :opaa-api:bundleOpenApi

      - name: Frontend-Bündel erzeugen
        working-directory: frontend/
        run: |
          pnpm install --frozen-lockfile
          node scripts/bundle-openapi.mjs ../opaa-api/src/main/openapi build/openapi/opaa-api.yaml

      - name: Beide Bündel vergleichen
        working-directory: frontend/
        run: node scripts/check-openapi-bundle-parity.mjs ../opaa-api/build/openapi-bundle/openapi/opaa-api.yaml build/openapi/opaa-api.yaml

  # Required status check. Also aggregates openapi-bundle-parity, so the parity check blocks a
  # merge without a change to the branch protection.
  backend:
    needs: [changes, backend-build, backend-test, openapi-bundle-parity]
    # always(): the aggregate must run even when a shard failed, otherwise it would be skipped
    # and a skipped required check reads as passed. The path-filter condition is repeated so a
    # PR without backend, chart or bundle changes still skips this job.
    if: >-
      always() && (github.event_name != 'pull_request'
      || needs.changes.outputs.backend == 'true'
      || needs.changes.outputs.helm == 'true'
      || needs.changes.outputs.bundleParity == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Ergebnisse von backend-build, backend-test und openapi-bundle-parity zusammenfassen
        env:
          BUILD_RESULT: ${{ needs.backend-build.result }}
          TEST_RESULT: ${{ needs.backend-test.result }}
          PARITY_RESULT: ${{ needs.openapi-bundle-parity.result }}
          BACKEND_EXPECTED: ${{ github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true' }}
          TEST_EXPECTED: ${{ github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.helm == 'true' }}
          PARITY_EXPECTED: ${{ github.event_name != 'pull_request' || needs.changes.outputs.bundleParity == 'true' }}
        run: |
          echo "backend-build:         $BUILD_RESULT (erwartet: $BACKEND_EXPECTED)"
          echo "backend-test:          $TEST_RESULT (erwartet: $TEST_EXPECTED)"
          echo "openapi-bundle-parity: $PARITY_RESULT (erwartet: $PARITY_EXPECTED)"
          failed=0
          if [ "$BACKEND_EXPECTED" = "true" ] && [ "$BUILD_RESULT" != "success" ]; then
            failed=1
          fi
          if [ "$TEST_EXPECTED" = "true" ] && [ "$TEST_RESULT" != "success" ]; then
            failed=1
          fi
          if [ "$PARITY_EXPECTED" = "true" ] && [ "$PARITY_RESULT" != "success" ]; then
            failed=1
          fi
          if [ "$failed" = "1" ]; then
            echo "::error::Mindestens ein Backend-Job ist nicht erfolgreich."
            exit 1
          fi

  backend-integration:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.backendCore == 'true'
    runs-on: ubuntu-latest
    env:
      OPAA_OPENAI_API_KEY: ${{ secrets.OPAA_OPENAI_API_KEY }}
    defaults:
      run:
        working-directory: backend/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.4+101.0.LTS'

      # Cache-Verwaltung wie im backend-Job: read-only auf PRs, Schreiben nur auf main.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: OpenAI Integration Tests
        if: env.OPAA_OPENAI_API_KEY != ''
        run: ./gradlew openAiIntegrationTest

      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-integration-test-reports
          path: backend/build/reports/tests/
          retention-days: 14

  report-script:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15'

      - name: Install pytest
        run: pip install --require-hashes -r .github/requirements-ci.txt

      - name: Install the packages of the update package
        run: |
          pip install --require-hashes --only-binary=:all: --no-deps -r .github/requirements-release.txt

      # Der Tagesreport läuft nur nachts; ein Fehler fiele sonst erst dann auf.
      # Die Selbstprobe des Corepack-Guards liegt daneben, weil dessen CI-Lauf nur
      # den grünen Zweig ausübt. Ebenso der :main-Filter von publish-images.yml,
      # der nur auf main läuft, nie in einem PR.
      - name: Test
        run: pytest .github/scripts

  seed-script:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.seed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15'

      - name: Install dependencies
        # demo/seed/requirements.txt is the range the seed itself declares, so it stays outside
        # hash-checking mode; the CI tools come with hashes.
        run: |
          pip install --require-hashes -r .github/requirements-ci.txt
          pip install -r demo/seed/requirements.txt

      # Der Seed-Lauf selbst wird nur vom nächtlichen Demo-Smoke ausgeübt; was ohne
      # laufenden Stack prüfbar ist, gehört deshalb in jeden PR-Lauf.
      - name: Test
        run: pytest demo/seed

  frontend:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the pnpm version pinned in the "packageManager" field of
      # frontend/package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      # Same check as in backend-build, over the production dependencies (docs/sbom.md,
      # "Lizenzprüfung"); the frontend job is a required check as well.
      - name: Lizenzen der Abhängigkeiten prüfen
        run: |
          mkdir -p build/licenses
          pnpm licenses list --prod --json > build/licenses/pnpm-licenses.json
          python3 ../.github/scripts/check_licenses.py \
            --allowed ../.github/licenses/allowed.txt \
            --exceptions ../.github/licenses/exceptions.txt \
            --pnpm build/licenses/pnpm-licenses.json \
            --title Frontend \
            --report build/licenses/licenses-frontend.md
      - name: Lizenzübersicht ablegen
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: license-report-frontend
          path: frontend/build/licenses/licenses-frontend.md
          if-no-files-found: ignore
          retention-days: 90
      - run: pnpm run format:check
      - run: pnpm run lint
      # Theme boundaries beyond eslint: the rule is active as error, no bulk suppressions (file or
      # script option), every file under src/ belongs to one theme, and no comment disables the rule.
      - name: Themengrenzen prüfen
        run: node scripts/check-theme-boundaries.mjs
      - run: pnpm run test
      - run: pnpm run build
      - run: node scripts/bundle-report.mjs
      - name: Bundle-Report ablegen
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-bundle-report
          path: frontend/bundle-report/
          retention-days: 14

  # Builds both images on an arm64 runner, starts them hardened against PostgreSQL with pgvector
  # (.github/scripts/image_smoke_test.sh), since publish-images.yml publishes arm64 without starting
  # it, and checks the frontend nginx's hardening (.github/scripts/frontend_hardening_test.sh). Not a
  # required check; on pull requests only for the `images` paths, the image builds take minutes.
  # linux/amd64 needs no such job: helm-chart.yml and the E2E suite start those images.
  image-smoke-arm64:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.images == 'true'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Repo root as context: the backend's Gradle build depends on the sibling opaa-api/. Reads
      # the layer cache publish-images.yml writes on main; writes none of its own. Built with a
      # version carrying pre-release and build metadata, the widest form a release or main run
      # passes, so the start line and /actuator/info are checked against it; this rebuilds the
      # bootJar layer, the dependency layer before it stays cached.
      - name: Backend-Image bauen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/arm64
          tags: opaa-ci/backend:arm64
          load: true
          build-args: OPAA_VERSION=0.0.0-smoke.1+ci.7
          cache-from: type=gha,scope=backend-arm64

      # Built with the same version, which the smoke test looks for in the entry bundle; this
      # rebuilds the Vite build layer, the pnpm install layer before it stays cached.
      - name: Frontend-Image bauen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/arm64
          tags: opaa-ci/frontend:arm64
          load: true
          build-args: OPAA_VERSION=0.0.0-smoke.1+ci.7
          cache-from: type=gha,scope=frontend-arm64

      - name: Images starten und Bereitschaft prüfen
        env:
          EXPECT_ARCH: arm64
          EXPECT_VERSION: 0.0.0-smoke.1+ci.7
        run: .github/scripts/image_smoke_test.sh opaa-ci/backend:arm64 opaa-ci/frontend:arm64

      - name: Härtung des Frontend-nginx prüfen
        run: .github/scripts/frontend_hardening_test.sh opaa-ci/frontend:arm64
