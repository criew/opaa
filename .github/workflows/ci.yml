name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Fires only if a merge queue is ever enabled for main (issue #644 kept it
  # as preparation): the queue creates a merge_group ref with the PR merged
  # onto the current queue state and waits for the required checks on it.
  # Without an active queue this trigger never fires.
  merge_group:

# A new push to a PR branch makes the previous run's result irrelevant —
# cancel it instead of blocking a runner. Runs on main and in the merge
# queue are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Path filter for PR runs (issue #644): backend jobs only run when backend
  # files changed, the frontend job only for frontend changes. The jobs below
  # are required status checks, so they must exist in every run — skipped
  # required jobs count as passed for branch protection and the merge queue.
  # Filtering only applies to pull_request events; pushes to main and merge
  # queue runs always execute everything.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            scripts:
              - '.github/scripts/**'
              - '.github/workflows/ci.yml'

  backend:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend/**/*.gradle*', 'backend/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build & Test
        run: ./gradlew build

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/
          retention-days: 14

  backend-integration:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      OPAA_OPENAI_API_KEY: ${{ secrets.OPAA_OPENAI_API_KEY }}
    defaults:
      run:
        working-directory: backend/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend/**/*.gradle*', 'backend/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: OpenAI Integration Tests
        if: env.OPAA_OPENAI_API_KEY != ''
        run: ./gradlew openAiIntegrationTest

      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-test-reports
          path: backend/build/reports/tests/
          retention-days: 14

  report-script:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: pip install pytest

      # Der Tagesreport läuft nur nachts; ein Fehler fiele sonst erst dann auf.
      - name: Test
        run: pytest .github/scripts/test_daily_report.py

  frontend:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test
      - run: npm run build
