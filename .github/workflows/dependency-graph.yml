name: Dependency Graph

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Every PR gets a graph of its head commit, so the dependency review in ci.yml sees transitive
  # npm packages and the Gradle graph. This run only generates; dependency-graph-submit.yml
  # submits it from a workflow_run with write access (fork PRs never get a write token).
  pull_request:
    branches: [main]

# Read-only by default. Only the submit job, which never runs on pull_request, may write the
# dependency graph snapshot (contents: write).
permissions:
  contents: read

# A new push to main or a new push to a PR makes the previous run's result irrelevant - without
# the SHA in the non-PR group, a fast second main push could finish submitting after a first,
# in-flight run and leave a stale graph as the most recently submitted one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Dependencies resolved in runtimeClasspath (backend, opaa-api) are scoped runtime, everything
  # else (test, build tooling, plugins) development; the PR gate fails on runtime only.
  DEPENDENCY_GRAPH_RUNTIME_INCLUDE_CONFIGURATIONS: '^runtimeClasspath$'

jobs:
  # Resolves the Gradle dependency graph for backend + opaa-api (single multi-module build rooted
  # at backend/) and builds a snapshot of the pnpm lockfiles, which GitHub itself does not read
  # (.github/scripts/pnpm_dependency_snapshot.py), so Dependabot alerts cover both trees.
  # Dependency verification stays strict. The action injects its graph plugin by init script
  # (org.gradle:github-dependency-graph-gradle-plugin:1.5.0 from the Plugin Portal); exactly that
  # version is trusted in the <trusted-artifacts> of backend/gradle/verification-metadata.xml.
  # An action update that moves the version fails the generate job of its own PR.
  submit:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25.0.4+101.0.LTS"

      - uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          build-root-directory: backend
          dependency-graph: generate-and-submit

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15'

      - name: pnpm-Lockfiles einreichen
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}
        run: |
          pip install --require-hashes -r .github/requirements-ci.txt
          python3 .github/scripts/pnpm_dependency_snapshot.py \
            --sha "$SHA" --ref "$REF" --correlator pnpm-lockfiles --job-id "$RUN_ID" \
            --output "$RUNNER_TEMP/pnpm.json" $(git ls-files '*pnpm-lock.yaml')
          gh api -X POST "repos/$REPO/dependency-graph/snapshots" --input "$RUNNER_TEMP/pnpm.json"

  # Same graphs for a PR head, uploaded as artifacts with the PR number. Nothing here can write;
  # the submit workflow sets sha, ref and correlator itself and only trusts the PR number after
  # checking that this PR's head is the run's head commit.
  generate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      # The plugin names the manifest after the correlator; the submit job's value on main keeps
      # base and head manifests comparable in the dependency review.
      GITHUB_DEPENDENCY_GRAPH_JOB_CORRELATOR: dependency_graph-submit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25.0.4+101.0.LTS"

      - uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          build-root-directory: backend
          dependency-graph: generate-and-upload
          artifact-retention-days: 3

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15'

      - name: pnpm-Lockfiles auswerten
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REF: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          pip install --require-hashes -r .github/requirements-ci.txt
          mkdir -p "$RUNNER_TEMP/pnpm-graph"
          python3 .github/scripts/pnpm_dependency_snapshot.py \
            --sha "$HEAD_SHA" --ref "$REF" --correlator pnpm-lockfiles --job-id "$RUN_ID" \
            --output "$RUNNER_TEMP/pnpm-graph/pnpm-lockfiles.json" $(git ls-files '*pnpm-lock.yaml')
          echo "$PR_NUMBER" >"$RUNNER_TEMP/pnpm-graph/pr-number"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-graph_pnpm-lockfiles
          path: ${{ runner.temp }}/pnpm-graph/
          retention-days: 3
          if-no-files-found: error
