name: Retrieval-Regression

# Bewusst NICHT bei jedem Pull Request (siehe docs/features/search-quality-evaluation.md,
# "Auslösung", und ADR-0011, Entscheidung 5): der Lauf zieht ein Ollama-Modell und indiziert rund
# 1.450 Dokumente über die echte Chunking-/Embedding-Pipeline, das dauert mehrere Minuten selbst mit
# warmem Modell-Cache (siehe eval/README.md) und würde jeden PR-Push unnötig verlangsamen.
on:
  schedule:
    # Post-merge QA loop, wie in .github/workflows/e2e.yml — ein anderer Zeitpunkt (2:11 statt
    # 3:17 UTC) verhindert, dass beide teuren nächtlichen Jobs gleichzeitig um denselben
    # Runner/Docker-Netzwerk-Zugriff konkurrieren.
    - cron: '11 2 * * *'
  workflow_dispatch: {}
  pull_request:
    types: [labeled]
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  # PR #301 review, Befund 2: a workflow-level concurrency group keyed only on the PR number
  # cancelled an in-flight 'evaluation'-labeled run whenever *any other* label was added to the
  # same PR afterwards, because both runs shared the same group and cancel-in-progress killed the
  # earlier one before its job-level `if` (below) ever got a chance to skip the irrelevant one.
  # Including the event name and the label name in the group key means only a genuine re-trigger
  # of the *same* event (e.g. the 'evaluation' label removed and re-added) shares a group; a
  # different label, workflow_dispatch and schedule never collide with each other or with a
  # legitimate 'evaluation' run. cancel-in-progress stays false: a 17-minute run that used to be
  # this specific key is worth letting finish, not killing pre-emptively.
  group: retrieval-regression-${{ github.event_name }}-${{ github.event.pull_request.number || 'none' }}-${{ github.event.label.name || 'none' }}
  cancel-in-progress: false

jobs:
  evaluate:
    # Bei PR-Auslösung nur reagieren, wenn das Label tatsächlich 'evaluation' ist (jedes andere
    # Label auf demselben PR löst sonst ebenfalls "labeled" aus und würde den teuren Job unnötig
    # starten). Läuft dank der eindeutigen Concurrency-Gruppe oben unabhängig von anderen
    # Label-Events auf demselben PR.
    if: >
      github.event_name != 'pull_request' ||
      github.event.label.name == 'evaluation'
    runs-on: ubuntu-latest
    # PR #301 review, Befund 6: 20 Minuten gegen eine gemessene evaluateRetrieval-Laufzeit von
    # ~1004s (~17 min) plus Checkout, Java-Setup, Gradle-Build, Image-Pulls und ggf. einen
    # ~275-MB-Modell-Pull auf einem kalten Cache ließ praktisch keine Marge. 30 Minuten geben dem
    # Rest realistisch Raum; das Abnahmekriterium in Issue #228 ("20 Minuten") ist dazu als
    # bewusste, dokumentierte Abweichung im PR und als Issue-Kommentar festgehalten.
    #
    # Update (Issue #311): die ~1004s-Messung, auf der die 30 Minuten oben beruhten, stammte nicht
    # von einem echten GitHub-Actions-Runner — der Workflow ist seit seiner Einführung (PR #292/#301)
    # auf main noch nie erfolgreich durchgelaufen, jeder bisherige Lauf wurde entweder per
    # Label-Filter übersprungen oder lief ins Zeitlimit. Der erste nächtliche Lauf
    # (https://github.com/criew/opaa/actions/runs/30880506057) hat im Indizierungsschritt selbst
    # 1078 von 1448 Korpus-Dokumenten in 1704s geschafft (~1,58s/Dokument, aus den
    # AsyncIndexingExecutor-Log-Zeitstempeln), bevor er ins 30-Minuten-Limit lief — Checkout,
    # Java-/Gradle-Setup und Image-Pulls brauchten dabei zusammen nur rund 15s, sind also nicht die
    # Ursache. Hochgerechnet auf den vollen Korpus (1448 Dokumente) allein schon ~38 Minuten
    # Indizierung, dazu golden-Query-Auswertung (121 Anfragen, dieselbe sequenzielle
    # Ollama-Embedding-Latenz), Report- und Baseline-Schritte. Ursache ist die reale
    # GitHub-Actions-Runner-CPU (2 vCPU, geteilt zwischen Postgres-, Ollama- und
    # Anwendungs-Container) — keine Regression durch #201/#202 (deren Indizierungs-Änderungen
    # sind zwei zusätzliche, statische Setter-Aufrufe pro Dokument, keine zusätzlichen
    # Datenbank-Roundtrips). 60 Minuten geben dem gemessenen ~44-Minuten-Vollauf wieder eine
    # reale Marge, statt bei jedem Lauf erneut ins Limit zu laufen.
    #
    # Update (Issue #414): dieses Zeitbudget hat ein Gegenstück im Test selbst — den
    # Awaitility-Timeout in `awaitJobCompletion` (RetrievalEvaluationHarnessTest). Der blieb bei der
    # Anhebung oben auf 30 Minuten stehen und widersprach damit derselben Messung, auf der die 60
    # Minuten hier beruhen; PR #415 lief prompt hinein (1121 von 1448 Dokumenten). Er steht jetzt
    # auf 45 Minuten und muss unter `timeout-minutes` bleiben, damit eine hängende Indizierung als
    # diagnostizierbarer Testfehlschlag endet statt als abgebrochener Job. Wer eines der beiden
    # Limits anfasst, prüft das andere mit.
    #
    # Update (Issue #721): der Harness unterstützt jetzt mehrchunkige Domänen (dokumentbezogenes
    # k-Fenster, siehe ADR-0012 Nachtrag) — bewusst geprüft, ob dieses Budget dadurch schon jetzt
    # angepasst werden muss. Für comic-characters (Ein-Chunk-Invariante, maxChunksPerDocument=1)
    # ist chunkTopK == documentTopK == 10, also dieselbe Chunk-Zahl je Anfrage wie vor #721 — keine
    # Laufzeitänderung. Die Chunk-Map-Erzeugung (neuer Schritt, io.opaa.eval.ChunkMap) parst und
    # chunked den Korpus ein zweites Mal, aber ohne Embedding-Aufruf (kein Ollama-Roundtrip je
    # Dokument) — die dominante, sequenzielle Ollama-Embedding-Latenz bleibt unverändert. Das
    # Budget steigt erst mit der mehrchunkigen Domäne aus #234, dann anhand einer echten Messung
    # ihres Korpus, nicht spekulativ hier.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend/**/*.gradle*', 'backend/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Named Docker volume that RetrievalEvaluationHarnessTest bind-mounts into the Ollama
      # container (see its OLLAMA_MODEL_VOLUME javadoc). On a developer machine this volume
      # survives across runs; on GitHub's ephemeral runners it does not, so every scheduled run
      # would otherwise re-pull the ~275 MB model. actions/cache round-trips the volume's content
      # as a tar file instead: the pull only happens once per model digest (see the cache key
      # below), and every subsequent run restores it from GitHub's cache. Combined with
      # RetrievalEvaluationHarnessTest now skipping 'ollama pull' entirely once the expected digest
      # is already present locally (see its pullEmbeddingModel() javadoc), a warm cache run does not
      # need to download the ~275 MB embedding model again. Narrower claim than "no third-party
      # network access at all" (PR #301 review, second round): the pgvector/pgvector and
      # ollama/ollama *base images* are still pulled from Docker Hub by Testcontainers regardless of
      # this cache, independent of the embedding model.
      #
      # The cache key is pinned to the exact expected digest
      # (RetrievalEvaluationHarnessTest.EXPECTED_EMBEDDING_MODEL_DIGEST), not just the tag: a
      # deliberate model re-pin changes the digest constant, which changes this key, which means a
      # stale cache for the old model is never silently reused.
      # actions/cache/restore + actions/cache/save (issue #311), not the combined actions/cache
      # action: actions/cache's own save step only runs as a *post*-job step, and GitHub Actions
      # skips post-job steps entirely when the job's own status is 'cancelled' — which is exactly
      # what timeout-minutes produces. On a cold cache the very first scheduled run always times
      # out (indexing ~1.5k documents through the real Ollama container is itself the majority of
      # the runtime, see the timeout-minutes comment below), so the combined action's cache-key
      # never got written, next night started cold again, timed out again, forever — a
      # self-perpetuating failure with no way out except manual intervention. Splitting restore and
      # save lets the explicit save step below run as a normal, non-post job step with its own
      # `if:`, so it still executes even when the overall job is later marked cancelled.
      - name: Restore Ollama model cache
        id: ollama-cache
        uses: actions/cache/restore@v6
        with:
          path: ollama-model-cache.tar
          key: ollama-model-nomic-embed-text-v1.5-0a109f42

      - name: Seed Docker volume from cache
        if: steps.ollama-cache.outputs.cache-hit == 'true'
        run: |
          docker volume create opaa-eval-ollama-models
          docker run --rm \
            -v opaa-eval-ollama-models:/root/.ollama \
            -v "${{ github.workspace }}":/backup \
            alpine sh -c "tar xf /backup/ollama-model-cache.tar -C /root/.ollama"

      - name: Retrieval-Regression ausführen
        working-directory: backend
        run: ./gradlew checkRetrievalBaseline

      # PR #301 review, Befund 3 (zweite Runde: die Größenprüfung allein reicht nicht — ein Pull,
      # der z. B. bei ~60% abbricht, kann die 150-MB-Schwelle bereits überschreiten und würde
      # trotzdem dauerhaft unter dem unveränderlichen Cache-Schlüssel landen; Ollama hinterlässt
      # dabei unvollständige Blobs statt eines fertigen Manifests). Dieser Schritt lief zunächst
      # unconditionally (always()) mit fixem Cache-Schlüssel und rein größenbasierter Prüfung.
      # actions/cache-Schlüssel sind unveränderlich — ein unvollständig gespeicherter Export bliebe
      # sonst für immer als vermeintlicher Treffer bestehen, ohne dass es auffällt. Die Prüfung
      # unten kombiniert deshalb zwei Signale: Größe (>150 MB, fängt den leeren/sehr kleinen Fall)
      # UND Vollständigkeit (kein '*partial*'-Blob, das fertige Modell-Manifest liegt unter dem für
      # 'nomic-embed-text:v1.5' erwarteten Pfad). Nur wenn beides zutrifft, wird exportiert; sonst
      # bleibt der Cache-Pfad leer und der nächste Lauf zieht das Modell einfach erneut aus dem
      # Netz — kein dauerhafter Schaden, nur ein Retry.
      - name: Docker-Volume für den Cache exportieren
        if: always()
        run: |
          if docker volume inspect opaa-eval-ollama-models >/dev/null 2>&1; then
            size=$(docker run --rm -v opaa-eval-ollama-models:/root/.ollama alpine \
              du -sb /root/.ollama 2>/dev/null | cut -f1 || echo 0)
            partial=$(docker run --rm -v opaa-eval-ollama-models:/root/.ollama alpine \
              find /root/.ollama -iname '*partial*' 2>/dev/null | head -1)
            manifest_present=$(docker run --rm -v opaa-eval-ollama-models:/root/.ollama alpine \
              sh -c "test -f /root/.ollama/models/manifests/registry.ollama.ai/library/nomic-embed-text/v1.5 && echo yes || echo no")
            echo "Ollama-Volume-Größe: ${size:-0} Bytes, unvollständige Blobs: '${partial:-keine}', Manifest vorhanden: ${manifest_present}"
            if [ "${size:-0}" -gt 150000000 ] && [ -z "$partial" ] && [ "$manifest_present" = "yes" ]; then
              docker run --rm \
                -v opaa-eval-ollama-models:/root/.ollama \
                -v "${{ github.workspace }}":/backup \
                alpine sh -c "tar cf /backup/ollama-model-cache.tar -C /root/.ollama ."
            else
              echo "Volume zu klein, unvollständig oder fehlend — Export übersprungen, um den Cache-Schlüssel nicht dauerhaft zu vergiften."
            fi
          else
            echo "Docker-Volume opaa-eval-ollama-models existiert nicht — Export übersprungen."
          fi

      # Runs as an ordinary job step (see the comment on "Restore Ollama model cache" above), so
      # `if: always()` here genuinely means always — including when the job is cancelled by
      # timeout-minutes, unlike actions/cache's built-in post-job save. Guarded on the tar file
      # actually existing (hashFiles returns '' when nothing matches) because actions/cache/save
      # fails the step outright if the given path doesn't exist, and the export step above
      # deliberately leaves no file behind when the volume was too small to be a valid model cache.
      # actions/cache/save itself is a no-op (warns, does not fail) if this exact key was already
      # saved by an earlier run — cache keys are immutable, so that is expected once warm.
      - name: Ollama model cache speichern
        if: always() && hashFiles('ollama-model-cache.tar') != ''
        uses: actions/cache/save@v6
        with:
          path: ollama-model-cache.tar
          key: ollama-model-nomic-embed-text-v1.5-0a109f42

      # Baseline-Absenkung gegenüber main (ADR-0013, Entscheidung 6) läuft NICHT hier: Sie hängt an
      # dieses Label-gated Docker-lastige Verfahren zu koppeln hieße, dass ein PR, der die Baseline
      # absenkt, aber nie das Label 'evaluation' bekommt, überhaupt keinen Hinweis erzeugt (PR #301
      # review, zweite Runde). Stattdessen läuft `eval/baseline/diff_baseline.py` für **jeden** PR,
      # der `eval/baseline/**` ändert, unabhängig vom Label — siehe
      # .github/workflows/baseline-diff.yml, ein separater, Docker-freier und daher sehr schneller
      # Workflow.
      - name: Report der Job-Zusammenfassung hinzufügen
        if: always()
        run: |
          if [ -f backend/build/eval-reports/baseline-comparison.md ]; then
            cat backend/build/eval-reports/baseline-comparison.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Report als Artefakt hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: retrieval-metrics
          path: |
            backend/build/eval-reports/retrieval-metrics.json
            backend/build/eval-reports/baseline-comparison.md
          if-no-files-found: warn
          retention-days: 90

      # Bei Auslösung per PR-Label: Ergebnis als PR-Kommentar mit Delta-Tabelle (Issue #228,
      # Umfang). Läuft unabhängig davon, ob der vorige Schritt bestanden hat oder nicht — genau dann
      # ist der Kommentar am wichtigsten. continue-on-error (PR #301 review, Befund 5): löst ein
      # Fork den Lauf aus, ist das Standard-GITHUB_TOKEN schreibgeschützt und dieser Schritt
      # scheitert mit 403 — das darf den eigentlichen Retrieval-Befund (vorheriger Schritt) nicht
      # überdecken.
      - name: Delta-Tabelle als PR-Kommentar posten
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const comparisonPath = 'backend/build/eval-reports/baseline-comparison.md';

            const body = fs.existsSync(comparisonPath)
              ? fs.readFileSync(comparisonPath, 'utf8')
              : '## Retrieval-Regression gegen Baseline\n\nDer Lauf hat keinen Report erzeugt ' +
                '(vermutlich vor der Baseline-Prüfung abgebrochen) — siehe die Workflow-Logs für ' +
                'Details.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      # Nächtlicher/manueller Lauf hat kein PR, das einen Fehlschlag sichtbar macht — ohne diesen
      # Schritt wäre ein Regressionsfund für niemanden sichtbar, bis zufällig jemand in die
      # Actions-Läufe schaut. Sucht ein offenes, mit dem festen Marker versehenes Issue und
      # kommentiert es, statt bei jedem nächtlichen Fehlschlag ein weiteres Duplikat anzulegen oder
      # (PR #301 review) eine bereits vorhandene Analyse im Body zu überschreiben.
      #
      # `if: failure() || cancelled()` statt nur `failure()` (Befund 6): Ein Abbruch durch
      # `timeout-minutes` markiert den Job als cancelled, nicht als failed — `failure()` allein
      # hätte einen reinen Timeout-Fehlschlag lautlos durchrutschen lassen, ohne Alarm-Issue und
      # ohne Artefakt-Hinweis.
      - name: Fehlschlag als Issue melden (nächtlicher/manueller Lauf)
        if: (failure() || cancelled()) && github.event_name != 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- retrieval-regression-alert -->';
            const path = 'backend/build/eval-reports/baseline-comparison.md';
            const details = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : '_Kein Report ' +
              'erzeugt — vermutlich vor der Baseline-Prüfung abgebrochen (z. B. Manifest- oder ' +
              'Ein-Chunk-Invariante-Verletzung) oder durch das Zeitlimit abgebrochen. Siehe ' +
              'Workflow-Logs._';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const commentBody = `Erneut fehlgeschlagen: ${runUrl}\n\n${details}`;
            const issueBody = `${marker}\n\n**Automatischer nächtlicher Retrieval-Regressionslauf ` +
              `fehlgeschlagen.**\n\nWorkflow-Lauf: ${runUrl}\n\n${details}`;

            // per_page: 100 statt der 30er-Default-Seite, und ausdrücklicher Ausschluss von Pull
            // Requests (PR #301 review): listForRepo mit label 'evaluation' liefert auch offene
            // PRs zurück, weil 'evaluation' zugleich das Auslöser-Label ist — ohne den Filter und
            // ohne ausreichende Seitengröße könnte das Alarm-Issue von der ersten Seite rutschen
            // und ein Duplikat entstehen.
            const { data: issuesAndPrs } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'evaluation',
              per_page: 100,
            });
            const existing = issuesAndPrs.find(
              i => !i.pull_request && i.body && i.body.includes(marker)
            );
            if (existing) {
              // Nur kommentieren, nie den Body überschreiben (PR #301 review) — eine eingetragene
              // Analyse des Maintainers im Issue-Body wäre sonst beim nächsten Fehlschlag weg.
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: commentBody,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Retrieval-Regression erkannt (automatischer Lauf)',
                body: issueBody,
                labels: ['evaluation', 'bug'],
              });
            }

      # Spiegelbild des vorigen Schritts: schließt/kommentiert das Alarm-Issue automatisch, sobald
      # ein nächtlicher/manueller Lauf wieder grün ist, statt es als vermeintlich offenes Problem
      # liegen zu lassen.
      - name: Alarm-Issue bei erneutem Bestehen schließen
        if: success() && github.event_name != 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- retrieval-regression-alert -->';
            const { data: issuesAndPrs } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'evaluation',
              per_page: 100,
            });
            // Provenance check (PR #301 review): only ever touch an issue that actually carries
            // this workflow's own marker — never assume "some open issue labeled evaluation" is
            // the one this workflow created.
            const existing = issuesAndPrs.find(
              i => !i.pull_request && i.body && i.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: 'Der nächtliche Retrieval-Regressionslauf ist wieder grün: ' +
                  `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
              });
            }
