name: Demo-Smoke

# Not a Required Check and, like .github/workflows/e2e.yml, not run on pull requests:
# indexing the full Rheinfurt corpus (~150-300 documents across six connector-fed libraries plus
# 26 uploads, docs/features/demo-instance.md) takes noticeably longer than the "e2e" data profile
# that e2e.yml's own run covers, and this workflow's only job is to catch regressions in the
# "demo" Compose profile/seed themselves (Issue #232), not to gate every PR on that extra time.
# Nightly via schedule (same post-merge QA reasoning as e2e.yml) plus workflow_dispatch, so it can
# be triggered on demand before a presentation or right after a corpus/seed change.
on:
  schedule:
    - cron: '42 3 * * *'
  workflow_dispatch: {}

# Same reasoning as the concurrency group in e2e.yml:
# github.sha in the group means a manual workflow_dispatch and the nightly schedule never share a
# group unless they happen to target the exact same commit, so triggering one on demand shortly
# before/after the nightly run cancels neither.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

env:
  COMPOSE_PROJECT_NAME: opaa-demo-smoke

jobs:
  demo-smoke:
    runs-on: ubuntu-latest
    # The demo seed itself budgets up to 600s per indexing run (scripts/run-e2e.mjs --target
    # demo); this workflow's own budget has to cover six such runs plus 26 upload waits, on top
    # of the image build below - generous on purpose, this job is not on any merge-blocking path.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Same pre-build + load pattern as e2e.yml, tagged for Compose project "opaa-demo-smoke"
      # (<project>-<service>:latest) so scripts/run-e2e.mjs can run with E2E_SKIP_BUILD=true and
      # reuse these images instead of rebuilding them from inside the timed run.
      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # Repo-root context (issue #896): backend's Gradle build depends on the sibling
          # opaa-api/ module via settings.gradle.kts, so a context scoped to backend/ alone would
          # not see it.
          context: .
          file: backend/Dockerfile
          tags: opaa-demo-smoke-backend:latest
          load: true
          cache-from: type=gha,scope=demo-smoke-backend
          cache-to: type=gha,mode=max,scope=demo-smoke-backend

      - name: Build frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: frontend/Dockerfile
          tags: opaa-demo-smoke-frontend:latest
          load: true
          cache-from: type=gha,scope=demo-smoke-frontend
          cache-to: type=gha,mode=max,scope=demo-smoke-frontend

      # Installs the pnpm version pinned in the "packageManager" field of
      # e2e/package.json.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: e2e/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml

      # demo/seed/seed.py needs python3 + pip on the runner, same as e2e.yml.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install E2E dependencies
        working-directory: e2e
        run: pnpm install --frozen-lockfile

      - name: Type-check E2E suite
        working-directory: e2e
        run: pnpm run typecheck

      - name: Resolve Playwright version
        id: playwright-version
        working-directory: e2e
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        working-directory: e2e
        timeout-minutes: 6
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi

      - name: Run demo smoke test
        working-directory: e2e
        run: pnpm run test:demo-smoke
        env:
          E2E_SKIP_BUILD: 'true'

      # if: !cancelled() (not failure()) on purpose: when the job hits timeout-minutes, GitHub
      # marks it cancelled, not failed, and if: failure() would silently skip artifact upload in
      # exactly the case investigators need it most (matches e2e.yml).
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-smoke-playwright-report
          path: e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload traces & screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-smoke-playwright-traces
          path: e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload container logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-smoke-docker-compose-logs
          path: e2e/docker-compose.demo-smoke.log
          if-no-files-found: ignore
          retention-days: 14
