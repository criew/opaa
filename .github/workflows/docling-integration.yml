name: Docling-Integration

# Bewusst NICHT bei jedem Pull Request: der Lauf startet ein echtes docling-serve (CPU-Image,
# mehrere Gigabyte) in Docker, und die erste Umwandlung lädt Layout-, Tabellen- und OCR-Modelle.
# Der Stub des Texterkennungs-Clients (io.opaa.llm.TextRecognitionClientTest) läuft dagegen mit
# jedem PR im regulären Backend-Job; diese Suite ist die zusätzliche Abnahme gegen die echte API.
on:
  schedule:
    # Nach Confluence, Keycloak und Nextcloud, damit nicht mehrere speicherhungrige Container um
    # denselben Runner konkurrieren.
    - cron: '25 6 * * *'
  workflow_dispatch: {}
  # Kein branches-Filter: die Suite muss auch auf gestapelten PRs (Basis = anderer Feature-Branch)
  # per Label startbar sein; das Opt-in regelt die if-Bedingung des Jobs.
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: docling-integration-${{ github.event_name }}-${{ github.event.pull_request.number || 'none' }}-${{ github.event.label.name || 'none' }}
  cancel-in-progress: false

jobs:
  docling:
    name: docling-serve im Container
    # Bei pull_request nur, wenn das Label "docling-suite" gesetzt wurde - ein Opt-in je PR für
    # Änderungen an der Texterkennung, ohne jeden PR zu belasten.
    if: github.event_name != 'pull_request' || github.event.label.name == 'docling-suite'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.4+101.0.LTS'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Docling-Integrationstests ausführen
        run: ./gradlew doclingIntegrationTest

      - name: Testberichte hochladen
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docling-integration-test-reports
          path: backend/build/reports/tests/
          retention-days: 14
