# Groups the generated release notes (publish-images.yml, job "release") by PR label.
changelog:
  exclude:
    labels:
      - duplicate
      - invalid
      - wontfix
  categories:
    - title: Sicherheit
      labels:
        - security
    # After "Sicherheit": the first matching category wins, so a Renovate PR with "security" stays there.
    - title: Abhängigkeiten
      labels:
        - dependencies
    - title: Neue Funktionen
      labels:
        - enhancement
    - title: Fehlerbehebungen
      labels:
        - bug
    - title: Dokumentation
      labels:
        - documentation
    - title: Weitere Änderungen
      labels:
        - "*"
