# Groups the generated release notes (publish-images.yml, job "release") by PR label.
changelog:
  exclude:
    labels:
      - duplicate
      - invalid
      - wontfix
  categories:
    # The first matching category wins and a PR appears only once. Data impact comes first so that a
    # PR with "enhancement", "bug" or "security" besides "data-impact" still shows up here.
    - title: Datenrelevante Änderungen
      labels:
        - data-impact
    - title: Sicherheit
      labels:
        - security
    # After "Sicherheit": a Renovate PR with "security" stays there.
    - title: Abhängigkeiten
      labels:
        - dependencies
    - title: Neue Funktionen
      labels:
        - enhancement
    - title: Fehlerbehebungen
      labels:
        - bug
    - title: Dokumentation
      labels:
        - documentation
    - title: Weitere Änderungen
      labels:
        - "*"
