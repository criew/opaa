# Security headers of every response, included by each block of nginx.conf that sets add_header:
# a block with its own add_header replaces the inherited set instead of adding to it. "always" also
# covers error responses. Rationale and operator-facing details in
# docs/handbuch/betrieb/netz-und-sicherheit.md#sicherheits-header-und-strict-transport-security.
#
# $opaa_frame_ancestors and $opaa_frame_options come from maps in nginx.conf: framing is refused
# everywhere except the self-disclosure download, which the application frames itself.
#
# ${OPAA_CSP_CONNECT_SRC_EXTRA} is substituted at container start (this file is an envsubst
# template, see Dockerfile) and validated by docker-entrypoint.d/05-opaa-runtime.sh.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' ${OPAA_CSP_CONNECT_SRC_EXTRA}; object-src 'none'; frame-ancestors $opaa_frame_ancestors; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options $opaa_frame_options always;
add_header Referrer-Policy "same-origin" always;
# Dictation records from the microphone on the application's own origin; nothing uses the camera
# or the location.
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
# Another origin's window keeps no handle on an OPAA tab, and no other origin may embed OPAA's
# responses as no-cors subresources. Every sign-in and consent flow is a full-page redirect, never
# a popup that reports back through window.opener, so neither header affects them.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
