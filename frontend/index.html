<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Only the title of the very first paint. Once the app has the branding configuration it sets
      document.title to the operator's product name (usePageTitle, #583); there is no server-side
      rendering that could put it here before the first byte reaches the browser.
    -->
    <title>OPAA</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Container-runtime flag (#230), substituted by nginx at container start, not baked into the
      build (see frontend/nginx.conf, frontend/Dockerfile). public/runtime-config.js provides the
      default ("false") for `npm run dev`/`npm run build` previews, where nginx never runs.
    -->
    <script src="/runtime-config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
