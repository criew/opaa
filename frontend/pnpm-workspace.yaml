# Settings for this standalone project (pnpm reads them from here, not from
# a "pnpm" field in package.json). No "packages" list on purpose - this is
# not a multi-package workspace.

# msw's postinstall only prints a sponsorship notice; the service worker in
# public/ is committed. No need to run it. Under npm the postinstall also kept
# public/mockServiceWorker.js in sync on every install - that no longer
# happens, so after upgrading msw run: pnpm exec msw init public/ --save
allowBuilds:
  msw: false

# openapi-typescript declares a typescript@^5 peer but works with the
# project's typescript 6 (npm formerly enforced this via "overrides").
peerDependencyRules:
  allowedVersions:
    'openapi-typescript>typescript': '>=6.0.0'

# #1013: Befristete, gezielte Ausnahme von pnpms 24-h-Mindestalter (Supply-Chain-Schutz,
# #954) fuer die auf Maintainer-Anweisung vorgezogenen Renovate-Updates vom 28.08.2026
# (#1009/#1010/#1011). NUR diese Pakete; der Rueckbau folgt als zweiter PR unter #1013,
# sobald auch das juengste Release die Frist erfuellt (29.08. ~05:30 CEST).
minimumReleaseAgeExclude:
  - '@testing-library/react'
  - '@vitejs/plugin-react'
  - '@mui/*'
