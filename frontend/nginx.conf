# Preserve the scheme the outer TLS-terminating proxy reports. This container is an inner hop
# that only ever speaks plain http; overwriting X-Forwarded-Proto with $scheme here made the
# backend classify same-origin browser requests as cross-origin (https origin vs. http request)
# and apply CORS checks to every call - see #553. Fall back to $scheme when no outer proxy is
# involved (e2e stack, local docker compose).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Do not reveal the nginx version in the Server header or on error pages (#409).
server_tokens off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (#409). "always" makes nginx add these to error responses too, not just
    # 2xx/3xx - without it a 404 or 500 would ship without them. Set at server level so both
    # location blocks below inherit them: add_header does NOT inherit into a location block that
    # defines its own add_header directives (only entirely add_header-free blocks inherit), so
    # if a future change adds add_header inside location /api/, these lines must be repeated
    # there too.
    #
    # Content-Security-Policy enforces ADR-0004 (self-hosted frontend resources, no external
    # CDNs) at the browser: everything defaults to same-origin, and script/style/img/font/connect
    # are pinned to 'self' explicitly rather than relying on default-src alone, so a change to any
    # one of them is a deliberate, visible edit here.
    #
    # style-src 'unsafe-inline' is required, not optional: MUI's Emotion engine injects styles via
    # inline <style> tags at runtime (CSSOM insertion), not via <link> or nonce-able injection.
    # There is no CSP-strict way to allow Emotion's runtime style tags without either
    # 'unsafe-inline' or a per-request nonce/hash, and Emotion does not support nonces without
    # substantial extra wiring. Verified against the production build (npm run build) that no
    # inline *script* is emitted (Vite writes hashed, self-hosted <script> files), so script-src
    # deliberately stays without 'unsafe-inline'.
    #
    # connect-src 'self' covers /api/ (same origin) and, for OIDC deployments, requires the
    # identity provider to be reachable under the same origin as the frontend - exactly the
    # pattern already documented for the public instance (Keycloak mounted under /idp behind the
    # same outer proxy, see docs/deployment.md). oidc-client-ts exchanges the auth code for tokens
    # via a same-page fetch to the authority's token endpoint, so a cross-origin authority would
    # be blocked by this policy. The docker-compose "oidc" profile's standalone Keycloak on its
    # own port (8180) is a local dev/demo convenience outside that pattern and is not covered;
    # anyone testing OIDC locally under this policy needs to front Keycloak under the same origin
    # too, as production does.
    #
    # img-src adds data: and blob: to 'self': blob: is needed for the branding logo upload
    # preview (BrandingSettingsPage.tsx, URL.createObjectURL before the file is saved), data:
    # for any small inlined assets Vite may emit below its inlining threshold.
    #
    # frame-ancestors 'none' subsumes X-Frame-Options: DENY for browsers that honor CSP, but
    # X-Frame-Options is kept alongside for the few that only understand the older header.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Inherited server-level add_header directives above apply here too: this location has
        # no add_header of its own, so nginx's "location without add_header inherits the parent's"
        # rule keeps them intact. Verified with curl against the built image (see PR description).

        # Must stay >= the backend's upload limit (OPAA_UPLOAD_MAX_FILE_SIZE, default 52428800B =
        # 50 MiB, see backend/src/main/resources/application.yml) - and deliberately a little above
        # it (52m, not 50m): nginx measures the whole multipart request body (file bytes plus
        # framing/boundary/header overhead), while the backend's check is on the file size alone.
        # Setting this to exactly 50m would let nginx answer its own HTML 413 for a file just under
        # the backend's limit, before GlobalExceptionHandler's German message ("... hoechstens 50
        # MB.") ever gets a chance to run. nginx's own default is 1 MB and would otherwise reject
        # every larger upload the same way - see #519. This value is not templated from the env var
        # because frontend/Dockerfile bakes nginx.conf into the image at build time without
        # envsubst; raise both together if OPAA_UPLOAD_MAX_FILE_SIZE is ever changed.
        client_max_body_size 52m;
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
