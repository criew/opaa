# Preserve the scheme the outer TLS-terminating proxy reports. This container is an inner hop
# that only ever speaks plain http; overwriting X-Forwarded-Proto with $scheme here would make the
# backend classify same-origin browser requests as cross-origin (https origin vs. http request)
# and apply CORS checks to every call. Fall back to $scheme when no outer proxy is involved (e2e
# stack, local docker compose).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# ${OPAA_DEMO_MODE} is substituted by envsubst at container start - a plain, unescaped text
# replacement into this config file, not an nginx-level substitution. A raw operator value with a
# stray ", ' or $ could otherwise inject content into the /runtime-config.js response body below.
# The first map turns the raw substituted text into a real nginx variable ($host is only used as
# an always-defined, irrelevant match key here); the second map then normalizes that variable to
# a literal "true"/"false" via nginx's own literal-string matching, so anything other than the
# exact string "true" safely falls through to "false" - the frontend side is already fail-closed
# the same way (runtimeConfig.ts only treats the exact string "true" as enabled).
map $host $opaa_demo_mode_raw {
    default "${OPAA_DEMO_MODE}";
}
map $opaa_demo_mode_raw $opaa_demo_mode_flag {
    default false;
    true    true;
}

# The provider of a sign-in or an OAuth consent returns to /auth/callback or /connections/callback
# with a single-use code and state in the query. The access log keeps the query of every other
# request but drops it on these two pages, in the request line and in the Referer their own asset
# requests carry. Otherwise the format is the base image's "main".
map $request_uri $opaa_logged_uri {
    default                                      $request_uri;
    "~^(/(?:connections|auth)/callback)(?:\?|$)" $1;
}
map $http_referer $opaa_logged_referer {
    default                                      $http_referer;
    "~^([^?]*/(?:connections|auth)/callback)\?"  $1;
}
log_format opaa_main '$remote_addr - $remote_user [$time_local] '
                     '"$request_method $opaa_logged_uri $server_protocol" $status $body_bytes_sent '
                     '"$opaa_logged_referer" "$http_user_agent" "$http_x_forwarded_for"';

# Framing headers of security-headers.conf. Only the self-disclosure download may be framed, by the
# application itself: the settings page submits the ticket into a hidden frame, so that a refusal
# does not replace the application, and browsers cancel a download in a frame that refuses framing.
# Its answer is a ZIP or an error, nothing to click on.
map $uri $opaa_frame_options {
    default                             DENY;
    /api/v1/me/self-disclosure/download SAMEORIGIN;
}
map $uri $opaa_frame_ancestors {
    default                             "'none'";
    /api/v1/me/self-disclosure/download "'self'";
}

# Do not reveal the nginx version in the Server header or on error pages.
server_tokens off;

# Read by @opaa_backend_reconnect after a start failed: 1 when no attempt got a connection ("-" in
# every entry; "," separates attempts, ":" starts) and at most two starts lie behind, so
# /_opaa_once/ (recursive_error_pages on) starts at most three times; elsewhere the first restart
# is final.
# volatile, so a value read earlier in the request is not reused.
map $upstream_connect_time $opaa_backend_unreached {
    volatile;
    "~^-(, -)*( : -(, -)*)?$" 1;
    default                   0;
}
map $upstream_status $opaa_backend_timed_out {
    volatile;
    "~504$" 1;
    default 0;
}

# nginx sends a request whose attempt failed after the connection to the next peer unless its
# method is POST, PATCH or LOCK. Fine for the safe GET, HEAD and OPTIONS; every other method goes
# through /_opaa_once/, so a PUT or DELETE a backend may have carried out is never sent again.
map $request_method $opaa_backend_once {
    GET     0;
    HEAD    0;
    OPTIONS 0;
    POST    0;
    PATCH   0;
    default 1;
}

# Where /api/ and /mcp go: OPAA_BACKEND_UPSTREAM, written as a server line by
# docker-entrypoint.d/05-opaa-runtime.sh, resolved once at start or, with OPAA_BACKEND_RESOLVER, at
# runtime; each address is one peer, so requests spread over all containers behind the name. A
# failed peer stays in the rotation (max_fails=0): a replaced container keeps its address while it
# starts, and parking it could leave no live peer once the other instance stops.
upstream opaa_backend {
    zone opaa_backend 64k;
    include /tmp/nginx/upstream.d/*.conf;
}

# The same addresses for /_opaa_once/, which tries one peer per start: a peer whose attempt failed
# sits out for a second (max_fails=1), so the next start meets another one. While every peer sits
# out, the same addresses as backup (max_fails=0) take the requests: parking never ends a request.
upstream opaa_backend_once {
    zone opaa_backend_once 64k;
    include /tmp/nginx/upstream-once.d/*.conf;
}

server {
    listen 8080;
    # Adds "listen [::]:8080;" when the container has IPv6, see docker-entrypoint.d/05-opaa-runtime.sh.
    include /tmp/nginx/listen.d/*.conf;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log opaa_main;

    # Security headers of every response; each location below that sets its own add_header includes
    # the same file, because it would not inherit them otherwise.
    include /tmp/nginx/conf.d/snippets/security-headers.conf;

    # Bounds only the connection to a backend, which takes milliseconds when the backend is there;
    # the answer is bounded by proxy_read_timeout. The address of a stopped container stays a peer
    # until the resolver drops it, and a connection to it neither succeeds nor is refused: after this
    # time the request moves on instead of waiting for nginx's default of 60 s. 4 s outlasts two lost
    # SYNs (Linux retransmits after about 1 s and 3 s), so a backend under load is not given up early.
    proxy_connect_timeout 4s;
    # At most three peers per start: with many resolved addresses and none answering, a request waits
    # at most 3 x 4 s per start (two starts with @opaa_backend_reconnect), not 4 s per address;
    # /_opaa_once/ tries one peer in each of up to three starts.
    proxy_next_upstream_tries 3;

    # A request whose attempts all failed without a connection enters its location once more and
    # starts over on the current peer list. nginx moves an attempt to the next peer only while that
    # list is the one the request started with; once the resolver has dropped or added an address,
    # a failed attempt ends the request. Nothing reached a backend, so even a POST is sent once only.
    # A request that did reach a backend gets the status of its failure. A second failure is final
    # where recursive_error_pages is off; /_opaa_once/ turns it on and starts at most three times.
    location @opaa_backend_reconnect {
        if ($opaa_backend_unreached) {
            rewrite ^ $uri last;
        }
        if ($opaa_backend_timed_out) {
            return 504;
        }
        return 502;
    }

    # Runtime flag for the demo/source notice: a same-origin script, generated at container
    # start from ${OPAA_DEMO_MODE} (envsubst template, see Dockerfile) via $opaa_demo_mode_flag
    # above, so operators can turn the notice on for a demo instance without rebuilding the image.
    # Off by default - the notice belongs only on demo instances, not on every OPAA installation.
    location = /runtime-config.js {
        default_type application/javascript;
        add_header Cache-Control "no-store";
        include /tmp/nginx/conf.d/snippets/security-headers.conf;
        return 200 "window.__OPAA_DEMO_MODE__ = '$opaa_demo_mode_flag';";
    }

    # Without an explicit Cache-Control, browsers cache index.html heuristically and
    # keep referencing the previous deployment's hashed bundles until a hard reload.
    # "no-cache" forces revalidation on every load - the ETag turns that into a cheap 304.
    # try_files' /index.html fallback re-enters location matching (internal redirect), so
    # SPA routes get these headers too.
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /tmp/nginx/conf.d/snippets/security-headers.conf;
    }

    # The build emits content-hashed filenames under /assets/ - a changed file is a new URL,
    # so these may cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /tmp/nginx/conf.d/snippets/security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # PUT, DELETE and other changing methods take /_opaa_once/, see $opaa_backend_once.
        if ($opaa_backend_once) {
            rewrite ^ /_opaa_once$uri last;
        }

        # Spring Security's defaults already set X-Content-Type-Options/X-Frame-Options on every
        # backend response; strip them here so the add_header directives above (inherited from
        # the server block) are the only copies the client sees, not a duplicate.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;

        # Must stay >= the backend's upload limit (OPAA_UPLOAD_MAX_FILE_SIZE, default 52428800B =
        # 50 MiB, see backend/src/main/resources/application.yml) - and deliberately a little above
        # it (52m, not 50m): nginx measures the whole multipart request body (file bytes plus
        # framing/boundary/header overhead), while the backend's check is on the file size alone.
        # Setting this to exactly 50m would let nginx answer its own HTML 413 for a file just under
        # the backend's limit, before GlobalExceptionHandler's German message ("... hoechstens 50
        # MB.") ever gets a chance to run. nginx's own default is 1 MB and would otherwise reject
        # every larger upload the same way. This value is not templated from the env var
        # because raising it needs a coordinated change, not a per-deployment override; raise both
        # together if OPAA_UPLOAD_MAX_FILE_SIZE is ever changed.
        client_max_body_size 52m;
        # /tmp is RAM in the hardened compose stack: a slow client of a large response (a document
        # original) buffers at most this much there, beyond it nginx streams at the client's pace.
        proxy_max_temp_file_size 64m;
        proxy_pass http://opaa_backend/api/;
        error_page 502 504 = @opaa_backend_reconnect;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Appends this hop's own view of the client to whatever chain arrived. The backend reads the
        # chain from the right and takes the first address that is not a trusted proxy
        # (OPAA_RATE_LIMIT_TRUSTED_PROXY_CIDRS names this container's fixed address, see
        # .env.docker.example) - so a client-supplied prefix never counts, and an outer proxy that
        # appends as well is walked through once its address is on the same list.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # A client-supplied RFC 7239 "Forwarded" header would otherwise reach the backend, whose
        # framework-level header processing prefers it over X-Forwarded-*. Neither it nor
        # X-Forwarded-Host, -Port and -Prefix is expected from upstream of this container; they
        # would let a client rewrite the host, port and context path the backend sees, so all four
        # are dropped rather than forwarded. The host comes from Host above.
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # A chat answer arrives in one piece after retrieval, reranking and the model call, which
        # together may take minutes. ${OPAA_BACKEND_READ_TIMEOUT} is substituted at container start
        # and validated by 05-opaa-runtime.sh. Its default covers retrieval, the rerank budget and
        # one model call per step; retried model calls are not covered. Every proxy in front of
        # this container needs at least the same value.
        proxy_read_timeout ${OPAA_BACKEND_READ_TIMEOUT};
    }

    # The methods $opaa_backend_once marks. A backend may carry out such a request without
    # answering, so an attempt that got a connection is never followed by another; only a start
    # without one begins anew. The URI arrives decoded and re-escaped, as on any restart. The
    # forwarding contract is the one of /api/ - both blocks must stay in step.
    location ^~ /_opaa_once/ {
        internal;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;

        client_max_body_size 52m;
        proxy_max_temp_file_size 64m;
        proxy_pass http://opaa_backend_once/;
        proxy_redirect off;
        proxy_next_upstream off;
        recursive_error_pages on;
        error_page 502 504 = @opaa_backend_reconnect;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout ${OPAA_BACKEND_READ_TIMEOUT};

        # Requests from /mcp and /api/v1/transcriptions keep the body limit of their origin, held in
        # memory, also when the body comes without a declared length.
        location ^~ /_opaa_once/mcp {
            internal;
            client_max_body_size 1m;
            client_body_buffer_size 1m;
            proxy_pass http://opaa_backend_once/mcp;
        }
        location = /_opaa_once/api/v1/transcriptions {
            internal;
            client_max_body_size 11m;
            client_body_buffer_size 11m;
            proxy_pass http://opaa_backend_once/api/v1/transcriptions;
        }
    }

    # Dictation recordings must never reach a disk: the body is held in one memory buffer
    # and streamed to the backend instead of being spooled to a temporary file. The size matches the
    # backend's default OPAA_TRANSCRIPTION_MAX_AUDIO_BYTES (10 MiB) plus a little headroom.
    # The forwarding contract is the one of /api/ above - both blocks must stay in step, except for
    # @opaa_backend_reconnect: without request buffering nginx keeps no body for a second start.
    location = /api/v1/transcriptions {
        if ($opaa_backend_once) {
            rewrite ^ /_opaa_once$uri last;
        }

        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;

        client_max_body_size 11m;
        client_body_buffer_size 11m;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://opaa_backend/api/v1/transcriptions;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout ${OPAA_BACKEND_READ_TIMEOUT};
    }

    # The self-disclosure ZIP is streamed by the backend as it is written, up to some hundred MB.
    # Without buffering nginx neither holds it back nor spools it to /tmp, and the backend counts an
    # export only once its last block left - so the gap between "counted" and "arrived" stays small.
    # The read timeout bounds a pause between two blocks, not the whole download. The forwarding
    # contract is the one of /api/ above - both blocks must stay in step.
    location = /api/v1/me/self-disclosure/download {
        # The backend allows same-origin framing here itself; its frame-ancestors would only
        # duplicate the one in the full policy of security-headers.conf, which stays the only copy.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;

        client_max_body_size 1k;
        proxy_pass http://opaa_backend/api/v1/me/self-disclosure/download;
        error_page 502 504 = @opaa_backend_reconnect;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        gzip off;
        proxy_read_timeout ${OPAA_BACKEND_READ_TIMEOUT};
    }

    # The chat answer as an event stream (text/event-stream): every model chunk has to reach the
    # browser at once, so nginx neither buffers nor compresses it. The read timeout bounds a pause
    # between two events - the backend sends a keep-alive comment every 10 s while it waits for the
    # model - not the whole answer. The forwarding contract is the one of /api/ above - both blocks
    # must stay in step.
    location = /api/v1/query/stream {
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;

        client_max_body_size 1m;
        proxy_pass http://opaa_backend/api/v1/query/stream;
        error_page 502 504 = @opaa_backend_reconnect;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        gzip off;
        proxy_read_timeout ${OPAA_BACKEND_READ_TIMEOUT};
    }

    # The MCP endpoint of the external-access channel. Without this block the SPA fallback
    # in "location /" would answer an MCP client with index.html instead of the backend's own reply.
    # The forwarding contract is the one of /api/ above - both blocks must stay in step, so that
    # the backend resolves the client address of a call over either path the same way.
    #
    # A regular expression, not "= /mcp": a matrix parameter or a trailing slash (/mcp;x=1, /mcp/)
    # would otherwise miss the exact match and end up in the SPA fallback, where the caller could
    # not tell the application's own page from the endpoint's answer. What such a request means is
    # the backend's decision (io.opaa.mcp.McpEndpoint), so it has to reach the backend. proxy_pass
    # therefore carries no URI part: nginx then forwards the request line unchanged, including a
    # percent-encoded spelling (/%6Dcp), which it only decodes to match this location. A request
    # started over by @opaa_backend_reconnect or passed on by /_opaa_once/ (DELETE, PUT) arrives
    # decoded and re-escaped instead: /%6Dcp as /mcp, which the backend matches the same way, but an
    # encoded delimiter such as %2F or %3B as a literal / or ; - the backend's firewall refuses the
    # encoded form and handles the literal one like any client sending it directly.
    location ~ "^/mcp(?:[;/]|$)" {
        if ($opaa_backend_once) {
            rewrite ^ /_opaa_once$uri last;
        }

        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;

        # JSON-RPC requests only; no upload path leads here. nginx's own default would be 1m as
        # well - named here so the limit of this path is a decision, not an inherited value.
        client_max_body_size 1m;
        proxy_pass http://opaa_backend;
        error_page 502 504 = @opaa_backend_reconnect;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # Streamable HTTP may answer as text/event-stream: buffering would hold such a response
        # back until it ends, and HTTP/1.0 upstream (nginx's proxy default) would forbid the
        # chunked framing it arrives in. The read timeout bounds a stream that sends nothing; it is
        # the one of /api/ because a search call runs the same retrieval as a chat answer.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout ${OPAA_BACKEND_READ_TIMEOUT};
    }
}
