# Preserve the scheme the outer TLS-terminating proxy reports. This container is an inner hop
# that only ever speaks plain http; overwriting X-Forwarded-Proto with $scheme here made the
# backend classify same-origin browser requests as cross-origin (https origin vs. http request)
# and apply CORS checks to every call - see #553. Fall back to $scheme when no outer proxy is
# involved (e2e stack, local docker compose).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# ${OPAA_DEMO_MODE} is substituted by envsubst at container start - a plain, unescaped text
# replacement into this config file, not an nginx-level substitution. A raw operator value with a
# stray ", ' or $ could otherwise inject content into the /runtime-config.js response body below.
# The first map turns the raw substituted text into a real nginx variable ($host is only used as
# an always-defined, irrelevant match key here); the second map then normalizes that variable to
# a literal "true"/"false" via nginx's own literal-string matching, so anything other than the
# exact string "true" safely falls through to "false" - the frontend side is already fail-closed
# the same way (runtimeConfig.ts only treats the exact string "true" as enabled).
map $host $opaa_demo_mode_raw {
    default "${OPAA_DEMO_MODE}";
}
map $opaa_demo_mode_raw $opaa_demo_mode_flag {
    default false;
    true    true;
}

# Do not reveal the nginx version in the Server header or on error pages (#409).
server_tokens off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (#409), rationale and operator-facing details in
    # docs/handbuch/deployment.md#sicherheits-header-und-strict-transport-security. "always" also covers
    # error responses; set at server level so both location blocks below inherit them - EXCEPT
    # /runtime-config.js below, which sets its own add_header directives and therefore does NOT
    # inherit these (a location block that adds its own add_header replaces the whole inherited
    # set, not just adds to it - nginx's documented add_header inheritance rule). That location
    # repeats all four headers itself for exactly this reason.
    #
    # ${OPAA_CSP_CONNECT_SRC_EXTRA} is substituted at container start (this file is an
    # envsubst template, see Dockerfile) so operators can allow a same-origin-external identity
    # provider (OIDC discovery/token endpoint) without rebuilding the image.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' ${OPAA_CSP_CONNECT_SRC_EXTRA}; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Runtime flag for the demo/source notice (#230): a same-origin script, generated at container
    # start from ${OPAA_DEMO_MODE} (envsubst template, see Dockerfile) via $opaa_demo_mode_flag
    # above, so operators can turn the notice on for a demo instance without rebuilding the image.
    # Off by default - the notice belongs only on demo instances, not on every OPAA installation.
    location = /runtime-config.js {
        default_type application/javascript;
        add_header Cache-Control "no-store";
        # Repeats the server-level security headers (#409) - see the comment above them for why
        # this location must set them itself instead of inheriting.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' ${OPAA_CSP_CONNECT_SRC_EXTRA}; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        return 200 "window.__OPAA_DEMO_MODE__ = '$opaa_demo_mode_flag';";
    }

    # #812: without an explicit Cache-Control, browsers cache index.html heuristically and
    # keep referencing the previous deployment's hashed bundles until a hard reload.
    # "no-cache" forces revalidation on every load - the ETag turns that into a cheap 304.
    # try_files' /index.html fallback re-enters location matching (internal redirect), so
    # SPA routes get these headers too. Repeats the server-level security headers (#409):
    # a location with its own add_header replaces the inherited set (see comment above).
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' ${OPAA_CSP_CONNECT_SRC_EXTRA}; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # The build emits content-hashed filenames under /assets/ - a changed file is a new URL,
    # so these may cache forever. Same add_header repetition rule as above.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' ${OPAA_CSP_CONNECT_SRC_EXTRA}; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Spring Security's defaults already set X-Content-Type-Options/X-Frame-Options on every
        # backend response; strip them here so the add_header directives above (inherited from
        # the server block) are the only copies the client sees, not a duplicate.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;

        # Must stay >= the backend's upload limit (OPAA_UPLOAD_MAX_FILE_SIZE, default 52428800B =
        # 50 MiB, see backend/src/main/resources/application.yml) - and deliberately a little above
        # it (52m, not 50m): nginx measures the whole multipart request body (file bytes plus
        # framing/boundary/header overhead), while the backend's check is on the file size alone.
        # Setting this to exactly 50m would let nginx answer its own HTML 413 for a file just under
        # the backend's limit, before GlobalExceptionHandler's German message ("... hoechstens 50
        # MB.") ever gets a chance to run. nginx's own default is 1 MB and would otherwise reject
        # every larger upload the same way - see #519. This value is not templated from the env var
        # because raising it needs a coordinated change, not a per-deployment override; raise both
        # together if OPAA_UPLOAD_MAX_FILE_SIZE is ever changed.
        client_max_body_size 52m;
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
