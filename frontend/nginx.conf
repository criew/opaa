server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Must stay >= the backend's upload limit (OPAA_UPLOAD_MAX_FILE_SIZE, default 52428800B =
        # 50 MiB, see backend/src/main/resources/application.yml). nginx's own default is 1 MB and
        # would otherwise reject larger uploads with its own HTML 413 page before the request ever
        # reaches the backend - see #519. This value is not templated from the env var because
        # frontend/Dockerfile bakes nginx.conf into the image at build time without envsubst; raise
        # both together if OPAA_UPLOAD_MAX_FILE_SIZE is ever changed.
        client_max_body_size 50m;
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
