<!doctype html>
<html lang="de">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aktueller Tagesreport</title>
<link rel="alternate" type="application/atom+xml" title="OPAA Tagesreport" href="feed.xml">
<style>:root {
  color-scheme: light dark;
  --bg: #ffffff;
  --fg: #1a1a1a;
  --muted: #5c6370;
  --line: #e2e5e9;
  --accent: #2f6feb;
  --card: #f7f8fa;
  --green: #1a7f37;
  --red: #cf222e;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14161a;
    --fg: #e6e8eb;
    --muted: #9aa1ab;
    --line: #2a2e35;
    --accent: #6ea0ff;
    --card: #1b1e24;
    --green: #3fb950;
    --red: #f85149;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 2rem 1.25rem 4rem;
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
main { max-width: 46rem; margin: 0 auto; }
a { color: var(--accent); }
header { border-bottom: 1px solid var(--line); padding-bottom: 1.25rem; margin-bottom: 2rem; }
h1 { font-size: 1.6rem; margin: 0 0 .35rem; letter-spacing: -.01em; }
h2 { font-size: 1.1rem; margin: 2.25rem 0 .85rem; letter-spacing: -.01em; }
.sub { color: var(--muted); font-size: .9rem; margin: 0; }
.num { font-variant-numeric: tabular-nums; color: var(--muted); margin-right: .4rem; }
.empty { color: var(--muted); font-style: italic; }

.blaettern { color: var(--muted); font-size: .9rem; }
.blaettern a { text-decoration: none; }
.blaettern a:hover { text-decoration: underline; }

.linkbar { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .85rem; }
.linkbar a {
  display: inline-flex;
  align-items: center;
  gap: .35rem;
  font-size: .85rem;
  padding: .3rem .7rem;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--card);
  text-decoration: none;
}
.linkbar a:hover { border-color: var(--accent); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.dot.green { background: var(--green); }
.dot.red { background: var(--red); }

.kpi-row { display: flex; gap: .75rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
.kpi {
  flex: 1;
  min-width: 7rem;
  padding: .75rem 1rem;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--card);
  text-align: center;
}
.kpi-value {
  font-size: 1.8rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  line-height: 1.2;
}
.kpi-value.green { color: var(--green); }
.kpi-label {
  font-size: .78rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .04em;
}

.epic-section {
  margin-bottom: 1.25rem;
  padding: .85rem 1rem;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--card);
}
.epic-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 1rem;
  margin-bottom: .5rem;
}
.epic-title { font-weight: 600; font-size: .95rem; }
.epic-progress {
  font-size: .8rem;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.progress-bar {
  height: 4px;
  background: var(--line);
  border-radius: 2px;
  margin-bottom: .6rem;
  overflow: hidden;
}
.progress-fill { height: 100%; background: var(--accent); border-radius: 2px; }
.epic-section ul { margin: 0; padding-left: 1.25rem; font-size: .9rem; }
.epic-section li { margin-bottom: .25rem; }

.merged-summary {
  margin-top: .5rem;
  padding-top: .5rem;
  border-top: 1px dashed var(--line);
  font-size: .85rem;
  color: var(--muted);
}
.merged-summary ul { margin: .25rem 0 0; padding-left: 1.25rem; }
.merged-summary li { margin-bottom: .2rem; }

ul.items { list-style: none; margin: 0; padding: 0; }
ul.items li {
  padding: .7rem .9rem;
  border: 1px solid var(--line);
  border-radius: 8px;
  margin-bottom: .5rem;
  background: var(--card);
}
.meta { display: block; color: var(--muted); font-size: .82rem; margin-top: .25rem; }

footer { margin-top: 3rem; padding-top: 1.25rem; border-top: 1px solid var(--line); color: var(--muted); font-size: .85rem; }
.status.bad { color: var(--red); font-weight: 600; }
</style>
