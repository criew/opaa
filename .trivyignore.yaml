      (Stand 22.11.2026). Neu zu bewerten, sobald Debian einen Fix liefert (dann neu bauen, Eintrag
      entfällt), das Paket in einem Image außerhalb der Sandbox auftaucht (der purl gilt in jedem
      Debian-Image; heute ist das außer der Sandbox nur das Backend auf distroless, das keines dieser
      Pakete trägt), die Sandbox Ausgang oder Geheimnisse erhält oder die Härtung entfällt, oder
      sobald in der Sandbox ein TLS-Dienst läuft.
    expired_at: 2027-02-15
  - id: CVE-2026-128241
    purls:
      - pkg:deb/debian/libexpat1
    statement: >-
      Nur im Sandbox-Image (sandbox/Dockerfile): ein Wegwerf-Container je Agentenlauf ohne Ausgang und
      ohne Geheimnisse, Skripte als uid 1000, mit Laufzeit- und Lebensdauergrenze; run_code führt dort
      ohnehin ungeprüften Code aus. Voraussetzung ist die Härtung des Sandbox-Dienstes:
      no_new_privileges und gedroppte Capabilities wie SYS_ADMIN (sandbox/config.toml, unter
      Kubernetes das OpenSandbox-Chart). Die Lücke liegt im Kommandozeilenwerkzeug xmlwf, dessen
      Ausgabemodus -d symbolischen Links folgt. xmlwf gehört zum Paket expat, das nicht installiert
      ist; im Image liegt nur die Bibliothek libexpat1, die Trivy über die gemeinsame Version des
      Quellpakets meldet. Auch ein von einem Skript mitgebrachtes xmlwf überschriebe als uid 1000 nur
      Dateien, die dieser Nutzer ohnehin schreiben darf. Debian trixie hat keinen Fix (Stand
      22.11.2026). Neu zu bewerten, sobald Debian einen Fix liefert (dann neu bauen, Eintrag
      entfällt), das Paket in einem Image außerhalb der Sandbox auftaucht (der purl gilt in jedem
      Debian-Image; heute ist das außer der Sandbox nur das Backend auf distroless, das keines dieser
      Pakete trägt), die Sandbox Ausgang oder Geheimnisse erhält oder die Härtung entfällt, oder
      sobald xmlwf ins Image gelangt.
    expired_at: 2027-02-15
  - id: CVE-2026-132998
    purls:
      - pkg:deb/debian/libeot0
    statement: >-
      Nur im Sandbox-Image (sandbox/Dockerfile): ein Wegwerf-Container je Agentenlauf ohne Ausgang und
      ohne Geheimnisse, Skripte als uid 1000, mit Laufzeit- und Lebensdauergrenze; run_code führt dort
      ohnehin ungeprüften Code aus. Voraussetzung ist die Härtung des Sandbox-Dienstes:
      no_new_privileges und gedroppte Capabilities wie SYS_ADMIN (sandbox/config.toml, unter
      Kubernetes das OpenSandbox-Chart). libeot kommt als Abhängigkeit von libreoffice-core-nogui mit;
      LibreOffice liest damit in Dokumente eingebettete Schriften im Format Embedded OpenType. Fremde
      Eingabe dafür ist nur die Vorlage, die fill_template per soffice in PDF wandelt und die nur
      hochlädt, wer das Recht „Vorlagen anlegen“ hat; Skripte von run_code gewinnen über libeot nichts
      hinzu. Schlimmste Folge von Überlauf (CVE-2026-132998) und Use-after-free (CVE-2026-132999) ist
      wie beim libxml2-Eintrag Code der Vorlagen-Autorin, der als uid 1000 im Lauf einer anderen
      Person läuft: fill_template und run_code teilen sich die Sandbox eines Laufs, dieser Code kann
      also die Ausgaben in /workspace/out verändern, bevor OPAA sie prüft und anhängt. Er hat keinen
      Ausgang und findet keine Geheimnisse, die Prüfungen der Anhänge gelten unverändert.
      Vertrauensgrenze ist das Recht „Vorlagen anlegen“. Debian trixie hat keinen Fix (Stand
      22.11.2026). Neu zu bewerten, sobald Debian einen Fix liefert (dann neu bauen, Eintrag
      entfällt), das Paket in einem Image außerhalb der Sandbox auftaucht (der purl gilt in jedem
      Debian-Image; heute ist das außer der Sandbox nur das Backend auf distroless, das keines dieser
      Pakete trägt), die Sandbox Ausgang oder Geheimnisse erhält oder die Härtung entfällt, oder
      sobald Vorlagen von Personen ohne Vorlagenrecht eingebracht werden können.
    expired_at: 2027-02-15
