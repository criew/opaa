# Unterdrückungsquelle für Trivy-Befunde. Ein Eintrag hier entfernt einen Befund aus beiden
# Trivy-Läufen von .github/workflows/cve-scan.yml (Security-Tab und critical-Alarm) und aus
# einem lokalen `trivy image --ignorefile .trivyignore.yaml <image>`.
#
# Jeder Eintrag trägt `statement` (Begründung nach docs/cve-scanning.md, Abschnitt
# „Begründungsqualität") und `expired_at` (Ablaufdatum, höchstens ein Quartal voraus); ohne
# beides scheitert der Prüfschritt in cve-scan.yml. Ab dem Ablaufdatum meldet Trivy den
# Befund wieder — eine Unterdrückung endet immer von selbst.
#
# Existiert eine Fix-Version, wird gebaut statt unterdrückt (Mittelreihenfolge in
# docs/cve-scanning.md).

vulnerabilities:
  - id: CVE-2026-6653
    purls:
      - pkg:deb/debian/libxml2
    statement: >-
      Debian-Paket libxml2 nur im Sandbox-Image (sandbox/Dockerfile), dort Abhängigkeit von
      LibreOffice. Erreicht wird es, wenn fill_template eine Vorlage per soffice in PDF wandelt;
      die Vorlage lädt nur hoch, wer das Recht „Vorlagen anlegen“ hat, und die Prüfung beim
      Hochladen sperrt DTDs nur in den Word-Parts. Skripte von run_code nutzen das libxml2 der
      Python-Wheels und erreichen das Debian-Paket nur über soffice oder ctypes; dort läuft ohnehin
      beliebiger Code. Folge ist ein Denial of Service beim Parsen einer präparierten internen DTD,
      begrenzt auf den einen Sandbox-Lauf (kurzlebig, isoliert, uid 1000, ohne Netz, mit Laufzeit-
      und Lebensdauergrenze). Debian trixie hat keinen Fix (Stand 11.11.2026). Neu zu bewerten,
      sobald Debian einen Fix liefert (dann neu bauen, Eintrag entfällt), sobald Vorlagen von
      Personen ohne Vorlagenrecht eingebracht werden können, sobald libxml2 in einem Image außerhalb
      der Sandbox auftaucht oder die Sandbox ihre Isolation verliert.
    expired_at: 2027-02-10
