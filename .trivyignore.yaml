# Unterdrückungsquelle für Trivy-Befunde. Ein Eintrag hier entfernt einen Befund aus beiden
# Trivy-Läufen von .github/workflows/cve-scan.yml (Security-Tab und critical-Alarm) und aus
# einem lokalen `trivy image --ignorefile .trivyignore.yaml <image>`.
#
# Jeder Eintrag trägt `statement` (Begründung nach docs/cve-scanning.md, Abschnitt
# „Begründungsqualität") und `expired_at` (Ablaufdatum, höchstens ein Quartal voraus); ohne
# beides scheitert der Prüfschritt in cve-scan.yml. Ab dem Ablaufdatum meldet Trivy den
# Befund wieder — eine Unterdrückung endet immer von selbst.
#
# Existiert eine Fix-Version, wird gebaut statt unterdrückt (Mittelreihenfolge in
# docs/cve-scanning.md).

vulnerabilities:
  - id: CVE-2026-6653
    purls:
      - pkg:deb/debian/libxml2
    statement: >-
      Debian-Paket libxml2 nur im Sandbox-Image (sandbox/Dockerfile), dort Abhängigkeit von
      LibreOffice. Erreicht wird es, wenn fill_template eine Vorlage per soffice in PDF wandelt;
      die Vorlage lädt nur hoch, wer das Recht „Vorlagen anlegen“ hat, und die Prüfung beim
      Hochladen sperrt DTDs nur in den Word-Parts. Skripte von run_code nutzen das libxml2 der
      Python-Wheels und erreichen das Debian-Paket nur über soffice oder ctypes; dort läuft ohnehin
      beliebiger Code. Folge ist ein Denial of Service beim Parsen einer präparierten internen DTD,
      begrenzt auf den einen Sandbox-Lauf (kurzlebig, isoliert, uid 1000, ohne Ausgang, mit Laufzeit-
      und Lebensdauergrenze). Debian trixie hat keinen Fix (Stand 11.11.2026). Neu zu bewerten,
      sobald Debian einen Fix liefert (dann neu bauen, Eintrag entfällt), sobald Vorlagen von
      Personen ohne Vorlagenrecht eingebracht werden können, sobald libxml2 in einem Image außerhalb
      der Sandbox auftaucht oder die Sandbox ihre Isolation verliert.
    expired_at: 2027-02-10

  # Sandbox image, Debian trixie without a fix (triage of 15.11.2026, one statement per package
  # group). Every entry is bound to the Debian packages of the group by purl.
  - id: CVE-2026-107364
    purls:
      - pkg:deb/debian/libgssapi-krb5-2
      - pkg:deb/debian/libk5crypto3
      - pkg:deb/debian/libkrb5-3
      - pkg:deb/debian/libkrb5support0
    statement: >-
      Nur im Sandbox-Image (sandbox/Dockerfile): ein Wegwerf-Container je Agentenlauf ohne Ausgang und
      ohne Geheimnisse, Skripte als uid 1000, mit Laufzeit- und Lebensdauergrenze; run_code führt dort
      ohnehin ungeprüften Code aus. Voraussetzung ist die Härtung des Sandbox-Dienstes:
      no_new_privileges und gedroppte Capabilities wie SYS_ADMIN (sandbox/config.toml, unter
      Kubernetes das OpenSandbox-Chart). Die MIT-krb5-Bibliotheken kommen nur als Abhängigkeit von
      libcurl und LibreOffice mit. Die Lücken liegen in KDC, kadmind und den RPC-Diensten; das Image
      enthält keinen davon und keine Kerberos-Konfiguration, ohne Ausgang erreicht auch kein Client
      einen KDC. Debian trixie hat keinen Fix (Stand 15.11.2026). Neu zu bewerten, sobald Debian einen
      Fix liefert (dann neu bauen, Eintrag entfällt), das Paket in einem Image außerhalb der Sandbox
      auftaucht (der purl gilt in jedem Debian-Image; heute ist das außer der Sandbox nur das Backend
      auf distroless, das keines dieser Pakete trägt), die Sandbox Ausgang oder Geheimnisse erhält
      oder die Härtung entfällt, oder sobald dort ein Kerberos-Dienst oder eine Kerberos-Anmeldung
      hinzukommt.
    expired_at: 2027-02-15
