# Overlay for the agent tool run_code (ADR-0073): OPAA_SANDBOX_API_KEY=<random> docker compose
# -f docker-compose.yml -f docker-compose.sandbox.yml up --build
# Adds the OpenSandbox lifecycle server, which starts one container per agent run through the
# host's Docker socket. Whoever holds that socket controls the host: run this stack on a VM of its
# own, on Linux preferably with gVisor ([secure_runtime] in sandbox/config.toml).
# Only an agent run uses the sandbox: agents switched on and the tool allowed under Administration >
# Agenten, and the tool chosen at the agent.
services:
  # One-off build step: produces the sandbox image locally and exits. The server never pulls it.
  sandbox-image:
    build:
      context: ./sandbox
    image: opaa/sandbox-python:1
    command: ["true"]
    # The only service on "sandboxes", so that Compose creates the network the server starts the
    # sandboxes in; the step itself exits at once.
    networks:
      - sandboxes

  opensandbox-server:
    # Version and index digest; Renovate keeps both, together with execd in sandbox/config.toml.
    image: opensandbox/server:release-1.1.1@sha256:bcd5f264101262cebfa7e1ff9cd0424403e42f31a6596e4364cf90d8cb5c936b
    restart: unless-stopped
    environment:
      SANDBOX_CONFIG_PATH: /etc/opensandbox/config.toml
      OPENSANDBOX_SERVER_API_KEY: ${OPAA_SANDBOX_API_KEY:?set OPAA_SANDBOX_API_KEY to a random value}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./sandbox/config.toml:/etc/opensandbox/config.toml:ro
      # The server's own state (SQLite store); the only path it writes besides /tmp.
      - opensandbox-state:/root/.opensandbox
    # The server talks to Docker through the socket only and needs no capability for that; the root
    # file system stays read-only.
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # The host's network namespace: "sandboxes" blocks traffic between its containers (ICC off), so
    # the server reaches execd in each sandbox from the host side of that bridge, never as a
    # container on it. It listens only on 172.31.255.249, the host's address on "sandbox-api"
    # ([server] host in sandbox/config.toml), and publishes no port. Being a host address, it is
    # reachable from every container of the host and from machines routing to the host, guarded
    # only by the API key unless a host firewall rule limits it (handbook "Sandbox für Agenten").
    # Sandbox code has no route to it, but reaches the host at the gateway of "sandboxes".
    network_mode: host
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://172.31.255.249:8090/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      sandbox-image:
        condition: service_completed_successfully
    # The server logs request lines and sandbox ids, never scripts or files ([log] level INFO in
    # sandbox/config.toml); rotation bounds how long even those stay on the host.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    environment:
      OPAA_SANDBOX_ENABLED: "true"
      OPAA_SANDBOX_BASE_URL: http://172.31.255.249:8090
      OPAA_SANDBOX_API_KEY: ${OPAA_SANDBOX_API_KEY:?set OPAA_SANDBOX_API_KEY to a random value}
      OPAA_SANDBOX_IMAGE: opaa/sandbox-python:1
    # Keeps the stack's network and joins "sandbox-api", whose gateway is the server's address.
    networks:
      - default
      - sandbox-api
    depends_on:
      opensandbox-server:
        condition: service_healthy

networks:
  # Internal: no route to the internet. ICC off: one sandbox cannot connect to another, so a run
  # cannot hand data to a listener in another person's sandbox. Fixed name, because
  # sandbox/config.toml (docker.network_mode) refers to it by name.
  sandboxes:
    name: opaa-sandboxes
    internal: true
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"
  # The backend's way to the server: the host holds the gateway address the server listens on.
  # Fixed, because sandbox/config.toml ([server] host) names it; on a collision with another
  # network change the subnet, that file, OPAA_SANDBOX_BASE_URL and the healthcheck together.
  sandbox-api:
    name: opaa-sandbox-api
    internal: true
    # A fixed bridge name, so that host firewall rules (ufw, iptables) can name the interface.
    driver_opts:
      com.docker.network.bridge.name: opaa-sbx-api
    ipam:
      config:
        - subnet: 172.31.255.248/29
          gateway: 172.31.255.249

volumes:
  opensandbox-state:
