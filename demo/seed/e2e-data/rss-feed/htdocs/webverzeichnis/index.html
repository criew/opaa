<!--

  icon cell, a link cell, a date cell and a size cell). httpd:2.4-alpine's *default* httpd.conf
  loads mod_autoindex but does not enable "IndexOptions HTMLTable" (that lives in the commented-out
  "Include conf/extra/httpd-autoindex.conf" - see httpd.conf shipped in the image), so a real
  autoindex response from this fixture's own directories renders as a <pre> list instead, which the
  parser's `cells.size() < 4` guard skips entirely, yielding "0 Dokumente gefunden" - not what a
  happy-path connection test needs to demonstrate. This static page stands in for that HTMLTable
  layout without having to reconfigure the shared "rss-feed" httpd fixture (also used by #471) -
  httpd serves it automatically for a GET of this directory since an index.html is present, no
  autoindex module involved at all.
-->
