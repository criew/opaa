# IndexOptions for the Rheinfurt demo corpus webservers (docker-compose.yml, profile "demo",
# services "demo-corpus" and "demo-presse", both httpd:2.4-alpine).
#
# FancyIndexing + HTMLTable produces the classic Apache directory-listing markup (<table>, icon
# <img> columns, sortable header links) AutoindexCrawlerService has always understood. Issue #229
# keeps this as the well-tested reference choice even though it is no longer the only option: since
# #550 the crawler also parses nginx's `autoindex on` <pre> listings and the <ul> layout Python's
# `http.server` (or Apache with `-FancyIndexing`) produces - see
# docs/features/demo-instance.md, "Installation und Seed".
#
# Appended to httpd.conf at container start (see the services' "command" below) rather than
# replacing the stock config wholesale, which would silently drift out of sync with whatever the
# floating `httpd:2.4-alpine` tag ships next. IndexOptions is valid in server-config context, so one
# line here applies to every directory the "Options Indexes" the stock config already grants for
# htdocs (no separate Options directive needed).
IndexOptions FancyIndexing HTMLTable
