# Optional monitoring of the Compose stack: Prometheus scrapes the backend's management port over the
# Compose network (also backend-a and backend-b of docker-compose.multi.yml) and evaluates the chart's
# alerts, Grafana shows the dashboards on a port of its own. Grafana must not share the host name
# of OPAA, not even on another port, since cookies ignore ports: a page there could use the OPAA
# session. A reverse proxy on the host serves it under a subdomain of its own; the port binds
# loopback unless OPAA_GRAFANA_BIND_ADDRESS opens it.
# Prometheus publishes no port, and there is no Alertmanager: alerts show in Grafana and
# Prometheus but reach nobody. Start together with the main file:
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
# Setup: docs/handbuch/betrieb/dashboards-und-alarme.md, section "Compose".
services:
  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${OPAA_PROMETHEUS_RETENTION:-30d}
    volumes:
      - ./deploy/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # The chart's alerts, rendered for this stack by deploy/monitoring/render.sh.
      - ./deploy/monitoring/prometheus/opaa-rules.yaml:/etc/prometheus/rules/opaa-rules.yaml:ro
      - opaa-prometheus-data:/prometheus
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:13.3.0
    restart: unless-stopped
    environment:
      # The address the browser sees, e.g. https://grafana.example.org/ behind the host's reverse
      # proxy; it appears in Grafana's redirects and links.
      GF_SERVER_ROOT_URL: ${OPAA_GRAFANA_ROOT_URL:-http://localhost:3001/}
      GF_SECURITY_ADMIN_USER: ${OPAA_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${OPAA_GRAFANA_ADMIN_PASSWORD:?set OPAA_GRAFANA_ADMIN_PASSWORD for the Grafana admin account}
      GF_SECURITY_CONTENT_SECURITY_POLICY: "true"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # No calls home: no usage statistics, update checks or news feed.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/opaa/opaa-start.json
    ports:
      - "${OPAA_GRAFANA_BIND_ADDRESS:-127.0.0.1}:${OPAA_GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      # The same files the Helm chart ships as ConfigMaps.
      - ./deploy/helm/opaa/dashboards:/var/lib/grafana/dashboards/opaa:ro
      - opaa-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  opaa-prometheus-data:
  opaa-grafana-data:
