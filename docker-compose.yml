# WARNING: Development-only compose setup.
# It contains insecure defaults (e.g., admin/admin and placeholder secrets)
# and must not be used as-is for production deployments.
services:
  postgres:
    image: pgvector/pgvector:pg18
    # No fixed container_name: Compose prefixes container/network/volume
    # names with the project name (directory name, or COMPOSE_PROJECT_NAME)
    # instead, so this file can run as multiple independent stacks side by
    # side (e.g. a developer's own dev stack and the E2E suite's stack, see
    # e2e/scripts/run-e2e.mjs) without colliding.
    env_file: ${OPAA_ENV_FILE:-.env.docker}
    environment:
      POSTGRES_DB: opaa
      POSTGRES_USER: ${OPAA_DB_USERNAME:-opaa}
      POSTGRES_PASSWORD: ${OPAA_DB_PASSWORD:-opaa}
    ports:
      - "127.0.0.1:${OPAA_DB_PORT:-5432}:5432"
    volumes:
      - opaa-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opaa} -d ${POSTGRES_DB:-opaa}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file: ${OPAA_ENV_FILE:-.env.docker}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${OPAA_BACKEND_PORT:-8081}:8080"
    volumes:
      - ${OPAA_INDEXING_DOCUMENT_PATH_HOST:-./documents}:/app/documents
      - ${OPAA_UPLOAD_STORAGE_PATH_HOST:-./uploads}:/app/uploads
    environment:
      OPAA_UPLOAD_STORAGE_PATH: /app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    env_file: ${OPAA_ENV_FILE:-.env.docker}
    ports:
      - "${OPAA_FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8180
    ports:
      - "${OPAA_KEYCLOAK_PORT:-8180}:8180"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    profiles:
      - oidc

volumes:
  opaa-postgres-data:
