# WARNING: Development-only compose setup.
# It contains insecure defaults (e.g., admin/admin and placeholder secrets)
# and must not be used as-is for production deployments.
# Before running this reachable from outside localhost, see
# docs/handbuch/deployment.md, section "Härtung für erreichbare Deployments".
services:
  postgres:
    image: pgvector/pgvector:pg18
    # No fixed container_name: Compose prefixes container/network/volume
    # names with the project name (directory name, or COMPOSE_PROJECT_NAME)
    # instead, so this file can run as multiple independent stacks side by
    # side (e.g. a developer's own dev stack and the E2E suite's stack, see
    # e2e/scripts/run-e2e.mjs) without colliding.
    env_file: ${OPAA_ENV_FILE:-.env.docker}
    environment:
      POSTGRES_DB: opaa
      POSTGRES_USER: ${OPAA_DB_USERNAME:-opaa}
      POSTGRES_PASSWORD: ${OPAA_DB_PASSWORD:-opaa}
    ports:
      - "127.0.0.1:${OPAA_DB_PORT:-5432}:5432"
    volumes:
      - opaa-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opaa} -d ${POSTGRES_DB:-opaa}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      # Repo-root context (issue #896): the backend Gradle build now depends on the sibling
      # opaa-api/ module (settings.gradle.kts include), which a context scoped to ./backend alone
      # would not see.
      context: .
      dockerfile: backend/Dockerfile
    env_file: ${OPAA_ENV_FILE:-.env.docker}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${OPAA_BACKEND_PORT:-8081}:8080"
    volumes:
      - ${OPAA_INDEXING_DOCUMENT_PATH_HOST:-./documents}:/app/documents
      - ${OPAA_UPLOAD_STORAGE_PATH_HOST:-./uploads}:/app/uploads
    environment:
      OPAA_UPLOAD_STORAGE_PATH: /app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    env_file: ${OPAA_ENV_FILE:-.env.docker}
    ports:
      - "${OPAA_FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8180
    ports:
      - "${OPAA_KEYCLOAK_PORT:-8180}:8180"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      # A second realm = a second identity provider on the same origin (ADR-0025, #1334): the
      # user maria.weber exists in both realms with the same e-mail address, so the demo-smoke run
      # can prove that two providers never share an account. Not taken over at start-up - the
      # Anbieterverwaltung adds it, exactly as an operator would add a partner's provider.
      - ./keycloak/realm-partner-export.json:/opt/keycloak/data/import/realm-partner-export.json:ro
    # Also part of "demo" (#712): the demo instance shows the realistic Keycloak login (see
    # docs/features/demo-instance.md, "Installation und Seed") and must never be reachable without
    # one - `docker compose --profile demo up` starting keycloak automatically is the only way to
    # guarantee that without a second, easy-to-forget `--profile oidc` on every documented command.
    # A plain oidc-only local dev stack (`--profile oidc`, no demo) still works exactly as before;
    # this only adds a second profile membership, it does not remove the first one.
    profiles:
      - oidc
      - demo

  # Serves the three HTTP_DIRECTORY libraries of the Rheinfurt demo corpus (#229, Epic #708) as
  # plain Apache directory listings - one subdirectory per library, so each stays separately
  # indexable. "interne-dienstanweisungen-meldewesen/" (the UPLOAD library, #712) is deliberately
  # not mounted here: nothing under this docroot may ever surface it over HTTP.
  #
  # httpd:2.4-alpine over nginx/python http.server: same reasoning as the "rss-feed" fixture
  # service in e2e/docker-compose.e2e.yml, plus IndexOptions FancyIndexing HTMLTable
  # (demo/webserver/httpd-demo-autoindex.conf) as the well-tested reference listing format -
  # docs/features/demo-instance.md, "Installation und Seed", and that file's own comment for why
  # this is a recommendation, not a requirement, since AutoindexCrawlerService started parsing
  # <pre>/<ul> listings too (#550).
  demo-corpus:
    image: httpd:2.4-alpine
    volumes:
      - ./demo/corpus/leistungen-meldewesen-ausweise:/usr/local/apache2/htdocs/leistungen-meldewesen-ausweise:ro
      - ./demo/corpus/leistungen-kfz-zulassung:/usr/local/apache2/htdocs/leistungen-kfz-zulassung:ro
      - ./demo/corpus/satzungen-gebuehrenordnungen:/usr/local/apache2/htdocs/satzungen-gebuehrenordnungen:ro
      - ./demo/webserver/httpd-demo-autoindex.conf:/usr/local/apache2/conf/extra/httpd-demo-autoindex.conf:ro
    # Appends an Include for the mounted snippet above instead of shipping a full httpd.conf
    # override, which would drift out of sync with whatever the floating httpd:2.4-alpine tag
    # ships next (see the snippet's own comment). The grep guard makes this idempotent: without
    # it, a container stopped and restarted without being recreated (its writable layer, and with
    # it conf/httpd.conf, persists across "docker compose stop && start") would append the same
    # Include line again on every restart.
    command: >-
      sh -c "grep -qF 'Include conf/extra/httpd-demo-autoindex.conf' conf/httpd.conf ||
      echo 'Include conf/extra/httpd-demo-autoindex.conf' >> conf/httpd.conf &&
      httpd-foreground"
    # The backend reaches this service over the Compose network under its service name
    # ("demo-corpus"), never through this port. Published to 127.0.0.1 unconditionally whenever
    # the "demo" profile is started (not only when OPAA_DEMO_CORPUS_PORT is set - that variable
    # only overrides the default host port 8091), for the "prüfen im Browser" step the issue asks
    # for.
    ports:
      - "127.0.0.1:${OPAA_DEMO_CORPUS_PORT:-8091}:80"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost/leistungen-meldewesen-ausweise/",
        ]
      interval: 2s
      timeout: 2s
      retries: 10
    profiles:
      - demo

  # Serves the Rheinfurt press office's static RSS feed and its HTML detail pages (#229). Its own
  # service, not a subpath of "demo-corpus" above: demo/corpus/pressemitteilungen/rss.xml links its
  # <item>s with absolute URLs under http://presse.stadt-rheinfurt.example/<slug>.html (see
  # demo/README.md, "Compose-Stack starten (#229)", and demo/generator/presse.py's FEED_BASE_URL) -
  # a realistic domain, deliberately not "localhost",
  # so the demo exercises RSS_FEED indexing the same way it would against a real one. The alias
  # below is what makes that domain resolve inside the Compose network; RssFeedIndexingExecutor
  # fetches the feed URL and each entry's own link directly, never a directory listing, so no
  # autoindex config is needed here.
  demo-presse:
    image: httpd:2.4-alpine
    volumes:
      - ./demo/corpus/pressemitteilungen:/usr/local/apache2/htdocs:ro
    networks:
      default:
        aliases:
          - presse.stadt-rheinfurt.example
    # The backend reaches this service over the Compose network under its alias above, never
    # through this port. Published to 127.0.0.1 unconditionally whenever the "demo" profile is
    # started (OPAA_DEMO_PRESSE_PORT only overrides the default host port 8092), for the "prüfen
    # im Browser" step the issue asks for - same reasoning as demo-corpus's own port above.
    ports:
      - "127.0.0.1:${OPAA_DEMO_PRESSE_PORT:-8092}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/rss.xml"]
      interval: 2s
      timeout: 2s
      retries: 10
    profiles:
      - demo

  # The object store of the Rheinfurt demo (#1383, #1520, ADR-0027/ADR-0030): one MinIO with three
  # buckets - "rheinfurt-archiv" and "formattest" are *sources* the S3 connector reads (the
  # libraries "Ratsinformationen Stadt Rheinfurt" and "Formattest auf S3"), "opaa-uploads" is the
  # *storage* the demo writes its uploaded originals to. The backend reaches it over the Compose
  # network under its service name ("minio", path-style, http) - which the target validation
  # rejects as a private address unless "minio" is on OPAA_INDEXING_TARGET_VALIDATION_ALLOWLIST
  # (demo/README.md, "Installation mit einem Befehl", same reasoning as demo-corpus/demo-presse);
  # the upload store's own check passes its configured endpoint by definition.
  # Root credentials are documented demo values (demo/README.md, "Nutzerkonten"), never secrets;
  # the seed hands them to the two source libraries as accessKey:secretKey, while the upload store
  # gets its own bucket-scoped key from "minio-seed" below. Same pinned image line as the
  # backend's MinIO test fixture (MinioFixture.IMAGE): the community line of minio/minio ended
  # with this release, and the "mc" client the seed step below needs still ships in it.
  #
  # The volume exists for "opaa-uploads" alone: the demo's database survives a restart, and a
  # document row whose object is gone is exactly the broken picture the orphan sweep (#1478) then
  # reports. The two source buckets are unaffected by it - "mc mirror --overwrite --remove" forces
  # them back to the committed corpus on every start, whatever the volume held before.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: rheinfurt-archiv
      MINIO_ROOT_PASSWORD: RheinfurtDemo!2026
    volumes:
      - opaa-demo-minio-data:/data
    # Published to 127.0.0.1 only, for the "prüfen im Browser" step (the console at 8094 shows the
    # three buckets, the API at 8093 answers "mc"/"aws s3" from the host) - the backend never uses
    # these.
    ports:
      - "127.0.0.1:${OPAA_DEMO_MINIO_PORT:-8093}:9000"
      - "127.0.0.1:${OPAA_DEMO_MINIO_CONSOLE_PORT:-8094}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 15
    profiles:
      - demo

  # One-shot init step (pattern: ollama-pull): creates all three buckets and mirrors the two
  # committed corpus directories into their source buckets - demo/corpus/ratsinformationen/ under
  # the key prefix the seed's library scope names (bucket "rheinfurt-archiv", prefix
  # "ratsinformationen/"), year folders included, and demo/corpus/formate/ into the bucket
  # "formattest". "opaa-uploads" is only created, never filled: its content belongs to the
  # application alone. Idempotent ("mc mb --ignore-existing", "mc mirror --overwrite --remove": a
  # source bucket ends up as an exact copy of its directory, an object removed from the corpus
  # disappears on the next start), runs to completion and exits;
  # e2e/docker-compose.demo-smoke.yml makes the backend wait for it so neither the seed indexes a
  # half-filled bucket nor an upload hits a missing one.
  #
  # The upload store gets its own access key rather than the root key the two source libraries
  # carry as stored credentials, scoped by demo/minio/opaa-uploads-policy.json to that one bucket.
  # "mc admin policy attach" is the one non-idempotent step (it fails once the mapping exists), so
  # its failure is tolerated deliberately - and only its failure.
  minio-seed:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    volumes:
      - ./demo/corpus/ratsinformationen:/corpus/ratsinformationen:ro
      - ./demo/corpus/formate:/corpus/formate:ro
      - ./demo/minio/opaa-uploads-policy.json:/policies/opaa-uploads-policy.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      "mc alias set demo http://minio:9000 rheinfurt-archiv 'RheinfurtDemo!2026' >/dev/null &&
      mc mb --ignore-existing demo/rheinfurt-archiv demo/formattest demo/opaa-uploads &&
      mc mirror --overwrite --remove /corpus/ratsinformationen demo/rheinfurt-archiv/ratsinformationen &&
      mc mirror --overwrite --remove /corpus/formate demo/formattest &&
      mc admin user add demo opaa-uploads 'OpaaUploads!2026' &&
      mc admin policy create demo opaa-uploads-rw /policies/opaa-uploads-policy.json &&
      { mc admin policy attach demo opaa-uploads-rw --user opaa-uploads ||
      echo 'policy already attached'; } &&
      mc ls --recursive demo/rheinfurt-archiv demo/formattest"
    depends_on:
      minio:
        condition: service_healthy
    profiles:
      - demo

  # The object store of the uploaded originals (ADR-0030), opt-in via the "upload-s3" Compose
  # profile - the store of a regular installation, which never starts the "demo" profile. The demo
  # does not use this service: it writes its originals into the "opaa-uploads" bucket of its own
  # "minio" above (#1520), so a demo stack stays one object store rather than two. Hence the named
  # volume here too - without it the originals would be gone after "docker compose down -v" while
  # their document rows survive in the database and point at objects that no longer exist, the same
  # trap the ./uploads bind mount has on the filesystem path.
  #
  # Without the profile this service does not exist and the stack is unchanged; the backend is
  # deliberately not depends_on it, so an installation that stays on the filesystem store keeps its
  # start-up order, and a store that is briefly unreachable never holds the backend back
  # (ADR-0030, Entscheidung 9). The backend reaches it over the Compose network as
  # http://upload-store:9000 (OPAA_UPLOAD_S3_ENDPOINT in .env.docker); the configured endpoint
  # passes the upload store's own target validation by definition, so no allowlist entry is needed.
  # Root credentials and bucket name are the documented defaults of .env.docker.example's
  # "Originalablage" block - whoever changes them changes them on both sides, here (process
  # environment or .env) and for the backend (.env.docker).
  upload-store:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OPAA_UPLOAD_STORE_ROOT_USER:-opaa-uploads}
      MINIO_ROOT_PASSWORD: ${OPAA_UPLOAD_STORE_ROOT_PASSWORD:-OpaaUploads!2026}
    volumes:
      - opaa-upload-store-data:/data
    # Published to 127.0.0.1 only, for the operator's own "mc"/"aws s3" calls from the host (API on
    # 8095) and for looking an original up in the browser (console on 8096) - the backend uses
    # neither, it goes through the Compose network.
    ports:
      - "127.0.0.1:${OPAA_UPLOAD_STORE_PORT:-8095}:9000"
      - "127.0.0.1:${OPAA_UPLOAD_STORE_CONSOLE_PORT:-8096}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 15
    profiles:
      - upload-s3

  # One-shot init step (pattern: minio-seed, ollama-pull): creates the bucket, because OPAA never
  # creates one - without it the start logs a warning and every upload fails. Idempotent
  # ("mc mb --ignore-existing"), runs to completion and exits. It never writes objects: the content
  # of this bucket belongs to the application alone.
  upload-store-init:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      "mc alias set store http://upload-store:9000
      '${OPAA_UPLOAD_STORE_ROOT_USER:-opaa-uploads}'
      '${OPAA_UPLOAD_STORE_ROOT_PASSWORD:-OpaaUploads!2026}' >/dev/null &&
      mc mb --ignore-existing store/${OPAA_UPLOAD_STORE_BUCKET:-opaa-uploads} &&
      mc ls store"
    depends_on:
      upload-store:
        condition: service_healthy
    profiles:
      - upload-s3

  # Optional locally-run Ollama service (#720): entirely opt-in via the "ollama" Compose profile,
  # started with `docker compose --profile ollama up`. Without the profile, this service does not
  # exist and the stack behaves exactly as before - the backend's own defaults still assume a
  # reachable Ollama server (application.yml, "docker" profile: OPAA_OPENAI_BASE_URL defaults to
  # http://ollama:11434/v1), see docs/handbuch/deployment.md, section "LLM-Anbieter", for the alternatives
  # (an external Ollama, host.docker.internal, or a different openai-compatible provider).
  #
  # Serves both chat and embedding through Ollama's own OpenAI-compatible /v1 endpoint - no
  # provider-specific configuration exists anymore since #762, so activating this profile needs no
  # environment variable changes at all: the application defaults already point here.
  ollama:
    image: ollama/ollama:0.34.0
    volumes:
      - opaa-ollama-data:/root/.ollama
    # Not published to the host: the backend and the ollama-pull init step below reach this
    # service over the Compose network under its service name ("ollama"), never through a host
    # port. Uncomment to additionally reach it directly from the host (e.g. to run `ollama` CLI
    # commands against it) - bind to 127.0.0.1 only, per the port-exposure rule this repository
    # otherwise follows (see docs/handbuch/deployment.md, "Härtung für erreichbare Deployments", Punkt 5).
    # ports:
    #   - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
    profiles:
      - ollama

  # One-shot init step (#720): pulls both models this stack's own defaults need on first start -
  # nomic-embed-text (OPAA_OPENAI_EMBEDDING_MODEL default) and phi3:mini (OPAA_OPENAI_CHAT_MODEL
  # default - also the model io.opaa.llm.LlmModelSeeder takes over as the initial active chat
  # model on first backend start). Without both pulled, the first chat/indexing request fails even
  # though the "ollama" service itself is running and healthy. Idempotent: `ollama pull` compares
  # against what "ollama" already has stored in opaa-ollama-data and skips anything already
  # present, so restarting this stack never re-downloads either model. Runs to completion and
  # exits (no restart) - `docker compose --profile ollama up` therefore only finishes downloading
  # once per fresh volume; watch `docker compose logs -f ollama-pull` for progress.
  ollama-pull:
    image: ollama/ollama:0.34.0
    environment:
      OLLAMA_HOST: "ollama:11434"
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      "ollama pull nomic-embed-text && ollama pull phi3:mini"
    depends_on:
      ollama:
        condition: service_healthy
    profiles:
      - ollama

volumes:
  opaa-postgres-data:
  opaa-ollama-data:
  opaa-upload-store-data:
  opaa-demo-minio-data:

# ADR-0033, Entscheidung 9: a fixed subnet, so OPAA_RATE_LIMIT_TRUSTED_PROXY_CIDRS in .env.docker
# can name the one network the frontend's nginx forwards from - the backend honours X-Forwarded-For
# only from there. The range is read from the shell environment or .env (not .env.docker, which
# Compose does not interpolate): override it when it collides with another network on the host, and
# change OPAA_RATE_LIMIT_TRUSTED_PROXY_CIDRS with it. e2e/scripts/run-e2e.mjs gives its own stacks
# their own ranges so they can run next to a developer's stack.
networks:
  default:
    ipam:
      config:
        - subnet: ${OPAA_COMPOSE_SUBNET:-172.28.0.0/16}
