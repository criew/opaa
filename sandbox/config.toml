# OpenSandbox lifecycle server for the agent tool run_code (docker-compose.sandbox.yml, ADR-0073).
# The API key comes from OPENSANDBOX_SERVER_API_KEY; without it the server refuses to start.
# max_sandbox_timeout_seconds below must be at least the backend's OPAA_SANDBOX_MAX_LIFETIME.
# For a stronger isolation level on Linux, add a [secure_runtime] section (gVisor/runsc installed
# on the host) as the OpenSandbox server documentation describes.

[server]
host = "0.0.0.0"
port = 8090
# Upper bound for the "timeout" (TTL, seconds) of a create request.
max_sandbox_timeout_seconds = 900

[proxy]
# The server proxies /sandboxes/{id}/proxy/{port}/... to the sandbox's IP on the internal
# network below; it is the only route from the backend to execd.
resolve_internal = true

[log]
# INFO or above: DEBUG would log request bodies, i.e. the scripts of agent runs.
level = "INFO"

[runtime]
type = "docker"
execd_image = "opensandbox/execd:release-1.1.1@sha256:cda2bc35409bbf57561599b316cafb899598f7dce671332e7ceda14eb1cfeded"

[docker]
# Sandboxes join only this internal network (no gateway, so no internet egress). The name must
# match the network "opaa-sandboxes" in docker-compose.sandbox.yml and be lowercase.
network_mode = "opaa-sandboxes"
# Docker skips port publishing on internal networks; the address keeps any published port on loopback.
publish_host = "127.0.0.1"
# execd runs as root and needs only CHOWN, DAC_OVERRIDE, FOWNER (script upload), SETUID, SETGID
# (start the script as uid 1000) and KILL (stop it at its time limit); everything else is dropped.
drop_capabilities = ["AUDIT_WRITE", "FSETID", "MKNOD", "NET_ADMIN", "NET_BIND_SERVICE", "NET_RAW", "SETFCAP", "SETPCAP", "SYS_ADMIN", "SYS_CHROOT", "SYS_MODULE", "SYS_PTRACE", "SYS_TIME", "SYS_TTY_CONFIG"]
no_new_privileges = true
pids_limit = 4096

[ingress]
mode = "direct"

[storage]
# No host bind mounts for sandboxes.
allowed_host_paths = []
