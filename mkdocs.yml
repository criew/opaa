# Site build of the product handbook; docs/handbuch/ is the only source. CI builds it strictly
# to catch dead links and anchors.
site_name: OPAA-Handbuch
docs_dir: docs/handbuch
site_dir: build/handbuch-site
use_directory_urls: false
strict: true
exclude_docs: |
  AGENTS.md
  CLAUDE.md
theme:
  name: material
  language: de
  font: false
  logo: assets/opaa-mark-hell.svg
  favicon: assets/opaa-icon.svg
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Dunkles Farbschema
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Helles Farbschema
extra:
  homepage: https://opaa.io/
extra_css:
  - assets/opaa.css
plugins:
  - search:
      lang: de
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn
# Reading order instead of alphabetical folder order; a new page needs an entry here, the strict
# build fails on pages missing from the navigation.
